<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Aplica el tema guardado antes del primer pintado (sin parpadeo). -->
<script>try{var s=localStorage.getItem("b2quiz_theme");if(s==="dark"||s==="paper")document.documentElement.setAttribute("data-theme",s);}catch(e){}</script>
<title>B2 Beruf — Test de Lesen, Hören y Schreiben</title>
<!-- Firebase SDKs compat con tolerancia offline -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  /* ==========================================================================
     B2 Beruf — mundo «taller nocturno» (rama UXUI, en pruebas).
     Carbón con una luz cenital, piezas con relieve —filo claro arriba, sombra
     fuera— y azul de acento con halo. Todo el material sale de tokens: cambiar
     la paleta o el tema es tocar este bloque, no los componentes.
     [data-theme="paper"] = la misma lengua en claro, sobre gris papel.
     Contrastes medidos en design_audit.js; los que declaro aquí están
     comprobados sobre --panel.
     ========================================================================== */
  /* ==========================================================================
     B2 Beruf — mundo «Lesesaal». Hoja impresa sobre la mesa de una biblioteca:
     papel marfil, tinta casi negra, banda verde botella y un solo acento, latón.
     Material de imprenta: radios 0, cero sombras, filetes de 1 px. Todo el
     material sale de tokens; cambiar el mundo es tocar este bloque, no los
     componentes.
     Contrastes medidos en design_audit.js sobre --panel y sobre --bg.
     ========================================================================== */
  :root{
    /* --- Superficies: de la mesa a la hoja --- */
    --bg:#E4DDC9;                 /* mesa: papel tostado */
    --bg-luz:#F3EFE2;             /* luz que cae desde arriba */
    --panel:#FCFAF3;              /* hoja principal */
    --panel2:#FFFFFF;             /* hoja levantada (menús, pies) */
    --panel3:#EDE8D9;             /* hueco (carriles, chips) */
    --sheet:#FFFDF6;              /* hoja de escritura */
    --sunken:#E7E1D0;
    --line:rgba(26,24,20,.16);    /* filete */
    --line-2:rgba(26,24,20,.30);  /* filete marcado */

    /* --- Tinta --- */
    --txt:#1A1814;                /* 15.9:1 sobre --panel */
    --dim:#4E4A40;                /* 7.8:1 */
    --dim-2:#625E52;              /* 5.8:1 */

    /* --- Latón: el único color saturado. Sobre --acc-fill-1 el blanco no llega
       a 4.5:1, así que la tinta de encima es oscura (5.1-6.0:1). --- */
    --acc:#8A6A1E;
    --acc-hi:#A8842C;
    --acc-deep:#6B5216;
    --acc-fill-1:#A8842C;
    --acc-fill-2:#B8933A;
    --acc-2:#7A5C16;
    --acc-ink:#6B5216;            /* 6.2:1 sobre --panel */
    --on-acc:#1A1814;
    --ring:rgba(138,106,30,.55);
    --glow:rgba(138,106,30,.20);

    /* --- Semánticos --- */
    --ok:#1F6B4A; --ok-ink:#175440;
    --bad:#9E3B24; --bad-ink:#7E2E1A;
    --warn:#8A6414; --warn-ink:#6E5110;
    --violet-ink:#5E4382;

    /* --- Tintas de estado (translúcidas sobre la hoja) --- */
    --tint-ok:rgba(31,107,74,.12);
    --tint-bad:rgba(158,59,36,.10);
    --tint-warn:rgba(138,100,20,.10);
    --tint-acc:rgba(138,106,30,.12);
    --tint-violet:rgba(94,67,130,.10);
    --tint-neutral:rgba(26,24,20,.05);
    --chip:#FFFDF6;
    --chip-hover:#F0EBDD;
    --scrim:rgba(24,21,16,.55);
    --selection:rgba(168,132,44,.30);
    --scroll:rgba(26,24,20,.24);

    /* --- Banda de cabecera: el verde botella de la encuadernación. Es la única
       superficie oscura del mundo; los controles de dentro se pintan con estos
       tres tokens, no con los del papel. --- */
    --band:#14382B;
    --band-deep:#0E2A20;
    --on-band:#EFE6CC;

    /* --- Rellenos que llevan texto encima --- */
    --bien-fill:#1F6B4A; --bien-ink:#FFFFFF;
    --mal-fill:#9E3B24;  --mal-ink:#FFFFFF;
    --acc-grad:linear-gradient(180deg,#B8933A,#A8842C);
    --exito-grad:linear-gradient(180deg,#25795A,#1F6B4A);
    --peligro-grad:linear-gradient(180deg,#AC4630,#9E3B24);
    --line-ok:rgba(31,107,74,.32);
    --line-bad:rgba(158,59,36,.32);
    --line-warn:rgba(138,100,20,.32);
    --line-acc:rgba(138,106,30,.32);

    /* --- Espaciado: grid de 8pt (4px solo para ajustes finos) --- */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

    /* --- Radios: cero. Es papel impreso, no una app de tarjetas. --- */
    --radius:0;
    --r-1:0; --r-2:0; --r-3:0; --r-4:0; --r-pill:0;

    /* --- Filetes --- */
    --b-sutil:1px; --b-std:1px; --b-fuerte:1.5px;

    /* --- Tipografía: DIN para rótulos y cifras, humanista para el texto y
       Palatino para lo que se lee como examen. --- */
    --font-d:"Bahnschrift","DIN Alternate","DIN Condensed","Arial Narrow","Liberation Sans Narrow",sans-serif;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-read:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --font-mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
    --fs-micro:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:15px; --fs-lead:17px;
    --fs-h3:20px; --fs-h2:22px; --fs-h1:17px;

    /* --- Relieve: ninguna sombra. La pieza se separa con filete, no con altura. --- */
    --sh-1:none; --sh-2:none; --sh-3:none;
    --bisel:none;
    --hundido:none;
    --borde-relleno:rgba(26,24,20,.28);
    --bisel-relleno:none;
    --halo:none;
    --lit:none;

    /* --- Movimiento: corto y sobrio --- */
    --dur-1:120ms; --dur-2:180ms; --dur-3:280ms;
    --ease:cubic-bezier(.2,.7,.3,1);
    --spring:cubic-bezier(.16,1,.3,1);

    /* --- Estructura --- */
    --header-h:57px; --nav-w:216px; --read-w:76ch;
    --desk-ref:660px; --desk-work:800px;
  }

  /* --- Tema noche: el mismo mundo con la luz apagada. Papel a cartón verdoso,
     banda más profunda y el latón como única fuente de color. La noche no cambia
     el material (ni radios ni sombras): solo la luz. --- */
  [data-theme="dark"]{
    --bg:#12160F;
    --bg-luz:#1A2016;
    --panel:#191E15;
    --panel2:#20261B;
    --panel3:#151A11;
    --sheet:#1C2217;
    --sunken:#0E120C;
    --line:rgba(239,231,210,.16);
    --line-2:rgba(239,231,210,.30);

    --txt:#EFE7D2;                /* 13.1:1 sobre --panel */
    --dim:#C2B9A1;                /* 8.4:1 */
    --dim-2:#A79E86;              /* 5.9:1 */

    --acc:#C9A44A;
    --acc-hi:#DDBB63;
    --acc-deep:#A8863A;
    --acc-fill-1:#C9A44A;
    --acc-fill-2:#DDBB63;
    --acc-2:#A8863A;
    --acc-ink:#E2C88A;            /* 9.1:1 sobre --panel */
    --on-acc:#14170F;
    --ring:rgba(201,164,74,.55);
    --glow:rgba(201,164,74,.18);

    --ok:#57C08D; --ok-ink:#8FDCB4;
    --bad:#E0705C; --bad-ink:#F2A99E;
    --warn:#D9A94E; --warn-ink:#EFCE8C;
    --violet-ink:#B9A0E6;

    --tint-ok:rgba(87,192,141,.14);
    --tint-bad:rgba(224,112,92,.14);
    --tint-warn:rgba(217,169,78,.14);
    --tint-acc:rgba(201,164,74,.14);
    --tint-violet:rgba(185,160,230,.14);
    --tint-neutral:rgba(239,231,210,.05);
    --chip:#20261B;
    --chip-hover:#262D20;
    --scrim:rgba(6,8,5,.70);
    --selection:rgba(201,164,74,.32);
    --scroll:rgba(239,231,210,.22);

    --bien-fill:#1E6B49; --bien-ink:#FFFFFF;
    --mal-fill:#8E3428;  --mal-ink:#FFFFFF;
    --acc-grad:linear-gradient(180deg,#DDBB63,#C9A44A);
    --exito-grad:linear-gradient(180deg,#2A8259,#1E6B49);
    --peligro-grad:linear-gradient(180deg,#A04A38,#8E3428);
    --line-ok:rgba(87,192,141,.32);
    --line-bad:rgba(224,112,92,.32);
    --line-warn:rgba(217,169,78,.32);
    --line-acc:rgba(201,164,74,.32);

    --band:#152B1E;
    --band-deep:#0B1D13;
    --on-band:#EFE6CC;

    --borde-relleno:rgba(239,231,210,.24);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;font-size:var(--fs-base);line-height:1.6;font-family:var(--font-ui);
       background:var(--bg);
       color:var(--txt);
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
       transition:background var(--dur-3) var(--ease),color var(--dur-3) var(--ease)}
  /* Luz cenital: un solo degradado, fijo, para que las piezas parezcan estar sobre
     una mesa con foco. No es una textura y no lleva patrón. */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
       background:radial-gradient(1100px 520px at 50% -12%,var(--bg-luz),transparent 70%)}
  .layout{position:relative;z-index:1}
  ::selection{background:var(--selection);color:var(--txt)}

  /* Foco visible en TODO lo interactivo. */
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:0}

  /* Avisos de estado solo para lectores de pantalla: sin ruido visual. */
  .sr-only{position:absolute;width:1px;height:1px;margin:0;padding:0;overflow:hidden;
           clip-path:inset(50%);white-space:nowrap;border:0}
  /* Enlace de salto: fuera de pantalla hasta que se tabula. Evita atravesar la
     cabecera y las diez secciones del índice antes de llegar a la primera pregunta.
     Elevación declarada una sola vez (sombra, sin borde), como el resto de hojas. */
  .skip-link{position:absolute;left:var(--sp-3);top:-120px;z-index:60;
             background:var(--panel);color:var(--txt);
             border-radius:var(--r-2);padding:var(--sp-2) var(--sp-3);font-weight:640;
             box-shadow:var(--sh-2);transition:top var(--dur-2) var(--ease)}
  .skip-link:focus{top:var(--sp-3)}

  /* Barra de desplazamiento con la tinta del papel. */
  *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:var(--r-pill);
                            border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--line-2);background-clip:content-box}

  /* Cabecera: pieza levantada sobre la mesa, con filo claro arriba. Los controles
     van en talla pequeña (32px) para que la barra quede tensa, como el prototipo. */
  header{position:sticky;top:0;z-index:20;
         min-height:var(--header-h);
         background:var(--band);
         color:var(--on-band);
         border-bottom:2px solid var(--txt);
         padding:var(--sp-3) var(--sp-5);
         display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
         /* La banda es la única superficie oscura: redefino aquí los tokens de
            tinta y filete para que los controles de dentro se pinten solos, sin
            tocar una regla por cada uno. */
         --txt:var(--on-band);
         --dim:rgba(239,230,204,.82);
         --dim-2:rgba(239,230,204,.68);
         --line:rgba(239,230,204,.26);
         --line-2:rgba(239,230,204,.44);
         --panel:var(--band-deep);
         --panel2:var(--band-deep);
         --panel3:rgba(0,0,0,.22);
         --sunken:rgba(0,0,0,.22);
         --chip:rgba(239,230,204,.14);
         --tint-neutral:rgba(239,230,204,.14);
         transition:background var(--dur-3) var(--ease)}
  header .btn{min-height:32px;font-size:var(--fs-sm)}
  /* Botón de la banda: filete claro y, al pasar, se invierte. Nada de relleno
     translúcido: sobre verde el tinte se ensucia. */
  header .btn.ghost{border:var(--b-std) solid var(--line-2);border-radius:0;
                    color:var(--on-band);font-family:var(--font-d);
                    font-stretch:87.5%;letter-spacing:.09em;text-transform:uppercase;
                    font-size:var(--fs-xs)}
  header .btn.ghost:hover{background:var(--on-band);color:var(--band);
                          border-color:var(--on-band);filter:none}
  /* El conmutador de tema: mando claro sobre carril hundido. */
  /* El conmutador es un cuadrado más de la banda, con el icono del modo en el que
     estás. Sin pista, sin mando y sin rótulo: la palabra queda en el título. */
  header .switch-tema{width:36px;height:36px;padding:0;justify-content:center;color:var(--on-band);
    border:1.5px solid var(--line-2);border-radius:0}
  header .switch-tema:hover{background:var(--on-band);color:var(--band);border-color:var(--on-band)}
  header .switch-tema .pista-tema{width:auto;height:auto;background:none;border:0;
    box-shadow:none;display:grid;place-items:center}
  header .switch-tema .mando-tema{position:static;width:auto;height:auto;background:none;
    box-shadow:none;color:inherit;transform:none}
  header .switch-tema[aria-checked="true"] .pista-tema{background:none;border:0}
  header .switch-tema[aria-checked="true"] .mando-tema{transform:none;color:inherit}
  header .switch-tema .switch-tema-texto{display:none}
  header .switch-tema .mando-tema{font-size:17px;line-height:1}
  header .switch-tema .mando-tema svg{width:17px;height:17px;display:block}
  #btn-ai-config{font-size:16px;line-height:1}
  /* El recuento de dudas se marca con filete de latón, no con tinta oscura:
     sobre el verde, el ámbar del papel desaparecía. */
  header .em-warn{color:var(--on-band);font-weight:700;
    border-bottom:2px solid var(--acc-hi)}
  header h1{font-family:var(--font-d);font-stretch:87.5%;font-size:17px;margin:0;
            font-weight:600;letter-spacing:.07em;text-transform:uppercase;
            white-space:nowrap;display:flex;align-items:center;gap:var(--sp-2)}
  /* Monograma «B2»: la casilla invertida de la banda */
  .monogram{display:inline-flex;align-items:center;justify-content:center;
            background:var(--txt);color:var(--panel);font-family:var(--font-d);
            font-stretch:75%;font-weight:700;font-size:16px;letter-spacing:.02em;
            padding:0 var(--sp-2);height:26px;line-height:1;border-radius:0;flex:0 0 auto}
  /* Filete de progreso: la luz que recorre el borde inferior de la cabecera */
  .progress-rule{position:absolute;left:0;right:0;bottom:-1px;height:2px;
                 overflow:hidden;pointer-events:none}
  .progress-rule span{display:block;height:100%;width:0;background:var(--acc-grad);
                 transition:width var(--dur-3) var(--spring)}
  header .spacer{flex:1}
  .stat{font-size:var(--fs-sm);color:var(--dim);font-variant-numeric:tabular-nums}
  .stat b{color:var(--txt);font-weight:640}

  .layout{display:flex;align-items:flex-start;gap:0}
  /* Cabecera del índice: filete de tinta abajo, rótulo en DIN y el recuento. */
  nav .nav-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);
                padding:var(--sp-3) var(--sp-3);border-bottom:1.5px solid var(--txt);
                position:sticky;top:0;background:var(--bg);z-index:2}
  nav .nav-head .lbl{color:var(--txt);font-size:var(--fs-micro);letter-spacing:.14em}
  nav .nav-head b{font-family:var(--font-d);font-stretch:87.5%;font-size:var(--fs-xs);
                  font-weight:600;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
  nav{width:var(--nav-w);flex:0 0 var(--nav-w);
      border-right:var(--b-std) solid var(--line-2);
      background:var(--bg);
      height:calc(100vh - var(--header-h));
      overflow-y:auto;position:sticky;top:var(--header-h);
      padding:0 0 var(--sp-5)}
  /* Cabecera de familia: plegable. Lleva el recuento de entradas y una punta que
     gira. Al plegarla desaparecen sus secciones enteras, no solo los ejercicios. */
  nav .nav-group{display:flex;align-items:center;gap:var(--sp-2);width:100%;
           min-height:28px;padding:var(--sp-5) var(--sp-3) var(--sp-2);
           font-family:var(--font-d);font-stretch:87.5%;font-size:var(--fs-micro);
           font-weight:600;letter-spacing:.16em;text-transform:uppercase;
           color:var(--acc-ink);background:var(--bg);cursor:pointer;
           user-select:none;border-top:1px solid var(--line-2);
           transition:color var(--dur-1) var(--ease)}
  nav .nav-head + .nav-group{border-top:0}
  nav .nav-group::before{content:"";width:6px;height:6px;flex:0 0 6px;
           border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
           transform:rotate(-45deg);transition:transform var(--dur-2) var(--ease)}
  nav .nav-group.open::before{transform:rotate(45deg)}
  nav .nav-group:hover{color:var(--txt)}
  nav .nav-group:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  nav .nav-group .fam-count{margin-left:auto;color:var(--dim-2);font-weight:700;
           letter-spacing:.04em;font-variant-numeric:tabular-nums}
  nav .sec{font-family:var(--font-d);font-stretch:87.5%;
           font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;
           color:var(--dim);margin:0;padding:var(--sp-3) var(--sp-3) var(--sp-2) 36px;
           border-bottom:1px solid var(--line);
           font-weight:600;display:flex;align-items:center;
           justify-content:space-between;gap:var(--sp-2);
           position:relative}
  /* El número lo pone el JS desde el orden de datos, no un contador CSS: así no
     se renumera la lista al plegar una familia. */
  nav .sec-n{position:absolute;left:var(--sp-3);top:50%;transform:translateY(-50%);
           color:var(--acc-ink);font-weight:700;font-variant-numeric:tabular-nums}
  /* Cabecera plegable: al menú le sobraban 140 entradas. Un clic abre el grupo
     y cierra el anterior; el contador dice cuántas entradas esconde. */
  nav .sec-toggle{display:flex;align-items:center;gap:var(--sp-2);flex:1 1 auto;
           min-width:0;min-height:28px;cursor:pointer;user-select:none;
           transition:color var(--dur-1) var(--ease)}
  nav .sec-toggle::before{content:"";width:6px;height:6px;flex:0 0 6px;
           border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
           transform:rotate(-45deg);transition:transform var(--dur-2) var(--ease)}
  nav .sec.open .sec-toggle::before{transform:rotate(45deg)}
  nav .sec-toggle:hover{color:var(--txt)}
  nav .sec-toggle:active{transform:scale(.985)}
  nav .sec-toggle:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  nav .sec-count{font-variant-numeric:tabular-nums;color:var(--dim-2);font-weight:700;
           margin-left:auto}
  nav .sec.open .sec-count{color:var(--dim)}
  /* El display:flex de los botones gana al [hidden] del navegador: se apaga a mano. */
  nav button[hidden]{display:none}
  nav .sec[hidden]{display:none}
  nav button.sec-reset{display:inline-flex;align-items:center;width:auto;min-height:28px;
           padding:0;border:0;border-bottom:1px solid var(--line-2);
           border-radius:0;font-size:var(--fs-micro);font-weight:700;letter-spacing:.02em;
           color:var(--dim);text-transform:none;line-height:1.4;background:none;
           transition:color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
  nav button.sec-reset:hover{background:none;color:var(--txt);border-bottom-color:var(--acc)}
  /* Fila de entrada: filete abajo y nada de tarjeta. La encendida se invierte. */
  nav button{display:flex;width:100%;align-items:center;justify-content:space-between;
             gap:var(--sp-2);text-align:left;background:none;border:0;
             border-bottom:1px solid var(--line);color:var(--dim);
             min-height:38px;padding:var(--sp-2) var(--sp-3) var(--sp-2) 36px;
             border-radius:0;cursor:pointer;font-family:inherit;
             font-size:var(--fs-sm);line-height:1.35;position:relative;
             transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease)}
  nav button:hover{background:var(--tint-neutral);color:var(--txt)}
  nav button:active{transform:scale(.985)}
  /* Encendida: se invierte entera. Una sola señal, como en una lista impresa. */
  nav button.active{background:var(--band);color:var(--on-band);font-weight:640;
             box-shadow:none;border-bottom-color:var(--band)}
  nav button .pill{font-family:var(--font-d);font-size:var(--fs-micro);font-weight:400;
             letter-spacing:.04em;color:var(--dim-2);
             font-variant-numeric:tabular-nums;white-space:nowrap}
  nav button.active .pill{color:var(--on-band)}

  /* La hoja: papel blanco sobre la mesa, con filete de tinta arriba. */
  main{flex:1;min-width:0;margin:0 auto;padding:var(--sp-6) var(--sp-7) var(--sp-8);
       max-width:1100px;background:var(--sheet);border-top:2px solid var(--txt);
       min-height:calc(100vh - var(--header-h))}
  /* Masthead editorial: título display + filete + línea de datos en versalitas */
  /* Titular de sección: sans y contenido, como en el prototipo. La serif se queda
     para lo que se cita y lo que se escribe, no para los rótulos. */
  /* Titular de la hoja: DIN condensada en versalitas, como el encabezado de un
     impreso oficial. */
  h2{font-family:var(--font-d);font-stretch:75%;font-size:var(--fs-h2);line-height:1;
     margin:0;font-weight:700;letter-spacing:.005em;text-transform:uppercase;
     text-wrap:balance}
  h2 + .sub{color:var(--dim-2);font-size:var(--fs-xs);font-weight:640;
     margin:var(--sp-4) 0 var(--sp-3);padding-top:var(--sp-3);
     border-top:1px solid var(--line);
     letter-spacing:.09em;text-transform:uppercase;
     font-variant-numeric:tabular-nums}
  h2 + .sub b{color:var(--txt);font-weight:700}
  /* Tira del bloque: una casilla por ítem, con su número. La llena está
     respondida; la vacía, no. Duplica el recuento de la línea de datos, así que
     se esconde a los lectores de pantalla. */
  .strip{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 var(--sp-5)}
  .strip-c{display:inline-flex;align-items:center;justify-content:center;
     min-width:30px;height:30px;padding:0 var(--sp-1);
     font-family:var(--font-d);font-stretch:87.5%;font-size:var(--fs-xs);font-weight:700;
     letter-spacing:.04em;color:var(--dim-2);
     border:1px solid var(--line);background:none;
     font-variant-numeric:tabular-nums}
  .strip-c.on{background:var(--txt);border-color:var(--txt);color:var(--bg)}

  /* Pieza plana: filete arriba y nada más. En este mundo no hay tarjetas. */
  .panel{background:none;border:0;border-top:1px solid var(--line);
         border-radius:0;padding:var(--sp-4) 0;
         margin-bottom:var(--sp-5);box-shadow:none}
  /* Rótulo de sección: versalitas sobre filete, como el encabezado de un impreso. */
  .panel h3{display:block;margin:0 0 var(--sp-3);font-family:var(--font-d);
            font-stretch:87.5%;font-size:var(--fs-micro);letter-spacing:.12em;
            text-transform:uppercase;color:var(--dim);font-weight:600;
            border:0;border-radius:0;padding:0 0 var(--sp-2)}
  /* La instrucción del examen es texto con rótulo y regla, NO una pieza: así no hay
     dos cajas seguidas antes de llegar al material (el aviso ya es una pieza). */
  .panel.intro{background:none;border:0;border-top:var(--b-std) solid var(--line);
               border-radius:0;box-shadow:none;
               padding:var(--sp-3) 0 0;margin-bottom:var(--sp-5)}
  /* La instrucción se lee como el enunciado de un examen: Palatino, no interfaz. */
  .intro-text{font-family:var(--font-read);font-size:19px;line-height:1.55;
              color:var(--txt);max-width:var(--read-w)}

  details.passage summary{cursor:pointer;font-weight:640;font-size:var(--fs-base);color:var(--acc-ink);
                          user-select:none;list-style:none;display:flex;align-items:center;
                          gap:var(--sp-2);min-height:32px;
                          transition:color var(--dur-1) var(--ease)}
  details.passage summary::-webkit-details-marker{display:none}
  details.passage summary::before{content:"";width:7px;height:7px;flex:0 0 7px;
                          border-right:2px solid currentColor;border-bottom:2px solid currentColor;
                          transform:rotate(-45deg);transition:transform var(--dur-2) var(--spring)}
  details.passage[open] summary::before{transform:rotate(45deg)}
  details.passage summary:hover{color:var(--acc)}
  details.passage[open] summary{margin-bottom:var(--sp-3);padding-bottom:var(--sp-2);
                                 border-bottom:1px solid var(--line)}
  .passage-body{white-space:pre-wrap;font-family:var(--font-ui);font-size:var(--fs-base);line-height:1.75;
                color:var(--txt);max-width:var(--read-w);max-height:62vh;overflow-y:auto;
                padding-right:var(--sp-2)}

  /* Anuncios: recuadro de papel, sin barras de color de 3px. */
  /* Anuncios como columna de clasificados: filas con filete, no cajas en cajas.
     El estado se lee en la letra: azul = ya asignada por ti, ámbar = libre.
     Nunca marca lo que la clave da por correcto: eso sería enseñar la solución.
     El ✓ repite el estado sin depender del color. */
  .ad{border:0;border-top:1px solid var(--line);padding:var(--sp-2) var(--sp-2);margin:0;
      border-radius:0;background:transparent;font-family:var(--font-ui);
      transition:background var(--dur-2) var(--ease)}
  .ad:first-child{border-top:0}
  .ad:hover{background:var(--tint-neutral)}
  .ad .k{font-weight:700;margin-right:var(--sp-2);font-variant-numeric:tabular-nums;
         font-family:var(--font-ui);font-size:var(--fs-lead)}
  .ad .t{font-weight:640}
  .ad .body{color:var(--dim);font-size:var(--fs-base);margin-top:var(--sp-1);line-height:1.5;
            max-width:var(--read-w)}
  .ad.used .k{color:var(--acc-ink)}
  .ad.unused .k{color:var(--warn-ink)}
  .ad.used .t::after{content:" ✓";color:var(--ok-ink);font-weight:700}
  /* Peek: al pasar por encima o enfocar una letra, su anuncio se enciende. El
     fondo solo no basta (ya hay hover propio), así que la letra se rellena. */
  .ad.peek{background:var(--tint-acc)}
  .ad.peek .k{background:var(--acc);color:var(--on-acc);border-radius:var(--r-1);
              padding:0 var(--sp-1);text-decoration:none}

  /* Banco de palabras (Sprachbausteine Teil 1). Las opciones son UNA palabra, así
     que la tarjeta alta de los anuncios no tiene sentido: en rejilla caben las diez
     de un vistazo y los huecos no se van media pantalla más abajo. Se declara desde
     el dato con `optionsLayout: "bank"`, no por heurística de longitud. */
  /* El banco de palabras de los ejercicios de huecos va dentro del texto de lectura:
     una sección con su filete, no una tarjeta dentro de otra tarjeta. Y recupera el
     espaciado normal, porque el cuerpo de lectura conserva los saltos de línea. */
  .passage-body .banco{background:none;border:0;box-shadow:none;padding:0;
                       margin:var(--sp-5) 0 0;white-space:normal}
  .passage-body .banco > summary{padding-top:var(--sp-3);margin-bottom:var(--sp-2);
                       border-top:var(--b-std) solid var(--line-2)}
  .passage-body .banco .bank .ad{white-space:normal}

  /* Banco de palabras: son diez palabras sueltas que se ELIGEN, así que van en rejilla
     de dos columnas (cinco filas) con filetes, no en una lista de diez filas que
     empujaría la primera pregunta media pantalla hacia abajo. */
  .bank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--sp-5)}
  .bank .ad{border:0;border-top:1px solid var(--line);border-radius:0;
            padding:var(--sp-2) 0;display:flex;align-items:baseline;gap:var(--sp-2);
            background:none}
  .bank .ad:nth-child(-n+2){border-top:0}
  .bank .ad .body{margin-top:0;color:var(--txt);max-width:none}
  .bank .ad.used .body::after{content:" ✓";color:var(--ok-ink);font-weight:700}

  /* Hueco de los Sprachbausteine: raya para escribir, con el número en pequeño y en
     color de acento. Se pinta desde `conHuecos()`, que traduce el «46 ( )» del dato. */
  .gap{white-space:nowrap}
  .gap-n{font-family:var(--font-ui);font-size:var(--fs-xs);font-weight:700;color:var(--acc-ink);
         vertical-align:super;margin-right:var(--sp-1)}
  .gap-line{display:inline-block;width:56px;border-bottom:2px solid var(--acc);vertical-align:-4px}

  /* Hoja de examen continua: las preguntas NO son tarjetas apiladas, son filas
     de una sola hoja, con filete de margen rojo como en el papel del examen. */
  /* La hoja de preguntas: la pieza grande de la mesa, con su regla de margen. */
  /* Columna de preguntas: sin caja. El filete de la izquierda es el margen de
     corrección de una hoja de examen, no un adorno. */
  .q-sheet{position:relative;background:none;border:0;box-shadow:none;
           border-left:1.5px solid var(--line-2);
           padding:0 0 var(--sp-4) var(--sp-5);
           margin-bottom:var(--sp-4)}
  .q{border-radius:0;background:transparent;
     padding:var(--sp-4) 0;margin:0;box-shadow:none;
     border-top:1px solid var(--line)}
  .q:first-child{border-top:0}
  /* Número del ítem: casilla cuadrada, no pastilla redonda. */
  .q .num{display:inline-flex;align-items:center;justify-content:center;
          min-width:28px;height:28px;background:none;border:1px solid var(--line-2);
          border-radius:0;font-size:var(--fs-xs);font-weight:700;margin-right:var(--sp-3);
          color:var(--txt);font-variant-numeric:tabular-nums;vertical-align:middle;
          box-shadow:none;font-family:var(--font-d);font-stretch:87.5%}
  .q .prompt{font-size:var(--fs-lead);line-height:1.55;font-weight:640;margin-bottom:var(--sp-3);display:inline}
  .opts{display:flex;flex-direction:column;gap:0;margin-top:var(--sp-3)}
  /* La opción es un <button> de verdad: se alcanza con Tab y se recorre con las
     flechas dentro del grupo (role="radio"). Los resets evitan que el navegador
     imponga su fuente, su color y su fondo: aquí manda el papel.
     Y es una FILA con filete, no una caja: la lista se lee como una tabla. */
  .opt{display:flex;gap:var(--sp-3);align-items:flex-start;width:100%;min-height:44px;
       border:0;border-top:1px solid var(--line);
       border-radius:0;padding:var(--sp-3) var(--sp-2) var(--sp-3) var(--sp-3);cursor:pointer;
       text-align:left;font-family:inherit;font-size:var(--fs-base);color:var(--txt);
       background:none;position:relative;
       transition:background var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease),
                  transform var(--dur-1) var(--spring)}
  /* Foco dentro de la fila: por fuera se dibujaba encima del relleno de estado y
     parecía un segundo borde.
     */
  .opt:focus-visible{outline:2px solid var(--acc);outline-offset:-4px}
  .opt.correct:focus-visible{outline-color:var(--ok)}
  .opt.wrong:focus-visible{outline-color:var(--bad)}
  .letters button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .opt:hover{border-top-color:var(--line-2);background:var(--tint-neutral)}
  .opt:active{transform:scale(.995)}
  /* Sin clave no hay ✓ ni ✗: la elección se marca con el acento, para que el
     usuario vea qué ha pulsado sin insinuar que es la respuesta correcta. */
  .opt.chosen{border-top-color:var(--acc);background:var(--tint-acc);box-shadow:inset 3px 0 0 var(--acc)}
  .opt.chosen .key{color:var(--acc-ink)}
  .opt .key{font-weight:700;min-width:20px;color:var(--acc-ink);font-variant-numeric:tabular-nums}
  .opt.correct{border-top-color:var(--ok);background:var(--tint-ok);box-shadow:inset 3px 0 0 var(--ok)}
  .opt.wrong{border-top-color:var(--bad);background:var(--tint-bad);box-shadow:inset 3px 0 0 var(--bad)}
  .opt.correct .key{color:var(--ok)}
  .opt.wrong .key{color:var(--bad)}
  /* El estado no depende solo del color: marca textual a la derecha. */
  /* La marca se separa del borde: a 0 quedaba pegada al filo del relleno. */.opt.correct::after,.opt.wrong::after{position:absolute;right:var(--sp-2);top:50%;
       transform:translateY(-50%);font-weight:700;font-size:var(--fs-base)}
  .opt.correct::after{content:"✓";color:var(--ok)}
  .opt.wrong::after{content:"✗";color:var(--bad)}

  /* Las letras son la interacción firma: cada una es una pieza que se pulsa, con
     filo claro arriba, sombra fuera y halo al pasar. Área de toque 44×44. */
  .letters{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-3)}
  /* Casilla del banco de letras: cuadrada, con filete de tinta y la letra en DIN.
     La elegida se invierte; la fallada lleva tachado, no solo color. */
  .letters button{width:44px;height:44px;border-radius:0;border:1.5px solid var(--txt);
                  background:none;color:var(--txt);font-weight:600;cursor:pointer;
                  font-size:var(--fs-lead);font-family:var(--font-d);
                  font-stretch:87.5%;
                  transition:color var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease),
                             background var(--dur-2) var(--ease)}
  .letters button:hover{background:var(--tint-acc)}
  .letters button:active{transform:scale(.94)}
  /* Elección sin clave: se ve cuál está marcada, sin veredicto. */
  .letters button.chosen{background:var(--txt);color:var(--sheet);border-color:var(--txt)}
  /* La x de «ningún consejo encaja»: no es una letra del banco, así que se
     distingue por el filete discontinuo y la tinta apagada. */
  .letters button.letter-none{font-family:var(--font-mono);font-size:var(--fs-base);
                  color:var(--dim-2);border-style:dashed}
  /* Letra ya asignada a otro enunciado: sigue pulsable (puedes reasignarla),
     pero se ve que está cogida. Se distingue por la tinta y el filete discontinuo,
     no bajando la opacidad: el contraste tiene que seguir cumpliendo. */
  .letters button.taken{color:var(--dim-2);background:none;border-style:dashed;
                  border-color:var(--line-2)}
  /* Qué anuncio hay detrás de cada letra, sin depender del tooltip del ratón.
     Una sola línea con puntos suspensivos: si creciera, movería la fila de abajo
     cada vez que pasas por encima. */
  .letters-peek{margin-top:var(--sp-2);min-height:1.3em;font-size:var(--fs-xs);
                color:var(--dim-2);font-family:var(--font-ui);
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:var(--read-w)}
  .letters-peek b{color:var(--txt);font-weight:640}
  /* Corregida: relleno sólido de su color y marca textual encima, para no
     depender solo del color. */
  .letters button.correct{background:var(--bien-fill);color:var(--bien-ink);
                  border-color:var(--bien-fill)}
  .letters button.wrong{background:none;color:var(--bad);border-color:var(--bad);
                  text-decoration:line-through;text-decoration-thickness:2px}
  .letters button.correct::after{content:"✓";font-size:var(--fs-micro);vertical-align:super}
  /* La casilla fallada ya va tachada: una segunda marca encima la ensuciaba. */

  /* Corrección: el tinte se desvanece hacia abajo en vez de ser un baño plano, así
     no pesa más que el propio veredicto. El estado lo llevan el filo, la marca (✓/✗)
     y la palabra; el color solo acompaña. */
  /* Panel de corrección: papel, no tarjeta de color. El veredicto lo dice la
     palabra y el filete de la izquierda; el tinte se queda en casi nada. */
  .fb{margin-top:var(--sp-4);border-radius:0;padding:var(--sp-3) 0 var(--sp-3) var(--sp-4);
      font-size:var(--fs-base);display:none;
      border:0;border-left:3px solid var(--line-2);background:none}
  .fb.show{display:block;animation:pop var(--dur-2) var(--spring)}
  .fb.good{border-left-color:var(--ok)}
  .fb.bad{border-left-color:var(--bad)}
  .fb .verdict{font-weight:650;margin-bottom:var(--sp-2);display:flex;align-items:center;
               gap:var(--sp-2);flex-wrap:wrap}
  /* La cita: bloque sangrado con filete de margen (el patrón del «inset text»).
     Sin cursiva: ya la separan el filete, el cuerpo serif y las comillas. */
  .fb .quote{font-family:var(--font-read);color:var(--dim);font-size:var(--fs-base);
             border-left:1px solid var(--acc);padding:var(--sp-1) 0 var(--sp-1) var(--sp-3);
             margin:var(--sp-2) 0;max-width:var(--read-w)}

  /* Insignias: sello cuadrado con una marca delante. La marca es la FORMA de la
     confianza (llena, media, hueca), así que el estado no depende solo del color;
     la palabra sigue debajo para quien no distinga formas. */
  .badge{display:inline-flex;align-items:center;gap:var(--sp-1);
         font-family:var(--font-d);font-stretch:87.5%;font-size:var(--fs-micro);
         font-weight:600;letter-spacing:.06em;
         padding:4px var(--sp-2);border-radius:0;
         white-space:nowrap;border:1px solid currentColor;background:none;
         text-transform:none}
  .badge::before{content:"";width:7px;height:7px;flex:0 0 7px;
         border:1px solid currentColor;display:inline-block}
  .badge.hoch{color:var(--ok);border-color:var(--line-ok)}
  .badge.hoch::before{background:currentColor}
  .badge.mittel{color:var(--warn);border-color:var(--line-warn)}
  .badge.mittel::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
  .badge.niedrig{color:var(--bad);border-color:var(--line-bad)}
  .badge.ok{color:var(--acc);border-color:var(--line-acc)}
  .badge.ok::before{background:currentColor}
  .badge.tag{color:var(--dim);border-color:var(--line)}
  .badge.tag::before{display:none}

  .row{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center}
  /* Botón principal: píldora con degradado corto, filo claro y halo azul. Se hunde
     al pulsar (escala 0.975) en vez de cambiar solo de color. */
  .btn{background:var(--acc-grad);color:var(--on-acc);
       border:1px solid var(--borde-relleno);border-radius:0;
       padding:0 var(--sp-5);min-height:40px;cursor:pointer;font-size:var(--fs-base);font-weight:640;
       font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
       box-shadow:var(--sh-2),var(--bisel-relleno),0 8px 20px -6px var(--glow);
       transition:filter var(--dur-1) var(--ease),transform var(--dur-1) var(--spring),
                  box-shadow var(--dur-2) var(--ease),
                  color var(--dur-2) var(--ease)}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:scale(.975);box-shadow:var(--sh-1),var(--bisel)}
  /* Deshabilitado: conserva filo y contraste (3:1) para que se lea que existe. */
  .btn:disabled{cursor:not-allowed;transform:none;filter:none;
       background:var(--sunken);color:var(--dim-2);border-color:var(--line);
       box-shadow:var(--hundido)}
  /* Acción secundaria: texto, sin caja. El estado activo (Mesa de examen, Solo
     dudosas) es el que se levanta como pieza. */
  .btn.ghost{background:none;border:1px solid var(--line-2);border-radius:0;
             color:var(--dim);box-shadow:none;text-transform:none;letter-spacing:0;
             font-family:var(--font-ui);font-size:var(--fs-sm);font-weight:600;padding:0 var(--sp-4);min-height:36px}
  .btn.ghost:hover{background:var(--txt);color:var(--sheet);border-color:var(--txt);filter:none}
  /* Acciones al pie de la hoja: alineadas a la izquierda y separadas entre sí. La
     que borra va última y con aire: no debe quedar al lado de la inocua. */
  .acciones{justify-content:flex-start;gap:var(--sp-5);margin-top:var(--sp-5)}
  /* La acción dentro de una corrección: más pequeña y separada del texto, para que
     no parezca parte de la explicación ni se pegue al bloque de la cita. */
  .fb .btn.ghost.sm{margin-top:var(--sp-3);min-height:32px;padding:0 var(--sp-3);
     border-color:var(--line);color:var(--dim);font-size:var(--fs-xs)}
  .fb .btn.ghost.sm:hover{background:var(--txt);color:var(--sheet);border-color:var(--txt)}
  .btn.danger{background:var(--peligro-grad);color:var(--mal-ink);border-color:var(--borde-relleno);
              box-shadow:var(--sh-2),var(--bisel-relleno),0 6px 16px -4px color-mix(in srgb,var(--bad) 28%,transparent)}
  /* Acción que destruye: en reposo es una caja apagada con tinta roja; al pasar, se llena. */
  .btn.ghost.danger{background:none;color:var(--bad);border-color:var(--line-bad)}
  .btn.ghost.danger:hover{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
  .btn.danger:hover{filter:brightness(1.06)}
  .btn.success{background:var(--exito-grad);color:var(--bien-ink);
               border-color:var(--borde-relleno);
               box-shadow:var(--sh-2),var(--bisel-relleno),0 6px 16px -4px color-mix(in srgb,var(--ok) 28%,transparent)}
  .btn.success:hover{filter:brightness(1.06)}
  .btn.sm{min-height:32px;padding:0 var(--sp-4);font-size:var(--fs-sm)}

  /* Aviso del sistema: filete de margen, no caja. Uno por pantalla y como mucho:
     repetido pierde su fuerza. */
  .note{background:none;border:0;border-left:3px solid var(--warn);
        color:var(--txt);padding:var(--sp-2) 0 var(--sp-2) var(--sp-4);
        border-radius:0;font-size:var(--fs-sm);margin-bottom:var(--sp-4)}
  .empty{color:var(--dim-2);padding:var(--sp-8) 0;text-align:center;font-size:var(--fs-base)}
  code{background:var(--panel3);padding:4px var(--sp-1);border-radius:var(--r-1);
       font-family:var(--font-mono);font-size:var(--fs-xs);border:0}

  /* --- Etiquetas y avisos reutilizables (sustituyen estilos en línea del JS) --- */
  .card-label{font-weight:640;font-size:var(--fs-sm);color:var(--acc-ink);margin-bottom:var(--sp-1)}
  .lp-head{font-weight:700;font-size:var(--fs-base);margin-bottom:var(--sp-2)}
  .micro{font-size:var(--fs-micro);color:var(--dim)}
  /* Los dos avisos del corrector tenían su margen y su color en el atributo
     style; la auditoría solo tolera seis estilos en línea (los conmutadores
     display), así que viven aquí, en la rejilla de 4pt. */
  .micro-cambio{margin:var(--sp-1) 0 0}
  .micro-aviso{margin:var(--sp-1) 0 0;color:var(--warn-ink)}
  .notice-ok{color:var(--ok-ink);margin-bottom:var(--sp-2)}
  .notice-dim{color:var(--dim-2);font-style:italic}
  .status-error{color:var(--bad-ink)}
  .list-tight{margin:var(--sp-2) 0;padding-left:var(--sp-5);line-height:1.6}
  .sec-title{margin:0 0 var(--sp-3);font-size:var(--fs-base);color:var(--bad-ink)}
  .em-ok{color:var(--ok-ink)}
  .em-warn{color:var(--warn-ink)}
  .em-acc{color:var(--acc-ink)}
  .hr-soft{border-top:1px solid var(--line);margin-top:var(--sp-4);padding-top:var(--sp-4)}
  .mono{font-family:var(--font-mono);font-size:var(--fs-xs)}
  .micro-block{display:block;color:var(--dim);line-height:1.45}
  .small{font-size:var(--fs-sm)}
  .mt-2{margin-top:var(--sp-2)}
  .mt-3{margin-top:var(--sp-3)}
  .crit-title{margin:0 0 var(--sp-2);font-size:var(--fs-base);color:var(--txt)}
  .cv-title{margin:0;font-size:var(--fs-base);color:var(--acc-ink)}
  .cv-title.em-ok{color:var(--ok-ink)}
  .sec-head{display:flex;justify-content:space-between;align-items:center;
            margin-bottom:var(--sp-3);flex-wrap:wrap;gap:var(--sp-2)}
  .err-card-head{display:flex;justify-content:space-between;align-items:center;
                 margin-bottom:var(--sp-2);gap:var(--sp-2)}
  .err-card-head-l{display:flex;align-items:center;gap:var(--sp-2)}
  .err-idx{font-weight:700;font-size:var(--fs-sm)}
  .list-tight.sm{font-size:var(--fs-sm);line-height:1.55;padding-left:var(--sp-5);margin:var(--sp-2) 0}
  .list-tight.xs{padding-left:var(--sp-4);margin:var(--sp-1) 0}
  .model-text.ok-edge{background:var(--tint-ok);border-color:var(--line-ok)}
  .em-bad{color:var(--bad-ink)}
  .lp-label{flex:1;cursor:pointer;display:flex;align-items:center;gap:var(--sp-2)}
  .row-inline{display:flex;gap:var(--sp-3);align-items:center;margin-top:var(--sp-2);flex-wrap:wrap}
  .annotated-title{margin:0;font-size:var(--fs-base)}
  .translation{margin-bottom:var(--sp-2)}

  /* Schreiben UI & Editor */
  .schreiben-layout{display:flex;flex-direction:column;gap:var(--sp-5)}
  /* Aviso interno de la tarea: filete de margen, como una nota al pie. */
  .memo-card{background:none;border:0;border-left:3px solid var(--acc);
             padding:var(--sp-2) 0 var(--sp-2) var(--sp-4);
             border-radius:0;margin:var(--sp-4) 0;font-size:var(--fs-base);line-height:1.6}
  .memo-card b{color:var(--acc-ink);font-family:var(--font-d);font-stretch:87.5%;
             letter-spacing:.04em}
  /* La carta recibida es un documento: bloque entre filetes, no caja. */
  .letter-card{background:none;border:0;
               border-top:1px solid var(--line);border-bottom:1px solid var(--line);
               padding:var(--sp-4) 0;
               box-shadow:none;border-radius:0;margin:var(--sp-3) 0;white-space:pre-wrap;
               font-family:var(--font-read);font-size:17px;line-height:1.75;color:var(--txt);
               max-width:var(--read-w)}
  .lp-list{list-style:none;padding:0;margin:var(--sp-3) 0;display:flex;flex-direction:column;gap:0}
  .lp-item{display:flex;align-items:flex-start;gap:var(--sp-3);min-height:44px;background:none;
           padding:var(--sp-3) 0;border-radius:0;font-size:var(--fs-base);
           border:0;border-top:1px solid var(--line);
           transition:background var(--dur-2) var(--ease)}
  .lp-item:hover{background:var(--tint-neutral)}
  .lp-item input[type="checkbox"]{margin-top:4px;cursor:pointer;accent-color:var(--acc);
           width:16px;height:16px;flex:0 0 16px}
  .lp-item .lp-num{min-width:24px;height:24px;flex:0 0 24px;background:none;
           color:var(--acc-ink);border:1px solid var(--line-2);border-radius:0;
           display:flex;align-items:center;justify-content:center;
           font-family:var(--font-d);font-stretch:87.5%;
           font-size:var(--fs-micro);font-weight:700}

  /* El taller de escritura: filete y hoja dentro. Ni tarjeta ni sombra. */
  .editor-card{background:none;border:0;border-top:1px solid var(--line);
               border-radius:0;padding:var(--sp-4) 0;box-shadow:none}
  .editor-toolbar{display:flex;align-items:center;justify-content:space-between;
                  margin-bottom:var(--sp-4);flex-wrap:wrap;gap:var(--sp-3)}
  /* El área de escritura: hoja de examen, no campo de formulario. */
  .editor-textarea{width:100%;min-height:300px;background:var(--sheet);
           border:1px solid var(--line-2);
           border-radius:0;padding:var(--sp-4) var(--sp-5);color:var(--txt);
           font-size:17px;line-height:1.75;font-family:var(--font-read);resize:vertical;
           caret-color:var(--acc);outline:none;box-sizing:border-box;box-shadow:none;
           transition:border-color var(--dur-2) var(--ease)}
  .editor-textarea:focus{border-color:var(--acc);outline:2px solid var(--acc);outline-offset:2px}
  .timer-box{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--dim)}
  .timer-display{font-size:var(--fs-base);font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
  .timer-display.warn{color:var(--bad-ink)}

  /* Evaluación de Schreiben */
  /* Evaluación: sello de examen — marco doble, versalitas, prensado elástico */
  /* Sello de examen: UN solo marco. Antes llevaba borde de 2px más un anillo
     interior de 1px; en claro eso se lee como un rectángulo dibujado dos veces. */
  .eval-banner{padding:var(--sp-3) 0;border-radius:0;font-weight:700;
               font-family:var(--font-d);font-stretch:87.5%;
               font-size:var(--fs-sm);letter-spacing:.10em;text-transform:uppercase;
               display:flex;align-items:center;justify-content:space-between;margin:var(--sp-4) 0;
               flex-wrap:wrap;gap:var(--sp-3);
               border:0;border-top:2px solid currentColor;border-bottom:1px solid var(--line);
               animation:stamp var(--dur-3) var(--spring)}
  /* Sin inclinación: el sello vive DENTRO de una pieza, y un rectángulo girado deja
     ver una franja del fondo por los bordes, que se lee como un segundo marco. El
     golpe de tampón se queda en la escala y el desvanecido. */
  @keyframes stamp{from{transform:scale(1.06);opacity:0}
                   to{transform:scale(1);opacity:1}}
  .eval-banner.pass{color:var(--ok);border-top-color:var(--ok)}
  .eval-banner.fail{color:var(--bad);border-top-color:var(--bad)}
  .crit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
             gap:0 var(--sp-5);margin:var(--sp-4) 0}
  /* Los cuatro criterios de telc: celdas de tabla, con filete arriba y nada más. */
  .crit-box{background:none;border:0;border-top:1px solid var(--line);border-radius:0;
            box-shadow:none;padding:var(--sp-3) 0}
  .crit-box .ch{display:flex;justify-content:space-between;align-items:center;
                margin-bottom:var(--sp-2);font-weight:600;font-size:var(--fs-sm)}
  .crit-box .c-body{font-size:var(--fs-sm);color:var(--dim);line-height:1.55}
  .annotated-card{background:var(--panel);border:var(--b-std) solid var(--line);
            border-radius:var(--r-4);padding:var(--sp-5);margin:var(--sp-4) 0;
            box-shadow:var(--sh-2),var(--bisel)}
  .annotated-head{display:flex;justify-content:space-between;align-items:center;
            margin-bottom:var(--sp-3);flex-wrap:wrap;gap:var(--sp-3)}
  .annotated-text-box{background:var(--sheet);border:var(--b-std) solid var(--line);
            border-radius:var(--r-2);padding:var(--sp-5);box-shadow:var(--sh-1),var(--bisel);
            font-family:var(--font-read);font-size:var(--fs-base);line-height:1.95;white-space:pre-wrap;
            color:var(--txt);word-break:break-word}

  .err-highlight{position:relative;border-radius:var(--r-1);padding:4px var(--sp-1);margin:0;
                 cursor:pointer;display:inline;font-weight:500;
                 transition:background var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
  .err-highlight.err-grammatik{background:var(--tint-bad);border-bottom:2px solid var(--bad-ink);color:var(--bad-ink)}
  .err-highlight.err-grammatik:hover,.err-highlight.err-grammatik.active{background:color-mix(in srgb,var(--bad) 22%,transparent);outline:2px solid var(--tint-bad);outline-offset:1px}
  .err-highlight.err-wortschatz{background:var(--tint-warn);border-bottom:2px solid var(--warn-ink);color:var(--warn-ink)}
  .err-highlight.err-wortschatz:hover,.err-highlight.err-wortschatz.active{background:color-mix(in srgb,var(--warn) 22%,transparent);outline:2px solid var(--tint-warn);outline-offset:1px}
  .err-highlight.err-zeichensetzung{background:var(--tint-acc);border-bottom:2px solid var(--acc-ink);color:var(--acc-ink)}
  .err-highlight.err-zeichensetzung:hover,.err-highlight.err-zeichensetzung.active{background:color-mix(in srgb,var(--acc) 22%,transparent);outline:2px solid var(--tint-acc);outline-offset:1px}
  .err-highlight.err-stil{background:var(--tint-violet);border-bottom:2px solid var(--violet-ink);color:var(--violet-ink)}
  .err-highlight.err-stil:hover,.err-highlight.err-stil.active{background:color-mix(in srgb,var(--violet-ink) 22%,transparent);outline:2px solid var(--tint-violet);outline-offset:1px}

  .err-badge-num{font-size:var(--fs-micro);font-weight:700;vertical-align:super;padding:0 var(--sp-1);
                 border-radius:var(--r-1);margin-left:var(--sp-1);background:var(--panel2);
                 border:var(--b-sutil) solid var(--line-2);opacity:.95}

  /* El popover flota: sombra profunda y filo propio. */
  .err-popover{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
               background:var(--panel2);border:var(--b-std) solid var(--line-2);box-shadow:var(--sh-3),var(--bisel);
               border-radius:var(--r-2);
               padding:var(--sp-3) var(--sp-4);min-width:250px;max-width:340px;z-index:40;display:none;
               font-size:var(--fs-sm);line-height:1.5;pointer-events:auto;text-align:left;
               animation:pop var(--dur-2) var(--spring)}
  .err-popover::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
               border-width:6px;border-style:solid;
               border-color:var(--panel2) transparent transparent transparent}
  .err-highlight:hover .err-popover,.err-highlight.active .err-popover{display:block}
  .err-popover-head{display:flex;justify-content:space-between;align-items:center;
               margin-bottom:var(--sp-2);padding-bottom:var(--sp-1);border-bottom:1px solid var(--line)}
  .err-popover-orig{color:var(--bad-ink);font-size:var(--fs-xs);margin-bottom:var(--sp-1);display:block}
  .err-popover-corr{color:var(--ok-ink);font-weight:640;font-size:var(--fs-sm);margin-bottom:var(--sp-2);display:block}
  .err-popover-rule{color:var(--dim);font-size:var(--fs-xs);display:block;line-height:1.5}

  .err-legend{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;font-size:var(--fs-xs)}
  .legend-chip{display:inline-flex;align-items:center;gap:var(--sp-1);padding:4px var(--sp-2);
               border-radius:var(--r-1);background:var(--tint-neutral);
               border:var(--b-sutil) solid var(--line);
               color:var(--dim)}
  .legend-chip .dot{width:8px;height:8px;border-radius:50%}
  .legend-chip.gram .dot{background:var(--bad-ink)}
  .legend-chip.wort .dot{background:var(--warn-ink)}
  .legend-chip.zeichen .dot{background:var(--acc-ink)}
  .legend-chip.stil .dot{background:var(--violet-ink)}

  /* Pestañas: control segmentado — carril hundido y la activa levantada. */
  /* Pestañas: fila de filetes con la activa invertida. Sin carril ni mando. */
  .tab-pills{display:flex;gap:0;flex-wrap:wrap;margin:var(--sp-3) 0;
             padding:0;border-radius:0;
             background:none;border:0;border-bottom:1px solid var(--line);
             box-shadow:none}
  .tab-pills.flush{margin:0}
  .tab-pill{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
            padding:0 var(--sp-4);min-height:36px;display:inline-flex;align-items:center;
            border-radius:0;font-family:var(--font-d);font-stretch:87.5%;
            font-size:var(--fs-xs);font-weight:600;letter-spacing:.1em;text-transform:uppercase;
            cursor:pointer;
            transition:color var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease)}
  .tab-pill:hover{color:var(--txt)}
  .tab-pill:active{transform:scale(.97)}
  .tab-pill.active{background:none;color:var(--txt);border-color:transparent;
            border-bottom-color:var(--txt);box-shadow:none}

  /* Lista de errores: filas de tabla de la referencia —pieza con filo y, al pasar
     por encima, la fila se levanta—. */
  .err-card{background:var(--panel);border:var(--b-std) solid var(--line);
            border-radius:var(--r-2);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-2);
            box-shadow:var(--sh-1),var(--bisel);cursor:pointer;
            transition:background var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease),
                       transform var(--dur-2) var(--spring)}
  .err-card:hover{transform:none;background:var(--panel2);box-shadow:var(--sh-2),var(--bisel)}
  .err-card.pulse{background:var(--tint-acc);box-shadow:var(--sh-1),var(--bisel),var(--halo)}
  /* El filo de cada tarjeta de error sale del tema (antes el color venía escrito en
     el JavaScript, con los valores del mundo anterior). */
  .err-card.err-grammatik{border-left-color:var(--bad)}
  .err-card.err-wortschatz{border-left-color:var(--warn)}
  .err-card.err-zeichensetzung{border-left-color:var(--acc)}
  .err-card.err-stil{border-left-color:var(--violet-ink)}
  .err-card .orig{color:var(--bad-ink);text-decoration:line-through;margin-bottom:var(--sp-1);font-size:var(--fs-sm)}
  .err-card .corr{color:var(--ok-ink);font-weight:640;margin-bottom:var(--sp-1);font-size:var(--fs-base)}
  .err-card .rule{font-size:var(--fs-sm);color:var(--dim);line-height:1.5}
  /* La carta del cliente: bloque de papel entre dos filetes, no una caja. */
  .model-text{background:none;border:0;
              border-top:1px solid var(--line);border-bottom:1px solid var(--line);
              border-radius:0;box-shadow:none;
              padding:var(--sp-4) 0;font-family:var(--font-read);font-size:17px;
              line-height:1.75;white-space:pre-wrap;color:var(--txt);max-width:var(--read-w)}
  .copy-btn{font-size:var(--fs-xs);padding:0 var(--sp-1);min-height:32px;border-radius:0;
            cursor:pointer;background:none;border:0;border-bottom:1px solid var(--line-2);
            color:var(--dim);font-family:inherit;
            transition:color var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease),
                       transform var(--dur-1) var(--spring)}
  .copy-btn:hover{background:none;color:var(--txt);border-bottom-color:var(--acc)}
  .copy-btn:active{transform:scale(.97)}

  /* Modal de Configuración: hoja sobre velo cálido (sin cristal). */
  .modal-backdrop{position:fixed;inset:0;background:var(--scrim);
                  z-index:100;display:flex;align-items:center;justify-content:center;padding:var(--sp-4)}
  /* Lo que flota de verdad: el modal, con sombra profunda y filo propio. */
  .modal{background:var(--sheet);
         border:0;border-top:3px solid var(--txt);border-radius:0;width:100%;max-width:560px;
         box-shadow:none;overflow:hidden;animation:pop var(--dur-3) var(--spring)}
  @keyframes pop{from{transform:scale(.965);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--line);
              display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
  .modal-head h3{margin:0;font-family:var(--font-d);font-stretch:87.5%;font-size:var(--fs-h3);
              font-weight:600;letter-spacing:.02em}
  .modal-close{background:none;border:1px solid transparent;color:var(--dim-2);font-size:var(--fs-lead);
               cursor:pointer;width:32px;height:32px;border-radius:var(--r-1);
               display:inline-flex;align-items:center;justify-content:center;
               transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                          transform var(--dur-1) var(--spring)}
  .modal-close:hover{color:var(--txt);background:var(--tint-neutral)}
  .modal-close:active{transform:scale(.94)}
  .modal-body{padding:var(--sp-5);max-height:75vh;overflow-y:auto}
  .modal-foot{padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--line);
              display:flex;justify-content:flex-end;gap:var(--sp-3);background:none}
  .ai-status{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
             flex-wrap:wrap;background:none;border:0;border-left:3px solid var(--line-2);
             border-radius:0;padding:var(--sp-2) 0 var(--sp-2) var(--sp-3);margin-bottom:var(--sp-4);
             box-shadow:var(--hundido);
             font-size:var(--fs-xs);color:var(--dim)}
  .form-group{margin-bottom:var(--sp-4)}
  .form-group label{display:block;font-size:var(--fs-sm);font-weight:640;margin-bottom:var(--sp-2);color:var(--txt)}
  .form-group small{display:block;font-size:var(--fs-xs);color:var(--dim);margin-top:var(--sp-1);line-height:1.45}
  /* Campos: hueco hundido. Al enfocar, el borde se enciende y aparece el halo. */
  .input,.select{width:100%;background:var(--sheet);border:1px solid var(--line-2);
                 border-radius:0;padding:0 var(--sp-4);min-height:44px;color:var(--txt);
                 font-size:var(--fs-base);font-family:inherit;outline:none;box-sizing:border-box;
                 caret-color:var(--acc);box-shadow:none;
                 transition:border-color var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
  .input::placeholder{color:var(--dim-2)}
  .input:focus,.select:focus{border-color:var(--acc);outline:2px solid var(--acc);outline-offset:2px}

  /* Idioma ES / RU: dos letras y un filete bajo la elegida. Sin carril y sin
     mando: el subrayado es la señal, como en un índice impreso. */
  .lang-switch{display:inline-flex;align-items:center;gap:var(--sp-4);
               background:none;border:0;padding:0;box-shadow:none}
  .lang-btn{background:transparent;border:0;color:var(--dim);cursor:pointer;
            font-family:var(--font-d);font-stretch:87.5%;font-size:var(--fs-xs);
            font-weight:600;letter-spacing:.14em;text-transform:uppercase;
            padding:0 0 var(--sp-1);border-bottom:2px solid transparent;
            min-height:32px;border-radius:0;
            transition:color var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease);
            display:inline-flex;align-items:center;line-height:1}
  .lang-btn:hover{color:var(--txt)}
  .lang-btn.active{color:var(--txt);font-weight:700;background:none;box-shadow:none;
            border-bottom-color:currentColor}

  /* Perfil Sergio / Diana: una caja con filete y la opción encendida invertida. */
  .user-switch{display:inline-flex;align-items:center;background:none;
               border:1.5px solid var(--line-2);border-radius:0;
               padding:0;gap:0;box-shadow:none}
  .user-btn{background:transparent;border:0;color:var(--dim);cursor:pointer;
            font-family:var(--font-d);font-stretch:87.5%;font-size:var(--fs-xs);
            font-weight:600;letter-spacing:.12em;text-transform:uppercase;
            padding:0 var(--sp-4);min-height:32px;border-radius:0;
            transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease);
            display:inline-flex;align-items:center;line-height:1}
  .user-btn+.user-btn{border-left:1.5px solid var(--line-2)}
  .user-btn:hover{color:var(--txt)}
  .user-btn.active{background:var(--txt);color:var(--panel);font-weight:700;
            box-shadow:none;border:0}

  /* Indicador de sincronización en la nube */
  .cloud-badge{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-micro);color:var(--dim);
               padding:4px var(--sp-2);border-radius:var(--r-pill);
               background:var(--tint-neutral);border:var(--b-sutil) solid var(--line)}
  .cloud-dot{width:8px;height:8px;border-radius:50%;background:var(--dim-2);flex:0 0 8px}
  .cloud-dot.online{background:var(--ok)}
  .cloud-dot.syncing{background:var(--warn);
               animation:pulse-sync 1.2s var(--ease) infinite}
  .cloud-dot.error{background:var(--bad)}
  @keyframes pulse-sync{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}

  /* Tarjeta de redacción comparativa del compañero (Diana / Sergio) */
  .partner-card{background:var(--panel);border:var(--b-std) solid var(--line);
                border-radius:var(--r-4);padding:var(--sp-4) var(--sp-5);
                margin-bottom:var(--sp-4);
                box-shadow:var(--sh-2),var(--bisel)}
  .partner-head{display:flex;justify-content:space-between;align-items:center;
                margin-bottom:var(--sp-3);flex-wrap:wrap;gap:var(--sp-2)}
  .partner-title{font-size:var(--fs-base);font-weight:650;color:var(--txt);display:flex;align-items:center;gap:var(--sp-2)}
  .partner-meta{font-size:var(--fs-xs);color:var(--dim-2);display:flex;align-items:center;gap:var(--sp-2)}
  .partner-body{background:var(--sheet);border:var(--b-std) solid var(--line);
                border-radius:var(--r-2);box-shadow:var(--sh-1),var(--bisel);
                padding:var(--sp-3) var(--sp-4);font-family:var(--font-read);font-size:var(--fs-base);
                line-height:1.7;white-space:pre-wrap;color:var(--txt);min-height:96px;
                max-width:var(--read-w)}
  .partner-empty{color:var(--dim-2);font-style:italic;padding:var(--sp-6) var(--sp-3);text-align:center}

  /* Conmutador de tema (luna/sol) y botón de índice en móvil */
  /* Botón cuadrado de icono: misma caja que las letras del examen. */
  .icon-btn{background:none;
            border:1.5px solid var(--line-2);color:inherit;
            width:36px;min-height:36px;padding:0;border-radius:0;cursor:pointer;
            display:inline-flex;align-items:center;justify-content:center;
            box-shadow:none;
            transition:color var(--dur-2) var(--ease),background var(--dur-2) var(--ease),
                       border-color var(--dur-2) var(--ease)}
  header .icon-btn:hover{background:var(--on-band);color:var(--band);border-color:var(--on-band)}
  .icon-btn:hover{color:var(--txt);border-color:var(--txt)}
  .icon-btn:active{transform:scale(.94)}
  /* Interruptor de tema: pista con el mando redondo y el icono DENTRO del mando.
     El mando enseña el estado en el que estás (luna en oscuro, sol en claro) y la
     pista se enciende con el acento cuando el modo oscuro está activo. */
  .switch-tema{display:inline-flex;align-items:center;gap:var(--sp-2);border:0;background:none;padding:0;cursor:pointer}
  .switch-tema .switch-tema-texto{font-size:var(--fs-sm);font-weight:640;color:var(--dim);white-space:nowrap}
  .switch-tema .pista-tema{position:relative;width:52px;height:30px;border-radius:var(--r-pill);
    background:var(--sunken);border:var(--b-std) solid var(--line);box-shadow:var(--hundido);
    transition:background var(--dur-3) var(--ease),border-color var(--dur-3) var(--ease),
               box-shadow var(--dur-3) var(--ease)}
  .switch-tema .mando-tema{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--txt);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    box-shadow:var(--sh-1),var(--bisel);
    transition:transform var(--dur-3) var(--spring),color var(--dur-2) var(--ease)}
  .switch-tema .mando-tema svg{width:13px;height:13px;display:block}
  .switch-tema[aria-checked="true"] .pista-tema{background:var(--acc-grad);border-color:transparent;
    box-shadow:var(--sh-1),var(--bisel-relleno),0 4px 14px -4px var(--glow)}
  .switch-tema[aria-checked="true"] .mando-tema{transform:translateX(22px);color:var(--acc-ink)}
  .switch-tema:active .mando-tema{transform:scale(.94)}
  .switch-tema[aria-checked="true"]:active .mando-tema{transform:translateX(22px) scale(.94)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn svg{width:17px;height:17px;display:block}
  #nav-toggle{display:none;gap:var(--sp-2);width:auto;padding:0 var(--sp-3)}
  #nav-toggle svg{width:16px;height:16px;flex:0 0 16px}
  /* El conmutador de mesa solo existe donde la mesa cabe (≥1280px). */
  #desk-toggle{display:none}

  /* ---------- Sprechen Teil 2 · Smalltalk: el mazo y la mesa de trabajo ----------
     Estas preguntas no se contestan, se hablan. Por eso no llevan clave, cita ni
     confianza: son un mazo de tarjetas. La mesa de trabajo es la otra pieza: saca
     una carta al azar para practicarla en voz alta y guarda tus notas de esa carta. */
  .st-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-4)}
  .st-bar .tab-pills{margin-left:auto}
  /* El interruptor de la mesa no es una acción más: es un estado. Se marca con
     una casilla que se rellena, no con un punto encendido. */
  .st-toggle{display:inline-flex;align-items:center;gap:var(--sp-2);min-height:36px;cursor:pointer;
           padding:0 var(--sp-4);border-radius:0;
           border:1px solid var(--line-2);background:none;
           color:var(--txt);font-family:var(--font-d);font-stretch:87.5%;
           font-size:var(--fs-xs);font-weight:600;letter-spacing:.1em;text-transform:uppercase;
           transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                      border-color var(--dur-2) var(--ease)}
  .st-toggle::before{content:"";width:9px;height:9px;flex:0 0 9px;border-radius:0;
           border:1px solid currentColor;background:none;
           transition:background var(--dur-2) var(--ease)}
  .st-toggle:hover{border-color:var(--acc)}
  .st-toggle.on{background:var(--txt);color:var(--sheet);border-color:var(--txt)}
  .st-toggle.on::before{background:currentColor}
  .st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));
           gap:0 var(--sp-5);margin-bottom:var(--sp-6)}
  /* Ficha del mazo: entrada de índice, con filete arriba y nada de caja. */
  .st-card{display:flex;flex-direction:column;gap:var(--sp-2);
           background:none;border:0;border-top:1px solid var(--line);
           border-radius:0;padding:var(--sp-3) 0;
           box-shadow:none}
  .st-card.on-desk{border-top:2px solid var(--acc);padding-left:var(--sp-3)}
  .st-num{display:flex;align-items:center;gap:var(--sp-2);
          font-family:var(--font-d);font-stretch:87.5%;font-size:var(--fs-micro);
          letter-spacing:.12em;color:var(--acc-ink)}
  .st-de{margin:0;font-size:var(--fs-base);line-height:1.5;color:var(--txt)}
  .st-alt{margin:0;padding-left:var(--sp-2);border-left:2px solid var(--line-2);
          font-size:var(--fs-sm);line-height:1.5;color:var(--dim)}
  .st-help{margin-top:auto;padding-top:var(--sp-2);border-top:1px solid var(--line)}
  .st-help summary{display:flex;align-items:center;gap:var(--sp-2);min-height:28px;
          cursor:pointer;list-style:none;font-family:var(--font-d);font-size:var(--fs-micro);
          font-weight:600;letter-spacing:.1em;color:var(--acc-ink)}
  .st-help summary::-webkit-details-marker{display:none}
  .st-help summary::before{content:"›";font-size:var(--fs-base);line-height:1;
          transition:transform var(--dur-2) var(--spring)}
  .st-help[open] summary::before{transform:rotate(90deg)}
  .st-help summary:hover{color:var(--acc)}
  .st-help p{margin:var(--sp-2) 0 0;font-size:var(--fs-sm);line-height:1.55;color:var(--dim)}
  .st-help p.st-ru{color:var(--dim-2)}
  /* La mesa de trabajo: la hoja en blanco sobre la que se habla. */
  .st-mesa{margin-bottom:var(--sp-4);padding:var(--sp-4) 0;
           background:none;
           border:0;border-top:2px solid var(--txt);border-bottom:1px solid var(--line);
           border-radius:0;
           box-shadow:none}
  .st-mesa-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);
           margin-bottom:var(--sp-3)}
  .st-mesa-head h3{margin:0;font-family:var(--font-d);font-stretch:87.5%;
           font-size:var(--fs-micro);letter-spacing:.12em;
           text-transform:uppercase;color:var(--acc-ink)}
  .st-count{font-size:var(--fs-xs);color:var(--dim-2);font-variant-numeric:tabular-nums}
  .st-actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:var(--sp-2)}
  .st-mesa-carta{padding:var(--sp-4);background:var(--sheet);
           border:1px solid var(--line-2);border-radius:0;
           box-shadow:none}
  .st-mesa-vacia{padding:var(--sp-5) var(--sp-3);text-align:center;
           color:var(--dim-2);font-style:italic}
  .st-notas{margin-top:var(--sp-3)}
  .st-notas .cap{display:block;margin-bottom:var(--sp-2);font-family:var(--font-d);
           font-size:var(--fs-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2)}
  .st-notas textarea{width:100%;min-height:96px;resize:vertical;padding:var(--sp-3);
           background:var(--sheet);color:var(--txt);border:1px solid var(--line-2);
           border-radius:0;box-shadow:none;
           font-family:var(--font-read);font-size:17px;line-height:1.7}

  /* ---------- Sprechen Teil 3 · Lösungswege: una situación por página ----------
     La descripción alemana y los Stichpunkte van a la vista. La ayuda ES/RU y
     los ejemplos quedan detrás de un «Ver»: primero se lee el caso y se habla,
     sin la traducción delante. Sin ventana ni salto de pantalla. */
  .sit-brief{margin:0 0 var(--sp-4);font-size:var(--fs-sm);color:var(--dim-2)}
  .sit-de{margin:0 0 var(--sp-5);font-family:var(--font-read);font-size:var(--fs-lead);
          line-height:1.65;color:var(--txt);max-width:66ch}
  .sit-sec{margin:var(--sp-5) 0 var(--sp-2);font-size:var(--fs-micro);font-weight:700;
           letter-spacing:.10em;text-transform:uppercase;color:var(--dim-2)}
  .sit-points{margin:0 0 var(--sp-5);padding-left:var(--sp-5)}
  .sit-points li{padding:var(--sp-2) 0;border-top:var(--b-std) solid var(--line);
                 font-size:var(--fs-base);line-height:1.5;color:var(--txt)}
  .sit-points li:first-child{border-top:0;padding-top:0}
  .sit-points li::marker{color:var(--acc-ink);font-family:var(--font-mono);font-size:var(--fs-sm)}
  .sit-help{margin:0 0 var(--sp-3);background:none;border:0;border-top:1px solid var(--line);
            border-radius:0;box-shadow:none}
  .sit-help summary{display:flex;align-items:center;gap:var(--sp-2);min-height:44px;
            padding:0;cursor:pointer;list-style:none;
            font-family:var(--font-d);font-stretch:87.5%;font-size:var(--fs-micro);
            letter-spacing:.1em;text-transform:uppercase;
            font-weight:600;color:var(--acc-ink)}
  .sit-help summary::-webkit-details-marker{display:none}
  .sit-help summary::before{content:"›";font-size:var(--fs-base);line-height:1;
            transition:transform var(--dur-2) var(--spring)}
  .sit-help[open] summary::before{transform:rotate(90deg)}
  .sit-help summary:hover{color:var(--acc)}
  .sit-help[open] summary{border-bottom:1px solid var(--line)}
  .sit-help-body{padding:var(--sp-3) 0 var(--sp-4)}
  .sit-tr{margin:0;font-size:var(--fs-sm);line-height:1.6;color:var(--dim)}
  .sit-tr + .sit-tr{margin-top:var(--sp-2)}
  .sit-tag{display:inline-block;margin-right:var(--sp-2);min-width:24px;
           font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:.08em;
           color:var(--acc-ink)}
  .sit-help-points{list-style:none;margin:var(--sp-2) 0 0;padding:0}
  .sit-help-points li{padding:var(--sp-2) 0;border-top:var(--b-std) solid var(--line)}
  .sit-help-points li:first-child{border-top:0;padding-top:0}
  .sit-hp-es{margin:0;font-size:var(--fs-sm);line-height:1.5;color:var(--txt)}
  .sit-hp-ru{margin:var(--sp-1) 0 0;font-size:var(--fs-sm);line-height:1.5;color:var(--dim-2)}
  .sit-examples{list-style:none;margin:0;padding:0}
  .sit-examples li{padding:var(--sp-2) 0;border-top:var(--b-std) solid var(--line);
                   font-family:var(--font-read);font-size:var(--fs-base);line-height:1.55;
                   color:var(--txt)}
  .sit-examples li:first-child{border-top:0;padding-top:0}
  .sit-nav-row{margin-top:var(--sp-5)}
  @media(max-width:860px){
    .sit-de{font-size:var(--fs-base)}
  }

  /* --- Móvil: índice plegado, cabecera compacta y TODO control a 44px --- */
  @media(max-width:860px){
    :root{--header-h:auto}
    header{padding:var(--sp-2) var(--sp-3);gap:var(--sp-2);position:relative}
    .q-sheet{padding:var(--sp-2) 0 var(--sp-3) var(--sp-4)}
    header h1{font-size:16px;white-space:normal}
    #nav-toggle{display:inline-flex}
    .layout{flex-direction:column}
    nav{display:none;position:static;height:auto;width:100%;flex:1 1 auto;
        border-right:0;border-bottom:1px solid var(--line);
        padding:var(--sp-2) var(--sp-3) var(--sp-4)}
    body.nav-open nav{display:block;max-height:60vh;overflow-y:auto}
    main{padding:var(--sp-5) var(--sp-4) var(--sp-7)}
    nav button,.sec-toggle,.letters button,.btn,.tab-pill,.lang-btn,.user-btn,.modal-close,
    .copy-btn,.input,.select,.lp-item,.opt,.sec-reset,details.passage summary,
    .st-help summary,.st-notas textarea,.st-toggle,.sit-help summary{min-height:44px}
    #nav-toggle,.icon-btn{min-height:44px}
    #theme-btn{min-height:44px}
    .switch-tema-texto{display:none}
    .letters button{width:44px}
    .btn.sm,.copy-btn{min-height:36px}
    /* En móvil, todo lo de la cabecera vuelve a 44px de área de toque. */
    header .btn{min-height:44px}
  }

  /* --- Escritorio ancho (≥1280px): la mesa de examen, en dos columnas ---
     A 1920px una columna de 960px dejaba media pantalla vacía a la derecha. Aquí
     la referencia —los anuncios de Lesen 1 y 3 o el texto de lectura— se queda a
     la izquierda, fija y con su propio scroll, y la hoja de preguntas ocupa la
     derecha: se responde sin subir y bajar a consultar el anuncio.
     La puerta estaba en 1500px y un portátil de 1440 se quedaba fuera: el panel
     de anuncios mide 1366px de alto y la primera fila de letras cae en y≈1815, así
     que había que sostener ocho anuncios alemanes en la memoria mientras se
     respondía. Ahora entra desde 1280 y la columna de referencia es fluida
     (clamp) en vez de 600px fijos: a 1280 deja 384px de referencia y algo más de
     460px de hoja, que es lo justo para que las ocho letras quepan en una fila.
     Solo se activa si la variante tiene referencia; por eso la clase la pone el
     render (main.desk), no un :has() ni un ancho fijo, y hay un conmutador en la
     cabecera para forzar una columna cuando el ancho no compensa. */
  @media(min-width:1280px){
    #desk-toggle{display:inline-flex}
    main.desk{max-width:none;display:grid;align-items:start;column-gap:var(--sp-6);
              grid-template-columns:minmax(0,clamp(300px,36vw,var(--desk-ref))) minmax(0,1fr)}
    main.desk > *{grid-column:1 / -1}
    main.desk > details.passage{grid-column:1;position:sticky;
              top:calc(var(--header-h) + var(--sp-5));
              max-height:calc(100vh - var(--header-h) - var(--sp-6));
              padding-top:0;overflow:auto;overscroll-behavior:contain}
    /* El rótulo del panel no se va con el scroll: sigue diciendo qué miras y
       cuántos anuncios llevas asignados. */
    /* La cabecera del panel se queda fija al desplazar, así que su fondo tiene que
       ser EL MISMO de la pieza (si no, se ve un rectángulo desentonando dentro de la
       tarjeta) y tiene que llegar a los bordes: si se queda metida en el relleno, el
       texto se cuela por las franjas laterales. */
    main.desk > details.passage > summary{position:sticky;top:0;z-index:2;
              background:var(--panel);border-radius:var(--r-4) var(--r-4) 0 0;
              margin:0 calc(-1 * var(--sp-5)) var(--sp-3);
              padding:var(--sp-4) var(--sp-5) var(--sp-2)}
    /* Un solo scroll (el del panel), no dos anidados. */
    main.desk > details.passage .passage-body{max-height:none;overflow:visible}

    /* El banco de palabras (ejercicios de huecos) NO es un panel hermano: vive dentro
       del texto de lectura (ver el render), así que se queda con él en la columna fija
       y sigue a la vista mientras se responde. */
    main.desk > .q-sheet,main.desk > .row{grid-column:2;width:100%;max-width:var(--desk-work)}
  }

  /* --- Movimiento reducido: se apaga todo lo decorativo (HIG) --- */
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
                         transition-duration:.001ms !important}
  }
</style>
</head>

    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
  </button>
  <button class="switch-tema" id="theme-btn" type="button" role="switch" aria-checked="true" title="Modo noche" aria-label="Modo oscuro">
    <span class="pista-tema"><span class="mando-tema" id="theme-knob"></span></span>
    <span class="switch-tema-texto" id="theme-label">Modo oscuro</span>
