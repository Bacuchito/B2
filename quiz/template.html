<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2 Beruf — Test de Lesen, Hören y Schreiben</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaf0; --dim:#9aa3b2; --acc:#4f8cff; --ok:#2fb37a; --bad:#e05561;
    --warn:#e0a33a; --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--txt);}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
         padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .spacer{flex:1}
  .stat{font-size:13px;color:var(--dim)}
  .stat b{color:var(--txt)}
  .layout{display:flex;align-items:flex-start;gap:0;min-height:calc(100vh - 49px)}
  nav{width:290px;flex:0 0 290px;border-right:1px solid var(--line);background:var(--panel);
      height:calc(100vh - 49px);overflow-y:auto;position:sticky;top:49px;padding:10px}
  nav .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
           margin:14px 6px 6px;font-weight:700}
  nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--txt);
             padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.3}
  nav button:hover{background:var(--panel2)}
  nav button.active{background:var(--acc);color:#fff;font-weight:600}
  nav button .pill{float:right;font-size:11px;color:var(--dim);font-weight:400}
  nav button.active .pill{color:#dce7ff}
  main{flex:1;padding:22px 26px 80px;max-width:920px}
  h2{font-size:20px;margin:0 0 4px}
  h2 + .sub{color:var(--dim);font-size:13.5px;margin-bottom:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
         padding:14px 16px;margin-bottom:16px}
  .panel h3{margin:0 0 8px;font-size:14px;letter-spacing:.02em}
  details.passage summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--acc);
                          user-select:none;outline:none}
  details.passage[open] summary{margin-bottom:10px}
  .passage-body{white-space:pre-wrap;font-size:14.5px;line-height:1.65;color:#d7dbe4;
                max-height:60vh;overflow-y:auto;padding-right:6px}
  .ad{border-left:3px solid var(--line);padding:6px 0 6px 12px;margin:10px 0}
  .ad .k{font-weight:700;color:var(--acc);margin-right:6px}
  .ad .t{font-weight:600}
  .ad .body{color:#cfd4de;font-size:14px;margin-top:2px}
  .ad.used{border-left-color:var(--ok)}
  .ad.unused{border-left-color:var(--warn)}
  .q{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
     padding:14px 16px;margin-bottom:14px}
  .q .num{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;
          background:var(--panel2);border-radius:6px;font-size:12.5px;font-weight:700;margin-right:8px}
  .q .prompt{font-size:15px;margin-bottom:12px;display:inline}
  .opts{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;
       padding:9px 11px;cursor:pointer;background:var(--panel2);transition:.12s}
  .opt:hover{border-color:var(--acc)}
  .opt .key{font-weight:700;min-width:18px;color:var(--acc)}
  .opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .opt.correct{border-color:var(--ok);background:#152a22}
  .opt.wrong{border-color:var(--bad);background:#2a1719}
  .opt.correct .key{color:var(--ok)}
  .opt.wrong .key{color:var(--bad)}
  .letters{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .letters button{width:38px;height:36px;border-radius:8px;border:1px solid var(--line);
                  background:var(--panel2);color:var(--txt);font-weight:700;cursor:pointer;font-size:14px}
  .letters button:hover{border-color:var(--acc)}
  .letters button.sel{background:var(--acc);border-color:var(--acc);color:#fff}
  .letters button.correct{background:var(--ok);border-color:var(--ok);color:#fff}
  .letters button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
  .fb{margin-top:12px;border-radius:8px;padding:11px 13px;font-size:14px;display:none}
  .fb.show{display:block}
  .fb.good{background:#14261f;border:1px solid #1f5c45}
  .fb.bad{background:#261618;border:1px solid #6b2b31}
  .fb .verdict{font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fb .quote{font-style:italic;color:#cfd4de;border-left:3px solid var(--acc);
             padding:5px 0 5px 10px;margin:8px 0}
  .badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.02em}
  .badge.hoch{background:#123a2a;color:#5fd6a3;border:1px solid #1f5c45}
  .badge.mittel{background:#3a3112;color:#e8c46a;border:1px solid #6b5a1f}
  .badge.niedrig{background:#3a1416;color:#f08a92;border:1px solid #6b2b31}
  .badge.ok{background:#12263a;color:#7fb6ff;border:1px solid #1f4a6b}
  .badge.tag{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 15px;
       cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn.danger{background:#3a1416;border:1px solid #6b2b31;color:#f08a92}
  .btn.success{background:#123a2a;border:1px solid #1f5c45;color:#5fd6a3}
  .note{background:#2a2312;border:1px solid #6b5a1f;color:#e8c46a;padding:9px 12px;
        border-radius:8px;font-size:13.5px;margin-bottom:14px}
  .empty{color:var(--dim);padding:40px 0;text-align:center}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:13px}

  /* Schreiben UI & Editor */
  .schreiben-layout{display:flex;flex-direction:column;gap:16px}
  .memo-card{background:#2a2412;border-left:4px solid var(--warn);padding:12px 14px;border-radius:6px;margin:12px 0;font-size:14px;line-height:1.55}
  .memo-card b{color:var(--warn)}
  .letter-card{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--acc);padding:14px 16px;border-radius:6px;margin:12px 0;white-space:pre-wrap;font-size:14px;line-height:1.6;color:#d7dbe4}
  .lp-list{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:8px}
  .lp-item{display:flex;align-items:flex-start;gap:10px;background:var(--panel2);padding:10px 12px;border-radius:8px;font-size:14px;border:1px solid var(--line)}
  .lp-item input[type="checkbox"]{margin-top:3px;cursor:pointer;accent-color:var(--acc)}
  .lp-item .lp-num{min-width:22px;height:22px;background:var(--acc);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
  
  .editor-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .editor-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px}
  .editor-textarea{width:100%;min-height:280px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:var(--txt);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;resize:vertical;outline:none;box-sizing:border-box}
  .editor-textarea:focus{border-color:var(--acc)}
  .timer-box{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
  .timer-display{font-size:15px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
  .timer-display.warn{color:var(--bad)}

  /* Evaluación de Schreiben */
  .eval-banner{padding:14px 18px;border-radius:8px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:space-between;margin:16px 0;flex-wrap:wrap;gap:10px}
  .eval-banner.pass{background:#14261f;border:1px solid #1f5c45;color:#5fd6a3}
  .eval-banner.fail{background:#261618;border:1px solid #6b2b31;color:#f08a92}
  .crit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:16px 0}
  .crit-box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
  .crit-box .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:13.5px}
  .crit-box .c-body{font-size:13px;color:#cfd4de;line-height:1.5}
  /* Texto anotado e interactivo con errores en colores */
  .annotated-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:16px 0}
  .annotated-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
  .annotated-text-box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:18px 20px;font-size:15px;line-height:1.9;white-space:pre-wrap;color:#e6e9f0;word-break:break-word}
  
  .err-highlight{position:relative;border-radius:4px;padding:2px 6px;margin:0 1px;cursor:pointer;display:inline;transition:all .18s ease;font-weight:500}
  .err-highlight.err-grammatik{background:rgba(240,138,146,0.18);border-bottom:2.5px solid #f08a92;color:#ffcdd2}
  .err-highlight.err-grammatik:hover, .err-highlight.err-grammatik.active{background:rgba(240,138,146,0.36);box-shadow:0 0 0 2px #f08a92}
  
  .err-highlight.err-wortschatz{background:rgba(232,196,106,0.18);border-bottom:2.5px solid #e8c46a;color:#ffe082}
  .err-highlight.err-wortschatz:hover, .err-highlight.err-wortschatz.active{background:rgba(232,196,106,0.36);box-shadow:0 0 0 2px #e8c46a}
  
  .err-highlight.err-zeichensetzung{background:rgba(127,182,255,0.18);border-bottom:2.5px solid #7fb6ff;color:#bbdefb}
  .err-highlight.err-zeichensetzung:hover, .err-highlight.err-zeichensetzung.active{background:rgba(127,182,255,0.36);box-shadow:0 0 0 2px #7fb6ff}
  
  .err-highlight.err-stil{background:rgba(211,164,255,0.18);border-bottom:2.5px solid #d3a4ff;color:#e1bee7}
  .err-highlight.err-stil:hover, .err-highlight.err-stil.active{background:rgba(211,164,255,0.36);box-shadow:0 0 0 2px #d3a4ff}

  .err-badge-num{font-size:11px;font-weight:700;vertical-align:super;padding:1px 5px;border-radius:99px;margin-left:4px;background:rgba(0,0,0,0.65);border:1px solid currentColor;opacity:0.9}

  .err-popover{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#181d28;border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,0.7);border-radius:8px;padding:10px 14px;min-width:250px;max-width:340px;z-index:40;display:none;font-size:13px;line-height:1.5;pointer-events:auto;text-align:left;animation:pop .12s ease-out}
  .err-popover::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border-width:6px;border-style:solid;border-color:#181d28 transparent transparent transparent}
  .err-highlight:hover .err-popover, .err-highlight.active .err-popover{display:block}
  .err-popover-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .err-popover-orig{color:#f08a92;font-size:12.5px;margin-bottom:3px;display:block}
  .err-popover-corr{color:#5fd6a3;font-weight:600;font-size:13px;margin-bottom:5px;display:block}
  .err-popover-rule{color:#cfd4de;font-size:12.5px;display:block;line-height:1.45}

  .err-legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
  .legend-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .legend-chip .dot{width:8px;height:8px;border-radius:50%}
  .legend-chip.gram .dot{background:#f08a92}
  .legend-chip.wort .dot{background:#e8c46a}
  .legend-chip.zeichen .dot{background:#7fb6ff}
  .legend-chip.stil .dot{background:#d3a4ff}

  .tab-pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .tab-pill{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease}
  .tab-pill:hover{color:var(--txt);background:var(--panel)}
  .tab-pill.active{background:var(--acc);color:#fff;border-color:var(--acc)}

  .err-card{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:6px;padding:12px 14px;margin-bottom:10px;transition:box-shadow .2s ease, transform .15s ease;cursor:pointer}
  .err-card:hover{transform:translateY(-1px);border-color:var(--acc)}
  .err-card.pulse{box-shadow:0 0 0 3px var(--acc);border-left-color:var(--acc)}
  .err-card .orig{color:#f08a92;text-decoration:line-through;margin-bottom:4px;font-size:13.5px}
  .err-card .corr{color:#5fd6a3;font-weight:600;margin-bottom:4px;font-size:14px}
  .err-card .rule{font-size:13px;color:#cfd4de;line-height:1.45}
  .model-text{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;color:#e8eaf0}
  .copy-btn{font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--txt)}
  .copy-btn:hover{background:var(--panel2)}

  /* Modal de Configuración de IA */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:540px;box-shadow:0 12px 36px rgba(0,0,0,0.6);overflow:hidden;animation:pop .15s ease-out}
  @keyframes pop{from{transform:scale(0.96);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{margin:0;font-size:16px;font-weight:600}
  .modal-close{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
  .modal-close:hover{color:var(--txt)}
  .modal-body{padding:18px;max-height:75vh;overflow-y:auto}
  .modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--panel2)}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--txt)}
  .form-group small{display:block;font-size:12px;color:var(--dim);margin-top:4px;line-height:1.4}
  .input, .select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--txt);font-size:13.5px;outline:none;box-sizing:border-box}
  .input:focus, .select:focus{border-color:var(--acc)}

  /* Selector nativo bilingüe ES / RU */
  .lang-switch{display:inline-flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px;gap:2px}
  .lang-btn{background:transparent;border:0;color:var(--dim);font-size:12px;font-weight:600;padding:4px 10px;border-radius:16px;cursor:pointer;transition:all .16s ease;display:inline-flex;align-items:center;gap:4px;line-height:1}
  .lang-btn:hover{color:var(--txt)}
  .lang-btn.active{background:var(--acc);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.35)}

  @media(max-width:860px){nav{position:static;height:auto;width:100%;flex:1 1 auto}
    .layout{flex-direction:column}main{padding:16px}}
</style>
</head>
<body>
<header>
  <h1 id="header-title">B2 Beruf — Test</h1>
  <div class="lang-switch" role="group" aria-label="Idioma / Язык">
    <button class="lang-btn active" id="lang-btn-es" data-lang="es" title="Español">🇪🇸 ES</button>
    <button class="lang-btn" id="lang-btn-ru" data-lang="ru" title="Русский">🇷🇺 RU</button>
  </div>
  <div class="spacer"></div>
  <div class="stat" id="stats"></div>
  <button class="btn ghost" id="doubt" title="Ver solo las respuestas con confianza media o baja">Solo dudosas</button>
  <button class="btn ghost" id="btn-ai-config" title="Configurar claves de API para evaluación de redacción">⚙ Configurar IA</button>
  <button class="btn ghost" id="reset">Reiniciar</button>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><div class="empty">Cargando…</div></main>
</div>
<div id="modal-container"></div>

<script>
const DATA = /*__DATA__*/;
const LS = "b2quiz.v1";
const LS_AI = "b2quiz.ai_config";
const LS_LANG = "b2quiz_lang";

let currentLang = "es";
try {
  const savedLang = localStorage.getItem(LS_LANG);
  if (savedLang === "es" || savedLang === "ru") currentLang = savedLang;
} catch(e){}

const I18N = {
  es: {
    appTitle: "B2 Beruf — Test",
    docTitle: "B2 Beruf — Test de Lesen, Hören y Schreiben",
    statRespondidas: "{done}/{total} respondidas · <b>{ok}</b> correctas",
    statDudosas: "{doubt} dudosas",
    btnSoloDudosas: "Solo dudosas",
    btnVerTodas: "Ver todas",
    btnSoloDudosasTitle: "Ver solo las respuestas con confianza media o baja",
    btnAiConfig: "⚙ Configurar IA",
    btnAiConfigTitle: "Configurar claves de API para evaluación de redacción",
    btnReset: "Reiniciar",
    confirmResetAll: "¿Borrar todas tus respuestas y borradores?",
    loading: "Cargando…",
    noData: "No hay datos todavía.",
    pagePdf: "Página {page} del PDF",
    itemsCount: "{count} ítems",
    itemCountSingle: "1 ítem",
    schreibenSubBadge: "Schreiben (150+ Wörter · 45 Min.)",
    passedPill: "✓ Aprobado",
    failedPill: "✗ Suspenso",
    doubtPillSingle: "1 dudosa",
    doubtPillPlural: "{count} dudosas",
    instructions: "Instrucciones",
    readingText: "Texto de lectura",
    optionsSummary: "{label} {range} ({total} opciones, {unused} sin usar)",
    reviewModeInfo: "Modo repaso: mostrando solo las {shown} de {total} respuestas con confianza media o baja. Revísalas contra el texto.",
    reviewModeNoDoubt: "Esta variante no tiene respuestas dudosas: todas son de confianza alta.",
    btnShowAllAnswers: "Mostrar todas las respuestas",
    btnClearVariantAnswers: "Borrar respuestas de esta variante",
    correctAnswerIs: "Respuesta correcta: <b>{letter}</b>",
    correctVerdict: "✓ Correcto",
    wrongVerdict: "✗ Incorrecto — la correcta es <b>{letter}</b>",
    confidenceBadge: "confianza: {conf}",
    secondReadingBadge: "✓ 2ª lectura",
    revealedBadge: "revelada",
    youChose: "Elegiste {chosen}. ",
    correctIs: "La correcta es {correct}.",
    schreibenTaskTitle: "Situación laboral y tarea oficial telc B2",
    scenarioLabel: "Situación previa:",
    sourceLetterLabel: "✉ Carta / Correo del cliente:",
    colleaguePostLabel: "💬 Publicación en el Intranet:",
    bossInstructionsLabel: "📌 Instrucciones internas de la jefa/jefe:",
    missionLabel: "Tu misión:",
    leitpunkteTitle: "Puntos guía obligatorios (4 Leitpunkte):",
    redemittelSummary: "💡 Redemittel B2 útiles (frases modelo para esta redacción)",
    wordBadgeFew: "{words} palabras (mínimo 150)",
    wordBadgeNear: "{words} palabras (cerca del mínimo de 150)",
    wordBadgeGood: "✓ {words} palabras (longitud B2 adecuada)",
    timerStart: "Iniciar",
    timerPause: "Pausar",
    timerResume: "Reanudar",
    timerReset: "Reiniciar",
    timerFinished: "Finalizado",
    timerAlert: "⏰ ¡Tiempo terminado! Han transcurrido los 45 minutos del examen.",
    btnEvaluate: "✨ Evaluar con Examinador telc B2",
    btnEvaluating: "⏳ Evaluando con examinador telc...",
    btnClearDraft: "Limpiar texto",
    confirmClearDraft: "¿Seguro que deseas borrar el borrador de esta tarea?",
    alertTooShort: "Tu texto es demasiado corto ({words} palabras). Escribe un intento más desarrollado (mínimo 150 palabras para B2) antes de solicitar evaluación.",
    alertNeedGeminiKey: "Para evaluar con Google Gemini, necesitas configurar tu API Key.",
    alertNeedCustomKey: "Para evaluar con DeepSeek / OpenAI, necesitas ingresar tu API Key.",
    statusConnecting: "Conectando con el LLM examinador...",

function t(key, vars = {}) {
  const dict = I18N[currentLang] || I18N.es;
  let str = dict[key] !== undefined ? dict[key] : (I18N.es[key] !== undefined ? I18N.es[key] : key);
  for (const [k, v] of Object.entries(vars)) {
    str = str.replace(new RegExp(`\\{${k}\\}`, "g"), v);
  }
  return str;
}

function formatConfidence(conf) {
  const c = String(conf || "mittel").toLowerCase();
  if (currentLang === "ru") {
    if (c === "hoch") return "высокая";
    if (c === "niedrig") return "низкая";
    return "средняя";
  } else {
    if (c === "hoch") return "alta";
    if (c === "niedrig") return "baja";
    return "media";
  }
}

function updateLangUI() {
  if (document.documentElement) document.documentElement.lang = currentLang;
  document.title = t("docTitle");

  const h1 = document.getElementById("header-title");
  if (h1) h1.textContent = t("appTitle");

  const btnEs = document.getElementById("lang-btn-es");
  const btnRu = document.getElementById("lang-btn-ru");
  if (btnEs) btnEs.className = "lang-btn" + (currentLang === "es" ? " active" : "");
  if (btnRu) btnRu.className = "lang-btn" + (currentLang === "ru" ? " active" : "");

  const doubtBtn = document.getElementById("doubt");
  if (doubtBtn) {
    doubtBtn.textContent = onlyDoubtful ? t("btnVerTodas") : t("btnSoloDudosas");
    doubtBtn.title = t("btnSoloDudosasTitle");
    doubtBtn.className = onlyDoubtful ? "btn" : "btn ghost";
  }

  const aiBtn = document.getElementById("btn-ai-config");
  if (aiBtn) {
    aiBtn.textContent = t("btnAiConfig");
    aiBtn.title = t("btnAiConfigTitle");
  }

  const resetBtn = document.getElementById("reset");
  if (resetBtn) resetBtn.textContent = t("btnReset");
}

function setLanguage(lang) {
  if (lang !== "es" && lang !== "ru") return;
  currentLang = lang;
  try { localStorage.setItem(LS_LANG, lang); } catch(e){}
  updateLangUI();
  render();
}

/* ---------- índices ---------- */
const allVariants = [];
DATA.sections.forEach(sec=>{
  sec.variants.forEach(v=>{
    v._section = sec.id; v._sectionTitle = sec.title;
    if(!v.items) v.items = [];
    v.items.forEach((it,i)=>{ it._idx = i; });
    const byN = {};
    v.items.forEach(it => { byN[it.n] = (byN[it.n]||0) + 1; });
    const seenN = {};
    v.items.forEach(it => {
      if(byN[it.n] > 1){
        seenN[it.n] = (seenN[it.n]||0) + 1;
        it._label = it.n + String.fromCharCode(96 + seenN[it.n]);
      } else {
        it._label = String(it.n);
      }
    });
    allVariants.push(v);
  });
});

function ansKey(v, item){ return v.id + "#" + item._idx; }
function itemAnswerLetter(it){ return String(it.answer).toLowerCase(); }
function isDoubtful(it){ return String(it.confidence||"mittel").toLowerCase() !== "hoch"; }
function doubtfulCount(v){ return (v.items || []).filter(isDoubtful).length; }

let onlyDoubtful = false;

/* ---------- estadísticas ---------- */
function updateStats(){
  let total = 0, done = 0, ok = 0, doubt = 0;
  allVariants.forEach(v=>{
    (v.items || []).forEach(it=>{
      total++;
      if(isDoubtful(it)) doubt++;
      const a = state.answers[ansKey(v,it)];
      if(a !== undefined && a !== "__revealed__"){
        done++; if(a === itemAnswerLetter(it)) ok++;
      }
    });
  });
  const el = document.getElementById("stats");
  if(!el) return;
  const pct = done ? " (" + Math.round(ok/done*100) + "%)" : "";
  const doubtSpan = doubt ? ' · <span style="color:#e8c46a">' + t("statDudosas", {doubt: doubt}) + "</span>" : "";
  el.innerHTML = t("statRespondidas", {done: done, total: total, ok: ok}) + pct + doubtSpan;
}

/* ---------- navegación ---------- */
let current = allVariants.length ? allVariants[0].id : null;

function renderNav(){
  const nav = document.getElementById("nav");
  if(!nav) return;
  nav.innerHTML = "";
  DATA.sections.forEach(sec=>{
    const h = document.createElement("div");
    h.className = "sec";
    h.textContent = sec.title;
    nav.appendChild(h);
    sec.variants.forEach(v=>{
      const nd = doubtfulCount(v);
      if(onlyDoubtful && nd === 0 && v.id !== current) return;
      const b = document.createElement("button");
      const n = (v.items || []).length;
      const done = (v.items || []).filter(it => state.answers[ansKey(v,it)] !== undefined).length;
      const ok = (v.items || []).filter(it => state.answers[ansKey(v,it)] === itemAnswerLetter(it)).length;
      let pill = "";
      if(v.kind === "schreiben"){
        const hasEval = state.schreiben_evals && state.schreiben_evals[v.id];
        pill = hasEval ? (hasEval.verdict === "BESTANDEN" ? t("passedPill") : t("failedPill")) : (v.category === "beschwerde" ? "E-Mail" : "Beitrag");
      } else {
        pill = onlyDoubtful
          ? (nd === 1 ? t("doubtPillSingle") : t("doubtPillPlural", {count: nd}))
          : (done ? ok + "/" + n : (n === 1 ? t("itemCountSingle") : t("itemsCount", {count: n})));
      }
      b.innerHTML = esc(v.label) + '<span class="pill">' + esc(pill) + '</span>';
      if(v.id === current) b.className = "active";
      b.onclick = ()=>{ current = v.id; render(); window.scrollTo(0,0); };
      nav.appendChild(b);
    });
  });
}

let examTimer = null;
let examTimerSeconds = 45 * 60;
let examTimerRunning = false;

function formatTimer(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

/* ---------- render principal ---------- */
function render(){
  renderNav();
  updateStats();
  const main = document.getElementById("main");
  if(!main) return;
  const v = allVariants.find(x=>x.id===current);
  if(!v){ main.innerHTML = '<div class="empty">' + t("noData") + '</div>'; return; }
  main.innerHTML = "";

  /* Encabezado */
  const h2 = document.createElement("h2");
  h2.textContent = v._sectionTitle + " · " + v.label;
  main.appendChild(h2);
  const sub = document.createElement("div");
  sub.className = "sub";
  const numItems = (v.items || []).length;
  const itemsText = numItems === 1 ? t("itemCountSingle") : t("itemsCount", {count: numItems});
  sub.innerHTML = t("pagePdf", {page: v.page}) +
    (v.topic ? ' · <b>' + esc(v.topic) + '</b>' : '') +
    (v.kind === "schreiben" ? ' · <b>' + t("schreibenSubBadge") + '</b>' : ' · ' + itemsText);
  main.appendChild(sub);

  if(v.kind === "schreiben"){
    renderSchreiben(v, main);
    return;
  }

  /* Vista habitual para preguntas de Lesen / Hören */
  if(v.note){
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = "⚠ " + v.note;
    main.appendChild(n);
  }
  if(v.intro){
    const p = document.createElement("div");
    p.className = "panel";
    p.innerHTML = '<h3>' + t("instructions") + '</h3><div>' + esc(v.intro) + '</div>';
    main.appendChild(p);
  }

  if(v.passage){
    main.appendChild(detailsPanel(t("readingText"), v.passage));
  }

  if(v.options && v.options.length){
    const used = new Set(v.items.map(i=>itemAnswerLetter(i)));
    const d = document.createElement("details");
    d.className = "panel passage";
    d.open = true;
    const s = document.createElement("summary");
    const label = v.optionsLabel || (v._section === "lesen-t3" ? "Kommentare" : "Anzeigen");
    const ks = v.options.map(o=>String(o.key));
    s.textContent = t("optionsSummary", {
      label: label,
      range: ks[0] + "–" + ks[ks.length-1],
      total: v.options.length,
      unused: (v.options.length - used.size)
    });
    d.appendChild(s);
    const body = document.createElement("div");
    v.options.forEach(o=>{
      const isUsed = used.has(String(o.key).toLowerCase());
      const div = document.createElement("div");
      div.className = "ad " + (isUsed ? "used" : "unused");
      div.innerHTML = '<span class="k">' + esc(o.key) + ')</span>' +
                      '<span class="t">' + esc(o.title||"") + '</span>' +
                      '<div class="body">' + esc(o.text||"") + '</div>';
      body.appendChild(div);
    });
    d.appendChild(body);
    main.appendChild(d);
  }

  const shown = onlyDoubtful ? v.items.filter(isDoubtful) : v.items;
  if(onlyDoubtful){
    const info = document.createElement("div");
    info.className = "note";
    info.textContent = shown.length
      ? t("reviewModeInfo", {shown: shown.length, total: v.items.length})
      : t("reviewModeNoDoubt");
    main.appendChild(info);
  }
  shown.forEach(it => main.appendChild(renderItem(v, it)));

  const row = document.createElement("div");
  row.className = "row";
  const bAll = document.createElement("button");
  bAll.className = "btn ghost";
  bAll.textContent = t("btnShowAllAnswers");
  bAll.onclick = ()=>{
    v.items.forEach(it=>{ if(state.answers[ansKey(v,it)]===undefined)
      state.answers[ansKey(v,it)] = "__revealed__"; });
    saveState(); render();
  };
  const bClear = document.createElement("button");
  bClear.className = "btn ghost";
  bClear.textContent = t("btnClearVariantAnswers");
  bClear.onclick = ()=>{ v.items.forEach(it=> delete state.answers[ansKey(v,it)]);
    saveState(); render(); };
  row.appendChild(bAll); row.appendChild(bClear);
  main.appendChild(row);
}

function countWords(str){
  const m = (str || "").trim().match(/[\p{L}\p{N}_\-]+/gu);
  return m ? m.length : 0;
}

                     '<span>' + esc(lp) + '</span>' +

  actRow.appendChild(statusMsg);
  editorCard.appendChild(actRow);

  const existingEval = state.schreiben_evals && state.schreiben_evals[v.id];

  main.appendChild(layout);

  const tBtn = document.getElementById("timer-btn");
  const tRst = document.getElementById("timer-rst");
  const tDisp = document.getElementById("timer-display");
  if(tBtn && tRst && tDisp){
    tBtn.textContent = examTimerRunning ? t("timerPause") : t("timerStart");
    tBtn.onclick = ()=>{
      if(examTimerRunning){
        clearInterval(examTimer);
        examTimerRunning = false;
        tBtn.textContent = t("timerResume");
      } else {
        examTimerRunning = true;
        tBtn.textContent = t("timerPause");
        examTimer = setInterval(()=>{
          if(examTimerSeconds > 0){
            examTimerSeconds--;
            tDisp.textContent = formatTimer(examTimerSeconds);
            if(examTimerSeconds <= 300) tDisp.className = "timer-display warn";
          } else {
            clearInterval(examTimer);
            examTimerRunning = false;
            tBtn.textContent = t("timerFinished");
            alert(t("timerAlert"));
          }
        }, 1000);
      }
    };
    tRst.onclick = ()=>{
      clearInterval(examTimer);
      examTimerRunning = false;
      examTimerSeconds = 45 * 60;
      tDisp.textContent = formatTimer(examTimerSeconds);
      tDisp.className = "timer-display";
      tBtn.textContent = t("timerStart");
    };
  }

  /* Conectar evento de evaluación */
  bEval.onclick = async ()=>{
    const textToEval = textarea.value.trim();
    const words = countWords(textToEval);
    if(words < 30){
      alert(t("alertTooShort", {words: words}));
      return;
    }
    const cfg = getAIConfig();
    if(cfg.provider === "gemini" && !cfg.geminiKey){
      openAIConfigModal(t("alertNeedGeminiKey"));
      return;
    }
    if(cfg.provider === "openai_compatible" && !cfg.customKey){
      openAIConfigModal(t("alertNeedCustomKey"));
      return;
    }

    bEval.disabled = true;
    bEval.innerHTML = t("btnEvaluating");
    statusMsg.textContent = t("statusConnecting");

    try {
      const result = await evaluateWithLLM(v, textToEval, (msg)=>{ statusMsg.textContent = msg; });

      if(!state.schreiben_evals) state.schreiben_evals = {};

      saveState();
      statusMsg.textContent = t("statusCompleted");

      statusMsg.innerHTML = '<span style="color:var(--bad)">' + t("statusError") + esc(err.message) + '</span>';
      alert(t("alertEvalError", {error: err.message}));
    } finally {
      bEval.disabled = false;
      bEval.innerHTML = t("btnEvaluate");
    }
  };

function formatGermanLetter(text){
  if(!text) return "";
  let s = String(text).trim().replace(/\r\n/g, "\n");

  // 1. Quitar coma incorrecta tras fórmula de despedida (anglicismo típico en alemán)
  s = s.replace(/(Mit freundlichen Grüßen|Herzliche Grüße|Viele Grüße|Beste Grüße),\s*/gi, "$1\n");

  // 2. Garantizar línea en blanco tras el saludo inicial
  s = s.replace(/^([^\n,]+,)\s*([A-ZÄÖÜa-zäöü])/m, "$1\n\n$2");

  // 3. Garantizar línea en blanco antes de la fórmula de despedida
  s = s.replace(/([.!?])\s*(Mit freundlichen Grüßen|Herzliche Grüße|Viele Grüße|Beste Grüße)/gi, "$1\n\n$2");

  // 4. Garantizar salto de línea entre fórmula de despedida, nombre y cargo/departamento
  s = s.replace(/(Mit freundlichen Grüßen|Herzliche Grüße|Viele Grüße)\s*\n?\s*([^,\n]+)\s+(Kundenabteilung|Kundenservice|Abteilung|Geschäftsleitung)/gi, "$1\n$2\n$3");

  // 5. Si el cuerpo no tiene párrafos (es un bloque continuo de más de 200 caracteres), insertar párrafos en transiciones lógicas
  const transitions = [
    "Im Namen des Unternehmens",
    "Wir bedauern sehr",
    "Der Grund für dieses",
    "Der Grund hierfür",
    "Aufgrund der",
    "Nach Rücksprache",
    "Wir möchten Ihnen folgenden",
    "Als Entschädigung",
    "Wir versichern Ihnen verbindlich",
    "Wir hoffen auf Ihr",
    "Für eventuelle Rückfragen",
    "Für weitere Fragen"
  ];
  transitions.forEach(tr => {
    const escaped = tr.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const reg = new RegExp("([.!?])\\s+(" + escaped + ")", "g");
    s = s.replace(reg, "$1\n\n$2");
  });

  // Colapsar saltos excesivos
  s = s.replace(/\n{3,}/g, "\n\n");
  return s.trim();
}

/* ---------- Renderizador del resultado de evaluación telc B2 ---------- */
function normalizeEvaluationResult(raw){
  if(!raw || typeof raw !== "object"){
    return {
      verdict: "NICHT BESTANDEN",
      score_total: 0,
      word_count: 0,
      student_text: "",
      criteria: {
        aufgabenbewaeltigung: { grade: "C", score: 14, feedback: "", leitpunkte_check: [] },
        angemessenheit: { grade: "C", score: 14, feedback: "", leitpunkte_check: [] },
        korrektheit: { grade: "C", score: 14, feedback: "", leitpunkte_check: [] },
        repertoire: { grade: "C", score: 14, feedback: "", leitpunkte_check: [] }
      },
      critical_errors: [],
      strengths: [],
      areas_for_improvement: [],
      corrected_version: "",
      musterloesung: ""
    };
  }

  const normStr = s => String(s || "")
    .toLowerCase()
    .replace(/ä/g, "ae")
    .replace(/ö/g, "oe")
    .replace(/ü/g, "ue")
    .replace(/ß/g, "ss")
    .replace(/[^a-z0-9]/g, "");

  // Detectar contenedor de criterios
  const critContainer = raw.criteria || raw.kriterien || raw.criterios || raw.bewertung || raw.evaluation || raw.kriterien_bewertung;
  let critList = [];
  if(Array.isArray(critContainer)){
    critList = critContainer;
  } else if(critContainer && typeof critContainer === "object"){
    critList = Object.entries(critContainer).map(([k, v]) => {
      if(v && typeof v === "object") return Object.assign({ _k: k }, v);
      return { _k: k, feedback: String(v) };
    });
  } else {
    critList = Object.entries(raw).map(([k, v]) => {
      if(v && typeof v === "object") return Object.assign({ _k: k }, v);
      return { _k: k, feedback: String(v) };
    });
  }

  function extractCriterion(patterns){
    for(const p of patterns){
      const isShort = /^(i{1,3}|iv|[1-4])$/i.test(p);
      for(const item of critList){
        const rawK = String(item._k || item.name || item.kriterium || item.criterion || item.title || item.id || "");
        const normK = normStr(rawK);
        if(isShort){
          const reg = new RegExp('^(?:kriterium\\s*)?' + p + '(?:[^a-z]|$)', 'i');
          if(reg.test(rawK) || normK === p) return item;
        } else {
          const normP = normStr(p);
          if(normK.includes(normP)) return item;
        }
      }
      const obj = (critContainer && typeof critContainer === "object") ? critContainer : raw;
      for(const k of Object.keys(obj)){
        const normK = normStr(k);
        if(isShort){
          const reg = new RegExp('^(?:kriterium\\s*)?' + p + '(?:[^a-z]|$)', 'i');
          if(reg.test(k) || normK === p){
            const v = obj[k];
            return (v && typeof v === "object") ? v : { feedback: String(v) };
          }
        } else {
          const normP = normStr(p);
          if(normK.includes(normP)){
            const v = obj[k];
            return (v && typeof v === "object") ? v : { feedback: String(v) };
          }
        }
      }
    }
    return {};
  }

  function normalizeCrit(c, defaultGrade, defaultScore, critTitle){
    let grade = c.grade || c.note || c.stufe || c.level || c.calificacion || c.bewertung;
    if(grade != null){
      const m = String(grade).toUpperCase().match(/[ABCD]/);
      grade = m ? m[0] : String(grade).trim().toUpperCase();
    }
    let score = c.score != null ? c.score : (c.punkte != null ? c.punkte : (c.points != null ? c.points : (c.punktzahl != null ? c.punktzahl : (c.puntos != null ? c.puntos : null))));
    if(score != null) score = Math.round(Number(score));
    if(isNaN(score)) score = null;

    if(score == null && grade){
      const map = { "A": 24, "B": 20, "C": 14, "D": 6 };
      if(map[grade] !== undefined) score = map[grade];
    }
    if(!grade && score != null){
      if(score >= 23) grade = "A";
      else if(score >= 18) grade = "B";
      else if(score >= 12) grade = "C";
      else grade = "D";
    }
    if(!grade) grade = defaultGrade;
    if(score == null) score = defaultScore;

    let feedback = c.feedback || c.kommentar || c.comment || c.beschreibung || c.begruendung || c.text || c.observaciones || "";
    if(!feedback){
      feedback = "Evaluación de " + critTitle + " con calificación " + grade + " (" + score + "/25 puntos).";
    }

    let leitpunkte_check = c.leitpunkte_check || c.leitpunkte || c.leitpunkteCheck || c.points_check || [];
    if(Array.isArray(leitpunkte_check)){
      leitpunkte_check = leitpunkte_check.map(lp => {
        if(typeof lp === "string") return { point: lp, covered: true, comment: "" };
        const pt = lp.point || lp.leitpunkt || lp.thema || lp.titel || "";
        const cov = lp.covered != null ? Boolean(lp.covered) : (lp.abgedeckt != null ? Boolean(lp.abgedeckt) : true);
        const cm = lp.comment || lp.kommentar || lp.feedback || "";
        return { point: String(pt), covered: cov, comment: String(cm) };
      });
    } else {
      leitpunkte_check = [];
    }

    return { grade, score, feedback: String(feedback), leitpunkte_check };
  }

  // Pre-verificación para derivar valores coherentes
  let rawVerdict = raw.verdict || raw.ergebnis || raw.resultado || raw.status;
  const passedHint = (typeof rawVerdict === "string" && rawVerdict.toUpperCase().includes("BESTANDEN") && !rawVerdict.toUpperCase().includes("NICHT"));
  const defGrade = passedHint ? "B" : "C";
  const defScore = passedHint ? 19 : 14;

  const c1 = normalizeCrit(extractCriterion(["aufgabenbewaeltigung", "aufgabenbewältigung", "aufgaben", "leitpunkte", "task", "i", "1"]), defGrade, defScore, "Aufgabenbewältigung");
  const c2 = normalizeCrit(extractCriterion(["angemessenheit", "kommunikative_angemessenheit", "angemessen", "register", "stil", "ii", "2"]), defGrade, defScore, "Kommunikative Angemessenheit");
  const c3 = normalizeCrit(extractCriterion(["korrektheit", "formale_richtigkeit", "richtigkeit", "grammatik", "orthographie", "iii", "3"]), defGrade, defScore, "Formale Richtigkeit");
  const c4 = normalizeCrit(extractCriterion(["repertoire", "sprachliche_mittel", "wortschatz", "varianz", "iv", "4"]), defGrade, defScore, "Sprachliche Mittel");

  if((!c1.leitpunkte_check || !c1.leitpunkte_check.length) && (raw.leitpunkte_check || raw.leitpunkte)){
    const rootLp = raw.leitpunkte_check || raw.leitpunkte;
    if(Array.isArray(rootLp)){
      c1.leitpunkte_check = rootLp.map(lp => {
        if(typeof lp === "string") return { point: lp, covered: true, comment: "" };
        const pt = lp.point || lp.leitpunkt || lp.thema || "";
        const cov = lp.covered != null ? Boolean(lp.covered) : true;
        const cm = lp.comment || lp.kommentar || lp.feedback || "";
        return { point: String(pt), covered: cov, comment: String(cm) };
      });
    }
  }

  // Puntuación total (calculada automáticamente si falta)
  let scoreTotal = raw.score_total != null ? raw.score_total : (raw.total_score != null ? raw.total_score : (raw.gesamtpunktzahl != null ? raw.gesamtpunktzahl : (raw.gesamtpunkte != null ? raw.gesamtpunkte : (raw.score != null ? raw.score : (raw.points != null ? raw.points : null)))));
  if(scoreTotal != null) scoreTotal = Math.round(Number(scoreTotal));
  if(scoreTotal == null || isNaN(scoreTotal)){
    scoreTotal = (c1.score || 0) + (c2.score || 0) + (c3.score || 0) + (c4.score || 0);
  }
  scoreTotal = Math.max(0, Math.min(100, scoreTotal));

  // Veredicto
  let verdict = rawVerdict;
  if(typeof verdict === "string"){
    const uv = verdict.toUpperCase();
    if(uv.includes("NICHT") || uv.includes("FAIL")) verdict = "NICHT BESTANDEN";
    else if(uv.includes("BESTANDEN") || uv.includes("PASS")) verdict = "BESTANDEN";
  }
  if(verdict !== "BESTANDEN" && verdict !== "NICHT BESTANDEN"){
    const hasD = (c1.grade === "D" || c2.grade === "D" || c3.grade === "D" || c4.grade === "D");
    verdict = (scoreTotal >= 60 && !hasD) ? "BESTANDEN" : "NICHT BESTANDEN";
  }

  // Errores críticos
  let critical_errors = raw.critical_errors || raw.errors || raw.fehler || raw.correcciones || [];
  if(!Array.isArray(critical_errors)) critical_errors = [];
  critical_errors = critical_errors.map(e => {
    if(typeof e === "string") return { original: e, correction: "", rule_es: "", type: "Hinweis" };
    return {
      original: String(e.original || e.falsch || e.text || e.fehler || ""),
      correction: String(e.correction || e.korrektur || e.richtig || e.besser || ""),
      rule_es: String(e.rule_es || e.rule || e.regla || e.erklaerung || e.explicacion || e.grund || ""),
      type: String(e.type || e.kategorie || e.art || "Grammatik")
    };
  }).filter(e => e.original || e.correction);

  // Puntos fuertes
  let strengths = raw.strengths || raw.staerken || raw.stärken || raw.puntos_fuertes || raw.positiv || [];
  if(!Array.isArray(strengths)){
    strengths = typeof strengths === "string" ? [strengths] : [];
  }
  strengths = strengths.map(s => String(s)).filter(Boolean);

  // Áreas de mejora
  let areas = raw.areas_for_improvement || raw.verbesserung || raw.verbesserungsbereich || raw.aspectos_a_mejorar || raw.schwaechen || raw.schwächen || [];
  if(!Array.isArray(areas)){
    areas = typeof areas === "string" ? [areas] : [];
  }
  areas = areas.map(a => String(a)).filter(Boolean);

  // Versión profesional sugerida
  const corrected_version = formatGermanLetter(raw.corrected_version || raw.korrigierte_fassung || raw.version_corregida || raw.model_text || raw.korrektur || "");
  const musterloesung = formatGermanLetter(raw.musterloesung || raw.musterlösung || raw.beispiel_loesung || "");

  return {
    verdict,
    score_total: scoreTotal,
    word_count: raw.word_count || 0,
    student_text: raw.student_text || "",
    criteria: {
      aufgabenbewaeltigung: c1,
      angemessenheit: c2,
      korrektheit: c3,
      repertoire: c4
    },
    critical_errors,
    strengths,
    areas_for_improvement: areas,
    corrected_version,
    musterloesung
  };
}

function cleanQuotes(s){
  return String(s || "").replace(/^[«»"„“”'’`\s]+|[«»"„“”'’`\s]+$/g, "").trim();
}

function findErrorRanges(studentText, errors){
  if(!studentText || !errors || !errors.length) return [];
  const ranges = [];
  errors.forEach((err, errIdx) => {
    let orig = cleanQuotes(err.original);
    if(!orig) return;
    let start = studentText.indexOf(orig);
    if(start === -1) start = studentText.toLowerCase().indexOf(orig.toLowerCase());
    if(start === -1){
      const escaped = orig.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+");
      try {
        const regex = new RegExp(escaped, "i");
        const match = studentText.match(regex);
        if(match && match.index !== undefined){
          start = match.index;
          orig = match[0];
        }
      } catch(e){}
    }
    if(start === -1){
      const trimmed = orig.replace(/[.,;:!?]+$/, "").trim();
      if(trimmed.length > 3){
        start = studentText.toLowerCase().indexOf(trimmed.toLowerCase());
        if(start !== -1) orig = studentText.slice(start, start + trimmed.length);
      }
    }
    if(start !== -1){
      ranges.push({
        start: start,
        end: start + orig.length,
        err: err,
        errIdx: errIdx,
        text: studentText.slice(start, start + orig.length)
      });
    }
  });
  ranges.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const clean = [];
  let lastEnd = 0;
  for(const r of ranges){
    if(r.start >= lastEnd){
      clean.push(r);
      lastEnd = r.end;
    }
  }
  return clean;
}

        };
      }
    };
    setupCopyBtn("btn-copy-model", res.corrected_version);
    setupCopyBtn("btn-copy-muster", res.musterloesung);
  }, 15);

  return card;
}

function parseEvaluationJson(rawText){
  let str = (rawText || "").trim();
  const codeBlockMatch = str.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  if(codeBlockMatch && codeBlockMatch[1]){
    str = codeBlockMatch[1].trim();
  } else {
    const firstBrace = str.indexOf('{');
    const lastBrace = str.lastIndexOf('}');
    if(firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace){
      str = str.slice(firstBrace, lastBrace + 1).trim();
    }
  }
  try {
    return JSON.parse(str);
  } catch(e) {
    try {
      const sanitized = str.replace(/,\s*([\]}])/g, '$1');
      return JSON.parse(sanitized);
    } catch(e2){
      throw new Error("La respuesta recibida no es un JSON válido:\n" + str.slice(0, 260));
    }
  }
}

async function evaluateWithLLM(task, studentText, onProgress){
  const config = getAIConfig();
  const systemPrompt = DATA.prompt_schreiben?.system_prompt || "";
  const userPrompt = buildUserPromptClient(task, studentText);

  if(config.provider === "gemini"){
    if(onProgress) onProgress("Consultando a Google Gemini (" + config.geminiModel + ")...");
    const model = config.geminiModel || "gemini-3.5-flash-lite";
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(config.geminiKey);
    const genConfig = {
      response_mime_type: "application/json",
      temperature: 0.2
    };
    if(DATA.prompt_schreiben && DATA.prompt_schreiben.json_schema){
      genConfig.response_schema = DATA.prompt_schreiben.json_schema;
    }
    const body = {
      system_instruction: { parts: [{ text: systemPrompt }] },
      contents: [{ parts: [{ text: userPrompt }] }],
      generationConfig: genConfig
    };
    let resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    // Fallback de reintento si el endpoint rechaza el schema estricto
    if(!resp.ok && resp.status === 400 && genConfig.response_schema){
      delete genConfig.response_schema;
      resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
    }
    if(!resp.ok){
      const errText = await resp.text();
      let msg = "Error " + resp.status + " de Gemini API";
      try {
        const j = JSON.parse(errText);
        if(j.error && j.error.message) msg += ": " + j.error.message;
      } catch(e){ msg += ": " + errText; }
      throw new Error(msg);
    }
    const data = await resp.json();
    const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!raw) throw new Error("Gemini no devolvió texto de respuesta.");
    return normalizeEvaluationResult(parseEvaluationJson(raw));

  } else if(config.provider === "openai_compatible"){
    if(onProgress) onProgress("Consultando a " + config.customModel + " en " + config.customEndpoint + "...");
    let url = (config.customEndpoint || "https://api.deepseek.com").replace(/\/+$/, "");
    if(!url.endsWith("/chat/completions")) url += "/chat/completions";
    const body = {
      model: config.customModel || "deepseek-chat",
      messages: [
        { role: "system", content: systemPrompt },
        { role: "user", content: userPrompt }
      ],
      response_format: { type: "json_object" },
      temperature: 0.2
    };
    const resp = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + config.customKey
      },
      body: JSON.stringify(body)
    });
    if(!resp.ok){
      const errText = await resp.text();
      let msg = "Error " + resp.status + " de API";
      try {
        const j = JSON.parse(errText);
        if(j.error && j.error.message) msg += ": " + j.error.message;
      } catch(e){ msg += ": " + errText; }
      throw new Error(msg);
    }
    const data = await resp.json();
    const raw = data?.choices?.[0]?.message?.content;
    if(!raw) throw new Error("La API no devolvió contenido.");
    return normalizeEvaluationResult(parseEvaluationJson(raw));

  } else if(config.provider === "ollama"){
    if(onProgress) onProgress("Consultando a Ollama Local (" + config.ollamaModel + ")...");
    let url = (config.ollamaEndpoint || "http://localhost:11434").replace(/\/+$/, "");
    if(!url.endsWith("/api/chat")) url += "/api/chat";
    const body = {
      model: config.ollamaModel || "llama3.1",
      messages: [
        { role: "system", content: systemPrompt },
        { role: "user", content: userPrompt }
      ],
      format: "json",
      stream: false,
      options: { temperature: 0.2 }
    };
    let resp;
    try {
      resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
    } catch(e){
      throw new Error("No se pudo conectar a Ollama en " + url + ". ¿Está el servidor iniciado? Si falla por CORS, inicia Ollama con OLLAMA_ORIGINS=*.");
    }
    if(!resp.ok){
      const errText = await resp.text();
      throw new Error("Error " + resp.status + " de Ollama: " + errText);
    }
    const data = await resp.json();
    const raw = data?.message?.content;
    if(!raw) throw new Error("Ollama no devolvió texto.");
    return normalizeEvaluationResult(parseEvaluationJson(raw));
  } else {
    throw new Error("Proveedor de IA no reconocido: " + config.provider);
  }
}

/* ---------- Renderizador de ítems de preguntas ---------- */
function detailsPanel(summary, text){
  const d = document.createElement("details");
  d.className = "panel passage";
  const s = document.createElement("summary");
  s.textContent = summary;
  const b = document.createElement("div");

  d.appendChild(s); d.appendChild(b);

function renderItem(v, it){
  const key = ansKey(v, it);
  const chosen = state.answers[key];
  const answered = chosen !== undefined && chosen !== "__revealed__";
  const revealed = chosen === "__revealed__";
  const correctLetter = itemAnswerLetter(it);

  const div = document.createElement("div");
  div.className = "q";

  const head = document.createElement("div");
  head.innerHTML = '<span class="num">' + (it._label || it.n) + '</span>' +
                   '<span class="prompt">' + esc(it.prompt) + '</span>';
  div.appendChild(head);

  const isMatching = v.kind === "zuordnung";

  if(isMatching){
    const letters = document.createElement("div");
    letters.className = "letters";
    const opts = v.options||[];
    opts.forEach(o=>{
      const k = String(o.key);
      const b = document.createElement("button");
      b.textContent = k;
      b.title = k + ") " + (o.title ? o.title + " — " : "") + (o.text || "").slice(0, 140);
      b.className = "";
      if(answered && String(chosen).toLowerCase() === k.toLowerCase()){
        b.className = (k.toLowerCase()===correctLetter) ? "correct" : "wrong";
      }
      if((answered||revealed) && k.toLowerCase()===correctLetter) b.className = "correct";
      if(!answered && !revealed && String(chosen||"").toLowerCase()===k.toLowerCase()) b.className = "sel";
      b.onclick = ()=>{ state.answers[key] = k; saveState(); render(); };
      letters.appendChild(b);
    });
    div.appendChild(letters);
  } else {
    const opts = document.createElement("div");
    opts.className = "opts";
    (it.options||[]).forEach(o=>{
      const k = String(o.key);
      const tf = it.type === "truefalse" || /^(richtig|falsch)$/i.test(k);
      const isCorrect = k.toLowerCase() === correctLetter;
      const isChosen = answered && String(chosen).toLowerCase() === k.toLowerCase();
      const el = document.createElement("div");
      el.className = "opt";
      if(answered || revealed){
        if(isCorrect) el.className += " correct";
        else if(isChosen) el.className += " wrong";
      } else if(isChosen) el.className += " sel";
      el.innerHTML = tf
        ? '<span class="key">' + (isCorrect && (answered||revealed) ? "✓" : "•") + '</span><span>' + esc(o.text||k) + '</span>'
        : '<span class="key">' + esc(k) + ')</span><span>' + esc(o.text||"") + '</span>';
      el.onclick = ()=>{ state.answers[key] = k; saveState(); render(); };
      opts.appendChild(el);
    });
    div.appendChild(opts);
  }

  if(answered || revealed){
    const good = answered && String(chosen).toLowerCase() === correctLetter;
    const fb = document.createElement("div");
    fb.className = "fb show " + (good ? "good" : "bad");
    let verdict;
    if(revealed) verdict = t("correctAnswerIs", {letter: correctLetter});
    else if(good) verdict = t("correctVerdict");
    else verdict = t("wrongVerdict", {letter: correctLetter});
    const conf = (it.confidence||"mittel").toLowerCase();
    const confLabel = formatConfidence(conf);
    let traduccion = "";
    if(isMatching && v.options){
      const optLabel = k => {
        const o = (v.options||[]).find(x => String(x.key).toLowerCase() === k);
        return o ? k + ") " + (o.title || (o.text||"").slice(0,60)) : k;
      };
      if(answered && !good) traduccion = t("youChose", {chosen: esc(optLabel(String(chosen).toLowerCase()))});
      traduccion += t("correctIs", {correct: esc(optLabel(correctLetter))});
    }
    fb.innerHTML =
      '<div class="verdict">' + verdict +
        '<span class="badge ' + conf + '">' + t("confidenceBadge", {conf: confLabel}) + '</span>' +
        (it.verified ? '<span class="badge ok">' + t("secondReadingBadge") + '</span>' : '') +
        (chosen === "__revealed__" ? '<span class="badge tag">' + t("revealedBadge") + '</span>' : '') +
      '</div>' +
      (traduccion ? '<div style="margin-bottom:6px">' + traduccion + '</div>' : '') +
      (it.quote ? '<div class="quote">„' + esc(it.quote) + '“</div>' : '') +
      '<div>' + esc(it.explain||"") + '</div>';
    div.appendChild(fb);
  }
  return div;
}

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
