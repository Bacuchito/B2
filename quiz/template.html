  card.className = "panel";
  card.style.marginTop = "18px";
  card.style.border = "1px solid var(--line)";

  const isPass = res.verdict === "BESTANDEN";
  const banner = document.createElement("div");
  banner.className = "eval-banner " + (isPass ? "pass" : "fail");
  banner.innerHTML = '<div>' + (isPass ? t("verdictPass") : t("verdictFail")) + '</div>' +
                     '<div>' + t("totalScore", {score: (res.score_total != null ? res.score_total : '-')}) + '</div>';
  card.appendChild(banner);

  /* La vara es nuestra y es más estricta que el examen: que no se confunda con una
     nota telc. */
  const notaVara = document.createElement("div");
  notaVara.className = "micro-block";
  notaVara.style.marginTop = "6px";
  notaVara.textContent = t("ourScaleNote");
  card.appendChild(notaVara);

  /* Cuántas pasadas se pudieron usar: si fue una sola, el número es más frágil. */
  if(res.pasadas){
    const notaPasadas = document.createElement("div");
    notaPasadas.className = "micro-block";
    notaPasadas.textContent = t("passesNote", {n: res.pasadas});
    card.appendChild(notaPasadas);
  }

  /* Texto del alumno analizado con errores en colores e interactivos */
  const studentText = res.student_text || getDraft(v.id) || "";
  const errorsList = res.critical_errors || [];
  const errorRanges = findErrorRanges(studentText, errorsList);
  /* Tarjetas cuya cita no aparece en el texto: la IA inventó o parafraseó. Se
     muestran igual (puede ser un fallo de comillas), pero marcadas, porque un
     «error» que no está en el texto es peor que no marcarlo. */
  const locatedIdx = new Set(errorRanges.map(r => r.errIdx));

  const textCard = document.createElement("div");
  textCard.className = "annotated-card";

  // Conteo de errores por categoría
  let numGram = 0, numWort = 0, numZeich = 0, numStil = 0;
  errorsList.forEach(e => {
    const t = String(e.type || "").toLowerCase();
    if(t.includes("wort")) numWort++;
    else if(t.includes("zeich") || t.includes("punkt") || t.includes("ortho") || t.includes("rechtschreib")) numZeich++;
    else if(t.includes("stil") || t.includes("reg")) numStil++;
    else numGram++;
  });

  const head = document.createElement("div");
  head.className = "annotated-head";
  head.innerHTML =
    '<div class="row">' +
      '<h3 class="annotated-title">' + t("annotatedHeadTitle") + '</h3>' +
      (errorsList.length === 0
        ? '<span class="badge hoch">' + t("errorsZero") + '</span>'
        : '<span class="badge ' + (errorsList.length > 3 ? 'niedrig' : 'mittel') + '">' +
            (errorsList.length === 1 ? t("errorsCountSingle") : t("errorsCountPlural", {count: errorsList.length})) +
          '</span>') +
    '</div>' +
    '<div class="err-legend">' +
      (numGram > 0 ? '<span class="legend-chip gram"><span class="dot"></span>' + t("chipGram", {num: numGram}) + '</span>' : '') +
      (numWort > 0 ? '<span class="legend-chip wort"><span class="dot"></span>' + t("chipWort", {num: numWort}) + '</span>' : '') +
      (numZeich > 0 ? '<span class="legend-chip zeichen"><span class="dot"></span>' + t("chipZeich", {num: numZeich}) + '</span>' : '') +
      (numStil > 0 ? '<span class="legend-chip stil"><span class="dot"></span>' + t("chipStil", {num: numStil}) + '</span>' : '') +
    '</div>';
  textCard.appendChild(head);

  // Selector de pestañas para el texto
  const tabRow = document.createElement("div");
  tabRow.className = "tab-pills";
  tabRow.innerHTML =
    '<button class="tab-pill active" id="pill-annotated">' + t("tabAnnotated", {ranges: errorRanges.length, total: errorsList.length}) + '</button>' +
    '<button class="tab-pill" id="pill-clean">' + t("tabClean") + '</button>' +
    (res.corrected_version ? '<button class="tab-pill" id="pill-model">' + t("tabModel") + '</button>' : '') +
    (res.musterloesung ? '<button class="tab-pill" id="pill-muster">' + t("tabMuster") + '</button>' : '');
  textCard.appendChild(tabRow);

  // Caja de texto anotada
  const annotatedBox = document.createElement("div");
  annotatedBox.id = "box-annotated-text";
  annotatedBox.className = "annotated-text-box";

  if(!studentText){
    annotatedBox.innerHTML = '<span class="notice-dim">' + t("noDraftFound") + '</span>';
  } else if(errorRanges.length === 0){
    if(errorsList.length === 0){
      annotatedBox.innerHTML = '<div class="notice-ok">' + t("perfectTextNotice") + '</div>' + esc(studentText);
    } else {
      annotatedBox.innerHTML = esc(studentText);
    }
  } else {
    let htmlPieces = [];
    let lastEnd = 0;
    errorRanges.forEach((range) => {
      if(range.start > lastEnd){
        htmlPieces.push(esc(studentText.slice(lastEnd, range.start)));
      }
      const err = range.err;
      const typeStr = String(err.type || "Grammatik").toLowerCase();
      let typeClass = "err-grammatik";
      let badgeClass = "niedrig";
      if(typeStr.includes("wort")){
        typeClass = "err-wortschatz";
        badgeClass = "mittel";
      } else if(typeStr.includes("zeich") || typeStr.includes("punkt") || typeStr.includes("ortho") || typeStr.includes("rechtschreib")){
        typeClass = "err-zeichensetzung";
        badgeClass = "ok";
      } else if(typeStr.includes("stil") || typeStr.includes("reg")){
        typeClass = "err-stil";
        badgeClass = "tag";
      }

      const errNumber = range.errIdx + 1;
      const pieceHtml =
        '<mark class="err-highlight ' + typeClass + '" data-err-target="err-card-' + range.errIdx + '" title="' + t("popoverClickTitle") + '">' +
          esc(range.text) +
          '<span class="err-badge-num">' + errNumber + '</span>' +
          '<span class="err-popover">' +
            '<span class="err-popover-head">' +
              '<span class="badge ' + badgeClass + '">' + esc(err.type || "Grammatik") + '</span>' +
              '<span class="micro">' + t("popoverCorrectionNum", {num: errNumber}) + '</span>' +
            '</span>' +
            '<span class="err-popover-orig"><s>' + esc(err.original) + '</s></span>' +
            '<span class="err-popover-corr">➔ ' + esc(err.correction) + '</span>' +
            '<span class="err-popover-rule">💡 ' + esc(err.rule_es) + '</span>' +
          '</span>' +
        '</mark>';
      htmlPieces.push(pieceHtml);
      lastEnd = range.end;
    });
    if(lastEnd < studentText.length){
      htmlPieces.push(esc(studentText.slice(lastEnd)));
    }
    annotatedBox.innerHTML = htmlPieces.join("");
  }
  textCard.appendChild(annotatedBox);

  // Caja de texto limpia
  const cleanBox = document.createElement("div");
  cleanBox.id = "box-clean-text";
  cleanBox.className = "annotated-text-box";
  cleanBox.style.display = "none";
  cleanBox.textContent = studentText || t("noText");
  textCard.appendChild(cleanBox);

  // Caja de versión corregida B2
  if(res.corrected_version){
    const modelBox = document.createElement("div");
    modelBox.id = "box-model-text";
    modelBox.className = "annotated-text-box";
    modelBox.style.display = "none";
    modelBox.style.borderLeft = "4px solid var(--acc)";
    modelBox.textContent = res.corrected_version;
    textCard.appendChild(modelBox);
  }

  // Caja de Musterlösung oficial de examen
  if(res.musterloesung){
    const musterBox = document.createElement("div");
    musterBox.id = "box-muster-text";
    musterBox.className = "annotated-text-box";
    musterBox.style.display = "none";
    musterBox.style.borderLeft = "4px solid var(--ok)";
    musterBox.textContent = res.musterloesung;
    textCard.appendChild(musterBox);
  }

  card.appendChild(textCard);

  /* 4 Criterios Oficiales telc B2 */
  const cGrid = document.createElement("div");
  cGrid.className = "crit-grid";
  const critNames = [
    { key: "aufgabenbewaeltigung", title: "I. Aufgabenbewältigung" },
    { key: "angemessenheit", title: "II. Kommunikative Angemessenheit" },
    { key: "korrektheit", title: "III. Formale Richtigkeit" },
    { key: "repertoire", title: "IV. Sprachliche Mittel / Repertoire" }
  ];

  critNames.forEach(cn=>{
    const cData = (res.criteria && res.criteria[cn.key]) || {};
    const box = document.createElement("div");
    box.className = "crit-box";
    const gradeColor = cData.grade === "A" ? "hoch" : (cData.grade === "B" ? "ok" : (cData.grade === "C" ? "mittel" : "niedrig"));
    box.innerHTML = '<div class="ch">' +
                    '<span>' + esc(cn.title) + '</span>' +
                    '<span class="badge ' + gradeColor + '">' + t("gradeLabel", {grade: esc(cData.grade || "-"), score: (cData.score != null ? cData.score : '-'), max: (RUBRICA.max[cn.key] || 22)}) + '</span>' +
                    '</div>' +
                    '<div class="c-body">' + esc(cData.feedback || "") + '</div>';

    /* Si las tres pasadas no coincidieron, ese criterio está en la frontera: es
       información útil, no ruido. */
    if(cData.discrepancia){
      const dud = document.createElement("div");
      dud.className = "micro-block";
      dud.style.marginTop = "6px";
      dud.textContent = t("critUnstable", {bands: cData.discrepancia});
      box.appendChild(dud);
    }

    if(cData.leitpunkte_check && cData.leitpunkte_check.length){
      const lCheck = document.createElement("div");
      lCheck.style.marginTop = "8px";
      lCheck.style.fontSize = "12px";
      lCheck.innerHTML = '<b>' + t("leitpunkteCheckHeader") + '</b>' +
        '<ul class="list-tight xs">' +
        cData.leitpunkte_check.map(lp =>
          '<li>' + (lp.covered ? '<span class="em-ok">✓</span> ' : '<span class="em-bad">✗</span> ') +
          '<b>' + esc(lp.point) + ':</b> ' + esc(lp.comment) + '</li>'
        ).join('') +
        '</ul>';
      box.appendChild(lCheck);
    }
    cGrid.appendChild(box);
  });
  card.appendChild(cGrid);

  /* Errores detallados con sincronización bidireccional */
  if(res.critical_errors && res.critical_errors.length){
    const errSec = document.createElement("div");
    errSec.style.marginTop = "16px";
    errSec.innerHTML = '<h4 class="sec-title">' + t("errorsBreakdownTitle", {count: res.critical_errors.length}) + '</h4>';
    
    res.critical_errors.forEach((err, errIdx)=>{
      const typeStr = String(err.type || "Grammatik").toLowerCase();
      /* La familia del error decide su insignia Y el filo de la tarjeta. El color
         NO se escribe aquí: sale del tema por la clase, si no se queda con los
         valores del mundo anterior y no cambia al cambiar de tema. */
      let badgeClass = "niedrig";
      let familia = "grammatik";
      if(typeStr.includes("wort")){
        badgeClass = "mittel";
        familia = "wortschatz";
      } else if(typeStr.includes("zeich") || typeStr.includes("punkt") || typeStr.includes("ortho") || typeStr.includes("rechtschreib")){
        badgeClass = "ok";
        familia = "zeichensetzung";
      } else if(typeStr.includes("stil") || typeStr.includes("reg")){
        badgeClass = "tag";
        familia = "stil";
      }

      const eb = document.createElement("div");
      eb.className = "err-card err-" + familia;
      eb.id = "err-card-" + errIdx;
      eb.innerHTML =
        '<div class="err-card-head">' +
          '<div class="err-card-head-l">' +
            '<span class="err-idx">#' + (errIdx + 1) + '</span>' +
            '<span class="badge ' + badgeClass + '">' + esc(err.type || "Grammatik") + '</span>' +
          '</div>' +
          '<span class="micro" title="' + t("locateInText") + '">' + t("locateInText") + '</span>' +
        '</div>' +
        '<div class="orig">„' + esc(err.original) + '“</div>' +
        '<div class="corr">➔ ' + esc(err.correction) + '</div>' +
        (err.change ? '<div class="micro micro-cambio">🔁 ' + esc(err.change) + '</div>' : '') +
        '<div class="rule">💡 ' + esc(err.rule_es) + '</div>' +
        (locatedIdx.has(errIdx) ? '' :
          '<div class="micro micro-aviso">⚠ ' + t("errNotLocated") + '</div>');

      eb.onclick = ()=>{
        const highlightEl = document.querySelector('.err-highlight[data-err-target="err-card-' + errIdx + '"]');
        if(highlightEl){
          highlightEl.scrollIntoView({ behavior: "smooth", block: "center" });
          highlightEl.classList.add("active");
          setTimeout(()=>{ highlightEl.classList.remove("active"); }, 2000);
        }
      };

      errSec.appendChild(eb);
    });
    card.appendChild(errSec);
  }

  /* Puntos fuertes y Áreas de mejora */
  const fbRow = document.createElement("div");
  fbRow.className = "crit-grid";
  fbRow.style.marginTop = "16px";

  if(res.strengths && res.strengths.length){
    const stBox = document.createElement("div");
    stBox.className = "crit-box";
    stBox.style.borderLeft = "4px solid var(--ok)";
    stBox.innerHTML = '<b class="em-ok">' + t("strengthsTitle") + '</b>' +
      '<ul class="list-tight sm">' +
      res.strengths.map(s => '<li>' + esc(s) + '</li>').join('') +
      '</ul>';
    fbRow.appendChild(stBox);
  }

  if(res.areas_for_improvement && res.areas_for_improvement.length){
    const impBox = document.createElement("div");
    impBox.className = "crit-box";
    impBox.style.borderLeft = "4px solid var(--warn)";
    impBox.innerHTML = '<b class="em-warn">' + t("areasTitle") + '</b>' +
      '<ul class="list-tight sm">' +
      res.areas_for_improvement.map(i => '<li>' + esc(i) + '</li>').join('') +
      '</ul>';
    fbRow.appendChild(impBox);
  }
  card.appendChild(fbRow);

  /* Versión corregida B2 oficial */
  if(res.corrected_version){
    const cvSec = document.createElement("div");
    cvSec.style.marginTop = "16px";
    cvSec.innerHTML =
      '<div class="sec-head">' +
        '<div>' +
          '<h4 class="cv-title">' + t("optimizedTextTitle") + '</h4>' +
          '<small class="micro">' + t("optimizedTextSub") + '</small>' +
        '</div>' +
        '<button class="copy-btn" id="btn-copy-model">' + t("btnCopyText") + '</button>' +
      '</div>' +
      '<div class="model-text" id="model-text-content">' + esc(res.corrected_version) + '</div>';
    card.appendChild(cvSec);
  }

  if(res.musterloesung){
    const msSec = document.createElement("div");
    msSec.style.marginTop = "16px";
    msSec.innerHTML =
      '<div class="sec-head">' +
        '<div>' +
          '<h4 class="cv-title em-ok">' + t("musterloesungTitle") + '</h4>' +
          '<small class="micro">' + t("musterloesungSub") + '</small>' +
        '</div>' +
        '<button class="copy-btn" id="btn-copy-muster">' + t("btnCopyText") + '</button>' +
      '</div>' +
      '<div class="model-text ok-edge" id="muster-text-content">' + esc(res.musterloesung) + '</div>';
    card.appendChild(msSec);
  }

  /* Botón para borrar evaluación */
  const bDelEval = document.createElement("button");
  bDelEval.className = "btn ghost";
  bDelEval.style.marginTop = "16px";
  bDelEval.textContent = t("btnDeleteEval");
  bDelEval.onclick = ()=>{
    if(confirm(t("confirmDeleteEval"))){
      delEval(v.id);
      saveState();
      pushSchreibenToFirestore(v.id, undefined, null);
      render();
    }
  };
  card.appendChild(bDelEval);

  // Conectar eventos interactivos tras montar el DOM
  setTimeout(()=>{
    const pAnn = document.getElementById("pill-annotated");
    const pCln = document.getElementById("pill-clean");
    const pMod = document.getElementById("pill-model");
    const pMus = document.getElementById("pill-muster");
    const bAnn = document.getElementById("box-annotated-text");
    const bCln = document.getElementById("box-clean-text");
    const bMod = document.getElementById("box-model-text");
    const bMus = document.getElementById("box-muster-text");

    const allPills = [pAnn, pCln, pMod, pMus].filter(Boolean);
    const allBoxes = [bAnn, bCln, bMod, bMus].filter(Boolean);

    function switchTab(activePill, activeBox){
      allPills.forEach(p => { p.className = (p === activePill ? "tab-pill active" : "tab-pill"); });
      allBoxes.forEach(b => { b.style.display = (b === activeBox ? "block" : "none"); });
    }

    if(pAnn && bAnn) pAnn.onclick = ()=> switchTab(pAnn, bAnn);
    if(pCln && bCln) pCln.onclick = ()=> switchTab(pCln, bCln);
    if(pMod && bMod) pMod.onclick = ()=> switchTab(pMod, bMod);
    if(pMus && bMus) pMus.onclick = ()=> switchTab(pMus, bMus);

    // Clic en un highlight para desplazarse a la tarjeta correspondiente
    document.querySelectorAll(".err-highlight").forEach(el => {
      el.onclick = (e)=>{
        e.stopPropagation();
        const targetId = el.getAttribute("data-err-target");
        if(!targetId) return;
        const targetCard = document.getElementById(targetId);
        if(targetCard){
          targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
          targetCard.classList.add("pulse");
          setTimeout(()=>{ targetCard.classList.remove("pulse"); }, 1800);
        }
      };
    });

    const setupCopyBtn = (btnId, text)=>{
      const btn = document.getElementById(btnId);
      if(btn && text){
        btn.onclick = ()=>{
          navigator.clipboard.writeText(text).then(()=>{
            btn.textContent = t("btnCopiedText");
            setTimeout(()=>{ btn.textContent = t("btnCopyText"); }, 2000);
          }).catch(()=>{});
        };
      }
    };
    setupCopyBtn("btn-copy-model", res.corrected_version);
    setupCopyBtn("btn-copy-muster", res.musterloesung);
  }, 15);

  return card;
}

    parts.push("\nWICHTIGE VORGABE ZUR SPRACHE DES FEEDBACKS:");
    parts.push("- Alle Erklärungen der Fehler im Feld `rule_es`, Stärken (`strengths`), Schwächen (`areas_for_improvement`) und das Kriterien-Feedback MÜSSEN auf SPANISCH verfasst werden!");
    parts.push("- Die korrigierte Fassung (`corrected_version`) und die Musterlösung (`musterloesung`) MÜSSEN auf DEUTSCH (B2-Niveau) sein.");
  }

  parts.push("\nAnalysiere nun den Text und gib das strukturierte JSON-Ergebnis gemäß der Schema-Definition zurück.");

  return parts.join('\n');
}

function parseEvaluationJson(rawText){
  let str = (rawText || "").trim();
  const codeBlockMatch = str.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  if(codeBlockMatch && codeBlockMatch[1]){
    str = codeBlockMatch[1].trim();
  } else {
    const firstBrace = str.indexOf('{');
    const lastBrace = str.lastIndexOf('}');
    if(firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace){
      str = str.slice(firstBrace, lastBrace + 1).trim();
    }
  }
  try {
    return JSON.parse(str);
  } catch(e) {
    try {
      const sanitized = str.replace(/,\s*([\]}])/g, '$1');
      return JSON.parse(sanitized);
    } catch(e2){
      throw new Error(t("evalBadJson") + str.slice(0, 260));
    }
  }
}

/* Una pasada al proveedor elegido. Devuelve el JSON crudo, sin normalizar.
   `schemaOverride` permite pedir un esquema pequeño (la caza de errores). */
async function evaluarUnaPasada(config, systemPrompt, userPrompt, schemaOverride){
  if(config.provider === "gemini"){
    const model = config.geminiModel || "gemini-3.5-flash-lite";
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(config.geminiKey);
    const schema = schemaOverride || (DATA.prompt_schreiben && DATA.prompt_schreiben.json_schema);
    const sistema = { system_instruction: { parts: [{ text: systemPrompt }] } };
    const contenido = { contents: [{ parts: [{ text: userPrompt }] }] };
    /* Cadena de reintentos: los Gemma (y otros modelos del catálogo) no aceptan
       response_schema, ni response_mime_type JSON, ni system_instruction. Se cae
       hasta el JSON del prompt, que ya lo exige, antes de rendirse. */
    const intentos = [];
    if(schema){
      intentos.push({ ...sistema, ...contenido, generationConfig: { temperature: 0, response_mime_type: "application/json", response_schema: schema } });
    }
    intentos.push({ ...sistema, ...contenido, generationConfig: { temperature: 0, response_mime_type: "application/json" } });
    intentos.push({ ...sistema, ...contenido, generationConfig: { temperature: 0 } });
    intentos.push({ contents: [{ parts: [{ text: systemPrompt + "\n\n" + userPrompt }] }], generationConfig: { temperature: 0 } });

    let resp = null, detalle = "";
    for(let i = 0; i < intentos.length; i++){
      resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(intentos[i])
      });
      if(resp.ok) break;
      if(resp.status !== 400) break;              // clave, cuota, modelo inexistente: no insistir
      detalle = await resp.clone().text();
      if(i < intentos.length - 1){
        console.warn("Gemini rechazó el intento " + (i + 1) + ", reintento: " + detalle.slice(0, 160));
      }
    }
    if(!resp.ok){
      const errText = detalle || await resp.text();
      let msg = "Error " + resp.status + " de Gemini API";
      try {
        const j = JSON.parse(errText);
        if(j.error && j.error.message) msg += ": " + j.error.message;
      } catch(e){ msg += ": " + errText; }
      throw new Error(msg);
    }
    const data = await resp.json();
    const partes = data?.candidates?.[0]?.content?.parts || [];
    const raw = partes.map(p => p.text || "").join("");
    if(!raw) throw new Error(t("evalGeminiEmpty"));
    return parseEvaluationJson(raw);

  } else if(config.provider === "openai_compatible"){
    let url = (config.customEndpoint || "https://api.deepseek.com").replace(/\/+$/, "");
    if(!url.endsWith("/chat/completions")) url += "/chat/completions";
    /* OpenCode (Go / Console) pide identificar al cliente y una sesión estable;
       sus modelos DeepSeek razonan antes de escribir y necesitan presupuesto. */
    const esOpenCode = /opencode\.ai/.test(url);
    if(esOpenCode && !window.__ocSession){
      window.__ocSession = "b2-quiz-" + Math.random().toString(36).slice(2, 10);
    }
    const cabeceras = {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + config.customKey
    };
    if(esOpenCode) cabeceras["x-opencode-session"] = window.__ocSession;

    const cuerpo = (maxTokens, conFormato) => {
      const body = {
        model: config.customModel || "deepseek-chat",
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: userPrompt }
        ],
        temperature: 0
      };
      if(maxTokens) body.max_tokens = maxTokens;
      if(conFormato) body.response_format = { type: "json_object" };
      if(esOpenCode) body.reasoning_effort = "low";
      return body;
    };
    const enviar = (body) => fetch(url, {
      method: "POST", headers: cabeceras, body: JSON.stringify(body)
    });
    const textoDe = (d) => {
      let c = d?.choices?.[0]?.message?.content;
      if(Array.isArray(c)) c = c.map(p => (typeof p === "string" ? p : (p && p.text) || "")).join("");
      return c;
    };

    let body = cuerpo(16000, true);
    let resp = await enviar(body);
    /* Endpoints que no aceptan un parámetro: se reintenta sin él. */
    if(!resp.ok && (resp.status === 400 || resp.status === 422)){
      let detalle = "";
      try { detalle = await resp.clone().text(); } catch(e){}
      if(/response_format|json_object/i.test(detalle)){
        body = cuerpo(16000, false); resp = await enviar(body);
      } else if(/max_tokens|max_completion_tokens/i.test(detalle)){
        body = cuerpo(0, true); resp = await enviar(body);
      } else if(/reasoning_effort/i.test(detalle)){
        delete body.reasoning_effort; resp = await enviar(body);
      }
    }
    if(!resp.ok){
      const errText = await resp.text();
      let msg = "Error " + resp.status + " de API";
      try {
        const j = JSON.parse(errText);
        if(j.error && (j.error.message || j.error)) msg += ": " + (j.error.message || j.error);
      } catch(e){ msg += ": " + errText; }
      throw new Error(msg);
    }
    let data = await resp.json();
    let raw = textoDe(data);
    /* Se quedó sin tokens razonando (finish_reason "length" y content vacío):
       se repite con el doble de presupuesto en vez de fallar. */
    if((!raw || !String(raw).trim()) && data?.choices?.[0]?.finish_reason === "length"){
      const resp2 = await enviar(cuerpo(32000, true));
      if(resp2.ok){
        data = await resp2.json();
        raw = textoDe(data);
      }
    }
    if(!raw) throw new Error(t("evalApiEmpty"));
    return parseEvaluationJson(raw);

  } else if(config.provider === "ollama"){
    let url = (config.ollamaEndpoint || "http://localhost:11434").replace(/\/+$/, "");
    if(!url.endsWith("/api/chat")) url += "/api/chat";
    const body = {
      model: config.ollamaModel || "llama3.1",
      messages: [
        { role: "system", content: systemPrompt },
        { role: "user", content: userPrompt }
      ],
      format: "json",
      stream: false,
      options: { temperature: 0 }
    };
    let resp;
    try {
      resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
    } catch(e){
      throw new Error(t("evalOllamaOffline", {url: url}));
    }
    if(!resp.ok){
      const errText = await resp.text();
      throw new Error(t("evalOllamaError", {status: resp.status}) + errText);
    }
    const data = await resp.json();
    const raw = data?.message?.content;
    if(!raw) throw new Error(t("evalOllamaEmpty"));
    return parseEvaluationJson(raw);
  }
  throw new Error(t("evalUnknownProvider", {provider: config.provider}));
}

/* Tres pasadas y banda MEDIANA por criterio. Una sola pasada oscila: el mismo
   texto dio 48 y 61 con los mismos cuatro Leitpunkte cubiertos. En paralelo
   tardan lo mismo que una. */
const PASADAS = 3;
const CLAVES_CRITERIO = ["aufgabenbewaeltigung", "angemessenheit", "korrektheit", "repertoire"];
const NIVEL_BANDA = { D: 0, C: 1, B: 2, A: 3 };

function bandaMediana(bandas){
  const orden = bandas.slice().sort((a, b) => (NIVEL_BANDA[a] || 0) - (NIVEL_BANDA[b] || 0));
  return orden[Math.floor(orden.length / 2)];
}

function combinarPasadas(crudos, studentText, totalLeitpunkte, listasExtra){
  const normalizadas = crudos.map(c => normalizeEvaluationResult(c, studentText, totalLeitpunkte));
  const medianas = {}, discrepancia = {};
  CLAVES_CRITERIO.forEach(k=>{
    const bandas = normalizadas.map(n => (n.criteria[k] || {}).grade || "D");
    medianas[k] = bandaMediana(bandas);
    const distintas = Array.from(new Set(bandas));
    discrepancia[k] = distintas.length > 1 ? distintas.join("/") : "";
  });

  /* La pasada que más se acerca a las medianas es la base: así el texto corregido,
     la lista de errores y el feedback salen de UNA evaluación coherente y no de
     una mezcla de tres. */
  let base = normalizadas[0], mejor = Infinity;
  normalizadas.forEach(n=>{
    const d = CLAVES_CRITERIO.reduce((s, k) =>
      s + Math.abs((NIVEL_BANDA[(n.criteria[k] || {}).grade] || 0) - NIVEL_BANDA[medianas[k]]), 0);
    if(d < mejor){ mejor = d; base = n; }
  });

  const conMediana = {};
  CLAVES_CRITERIO.forEach(k=>{
    conMediana[k] = Object.assign({}, base.criteria[k], { grade: medianas[k], discrepancia: discrepancia[k] });
  });

  const puntuado = puntuarCriterios(conMediana.aufgabenbewaeltigung, conMediana.angemessenheit,
                                    conMediana.korrektheit, conMediana.repertoire,
                                    countWords(studentText), totalLeitpunkte);
  const combinado = Object.assign({}, base, {
    criteria: puntuado.criteria,
    score_total: puntuado.score_total,
    verdict: puntuado.verdict,
    pasadas: normalizadas.length
  });

  /* RECALL: antes se mostraban solo los errores de la pasada base y los de las
     otras dos se tiraban. Ahora se unen (más los de la caza de errores), se
     validan y se aplican al texto corregido. */
  const listas = normalizadas.map(n => n.critical_errors || []).concat(listasExtra || []);
  const fusion = fusionarErrores(listas, studentText);
  if(fusion.length){
    combinado.critical_errors = fusion;
    const aplicar = fusion.some(e => comparableText(studentText).indexOf(comparableText(e.original)) === -1)
      || fusion.some(e => comparableText(combinado.corrected_version || "").indexOf(comparableText(e.correction)) === -1);
    if(aplicar){
      const corregido = aplicarCorrecciones(studentText, fusion);
      if(corregido && comparableText(corregido)) combinado.corrected_version = corregido;
    }
  }
  return combinado;
}

/* ---------- Caza de errores (recall) ---------- */
/* Una cuarta llamada, en paralelo con las de puntuación, con un encargo
   estrecho: recorrer el texto frase por frase buscando lo que las pasadas
   generales se dejan. No puntúa ni escribe la versión corregida; si falla, se
   ignora y las tres pasadas siguen valiendo. */

const CAZA_SCHEMA = {
  type: "object",
  required: ["critical_errors"],
  properties: {
    critical_errors: {
      type: "array",
      items: {
        type: "object",
        required: ["original", "correction", "change", "rule_es", "type"],
        properties: {
          original: { type: "string" },
          correction: { type: "string" },
          change: { type: "string" },
          rule_es: { type: "string" },
          type: { type: "string", enum: ["Grammatik", "Wortschatz", "Rechtschreibung", "Zeichensetzung", "Stil", "Satzbau"] }
        }
      }
    }
  }
};

function buildCazaSystemPrompt(){
  return [
    "Du bist deutscher Korrektor für telc B2 (Beruf). Deine EINZIGE Aufgabe ist die Fehlerjagd:",
    "alle sprachlichen Fehler im Text finden. Du bewertest nicht, vergibst keine Punkte und",
    "schreibst keine Musterlösung.",
    "",
    "Regeln:",
    "- `original` wörtlich und zeichengenau, mit den Fehlern des Teilnehmers, als kleinsten",
    "  Abschnitt (höchstens 80 Zeichen). Bei Groß-/Kleinschreibung oder einem Buchstaben nur",
    "  das betroffene Wort zitieren.",
    "- `correction`: genau EINE korrigierte Fassung, keine Alternativen («/», «oder»).",
    "- `change`: ein Halbsatz, was sich ändert (Deutsch zitiert).",
    "- `rule_es`: die Regel, die genau diesen Delta erklärt, auf Spanisch bzw. Russisch.",
    "- Erfinde nichts: was du nicht wörtlich belegst, ist kein Fehler. Lieber einen Fehler",
    "  übersehen als einen erfinden.",
    "- Antworte ausschließlich mit JSON: {\"critical_errors\": [...]}."
  ].join("\n");
}

function buildCazaUserPrompt(studentText){
  const parts = [
    "### FEHLERJAGD — Text (telc B2 Beruf):",
    "\"\"\"\n" + studentText + "\n\"\"\"",
    "",
    "Prüfe JEDEN Satz in dieser Reihenfolge und melde nur, was wörtlich dasteht:",
    "1. Hat jeder Hauptsatz ein finites Verb? Isoliert stehende Nebensätze und",
    "   Satzfragmente sind Satzbaufehler.",
    "2. Hat jede dass-/wenn-/weil-Konstruktion das konjugierte Verb am Ende?",
    "3. Erstes Wort nach der Anrede: klein, wenn es kein Nomen und kein «Sie»/«Ihr» ist.",
    "4. Präposition und Kasus (zu + Dat., für + Akk., an + Dat. …), Artikel und Genus.",
    "5. Kommas: vor dass/weil/wenn ja; zwischen zwei Nebensätzen mit «und» nein.",
    "6. Groß-/Kleinschreibung: Adjektive klein, substantivierte Adjektive groß.",
    "7. Register: umgangssprachlich statt beruflich → Stil.",
    "",
    "Melde höchstens 12 Einträge. Ist der Text fehlerfrei, gib eine leere Liste zurück.",
    "Antworte als JSON-Objekt mit dem Schlüssel «critical_errors»."
  ];
  if(currentLang === "ru"){
    parts.push("", "`rule_es` und `change` MÜSSEN AUF RUSSISCH sein.");
  } else {
    parts.push("", "`rule_es` und `change` MÜSSEN auf SPANISCH sein.");
  }
  return parts.join("\n");
}

async function cazarErrores(config, studentText){
  if(!studentText) return [];
  const res = await evaluarUnaPasada(config, buildCazaSystemPrompt(),
                                     buildCazaUserPrompt(studentText), CAZA_SCHEMA);
  return Array.isArray(res && res.critical_errors) ? res.critical_errors : [];
}

/* Una tarjeta solo vale si se puede comprobar: la cita está en el texto, el span
   es corto, la corrección es una y cambia algo. Así caen las inventadas
   («daß diese Person» en un texto que decía «dass»). */
function errorValido(err, studentText){
  if(!err || typeof err !== "object") return false;
  const original = comparableText(err.original);
  const correction = comparableText(err.correction);
  if(!original || !correction || original === correction) return false;
  if(original.length > 160) return false;
  if(/\s\/\s/.test(correction)) return false;
  if(/\soder\s/.test(correction) && !/\soder\s/.test(original)) return false;
  if(!String(err.change || "").trim()) return false;
  if(!findErrorRanges(studentText, [err]).length) return false;
  return true;
}

function fusionarErrores(listas, studentText){
  const posicionados = [];
  (listas || []).forEach(lista => (lista || []).forEach(e => {
    if(!errorValido(e, studentText)) return;
    const r = findErrorRanges(studentText, [e])[0];
    posicionados.push({ err: e, start: r ? r.start : 0, end: r ? r.end : 0 });
  }));
  posicionados.sort((a, b) => a.start - b.start || (a.end - a.start) - (b.end - b.start));
  const out = [];
  posicionados.forEach(item => {
    if(out.some(o => item.start < o.end && item.end > o.start)) return;  // solape: gana el más corto
    out.push(item);
  });
  return out.map(o => o.err);
}

function aplicarCorrecciones(texto, errores){
  const rangos = findErrorRanges(texto, errores).sort((a, b) => a.start - b.start);
  let out = "", cursor = 0;
  rangos.forEach(r => {
    if(r.start < cursor) return;               // solapado: ya aplicado
    out += texto.slice(cursor, r.start) + cleanQuotes(r.err.correction);
    cursor = r.end;
  });
  out += texto.slice(cursor);
  return out;
}

async function evaluateWithLLM(task, studentText, onProgress){
  const config = getAIConfig();
  const systemPrompt = DATA.prompt_schreiben?.system_prompt || "";
  const userPrompt = buildUserPromptClient(task, studentText);

  if(onProgress){
    const etiqueta = config.provider === "gemini"
      ? t("evalProgressGemini", {model: config.geminiModel})
      : (config.provider === "ollama"
        ? t("evalProgressOllama", {model: config.ollamaModel})
        : t("evalProgressCustom", {model: config.customModel, endpoint: config.customEndpoint}));
    onProgress(etiqueta + " · " + t("evalProgressPasadas", {n: PASADAS}));
  }

  /* allSettled: si una pasada falla (red, cuota), las otras siguen valiendo. Con
     una sola respuesta se usa esa; sin ninguna, el error. La cuarta llamada es la
     caza de errores: no puntúa, solo aporta tarjetas. */
  const trabajos = Array.from({ length: PASADAS }, () => evaluarUnaPasada(config, systemPrompt, userPrompt));
  trabajos.push(cazarErrores(config, studentText));
  const resultados = await Promise.allSettled(trabajos);
  const crudos = resultados.slice(0, PASADAS)
    .filter(r => r.status === "fulfilled").map(r => r.value);
  if(!crudos.length){
    const fallo = resultados.find(r => r.status === "rejected");
    throw (fallo && fallo.reason) || new Error(t("evalUnknownProvider", {provider: config.provider}));
  }
  const caza = resultados[PASADAS] && resultados[PASADAS].status === "fulfilled"
    ? resultados[PASADAS].value : [];

  if(onProgress) onProgress(t("evalProgressCombinando"));
  return combinarPasadas(crudos, studentText, (task.leitpunkte || []).length,
                         caza.length ? [caza] : []);
}

  let clavesVisibles = false;

     guardaba en el proveedor que NO estaba elegido: al reabrir el modal se veía
     el campo vacío y parecía que se había borrado. */
  const elegirProveedorAlPegar = (idCampo, valor)=>{
    const campo = document.getElementById(idCampo);
    if(!campo || typeof campo.addEventListener !== "function") return;
    campo.addEventListener("input", ()=>{
      if(campo.value.trim() && prov.value !== valor){
        prov.value = valor;
        prov.onchange();
      }
    });
  };

  const btnCopyLink = document.getElementById("btn-copy-room-link");
  if(btnCopyLink) btnCopyLink.onclick = ()=>{

    const url = location.origin + location.pathname + "?user=diana&room=" + encodeURIComponent(currentRoomId);
    navigator.clipboard.writeText(url).then(()=>{
      btnCopyLink.textContent = t("btnCopyPartnerLinkDone");
      setTimeout(()=>{ btnCopyLink.textContent = t("btnCopyPartnerLink"); }, 2500);

    if(roomIdInput){

      try {
        const parsed = parseFirebaseConfig(fbRaw);
        if(!parsed || !parsed.apiKey || !parsed.projectId) throw new Error(t("cfgMissingKeys"));

        initFirebase();
      } catch(err){
        alert(t("alertBadFirebase") + err.message);

      saveFirebaseConfig(null);
      fbDb = null;
      fbSyncStatus = "local";
      updateCloudStatusUI();

    closeModal();
    alert(aiKeyOf(newCfg) || newCfg.provider === "ollama" ? t("alertAiSaved") : t("alertAiSavedNoKey"));

  /* Exportar / importar progreso */
  const btnExportProg = document.getElementById("btn-export-progress");
  if(btnExportProg) btnExportProg.onclick = ()=>{
    const res = document.getElementById("import-result");
    if(res) res.innerHTML = exportProgress() ? '<span class="em-ok">' + t("exportDone") + '</span>' : "";

  /* Borrar todo el progreso: aquí dentro, con confirmación, y nunca de un clic
     desde la barra principal. */
  const btnBorrarTodo = document.getElementById("btn-delete-all-progress");
  if(btnBorrarTodo) btnBorrarTodo.onclick = ()=>{
    const res = document.getElementById("import-result");
    const n = Object.keys(state.answers).length;
    const b = Object.keys(state.schreiben_drafts).length;
    if(!n && !b){ if(res) res.innerHTML = t("nothingToDelete"); return; }
    if(!confirm(t("confirmDeleteAll", { n: n, b: b }))) return;
    aplicarProgreso({});
    if(res) res.innerHTML = '<span class="em-ok">' + t("deleteAllDone") + '</span>';
  };

  const btnImportProg = document.getElementById("btn-import-progress");
  const fileImportProg = document.getElementById("file-import-progress");
  if(btnImportProg && fileImportProg) btnImportProg.onclick = ()=> fileImportProg.click();
  if(fileImportProg) fileImportProg.onchange = ()=>{
    const res = document.getElementById("import-result");
    const f = fileImportProg.files && fileImportProg.files[0];
    if(!f) return;
    const lector = new FileReader();
    lector.onerror = ()=>{ if(res) res.innerHTML = '<span class="em-bad">' + t("importError", { error: "no se pudo leer el fichero" }) + '</span>'; };
    lector.onload = ()=>{
      try {
        const datos = JSON.parse(String(lector.result));
        const prog = datos && (datos.progreso || datos.state || datos);
        if(!prog || !prog.answers) throw new Error(t("importNoProgress"));
        const n = Object.keys(prog.answers).length;
        const d = Object.keys(prog.schreiben_drafts || {}).length;
        if(!confirm(t("importConfirm", { n: n, d: d }))) return;
        const r = aplicarProgreso(prog, datos && datos.usuario);
        if(res) res.innerHTML = '<span class="em-ok">' + t("importOk", { n: r.respuestas, d: r.borradores }) + '</span>';
      } catch(e){
        if(res) res.innerHTML = '<span class="em-bad">' + t("importError", { error: esc(e.message) }) + '</span>';

      const fbRaw = document.getElementById("cfg-firebase-json")?.value.trim() || "";

        resSpan.innerHTML = '<span class="em-warn">' + t("alertEnterKey") + '</span>';
        return;
      }
      try {
        const parsed = parseFirebaseConfig(fbRaw);
        if(!parsed.apiKey || !parsed.projectId) throw new Error(t("fbMissingFields"));
        if(typeof firebase === "undefined") throw new Error(t("fbNoSdk"));
        if(!firebase.apps || !firebase.apps.length){
          firebase.initializeApp(parsed);
        }
        /* Prueba real: escribe y relee el mismo tipo de campo que usa la app, en la
           sala de verdad. Antes escribía en la sala fija "sergio-diana" y trataba
           "permission-denied" como éxito, así que unas reglas mal publicadas seguían
           diciendo "conexión correcta". El documento "_test_ping" no lo lee la app
           (listar está prohibido y solo pide ids de tareas conocidas). */
        const testDb = firebase.firestore();
        const pingField = currentUser === "sergio" ? "sergio_updated_at" : "diana_updated_at";
        const ping = testDb.collection("rooms").doc(currentRoomId)
          .collection("schreiben").doc("_test_ping");
        await ping.set({ [pingField]: Date.now() }, { merge: true });
        const readBack = await ping.get();
        if (!readBack.exists) throw new Error(t("fbNoReadBack"));
        resSpan.innerHTML = '<span class="em-ok">' + t("firebaseSuccess") + '</span>';

        resSpan.innerHTML = '<span class="em-bad">' + t("firebaseFailed", {error: e.message}) + '</span>';
      }
    };

  /* Lista de modelos reales de la clave: acaba con los 404 por identificadores
     inventados (Gemma, versiones nuevas, etc.). */
  const btnListModels = document.getElementById("btn-list-models");
  if(btnListModels) btnListModels.onclick = async ()=>{
    const caja = document.getElementById("models-box");
    const cfg = readAIConfigFromModal();
    if(!cfg.geminiKey){ caja.textContent = t("alertEnterGeminiKey"); return; }
    caja.innerHTML = '<span class="micro">' + t("testTesting") + '</span>';
    try {
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=" +
                            encodeURIComponent(cfg.geminiKey));
      if(!r.ok) throw new Error("HTTP " + r.status + ": " + (await r.text()).slice(0, 120));
      const data = await r.json();
      const modelos = (data.models || [])
        .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
        .map(m => ({ id: String(m.name || "").replace(/^models\//, ""), nombre: String(m.displayName || "") }))
        .filter(m => m.id)
        .sort((a, b) => a.id.localeCompare(b.id));
      if(!modelos.length){ caja.textContent = t("modelsNone"); return; }
      const sel = document.createElement("select");
      sel.className = "select";
      sel.innerHTML = '<option value="">' + t("modelsPick", {n: modelos.length}) + '</option>' +
        modelos.map(m => '<option value="' + esc(m.id) + '">' +
          (m.nombre && m.nombre !== m.id ? esc(m.nombre) + " · " + esc(m.id) : esc(m.id)) +
          '</option>').join("");
      sel.onchange = ()=>{
        if(sel.value){
          const campo = document.getElementById("cfg-gemini-model");
          if(campo) campo.value = sel.value;
        }
      };
      caja.innerHTML = "";
      caja.appendChild(sel);
      caja.insertAdjacentHTML("beforeend", '<small class="micro">' + t("modelsGemmaHint") + '</small>');
    } catch(e){
      caja.textContent = t("testFailed", {error: esc(errorDeRed(e))});

  document.getElementById("btn-test-connection").onclick = async ()=>{
    const testRes = document.getElementById("test-result");
    testRes.innerHTML = '<span class="micro">' + t("testTesting") + '</span>';
    const tempCfg = readAIConfigFromModal();
    /* Probar también guarda: así nadie se queda con la clave sin guardar. */
    const guardadoAlProbar = saveAIConfig(tempCfg);
    try {
      if(tempCfg.provider === "gemini"){
        if(!tempCfg.geminiKey) throw new Error(t("alertEnterGeminiKey"));
        const u = "https://generativelanguage.googleapis.com/v1beta/models/" + tempCfg.geminiModel + ":generateContent?key=" + encodeURIComponent(tempCfg.geminiKey);
        const r = await fetch(u, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ contents: [{ parts: [{ text: "Antworte kurz mit OK." }] }] })
        });
        if(!r.ok) throw new Error("HTTP " + r.status + ": " + (await r.text()).slice(0, 100));
      } else if(tempCfg.provider === "openai_compatible"){
        if(!tempCfg.customKey) throw new Error(t("alertEnterKey"));
        let u = tempCfg.customEndpoint.replace(/\/+$/, "");
        if(!u.endsWith("/chat/completions")) u += "/chat/completions";
        const cab = {"Content-Type": "application/json", "Authorization": "Bearer " + tempCfg.customKey};
        /* OpenCode (Go) quiere sesión identificada también en la prueba. */
        if(/opencode\.ai/.test(u)){
          if(!window.__ocSession) window.__ocSession = "b2-quiz-" + Math.random().toString(36).slice(2, 10);
          cab["x-opencode-session"] = window.__ocSession;
        }
        const r = await fetch(u, {
          method: "POST",
          headers: cab,
          body: JSON.stringify({ model: tempCfg.customModel, max_tokens: 64,
                                 messages: [{role: "user", content: "Antworte kurz mit OK."}] })
        });
        if(!r.ok) throw new Error("HTTP " + r.status + ": " + (await r.text()).slice(0, 140));
      } else if(tempCfg.provider === "ollama"){
        let u = tempCfg.ollamaEndpoint.replace(/\/+$/, "") + "/api/tags";

/* ---------- Renderizador de ítems de preguntas ---------- */
function detailsPanel(summary, text, abierto){
  const d = document.createElement("details");
  d.className = "panel passage";
  /* En los ejercicios de huecos el texto ES la referencia del examen (la carta con
     los huecos), así que se abre solo. Lo declara el dato con `passageOpen`. */
  d.open = !!abierto;
  const s = document.createElement("summary");
  s.textContent = summary;
  const b = document.createElement("div");
  b.className = "passage-body";
  b.innerHTML = conHuecos(text);
  d.appendChild(s); d.appendChild(b);
  return d;
}

function renderItem(v, it){
  const key = ansKey(v, it);
  const chosen = state.answers[key];
  const answered = chosen !== undefined && chosen !== "__revealed__";
  const revealed = chosen === "__revealed__";
  /* Sin clave (Hören de los Modeltests): no hay letra correcta ni veredicto. */
  const sinClave = v.kind === "ohne-key";
  const correctLetter = sinClave ? "" : itemAnswerLetter(it);

  const div = document.createElement("div");
  div.className = "q";

  const promptId = "p-" + String(key).replace(/[^A-Za-z0-9_-]/g, "-");
  const head = document.createElement("div");
  head.innerHTML = '<span class="num">' + (it._label || it.n) + '</span>' +
                   '<span class="prompt" id="' + promptId + '">' + conHuecos(it.prompt) + '</span>';
  div.appendChild(head);

  const isMatching = v.kind === "zuordnung" ||
    (sinClave && !!(v.options && v.options.length));

  /* Letras ya gastadas por OTRO enunciado de esta variante. Se leen del estado del
     usuario, nunca de la clave: el panel sigue sin decir cuál es la respuesta. */
  const gastadas = {};
  (v.items || []).forEach(o=>{
    if(o === it) return;
    const a = state.answers[ansKey(v, o)];
    if(a !== undefined && a !== "__revealed__") gastadas[String(a).toLowerCase()] = o;
  });

  if(isMatching){
    const letters = document.createElement("div");
    letters.className = "letters";
    setAttr(letters, "role", "radiogroup");
    setAttr(letters, "aria-labelledby", promptId);
    /* La misma información que el tooltip, visible y alcanzable con el teclado. */
    const peek = document.createElement("div");
    peek.className = "letters-peek";
    peek.innerHTML = "";
    setAttr(peek, "aria-hidden", "true");
    const opts = v.options||[];
    const botones = [];
    opts.forEach((o, i)=>{
      const k = String(o.key);
      const bajo = k.toLowerCase();
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = k;
      const titulo = ((o.title ? o.title + " — " : "") + (o.text || "")).trim();
      b.title = k + ") " + titulo.slice(0, 140);
      /* El nombre accesible dice la letra Y de qué anuncio es: «a» no dice nada. */
      setAttr(b, "aria-label", k + ") " + titulo.slice(0, 120) +
        (gastadas[bajo] ? " · " + t("takenBy", {n: (gastadas[bajo]._label || gastadas[bajo].n)}) : ""));
      setAttr(b, "role", "radio");
      setAttr(b, "aria-checked", String(chosen||"").toLowerCase() === bajo ? "true" : "false");
      setAttr(b, "data-key", key + ":" + bajo);
      b.className = "";
      if(!sinClave && answered && String(chosen).toLowerCase() === bajo){
        b.className = (bajo===correctLetter) ? "correct" : "wrong";
      }
      if(sinClave && answered && String(chosen).toLowerCase() === bajo) b.className = "chosen";
      if(!sinClave && (answered||revealed) && bajo===correctLetter) b.className = "correct";
      /* Estado que antes no existía y que el CSS declaraba sin que nadie pudiera
         verlo: la letra ya cogida por otro enunciado. Sigue siendo pulsable
         (puedes reasignarla), pero se ve. */
      if(!answered && !revealed && gastadas[bajo]) b.className = "taken";
      /* Roving tabindex: un tabulador por fila y las flechas para recorrerla; en
         vez de ocho tabulaciones por enunciado. Siempre hay exactamente uno. */
      b.tabIndex = (String(chosen||"").toLowerCase() === bajo ||
                    (chosen === undefined && i === 0) ||
                    (revealed && bajo === correctLetter)) ? 0 : -1;
      b.onclick = ()=> commitAnswer(key, it, bajo);
      /* Peek: la letra enciende su anuncio y escribe debajo cuál es. */
      const mostrar = ()=>{
        peekAd(bajo);
        peek.innerHTML = '<b>' + esc(k) + ')</b> ' + esc(titulo.slice(0, 160));
      };
      const ocultar = ()=>{ clearPeek(); peek.innerHTML = ""; };
      b.onmouseenter = mostrar;
      b.onmouseleave = ocultar;
      b.onfocus = mostrar;
      b.onblur = ocultar;
      b.onkeydown = (e)=> teclasGrupo(e, botones, i);
      botones.push(b);
      letters.appendChild(b);
    });
    /* «x» para la pregunta que no tiene consejo (Lesen T3 de los Modeltests). */
    if(v.allowNone){
      const bx = document.createElement("button");
      bx.type = "button";
      bx.textContent = "x";
      bx.title = t("noTip");
      setAttr(bx, "aria-label", t("noTip"));
      setAttr(bx, "role", "radio");
      setAttr(bx, "aria-checked", String(chosen||"").toLowerCase() === "x" ? "true" : "false");
      setAttr(bx, "data-key", key + ":x");
      bx.className = "letter-none";
      if(!sinClave && answered && String(chosen).toLowerCase() === "x"){
        bx.className += (correctLetter === "x") ? " correct" : " wrong";
      }
      if(!sinClave && (answered||revealed) && correctLetter === "x") bx.className += " correct";
      if(!answered && !revealed && gastadas["x"]) bx.className += " taken";
      bx.tabIndex = (String(chosen||"").toLowerCase() === "x" ||
                     (chosen === undefined && (v.options||[]).length === 0)) ? 0 : -1;
      bx.onclick = ()=> commitAnswer(key, it, "x");
      const mostrarX = ()=>{ peek.innerHTML = '<b>x)</b> ' + esc(t("noTip")); };
      const ocultarX = ()=>{ clearPeek(); peek.innerHTML = ""; };
      bx.onmouseenter = mostrarX;
      bx.onmouseleave = ocultarX;
      bx.onfocus = mostrarX;
      bx.onblur = ocultarX;
      bx.onkeydown = (e)=> teclasGrupo(e, botones, botones.length);
      botones.push(bx);
      letters.appendChild(bx);
    }
    div.appendChild(letters);
    div.appendChild(peek);
  } else {
    const opts = document.createElement("div");
    opts.className = "opts";
    setAttr(opts, "role", "radiogroup");
    setAttr(opts, "aria-labelledby", promptId);
    const botones = [];
    (it.options||[]).forEach((o, i)=>{
      const k = String(o.key);
      const tf = it.type === "truefalse" || /^(richtig|falsch)$/i.test(k);
      const isCorrect = k.toLowerCase() === correctLetter;
      const isChosen = answered && String(chosen).toLowerCase() === k.toLowerCase();
      /* Botón de verdad: antes era un <div onclick> sin tabindex ni role, así que
         ningún ítem que no fuera de emparejar se podía contestar con el teclado. */
      const el = document.createElement("button");
      el.type = "button";
      setAttr(el, "role", "radio");
      setAttr(el, "aria-checked", isChosen ? "true" : "false");
      setAttr(el, "data-key", key + ":" + k.toLowerCase());
      el.className = "opt";
      if(!sinClave && (answered || revealed)){
        if(isCorrect) el.className += " correct";
        else if(isChosen) el.className += " wrong";
      }
      if(sinClave && isChosen) el.className += " chosen";
      el.tabIndex = (isChosen || (chosen === undefined && i === 0) ||
                     (revealed && isCorrect)) ? 0 : -1;
      el.innerHTML = tf
        ? '<span class="key">' + (isCorrect && (answered||revealed) ? "✓" : "•") + '</span><span>' + esc(o.text||k) + '</span>'
        : '<span class="key">' + esc(k) + ')</span><span>' + esc(o.text||"") + '</span>';
      el.onclick = ()=> commitAnswer(key, it, k);
      el.onkeydown = (e)=> teclasGrupo(e, botones, i);
      botones.push(el);
      opts.appendChild(el);
    });
    div.appendChild(opts);
  }

  if(!sinClave && (answered || revealed)){
    const good = answered && String(chosen).toLowerCase() === correctLetter;
    const fb = document.createElement("div");
    fb.className = "fb show " + (good ? "good" : "bad");
    let verdict;
    if(revealed) verdict = t("correctAnswerIs", {letter: correctLetter});
    else if(good) verdict = t("correctVerdict");
    else verdict = t("wrongVerdict", {letter: correctLetter});
    const conf = (it.confidence||"mittel").toLowerCase();
    const confLabel = formatConfidence(conf);
    let traduccion = "";
    if(isMatching && v.options){
      const optLabel = k => {
        const o = (v.options||[]).find(x => String(x.key).toLowerCase() === k);
        return o ? k + ") " + (o.title || (o.text||"").slice(0,60)) : k;
      };
      if(answered && !good) traduccion = t("youChose", {chosen: esc(optLabel(String(chosen).toLowerCase()))});
      traduccion += t("correctIs", {correct: esc(optLabel(correctLetter))});
    }
    fb.innerHTML =
      '<div class="verdict">' + verdict +
        '<span class="badge ' + conf + '">' + t("confidenceBadge", {conf: confLabel}) + '</span>' +
        (it.verified ? '<span class="badge ok">' + t("secondReadingBadge") + '</span>' : '') +
        (chosen === "__revealed__" ? '<span class="badge tag">' + t("revealedBadge") + '</span>' : '') +
      '</div>' +
      (traduccion ? '<div class="translation">' + traduccion + '</div>' : '') +
      (it.quote ? '<div class="quote">„' + conHuecos(it.quote) + '“</div>' : '') +
      '<div>' + esc(explainOf(it)) + '</div>';
    div.appendChild(fb);
    /* Deshacer por ítem: contestar sigue siendo de un clic, pero deja de ser
       irreversible salvo borrando el ejercicio entero. */
    const borrar = document.createElement("button");
    borrar.type = "button";
    borrar.className = "btn ghost sm";
    borrar.textContent = t("clearItem");
    borrar.onclick = ()=>{
      delete state.answers[key];
      saveState();
      focusTrasRender = null;
      render();
      announce(t("srCleared"));
    };
    /* Dentro del bloque de corrección, no del ítem: así alinea con su texto y se
       esconde con él cuando no hay nada que borrar. */
    fb.appendChild(borrar);
  }
  return div;
}

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ---------- Utilidades de DOM ----------
   Las pruebas de humo y de seguridad ejecutan este script con un DOM mínimo que
   no implementa classList, setAttribute, focus, getAttribute ni matchMedia. Todo
   lo que dependa de esas APIs pasa por aquí: la app se comporta igual en el
   navegador y en las pruebas, sin ramas de «modo test» dentro del render. */
function setAttr(el, name, value){
  if(el && typeof el.setAttribute === "function") el.setAttribute(name, value);
}
function getAttr(el, name){
  if(el && typeof el.getAttribute === "function") return el.getAttribute(name);
  return undefined;
}
function hasClass(el, cls){
  return String((el && el.className) || "").split(/\s+/).indexOf(cls) !== -1;
}
function toggleClass(el, cls, on){
  if(!el) return;
  if(el.classList && typeof el.classList.add === "function"){
    if(on) el.classList.add(cls); else el.classList.remove(cls);
    return;
  }
  const partes = String(el.className || "").split(/\s+/).filter(Boolean).filter(c => c !== cls);
  if(on) partes.push(cls);
  el.className = partes.join(" ");
}
function focusEl(el){
  if(el && typeof el.focus === "function"){ try { el.focus({preventScroll:true}); } catch(e){ el.focus(); } }
}
function announce(texto){
  const n = document.getElementById("sr-status");
  if(n) n.textContent = texto;
}
function prefiereMenosMovimiento(){
  try {
    return typeof window.matchMedia === "function" &&
           window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch(e){ return false; }
}

/* ---------- Mesa de examen: conmutador y «peek» del anuncio ----------
   `adNodes` guarda letra → anuncio del panel de referencia para encender el que
   corresponde a la letra que tienes debajo del ratón o del foco. Es un índice en
   memoria, no una consulta al documento, porque el DOM de las pruebas no tiene
   querySelector. Se rehace en cada render. */
let adNodes = {};
function clearPeek(){
  Object.keys(adNodes).forEach(k => toggleClass(adNodes[k], "peek", false));
}
function peekAd(letra){
  const clave = String(letra || "").toLowerCase();
  Object.keys(adNodes).forEach(k => toggleClass(adNodes[k], "peek", k === clave));
  const ad = adNodes[clave];
  if(!ad) return;
  /* Si el anuncio queda fuera del panel (que tiene su propio scroll), se acerca
     lo mínimo: `nearest` y respetando a quien pidió menos movimiento. */
  const panel = ad.parentNode;
  if(typeof ad.getBoundingClientRect !== "function" || typeof ad.scrollIntoView !== "function") return;
  if(!panel || typeof panel.getBoundingClientRect !== "function") return;
  const a = ad.getBoundingClientRect(), p = panel.getBoundingClientRect();
  if(a.top < p.top || a.bottom > p.bottom){
    try {
      ad.scrollIntoView({block:"nearest", behavior: prefiereMenosMovimiento() ? "auto" : "smooth"});
    } catch(e){}
  }
}
function updateDeskUI(){
  const b = document.getElementById("desk-toggle");
  if(!b) return;
  const on = hasClass(document.getElementById("main"), "desk");
  b.textContent = t("deskToggle");
  b.title = t("deskToggleTitle");
  b.className = on ? "btn" : "btn ghost";
  setAttr(b, "aria-pressed", on ? "true" : "false");
}

/* ---------- Foco y avisos al contestar ----------
   El render vacía #main entero, así que el control pulsado desaparecía y el foco
   caía al <body>: para la siguiente pregunta había que tabular desde la cabecera.
   `focusTrasRender` recuerda qué control devolver al foco y `restaurarFoco` lo
   busca recorriendo hijos (sin querySelector, que el DOM de las pruebas no tiene). */
let focusTrasRender = null;
function restaurarFoco(){
  if(!focusTrasRender) return;
  const clave = focusTrasRender;
  focusTrasRender = null;
  const main = document.getElementById("main");
  if(!main || !main.children) return;
  const pila = [main];
  let encontrado = null;
  while(pila.length && !encontrado){
    const el = pila.pop();
    if(getAttr(el, "data-key") === clave) encontrado = el;
    if(el && el.children) for(const c of el.children) pila.push(c);
  }
  focusEl(encontrado);
}
/* Contestar: guarda, repinta, devuelve el foco y cuenta lo que ha pasado por la
   región viva (los veredictos llevan <b>, así que el aviso usa frases propias). */
function commitAnswer(clave, item, valor){
  const cambio = state.answers[clave] !== valor;
  state.answers[clave] = valor;
  saveState();
  focusTrasRender = clave + ":" + String(valor).toLowerCase();
  render();
  if(!cambio) return;
  /* Sin clave no hay acierto que anunciar: sólo se guarda la elección. */
  if(item && item._sinClave){ announce(t("noKeyAnswer")); return; }
  const letra = itemAnswerLetter(item);
  announce(String(valor).toLowerCase() === letra ? t("srRight") : t("srWrong", {letter: letra}));
}
/* Un radiogroup se recorre con las flechas, no con ocho Tabs. Elegir confirma,
   que es exactamente lo que promete role="radio". */
function teclasGrupo(e, botones, i){
  if(!e || !botones || botones.length < 2) return;
  const n = botones.length;
  let destino = null;
  if(e.key === "ArrowRight" || e.key === "ArrowDown") destino = (i + 1) % n;
  else if(e.key === "ArrowLeft" || e.key === "ArrowUp") destino = (i - 1 + n) % n;
  else if(e.key === "Home") destino = 0;
  else if(e.key === "End") destino = n - 1;
  else return;
  if(typeof e.preventDefault === "function") e.preventDefault();
  const b = botones[destino];
  if(b && typeof b.onclick === "function") b.onclick(); else focusEl(b);
}

/* Los huecos de los Sprachbausteine se guardan como «46 ( )», para que las citas
   sigan siendo literales y comprobables. Al pintarlos se cambian por una raya con
   el número en color: en el examen se escribe encima del hueco, y un paréntesis
   vacío se lee mal y no se ve dónde hay que escribir. */
function conHuecos(texto){
  return esc(texto).replace(/(\d{2})\s*\(\s*\)/g,
    '<span class="gap"><span class="gap-n">$1</span><span class="gap-line"></span></span>');
}
window.conHuecos = conHuecos;

}
