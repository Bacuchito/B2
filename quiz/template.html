/* ---------- Mando deslizante de los controles segmentados ----------
   Mide la opción encendida y coloca el mando ahí; al cambiar de opción, el mando
   se desliza con curva de resorte en vez de encenderse y apagarse de golpe.
   Si no se puede medir (DOM simulado de las pruebas), se quita la clase y la
   opción activa se marca con su propio relleno: nunca se queda sin señal. */
function colocarMandos(){
  if (typeof document.querySelectorAll !== "function") return;
  const cajas = document.querySelectorAll(".lang-switch, .user-switch, .tab-pills");
  for (const caja of cajas){
    const activo = (typeof caja.querySelector === "function")
      ? caja.querySelector('[aria-pressed="true"], .active') : null;
    const medible = activo && typeof activo.offsetLeft === "number" && activo.offsetWidth > 0;
    /* Si la opción activa ha caído en otra fila (el control se partió en móvil),
       el mando no puede deslizar en línea: se deja el relleno de siempre. */
    const enLaMismaFila = medible && caja.children.length &&
      activo.offsetTop === caja.children[0].offsetTop;
    if (!medible || !enLaMismaFila || !caja.style || typeof caja.style.setProperty !== "function"){
      toggleClass(caja, "con-mando", false);
      continue;
    }
    toggleClass(caja, "con-mando", true);
    caja.style.setProperty("--mando-x", activo.offsetLeft + "px");
    caja.style.setProperty("--mando-w", activo.offsetWidth + "px");
    /* Su fila y su alto, no los del carril: si el control se parte en dos filas, el
       mando tiene que cubrir solo la de la opción encendida. */
    caja.style.setProperty("--mando-y", activo.offsetTop + "px");
    caja.style.setProperty("--mando-h", activo.offsetHeight + "px");
  }
}

/* ---------- Renderizador de ítems de preguntas ---------- */
function detailsPanel(summary, text, abierto){
  const d = document.createElement("details");
  d.className = "panel passage";
  /* En los ejercicios de huecos el texto ES la referencia del examen (la carta con
     los huecos), así que se abre solo. Lo declara el dato con `passageOpen`. */
  d.open = !!abierto;
  const s = document.createElement("summary");
  s.textContent = summary;
  const b = document.createElement("div");
  b.className = "passage-body";
  b.innerHTML = conHuecos(text);
  d.appendChild(s); d.appendChild(b);
  return d;
}

function renderItem(v, it){
  const key = ansKey(v, it);
  const chosen = state.answers[key];
  const answered = chosen !== undefined && chosen !== "__revealed__";
  const revealed = chosen === "__revealed__";
  const correctLetter = itemAnswerLetter(it);

  const div = document.createElement("div");
  div.className = "q";

  const promptId = "p-" + String(key).replace(/[^A-Za-z0-9_-]/g, "-");
  const head = document.createElement("div");
  head.innerHTML = '<span class="num">' + (it._label || it.n) + '</span>' +
                   '<span class="prompt" id="' + promptId + '">' + conHuecos(it.prompt) + '</span>';
  div.appendChild(head);

  const isMatching = v.kind === "zuordnung";

  /* Letras ya gastadas por OTRO enunciado de esta variante. Se leen del estado del
     usuario, nunca de la clave: el panel sigue sin decir cuál es la respuesta. */
  const gastadas = {};
  (v.items || []).forEach(o=>{
    if(o === it) return;
    const a = state.answers[ansKey(v, o)];
    if(a !== undefined && a !== "__revealed__") gastadas[String(a).toLowerCase()] = o;
  });

  if(isMatching){
    const letters = document.createElement("div");
    letters.className = "letters";
    setAttr(letters, "role", "radiogroup");
    setAttr(letters, "aria-labelledby", promptId);
    /* La misma información que el tooltip, visible y alcanzable con el teclado. */
    const peek = document.createElement("div");
    peek.className = "letters-peek";
    peek.innerHTML = "";
    setAttr(peek, "aria-hidden", "true");
    const opts = v.options||[];
    const botones = [];
    opts.forEach((o, i)=>{
      const k = String(o.key);
      const bajo = k.toLowerCase();
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = k;
      const titulo = ((o.title ? o.title + " — " : "") + (o.text || "")).trim();
      b.title = k + ") " + titulo.slice(0, 140);
      /* El nombre accesible dice la letra Y de qué anuncio es: «a» no dice nada. */
      setAttr(b, "aria-label", k + ") " + titulo.slice(0, 120) +
        (gastadas[bajo] ? " · " + t("takenBy", {n: (gastadas[bajo]._label || gastadas[bajo].n)}) : ""));
      setAttr(b, "role", "radio");
      setAttr(b, "aria-checked", String(chosen||"").toLowerCase() === bajo ? "true" : "false");
      setAttr(b, "data-key", key + ":" + bajo);
      b.className = "";
      if(answered && String(chosen).toLowerCase() === bajo){
        b.className = (bajo===correctLetter) ? "correct" : "wrong";
      }
      if((answered||revealed) && bajo===correctLetter) b.className = "correct";
      /* Estado que antes no existía y que el CSS declaraba sin que nadie pudiera
         verlo: la letra ya cogida por otro enunciado. Sigue siendo pulsable
         (puedes reasignarla), pero se ve. */
      if(!answered && !revealed && gastadas[bajo]) b.className = "taken";
      /* Roving tabindex: un tabulador por fila y las flechas para recorrerla; en
         vez de ocho tabulaciones por enunciado. Siempre hay exactamente uno. */
      b.tabIndex = (String(chosen||"").toLowerCase() === bajo ||
                    (chosen === undefined && i === 0) ||
                    (revealed && bajo === correctLetter)) ? 0 : -1;
      b.onclick = ()=> commitAnswer(key, it, bajo);
      /* Peek: la letra enciende su anuncio y escribe debajo cuál es. */
      const mostrar = ()=>{
        peekAd(bajo);
        peek.innerHTML = '<b>' + esc(k) + ')</b> ' + esc(titulo.slice(0, 160));
      };
      const ocultar = ()=>{ clearPeek(); peek.innerHTML = ""; };
      b.onmouseenter = mostrar;
      b.onmouseleave = ocultar;
      b.onfocus = mostrar;
      b.onblur = ocultar;
      b.onkeydown = (e)=> teclasGrupo(e, botones, i);
      botones.push(b);
      letters.appendChild(b);
    });
    div.appendChild(letters);
    div.appendChild(peek);
  } else {
    const opts = document.createElement("div");
    opts.className = "opts";
    setAttr(opts, "role", "radiogroup");
    setAttr(opts, "aria-labelledby", promptId);
    const botones = [];
    (it.options||[]).forEach((o, i)=>{
      const k = String(o.key);
      const tf = it.type === "truefalse" || /^(richtig|falsch)$/i.test(k);
      const isCorrect = k.toLowerCase() === correctLetter;
      const isChosen = answered && String(chosen).toLowerCase() === k.toLowerCase();
      /* Botón de verdad: antes era un <div onclick> sin tabindex ni role, así que
         ningún ítem que no fuera de emparejar se podía contestar con el teclado. */
      const el = document.createElement("button");
      el.type = "button";
      setAttr(el, "role", "radio");
      setAttr(el, "aria-checked", isChosen ? "true" : "false");
      setAttr(el, "data-key", key + ":" + k.toLowerCase());
      el.className = "opt";
      if(answered || revealed){
        if(isCorrect) el.className += " correct";
        else if(isChosen) el.className += " wrong";
      }
      el.tabIndex = (isChosen || (chosen === undefined && i === 0) ||
                     (revealed && isCorrect)) ? 0 : -1;
      el.innerHTML = tf
        ? '<span class="key">' + (isCorrect && (answered||revealed) ? "✓" : "•") + '</span><span>' + esc(o.text||k) + '</span>'
        : '<span class="key">' + esc(k) + ')</span><span>' + esc(o.text||"") + '</span>';
      el.onclick = ()=> commitAnswer(key, it, k);
      el.onkeydown = (e)=> teclasGrupo(e, botones, i);
      botones.push(el);
      opts.appendChild(el);
    });
    div.appendChild(opts);
  }

  if(answered || revealed){
    const good = answered && String(chosen).toLowerCase() === correctLetter;
    const fb = document.createElement("div");
    fb.className = "fb show " + (good ? "good" : "bad");
    let verdict;
    if(revealed) verdict = t("correctAnswerIs", {letter: correctLetter});
    else if(good) verdict = t("correctVerdict");
    else verdict = t("wrongVerdict", {letter: correctLetter});
    const conf = (it.confidence||"mittel").toLowerCase();
    const confLabel = formatConfidence(conf);
    let traduccion = "";
    if(isMatching && v.options){
      const optLabel = k => {
        const o = (v.options||[]).find(x => String(x.key).toLowerCase() === k);
        return o ? k + ") " + (o.title || (o.text||"").slice(0,60)) : k;
      };
      if(answered && !good) traduccion = t("youChose", {chosen: esc(optLabel(String(chosen).toLowerCase()))});
      traduccion += t("correctIs", {correct: esc(optLabel(correctLetter))});
    }
    fb.innerHTML =
      '<div class="verdict">' + verdict +
        '<span class="badge ' + conf + '">' + t("confidenceBadge", {conf: confLabel}) + '</span>' +
        (it.verified ? '<span class="badge ok">' + t("secondReadingBadge") + '</span>' : '') +
        (chosen === "__revealed__" ? '<span class="badge tag">' + t("revealedBadge") + '</span>' : '') +
      '</div>' +
      (traduccion ? '<div class="translation">' + traduccion + '</div>' : '') +
      (it.quote ? '<div class="quote">„' + conHuecos(it.quote) + '“</div>' : '') +
      '<div>' + esc(explainOf(it)) + '</div>';
    div.appendChild(fb);
    /* Deshacer por ítem: contestar sigue siendo de un clic, pero deja de ser
       irreversible salvo borrando el ejercicio entero. */
    const borrar = document.createElement("button");
    borrar.type = "button";
    borrar.className = "btn ghost sm";
    borrar.textContent = t("clearItem");
    borrar.onclick = ()=>{
      delete state.answers[key];
      saveState();
      focusTrasRender = null;
      render();
      announce(t("srCleared"));
    };
    div.appendChild(borrar);
  }
  return div;
}

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ---------- Utilidades de DOM ----------
   Las pruebas de humo y de seguridad ejecutan este script con un DOM mínimo que
   no implementa classList, setAttribute, focus, getAttribute ni matchMedia. Todo
   lo que dependa de esas APIs pasa por aquí: la app se comporta igual en el
   navegador y en las pruebas, sin ramas de «modo test» dentro del render. */
function setAttr(el, name, value){
  if(el && typeof el.setAttribute === "function") el.setAttribute(name, value);
}
function getAttr(el, name){
  if(el && typeof el.getAttribute === "function") return el.getAttribute(name);
  return undefined;
}
function hasClass(el, cls){
  return String((el && el.className) || "").split(/\s+/).indexOf(cls) !== -1;
}
function toggleClass(el, cls, on){
  if(!el) return;
  if(el.classList && typeof el.classList.add === "function"){
    if(on) el.classList.add(cls); else el.classList.remove(cls);
    return;
  }
  const partes = String(el.className || "").split(/\s+/).filter(Boolean).filter(c => c !== cls);
  if(on) partes.push(cls);
  el.className = partes.join(" ");
}
function focusEl(el){
  if(el && typeof el.focus === "function"){ try { el.focus({preventScroll:true}); } catch(e){ el.focus(); } }
}
function announce(texto){
  const n = document.getElementById("sr-status");
  if(n) n.textContent = texto;
}
function prefiereMenosMovimiento(){
  try {
    return typeof window.matchMedia === "function" &&
           window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch(e){ return false; }
}

/* ---------- Mesa de examen: conmutador y «peek» del anuncio ----------
   `adNodes` guarda letra → anuncio del panel de referencia para encender el que
   corresponde a la letra que tienes debajo del ratón o del foco. Es un índice en
   memoria, no una consulta al documento, porque el DOM de las pruebas no tiene
   querySelector. Se rehace en cada render. */
let adNodes = {};
function clearPeek(){
  Object.keys(adNodes).forEach(k => toggleClass(adNodes[k], "peek", false));
}
function peekAd(letra){
  const clave = String(letra || "").toLowerCase();
  Object.keys(adNodes).forEach(k => toggleClass(adNodes[k], "peek", k === clave));
  const ad = adNodes[clave];
  if(!ad) return;
  /* Si el anuncio queda fuera del panel (que tiene su propio scroll), se acerca
     lo mínimo: `nearest` y respetando a quien pidió menos movimiento. */
  const panel = ad.parentNode;
  if(typeof ad.getBoundingClientRect !== "function" || typeof ad.scrollIntoView !== "function") return;
  if(!panel || typeof panel.getBoundingClientRect !== "function") return;
  const a = ad.getBoundingClientRect(), p = panel.getBoundingClientRect();
  if(a.top < p.top || a.bottom > p.bottom){
    try {
      ad.scrollIntoView({block:"nearest", behavior: prefiereMenosMovimiento() ? "auto" : "smooth"});
    } catch(e){}
  }
}
function updateDeskUI(){
  const b = document.getElementById("desk-toggle");
  if(!b) return;
  const on = hasClass(document.getElementById("main"), "desk");
  b.textContent = t("deskToggle");
  b.title = t("deskToggleTitle");
  b.className = on ? "btn" : "btn ghost";
  setAttr(b, "aria-pressed", on ? "true" : "false");
}

/* ---------- Foco y avisos al contestar ----------
   El render vacía #main entero, así que el control pulsado desaparecía y el foco
   caía al <body>: para la siguiente pregunta había que tabular desde la cabecera.
   `focusTrasRender` recuerda qué control devolver al foco y `restaurarFoco` lo
   busca recorriendo hijos (sin querySelector, que el DOM de las pruebas no tiene). */
let focusTrasRender = null;
function restaurarFoco(){
  if(!focusTrasRender) return;
  const clave = focusTrasRender;
  focusTrasRender = null;
  const main = document.getElementById("main");
  if(!main || !main.children) return;
  const pila = [main];
  let encontrado = null;
  while(pila.length && !encontrado){
    const el = pila.pop();
    if(getAttr(el, "data-key") === clave) encontrado = el;
    if(el && el.children) for(const c of el.children) pila.push(c);
  }
  focusEl(encontrado);
}
/* Contestar: guarda, repinta, devuelve el foco y cuenta lo que ha pasado por la
   región viva (los veredictos llevan <b>, así que el aviso usa frases propias). */
function commitAnswer(clave, item, valor){
  const cambio = state.answers[clave] !== valor;
  state.answers[clave] = valor;
  saveState();
  focusTrasRender = clave + ":" + String(valor).toLowerCase();
  render();
  if(!cambio) return;
  const letra = itemAnswerLetter(item);
  announce(String(valor).toLowerCase() === letra ? t("srRight") : t("srWrong", {letter: letra}));
}
/* Un radiogroup se recorre con las flechas, no con ocho Tabs. Elegir confirma,
   que es exactamente lo que promete role="radio". */
function teclasGrupo(e, botones, i){
  if(!e || !botones || botones.length < 2) return;
  const n = botones.length;
  let destino = null;
  if(e.key === "ArrowRight" || e.key === "ArrowDown") destino = (i + 1) % n;
  else if(e.key === "ArrowLeft" || e.key === "ArrowUp") destino = (i - 1 + n) % n;
  else if(e.key === "Home") destino = 0;
  else if(e.key === "End") destino = n - 1;
  else return;
  if(typeof e.preventDefault === "function") e.preventDefault();
  const b = botones[destino];
  if(b && typeof b.onclick === "function") b.onclick(); else focusEl(b);
}

/* Los huecos de los Sprachbausteine se guardan como «46 ( )», para que las citas
   sigan siendo literales y comprobables. Al pintarlos se cambian por una raya con
   el número en color: en el examen se escribe encima del hueco, y un paréntesis
   vacío se lee mal y no se ve dónde hay que escribir. */
function conHuecos(texto){
  return esc(texto).replace(/(\d{2})\s*\(\s*\)/g,
    '<span class="gap"><span class="gap-n">$1</span><span class="gap-line"></span></span>');
}
window.conHuecos = conHuecos;
