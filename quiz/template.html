/* ---------- Sincronización en Tiempo Real (Firebase Firestore) ---------- */
let fbDb = null;
let fbSyncStatus = "local"; // "local" | "online" | "syncing"
let cloudSchreibenCache = {}; // taskId -> doc data
let cloudSyncTimeout = null;
let activeTaskUnsubscribe = null;
let currentListeningTaskId = null;

function getFirebaseConfig() {
  try {
    const raw = localStorage.getItem(LS_FIREBASE);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}

function getFirebaseConfigRaw() {
  try {
    return localStorage.getItem(LS_FIREBASE) || "";
  } catch(e){ return ""; }
}

function saveFirebaseConfig(cfg) {
  try {
    if (!cfg) {
      localStorage.removeItem(LS_FIREBASE);
    } else {
      localStorage.setItem(LS_FIREBASE, typeof cfg === "string" ? cfg : JSON.stringify(cfg, null, 2));
    }
    fbDb = null;
  } catch(e){}
}

/* La consola de Firebase ofrece un fragmento de JavaScript, no JSON: las claves
   van sin comillas y lleva "const firebaseConfig = ... ;" alrededor. Aceptamos
   las dos formas para que se pueda pegar tal cual lo que da Google. */
function parseFirebaseConfig(raw) {
  const txt = String(raw == null ? "" : raw).trim();
  if (!txt) return null;
  try { return JSON.parse(txt); } catch(e){}
  const desde = txt.indexOf("{", Math.max(0, txt.indexOf("firebaseConfig")));
  const hasta = txt.lastIndexOf("}");
  if (desde < 0 || hasta <= desde) throw new Error(t("cfgNotObject"));
  const cuerpo = txt.slice(desde, hasta + 1)
    .replace(/^\s*\/\/.*$/gm, "")                            // comentarios de línea
    .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')  // claves sin comillas
    .replace(/,(\s*[}\]])/g, "$1");                          // comas finales
  return JSON.parse(cuerpo);
}
window.parseFirebaseConfig = parseFirebaseConfig;

function initFirebase() {
  if (fbDb) return fbDb;
  if (typeof firebase === "undefined") return null;
  const cfg = getFirebaseConfig();
  if (!cfg || !cfg.apiKey || !cfg.projectId) return null;
  try {
    if (!firebase.apps || !firebase.apps.length) {
      firebase.initializeApp(cfg);
    }
    fbDb = firebase.firestore();
    fbSyncStatus = "online";
    updateCloudStatusUI();
    return fbDb;
  } catch(e) {
    console.warn("Firebase init error:", e);
    return null;
  }
}

function updateCloudStatusUI() {
  const el = document.getElementById("cloud-status-indicator");
  if (!el) return;
  if (fbSyncStatus === "online") {
    el.innerHTML = '<span class="cloud-dot online"></span> ' + t("cloudStatusOnline", {room: esc(currentRoomId)});
    el.title = "Firebase Firestore: Room " + currentRoomId;
  } else if (fbSyncStatus === "syncing") {
    el.innerHTML = '<span class="cloud-dot syncing"></span> ' + t("cloudStatusSyncing");
  } else if (fbSyncStatus === "error") {
    el.innerHTML = '<span class="cloud-dot error"></span> ' + t("cloudStatusError");
    el.title = "Firestore: " + currentRoomId + " · " + t("firebaseHelp");
  } else {
    el.innerHTML = '<span class="cloud-dot offline"></span> ' + t("cloudStatusLocal");
    el.title = t("cloudLocalTitle");
  }
}

function startListeningToTask(taskId, onPartnerUpdate) {
  if (activeTaskUnsubscribe) {
    activeTaskUnsubscribe();
    activeTaskUnsubscribe = null;
  }
  currentListeningTaskId = taskId;
  const db = initFirebase();
  if (!db) {
    fbSyncStatus = "local";
    updateCloudStatusUI();
    return;
  }
  try {
    fbSyncStatus = "online";
    updateCloudStatusUI();
    activeTaskUnsubscribe = db.collection("rooms").doc(currentRoomId)
      .collection("schreiben").doc(taskId)
      .onSnapshot((doc) => {
        if (doc && doc.exists) {
          const data = doc.data() || {};
          cloudSchreibenCache[taskId] = data;
          if (onPartnerUpdate && currentListeningTaskId === taskId) {
            onPartnerUpdate(data);
          }
        }
      }, (err) => {
        console.warn("Firestore snapshot error:", err);
      });
  } catch(e) {
    console.warn("Firestore listen error:", e);
  }
}

function pushSchreibenToFirestore(taskId, text, evalResult) {
  const db = initFirebase();
  if (!db) return;
  fbSyncStatus = "syncing";
  updateCloudStatusUI();
  const updateData = {};
  const now = Date.now();
  if (currentUser === "sergio") {
    if (text !== undefined) {
      updateData.sergio_text = text;
      updateData.sergio_words = countWords(text);
      updateData.sergio_updated_at = now;
    }
    if (evalResult !== undefined) {
      updateData.sergio_eval = evalResult;
      updateData.sergio_updated_at = now;
    }
  } else {
    if (text !== undefined) {
      updateData.diana_text = text;
      updateData.diana_words = countWords(text);
      updateData.diana_updated_at = now;
    }
    if (evalResult !== undefined) {
      updateData.diana_eval = evalResult;
      updateData.diana_updated_at = now;
    }
  }

  db.collection("rooms").doc(currentRoomId)
    .collection("schreiben").doc(taskId)
    .set(updateData, { merge: true })
    .then(() => {
      /* Solo cuenta como enviado si la nube lo aceptó. Es lo que después permite
         saber si el borrador local tiene algo sin enviar. */
      if (text !== undefined) { setPushed(taskId, text); saveState(); }
      fbSyncStatus = "online";
      updateCloudStatusUI();
    })
    .catch((err) => {
      console.warn("Firestore write error:", err);
      fbSyncStatus = "error";          // no mentir: el borrador sigue solo en local
      updateCloudStatusUI();
    });
}

function queueSchreibenSync(taskId, text) {
  if (cloudSyncTimeout) clearTimeout(cloudSyncTimeout);
  cloudSyncTimeout = setTimeout(() => {
    pushSchreibenToFirestore(taskId, text);
  }, 900);
}

/* ---------- Progreso de redacción: una clave por perfil ----------
   El mismo navegador puede estar en el perfil de Sergio o en el de Diana. Cada
   perfil necesita su borrador, su evaluación y sus Leitpunkte. Antes la clave era
   solo el id de la tarea, así que al cambiar de perfil el editor cargaba el texto
   del otro y podía publicarlo como suyo. Ahora la clave lleva el perfil delante:
   "sergio::schr-b-p66". */
function progKey(id){ return currentUser + "::" + id; }

/* Los progresos guardados antes de existir la clave con perfil traen la clave
   antigua (solo el id). Se convierten una sola vez, y se asignan al perfil que
   estaba abierto. Lo mismo con los ficheros de progreso exportados entonces. */
function migrarClavesDeProgreso(s, dueno){
  const destinatario = (dueno === "sergio" || dueno === "diana") ? dueno : currentUser;
  ["schreiben_drafts", "schreiben_evals", "schreiben_lps", "schreiben_pushed"].forEach((campo)=>{
    const mapa = s && s[campo];
    if(!mapa) return;
    Object.keys(mapa).forEach((k)=>{
      if(k.indexOf("::") !== -1) return;              // ya lleva perfil
      const nuevo = destinatario + "::" + k;
      if(!(nuevo in mapa)) mapa[nuevo] = mapa[k];
      delete mapa[k];
    });
  });
  return s;
}

function getDraft(id){ return (state.schreiben_drafts && state.schreiben_drafts[progKey(id)]) || ""; }
function setDraft(id, val){ if(!state.schreiben_drafts) state.schreiben_drafts = {}; state.schreiben_drafts[progKey(id)] = val; }
function delDraft(id){ if(state.schreiben_drafts) delete state.schreiben_drafts[progKey(id)]; }
function getEval(id){ return (state.schreiben_evals && state.schreiben_evals[progKey(id)]) || null; }
function setEval(id, res){ if(!state.schreiben_evals) state.schreiben_evals = {}; state.schreiben_evals[progKey(id)] = res; }
function delEval(id){ if(state.schreiben_evals) delete state.schreiben_evals[progKey(id)]; }
function getLps(id){ return (state.schreiben_lps && state.schreiben_lps[progKey(id)]) || {}; }
function setLp(id, idx, valor){
  if(!state.schreiben_lps) state.schreiben_lps = {};
  if(!state.schreiben_lps[progKey(id)]) state.schreiben_lps[progKey(id)] = {};
  state.schreiben_lps[progKey(id)][idx] = valor;
}
/* Último texto que este navegador tiene por sincronizado con la nube: el que
   envió, o el que recibió de ella. Sin registro devuelve undefined; con la cadena
   vacía significa que aquí se borró a propósito. Sirve para saber si el borrador
   local tiene algo sin enviar. */
function getPushed(id){ return state.schreiben_pushed ? state.schreiben_pushed[progKey(id)] : undefined; }
function setPushed(id, txt){ if(!state.schreiben_pushed) state.schreiben_pushed = {}; state.schreiben_pushed[progKey(id)] = txt; }

function loadState(){
  try {
    const s = migrarClavesDeProgreso(JSON.parse(localStorage.getItem(LS)) || {});
    if (!s.answers) s.answers = {};
    if (!s.schreiben_drafts) s.schreiben_drafts = {};
    if (!s.schreiben_evals) s.schreiben_evals = {};
    if (!s.schreiben_lps) s.schreiben_lps = {};
    if (!s.schreiben_pushed) s.schreiben_pushed = {};
    return s;
  }
  catch(e){ return {answers:{}, schreiben_drafts:{}, schreiben_evals:{}, schreiben_lps:{}, schreiben_pushed:{}}; }
}
function saveState(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
let state = loadState();
window.quizState = state;

/* ---------- Copia de seguridad del progreso ----------
   El progreso vive en el localStorage de UN origen (navegador + dirección web),
   así que exportar/importar es la forma de llevarlo de file:// a GitHub Pages,
   a otro navegador o a otro dispositivo. No incluye claves. */
function exportProgress(){
  try {
    const payload = {
      app: "B2-Beruf-Quiz",
      formato: 1,
      exportado: new Date().toISOString(),
      usuario: currentUser,
      sala: currentRoomId,
      progreso: state
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "progreso-B2-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch(e){
    console.warn("No se pudo exportar el progreso:", e);
    return false;
  }
}

/* Sustituye el progreso actual por el del fichero y reengancha window.quizState
   (si no, el puntero global se queda apuntando al objeto viejo). */
function aplicarProgreso(prog, dueno){
  state = {
    answers: prog.answers || {},
    schreiben_drafts: prog.schreiben_drafts || {},
    schreiben_evals: prog.schreiben_evals || {},
    schreiben_lps: prog.schreiben_lps || {},
    schreiben_pushed: prog.schreiben_pushed || {}
  };
  /* Un fichero exportado antes de existir la clave con perfil trae la clave
     antigua. Se asigna al perfil que lo exportó (datos.usuario), no al que
     lo importa. */
  migrarClavesDeProgreso(state, dueno);
  window.quizState = state;
  saveState();
  render();
  return {
    respuestas: Object.keys(state.answers).length,
    borradores: Object.keys(state.schreiben_drafts).length
  };
}

/* ¿Puede este navegador guardar ajustes? Si no puede, hay que decirlo: antes el

/* Clave enmascarada para poder comprobar de un vistazo que sí se guardó. */
function maskKey(k){
  const s = String(k || "");
  if(!s) return "";
  return s.length <= 8 ? "•".repeat(s.length) : "•".repeat(6) + s.slice(-4);
}

/* Qué clave usa el proveedor elegido (Ollama va en local y no usa ninguna). */
function aiKeyOf(cfg){
  if(!cfg) return "";
  if(cfg.provider === "gemini") return cfg.geminiKey || "";
  if(cfg.provider === "openai_compatible") return cfg.customKey || "";

}

/* Línea de estado del modal: proveedor activo, si hay clave y si el navegador
   deja guardarla. */
function aiStatusText(cfg){
  const clave = aiKeyOf(cfg);
  const partes = [
    t("aiActiveProvider", {provider: cfg.provider}),
    clave ? t("aiKeySaved", {mask: maskKey(clave)}) : t("aiKeyMissing"),
    storageOk() ? t("aiStorageOk") : t("aiStorageBlocked")
  ];
  const protocolo = (typeof location !== "undefined" && location.protocol) ? location.protocol : "";
  if(protocolo === "file:") partes.push(t("aiLocalFile"));
  return partes.join(" · ");
}

/* Un fallo de red no dice nada útil («Failed to fetch»): se traduce. */
function errorDeRed(e){
  const m = String((e && e.message) || e || "");
  if(/Failed to fetch|NetworkError|Load failed|Network request failed/i.test(m)) return t("errNetwork");
  return m;
}

/* ---------- índices ---------- */
const allVariants = [];
DATA.sections.forEach(sec=>{
  sec.variants.forEach(v=>{
    v._section = sec.id; v._sectionTitle = sec.title;
    if(!v.items) v.items = [];
    v.items.forEach((it,i)=>{ it._idx = i; });
    const byN = {};
    v.items.forEach(it => { byN[it.n] = (byN[it.n]||0) + 1; });
    const seenN = {};
    v.items.forEach(it => {
      if(byN[it.n] > 1){
        seenN[it.n] = (seenN[it.n]||0) + 1;
        it._label = it.n + String.fromCharCode(96 + seenN[it.n]);
      } else {
        it._label = String(it.n);
      }
    });
    allVariants.push(v);
  });
});

function ansKey(v, item){ return v.id + "#" + item._idx; }
function itemAnswerLetter(it){ return String(it.answer).toLowerCase(); }
function isDoubtful(it){ return String(it.confidence||"mittel").toLowerCase() !== "hoch"; }
function doubtfulCount(v){ return (v.items || []).filter(isDoubtful).length; }

let onlyDoubtful = false;

/* ---------- estadísticas ---------- */
function updateStats(){
  let total = 0, done = 0, ok = 0, doubt = 0;
  allVariants.forEach(v=>{
    (v.items || []).forEach(it=>{
      total++;
      if(isDoubtful(it)) doubt++;
      const a = state.answers[ansKey(v,it)];
      if(a !== undefined && a !== "__revealed__"){
        done++; if(a === itemAnswerLetter(it)) ok++;
      }
    });
  });
  const el = document.getElementById("stats");
  const fill = document.getElementById("progress-fill");
  if (fill) fill.style.width = (total ? Math.min(100, Math.round(done / total * 100)) : 0) + "%";
  if(!el) return;
  const pct = done ? " (" + Math.round(ok/done*100) + "%)" : "";
  const doubtSpan = doubt ? ' · <span class="em-warn">' + t("statDudosas", {doubt: doubt}) + "</span>" : "";
  el.innerHTML = t("statRespondidas", {done: done, total: total, ok: ok}) + pct + doubtSpan;
}

/* ---------- navegación ---------- */
let current = allVariants.length ? allVariants[0].id : null;

/* Grupo desplegado del menú. `undefined` = sin decidir todavía (se despliega el
   grupo donde estás); `null` = todos plegados, que es lo que deja el clic en la
   cabecera abierta. Son variables de sesión a propósito: al recargar, el menú
   vuelve a abrir solo el grupo activo, sin memoria que arrastre estados raros. */
let openSec;
let lastNavCurrent;

function renderNav(){
  const nav = document.getElementById("nav");
  if(!nav) return;
  nav.innerHTML = "";
  /* Saltar a otra entrada (clic, filtro de dudosas) reabre su grupo: el menú
     nunca esconde el ejercicio que estás viendo. */
  const aqui = allVariants.find(v => v.id === current);
  const secActual = aqui ? aqui._section : null;
  if(openSec === undefined || current !== lastNavCurrent){
    openSec = secActual; lastNavCurrent = current;
  }
  DATA.sections.forEach(sec=>{
    const abierto = openSec === sec.id;
    /* Con el filtro de dudosas puesto, el contador cuenta lo que de verdad
       se ve, no lo que el grupo guarda. */
    const visibles = sec.variants.filter(v => !(onlyDoubtful && doubtfulCount(v) === 0 && v.id !== current));

    const h = document.createElement("div");
    h.className = "sec" + (abierto ? " open" : "");

    const tog = document.createElement("div");
    tog.className = "sec-toggle";
    tog.tabIndex = 0;
    tog.title = t(abierto ? "secToggleCollapse" : "secToggleExpand", { title: localizeSection(sec.title) });
    const nom = document.createElement("span");
    nom.textContent = localizeSection(sec.title);
    const cnt = document.createElement("span");
    cnt.className = "sec-count";
    cnt.textContent = visibles.length;
    tog.appendChild(nom); tog.appendChild(cnt);
    /* setAttribute no existe en el DOM simulado de las pruebas; en el navegador
       sí, así que el rol y el estado plegado se anuncian sin romper nada. */
    if(tog.setAttribute){
      tog.setAttribute("role", "button");
      tog.setAttribute("aria-expanded", abierto ? "true" : "false");
    }
    const alternar = ()=>{ openSec = abierto ? null : sec.id; renderNav(); };
    tog.onclick = alternar;
    tog.onkeydown = e => {
      if(e.key === "Enter" || e.key === " " || e.key === "Spacebar"){ e.preventDefault(); alternar(); }
    };
    h.appendChild(tog);

    /* Reiniciar el bloque entero: borra solo las respuestas de esta sección, y
       solo aparece si hay algo que borrar. Las tareas de Schreiben se quedan
       fuera a propósito (tienen sus propios botones por tarea). */
    const objetivos = (sec.variants || []).filter(v => v.kind !== "schreiben");
    const pendientes = objetivos.reduce((acc, v) =>
      acc + (v.items || []).filter(it => state.answers[ansKey(v, it)] !== undefined).length, 0);
    if(abierto && pendientes > 0){
      const bResetSec = document.createElement("button");
      bResetSec.className = "sec-reset";
      bResetSec.textContent = t("btnResetSection");
      bResetSec.title = t("btnResetSectionTitle", { title: sec.title, n: pendientes });
      bResetSec.onclick = ()=>{
        if(!confirm(t("confirmResetSection", { title: sec.title, n: pendientes }))) return;
        objetivos.forEach(v => (v.items || []).forEach(it => { delete state.answers[ansKey(v, it)]; }));
        saveState(); render();
      };
      h.appendChild(bResetSec);
    }
    nav.appendChild(h);
    visibles.forEach(v=>{
      const nd = doubtfulCount(v);
      const b = document.createElement("button");
      const n = (v.items || []).length;
      const done = (v.items || []).filter(it => state.answers[ansKey(v,it)] !== undefined).length;
      const ok = (v.items || []).filter(it => state.answers[ansKey(v,it)] === itemAnswerLetter(it)).length;
      let pill = "";
      if(v.kind === "schreiben"){
        /* Se pasa por la vara para que la insignia del menú diga lo mismo que el panel. */
        const ev = getEval(v.id);
        const conVara = ev ? normalizeEvaluationResult(ev, null, (v.leitpunkte || []).length) : null;
        pill = conVara ? (conVara.verdict === "BESTANDEN" ? t("passedPill") : t("failedPill")) : (v.category === "beschwerde" ? t("pillEmail") : t("pillPost"));
      } else {
        pill = onlyDoubtful
          ? (nd === 1 ? t("doubtPillSingle") : t("doubtPillPlural", {count: nd}))
          : (done ? ok + "/" + n : (n === 1 ? t("itemCountSingle") : t("itemsCount", {count: n})));
      }
      b.innerHTML = esc(localizeLabel(v.label)) + '<span class="pill">' + esc(pill) + '</span>';
      b.className = (v.id === current ? "active " : "") + "sec-item";
      /* Los grupos plegados se ocultan, no se borran: el teclado y las pruebas
         siguen encontrando sus entradas. */
      b.hidden = !abierto;
      b.onclick = ()=>{ current = v.id; render(); window.scrollTo(0,0); };
      nav.appendChild(b);
    });
  });
}

let examTimer = null;

function formatTimer(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

/* ---------- render principal ---------- */
/* Una evaluación con datos raros (del LLM o de la pareja) no debe dejar la app
   a medias: si el render falla, se muestra un aviso en lugar de una pantalla rota. */
function render(){
  try {
    renderMain();
    restaurarFoco();
    /* Al final, y no en cada sitio: así el mando de los controles segmentados se
       recoloca también cuando el render crea controles nuevos (las pestañas de la
       evaluación, sin ir más lejos), y no se queda con la medida de los anteriores. */
    colocarMandos();
  } catch(e){
    console.warn("Error al renderizar:", e);
    const main = document.getElementById("main");
    if(main) main.innerHTML = '<div class="panel"><h3>' + t("renderErrorTitle") + '</h3>' +
      '<div>' + esc(e.message) + '</div><div class="sub">' + t("renderErrorHint") + '</div></div>';
  }
}

function renderMain(){
  renderNav();
  updateStats();
  const main = document.getElementById("main");
  if(!main) return;
  const v = allVariants.find(x=>x.id===current);
  if(!v){ main.className = ""; main.innerHTML = '<div class="empty">' + t("noData") + '</div>'; updateDeskUI(); return; }
  main.innerHTML = "";
  /* Índice letra → anuncio del panel de referencia, para el «peek». */
  adNodes = {};
  /* Mesa de examen a dos columnas (CSS ≥1280px): solo si hay referencia que poner
     al lado —anuncios de zuordnung o texto de lectura—; sin ella la mesa no tiene
     sentido, y la clase se quita siempre para no arrastrarla entre variantes. El
     conmutador de la cabecera manda sobre lo automático y se recuerda. */
  const hayReferencia = v.kind !== "schreiben" && !!(v.passage || (v.options && v.options.length));
  const deskOn = state.deskOn === undefined ? hayReferencia : (hayReferencia && !!state.deskOn);
  main.className = deskOn ? "desk" : "";
  updateDeskUI();

  /* Encabezado */
  const h2 = document.createElement("h2");
  h2.textContent = v._sectionTitle + " · " + localizeLabel(v.label);
  main.appendChild(h2);
  const sub = document.createElement("div");
  sub.className = "sub";
  const numItems = (v.items || []).length;
  const itemsText = numItems === 1 ? t("itemCountSingle") : t("itemsCount", {count: numItems});
  sub.innerHTML = t("pagePdf", {page: v.page}) +
    (v.topic ? ' · <b>' + esc(v.topic) + '</b>' : '') +
    (v.kind === "schreiben" ? ' · <b>' + t("schreibenSubBadge") + '</b>' : ' · ' + itemsText);
  main.appendChild(sub);

  if(v.kind === "schreiben"){
    renderSchreiben(v, main);
    return;
  }

  /* Vista habitual para preguntas de Lesen / Hören */
  if(v.note){
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = "⚠ " + noteOf(v);
    main.appendChild(n);
  }
  if(v.intro){
    const p = document.createElement("div");
    p.className = "panel intro";
    p.innerHTML = '<h3>' + t("instructions") + '</h3><div class="intro-text">' + esc(v.intro) + '</div>';
    main.appendChild(p);
  }

  if(v.passage){
    main.appendChild(detailsPanel(t("readingText"), v.passage, v.passageOpen));
  }

  if(v.options && v.options.length){
    /* «Usada» = la ha asignado el usuario, no la clave. Derivarlo de la clave
       (itemAnswerLetter) convertía este panel en la solución: salían marcados
       con ✓ justo los 5 anuncios correctos antes de responder nada. */
    const used = new Set(
      v.items.map(i => state.answers[ansKey(v, i)])
             .filter(a => a !== undefined && a !== "__revealed__")
             .map(a => String(a).toLowerCase()));
    const d = document.createElement("details");
    d.className = "panel passage";
    d.open = true;
    const s = document.createElement("summary");
    const label = v.optionsLabel || (v._section === "lesen-t3" ? "Kommentare" : "Anzeigen");
    const ks = v.options.map(o=>String(o.key));
    s.textContent = t("optionsSummary", {
      label: label,
      range: ks[0] + "–" + ks[ks.length-1],
      total: v.options.length,
      used: used.size
    });
    d.appendChild(s);
    const body = document.createElement("div");
    /* El banco de palabras se pinta en rejilla compacta: la opción es una palabra. */
    const enBanco = v.optionsLayout === "bank";
    if(enBanco) body.className = "bank";
    v.options.forEach(o=>{
      const letraAd = String(o.key).toLowerCase();
      const isUsed = used.has(letraAd);
      const div = document.createElement("div");
      div.className = "ad " + (isUsed ? "used" : "unused");
      /* El panel es la referencia del «peek»: la letra de abajo enciende su anuncio. */
      adNodes[letraAd] = div;
      setAttr(div, "data-ad", letraAd);
      div.innerHTML = enBanco
        ? '<span class="k">' + esc(o.key) + ')</span>' +
          '<span class="body">' + esc(o.text || o.title || "") + '</span>'
        : '<span class="k">' + esc(o.key) + ')</span>' +
          '<span class="t">' + esc(o.title||"") + '</span>' +
          '<div class="body">' + esc(o.text||"") + '</div>';
      body.appendChild(div);
    });
    d.appendChild(body);
    main.appendChild(d);
  }

  const shown = onlyDoubtful ? v.items.filter(isDoubtful) : v.items;
  if(onlyDoubtful){
    const info = document.createElement("div");
    info.className = "note";
    info.textContent = shown.length
      ? t("reviewModeInfo", {shown: shown.length, total: v.items.length})
      : t("reviewModeNoDoubt");
    main.appendChild(info);
  }
  const sheet = document.createElement("section");
  sheet.className = "q-sheet";
  shown.forEach(it => sheet.appendChild(renderItem(v, it)));
  main.appendChild(sheet);

  const row = document.createElement("div");
  row.className = "row";
  const bAll = document.createElement("button");
  bAll.className = "btn ghost";
  bAll.textContent = t("btnShowAllAnswers");
  bAll.onclick = ()=>{
    v.items.forEach(it=>{ if(state.answers[ansKey(v,it)]===undefined)
      state.answers[ansKey(v,it)] = "__revealed__"; });
    saveState(); render();
  };
  const bClear = document.createElement("button");
  bClear.className = "btn ghost";
  bClear.textContent = t("btnClearVariantAnswers");
  bClear.onclick = ()=>{ v.items.forEach(it=> delete state.answers[ansKey(v,it)]);
    saveState(); render(); };
  row.appendChild(bAll); row.appendChild(bClear);
  main.appendChild(row);
}

function countWords(str){
  const m = (str || "").trim().match(/[\p{L}\p{N}_\-]+/gu);
  return m ? m.length : 0;
}

/* Trae tu lado desde la nube cuando este navegador no lo tiene, y refresca una
   copia local que se quedó vieja. Nunca pisa ediciones sin enviar.

   `enviado` es el último texto que este navegador tiene por sincronizado. Las
   reglas, en orden:
     1. Editor vacío y la nube con texto: se rellena, y queda anotado como
        sincronizado. Si aquí se borró a propósito (`enviado` es la cadena vacía),
        no se rellena: acabas de vaciarlo tú.
     2. Editor igual a la nube: ya coinciden, solo se anota. Es lo que deja
        protegidas las copias que llegaron antes de existir esta marca.
     3. Editor igual a lo último sincronizado y la nube distinta: manda la nube.
        Sin esto, una copia vieja se sube encima de una nueva al primer tecleo.
     4. Editor distinto de lo último sincronizado: hay ediciones sin enviar. No se
        toca nada. */
function hidratarMiLadoDesdeNube(v, datos, textarea, contenedor, badge){
  if(!datos) return;
  const textoNube = datos[currentUser + "_text"] || "";
  const local = getDraft(v.id);
  const enviado = getPushed(v.id);            // undefined = sin registro en este navegador

  const ponerEnEditor = (txt)=>{
    setDraft(v.id, txt);
    textarea.value = txt;
    updateWordBadge(badge, countWords(txt));
    saveState();
  };

  if(!local && !String(textarea.value || "").trim() && textoNube && enviado !== ""){
    ponerEnEditor(textoNube);
    setPushed(v.id, textoNube);
    saveState();
  } else if(local && textoNube && local === textoNube){
    if(local !== enviado){ setPushed(v.id, local); saveState(); }
  } else if(local && local === enviado && textoNube && textoNube !== local){
    ponerEnEditor(textoNube);
    setPushed(v.id, textoNube);               // ya no hay nada sin enviar
    saveState();
  }

  const evalNube = datos[currentUser + "_eval"];
  if(evalNube && !getEval(v.id)){
    setEval(v.id, evalNube);
    saveState();
    contenedor.appendChild(renderEvaluationResult(v, evalNube));
    renderNav();   // la insignia del menú (✓ Aprobado) también vuelve
  }
}

    saveState();
    const words = countWords(val);
    updateWordBadge(document.getElementById("word-badge"), words);
    queueSchreibenSync(v.id, val);
  };
  editorCard.appendChild(textarea);

  /* Fila de Acciones */
  const actRow = document.createElement("div");
  actRow.className = "row";
  actRow.style.marginTop = "14px";

  const bEval = document.createElement("button");
  bEval.className = "btn";
  bEval.id = "btn-evaluate";
  bEval.innerHTML = t("btnEvaluate");

  const bClearDraft = document.createElement("button");
  bClearDraft.className = "btn ghost";
  bClearDraft.textContent = t("btnClearDraft");
  bClearDraft.onclick = ()=>{
    if(confirm(t("confirmClearDraft"))){
      textarea.value = "";
      delDraft(v.id);
      saveState();
      updateWordBadge(document.getElementById("word-badge"), 0);
      pushSchreibenToFirestore(v.id, "", undefined);
    }
  };

  const statusMsg = document.createElement("div");
  statusMsg.id = "eval-status";
  statusMsg.style.fontSize = "13.5px";
  statusMsg.style.color = "var(--dim)";

  actRow.appendChild(bEval);
  actRow.appendChild(bClearDraft);
  actRow.appendChild(statusMsg);
  editorCard.appendChild(actRow);

  mineContainer.appendChild(editorCard);

  /* 3. Panel de Resultados (si ya fue evaluado por el usuario actual) */
  const existingEval = getEval(v.id);
  if(existingEval){
    mineContainer.appendChild(renderEvaluationResult(v, existingEval));
  }

  layout.appendChild(mineContainer);
  layout.appendChild(partnerContainer);
  main.appendChild(layout);

  /* Cargar y escuchar los datos de la nube: los de la pareja para pintarlos y los
     tuyos para recuperarlos si este navegador no los tiene. */
  const cachedPartnerData = cloudSchreibenCache[v.id] || null;
  renderPartnerSchreibenView(partnerContainer, v, cachedPartnerData);
  startListeningToTask(v.id, (freshData)=>{
    renderPartnerSchreibenView(partnerContainer, v, freshData);
    hidratarMiLadoDesdeNube(v, freshData, textarea, mineContainer, wordBadge);
    /* Si se escribió sin conexión, el borrador se quedó en localStorage: lo subimos al
       abrir la tarea, pero solo si la nube no tiene ya nada nuestro (nunca pisamos un
       texto que sí llegó). */
    const localDraft = getDraft(v.id);
    if(localDraft && !freshData[currentUser + "_text"]) pushSchreibenToFirestore(v.id, localDraft);
  });

  /* Conectar eventos de cambio de pestañas Mi Redacción / Redacción de Pareja */
  const tabMineBtn = tabContainer.querySelector("#tab-schreiben-mine");
  const tabPartnerBtn = tabContainer.querySelector("#tab-schreiben-partner");
  if(tabMineBtn && tabPartnerBtn){
    tabMineBtn.onclick = ()=>{
      tabMineBtn.classList.add("active");
      tabPartnerBtn.classList.remove("active");
      mineContainer.style.display = "block";
      partnerContainer.style.display = "none";
      colocarMandos();
    };
    tabPartnerBtn.onclick = ()=>{
      tabPartnerBtn.classList.add("active");
      tabMineBtn.classList.remove("active");
      mineContainer.style.display = "none";
      partnerContainer.style.display = "block";
      colocarMandos();
    };
    colocarMandos();
  }

  /* Conectar eventos del temporizador */
  const tBtn = document.getElementById("timer-btn");
  const tRst = document.getElementById("timer-rst");
  const tDisp = document.getElementById("timer-display");
  if(tBtn && tRst && tDisp){
    tBtn.textContent = examTimerRunning ? t("timerPause") : t("timerStart");
    tBtn.onclick = ()=>{
      if(examTimerRunning){
        clearInterval(examTimer);
        examTimerRunning = false;
        tBtn.textContent = t("timerResume");
      } else {
        examTimerRunning = true;
        tBtn.textContent = t("timerPause");
        examTimer = setInterval(()=>{
          if(examTimerSeconds > 0){
            examTimerSeconds--;
            tDisp.textContent = formatTimer(examTimerSeconds);
            if(examTimerSeconds <= 300) tDisp.className = "timer-display warn";
          } else {
            clearInterval(examTimer);
            examTimerRunning = false;
            tBtn.textContent = t("timerFinished");
            alert(t("timerAlert"));
          }
        }, 1000);
      }
    };
    tRst.onclick = ()=>{
      clearInterval(examTimer);
      examTimerRunning = false;
      examTimerSeconds = 45 * 60;
      tDisp.textContent = formatTimer(examTimerSeconds);
      tDisp.className = "timer-display";
      tBtn.textContent = t("timerStart");
    };
  }

  /* Conectar evento de evaluación */
  bEval.onclick = async ()=>{
    const textToEval = textarea.value.trim();
    const words = countWords(textToEval);
    if(words < 30){
      alert(t("alertTooShort", {words: words}));
      return;
    }
    const cfg = getAIConfig();
    if(cfg.provider === "gemini" && !cfg.geminiKey){
      openAIConfigModal(t("alertNeedGeminiKey"));
      return;
    }
    if(cfg.provider === "openai_compatible" && !cfg.customKey){
      openAIConfigModal(t("alertNeedCustomKey"));
      return;
    }

    bEval.disabled = true;
    bEval.innerHTML = t("btnEvaluating");
    statusMsg.textContent = t("statusConnecting");

    try {
      const result = await evaluateWithLLM(v, textToEval, (msg)=>{ statusMsg.textContent = msg; });
      result.student_text = textToEval;
      setEval(v.id, result);
      saveState();
      pushSchreibenToFirestore(v.id, textToEval, result);
      statusMsg.textContent = t("statusCompleted");
      render();
    } catch(err) {
      statusMsg.innerHTML = '<span class="status-error">' + t("statusError") + esc(errorDeRed(err)) + '</span>';
      alert(t("alertEvalError", {error: err.message}));
    } finally {
      bEval.disabled = false;
      bEval.innerHTML = t("btnEvaluate");
    }
  };
}

  if(words < 100){

}

function formatGermanLetter(text){
  if(!text) return "";
  let s = String(text).trim().replace(/\r\n/g, "\n");

  // 1. Quitar coma incorrecta tras fórmula de despedida (anglicismo típico en alemán)
  s = s.replace(/(Mit freundlichen Grüßen|Herzliche Grüße|Viele Grüße|Beste Grüße),\s*/gi, "$1\n");

  // 2. Garantizar línea en blanco tras el saludo inicial
  s = s.replace(/^([^\n,]+,)\s*([A-ZÄÖÜa-zäöü])/m, "$1\n\n$2");

  // 3. Garantizar línea en blanco antes de la fórmula de despedida
  s = s.replace(/([.!?])\s*(Mit freundlichen Grüßen|Herzliche Grüße|Viele Grüße|Beste Grüße)/gi, "$1\n\n$2");

  // 4. Garantizar salto de línea entre fórmula de despedida, nombre y cargo/departamento
  s = s.replace(/(Mit freundlichen Grüßen|Herzliche Grüße|Viele Grüße)\s*\n?\s*([^,\n]+)\s+(Kundenabteilung|Kundenservice|Abteilung|Geschäftsleitung)/gi, "$1\n$2\n$3");

  // 5. Si el cuerpo no tiene párrafos (es un bloque continuo de más de 200 caracteres), insertar párrafos en transiciones lógicas
  const transitions = [
    "Im Namen des Unternehmens",
    "Wir bedauern sehr",
    "Der Grund für dieses",
    "Der Grund hierfür",
    "Aufgrund der",
    "Nach Rücksprache",
    "Wir möchten Ihnen folgenden",
    "Als Entschädigung",
    "Wir versichern Ihnen verbindlich",
    "Wir hoffen auf Ihr",
    "Für eventuelle Rückfragen",
    "Für weitere Fragen"
  ];
  transitions.forEach(tr => {
    const escaped = tr.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const reg = new RegExp("([.!?])\\s+(" + escaped + ")", "g");
    s = s.replace(reg, "$1\n\n$2");
  });

  // Colapsar saltos excesivos
  s = s.replace(/\n{3,}/g, "\n\n");
  return s.trim();
}

/* ---------- Renderizador del resultado de evaluación telc B2 ---------- */
/* ---------- Vara de corrección (rúbrica) ----------
   Los cuatro criterios y las bandas son los de telc (Übungstest DTB B2, pp. 40-41):
     I   Kommunikative Aufgabenbewältigung   (se juzga por tarea)
     II  Kommunikative Gestaltung            (texto cohesionado, conectores)
     III Formale Richtigkeit                 (gramática, ortografía, puntuación)
     IV  Spektrum sprachlicher Mittel        (variedad léxica y de estructuras)
   con A = B2 gut erfüllt, B = B2 erfüllt, C = B1 erfüllt, D = unter B1.

   Los PESOS son los oficiales: la tarea de escritura da 14 puntos al criterio I y 9
   a cada uno de los II-IV (41 en total), y las bandas valen 100 %, ~75 %, ~39 % y 0 %.
   Nuestra escala es de 100 puntos con esas mismas proporciones: I = 34, II-IV = 22.

   Dos reglas NUESTRAS, más estrictas que el examen y a propósito:
     - Un criterio en D suspende aunque la suma llegue a 60. En el examen real esa
       regla no existe: se aprueba con 144/240 y un subtest se puede compensar.
     - El criterio I no pasa de C si falta un Leitpunkt o el texto baja de 100
       palabras, y no pasa de B entre 100 y 149.

   El modelo solo JUZGA (banda + motivos). Los puntos los pone la app, para que el
   mismo juicio dé siempre el mismo número. */
const RUBRICA = {
  max: { aufgabenbewaeltigung: 34, angemessenheit: 22, korrektheit: 22, repertoire: 22 },
  banda: {
    aufgabenbewaeltigung: { A: 34, B: 26, C: 13, D: 0 },
    resto:                { A: 22, B: 17, C:  9, D: 0 }
  },
  aprobado: 60
};
window.RUBRICA = RUBRICA;

function puntosDeBanda(crit, grade){
  const tabla = (crit === "aufgabenbewaeltigung") ? RUBRICA.banda.aufgabenbewaeltigung : RUBRICA.banda.resto;
  return tabla[grade] !== undefined ? tabla[grade] : 0;
}

/* Pone los puntos de cada criterio a partir de su banda, aplica los topes del
   criterio I y decide el veredicto. `palabras` es el recuento real de la app; si
   llega 0 (no hay texto que contar) no se aplica el tope de longitud.

   Los topes los aplica SOLO la app: el modelo juzga la banda por los criterios
   oficiales y no debe descontar ni la longitud ni los Leitpunkte por su cuenta.
   Si lo hace, la misma banda oscila entre pasadas y el número baila. */
function puntuarCriterios(c1, c2, c3, c4, palabras, totalLeitpunkte){
  /* Leitpunkte cubiertos: la banda del criterio I sigue los descriptores oficiales
     — «voll adäquat» con todos, «überwiegend» con uno menos, «nur teilweise» con dos
     menos y «nicht adäquat» con tres o más. Se cuenta contra los Leitpunkte que pide
     la TAREA, no contra los que el modelo se acuerde de listar: lo que no confirma,
     no está confirmado. Si no devuelve lista, no se aplica tope (no hay información). */
  const lista = (c1.leitpunkte_check || []).filter(lp => lp && typeof lp.covered === "boolean");
  const esperados = totalLeitpunkte > 0 ? totalLeitpunkte : lista.length;
  let topeLeitpunkte = "A";
  if(lista.length && esperados){
    const faltan = Math.max(0, esperados - lista.filter(lp => lp.covered).length);
    if(faltan >= 3) topeLeitpunkte = "D";
    else if(faltan === 2) topeLeitpunkte = "C";
    else if(faltan === 1) topeLeitpunkte = "B";
  }

  /* Longitud, en palabras reales: por debajo de 100 no pasa de C; hasta 149, de B. */
  let topeLongitud = "A";
  if(palabras > 0 && palabras < 100) topeLongitud = "C";
  else if(palabras > 0 && palabras < 150) topeLongitud = "B";

  const nivel = { D: 0, C: 1, B: 2, A: 3 };
  const tope = nivel[topeLeitpunkte] <= nivel[topeLongitud] ? topeLeitpunkte : topeLongitud;
  const actual = nivel[c1.grade] !== undefined ? nivel[c1.grade] : 0;
  c1.grade = ["D", "C", "B", "A"][Math.min(nivel[tope], actual)];

  const conPuntos = (crit, c) => Object.assign({}, c, { score: puntosDeBanda(crit, c.grade) });
  const p1 = conPuntos("aufgabenbewaeltigung", c1);
  const p2 = conPuntos("angemessenheit", c2);
  const p3 = conPuntos("korrektheit", c3);
  const p4 = conPuntos("repertoire", c4);
  const total = p1.score + p2.score + p3.score + p4.score;
  const hayD = [p1, p2, p3, p4].some(c => c.grade === "D");

  return {
    criteria: { aufgabenbewaeltigung: p1, angemessenheit: p2, korrektheit: p3, repertoire: p4 },
    score_total: total,
    verdict: (total >= RUBRICA.aprobado && !hayD) ? "BESTANDEN" : "NICHT BESTANDEN"
  };
}

function normalizeEvaluationResult(raw, studentText, totalLeitpunkte){
  if(!raw || typeof raw !== "object"){
    return {
      verdict: "NICHT BESTANDEN",
      score_total: 0,
      word_count: 0,
      student_text: "",
      criteria: {
        aufgabenbewaeltigung: { grade: "C", score: 14, feedback: "", leitpunkte_check: [] },
        angemessenheit: { grade: "C", score: 14, feedback: "", leitpunkte_check: [] },
        korrektheit: { grade: "C", score: 14, feedback: "", leitpunkte_check: [] },
        repertoire: { grade: "C", score: 14, feedback: "", leitpunkte_check: [] }
      },
      critical_errors: [],
      strengths: [],
      areas_for_improvement: [],
      corrected_version: "",
      musterloesung: ""
    };
  }

  const normStr = s => String(s || "")
    .toLowerCase()
    .replace(/ä/g, "ae")
    .replace(/ö/g, "oe")
    .replace(/ü/g, "ue")
    .replace(/ß/g, "ss")
    .replace(/[^a-z0-9]/g, "");

  // Detectar contenedor de criterios
  const critContainer = raw.criteria || raw.kriterien || raw.criterios || raw.bewertung || raw.evaluation || raw.kriterien_bewertung;
  let critList = [];
  if(Array.isArray(critContainer)){
    critList = critContainer;
  } else if(critContainer && typeof critContainer === "object"){
    critList = Object.entries(critContainer).map(([k, v]) => {
      if(v && typeof v === "object") return Object.assign({ _k: k }, v);
      return { _k: k, feedback: String(v) };
    });
  } else {
    critList = Object.entries(raw).map(([k, v]) => {
      if(v && typeof v === "object") return Object.assign({ _k: k }, v);
      return { _k: k, feedback: String(v) };
    });
  }

  function extractCriterion(patterns){
    for(const p of patterns){
      const isShort = /^(i{1,3}|iv|[1-4])$/i.test(p);
      for(const item of critList){
        const rawK = String(item._k || item.name || item.kriterium || item.criterion || item.title || item.id || "");
        const normK = normStr(rawK);
        if(isShort){
          const reg = new RegExp('^(?:kriterium\\s*)?' + p + '(?:[^a-z]|$)', 'i');
          if(reg.test(rawK) || normK === p) return item;
        } else {
          const normP = normStr(p);
          if(normK.includes(normP)) return item;
        }
      }
      const obj = (critContainer && typeof critContainer === "object") ? critContainer : raw;
      for(const k of Object.keys(obj)){
        const normK = normStr(k);
        if(isShort){
          const reg = new RegExp('^(?:kriterium\\s*)?' + p + '(?:[^a-z]|$)', 'i');
          if(reg.test(k) || normK === p){
            const v = obj[k];
            return (v && typeof v === "object") ? v : { feedback: String(v) };
          }
        } else {
          const normP = normStr(p);
          if(normK.includes(normP)){
            const v = obj[k];
            return (v && typeof v === "object") ? v : { feedback: String(v) };
          }
        }
      }
    }
    return {};
  }

  function normalizeCrit(crit, c, defaultGrade, critTitle){
    let grade = c.grade || c.note || c.stufe || c.level || c.calificacion || c.bewertung;
    if(grade != null){
      const m = String(grade).toUpperCase().match(/[ABCD]/);
      grade = m ? m[0] : String(grade).trim().toUpperCase();
    }
    let score = c.score != null ? c.score : (c.punkte != null ? c.punkte : (c.points != null ? c.points : (c.punktzahl != null ? c.punktzahl : (c.puntos != null ? c.puntos : null))));
    if(score != null) score = Math.round(Number(score));
    if(isNaN(score)) score = null;

    if(score == null && grade) score = puntosDeBanda(crit, grade);
    if(!grade && score != null){
      /* Sin banda: se deduce del número, con las proporciones de la rúbrica. */
      const max = RUBRICA.max[crit] || 22;
      if(score >= max * 0.85) grade = "A";
      else if(score >= max * 0.60) grade = "B";
      else if(score >= max * 0.25) grade = "C";
      else grade = "D";
    }
    if(!grade) grade = defaultGrade;
    if(score == null) score = puntosDeBanda(crit, grade);

    let feedback = c.feedback || c.kommentar || c.comment || c.beschreibung || c.begruendung || c.text || c.observaciones || "";
    if(!feedback){
      feedback = t("critFallbackFeedback", {crit: critTitle, grade: grade, score: score});
    }

    let leitpunkte_check = c.leitpunkte_check || c.leitpunkte || c.leitpunkteCheck || c.points_check || [];
    if(Array.isArray(leitpunkte_check)){
      leitpunkte_check = leitpunkte_check.map(lp => {
        if(typeof lp === "string") return { point: lp, covered: true, comment: "" };
        const pt = lp.point || lp.leitpunkt || lp.thema || lp.titel || "";
        const cov = lp.covered != null ? Boolean(lp.covered) : (lp.abgedeckt != null ? Boolean(lp.abgedeckt) : true);
        const cm = lp.comment || lp.kommentar || lp.feedback || "";
        return { point: String(pt), covered: cov, comment: String(cm) };
      });
    } else {
      leitpunkte_check = [];
    }

    return { grade, score, feedback: String(feedback), leitpunkte_check, discrepancia: String(c.discrepancia || "") };
  }

  // Pre-verificación para derivar valores coherentes
  let rawVerdict = raw.verdict || raw.ergebnis || raw.resultado || raw.status;
  const passedHint = (typeof rawVerdict === "string" && rawVerdict.toUpperCase().includes("BESTANDEN") && !rawVerdict.toUpperCase().includes("NICHT"));
  const defGrade = passedHint ? "B" : "C";

  /* Texto del alumno y recuento real de palabras (el del modelo no es fiable:
     inflaba entre un 15 % y un 20 %). */
  const textoFuente = String(studentText || raw.student_text || "");
  const palabrasReales = textoFuente ? countWords(textoFuente) : 0;

  const c1 = normalizeCrit("aufgabenbewaeltigung", extractCriterion(["aufgabenbewaeltigung", "aufgabenbewältigung", "aufgaben", "leitpunkte", "task", "i", "1"]), defGrade, "Aufgabenbewältigung");
  const c2 = normalizeCrit("angemessenheit", extractCriterion(["angemessenheit", "kommunikative_angemessenheit", "kommunikative_gestaltung", "angemessen", "register", "stil", "ii", "2"]), defGrade, "Kommunikative Gestaltung");
  const c3 = normalizeCrit("korrektheit", extractCriterion(["korrektheit", "formale_richtigkeit", "richtigkeit", "grammatik", "orthographie", "iii", "3"]), defGrade, "Formale Richtigkeit");
  const c4 = normalizeCrit("repertoire", extractCriterion(["repertoire", "sprachliche_mittel", "spektrum", "wortschatz", "varianz", "iv", "4"]), defGrade, "Sprachliche Mittel");

  if((!c1.leitpunkte_check || !c1.leitpunkte_check.length) && (raw.leitpunkte_check || raw.leitpunkte)){
    const rootLp = raw.leitpunkte_check || raw.leitpunkte;
    if(Array.isArray(rootLp)){
      c1.leitpunkte_check = rootLp.map(lp => {
        if(typeof lp === "string") return { point: lp, covered: true, comment: "" };
        const pt = lp.point || lp.leitpunkt || lp.thema || "";
        const cov = lp.covered != null ? Boolean(lp.covered) : true;
        const cm = lp.comment || lp.kommentar || lp.feedback || "";
        return { point: String(pt), covered: cov, comment: String(cm) };
      });
    }
  }

  /* Puntos y veredicto: los pone la app a partir de las bandas. El modelo solo
     juzga (banda + motivos); el número sale siempre de la misma tabla. */
  const puntuado = puntuarCriterios(c1, c2, c3, c4, palabrasReales, totalLeitpunkte);
  const scoreTotal = puntuado.score_total;
  const verdict = puntuado.verdict;

  // Errores críticos
  let critical_errors = raw.critical_errors || raw.errors || raw.fehler || raw.correcciones || [];
  if(!Array.isArray(critical_errors)) critical_errors = [];
  critical_errors = critical_errors.map(e => {
    if(typeof e === "string") return { original: e, correction: "", rule_es: "", type: "Hinweis" };
    if(!e || typeof e !== "object") return null;   // el LLM (o un doc ajeno) puede devolver null/números
    return {
      original: String(e.original || e.falsch || e.text || e.fehler || ""),
      correction: String(e.correction || e.korrektur || e.richtig || e.besser || ""),
      rule_es: String(e.rule_es || e.rule || e.regla || e.erklaerung || e.explicacion || e.grund || ""),
      type: String(e.type || e.kategorie || e.art || "Grammatik")
    };
  }).filter(e => e && (e.original || e.correction))
    /* Una «corrección» idéntica al original no corrige nada: pasa cuando la IA
       escribe en `original` la frase ya arreglada (p. ej. un error de mayúsculas
       en «zuständigen abteilung») y la tarjeta sale con el mismo texto en rojo y
       en verde. Se descarta para no confundir al alumno ni inflar el recuento. */
    .filter(e => comparableText(e.original) !== comparableText(e.correction));

  // Puntos fuertes
  let strengths = raw.strengths || raw.staerken || raw.stärken || raw.puntos_fuertes || raw.positiv || [];
  if(!Array.isArray(strengths)){
    strengths = typeof strengths === "string" ? [strengths] : [];
  }
  strengths = strengths.map(s => String(s)).filter(Boolean);

  // Áreas de mejora
  let areas = raw.areas_for_improvement || raw.verbesserung || raw.verbesserungsbereich || raw.aspectos_a_mejorar || raw.schwaechen || raw.schwächen || [];
  if(!Array.isArray(areas)){
    areas = typeof areas === "string" ? [areas] : [];
  }
  areas = areas.map(a => String(a)).filter(Boolean);

  // Versión profesional sugerida
  const corrected_version = formatGermanLetter(raw.corrected_version || raw.korrigierte_fassung || raw.version_corregida || raw.model_text || raw.korrektur || "");
  const musterloesung = formatGermanLetter(raw.musterloesung || raw.musterlösung || raw.beispiel_loesung || "");

  // El recuento puede venir como cadena del modelo; Firestore exige entero.
  const wordCount = Math.round(Number(raw.word_count));

  return {
    verdict,
    score_total: scoreTotal,
    word_count: palabrasReales > 0 ? palabrasReales : (Number.isFinite(wordCount) && wordCount > 0 ? wordCount : 0),
    pasadas: Number(raw.pasadas) || 0,
    student_text: raw.student_text || "",
    criteria: puntuado.criteria,
    critical_errors,
    strengths,
    areas_for_improvement: areas,
    corrected_version,
    musterloesung
  };
}

function cleanQuotes(s){
  return String(s || "").replace(/^[«»"„“”'’`\s]+|[«»"„“”'’`\s]+$/g, "").trim();
}

/* Texto normalizado para comparar dos fragmentos: sin comillas decorativas y con
   los espacios colapsados, pero SIN tocar las mayúsculas: «abteilung» -> «Abteilung»
   es una corrección real y debe seguir mostrándose. */
function comparableText(s){
  return cleanQuotes(String(s == null ? "" : s)).replace(/\s+/g, " ");
}

function findErrorRanges(studentText, errors){
  if(!studentText || !errors || !errors.length) return [];
  const ranges = [];
  errors.forEach((err, errIdx) => {
    let orig = cleanQuotes(err.original);
    if(!orig) return;
    let start = studentText.indexOf(orig);
    if(start === -1) start = studentText.toLowerCase().indexOf(orig.toLowerCase());
    if(start === -1){
      const escaped = orig.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+");
      try {
        const regex = new RegExp(escaped, "i");
        const match = studentText.match(regex);
        if(match && match.index !== undefined){
          start = match.index;
          orig = match[0];
        }
      } catch(e){}
    }
    if(start === -1){
      const trimmed = orig.replace(/[.,;:!?]+$/, "").trim();
      if(trimmed.length > 3){
        start = studentText.toLowerCase().indexOf(trimmed.toLowerCase());
        if(start !== -1) orig = studentText.slice(start, start + trimmed.length);
      }
    }
    if(start !== -1){
      ranges.push({
        start: start,
        end: start + orig.length,
        err: err,
        errIdx: errIdx,
        text: studentText.slice(start, start + orig.length)
      });
    }
  });
  ranges.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const clean = [];
  let lastEnd = 0;
  for(const r of ranges){
    if(r.start >= lastEnd){
      clean.push(r);
      lastEnd = r.end;
    }
  }
  return clean;
}

    if(t.includes("wort")) numWort++;
    else if(t.includes("zeich") || t.includes("punkt") || t.includes("ortho") || t.includes("rechtschreib")) numZeich++;

          '</span>') +
    '</div>' +
    '<div class="err-legend">' +
      (numGram > 0 ? '<span class="legend-chip gram"><span class="dot"></span>' + t("chipGram", {num: numGram}) + '</span>' : '') +
      (numWort > 0 ? '<span class="legend-chip wort"><span class="dot"></span>' + t("chipWort", {num: numWort}) + '</span>' : '') +
      (numZeich > 0 ? '<span class="legend-chip zeichen"><span class="dot"></span>' + t("chipZeich", {num: numZeich}) + '</span>' : '') +
      (numStil > 0 ? '<span class="legend-chip stil"><span class="dot"></span>' + t("chipStil", {num: numStil}) + '</span>' : '') +
    '</div>';
  textCard.appendChild(head);

  // Selector de pestañas para el texto
  const tabRow = document.createElement("div");
  tabRow.className = "tab-pills";
  tabRow.innerHTML =
    '<button class="tab-pill active" id="pill-annotated">' + t("tabAnnotated", {ranges: errorRanges.length, total: errorsList.length}) + '</button>' +
    '<button class="tab-pill" id="pill-clean">' + t("tabClean") + '</button>' +
    (res.corrected_version ? '<button class="tab-pill" id="pill-model">' + t("tabModel") + '</button>' : '') +
    (res.musterloesung ? '<button class="tab-pill" id="pill-muster">' + t("tabMuster") + '</button>' : '');

  if(!studentText){
    annotatedBox.innerHTML = '<span class="notice-dim">' + t("noDraftFound") + '</span>';

    if(errorsList.length === 0){
      annotatedBox.innerHTML = '<div class="notice-ok">' + t("perfectTextNotice") + '</div>' + esc(studentText);
    } else {
      annotatedBox.innerHTML = esc(studentText);
    }
  } else {
    let htmlPieces = [];
    let lastEnd = 0;
    errorRanges.forEach((range) => {
      if(range.start > lastEnd){
        htmlPieces.push(esc(studentText.slice(lastEnd, range.start)));
      }
      const err = range.err;
      const typeStr = String(err.type || "Grammatik").toLowerCase();
      let typeClass = "err-grammatik";
      let badgeClass = "niedrig";
      if(typeStr.includes("wort")){
        typeClass = "err-wortschatz";
        badgeClass = "mittel";
      } else if(typeStr.includes("zeich") || typeStr.includes("punkt") || typeStr.includes("ortho") || typeStr.includes("rechtschreib")){

        typeClass = "err-stil";

        '<mark class="err-highlight ' + typeClass + '" data-err-target="err-card-' + range.errIdx + '" title="' + t("popoverClickTitle") + '">' +

            '<span class="err-popover-corr">➔ ' + esc(err.correction) + '</span>' +
            '<span class="err-popover-rule">💡 ' + esc(err.rule_es) + '</span>' +
          '</span>' +
        '</mark>';
      htmlPieces.push(pieceHtml);
      lastEnd = range.end;
    });
    if(lastEnd < studentText.length){
      htmlPieces.push(esc(studentText.slice(lastEnd)));
    }
    annotatedBox.innerHTML = htmlPieces.join("");
  }
  textCard.appendChild(annotatedBox);

  // Caja de texto limpia

    musterBox.className = "annotated-text-box";
    musterBox.style.display = "none";
    musterBox.style.borderLeft = "4px solid var(--ok)";
    musterBox.textContent = res.musterloesung;
    textCard.appendChild(musterBox);
  }

  card.appendChild(textCard);

  /* 4 Criterios Oficiales telc B2 */
  const cGrid = document.createElement("div");
  cGrid.className = "crit-grid";
  const critNames = [
    { key: "aufgabenbewaeltigung", title: "I. Aufgabenbewältigung" },
    { key: "angemessenheit", title: "II. Kommunikative Angemessenheit" },
    { key: "korrektheit", title: "III. Formale Richtigkeit" },
    { key: "repertoire", title: "IV. Sprachliche Mittel / Repertoire" }
  ];

  critNames.forEach(cn=>{
    const cData = (res.criteria && res.criteria[cn.key]) || {};
    const box = document.createElement("div");
    box.className = "crit-box";
    const gradeColor = cData.grade === "A" ? "hoch" : (cData.grade === "B" ? "ok" : (cData.grade === "C" ? "mittel" : "niedrig"));
    box.innerHTML = '<div class="ch">' +
                    '<span>' + esc(cn.title) + '</span>' +
                    '<span class="badge ' + gradeColor + '">' + t("gradeLabel", {grade: esc(cData.grade || "-"), score: (cData.score != null ? cData.score : '-'), max: (RUBRICA.max[cn.key] || 22)}) + '</span>' +
                    '</div>' +
                    '<div class="c-body">' + esc(cData.feedback || "") + '</div>';

    /* Si las tres pasadas no coincidieron, ese criterio está en la frontera: es
       información útil, no ruido. */
    if(cData.discrepancia){
      const dud = document.createElement("div");
      dud.className = "micro-block";
      dud.style.marginTop = "6px";
      dud.textContent = t("critUnstable", {bands: cData.discrepancia});
      box.appendChild(dud);
    }

    if(cData.leitpunkte_check && cData.leitpunkte_check.length){
      const lCheck = document.createElement("div");
      lCheck.style.marginTop = "8px";
      lCheck.style.fontSize = "12px";
      lCheck.innerHTML = '<b>' + t("leitpunkteCheckHeader") + '</b>' +
        '<ul class="list-tight xs">' +
        cData.leitpunkte_check.map(lp =>
          '<li>' + (lp.covered ? '<span class="em-ok">✓</span> ' : '<span class="em-bad">✗</span> ') +
          '<b>' + esc(lp.point) + ':</b> ' + esc(lp.comment) + '</li>'
        ).join('') +
        '</ul>';
      box.appendChild(lCheck);
    }
    cGrid.appendChild(box);
  });
  card.appendChild(cGrid);

  /* Errores detallados con sincronización bidireccional */
  if(res.critical_errors && res.critical_errors.length){
    const errSec = document.createElement("div");
    errSec.style.marginTop = "16px";
    errSec.innerHTML = '<h4 class="sec-title">' + t("errorsBreakdownTitle", {count: res.critical_errors.length}) + '</h4>';
    
    res.critical_errors.forEach((err, errIdx)=>{
      const typeStr = String(err.type || "Grammatik").toLowerCase();
      /* La familia del error decide su insignia Y el filo de la tarjeta. El color
         NO se escribe aquí: sale del tema por la clase, si no se queda con los
         valores del mundo anterior y no cambia al cambiar de tema. */
      let badgeClass = "niedrig";
      let familia = "grammatik";
      if(typeStr.includes("wort")){
        badgeClass = "mittel";
        familia = "wortschatz";
      } else if(typeStr.includes("zeich") || typeStr.includes("punkt") || typeStr.includes("ortho") || typeStr.includes("rechtschreib")){
        badgeClass = "ok";
        familia = "zeichensetzung";
      } else if(typeStr.includes("stil") || typeStr.includes("reg")){
        badgeClass = "tag";
        familia = "stil";
      }

      const eb = document.createElement("div");
      eb.className = "err-card err-" + familia;
      eb.id = "err-card-" + errIdx;
      eb.innerHTML =
        '<div class="err-card-head">' +
          '<div class="err-card-head-l">' +
            '<span class="err-idx">#' + (errIdx + 1) + '</span>' +
            '<span class="badge ' + badgeClass + '">' + esc(err.type || "Grammatik") + '</span>' +
          '</div>' +
          '<span class="micro" title="' + t("locateInText") + '">' + t("locateInText") + '</span>' +
        '</div>' +
        '<div class="orig">„' + esc(err.original) + '“</div>' +
        '<div class="corr">➔ ' + esc(err.correction) + '</div>' +
        '<div class="rule">💡 ' + esc(err.rule_es) + '</div>';

      eb.onclick = ()=>{
        const highlightEl = document.querySelector('.err-highlight[data-err-target="err-card-' + errIdx + '"]');
        if(highlightEl){
          highlightEl.scrollIntoView({ behavior: "smooth", block: "center" });
          highlightEl.classList.add("active");
          setTimeout(()=>{ highlightEl.classList.remove("active"); }, 2000);
        }
      };

      errSec.appendChild(eb);
    });
    card.appendChild(errSec);
  }

  /* Puntos fuertes y Áreas de mejora */
  const fbRow = document.createElement("div");
  fbRow.className = "crit-grid";
  fbRow.style.marginTop = "16px";

  if(res.strengths && res.strengths.length){
    const stBox = document.createElement("div");
    stBox.className = "crit-box";
    stBox.style.borderLeft = "4px solid var(--ok)";

  }

  if(res.areas_for_improvement && res.areas_for_improvement.length){

    impBox.className = "crit-box";
    impBox.style.borderLeft = "4px solid var(--warn)";
    impBox.innerHTML = '<b class="em-warn">' + t("areasTitle") + '</b>' +

      res.areas_for_improvement.map(i => '<li>' + esc(i) + '</li>').join('') +
      '</ul>';
    fbRow.appendChild(impBox);
  }
  card.appendChild(fbRow);

  /* Versión corregida B2 oficial */
  if(res.corrected_version){
    const cvSec = document.createElement("div");
    cvSec.style.marginTop = "16px";
    cvSec.innerHTML =
      '<div class="sec-head">' +
        '<div>' +
          '<h4 class="cv-title">' + t("optimizedTextTitle") + '</h4>' +
          '<small class="micro">' + t("optimizedTextSub") + '</small>' +
        '</div>' +
        '<button class="copy-btn" id="btn-copy-model">' + t("btnCopyText") + '</button>' +
      '</div>' +
      '<div class="model-text" id="model-text-content">' + esc(res.corrected_version) + '</div>';
    card.appendChild(cvSec);
  }

  if(res.musterloesung){
    const msSec = document.createElement("div");
    msSec.style.marginTop = "16px";
    msSec.innerHTML =
      '<div class="sec-head">' +
        '<div>' +
          '<h4 class="cv-title em-ok">' + t("musterloesungTitle") + '</h4>' +
          '<small class="micro">' + t("musterloesungSub") + '</small>' +
        '</div>' +
        '<button class="copy-btn" id="btn-copy-muster">' + t("btnCopyText") + '</button>' +
      '</div>' +
      '<div class="model-text ok-edge" id="muster-text-content">' + esc(res.musterloesung) + '</div>';
    card.appendChild(msSec);
  }

  /* Botón para borrar evaluación */
  const bDelEval = document.createElement("button");
  bDelEval.className = "btn ghost";
  bDelEval.style.marginTop = "16px";
  bDelEval.textContent = t("btnDeleteEval");
  bDelEval.onclick = ()=>{
    if(confirm(t("confirmDeleteEval"))){
      delEval(v.id);
      saveState();
      pushSchreibenToFirestore(v.id, undefined, null);
      render();
    }
  };
  card.appendChild(bDelEval);

  // Conectar eventos interactivos tras montar el DOM
  setTimeout(()=>{
    const pAnn = document.getElementById("pill-annotated");
    const pCln = document.getElementById("pill-clean");
    const pMod = document.getElementById("pill-model");
    const pMus = document.getElementById("pill-muster");
    const bAnn = document.getElementById("box-annotated-text");
    const bCln = document.getElementById("box-clean-text");
    const bMod = document.getElementById("box-model-text");
    const bMus = document.getElementById("box-muster-text");

    const allPills = [pAnn, pCln, pMod, pMus].filter(Boolean);
    const allBoxes = [bAnn, bCln, bMod, bMus].filter(Boolean);

    function switchTab(activePill, activeBox){
      allPills.forEach(p => { p.className = (p === activePill ? "tab-pill active" : "tab-pill"); });
      allBoxes.forEach(b => { b.style.display = (b === activeBox ? "block" : "none"); });
    }

    if(pAnn && bAnn) pAnn.onclick = ()=> switchTab(pAnn, bAnn);
    if(pCln && bCln) pCln.onclick = ()=> switchTab(pCln, bCln);
    if(pMod && bMod) pMod.onclick = ()=> switchTab(pMod, bMod);
    if(pMus && bMus) pMus.onclick = ()=> switchTab(pMus, bMus);

    // Clic en un highlight para desplazarse a la tarjeta correspondiente
    document.querySelectorAll(".err-highlight").forEach(el => {
      el.onclick = (e)=>{
        e.stopPropagation();
        const targetId = el.getAttribute("data-err-target");
        if(!targetId) return;
        const targetCard = document.getElementById(targetId);
        if(targetCard){
          targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
          targetCard.classList.add("pulse");
          setTimeout(()=>{ targetCard.classList.remove("pulse"); }, 1800);
        }
      };
    });

    const setupCopyBtn = (btnId, text)=>{
      const btn = document.getElementById(btnId);
      if(btn && text){
        btn.onclick = ()=>{
          navigator.clipboard.writeText(text).then(()=>{
            btn.textContent = t("btnCopiedText");
            setTimeout(()=>{ btn.textContent = t("btnCopyText"); }, 2000);
          }).catch(()=>{});
        };
      }
    };
    setupCopyBtn("btn-copy-model", res.corrected_version);
    setupCopyBtn("btn-copy-muster", res.musterloesung);
  }, 15);

  return card;
}

  /* El recuento lo hace la app y se le da hecho: contando por su cuenta se

    parts.push("- Die korrigierte Fassung (`corrected_version`) und die Musterlösung (`musterloesung`) MÜSSEN auf DEUTSCH (B2-Niveau) sein.");
  }

  parts.push("\nAnalysiere nun den Text und gib das strukturierte JSON-Ergebnis gemäß der Schema-Definition zurück.");

  return parts.join('\n');
}

function parseEvaluationJson(rawText){
  let str = (rawText || "").trim();
  const codeBlockMatch = str.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  if(codeBlockMatch && codeBlockMatch[1]){
    str = codeBlockMatch[1].trim();
  } else {
    const firstBrace = str.indexOf('{');
    const lastBrace = str.lastIndexOf('}');
    if(firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace){
      str = str.slice(firstBrace, lastBrace + 1).trim();
    }
  }
  try {
    return JSON.parse(str);
  } catch(e) {
    try {
      const sanitized = str.replace(/,\s*([\]}])/g, '$1');
      return JSON.parse(sanitized);
    } catch(e2){
      throw new Error(t("evalBadJson") + str.slice(0, 260));
    }
  }
}

/* Una pasada al proveedor elegido. Devuelve el JSON crudo, sin normalizar. */
async function evaluarUnaPasada(config, systemPrompt, userPrompt){
  if(config.provider === "gemini"){
    const model = config.geminiModel || "gemini-3.5-flash-lite";
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(config.geminiKey);
    const genConfig = {
      response_mime_type: "application/json",
      temperature: 0
    };
    if(DATA.prompt_schreiben && DATA.prompt_schreiben.json_schema){
      genConfig.response_schema = DATA.prompt_schreiben.json_schema;
    }
    const body = {
      system_instruction: { parts: [{ text: systemPrompt }] },
      contents: [{ parts: [{ text: userPrompt }] }],
      generationConfig: genConfig
    };
    let resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    // Fallback de reintento si el endpoint rechaza el schema estricto
    if(!resp.ok && resp.status === 400 && genConfig.response_schema){
      delete genConfig.response_schema;
      resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
    }
    if(!resp.ok){
      const errText = await resp.text();
      let msg = "Error " + resp.status + " de Gemini API";
      try {
        const j = JSON.parse(errText);
        if(j.error && j.error.message) msg += ": " + j.error.message;
      } catch(e){ msg += ": " + errText; }
      throw new Error(msg);
    }
    const data = await resp.json();
    const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!raw) throw new Error(t("evalGeminiEmpty"));
    return parseEvaluationJson(raw);

  } else if(config.provider === "openai_compatible"){
    let url = (config.customEndpoint || "https://api.deepseek.com").replace(/\/+$/, "");
    if(!url.endsWith("/chat/completions")) url += "/chat/completions";
    const body = {
      model: config.customModel || "deepseek-chat",
      messages: [
        { role: "system", content: systemPrompt },
        { role: "user", content: userPrompt }
      ],
      response_format: { type: "json_object" },
      temperature: 0
    };
    const resp = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + config.customKey
      },
      body: JSON.stringify(body)
    });
    if(!resp.ok){
      const errText = await resp.text();
      let msg = "Error " + resp.status + " de API";
      try {
        const j = JSON.parse(errText);
        if(j.error && j.error.message) msg += ": " + j.error.message;
      } catch(e){ msg += ": " + errText; }
      throw new Error(msg);
    }
    const data = await resp.json();
    const raw = data?.choices?.[0]?.message?.content;
    if(!raw) throw new Error(t("evalApiEmpty"));
    return parseEvaluationJson(raw);

  } else if(config.provider === "ollama"){
    let url = (config.ollamaEndpoint || "http://localhost:11434").replace(/\/+$/, "");
    if(!url.endsWith("/api/chat")) url += "/api/chat";
    const body = {
      model: config.ollamaModel || "llama3.1",
      messages: [
        { role: "system", content: systemPrompt },
        { role: "user", content: userPrompt }
      ],
      format: "json",
      stream: false,
      options: { temperature: 0 }
    };
    let resp;
    try {
      resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
    } catch(e){
      throw new Error(t("evalOllamaOffline", {url: url}));
    }
    if(!resp.ok){
      const errText = await resp.text();
      throw new Error(t("evalOllamaError", {status: resp.status}) + errText);
    }
    const data = await resp.json();
    const raw = data?.message?.content;
    if(!raw) throw new Error(t("evalOllamaEmpty"));
    return parseEvaluationJson(raw);
  }
  throw new Error(t("evalUnknownProvider", {provider: config.provider}));
}

/* Tres pasadas y banda MEDIANA por criterio. Una sola pasada oscila: el mismo
   texto dio 48 y 61 con los mismos cuatro Leitpunkte cubiertos. En paralelo
   tardan lo mismo que una. */
const PASADAS = 3;
const CLAVES_CRITERIO = ["aufgabenbewaeltigung", "angemessenheit", "korrektheit", "repertoire"];
const NIVEL_BANDA = { D: 0, C: 1, B: 2, A: 3 };

function bandaMediana(bandas){
  const orden = bandas.slice().sort((a, b) => (NIVEL_BANDA[a] || 0) - (NIVEL_BANDA[b] || 0));
  return orden[Math.floor(orden.length / 2)];
}

function combinarPasadas(crudos, studentText, totalLeitpunkte){
  const normalizadas = crudos.map(c => normalizeEvaluationResult(c, studentText, totalLeitpunkte));
  const medianas = {}, discrepancia = {};
  CLAVES_CRITERIO.forEach(k=>{
    const bandas = normalizadas.map(n => (n.criteria[k] || {}).grade || "D");
    medianas[k] = bandaMediana(bandas);
    const distintas = Array.from(new Set(bandas));
    discrepancia[k] = distintas.length > 1 ? distintas.join("/") : "";
  });

  /* La pasada que más se acerca a las medianas es la base: así el texto corregido,
     la lista de errores y el feedback salen de UNA evaluación coherente y no de
     una mezcla de tres. */
  let base = normalizadas[0], mejor = Infinity;
  normalizadas.forEach(n=>{
    const d = CLAVES_CRITERIO.reduce((s, k) =>
      s + Math.abs((NIVEL_BANDA[(n.criteria[k] || {}).grade] || 0) - NIVEL_BANDA[medianas[k]]), 0);
    if(d < mejor){ mejor = d; base = n; }
  });

  const conMediana = {};
  CLAVES_CRITERIO.forEach(k=>{
    conMediana[k] = Object.assign({}, base.criteria[k], { grade: medianas[k], discrepancia: discrepancia[k] });
  });

  const puntuado = puntuarCriterios(conMediana.aufgabenbewaeltigung, conMediana.angemessenheit,
                                    conMediana.korrektheit, conMediana.repertoire,
                                    countWords(studentText), totalLeitpunkte);
  return Object.assign({}, base, {
    criteria: puntuado.criteria,
    score_total: puntuado.score_total,
    verdict: puntuado.verdict,
    pasadas: normalizadas.length
  });
}

async function evaluateWithLLM(task, studentText, onProgress){
  const config = getAIConfig();
  const systemPrompt = DATA.prompt_schreiben?.system_prompt || "";
  const userPrompt = buildUserPromptClient(task, studentText);

  if(onProgress){
    const etiqueta = config.provider === "gemini"
      ? t("evalProgressGemini", {model: config.geminiModel})
      : (config.provider === "ollama"
        ? t("evalProgressOllama", {model: config.ollamaModel})
        : t("evalProgressCustom", {model: config.customModel, endpoint: config.customEndpoint}));
    onProgress(etiqueta + " · " + t("evalProgressPasadas", {n: PASADAS}));
  }

  /* allSettled: si una pasada falla (red, cuota), las otras siguen valiendo. Con
     una sola respuesta se usa esa; sin ninguna, el error. */
  const resultados = await Promise.allSettled(
    Array.from({ length: PASADAS }, () => evaluarUnaPasada(config, systemPrompt, userPrompt))
  );
  const crudos = resultados.filter(r => r.status === "fulfilled").map(r => r.value);
  if(!crudos.length){
    const fallo = resultados.find(r => r.status === "rejected");
    throw (fallo && fallo.reason) || new Error(t("evalUnknownProvider", {provider: config.provider}));
  }

  if(onProgress) onProgress(t("evalProgressCombinando"));
  return combinarPasadas(crudos, studentText, (task.leitpunkte || []).length);
}

    const testRes = document.getElementById("test-result");
    testRes.innerHTML = '<span class="micro">' + t("testTesting") + '</span>';
    const tempCfg = readAIConfigFromModal();
    /* Probar también guarda: así nadie se queda con la clave sin guardar. */
    const guardadoAlProbar = saveAIConfig(tempCfg);
    try {
      if(tempCfg.provider === "gemini"){
        if(!tempCfg.geminiKey) throw new Error(t("alertEnterGeminiKey"));
        const u = "https://generativelanguage.googleapis.com/v1beta/models/" + tempCfg.geminiModel + ":generateContent?key=" + encodeURIComponent(tempCfg.geminiKey);
        const r = await fetch(u, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ contents: [{ parts: [{ text: "Antworte kurz mit OK." }] }] })
        });
        if(!r.ok) throw new Error("HTTP " + r.status + ": " + (await r.text()).slice(0, 100));
      } else if(tempCfg.provider === "openai_compatible"){
        if(!tempCfg.customKey) throw new Error(t("alertEnterKey"));
        let u = tempCfg.customEndpoint.replace(/\/+$/, "");
        if(!u.endsWith("/chat/completions")) u += "/chat/completions";
        const r = await fetch(u, {
          method: "POST",
          headers: {"Content-Type": "application/json", "Authorization": "Bearer " + tempCfg.customKey},
          body: JSON.stringify({ model: tempCfg.customModel, messages: [{role: "user", content: "Ping"}] })
        });
        if(!r.ok) throw new Error("HTTP " + r.status + ": " + (await r.text()).slice(0, 100));
      } else if(tempCfg.provider === "ollama"){
        let u = tempCfg.ollamaEndpoint.replace(/\/+$/, "") + "/api/tags";
        const r = await fetch(u);
        if(!r.ok) throw new Error("HTTP " + r.status);
      }
      testRes.innerHTML = '<span class="em-ok">' + t("testSuccess") +
        (guardadoAlProbar ? " · " + t("testSaved") : " · " + t("aiStorageBlocked")) + '</span>';
    } catch(e) {
      testRes.innerHTML = '<span class="em-bad">' + t("testFailed", {error: esc(errorDeRed(e))}) + '</span>';
    }
  };
}
