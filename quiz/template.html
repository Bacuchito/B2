<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Aplica el tema guardado antes del primer pintado (sin parpadeo). -->
<script>try{var s=localStorage.getItem("b2quiz_theme");if(s==="dark"||s==="paper")document.documentElement.setAttribute("data-theme",s);}catch(e){}</script>
<title>B2 Beruf — Test de Lesen, Hören y Schreiben</title>
<!-- Firebase SDKs compat con tolerancia offline -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  /* ==========================================================================
     B2 Beruf — mundo «Prüfungsbogen» (hoja de examen impresa).
     Por defecto: papel hueso con tinta cálida; [data-theme="dark"]: modo noche
     refinado (carbón cálido, sin glass). Todo el color sale de tokens: cambiar
     la paleta o el tema es tocar el bloque de tokens, no los componentes.
     Reglas de elevación: hojas = sombra cálida; controles = hairline.
     ========================================================================== */
  :root{
    /* --- Papel: capas de superficie --- */
    --bg:#e9e2d1;                 /* escritorio (papel más tostado) */
    --panel:#fbf8f1;              /* hoja elevada (tarjetas, cabecera) */
    --panel2:#f3eee2;             /* hoja secundaria (pies, burbujas) */
    --panel3:#efe9db;             /* superficie hundida (chips, inputs) */
    --sheet:#fffdf6;              /* hoja en blanco (escritura) */
    --line:rgba(58,46,26,.15);    /* hairline cálido */
    --line-2:rgba(58,46,26,.30);

    /* --- Tinta: texto (contrastes medidos en design_audit.js) --- */
    --txt:#241f16;
    --dim:#5c5546;
    --dim-2:#67604e;

    /* --- Acentos: tinta azul (navegación) y tintas de corrección --- */
    --acc:#2c4d8f;
    --acc-fill-1:#2c4d8f;         /* relleno con texto claro: 7.9:1 */
    --acc-fill-2:#233e75;         /* sombra/hover del relleno */
    --acc-2:#3f63ad;
    --acc-ink:#2c4d8f;
    --on-acc:#fdfbf6;
    --ok:#2e6e49; --ok-ink:#1f5c3b;
    --bad:#b0362a; --bad-ink:#9c2f24;
    --warn:#8a6414; --warn-ink:#6e5110;
    --violet-ink:#6b4a9e;
    --ring:rgba(44,77,143,.55);

    /* --- Tintas de fondo (estados) --- */
    --tint-ok:rgba(46,110,73,.10);
    --tint-bad:rgba(176,54,42,.09);
    --tint-warn:rgba(138,100,20,.08);
    --tint-acc:rgba(44,77,143,.09);
    --tint-violet:rgba(107,74,158,.10);
    --tint-neutral:rgba(58,46,26,.05);
    --chip:#efe9db;
    --chip-hover:#e7e0cf;
    --scrim:rgba(24,19,10,.52);
    --selection:rgba(44,77,143,.22);
    --scroll:rgba(58,46,26,.28);

    /* --- Espaciado: grid de 8pt (4px solo para ajustes finos) --- */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

    /* --- Radios --- */
    --radius:12px;
    --r-1:6px; --r-2:10px; --r-3:12px; --r-4:16px; --r-pill:999px;

    /* --- Tipografía --- */
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-read:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --font-mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
    --fs-micro:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:15px; --fs-lead:17px;
    --fs-h3:20px; --fs-h2:32px; --fs-h1:19px;

    /* --- Elevación: sombra amplia (atmósfera) + sombra corta (plano) --- */
    --sh-1:0 1px 2px rgba(60,48,26,.10),0 3px 10px -4px rgba(60,48,26,.16);
    --sh-2:0 2px 6px rgba(60,48,26,.10),0 12px 28px -12px rgba(60,48,26,.20);
    --sh-3:0 4px 12px rgba(60,48,26,.12),0 28px 64px -20px rgba(60,48,26,.28);

    /* --- Movimiento: físicas elásticas --- */
    --dur-1:120ms; --dur-2:180ms; --dur-3:280ms;
    --ease:cubic-bezier(.2,.7,.3,1);
    --spring:cubic-bezier(.16,1,.3,1);

    /* --- Medidas de estructura --- */
    --header-h:57px; --nav-w:288px; --read-w:68ch;
    /* Mesa de examen (pantallas ≥1500px): ancho de la columna de referencia
       —anuncios o texto— y tope al que se estira la hoja de preguntas. */
    --desk-ref:600px; --desk-work:860px;
  }

  /* --- Modo noche: mismo mundo, tinta clara sobre carbón cálido --- */
  [data-theme="dark"]{
    --bg:#16130e;
    --panel:#211c15;
    --panel2:#26211a;
    --panel3:#1b1711;
    --sheet:#1e1a13;
    --line:rgba(240,230,210,.13);
    --line-2:rgba(240,230,210,.26);

    --txt:#ece5d6;
    --dim:#b0a793;
    --dim-2:#8d8471;

    --acc:#93b0e8;
    --acc-fill-1:#3a5a96;
    --acc-fill-2:#2c487c;
    --acc-2:#5f80bd;
    --acc-ink:#a3bdea;
    --on-acc:#f7f4ec;
    --ok:#4fae7d; --ok-ink:#8edbb2;
    --bad:#d76a5c; --bad-ink:#f0a79c;
    --warn:#c99a3f; --warn-ink:#e0b86a;
    --violet-ink:#bda1ea;
    --ring:rgba(147,176,232,.55);

    --tint-ok:rgba(79,174,125,.13);
    --tint-bad:rgba(215,106,92,.13);
    --tint-warn:rgba(201,154,63,.11);
    --tint-acc:rgba(147,176,232,.12);
    --tint-violet:rgba(189,161,234,.13);
    --tint-neutral:rgba(240,230,210,.06);
    --chip:#1b1711;
    --chip-hover:#241f17;
    --scrim:rgba(6,5,3,.62);
    --selection:rgba(147,176,232,.30);
    --scroll:rgba(240,230,210,.28);

    --sh-1:0 1px 2px rgba(0,0,0,.40),0 3px 10px -4px rgba(0,0,0,.55);
    --sh-2:0 2px 6px rgba(0,0,0,.42),0 12px 28px -12px rgba(0,0,0,.62);
    --sh-3:0 4px 12px rgba(0,0,0,.45),0 28px 64px -20px rgba(0,0,0,.72);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;font-size:var(--fs-base);line-height:1.6;font-family:var(--font-ui);
       background:var(--bg);
       color:var(--txt);
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
       transition:background var(--dur-3) var(--ease),color var(--dur-3) var(--ease)}
  ::selection{background:var(--selection);color:var(--txt)}

  /* Foco visible en TODO lo interactivo. */
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r-1)}

  /* Barra de desplazamiento con la tinta del papel. */
  *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:var(--r-pill);
                            border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--line-2);background-clip:content-box}

  /* Cabecera: hoja de examen — opaca, con filete doble inferior. */
  header{position:sticky;top:0;z-index:20;
         min-height:var(--header-h);
         background:var(--panel);
         border-bottom:3px double var(--line-2);
         padding:var(--sp-3) var(--sp-5);
         display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
         transition:background var(--dur-3) var(--ease)}
  header h1{font-family:var(--font-read);font-size:var(--fs-h1);margin:0;
            font-weight:700;letter-spacing:-.01em;white-space:nowrap;
            display:flex;align-items:center;gap:var(--sp-2)}
  /* Monograma «B2» como casilla de formulario de examen */
  .monogram{display:inline-flex;align-items:center;justify-content:center;
            background:var(--txt);color:var(--panel);font-family:var(--font-ui);
            font-weight:800;font-size:var(--fs-sm);letter-spacing:.04em;
            padding:0 var(--sp-2);height:24px;border-radius:var(--r-1);flex:0 0 auto}
  /* Filete de progreso: la tinta que rellena el filete doble de la cabecera */
  .progress-rule{position:absolute;left:0;right:0;bottom:-3px;height:3px;
                 overflow:hidden;pointer-events:none}
  .progress-rule span{display:block;height:100%;width:0;background:var(--acc);
                 transition:width var(--dur-3) var(--spring)}
  header .spacer{flex:1}
  .stat{font-size:var(--fs-sm);color:var(--dim);font-variant-numeric:tabular-nums}
  .stat b{color:var(--txt);font-weight:640}

  .layout{display:flex;align-items:flex-start;gap:0}
  nav{width:var(--nav-w);flex:0 0 var(--nav-w);
      border-right:1px solid var(--line);
      background:var(--bg);
      height:calc(100vh - var(--header-h));
      overflow-y:auto;position:sticky;top:var(--header-h);
      padding:var(--sp-3) var(--sp-3) var(--sp-5)}
  nav .sec{font-size:var(--fs-micro);letter-spacing:.10em;text-transform:uppercase;
           color:var(--dim-2);margin:var(--sp-5) var(--sp-2) var(--sp-2);
           padding-bottom:var(--sp-2);border-bottom:1px solid var(--line);
           font-weight:700;display:flex;align-items:center;
           justify-content:space-between;gap:var(--sp-2)}
  /* Cabecera plegable: al menú le sobraban 140 entradas. Un clic abre el grupo
     y cierra el anterior; el contador dice cuántas entradas esconde. */
  nav .sec-toggle{display:flex;align-items:center;gap:var(--sp-2);flex:1 1 auto;
           min-width:0;min-height:32px;cursor:pointer;user-select:none;
           border-radius:var(--r-1);
           transition:color var(--dur-1) var(--ease),transform var(--dur-1) var(--spring)}
  nav .sec-toggle::before{content:"";width:7px;height:7px;flex:0 0 7px;
           border-right:2px solid currentColor;border-bottom:2px solid currentColor;
           transform:rotate(-45deg);transition:transform var(--dur-2) var(--spring)}
  nav .sec.open .sec-toggle::before{transform:rotate(45deg)}
  nav .sec-toggle:hover{color:var(--txt)}
  nav .sec-toggle:active{transform:scale(.985)}
  nav .sec-toggle:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  nav .sec-count{font-variant-numeric:tabular-nums;color:var(--dim-2);font-weight:700;
           margin-left:auto}
  nav .sec.open .sec-count{color:var(--dim)}
  /* El display:flex de los botones gana al [hidden] del navegador: se apaga a mano. */
  nav button[hidden]{display:none}
  nav button.sec-reset{display:inline-flex;align-items:center;width:auto;min-height:28px;
           padding:var(--sp-1) var(--sp-2);border:1px solid var(--line);
           border-radius:var(--r-1);font-size:var(--fs-micro);font-weight:700;letter-spacing:.02em;
           color:var(--dim);text-transform:none;line-height:1.4;background:var(--panel3);
           transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease),
                      border-color var(--dur-1) var(--ease)}
  nav button.sec-reset:hover{background:var(--chip-hover);color:var(--txt);border-color:var(--line-2)}
  nav button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:var(--sp-2);
             text-align:left;background:none;border:1px solid transparent;color:var(--dim);
             min-height:40px;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-2);cursor:pointer;
             font-size:var(--fs-sm);line-height:1.35;font-family:inherit;position:relative;
             transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                        transform var(--dur-1) var(--spring),box-shadow var(--dur-2) var(--ease)}
  nav button:hover{background:var(--tint-neutral);color:var(--txt)}
  nav button:active{transform:scale(.985)}
  nav button.active{background:var(--panel);color:var(--txt);font-weight:640;
             border-color:var(--line);box-shadow:var(--sh-1);
             padding-left:calc(var(--sp-3) + 16px)}
  nav button.active::before{content:"";position:absolute;left:var(--sp-3);top:50%;
             transform:translateY(-50%);
             width:6px;height:6px;background:var(--acc);border-radius:1px}
  nav button .pill{font-size:var(--fs-micro);color:var(--dim-2);font-weight:400;
             font-variant-numeric:tabular-nums;white-space:nowrap}
  nav button.active .pill{color:var(--dim)}

  main{flex:1;min-width:0;padding:var(--sp-6) var(--sp-6) var(--sp-8);max-width:960px}
  /* Masthead editorial: título display + filete + línea de datos en versalitas */
  h2{font-family:var(--font-read);font-size:var(--fs-h2);line-height:1.16;margin:0;
     font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  h2 + .sub{color:var(--dim-2);font-size:var(--fs-xs);font-weight:640;
     margin:var(--sp-4) 0 var(--sp-5);padding-top:var(--sp-3);
     border-top:1px solid var(--line);
     letter-spacing:.09em;text-transform:uppercase;
     font-variant-numeric:tabular-nums}
  h2 + .sub b{color:var(--txt);font-weight:700}

  /* Superficie hoja: sombra cálida, sin borde (elevación declarada una vez). */
  .panel{background:var(--panel);border-radius:var(--r-3);
         padding:var(--sp-4) var(--sp-5);margin-bottom:var(--sp-4);
         box-shadow:var(--sh-1)}
  /* Etiqueta de panel: casilla de formulario, no eyebrow decorativo */
  .panel h3{display:inline-block;margin:0 0 var(--sp-4);font-size:10px;letter-spacing:.12em;
            text-transform:uppercase;color:var(--dim-2);font-weight:700;
            border:1px solid var(--line-2);border-radius:var(--r-1);padding:4px var(--sp-2)}
  .intro-text{font-family:var(--font-read);font-size:var(--fs-lead);line-height:1.7;
              color:var(--txt);max-width:var(--read-w)}

  details.passage summary{cursor:pointer;font-weight:640;font-size:var(--fs-base);color:var(--acc-ink);
                          user-select:none;list-style:none;display:flex;align-items:center;
                          gap:var(--sp-2);min-height:32px;
                          transition:color var(--dur-1) var(--ease)}
  details.passage summary::-webkit-details-marker{display:none}
  details.passage summary::before{content:"";width:7px;height:7px;flex:0 0 7px;
                          border-right:2px solid currentColor;border-bottom:2px solid currentColor;
                          transform:rotate(-45deg);transition:transform var(--dur-2) var(--spring)}
  details.passage[open] summary::before{transform:rotate(45deg)}
  details.passage summary:hover{color:var(--acc)}
  details.passage[open] summary{margin-bottom:var(--sp-3);padding-bottom:var(--sp-2);
                                 border-bottom:1px solid var(--line)}
  .passage-body{white-space:pre-wrap;font-family:var(--font-read);font-size:var(--fs-base);line-height:1.75;
                color:var(--txt);max-width:var(--read-w);max-height:62vh;overflow-y:auto;
                padding-right:var(--sp-2)}

  /* Anuncios: recuadro de papel, sin barras de color de 3px. */
  /* Anuncios como columna de clasificados: filas con filete, no cajas en cajas.
     El estado se lee en la letra: azul = ya asignada por ti, ámbar = libre.
     Nunca marca lo que la clave da por correcto: eso sería enseñar la solución.
     El ✓ repite el estado sin depender del color. */
  .ad{border:0;border-top:1px solid var(--line);padding:var(--sp-3) var(--sp-2);margin:0;
      border-radius:0;background:transparent;font-family:var(--font-read);
      transition:background var(--dur-2) var(--ease)}
  .ad:first-child{border-top:0}
  .ad:hover{background:var(--tint-neutral)}
  .ad .k{font-weight:700;margin-right:var(--sp-2);font-variant-numeric:tabular-nums;
         font-family:var(--font-read);font-size:var(--fs-lead)}
  .ad .t{font-weight:640}
  .ad .body{color:var(--dim);font-size:var(--fs-base);margin-top:var(--sp-1);line-height:1.6;
            max-width:var(--read-w)}
  .ad.used .k{color:var(--acc-ink)}
  .ad.unused .k{color:var(--warn-ink)}
  .ad.used .t::after{content:" ✓";color:var(--ok-ink);font-weight:700}

  /* Hoja de examen continua: las preguntas NO son tarjetas apiladas, son filas
     de una sola hoja, con filete de margen rojo como en el papel del examen. */
  .q-sheet{position:relative;background:var(--panel);border-radius:var(--r-3);
           box-shadow:var(--sh-1);padding:var(--sp-2) var(--sp-5) var(--sp-3) 56px;
           margin-bottom:var(--sp-4)}
  .q-sheet::before{content:"";position:absolute;top:var(--sp-4);bottom:var(--sp-4);left:36px;
           width:1px;background:var(--bad);opacity:.45}
  .q{border-radius:0;background:transparent;
     padding:var(--sp-5) 0;margin:0;box-shadow:none;
     border-top:1px solid var(--line)}
  .q:first-child{border-top:0}
  .q .num{display:inline-flex;align-items:center;justify-content:center;
          min-width:28px;height:28px;background:var(--sheet);border:1px solid var(--line-2);
          border-radius:50%;font-size:var(--fs-xs);font-weight:700;margin-right:var(--sp-3);
          color:var(--txt);font-variant-numeric:tabular-nums;vertical-align:middle;
          font-family:var(--font-read)}
  .q .prompt{font-size:var(--fs-lead);line-height:1.55;font-weight:640;margin-bottom:var(--sp-3);display:inline}
  .opts{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-3)}
  .opt{display:flex;gap:var(--sp-3);align-items:flex-start;min-height:44px;border:1px solid var(--line);
       border-radius:var(--r-2);padding:var(--sp-3) var(--sp-4);cursor:pointer;
       background:var(--chip);position:relative;
       transition:background var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease),
                  transform var(--dur-1) var(--spring),box-shadow var(--dur-2) var(--ease)}
  .opt:hover{border-color:var(--line-2);background:var(--chip-hover);
             transform:translateY(-1px);box-shadow:var(--sh-1)}
  .opt:active{transform:scale(.995)}
  .opt .key{font-weight:700;min-width:20px;color:var(--acc-ink);font-variant-numeric:tabular-nums}
  .opt.sel{border-color:var(--acc);background:var(--sheet);
           box-shadow:0 0 0 3px var(--tint-acc)}
  .opt.correct{border-color:rgba(46,110,73,.55);background:var(--tint-ok)}
  .opt.wrong{border-color:rgba(176,54,42,.55);background:var(--tint-bad)}
  .opt.correct .key{color:var(--ok-ink)}
  .opt.wrong .key{color:var(--bad-ink)}
  /* El estado no depende solo del color: marca textual a la derecha. */
  .opt.correct::after,.opt.wrong::after{position:absolute;right:var(--sp-4);top:50%;
       transform:translateY(-50%);font-weight:700;font-size:var(--fs-base)}
  .opt.correct::after{content:"✓";color:var(--ok-ink)}
  .opt.wrong::after{content:"✗";color:var(--bad-ink)}

  .letters{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-3)}
  .letters button{width:44px;height:44px;border-radius:var(--r-2);border:1px solid var(--line);
                  background:var(--sheet);color:var(--txt);font-weight:700;cursor:pointer;
                  font-size:var(--fs-base);font-family:var(--font-read);
                  transition:background var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease),
                             transform var(--dur-1) var(--spring),box-shadow var(--dur-2) var(--ease)}
  .letters button:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh-1)}
  .letters button:active{transform:scale(.96)}
  .letters button.sel{background:var(--acc-fill-1);border-color:var(--acc-fill-2);
                      color:var(--on-acc);box-shadow:var(--sh-1)}
  .letters button.correct{background:#dcecdf;border-color:rgba(46,110,73,.5);color:#1c5638}
  .letters button.wrong{background:#f4dcd7;border-color:rgba(176,54,42,.5);color:#8f2a20}
  [data-theme="dark"] .letters button.correct{background:#24402f;border-color:rgba(79,174,125,.5);color:#a5dfbe}
  [data-theme="dark"] .letters button.wrong{background:#46261f;border-color:rgba(215,106,92,.5);color:#f2aea3}

  .fb{margin-top:var(--sp-4);border-radius:var(--r-2);padding:var(--sp-3) var(--sp-4);
      font-size:var(--fs-base);display:none;border:1px solid transparent}
  .fb.show{display:block;animation:pop var(--dur-2) var(--spring)}
  .fb.good{background:var(--tint-ok);border-color:rgba(46,110,73,.34)}
  .fb.bad{background:var(--tint-bad);border-color:rgba(176,54,42,.34)}
  .fb .verdict{font-weight:650;margin-bottom:var(--sp-2);display:flex;align-items:center;
               gap:var(--sp-2);flex-wrap:wrap}
  .fb .quote{font-family:var(--font-read);font-style:italic;color:var(--dim);font-size:var(--fs-base);
             border-left:1px solid var(--acc);padding:var(--sp-1) 0 var(--sp-1) var(--sp-3);
             margin:var(--sp-2) 0;max-width:var(--read-w)}

  .badge{font-size:var(--fs-micro);font-weight:700;padding:4px var(--sp-2);border-radius:var(--r-pill);
         letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
  .badge.hoch{background:var(--tint-ok);color:var(--ok-ink);border-color:rgba(46,110,73,.38)}
  .badge.mittel{background:var(--tint-warn);color:var(--warn-ink);border-color:rgba(138,100,20,.38)}
  .badge.niedrig{background:var(--tint-bad);color:var(--bad-ink);border-color:rgba(176,54,42,.38)}
  .badge.ok{background:var(--tint-acc);color:var(--acc-ink);border-color:rgba(44,77,143,.38)}
  .badge.tag{background:var(--tint-neutral);color:var(--dim);border-color:var(--line)}

  .row{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center}
  .btn{background:var(--acc-fill-1);color:var(--on-acc);
       border:1px solid var(--acc-fill-2);border-radius:var(--r-2);
       padding:0 var(--sp-4);min-height:40px;cursor:pointer;font-size:var(--fs-base);font-weight:600;
       font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
       box-shadow:var(--sh-1);
       transition:filter var(--dur-1) var(--ease),transform var(--dur-1) var(--spring),
                  background var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease),
                  color var(--dur-2) var(--ease)}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
  .btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--dim);
             box-shadow:none;text-transform:uppercase;letter-spacing:.07em;
             font-size:var(--fs-micro);font-weight:700}
  .btn.ghost:hover{background:var(--sheet);color:var(--txt);border-color:var(--line-2);
                   filter:none;box-shadow:var(--sh-1)}
  .btn.danger{background:var(--tint-bad);border:1px solid rgba(176,54,42,.42);color:var(--bad-ink);
              box-shadow:none}
  .btn.danger:hover{background:rgba(176,54,42,.16);filter:none}
  .btn.success{background:var(--tint-ok);border:1px solid rgba(46,110,73,.42);color:var(--ok-ink);
               box-shadow:none}
  .btn.success:hover{background:rgba(46,110,73,.16);filter:none}
  .btn.sm{min-height:28px;padding:0 var(--sp-3);font-size:var(--fs-xs);border-radius:var(--r-1)}

  .note{background:var(--tint-warn);border:1px solid rgba(138,100,20,.34);
        color:var(--warn-ink);padding:var(--sp-3) var(--sp-4);
        border-radius:var(--r-2);font-size:var(--fs-sm);margin-bottom:var(--sp-4)}
  .empty{color:var(--dim-2);padding:var(--sp-8) 0;text-align:center;font-size:var(--fs-base)}
  code{background:var(--panel3);padding:4px var(--sp-1);border-radius:var(--r-1);
       font-family:var(--font-mono);font-size:var(--fs-xs);border:1px solid var(--line)}

  /* --- Etiquetas y avisos reutilizables (sustituyen estilos en línea del JS) --- */
  .card-label{font-weight:640;font-size:var(--fs-sm);color:var(--acc-ink);margin-bottom:var(--sp-1)}
  .lp-head{font-weight:700;font-size:var(--fs-base);margin-bottom:var(--sp-2)}
  .micro{font-size:var(--fs-micro);color:var(--dim)}
  .notice-ok{color:var(--ok-ink);margin-bottom:var(--sp-2)}
  .notice-dim{color:var(--dim-2);font-style:italic}
  .status-error{color:var(--bad-ink)}
  .list-tight{margin:var(--sp-2) 0;padding-left:var(--sp-5);line-height:1.6}
  .sec-title{margin:0 0 var(--sp-3);font-size:var(--fs-base);color:var(--bad-ink)}
  .em-ok{color:var(--ok-ink)}
  .em-warn{color:var(--warn-ink)}
  .em-acc{color:var(--acc-ink)}
  .hr-soft{border-top:1px solid var(--line);margin-top:var(--sp-4);padding-top:var(--sp-4)}
  .mono{font-family:var(--font-mono);font-size:var(--fs-xs)}
  .micro-block{display:block;color:var(--dim);line-height:1.45}
  .small{font-size:var(--fs-sm)}
  .mt-2{margin-top:var(--sp-2)}
  .mt-3{margin-top:var(--sp-3)}
  .crit-title{margin:0 0 var(--sp-2);font-size:var(--fs-base);color:var(--txt)}
  .cv-title{margin:0;font-size:var(--fs-base);color:var(--acc-ink)}
  .cv-title.em-ok{color:var(--ok-ink)}
  .sec-head{display:flex;justify-content:space-between;align-items:center;
            margin-bottom:var(--sp-3);flex-wrap:wrap;gap:var(--sp-2)}
  .err-card-head{display:flex;justify-content:space-between;align-items:center;
                 margin-bottom:var(--sp-2);gap:var(--sp-2)}
  .err-card-head-l{display:flex;align-items:center;gap:var(--sp-2)}
  .err-idx{font-weight:700;font-size:var(--fs-sm)}
  .list-tight.sm{font-size:var(--fs-sm);line-height:1.55;padding-left:var(--sp-5);margin:var(--sp-2) 0}
  .list-tight.xs{padding-left:var(--sp-4);margin:var(--sp-1) 0}
  .model-text.ok-edge{background:var(--tint-ok);border-color:rgba(46,110,73,.45)}
  .em-bad{color:var(--bad-ink)}
  .lp-label{flex:1;cursor:pointer;display:flex;align-items:center;gap:var(--sp-2)}
  .row-inline{display:flex;gap:var(--sp-3);align-items:center;margin-top:var(--sp-2);flex-wrap:wrap}
  .annotated-title{margin:0;font-size:var(--fs-base)}
  .translation{margin-bottom:var(--sp-2)}

  /* Schreiben UI & Editor */
  .schreiben-layout{display:flex;flex-direction:column;gap:var(--sp-5)}
  .memo-card{background:var(--tint-warn);border:1px solid rgba(138,100,20,.34);
             padding:var(--sp-3) var(--sp-4);
             border-radius:var(--r-2);margin:var(--sp-3) 0;font-size:var(--fs-base);line-height:1.6}
  .memo-card b{color:var(--warn-ink)}
  .letter-card{background:var(--panel2);border:1px solid var(--line);
               padding:var(--sp-4) var(--sp-5);
               border-radius:var(--r-2);margin:var(--sp-3) 0;white-space:pre-wrap;
               font-family:var(--font-read);font-size:var(--fs-base);line-height:1.7;color:var(--txt);
               max-width:var(--read-w)}
  .lp-list{list-style:none;padding:0;margin:var(--sp-3) 0;display:flex;flex-direction:column;gap:var(--sp-2)}
  .lp-item{display:flex;align-items:flex-start;gap:var(--sp-3);min-height:44px;background:var(--chip);
           padding:var(--sp-3) var(--sp-4);border-radius:var(--r-2);font-size:var(--fs-base);
           border:1px solid var(--line);transition:border-color var(--dur-2) var(--ease),
           background var(--dur-2) var(--ease)}
  .lp-item:hover{border-color:var(--line-2);background:var(--chip-hover)}
  .lp-item input[type="checkbox"]{margin-top:4px;cursor:pointer;accent-color:var(--acc);
           width:16px;height:16px;flex:0 0 16px}
  .lp-item .lp-num{min-width:24px;height:24px;flex:0 0 24px;background:var(--acc-fill-1);
           color:var(--on-acc);border-radius:50%;display:flex;align-items:center;justify-content:center;
           font-size:var(--fs-micro);font-weight:700}

  .editor-card{background:var(--panel);border-radius:var(--r-3);
               padding:var(--sp-5);box-shadow:var(--sh-1)}
  .editor-toolbar{display:flex;align-items:center;justify-content:space-between;
                  margin-bottom:var(--sp-4);flex-wrap:wrap;gap:var(--sp-3)}
  .editor-textarea{width:100%;min-height:300px;background:var(--sheet);border:1px solid var(--line);
           border-radius:var(--r-2);padding:var(--sp-4) var(--sp-5);color:var(--txt);
           font-size:var(--fs-base);line-height:1.7;font-family:var(--font-ui);resize:vertical;
           caret-color:var(--acc);outline:none;box-sizing:border-box;
           transition:border-color var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
  .editor-textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--tint-acc)}
  .timer-box{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--dim)}
  .timer-display{font-size:var(--fs-base);font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
  .timer-display.warn{color:var(--bad-ink)}

  /* Evaluación de Schreiben */
  /* Evaluación: sello de examen — marco doble, versalitas, prensado elástico */
  .eval-banner{padding:var(--sp-3) var(--sp-5);border-radius:var(--r-2);font-weight:700;
               font-size:var(--fs-base);letter-spacing:.05em;text-transform:uppercase;
               display:flex;align-items:center;justify-content:space-between;margin:var(--sp-4) 0;
               flex-wrap:wrap;gap:var(--sp-3);
               border:2px solid currentColor;box-shadow:inset 0 0 0 1px currentColor;
               transform:rotate(-.5deg);
               animation:stamp var(--dur-3) var(--spring)}
  @keyframes stamp{from{transform:rotate(-.5deg) scale(1.12);opacity:0}
                   to{transform:rotate(-.5deg) scale(1);opacity:1}}
  .eval-banner.pass{background:var(--tint-ok);border-color:rgba(46,110,73,.55);color:var(--ok-ink)}
  .eval-banner.fail{background:var(--tint-bad);border-color:rgba(176,54,42,.55);color:var(--bad-ink)}
  .crit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
             gap:var(--sp-3);margin:var(--sp-4) 0}
  .crit-box{background:var(--chip);border:1px solid var(--line);border-radius:var(--r-2);
            padding:var(--sp-3) var(--sp-4)}
  .crit-box .ch{display:flex;justify-content:space-between;align-items:center;
                margin-bottom:var(--sp-2);font-weight:600;font-size:var(--fs-sm)}
  .crit-box .c-body{font-size:var(--fs-sm);color:var(--dim);line-height:1.55}
  .annotated-card{background:var(--panel);border-radius:var(--r-3);
            padding:var(--sp-5);margin:var(--sp-4) 0;box-shadow:var(--sh-1)}
  .annotated-head{display:flex;justify-content:space-between;align-items:center;
            margin-bottom:var(--sp-3);flex-wrap:wrap;gap:var(--sp-3)}
  .annotated-text-box{background:var(--sheet);border:1px solid var(--line);
            border-radius:var(--r-2);padding:var(--sp-5);
            font-family:var(--font-read);font-size:var(--fs-base);line-height:1.95;white-space:pre-wrap;
            color:var(--txt);word-break:break-word}

  .err-highlight{position:relative;border-radius:var(--r-1);padding:4px var(--sp-1);margin:0;
                 cursor:pointer;display:inline;font-weight:500;
                 transition:background var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
  .err-highlight.err-grammatik{background:var(--tint-bad);border-bottom:2px solid var(--bad-ink);color:var(--bad-ink)}
  .err-highlight.err-grammatik:hover,.err-highlight.err-grammatik.active{background:rgba(176,54,42,.24);box-shadow:0 0 0 2px var(--tint-bad)}
  .err-highlight.err-wortschatz{background:var(--tint-warn);border-bottom:2px solid var(--warn-ink);color:var(--warn-ink)}
  .err-highlight.err-wortschatz:hover,.err-highlight.err-wortschatz.active{background:rgba(138,100,20,.22);box-shadow:0 0 0 2px var(--tint-warn)}
  .err-highlight.err-zeichensetzung{background:var(--tint-acc);border-bottom:2px solid var(--acc-ink);color:var(--acc-ink)}
  .err-highlight.err-zeichensetzung:hover,.err-highlight.err-zeichensetzung.active{background:rgba(44,77,143,.20);box-shadow:0 0 0 2px var(--tint-acc)}
  .err-highlight.err-stil{background:var(--tint-violet);border-bottom:2px solid var(--violet-ink);color:var(--violet-ink)}
  .err-highlight.err-stil:hover,.err-highlight.err-stil.active{background:rgba(107,74,158,.22);box-shadow:0 0 0 2px var(--tint-violet)}

  .err-badge-num{font-size:var(--fs-micro);font-weight:700;vertical-align:super;padding:0 var(--sp-1);
                 border-radius:var(--r-pill);margin-left:var(--sp-1);background:var(--panel);
                 border:1px solid currentColor;opacity:.95}

  .err-popover{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
               background:var(--panel2);border:1px solid var(--line-2);box-shadow:var(--sh-3);
               border-radius:var(--r-2);
               padding:var(--sp-3) var(--sp-4);min-width:250px;max-width:340px;z-index:40;display:none;
               font-size:var(--fs-sm);line-height:1.5;pointer-events:auto;text-align:left;
               animation:pop var(--dur-2) var(--spring)}
  .err-popover::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
               border-width:6px;border-style:solid;
               border-color:var(--panel2) transparent transparent transparent}
  .err-highlight:hover .err-popover,.err-highlight.active .err-popover{display:block}
  .err-popover-head{display:flex;justify-content:space-between;align-items:center;
               margin-bottom:var(--sp-2);padding-bottom:var(--sp-1);border-bottom:1px solid var(--line)}
  .err-popover-orig{color:var(--bad-ink);font-size:var(--fs-xs);margin-bottom:var(--sp-1);display:block}
  .err-popover-corr{color:var(--ok-ink);font-weight:640;font-size:var(--fs-sm);margin-bottom:var(--sp-2);display:block}
  .err-popover-rule{color:var(--dim);font-size:var(--fs-xs);display:block;line-height:1.5}

  .err-legend{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;font-size:var(--fs-xs)}
  .legend-chip{display:inline-flex;align-items:center;gap:var(--sp-1);padding:var(--sp-1) var(--sp-2);
               border-radius:var(--r-pill);background:var(--chip);border:1px solid var(--line);
               color:var(--dim)}
  .legend-chip .dot{width:8px;height:8px;border-radius:50%}
  .legend-chip.gram .dot{background:var(--bad-ink)}
  .legend-chip.wort .dot{background:var(--warn-ink)}
  .legend-chip.zeichen .dot{background:var(--acc-ink)}
  .legend-chip.stil .dot{background:var(--violet-ink)}

  .tab-pills{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin:var(--sp-3) 0}
  .tab-pills.flush{margin:0}
  .tab-pill{background:var(--chip);border:1px solid var(--line);color:var(--dim);
            padding:0 var(--sp-4);min-height:36px;display:inline-flex;align-items:center;
            border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:600;cursor:pointer;
            font-family:inherit;
            transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                       border-color var(--dur-2) var(--ease),transform var(--dur-1) var(--spring)}
  .tab-pill:hover{color:var(--txt);background:var(--chip-hover);transform:translateY(-1px)}
  .tab-pill:active{transform:scale(.97)}
  .tab-pill.active{background:var(--acc-fill-1);color:var(--on-acc);
            border-color:var(--acc-fill-2);box-shadow:var(--sh-1)}

  .err-card{background:var(--chip);border:1px solid var(--line);
            border-radius:var(--r-2);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-3);
            cursor:pointer;
            transition:box-shadow var(--dur-2) var(--ease),transform var(--dur-2) var(--spring),
                       border-color var(--dur-2) var(--ease),background var(--dur-2) var(--ease)}
  .err-card:hover{transform:translateY(-1px);border-color:var(--acc);box-shadow:var(--sh-1)}
  .err-card.pulse{box-shadow:0 0 0 3px var(--ring);border-color:var(--acc)}
  .err-card .orig{color:var(--bad-ink);text-decoration:line-through;margin-bottom:var(--sp-1);font-size:var(--fs-sm)}
  .err-card .corr{color:var(--ok-ink);font-weight:640;margin-bottom:var(--sp-1);font-size:var(--fs-base)}
  .err-card .rule{font-size:var(--fs-sm);color:var(--dim);line-height:1.5}
  .model-text{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-2);
              padding:var(--sp-4) var(--sp-5);font-family:var(--font-read);font-size:var(--fs-base);
              line-height:1.7;white-space:pre-wrap;color:var(--txt);max-width:var(--read-w)}
  .copy-btn{font-size:var(--fs-xs);padding:0 var(--sp-3);min-height:32px;border-radius:var(--r-1);
            cursor:pointer;background:transparent;border:1px solid var(--line-2);
            color:var(--dim);font-family:inherit;
            transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                       transform var(--dur-1) var(--spring)}
  .copy-btn:hover{background:var(--sheet);color:var(--txt)}
  .copy-btn:active{transform:scale(.97)}

  /* Modal de Configuración: hoja sobre velo cálido (sin cristal). */
  .modal-backdrop{position:fixed;inset:0;background:var(--scrim);
                  z-index:100;display:flex;align-items:center;justify-content:center;padding:var(--sp-4)}
  .modal{background:var(--panel);
         border:1px solid var(--line);border-radius:var(--r-4);width:100%;max-width:560px;
         box-shadow:var(--sh-3);overflow:hidden;animation:pop var(--dur-3) var(--spring)}
  @keyframes pop{from{transform:scale(.965);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--line);
              display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
  .modal-head h3{margin:0;font-size:var(--fs-lead);font-weight:650}
  .modal-close{background:none;border:1px solid transparent;color:var(--dim-2);font-size:var(--fs-lead);
               cursor:pointer;width:32px;height:32px;border-radius:var(--r-1);
               display:inline-flex;align-items:center;justify-content:center;
               transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                          transform var(--dur-1) var(--spring)}
  .modal-close:hover{color:var(--txt);background:var(--tint-neutral)}
  .modal-close:active{transform:scale(.94)}
  .modal-body{padding:var(--sp-5);max-height:75vh;overflow-y:auto}
  .modal-foot{padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--line);
              display:flex;justify-content:flex-end;gap:var(--sp-3);background:var(--panel2)}
  .ai-status{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
             flex-wrap:wrap;background:var(--chip);border:1px solid var(--line);
             border-radius:var(--r-2);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-4);
             font-size:var(--fs-xs);color:var(--dim)}
  .form-group{margin-bottom:var(--sp-4)}
  .form-group label{display:block;font-size:var(--fs-sm);font-weight:640;margin-bottom:var(--sp-2);color:var(--txt)}
  .form-group small{display:block;font-size:var(--fs-xs);color:var(--dim);margin-top:var(--sp-1);line-height:1.45}
  .input,.select{width:100%;background:var(--sheet);border:1px solid var(--line);
                 border-radius:var(--r-2);padding:0 var(--sp-3);min-height:42px;color:var(--txt);
                 font-size:var(--fs-sm);font-family:inherit;outline:none;box-sizing:border-box;
                 caret-color:var(--acc);
                 transition:border-color var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
  .input::placeholder{color:var(--dim-2)}
  .input:focus,.select:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--tint-acc)}

  /* Selector bilingüe ES / RU: control segmentado, hoja seleccionada (sin píldora azul). */
  .lang-switch{display:inline-flex;align-items:center;background:var(--panel3);
               border:1px solid var(--line);border-radius:var(--r-pill);padding:4px;gap:var(--sp-1)}
  .lang-btn{background:transparent;border:0;color:var(--dim);font-size:var(--fs-xs);font-weight:640;
            padding:0 var(--sp-3);min-height:32px;border-radius:var(--r-pill);cursor:pointer;
            font-family:inherit;
            transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                       transform var(--dur-1) var(--spring),box-shadow var(--dur-2) var(--ease);
            display:inline-flex;align-items:center;gap:var(--sp-1);line-height:1}
  .lang-btn:hover{color:var(--txt)}
  .lang-btn:active{transform:scale(.96)}
  .lang-btn.active{background:var(--sheet);color:var(--txt);font-weight:700;
            box-shadow:var(--sh-1)}

  /* Selector de usuario Sergio / Diana */
  .user-switch{display:inline-flex;align-items:center;background:var(--panel3);
               border:1px solid var(--line);border-radius:var(--r-pill);padding:4px;gap:var(--sp-1)}
  .user-btn{background:transparent;border:0;color:var(--dim);font-size:var(--fs-xs);font-weight:640;
            padding:0 var(--sp-3);min-height:32px;border-radius:var(--r-pill);cursor:pointer;
            font-family:inherit;
            transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                       transform var(--dur-1) var(--spring),box-shadow var(--dur-2) var(--ease);
            display:inline-flex;align-items:center;gap:var(--sp-1);line-height:1}
  .user-btn:hover{color:var(--txt)}
  .user-btn:active{transform:scale(.96)}
  .user-btn.active{background:var(--sheet);color:var(--txt);font-weight:700;
            box-shadow:var(--sh-1)}

  /* Indicador de sincronización en la nube */
  .cloud-badge{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-micro);color:var(--dim);
               padding:var(--sp-1) var(--sp-2);border-radius:var(--r-pill);

  /* --- Escritorio ancho (≥1500px): la mesa de examen, en dos columnas ---
     A 1920px una columna de 960px dejaba media pantalla vacía a la derecha. Aquí
     la referencia —los anuncios de Lesen 1 y 3 o el texto de lectura— se queda a
     la izquierda, fija y con su propio scroll, y la hoja de preguntas ocupa la
     derecha: se responde sin subir y bajar a consultar el anuncio.
     Solo se activa si la variante tiene referencia; por eso la clase la pone el
     render (main.desk), no un :has() ni un ancho fijo. */
  @media(min-width:1500px){
    main.desk{max-width:none;display:grid;align-items:start;column-gap:var(--sp-6);
              grid-template-columns:minmax(0,var(--desk-ref)) minmax(0,1fr)}

              top:calc(var(--header-h) + var(--sp-5));

              padding-top:0;overflow:auto;overscroll-behavior:contain}

    main.desk > details.passage > summary{position:sticky;top:0;z-index:2;
              background:var(--panel);padding-top:var(--sp-4);
              border-radius:var(--r-3) var(--r-3) 0 0}
    /* Un solo scroll (el del panel), no dos anidados. */
    main.desk > details.passage .passage-body{max-height:none;overflow:visible}
    main.desk > .q-sheet,main.desk > .row{grid-column:2;width:100%;max-width:var(--desk-work)}
  }

  /* --- Movimiento reducido: se apaga todo lo decorativo (HIG) --- */
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;

const LS_ROOM = "b2quiz_room";
const LS_FIREBASE = "b2quiz_firebase";
const LS_THEME = "b2quiz_theme";

/* Tema: papel (por defecto) o noche. El <head> ya aplicó el guardado antes del
   primer pintado; aquí solo se sincroniza el estado y el botón. */
let currentTheme = "paper";
try {
  const savedTheme = localStorage.getItem(LS_THEME);
  if (savedTheme === "dark" || savedTheme === "paper") currentTheme = savedTheme;
} catch(e){}

const urlParams = (typeof window !== "undefined" && window.location && window.location.search)
  ? new URLSearchParams(window.location.search)
  : new URLSearchParams("");
const userParam = (urlParams.get("user") || "").toLowerCase();
const roomParam = urlParams.get("room");
/* La sala se usa en la ruta de Firestore y se pinta en la interfaz: solo aceptamos
   el mismo formato que exige firestore.rules (letras, dígitos, guion y guion bajo). */
const ROOM_RE = /^[a-zA-Z0-9_-]{1,64}$/;

let currentUser = "sergio";
if (userParam === "diana" || userParam === "sergio") {
  currentUser = userParam;
  try { localStorage.setItem(LS_USER, currentUser); } catch(e){}
} else {
  try {
    const savedUser = localStorage.getItem(LS_USER);
    if (savedUser === "diana" || savedUser === "sergio") currentUser = savedUser;
  } catch(e){}
}

/* La sala es lo único que protege los borradores (no hay login): si no llega por el
   enlace ni está guardada, se genera una aleatoria en vez de usar una adivinable. */
function randomRoomId(){
  const bytes = new Uint8Array(12);
  crypto.getRandomValues(bytes);
  return "b2-" + Array.from(bytes, b => b.toString(36).padStart(2, "0")).join("").slice(0, 16);
}

let currentRoomId = "";
if (ROOM_RE.test(roomParam || "")) {
  currentRoomId = roomParam;
} else {
  if (roomParam) console.warn("Parámetro ?room= ignorado (formato no válido):", roomParam);
  try {
    const savedRoom = localStorage.getItem(LS_ROOM);
    if (ROOM_RE.test(savedRoom || "")) currentRoomId = savedRoom;
    else if (savedRoom) console.warn("Sala guardada ignorada (formato no válido):", savedRoom);
  } catch(e){}
  if (!currentRoomId) currentRoomId = randomRoomId();
}
try { localStorage.setItem(LS_ROOM, currentRoomId); } catch(e){}

let currentLang = (currentUser === "diana") ? "ru" : "es";
const langParam = (urlParams.get("lang") || "").toLowerCase();
if (langParam === "es" || langParam === "ru") {
  currentLang = langParam;
} else {
  try {
    const savedLang = localStorage.getItem(LS_LANG);

  } catch(e){}

function t(key, vars = {}) {
  const dict = I18N[currentLang] || I18N.es;
  let str = dict[key] !== undefined ? dict[key] : (I18N.es[key] !== undefined ? I18N.es[key] : key);
  for (const [k, v] of Object.entries(vars)) {
    str = str.replace(new RegExp(`\\{${k}\\}`, "g"), v);
  }
  return str;
}

function formatConfidence(conf) {
  const c = String(conf || "mittel").toLowerCase();
  if (currentLang === "ru") {
    if (c === "hoch") return "высокая";
    if (c === "niedrig") return "низкая";
    return "средняя";
  } else {
    if (c === "hoch") return "alta";
    if (c === "niedrig") return "baja";
    return "media";
  }
}

/* ---------- rótulos que vienen del PDF ----------
   Los nombres de las variantes los escriben los extractores con andamiaje en
   español («Variante 1», «nueva versión 08.2024», «test 140321»). Ese andamiaje
   se traduce al vuelo; los nombres alemanes del examen (Beschwerde, Protokoll,
   temas entre paréntesis, números de test) se quedan intactos porque son el
   contenido que se estudia. */
const LABEL_RU = [
  [/\bnueva versión\b/gi, "новая версия"],
  [/\bnueva variante\b/gi, "новый вариант"],
  [/\bvariante\b/gi, "Вариант"],
  [/\btext\b/gi, "Текст"],
  [/\bversión\b/gi, "версия"],
  [/\btest\b/gi, "тест"]
];
function localizeLabel(label){
  let s = String(label == null ? "" : label);
  if (currentLang !== "ru") return s;
  for (const [re, rep] of LABEL_RU) {
    s = s.replace(re, (m) => (m[0] === m[0].toUpperCase() && m[0] !== m[0].toLowerCase())
      ? rep.charAt(0).toUpperCase() + rep.slice(1)
      : rep);
  }
  return s;
}

/* Los avisos del extractor («⚠ …») son comentario, no texto de examen: si hay
   versión rusa se usa esa; si no, se cae al español. */
function noteOf(v){
  if (!v) return "";
  return (currentLang === "ru" && v.note_ru) ? v.note_ru : (v.note || "");
}

/* Igual para la explicación de cada respuesta: es ayuda, no enunciado. */
function explainOf(it){
  if (!it) return "";
  return (currentLang === "ru" && it.explain_ru) ? it.explain_ru : (it.explain || "");
}

/* Los nombres de las partes del examen son alemanes a propósito (así aparecen
   en el examen real); en ruso se añade la glosa para poder navegar. */

  "Hören Teil 3": "Аудирование 3", "Hören Teil 4": "Аудирование 4"
};
function localizeSection(title){

/* ---------- Sincronización en Tiempo Real (Firebase Firestore) ---------- */
let fbDb = null;
let fbSyncStatus = "local"; // "local" | "online" | "syncing"
let cloudSchreibenCache = {}; // taskId -> doc data
let cloudSyncTimeout = null;
let activeTaskUnsubscribe = null;
let currentListeningTaskId = null;

function getFirebaseConfig() {
  try {
    const raw = localStorage.getItem(LS_FIREBASE);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}

function getFirebaseConfigRaw() {
  try {
    return localStorage.getItem(LS_FIREBASE) || "";
  } catch(e){ return ""; }
}

function saveFirebaseConfig(cfg) {
  try {
    if (!cfg) {
      localStorage.removeItem(LS_FIREBASE);
    } else {
      localStorage.setItem(LS_FIREBASE, typeof cfg === "string" ? cfg : JSON.stringify(cfg, null, 2));
    }
    fbDb = null;
  } catch(e){}
}

/* La consola de Firebase ofrece un fragmento de JavaScript, no JSON: las claves
   van sin comillas y lleva "const firebaseConfig = ... ;" alrededor. Aceptamos
   las dos formas para que se pueda pegar tal cual lo que da Google. */
function parseFirebaseConfig(raw) {
  const txt = String(raw == null ? "" : raw).trim();
  if (!txt) return null;
  try { return JSON.parse(txt); } catch(e){}
  const desde = txt.indexOf("{", Math.max(0, txt.indexOf("firebaseConfig")));
  const hasta = txt.lastIndexOf("}");
  if (desde < 0 || hasta <= desde) throw new Error(t("cfgNotObject"));
  const cuerpo = txt.slice(desde, hasta + 1)
    .replace(/^\s*\/\/.*$/gm, "")                            // comentarios de línea
    .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')  // claves sin comillas
    .replace(/,(\s*[}\]])/g, "$1");                          // comas finales
  return JSON.parse(cuerpo);
}
window.parseFirebaseConfig = parseFirebaseConfig;

function initFirebase() {
  if (fbDb) return fbDb;
  if (typeof firebase === "undefined") return null;
  const cfg = getFirebaseConfig();
  if (!cfg || !cfg.apiKey || !cfg.projectId) return null;
  try {
    if (!firebase.apps || !firebase.apps.length) {
      firebase.initializeApp(cfg);
    }
    fbDb = firebase.firestore();
    fbSyncStatus = "online";
    updateCloudStatusUI();
    return fbDb;
  } catch(e) {
    console.warn("Firebase init error:", e);
    return null;
  }
}

function updateCloudStatusUI() {
  const el = document.getElementById("cloud-status-indicator");
  if (!el) return;
  if (fbSyncStatus === "online") {
    el.innerHTML = '<span class="cloud-dot online"></span> ' + t("cloudStatusOnline", {room: esc(currentRoomId)});
    el.title = "Firebase Firestore: Room " + currentRoomId;
  } else if (fbSyncStatus === "syncing") {
    el.innerHTML = '<span class="cloud-dot syncing"></span> ' + t("cloudStatusSyncing");
  } else if (fbSyncStatus === "error") {
    el.innerHTML = '<span class="cloud-dot error"></span> ' + t("cloudStatusError");
    el.title = "Firestore: " + currentRoomId + " · " + t("firebaseHelp");
  } else {
    el.innerHTML = '<span class="cloud-dot offline"></span> ' + t("cloudStatusLocal");
    el.title = t("cloudLocalTitle");
  }
}

function startListeningToTask(taskId, onPartnerUpdate) {
  if (activeTaskUnsubscribe) {
    activeTaskUnsubscribe();
    activeTaskUnsubscribe = null;
  }
  currentListeningTaskId = taskId;
  const db = initFirebase();
  if (!db) {
    fbSyncStatus = "local";
    updateCloudStatusUI();
    return;
  }
  try {
    fbSyncStatus = "online";
    updateCloudStatusUI();
    activeTaskUnsubscribe = db.collection("rooms").doc(currentRoomId)
      .collection("schreiben").doc(taskId)
      .onSnapshot((doc) => {
        if (doc && doc.exists) {
          const data = doc.data() || {};
          cloudSchreibenCache[taskId] = data;
          if (onPartnerUpdate && currentListeningTaskId === taskId) {
            onPartnerUpdate(data);
          }
        }
      }, (err) => {
        console.warn("Firestore snapshot error:", err);
      });
  } catch(e) {
    console.warn("Firestore listen error:", e);
  }
}

function pushSchreibenToFirestore(taskId, text, evalResult) {
  const db = initFirebase();
  if (!db) return;
  fbSyncStatus = "syncing";
  updateCloudStatusUI();
  const updateData = {};
  const now = Date.now();
  if (currentUser === "sergio") {
    if (text !== undefined) {
      updateData.sergio_text = text;
      updateData.sergio_words = countWords(text);
      updateData.sergio_updated_at = now;
    }
    if (evalResult !== undefined) {
      updateData.sergio_eval = evalResult;
      updateData.sergio_updated_at = now;
    }
  } else {
    if (text !== undefined) {
      updateData.diana_text = text;
      updateData.diana_words = countWords(text);
      updateData.diana_updated_at = now;
    }
    if (evalResult !== undefined) {
      updateData.diana_eval = evalResult;
      updateData.diana_updated_at = now;
    }
  }

  db.collection("rooms").doc(currentRoomId)
    .collection("schreiben").doc(taskId)
    .set(updateData, { merge: true })
    .then(() => {
      /* Solo cuenta como enviado si la nube lo aceptó. Es lo que después permite
         saber si el borrador local tiene algo sin enviar. */
      if (text !== undefined) { setPushed(taskId, text); saveState(); }
      fbSyncStatus = "online";
      updateCloudStatusUI();
    })
    .catch((err) => {
      console.warn("Firestore write error:", err);
      fbSyncStatus = "error";          // no mentir: el borrador sigue solo en local
      updateCloudStatusUI();
    });
}

function queueSchreibenSync(taskId, text) {
  if (cloudSyncTimeout) clearTimeout(cloudSyncTimeout);
  cloudSyncTimeout = setTimeout(() => {
    pushSchreibenToFirestore(taskId, text);
  }, 900);
}

/* ---------- Progreso de redacción: una clave por perfil ----------
   El mismo navegador puede estar en el perfil de Sergio o en el de Diana. Cada
   perfil necesita su borrador, su evaluación y sus Leitpunkte. Antes la clave era
   solo el id de la tarea, así que al cambiar de perfil el editor cargaba el texto
   del otro y podía publicarlo como suyo. Ahora la clave lleva el perfil delante:
   "sergio::schr-b-p66". */
function progKey(id){ return currentUser + "::" + id; }

/* Los progresos guardados antes de existir la clave con perfil traen la clave
   antigua (solo el id). Se convierten una sola vez, y se asignan al perfil que
   estaba abierto. Lo mismo con los ficheros de progreso exportados entonces. */
function migrarClavesDeProgreso(s, dueno){
  const destinatario = (dueno === "sergio" || dueno === "diana") ? dueno : currentUser;
  ["schreiben_drafts", "schreiben_evals", "schreiben_lps", "schreiben_pushed"].forEach((campo)=>{
    const mapa = s && s[campo];
    if(!mapa) return;
    Object.keys(mapa).forEach((k)=>{
      if(k.indexOf("::") !== -1) return;              // ya lleva perfil
      const nuevo = destinatario + "::" + k;
      if(!(nuevo in mapa)) mapa[nuevo] = mapa[k];
      delete mapa[k];
    });
  });
  return s;
}

function getDraft(id){ return (state.schreiben_drafts && state.schreiben_drafts[progKey(id)]) || ""; }
function setDraft(id, val){ if(!state.schreiben_drafts) state.schreiben_drafts = {}; state.schreiben_drafts[progKey(id)] = val; }
function delDraft(id){ if(state.schreiben_drafts) delete state.schreiben_drafts[progKey(id)]; }
function getEval(id){ return (state.schreiben_evals && state.schreiben_evals[progKey(id)]) || null; }
function setEval(id, res){ if(!state.schreiben_evals) state.schreiben_evals = {}; state.schreiben_evals[progKey(id)] = res; }
function delEval(id){ if(state.schreiben_evals) delete state.schreiben_evals[progKey(id)]; }
function getLps(id){ return (state.schreiben_lps && state.schreiben_lps[progKey(id)]) || {}; }
function setLp(id, idx, valor){
  if(!state.schreiben_lps) state.schreiben_lps = {};
  if(!state.schreiben_lps[progKey(id)]) state.schreiben_lps[progKey(id)] = {};
  state.schreiben_lps[progKey(id)][idx] = valor;
}
/* Último texto que este navegador tiene por sincronizado con la nube: el que
   envió, o el que recibió de ella. Sin registro devuelve undefined; con la cadena
   vacía significa que aquí se borró a propósito. Sirve para saber si el borrador
   local tiene algo sin enviar. */
function getPushed(id){ return state.schreiben_pushed ? state.schreiben_pushed[progKey(id)] : undefined; }
function setPushed(id, txt){ if(!state.schreiben_pushed) state.schreiben_pushed = {}; state.schreiben_pushed[progKey(id)] = txt; }

function loadState(){
  try {
    const s = migrarClavesDeProgreso(JSON.parse(localStorage.getItem(LS)) || {});
    if (!s.answers) s.answers = {};
    if (!s.schreiben_drafts) s.schreiben_drafts = {};
    if (!s.schreiben_evals) s.schreiben_evals = {};
    if (!s.schreiben_lps) s.schreiben_lps = {};
    if (!s.schreiben_pushed) s.schreiben_pushed = {};
    return s;
  }
  catch(e){ return {answers:{}, schreiben_drafts:{}, schreiben_evals:{}, schreiben_lps:{}, schreiben_pushed:{}}; }
}
function saveState(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
let state = loadState();
window.quizState = state;

/* ---------- Copia de seguridad del progreso ----------
   El progreso vive en el localStorage de UN origen (navegador + dirección web),
   así que exportar/importar es la forma de llevarlo de file:// a GitHub Pages,
   a otro navegador o a otro dispositivo. No incluye claves. */
function exportProgress(){
  try {
    const payload = {
      app: "B2-Beruf-Quiz",
      formato: 1,
      exportado: new Date().toISOString(),
      usuario: currentUser,
      sala: currentRoomId,
      progreso: state
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "progreso-B2-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch(e){
    console.warn("No se pudo exportar el progreso:", e);
    return false;
  }
}

/* Sustituye el progreso actual por el del fichero y reengancha window.quizState
   (si no, el puntero global se queda apuntando al objeto viejo). */
function aplicarProgreso(prog, dueno){
  state = {
    answers: prog.answers || {},
    schreiben_drafts: prog.schreiben_drafts || {},
    schreiben_evals: prog.schreiben_evals || {},
    schreiben_lps: prog.schreiben_lps || {},
    schreiben_pushed: prog.schreiben_pushed || {}
  };
  /* Un fichero exportado antes de existir la clave con perfil trae la clave
     antigua. Se asigna al perfil que lo exportó (datos.usuario), no al que
     lo importa. */
  migrarClavesDeProgreso(state, dueno);
  window.quizState = state;
  saveState();
  render();
  return {
    respuestas: Object.keys(state.answers).length,
    borradores: Object.keys(state.schreiben_drafts).length
  };
}
window.exportProgress = exportProgress;
window.aplicarProgreso = aplicarProgreso;

function normalizarAIConfig(c){

}
function saveAIConfig(cfg){

/* ¿Puede este navegador guardar ajustes? Si no puede, hay que decirlo: antes el
   fallo se tragaba en silencio y la clave desaparecía sin explicación. */
function storageOk(){
  try {
    const sonda = "__b2_sonda__";
    localStorage.setItem(sonda, "1");
    const ok = localStorage.getItem(sonda) === "1";
    try { localStorage.removeItem(sonda); } catch(e){}
    return ok;
  } catch(e){ return false; }
}

/* Clave enmascarada para poder comprobar de un vistazo que sí se guardó. */
function maskKey(k){
  const s = String(k || "");
  if(!s) return "";
  return s.length <= 8 ? "•".repeat(s.length) : "•".repeat(6) + s.slice(-4);
}

/* Qué clave usa el proveedor elegido (Ollama va en local y no usa ninguna). */
function aiKeyOf(cfg){
  if(!cfg) return "";
  if(cfg.provider === "gemini") return cfg.geminiKey || "";
  if(cfg.provider === "openai_compatible") return cfg.customKey || "";
  return "";
}

/* Lee los campos del modal en un solo sitio: lo usan Guardar y Probar conexión,
   así que probar ya no puede dejar la clave sin guardar. */
function readAIConfigFromModal(){
  const val = (id, def) => {
    const el = document.getElementById(id);
    return (el && typeof el.value === "string" && el.value.trim()) ? el.value.trim() : (def || "");
  };
  return {
    provider: val("cfg-provider", "gemini"),
    geminiKey: val("cfg-gemini-key"),
    geminiModel: val("cfg-gemini-model", "gemini-3.5-flash-lite"),
    customEndpoint: val("cfg-custom-endpoint", "https://api.deepseek.com"),
    customKey: val("cfg-custom-key"),
    customModel: val("cfg-custom-model", "deepseek-chat"),
    ollamaEndpoint: val("cfg-ollama-endpoint", "http://localhost:11434"),
    ollamaModel: val("cfg-ollama-model", "llama3.1")
  };
}

/* Línea de estado del modal: proveedor activo, si hay clave y si el navegador
   deja guardarla. */
function aiStatusText(cfg){
  const clave = aiKeyOf(cfg);
  const partes = [
    t("aiActiveProvider", {provider: cfg.provider}),
    clave ? t("aiKeySaved", {mask: maskKey(clave)}) : t("aiKeyMissing"),
    storageOk() ? t("aiStorageOk") : t("aiStorageBlocked")
  ];
  const protocolo = (typeof location !== "undefined" && location.protocol) ? location.protocol : "";
  if(protocolo === "file:") partes.push(t("aiLocalFile"));
  return partes.join(" · ");
}

/* Un fallo de red no dice nada útil («Failed to fetch»): se traduce. */
function errorDeRed(e){
  const m = String((e && e.message) || e || "");
  if(/Failed to fetch|NetworkError|Load failed|Network request failed/i.test(m)) return t("errNetwork");
  return m;
}

/* ---------- índices ---------- */
const allVariants = [];
DATA.sections.forEach(sec=>{
  sec.variants.forEach(v=>{
    v._section = sec.id; v._sectionTitle = sec.title;
    if(!v.items) v.items = [];
    v.items.forEach((it,i)=>{ it._idx = i; });
    const byN = {};
    v.items.forEach(it => { byN[it.n] = (byN[it.n]||0) + 1; });
    const seenN = {};
    v.items.forEach(it => {
      if(byN[it.n] > 1){
        seenN[it.n] = (seenN[it.n]||0) + 1;
        it._label = it.n + String.fromCharCode(96 + seenN[it.n]);
      } else {
        it._label = String(it.n);
      }
    });
    allVariants.push(v);
  });
});

function ansKey(v, item){ return v.id + "#" + item._idx; }
function itemAnswerLetter(it){ return String(it.answer).toLowerCase(); }
function isDoubtful(it){ return String(it.confidence||"mittel").toLowerCase() !== "hoch"; }
function doubtfulCount(v){ return (v.items || []).filter(isDoubtful).length; }

let onlyDoubtful = false;

/* ---------- estadísticas ---------- */
function updateStats(){
  let total = 0, done = 0, ok = 0, doubt = 0;
  allVariants.forEach(v=>{
    (v.items || []).forEach(it=>{
      total++;
      if(isDoubtful(it)) doubt++;
      const a = state.answers[ansKey(v,it)];
      if(a !== undefined && a !== "__revealed__"){
        done++; if(a === itemAnswerLetter(it)) ok++;
      }
    });
  });
  const el = document.getElementById("stats");
  const fill = document.getElementById("progress-fill");
  if (fill) fill.style.width = (total ? Math.min(100, Math.round(done / total * 100)) : 0) + "%";
  if(!el) return;
  const pct = done ? " (" + Math.round(ok/done*100) + "%)" : "";
  const doubtSpan = doubt ? ' · <span class="em-warn">' + t("statDudosas", {doubt: doubt}) + "</span>" : "";
  el.innerHTML = t("statRespondidas", {done: done, total: total, ok: ok}) + pct + doubtSpan;
}

/* ---------- navegación ---------- */
let current = allVariants.length ? allVariants[0].id : null;

/* Grupo desplegado del menú. `undefined` = sin decidir todavía (se despliega el
   grupo donde estás); `null` = todos plegados, que es lo que deja el clic en la
   cabecera abierta. Son variables de sesión a propósito: al recargar, el menú
   vuelve a abrir solo el grupo activo, sin memoria que arrastre estados raros. */
let openSec;
let lastNavCurrent;

function renderNav(){
  const nav = document.getElementById("nav");
  if(!nav) return;
  nav.innerHTML = "";
  /* Saltar a otra entrada (clic, filtro de dudosas) reabre su grupo: el menú
     nunca esconde el ejercicio que estás viendo. */
  const aqui = allVariants.find(v => v.id === current);
  const secActual = aqui ? aqui._section : null;
  if(openSec === undefined || current !== lastNavCurrent){
    openSec = secActual; lastNavCurrent = current;
  }
  DATA.sections.forEach(sec=>{
    const abierto = openSec === sec.id;
    /* Con el filtro de dudosas puesto, el contador cuenta lo que de verdad
       se ve, no lo que el grupo guarda. */
    const visibles = sec.variants.filter(v => !(onlyDoubtful && doubtfulCount(v) === 0 && v.id !== current));

    const h = document.createElement("div");
    h.className = "sec" + (abierto ? " open" : "");

    const tog = document.createElement("div");
    tog.className = "sec-toggle";
    tog.tabIndex = 0;
    tog.title = t(abierto ? "secToggleCollapse" : "secToggleExpand", { title: localizeSection(sec.title) });
    const nom = document.createElement("span");
    nom.textContent = localizeSection(sec.title);
    const cnt = document.createElement("span");
    cnt.className = "sec-count";
    cnt.textContent = visibles.length;
    tog.appendChild(nom); tog.appendChild(cnt);
    /* setAttribute no existe en el DOM simulado de las pruebas; en el navegador
       sí, así que el rol y el estado plegado se anuncian sin romper nada. */
    if(tog.setAttribute){
      tog.setAttribute("role", "button");
      tog.setAttribute("aria-expanded", abierto ? "true" : "false");
    }
    const alternar = ()=>{ openSec = abierto ? null : sec.id; renderNav(); };
    tog.onclick = alternar;
    tog.onkeydown = e => {
      if(e.key === "Enter" || e.key === " " || e.key === "Spacebar"){ e.preventDefault(); alternar(); }
    };
    h.appendChild(tog);

    /* Reiniciar el bloque entero: borra solo las respuestas de esta sección, y
       solo aparece si hay algo que borrar. Las tareas de Schreiben se quedan
       fuera a propósito (tienen sus propios botones por tarea). */
    const objetivos = (sec.variants || []).filter(v => v.kind !== "schreiben");
    const pendientes = objetivos.reduce((acc, v) =>
      acc + (v.items || []).filter(it => state.answers[ansKey(v, it)] !== undefined).length, 0);
    if(abierto && pendientes > 0){
      const bResetSec = document.createElement("button");
      bResetSec.className = "sec-reset";
      bResetSec.textContent = t("btnResetSection");
      bResetSec.title = t("btnResetSectionTitle", { title: sec.title, n: pendientes });
      bResetSec.onclick = ()=>{
        if(!confirm(t("confirmResetSection", { title: sec.title, n: pendientes }))) return;
        objetivos.forEach(v => (v.items || []).forEach(it => { delete state.answers[ansKey(v, it)]; }));
        saveState(); render();
      };
      h.appendChild(bResetSec);
    }
    nav.appendChild(h);
    visibles.forEach(v=>{
      const nd = doubtfulCount(v);
      const b = document.createElement("button");
      const n = (v.items || []).length;
      const done = (v.items || []).filter(it => state.answers[ansKey(v,it)] !== undefined).length;
      const ok = (v.items || []).filter(it => state.answers[ansKey(v,it)] === itemAnswerLetter(it)).length;
      let pill = "";
      if(v.kind === "schreiben"){
        /* Se pasa por la vara para que la insignia del menú diga lo mismo que el panel. */
        const ev = getEval(v.id);
        const conVara = ev ? normalizeEvaluationResult(ev, null, (v.leitpunkte || []).length) : null;
        pill = conVara ? (conVara.verdict === "BESTANDEN" ? t("passedPill") : t("failedPill")) : (v.category === "beschwerde" ? t("pillEmail") : t("pillPost"));
      } else {
        pill = onlyDoubtful
          ? (nd === 1 ? t("doubtPillSingle") : t("doubtPillPlural", {count: nd}))
          : (done ? ok + "/" + n : (n === 1 ? t("itemCountSingle") : t("itemsCount", {count: n})));
      }
      b.innerHTML = esc(localizeLabel(v.label)) + '<span class="pill">' + esc(pill) + '</span>';
      b.className = (v.id === current ? "active " : "") + "sec-item";
      /* Los grupos plegados se ocultan, no se borran: el teclado y las pruebas
         siguen encontrando sus entradas. */
      b.hidden = !abierto;
      b.onclick = ()=>{ current = v.id; render(); window.scrollTo(0,0); };
      nav.appendChild(b);
    });
  });
}

/* ---------- temporizador de examen (45 min) ---------- */
let examTimer = null;
let examTimerSeconds = 45 * 60;
let examTimerRunning = false;

function formatTimer(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

/* ---------- render principal ---------- */
/* Una evaluación con datos raros (del LLM o de la pareja) no debe dejar la app
   a medias: si el render falla, se muestra un aviso en lugar de una pantalla rota. */
function render(){
  try {
    renderMain();
  } catch(e){
    console.warn("Error al renderizar:", e);
    const main = document.getElementById("main");
    if(main) main.innerHTML = '<div class="panel"><h3>' + t("renderErrorTitle") + '</h3>' +
      '<div>' + esc(e.message) + '</div><div class="sub">' + t("renderErrorHint") + '</div></div>';
  }
}

function renderMain(){
  renderNav();
  updateStats();
  const main = document.getElementById("main");
  if(!main) return;
  const v = allVariants.find(x=>x.id===current);
  if(!v){ main.className = ""; main.innerHTML = '<div class="empty">' + t("noData") + '</div>'; return; }
  main.innerHTML = "";
  /* Mesa de examen a dos columnas (CSS ≥1500px): solo si hay referencia que
     poner al lado —anuncios de zuordnung o texto de lectura—. Sin ella, una
     columna; la clase se quita siempre para no arrastrarla entre variantes. */
  main.className = (v.kind !== "schreiben" && (v.passage || (v.options && v.options.length)))
    ? "desk" : "";

  /* Encabezado */
  const h2 = document.createElement("h2");
  h2.textContent = v._sectionTitle + " · " + localizeLabel(v.label);
  main.appendChild(h2);
  const sub = document.createElement("div");
  sub.className = "sub";
  const numItems = (v.items || []).length;
  const itemsText = numItems === 1 ? t("itemCountSingle") : t("itemsCount", {count: numItems});
  sub.innerHTML = t("pagePdf", {page: v.page}) +
    (v.topic ? ' · <b>' + esc(v.topic) + '</b>' : '') +
    (v.kind === "schreiben" ? ' · <b>' + t("schreibenSubBadge") + '</b>' : ' · ' + itemsText);
  main.appendChild(sub);

  if(v.kind === "schreiben"){
    renderSchreiben(v, main);
    return;
  }

  /* Vista habitual para preguntas de Lesen / Hören */
  if(v.note){
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = "⚠ " + noteOf(v);
    main.appendChild(n);
  }
  if(v.intro){
    const p = document.createElement("div");
    p.className = "panel";
    p.innerHTML = '<h3>' + t("instructions") + '</h3><div class="intro-text">' + esc(v.intro) + '</div>';
    main.appendChild(p);
  }

  if(v.passage){
    main.appendChild(detailsPanel(t("readingText"), v.passage));
  }

  if(v.options && v.options.length){
    /* «Usada» = la ha asignado el usuario, no la clave. Derivarlo de la clave
       (itemAnswerLetter) convertía este panel en la solución: salían marcados
       con ✓ justo los 5 anuncios correctos antes de responder nada. */
    const used = new Set(
      v.items.map(i => state.answers[ansKey(v, i)])
             .filter(a => a !== undefined && a !== "__revealed__")
             .map(a => String(a).toLowerCase()));
    const d = document.createElement("details");
    d.className = "panel passage";
    d.open = true;
    const s = document.createElement("summary");
    const label = v.optionsLabel || (v._section === "lesen-t3" ? "Kommentare" : "Anzeigen");
    const ks = v.options.map(o=>String(o.key));
    s.textContent = t("optionsSummary", {
      label: label,
      range: ks[0] + "–" + ks[ks.length-1],
      total: v.options.length,
      used: used.size
    });
    d.appendChild(s);
    const body = document.createElement("div");
    v.options.forEach(o=>{
      const isUsed = used.has(String(o.key).toLowerCase());
      const div = document.createElement("div");
      div.className = "ad " + (isUsed ? "used" : "unused");
      div.innerHTML = '<span class="k">' + esc(o.key) + ')</span>' +
                      '<span class="t">' + esc(o.title||"") + '</span>' +
                      '<div class="body">' + esc(o.text||"") + '</div>';
      body.appendChild(div);
    });
    d.appendChild(body);
    main.appendChild(d);
  }

  const shown = onlyDoubtful ? v.items.filter(isDoubtful) : v.items;
  if(onlyDoubtful){
    const info = document.createElement("div");
    info.className = "note";
    info.textContent = shown.length
      ? t("reviewModeInfo", {shown: shown.length, total: v.items.length})
      : t("reviewModeNoDoubt");
    main.appendChild(info);
  }
  const sheet = document.createElement("section");
  sheet.className = "q-sheet";
  shown.forEach(it => sheet.appendChild(renderItem(v, it)));
  main.appendChild(sheet);

  const row = document.createElement("div");
  row.className = "row";
  const bAll = document.createElement("button");
  bAll.className = "btn ghost";
  bAll.textContent = t("btnShowAllAnswers");
  bAll.onclick = ()=>{
    v.items.forEach(it=>{ if(state.answers[ansKey(v,it)]===undefined)
      state.answers[ansKey(v,it)] = "__revealed__"; });
    saveState(); render();
  };
  const bClear = document.createElement("button");
  bClear.className = "btn ghost";
  bClear.textContent = t("btnClearVariantAnswers");
  bClear.onclick = ()=>{ v.items.forEach(it=> delete state.answers[ansKey(v,it)]);
    saveState(); render(); };
  row.appendChild(bAll); row.appendChild(bClear);
  main.appendChild(row);
}

function countWords(str){
  const m = (str || "").trim().match(/[\p{L}\p{N}_\-]+/gu);
  return m ? m.length : 0;
}

  if(partnerEval){

      '<button class="btn ghost sm" id="btn-toggle-partner-eval-' + v.id + '">' + t("btnViewPartnerEval", {partner: partnerName}) + '</button>';
    evalSec.appendChild(evalBanner);

/* Trae tu lado desde la nube cuando este navegador no lo tiene, y refresca una
   copia local que se quedó vieja. Nunca pisa ediciones sin enviar.

   `enviado` es el último texto que este navegador tiene por sincronizado. Las
   reglas, en orden:
     1. Editor vacío y la nube con texto: se rellena, y queda anotado como
        sincronizado. Si aquí se borró a propósito (`enviado` es la cadena vacía),
        no se rellena: acabas de vaciarlo tú.
     2. Editor igual a la nube: ya coinciden, solo se anota. Es lo que deja
        protegidas las copias que llegaron antes de existir esta marca.
     3. Editor igual a lo último sincronizado y la nube distinta: manda la nube.
        Sin esto, una copia vieja se sube encima de una nueva al primer tecleo.
     4. Editor distinto de lo último sincronizado: hay ediciones sin enviar. No se
        toca nada. */
function hidratarMiLadoDesdeNube(v, datos, textarea, contenedor, badge){
  if(!datos) return;
  const textoNube = datos[currentUser + "_text"] || "";
  const local = getDraft(v.id);
  const enviado = getPushed(v.id);            // undefined = sin registro en este navegador

  const ponerEnEditor = (txt)=>{
    setDraft(v.id, txt);
    textarea.value = txt;
    updateWordBadge(badge, countWords(txt));
    saveState();
  };

  if(!local && !String(textarea.value || "").trim() && textoNube && enviado !== ""){
    ponerEnEditor(textoNube);
    setPushed(v.id, textoNube);
    saveState();
  } else if(local && textoNube && local === textoNube){
    if(local !== enviado){ setPushed(v.id, local); saveState(); }
  } else if(local && local === enviado && textoNube && textoNube !== local){
    ponerEnEditor(textoNube);
    setPushed(v.id, textoNube);               // ya no hay nada sin enviar
    saveState();
  }

  const evalNube = datos[currentUser + "_eval"];
  if(evalNube && !getEval(v.id)){
    setEval(v.id, evalNube);
    saveState();
    contenedor.appendChild(renderEvaluationResult(v, evalNube));
    renderNav();   // la insignia del menú (✓ Aprobado) también vuelve
  }
}

  main.appendChild(layout);

  /* Cargar y escuchar los datos de la nube: los de la pareja para pintarlos y los
     tuyos para recuperarlos si este navegador no los tiene. */
  const cachedPartnerData = cloudSchreibenCache[v.id] || null;
  renderPartnerSchreibenView(partnerContainer, v, cachedPartnerData);
  startListeningToTask(v.id, (freshData)=>{
    renderPartnerSchreibenView(partnerContainer, v, freshData);
    hidratarMiLadoDesdeNube(v, freshData, textarea, mineContainer, wordBadge);
    /* Si se escribió sin conexión, el borrador se quedó en localStorage: lo subimos al
       abrir la tarea, pero solo si la nube no tiene ya nada nuestro (nunca pisamos un
       texto que sí llegó). */
    const localDraft = getDraft(v.id);
    if(localDraft && !freshData[currentUser + "_text"]) pushSchreibenToFirestore(v.id, localDraft);
  });

  /* Conectar eventos de cambio de pestañas Mi Redacción / Redacción de Pareja */
  const tabMineBtn = tabContainer.querySelector("#tab-schreiben-mine");
  const tabPartnerBtn = tabContainer.querySelector("#tab-schreiben-partner");
  if(tabMineBtn && tabPartnerBtn){
    tabMineBtn.onclick = ()=>{
      tabMineBtn.classList.add("active");
      tabPartnerBtn.classList.remove("active");
      mineContainer.style.display = "block";
      partnerContainer.style.display = "none";
    };
    tabPartnerBtn.onclick = ()=>{
      tabPartnerBtn.classList.add("active");
      tabMineBtn.classList.remove("active");
      mineContainer.style.display = "none";
      partnerContainer.style.display = "block";
    };
  }

  /* Conectar eventos del temporizador */
  const tBtn = document.getElementById("timer-btn");
  const tRst = document.getElementById("timer-rst");
  const tDisp = document.getElementById("timer-display");
  if(tBtn && tRst && tDisp){
    tBtn.textContent = examTimerRunning ? t("timerPause") : t("timerStart");
    tBtn.onclick = ()=>{
      if(examTimerRunning){
        clearInterval(examTimer);
        examTimerRunning = false;
        tBtn.textContent = t("timerResume");
      } else {
        examTimerRunning = true;
        tBtn.textContent = t("timerPause");
        examTimer = setInterval(()=>{
          if(examTimerSeconds > 0){
            examTimerSeconds--;
            tDisp.textContent = formatTimer(examTimerSeconds);
            if(examTimerSeconds <= 300) tDisp.className = "timer-display warn";
          } else {
            clearInterval(examTimer);
            examTimerRunning = false;
            tBtn.textContent = t("timerFinished");
            alert(t("timerAlert"));
          }
        }, 1000);
      }
    };
    tRst.onclick = ()=>{
      clearInterval(examTimer);
      examTimerRunning = false;
      examTimerSeconds = 45 * 60;
      tDisp.textContent = formatTimer(examTimerSeconds);
      tDisp.className = "timer-display";
      tBtn.textContent = t("timerStart");
    };
  }

  /* Conectar evento de evaluación */
  bEval.onclick = async ()=>{
    const textToEval = textarea.value.trim();
    const words = countWords(textToEval);
    if(words < 30){
      alert(t("alertTooShort", {words: words}));
      return;
    }
    const cfg = getAIConfig();
    if(cfg.provider === "gemini" && !cfg.geminiKey){
      openAIConfigModal(t("alertNeedGeminiKey"));
      return;
    }
    if(cfg.provider === "openai_compatible" && !cfg.customKey){
      openAIConfigModal(t("alertNeedCustomKey"));
      return;
    }

    bEval.disabled = true;
    bEval.innerHTML = t("btnEvaluating");
    statusMsg.textContent = t("statusConnecting");

    try {
      const result = await evaluateWithLLM(v, textToEval, (msg)=>{ statusMsg.textContent = msg; });
      result.student_text = textToEval;
      setEval(v.id, result);
      saveState();
      pushSchreibenToFirestore(v.id, textToEval, result);
      statusMsg.textContent = t("statusCompleted");
      render();
    } catch(err) {
      statusMsg.innerHTML = '<span class="status-error">' + t("statusError") + esc(errorDeRed(err)) + '</span>';
      alert(t("alertEvalError", {error: err.message}));
    } finally {
      bEval.disabled = false;
      bEval.innerHTML = t("btnEvaluate");
    }
  };
}
