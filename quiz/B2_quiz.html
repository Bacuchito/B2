eder Opfer\" auf eindrucksvolle Weise ihre eigenen Erfahrungen zum Thema „Mobbing\".", "distractor": "También trata el mobbing, pero es una novela en la que la autora elabora sus propias experiencias: narra un caso, no ofrece ayuda ni asesoramiento. Es el distractor de la persona 3 (Hannah, sucht Hilfe)."}, {"key": "g", "title": "Verpflichtend oder freiwillig.", "text": "Die Anforderungen der Berufswelt ändern sich rasant und somit entsteht auch die Notwendigkeit für die Belegschaft, sich kontinuierlich weiterzubilden. Prinzipiell gilt, dass Mitarbeiter zur Teilnahme an Seminaren verpflichtet sind, wenn diese zur Ausübung ihrer Tätigkeit notwendig sind und in der normalen Arbeitszeit stattfinden.", "distractor": ""}, {"key": "h", "title": "Karriereplan für eine vielversprechende Laufbahn.", "text": "Vor allem in Großstädten bieten immer mehr junge Unternehmen interessante Jobmöglichkeiten. Dennoch setzen die meisten Uniabsolventen nach wie vor auf große Konzerne, von denen sie sich eher Sicherheit und vielversprechende Karrierechancen erhoffen. Doch das können sie auch bei jungen Start-up-Unternehmen finden.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Yasmina sucht nach dem Realschulabschluss einen Beruf mit guten Perspektiven.", "answer": "d", "confidence": "hoch", "quote": "Dabei bieten Handwerksberufe gerade jungen Leuten die allerbesten Chancen für eine erfolgreiche Karriere. Fachkräfte brauchen sich um ihre Zukunft nicht zu sorgen.", "explain_ru": "Yasmina после Realschulabschluss ищет профессию с хорошими перспективами, то есть путь в мир труда без университета. Объявление d представляет ремесленные профессии как лучший шанс для молодых и указывает 150 000 незанятых мест. Объявление h тоже говорит о карьере, но адресовано «Uniabsolventen».", "explain": "Yasmina busca, tras el Realschulabschluss, una profesión con buenas perspectivas, es decir, un acceso al mundo laboral sin estudios universitarios. El anuncio d presenta las profesiones artesanas como la mejor oportunidad para los jóvenes y señala 150.000 puestos sin cubrir. El anuncio h también habla de carrera, pero se dirige a «Uniabsolventen».", "verified": true}, {"n": 2, "type": "choice", "prompt": "Jason überlegt, ob er bei einem neu gegründeten Unternehmen arbeiten soll.", "answer": "h", "confidence": "hoch", "quote": "Vor allem in Großstädten bieten immer mehr junge Unternehmen interessante Jobmöglichkeiten.", "explain_ru": "Jason рассматривает работу по найму в молодой компании. Объявление h говорит, что всё больше молодых компаний предлагают интересные места и что в стартапах тоже есть надёжность и перспективы. Объявление c тоже упоминает новые компании, но речь об их создании (Selbstständigkeit), а не о работе в них.", "explain": "Jason se plantea trabajar como empleado en una empresa de nueva creación. El anuncio h dice que cada vez más empresas jóvenes ofrecen puestos interesantes y que también en los start-ups se encuentran seguridad y perspectivas. El anuncio c menciona igualmente empresas nuevas, pero se refiere a fundarlas uno mismo (Selbstständigkeit), no a trabajar en ellas.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Hannah wird von ihren Kollegen schlecht behandelt und sucht Hilfe.", "answer": "a", "confidence": "hoch", "quote": "Inzwischen gibt es zahlreiche Coaching-Programme für Mitarbeiter, die Strategien aufzeigen, wie man mit solchen Situationen besser umgehen kann.", "explain_ru": "Hannah страдает от плохого обращения коллег и ищет помощь. Объявление a описывает моббинг («Beleidigungen, Ausgrenzung, versteckte Drohungen») и предлагает программы коучинга со стратегиями, как с этим справляться. Объявление f тоже о моббинге, но это роман, без предложения помощи.", "explain": "Hannah sufre malos tratos de sus colegas y busca ayuda. El anuncio a describe el mobbing («Beleidigungen, Ausgrenzung, versteckte Drohungen») y remite a programas de coaching con estrategias para afrontarlo. El anuncio f también trata el mobbing, pero es una novela, sin oferta de ayuda.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Gacer fragt sich, ob sie Fortbildungen besuchen muss.", "answer": "g", "confidence": "hoch", "quote": "Prinzipiell gilt, dass Mitarbeiter zur Teilnahme an Seminaren verpflichtet sind, wenn diese zur Ausübung ihrer Tätigkeit notwendig sind und in der normalen Arbeitszeit stattfinden.", "explain_ru": "Gacer спрашивает, обязана ли она проходить курсы повышения квалификации. Объявление g («Verpflichtend oder freiwillig») отвечает, что сотрудники обязаны участвовать в семинарах, когда они необходимы для их работы и проходят в рабочее время. Объявление e тоже упоминает «Fortbildungen», но лишь как часть, которую засчитывают для Meisterprüfung.", "explain": "Gacer se pregunta si está obligada a hacer cursos de formación continua. El anuncio g («Verpflichtend oder freiwillig») responde que los empleados están obligados a participar en seminarios cuando son necesarios para su actividad y se celebran dentro del horario laboral. El anuncio e menciona también «Fortbildungen», pero solo como parte reconocible del examen de maestría.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Assem braucht Informationen zur Meisterprüfung.", "answer": "e", "confidence": "hoch", "quote": "Die Interessengemeinschaft „Das Handwerk\" hat die wichtigsten Zulassungsvoraussetzungen zur Meisterprüfung zusammengefasst.", "explain_ru": "Assem нужна информация о Meisterprüfung. Объявление e — единственное, где она есть: там собраны условия допуска («Zulassungsvoraussetzungen») и объясняется, какие курсы засчитываются. Объявление b называет Meisterprüfung, но только как рекламный слоган, без полезной информации.", "explain": "Assem necesita información sobre el examen de maestría. El anuncio e es el único que la ofrece: reúne los requisitos de admisión («Zulassungsvoraussetzungen») y explica qué cursos de formación se reconocen. El anuncio b nombra la Meisterprüfung, pero solo como eslogan publicitario, sin información útil.", "verified": true}]}, {"id": "t1_d-p16", "label": "Variante 6", "page": 16, "note": "", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Die Lebensmittelbranche boomt.", "text": "Der Einzelhandel ist einer der größten und umsatzstärksten Wirtschaftszweige national und international. Es werden dort ständig qualifizierte Mitarbeiter gesucht. Allein in Hessen werden jährlich 160.000 junge Menschen ausgebildet. Der Einzelhandel ist außerdem krisenfest, denn gegessen wird immer.", "distractor": ""}, {"key": "b", "title": "Aus Fehlern anderer lernen.", "text": "Viele Unternehmer machen zu Beginn ihrer Selbstständigkeit ähnliche Fehler. Heute weiß man, dass ein durchdachter Businessplan und eine genaue Konkurrenzanalyse unverzichtbar sind. Worauf es noch ankommt, erfährst du in den Tipps des Erfolgscoachs Gregor Daub.", "distractor": ""}, {"key": "c", "title": "Chancen im Einzelhandel.", "text": "Die FOOD Unternehmensgruppe betreibt Supermärkte in zehn Ländern Europas. Der Branchenriese möchte weiter expandieren und hat gerade die Filialen der Jennings GmbH übernommen. Erfahrene Mitarbeiter finden dort interessante Möglichkeiten zur beruflichen Weiterentwicklung.", "distractor": ""}, {"key": "d", "title": "Gute Nachrichten für gekündigte Mitarbeiter.", "text": "Die Tankstellenkette Fairtank hat Bankrott angekündigt und schließt zum 31. März ihre 25 Filialen in Brandenburg. Rund 100 Mitarbeiter sind betroffen und suchen nun einen neuen Job. Für einige von ihnen gibt es eine Lösung: Tankstellen in der Umgebung haben ihre Unterstützung zugesagt und versprochen, Mitarbeiter von Fairtank zu übernehmen.", "distractor": "Es una noticia sobre un caso concreto (la quiebra de Fairtank y sus 25 filiales en Brandeburgo), no un consejo para quien se queda sin empleo. Se confunde con la persona 4 (Mira), pero solo informa de que otra empresa recoge a esos empleados; no dice qué debe hacer uno en general para encontrar trabajo rápido."}, {"key": "e", "title": "Was nun?", "text": "Egal, ob die ganze Firma pleitegeht, eine Abteilung dichtmacht oder nur der eigene Job weg ist, eine Entlassung ist immer ein Schock. Arbeitsmarktexpertin Caroline Cuyper erklärt, was man als Angestellter tun muss, um möglichst schnell eine neue Stelle zu bekommen.", "distractor": ""}, {"key": "f", "title": "Neue Kursreihe bei Arcadio.", "text": "Ab sofort bietet das Institut Arcadio neben seinen Computerkursen für Senioren auch Weiterbildungen für Teilnehmer mit geringen Deutschkenntnissen an. Das Besondere daran: Die Dozenten verwenden eine einfache Sprache. Was hinter diesem innovativen Konzept steht, erzählt der Institutsgründer Benjamin von Adler im Interview.", "distractor": "Sí ofrece cursos de informática, pero presenciales y dirigidos a seniors y a personas con pocos conocimientos de alemán; no son cursos para hacer desde casa. Es el distractor temático de la persona 2 (Brian)."}, {"key": "g", "title": "Wenn die Mitarbeiter kündigen.", "text": "Immer mehr Mitarbeiter kündigen und verlassen ihre Firma. Und zwar selbst dann, wenn sie mehr Gehalt bekommen als bei der Konkurrenz. Die Unternehmensberatung Schindler hat die häufigsten Gründe analysiert, warum sich Angestellte entscheiden, ihren Job zu wechseln.", "distractor": "Trata de quienes se marchan por voluntad propia y de los motivos de esa decisión, no de quien pierde el empleo ni de cómo encontrar uno nuevo. Distractor vecino de la persona 4 (Mira) y, por el tema «wechseln», también de la 1."}, {"key": "h", "title": "Bildung im neuen Zeitalter.", "text": "Schneller technologischer Fortschritt, Globalisierung und Veränderungen auf dem Arbeitsmarkt haben dazu geführt, dass Fortbildungen im Beruf eine immer wichtigere Rolle spielen. Zunehmend werden Online-Kurse und Webinare am Computer angeboten, die den Teilnehmern maximale Flexibilität versprechen. Wo findet man passende Fortbildungen?", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Silvie ist gelernte Verkäuferin und möchte in ihrem Job aufsteigen.", "answer": "c", "confidence": "hoch", "quote": "Erfahrene Mitarbeiter finden dort interessante Möglichkeiten zur beruflichen Weiterentwicklung.", "explain_ru": "Silvie — дипломированный продавец и хочет расти. Объявление c — единственное, где прямо предлагают «berufliche Weiterentwicklung» сотрудникам с опытом в торговле. Объявление a тоже из пищевой отрасли, но там ищут персонал и учебные места, а не повышение внутри компании.", "explain": "Silvie es vendedora titulada y quiere ascender. El anuncio c es el único que ofrece expresamente «berufliche Weiterentwicklung» a empleados con experiencia en el comercio. El anuncio a también es del sector alimentario, pero habla de buscar personal y de plazas de formación, no de promoción interna.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Brian sucht Computerkurse, die er von zu Hause aus machen kann.", "answer": "h", "confidence": "hoch", "quote": "Zunehmend werden Online-Kurse und Webinare am Computer angeboten, die den Teilnehmern maximale Flexibilität versprechen.", "explain_ru": "Brian хочет курсы по информатике, которые можно проходить из дома. Объявление h описывает именно онлайн-курсы и вебинары у компьютера с максимальной гибкостью. Объявление f тоже предлагает «Computerkurse», но очные и для пожилых, поэтому не подходит под гибкость, которую ищет Brian.", "explain": "Brian quiere cursos de informática que pueda hacer desde casa. El anuncio h describe exactamente cursos en línea y webinarios frente al ordenador con máxima flexibilidad. El anuncio f también ofrece «Computerkurse», pero presenciales y para seniors, de modo que no encaja con la flexibilidad que busca Brian.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Carl ist Umwelttechniker und möchte seine eigene Beratungsagentur gründen.", "answer": "b", "confidence": "hoch", "quote": "Viele Unternehmer machen zu Beginn ihrer Selbstständigkeit ähnliche Fehler.", "explain_ru": "Carl хочет открыть своё консультационное агентство, то есть перейти к работе на себя. Объявление b — единственное о начале «Selbstständigkeit» (бизнес-план, анализ конкурентов) с советами коуча.", "explain": "Carl quiere montar su propia agencia de asesoría, es decir, pasar a la actividad por cuenta propia. El anuncio b es el único que trata del comienzo del «Selbstständigkeit» (plan de negocio, análisis de la competencia) y ofrece los consejos de un coach.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Mira ist unsicher, wie es nach ihrem Arbeitsplatzverlust weitergehen soll.", "answer": "e", "confidence": "hoch", "quote": "Arbeitsmarktexpertin Caroline Cuyper erklärt, was man als Angestellter tun muss, um möglichst schnell eine neue Stelle zu bekommen.", "explain_ru": "Mira потеряла работу и не знает, как быть дальше. Объявление e исходит именно из этой ситуации («eine Entlassung ist immer ein Schock») и даёт советы, как быстро найти новое место. Объявление d тоже говорит об уволенных, но только об одном конкретном случае и без полезных советов.", "explain": "Mira ha perdido el empleo y no sabe cómo seguir. El anuncio e parte justamente de esa situación («eine Entlassung ist immer ein Schock») y da consejos para encontrar pronto un nuevo puesto. El anuncio d también habla de despedidos, pero solo de un caso concreto y sin consejos útiles.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Karim sucht einen Ausbildungsplatz in einer sicheren Branche.", "answer": "a", "confidence": "hoch", "quote": "Allein in Hessen werden jährlich 160.000 junge Menschen ausgebildet. Der Einzelhandel ist außerdem krisenfest, denn gegessen wird immer.", "explain_ru": "Karim ищет учебное место в надёжной отрасли. Объявление a упоминает 160 000 учебных мест в год и называет розничную торговлю «krisenfest» (устойчивой к кризисам). Объявление c тоже из этой отрасли, но адресовано уже опытным сотрудникам, которые ищут повышения.", "explain": "Karim busca una plaza de formación en un sector seguro. El anuncio a menciona las 160.000 plazas de formación anuales y califica el comercio minorista de «krisenfest» (a prueba de crisis). El anuncio c también es del sector, pero se dirige a personal ya experiente que busca promoción.", "verified": true}]}, {"id": "t1_d-p17", "label": "Variante 7 (test 150321, 150301)", "page": 17, "note": "", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Den Arbeitsplatz produktiv gestalten.", "text": "Die richtige Atmosphäre am Arbeitsplatz ist für die effektive Erledigung der Aufgaben unerlässlich. Gerlinde Strauß beschreibt, wie man mit den richtigen Möbeln, Dekoartikeln, Licht, Ordnung am Arbeitsplatz und vielem mehr die eigene Umgebung so gestaltet, dass man die Zeit am Arbeitsplatz gerne und erfolgreich verbringt.", "distractor": "Va de decorar y organizar el puesto de trabajo (muebles, luz, orden) para rendir mejor, no del cansancio ni del estrés. Distractor temático de la persona 2 (Juliette), que se siente agotada, y también de la 5 (Carlos), aunque no menciona el teletrabajo."}, {"key": "b", "title": "Ohne Selbstdisziplin geht es nicht.", "text": "Die Arbeit von zu Hause aus erfordert ein hohes Maß an Selbstdisziplin und die Fähigkeit des Selbstmanagements. Privates und Arbeit sollten strikt getrennt werden. Doch wie funktioniert das am besten? Helga Brinkmann hat einen Ratgeber für Arbeitskräfte herausgegeben, deren Unternehmen diese Form der Arbeit anbieten.", "distractor": ""}, {"key": "c", "title": "Hobbys im Lebenslauf richtig einsetzen.", "text": "Ausbildung und Qualifikation sind in erster Linie wichtig, wenn man den Lebenslauf eines Bewerbers liest. Doch auch, welche Hobbys eine Person hat, kann Auskunft darüber geben, ob sie zum Unternehmen passt oder nicht. Lesen Sie hier wichtige Tipps und Tricks für eine überzeugende Bewerbung.", "distractor": ""}, {"key": "d", "title": "Was unsere Körpersprache über uns verrät.", "text": "Ob beim Vorstellungsgespräch, bei wichtigen Verhandlungen mit Kunden oder am ersten Arbeitstag – unsere Körpersprache gibt immer Auskunft darüber, wie wir uns gerade fühlen, z. B. angespannt oder selbstsicher. Lernen Sie in unserem Seminar, wie Sie Körpersprache wirksam einsetzen und wie Sie Ihr Gegenüber einschätzen können.", "distractor": "Trata de la comunicación no verbal y menciona el «ersten Arbeitstag» y el estar «angespannt», lo que lo acerca a la persona 3 (Peter), pero Peter no busca un seminario sobre lenguaje corporal: busca orientación práctica para su primer día. Distractor temático de la 3."}, {"key": "e", "title": "Der erste Arbeitstag in der neuen Firma.", "text": "So klappt es mit den Kolleginnen. Anspannung ist ganz normal: Beim Start im neuen Job ist es wichtig, gut vorbereitet zu sein. Im folgenden Artikel von Irene Miller finden Sie eine Checkliste mit den wichtigsten Punkten, die Sie beachten sollten, damit der Einstieg gelingt.", "distractor": ""}, {"key": "f", "title": "Angemessene Bezahlung?", "text": "Jeder möchte für seine Leistung fair bezahlt werden. Doch in vielen Berufsfeldern haben die Arbeitnehmer das Gefühl, unterbezahlt zu sein. Die Folge davon sind Motivationsverlust und Zweifel daran, ob man wirklich den richtigen Beruf gewählt hat. Lesen Sie hier, wie Sie erfolgreich Gehaltsverhandlungen führen.", "distractor": ""}, {"key": "g", "title": "Körperliche Folgen von Stress.", "text": "Nicht jeder Stress macht krank. Es gibt auch positiven Stress, der die Leistungsfähigkeit eines Menschen erhöht. Wer aber unter Daueranspannung steht und körperliche Symptome wie Bluthochdruck, Magenbeschwerden oder eine anhaltende innere Anspannung spürt, muss etwas ändern. Wie, das erfahren Sie im neusten Buch von Harald Erhard.", "distractor": ""}, {"key": "h", "title": "Frauen verdienen immer noch zu wenig.", "text": "Europaweit ist das Ziel der Gleichstellung noch längst nicht erreicht. Man denke hier nur an die nach wie vor ungleiche Bezahlung von Männern und Frauen und an die Besetzung von Stellen in der Führungsetage. Deutschland liegt bei diesem Vergleich noch immer auf einem der letzten Plätze.", "distractor": "Es un artículo de estadística y política sobre la brecha salarial de género y la igualdad, sin ningún consejo práctico. Se confunde con la persona 4 (Katharina) por el tema del sueldo, pero no la ayuda a negociar ni a cambiar su situación: es el distractor trampa de la 4."}], "items": [{"n": 1, "type": "choice", "prompt": "Kurt sucht einen Job und braucht Anregungen für seine Unterlagen.", "answer": "c", "confidence": "hoch", "quote": "Lesen Sie hier wichtige Tipps und Tricks für eine überzeugende Bewerbung.", "explain_ru": "Kurt ищет работу и нуждается в идеях для своих документов. Объявление c предлагает советы для убедительного резюме и заявки («Lebenslauf», «Bewerbung») — именно то, что нужно для его «Unterlagen».", "explain": "Kurt busca empleo y necesita ideas para sus documentos. El anuncio c ofrece consejos para un currículum y una candidatura convincentes («Lebenslauf», «Bewerbung»), que es exactamente lo que necesita para sus «Unterlagen».", "verified": true}, {"n": 2, "type": "choice", "prompt": "Juliette arbeitet gerne, fühlt sich aber oft erschöpft.", "answer": "g", "confidence": "mittel", "quote": "Wer aber unter Daueranspannung steht und körperliche Symptome wie Bluthochdruck, Magenbeschwerden oder eine anhaltende innere Anspannung spürt, muss etwas ändern.", "explain_ru": "Juliette работает с удовольствием, но часто чувствует себя истощённой. Объявление g — единственное, где речь о физических последствиях стресса и постоянного напряжения, то есть о самой вероятной причине этой истощённости. Средняя уверенность: в объявлении нет слова «erschöpft», и связь устанавливается по общему смыслу; можно было бы подумать и об объявлении a, но там речь только об оформлении и порядке на рабочем месте.", "explain": "Juliette trabaja a gusto pero se siente a menudo agotada. El anuncio g es el único que trata las consecuencias físicas del estrés y la tensión permanente, que es la causa más plausible de ese agotamiento. Confianza media porque el anuncio no usa la palabra «erschöpft» y la relación se establece por el sentido global; también podría pensarse en el anuncio a, que sin embargo solo habla de decoración y orden del puesto.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Peter ist vor seinem Start im neuen Unternehmen nervös.", "answer": "e", "confidence": "hoch", "quote": "Anspannung ist ganz normal: Beim Start im neuen Job ist es wichtig, gut vorbereitet zu sein.", "explain_ru": "Peter волнуется перед началом работы в новой компании. Объявление e посвящено именно первому дню в новой компании и нормализует волнение («Anspannung ist ganz normal»), предлагая контрольный список. Объявление d тоже использует «am ersten Arbeitstag» и «angespannt», но это семинар по языку тела.", "explain": "Peter está nervioso antes de empezar en la nueva empresa. El anuncio e trata exactamente el primer día en la nueva empresa y normaliza los nervios («Anspannung ist ganz normal») ofreciendo una lista de comprobación. El anuncio d también emplea «am ersten Arbeitstag» y «angespannt», pero es un seminario de lenguaje corporal.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Katharina ist wegen des niedrigen Verdienstes in ihrer Branche frustriert.", "answer": "f", "confidence": "hoch", "quote": "Doch in vielen Berufsfeldern haben die Arbeitnehmer das Gefühl, unterbezahlt zu sein. Die Folge davon sind Motivationsverlust und Zweifel daran, ob man wirklich den richtigen Beruf gewählt hat.", "explain_ru": "Katharina разочарована низкой зарплатой в своей отрасли. Объявление f как раз о том, что во многих профессиях платят мало, и предлагает помощь в переговорах о зарплате. Объявление h тоже о зарплатах, но как общий анализ неравенства между мужчинами и женщинами, без практической пользы для неё.", "explain": "Katharina está frustrada por el bajo sueldo de su sector. El anuncio f recoge justamente el sentirse mal pagado en muchos ámbitos profesionales y ofrece ayuda para negociar el salario. El anuncio h también habla de sueldos, pero como análisis general de la desigualdad entre hombres y mujeres, sin utilidad práctica para ella.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Carlos braucht Tipps für seine Tätigkeit im Homeoffice.", "answer": "b", "confidence": "hoch", "quote": "Die Arbeit von zu Hause aus erfordert ein hohes Maß an Selbstdisziplin und die Fähigkeit des Selbstmanagements.", "explain_ru": "Carlos нуждается в советах для работы из дома. Объявление b — единственное о «Arbeit von zu Hause aus», о самодисциплине и разделении личной жизни и работы, и оно ссылается на практическое руководство.", "explain": "Carlos necesita consejos para su trabajo desde casa. El anuncio b es el único que habla del «Arbeit von zu Hause aus», de la autodisciplina y de separar vida privada y trabajo, y remite a una guía práctica.", "verified": true}]}, {"id": "t1_d-p18", "note_ru": "Текст объявления h) («Den Horizont erweitern») в оригинале обрезан в конце страницы: он заканчивается на «Auslandsaufenthalte können». Концовка объявления в PDF отсутствует.", "label": "Variante 8 (test 160201, 160221)", "page": 18, "note": "Der Anzeigentext h) («Den Horizont erweitern») ist im Original am Seitenende abgeschnitten: Er endet mit «Auslandsaufenthalte können». Der Schluss der Anzeige fehlt im PDF.", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Internationale Fachkräfte gesucht", "text": "Im Ausland zu arbeiten, kann eine hervorragende Chance für Menschen in aller Welt sein. Erfahren Sie als Arbeitgeber, mit welchen Strategien Sie dringend benötigte Arbeitskräfte aus dem Ausland für sich gewinnen, um Ihr Unternehmen wettbewerbsfähiger zu machen.", "distractor": "Se dirige expresamente al «Arbeitgeber»: son estrategias para que las empresas capten personal extranjero, no una oferta para quien quiere irse al extranjero. Distractor trampa de la persona 4 (Sandra), porque empieza hablando de trabajar en el extranjero, pero desde el lado de la empresa."}, {"key": "b", "title": "Auf zu neuen Ufern!", "text": "Im Job ist es nie zu spät, mit etwas Neuem zu beginnen, um sich weiterzuentwickeln. Manchmal fehlen nur ein bisschen Mut und Unterstützung. Oder man weiß erst gar nicht, welche Möglichkeiten es gibt. Eine gute Beratung ist darum wichtig. Wo Sie die bekommen, erfahren Sie hier.", "distractor": ""}, {"key": "c", "title": "Zufriedene Mitarbeiter", "text": "Viele Firmen überlegen, wie sie ihren Angestellten das Arbeitsleben abwechslungsreicher gestalten können. Manche schicken ihre Mitarbeitenden auf Dienstreisen ins Ausland, andere finanzieren ihnen Sprachkurse oder verteilen großzügig Prämien. Was noch möglich ist und wie sich das steuerlich auswirkt, erklärt der Steuerberater Michael Hahne.", "distractor": "Está escrito para las empresas (cómo hacer más variada la vida laboral de la plantilla; incluso lo explica un asesor fiscal). Menciona «Sprachkurse» y «Dienstreisen ins Ausland», de modo que es el distractor temático de la persona 1 (Barbara, idiomas) y de la 4 (Sandra, extranjero), pero no ofrece nada al empleado."}, {"key": "d", "title": "Dschungel in der Arbeitswelt", "text": "Wie viel Urlaub steht einem zu? Wie viel sollte man in seinem Beruf verdienen? Wie viele Stunden arbeitet man üblicherweise? Bekommt man einen Zuschuss für Sprachkurse? Mit vielen gesetzlichen Dingen muss man sich auskennen, wenn man im Arbeitsleben steht. Die wichtigsten Informationen finden Sie hier zusammengefasst.", "distractor": ""}, {"key": "e", "title": "Chefsache", "text": "Ein erfolgreiches Unternehmen gibt es nur mit einem motivierten Team. Aber wie motiviert man seine Mitarbeiter? Hören Sie ihnen aufmerksam zu! Kontrollieren Sie nicht jeden Arbeitsschritt, sondern delegieren Sie! Nehmen Sie Mobbing ernst! Zahlen Sie faire Gehälter! Diese und noch viele andere Ratschläge lesen Sie hier.", "distractor": "Son recomendaciones para jefes (imperativos dirigidos a quien manda en la empresa). Menciona «Mobbing» y «faire Gehälter», así que es el distractor trampa de la persona 3 (Petra) y de la 2 (Frank), pero no ayuda a quien sufre el problema."}, {"key": "f", "title": "Vielseitig qualifiziert!", "text": "Von Arbeitnehmer*innen wird immer mehr verlangt. Nicht nur die aktuellen fachlichen Kenntnisse und die souveräne Arbeit mit dem PC sind eine Selbstverständlichkeit, sondern auch die sprachlichen Kompetenzen werden immer wichtiger. Hier findet jeder den richtigen Kurs für sich, von Englisch über Japanisch bis Suaheli.", "distractor": ""}, {"key": "g", "title": "Lassen Sie sich von Kolleg*innen den Arbeitsalltag nicht schwermachen", "text": "Sie erfahren von der Sitzung zuletzt? In der Kantine sitzen Sie allein? Es passiert immer häufiger in deutschen Unternehmen, dass manche Kollegen anderen das Leben aus unklaren Gründen schwermachen. Lesen Sie in diesem Ratgeber, wo Sie Hilfe bekommen können.", "distractor": ""}, {"key": "h", "title": "Den Horizont erweitern", "text": "Manche zieht die Liebe in ein anderes Land. Andere sehen dort interessantere berufliche Möglichkeiten. Manchmal ist das die reine Abenteuerlust. Auslandsaufenthalte können", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Barbara braucht beruflich Grundkenntnisse in Spanisch.", "answer": "f", "confidence": "hoch", "quote": "sondern auch die sprachlichen Kompetenzen werden immer wichtiger. Hier findet jeder den richtigen Kurs für sich, von Englisch über Japanisch bis Suaheli.", "explain_ru": "Barbara нужны базовые знания испанского по работе. Объявление f — единственное с курсами языков для профессиональной сферы и подбором курса под каждого. Объявление c тоже упоминает языковые курсы, но их оплачивают компании для своих сотрудников.", "explain": "Barbara necesita conocimientos básicos de español por motivos laborales. El anuncio f es el único que ofrece cursos de idiomas para el ámbito profesional y remite a un curso adecuado para cada persona. El anuncio c también menciona cursos de idiomas, pero los financian las empresas para su plantilla.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Frank denkt, dass sein Gehalt nicht branchenüblich ist.", "answer": "d", "confidence": "mittel", "quote": "Wie viel sollte man in seinem Beruf verdienen? Wie viele Stunden arbeitet man üblicherweise? Bekommt man einen Zuschuss für Sprachkurse? Mit vielen gesetzlichen Dingen muss man sich auskennen, wenn man im Arbeitsleben steht. Die wichtigsten Informationen finden Sie hier zusammengefasst.", "explain_ru": "Frank считает, что его зарплата не соответствует обычной для отрасли. Объявление d — подборка информации для сотрудников, которая отвечает в том числе на вопрос «Wie viel sollte man in seinem Beruf verdienen?», что позволяет сравнить с обычным уровнем. Средняя уверенность: в объявлении нет слова «branchenüblich» и нет цифр, это общее руководство. Объявление e («Zahlen Sie faire Gehälter!») рассматривает зарплату с точки зрения начальника и Frank не помогает.", "explain": "Frank cree que su sueldo no es el habitual del sector. El anuncio d es una recopilación de información para empleados que responde, entre otras, a la pregunta «Wie viel sollte man in seinem Beruf verdienen?», lo que permite comparar con lo habitual. Confianza media porque el anuncio no dice «branchenüblich» ni da cifras: es una guía general. El anuncio e («Zahlen Sie faire Gehälter!») trata el sueldo desde la perspectiva del jefe y no sirve a Frank.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Petra fühlt sich am Arbeitsplatz gemobbt.", "answer": "g", "confidence": "hoch", "quote": "Es passiert immer häufiger in deutschen Unternehmen, dass manche Kollegen anderen das Leben aus unklaren Gründen schwermachen. Lesen Sie in diesem Ratgeber, wo Sie Hilfe bekommen können.", "explain_ru": "Petra чувствует травлю со стороны коллег. Объявление g описывает именно коллег, которые усложняют жизнь другим, и предлагает пособие с указанием, где искать помощь. Объявление e упоминает «Mobbing», но адресовано начальникам, а не пострадавшему.", "explain": "Petra se siente acosada por sus colegas. El anuncio g describe exactamente a compañeros que hacen la vida difícil a otros y ofrece un manual con lugares donde encontrar ayuda. El anuncio e menciona «Mobbing», pero se dirige a los jefes, no a la persona afectada.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Sandra möchte im Ausland berufliche Erfahrungen sammeln.", "answer": "h", "confidence": "mittel", "quote": "Andere sehen dort interessantere berufliche Möglichkeiten. Manchmal ist das die reine Abenteuerlust. Auslandsaufenthalte können", "explain_ru": "Sandra хочет набрать профессиональный опыт за границей. Объявление h — единственное, написанное для тех, кто рассматривает пребывание за границей по рабочим причинам («interessantere berufliche Möglichkeiten», «Auslandsaufenthalte»). Средняя уверенность: текст обрезан в конце страницы и не хватает концовки, которая дала бы полный смысл; также нужно исключить объявление a, где о загранице говорится с точки зрения работодателя.", "explain": "Sandra quiere acumular experiencia profesional en el extranjero. El anuncio h es el único escrito para quien se plantea una estancia en el extranjero con motivos profesionales («interessantere berufliche Möglichkeiten», «Auslandsaufenthalte»). Confianza media porque el texto está cortado al final de la página y falta el cierre que daría el sentido completo; también hay que descartar el anuncio a, que habla del extranjero pero desde el punto de vista del empleador.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Felix möchte sich beruflich verändern.", "answer": "b", "confidence": "hoch", "quote": "Im Job ist es nie zu spät, mit etwas Neuem zu beginnen, um sich weiterzuentwickeln.", "explain_ru": "Felix хочет сменить профессию. Объявление b — единственное, которое побуждает начать на работе что-то новое для развития и ссылается на консультацию о существующих возможностях. Остальные объявления предполагают, что человек остаётся на своём месте.", "explain": "Felix quiere cambiar profesionalmente. El anuncio b es el único que anima a empezar algo nuevo en el trabajo para desarrollarse y que remite a un asesoramiento sobre las posibilidades existentes. Los demás anuncios presuponen que la persona se queda en su puesto.", "verified": true}]}]}, {"id": "lesen-t2", "title": "Lesen Teil 2", "variants": [{"id": "t2_a-p19a", "note_ru": "На с. 19 две версии пунктов 6 и 7 по одному и тому же тексту Willkommensmappe (Zugangskontrolle): эта первая и помеченная «Новый вариант» (→ t2_a-p19b). Они разделены на два варианта, чтобы каждый пункт сохранил свой ключ ответа («id#n»).", "label": "Text 1 – Variante 1", "page": 19, "note": "La p. 19 trae dos versiones de los ítems 6 y 7 sobre el mismo texto de la Willkommensmappe (Zugangskontrolle): esta primera y la marcada «Новый вариант» (→ t2_a-p19b). Se han separado en dos variantes para que cada ítem conserve su propia clave de respuesta («id#n»).", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nZugangskontrolle und Zeiterfassung\n\nAls Mitarbeiterinnen und Mitarbeiter erhalten Sie zu Beginn Ihres Arbeitsverhältnisses einen Firmenausweis mit Chip-Karte. Dieser berechtigt zum Zugang in das Unternehmensgebäude und dient gleichzeitig zur Erfassung der Arbeitszeit. Außerdem können Sie mit Ihrem Firmenausweis in der Kantine und am Getränkeautomaten bezahlen und das hauseigene Fitnessstudio benutzen. Neben den Aufzügen im Erdgeschoss finden Sie ein digitales Zeiterfassungsgerät. Bitte halten Sie beim Betreten und Verlassen des Gebäudes Ihren Firmenausweis an die blau markierte Fläche und vergewissern Sie sich, dass die Zeit des Arbeitsbeginns und Arbeitsendes richtig erfasst wurde. Dies erkennen Sie anhand der Anzeige des Geräts, die Ihnen Ihre monatliche Arbeitszeit anzeigt.\n\nDie Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden. Die Personalabteilung richtet Ihnen einen Zugang zu unserem Arbeitskonten-System PersoTime ein. Damit können Sie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen.", "items": [{"n": 6, "type": "truefalse", "prompt": "Der Firmenausweis hat neben der Arbeitszeiterfassung auch andere Funktionen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Außerdem können Sie mit Ihrem Firmenausweis in der Kantine und am Getränkeautomaten bezahlen und das hauseigene Fitnessstudio benutzen.", "explain_ru": "«Richtig»: в тексте пропуску приписывают, помимо учёта рабочего времени, и другие функции (оплата в столовой и автоматах и доступ в спортзал предприятия). «Falsch» не выдерживает критики, потому что эти функции прямо перечислены в приведённом отрывке.", "explain": "«Richtig»: el texto atribuye al carné, además de registrar la jornada, otras funciones (pagar en la cantina y en las máquinas expendedoras y usar el gimnasio de la empresa). «Falsch» no se sostiene, porque esas funciones se enumeran expresamente en el pasaje citado.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Überstunden", "options": [{"key": "a", "text": "können online eingesehen werden."}, {"key": "b", "text": "sind in der Firma grundsätzlich nicht erlaubt."}, {"key": "c", "text": "werden von der Zeiterfassung nicht registriert."}], "answer": "a", "confidence": "hoch", "quote": "Die Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden. Die Personalabteilung richtet Ihnen einen Zugang zu unserem Arbeitskonten-System PersoTime ein. Damit können Sie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen.", "explain_ru": "Верно a: Zeiterfassung автоматически считает сверхурочные, а баланс рабочего времени, куда они попадают, можно в любой момент посмотреть в интранете, то есть онлайн. b неверно, потому что текст считает сверхурочные само собой разумеющимися (их подсчитывают и предусматривают компенсацию), а не запрещает их; c неверно, потому что учитывают их как раз Zeiterfassung и система PersoTime.", "explain": "Correcto a: la Zeiterfassung calcula automáticamente las horas extraordinarias y la cuenta horaria que las recoge se puede consultar en cualquier momento en la intranet, es decir, en línea. b es falso porque el texto da por hechas las horas extraordinarias (las calcula y prevé su compensación), no las prohíbe; c es falso porque son precisamente la Zeiterfassung y el sistema PersoTime quienes las registran.", "verified": true}]}, {"id": "t2_a-p19b", "note_ru": "Fassung «Новый вариант» пунктов 6 и 7 по тому же тексту с. 19 (в оригинале текст не повторяется): пункт 6 — переформулировка предыдущего, а пункт 7 теперь о личном учёте часов вместо сверхурочных. Там, где вопрос или вариант даны в двух формулировках через «/», сохранена последняя.", "label": "Text 1 – Variante 1 (Новый вариант)", "page": 19, "note": "Fassung «Новый вариант» de los ítems 6 y 7 sobre el mismo texto de la p. 19 (el original no repite el texto): el ítem 6 es una reformulación del anterior y el 7 plantea ahora la cuenta horaria personal en lugar de las horas extraordinarias. Donde el enunciado o una opción aparecían con dos formulaciones separadas por «/», se ha conservado la última.", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nZugangskontrolle und Zeiterfassung\n\nAls Mitarbeiterinnen und Mitarbeiter erhalten Sie zu Beginn Ihres Arbeitsverhältnisses einen Firmenausweis mit Chip-Karte. Dieser berechtigt zum Zugang in das Unternehmensgebäude und dient gleichzeitig zur Erfassung der Arbeitszeit. Außerdem können Sie mit Ihrem Firmenausweis in der Kantine und am Getränkeautomaten bezahlen und das hauseigene Fitnessstudio benutzen. Neben den Aufzügen im Erdgeschoss finden Sie ein digitales Zeiterfassungsgerät. Bitte halten Sie beim Betreten und Verlassen des Gebäudes Ihren Firmenausweis an die blau markierte Fläche und vergewissern Sie sich, dass die Zeit des Arbeitsbeginns und Arbeitsendes richtig erfasst wurde. Dies erkennen Sie anhand der Anzeige des Geräts, die Ihnen Ihre monatliche Arbeitszeit anzeigt.\n\nDie Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden. Die Personalabteilung richtet Ihnen einen Zugang zu unserem Arbeitskonten-System PersoTime ein. Damit können Sie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen.", "items": [{"n": 6, "type": "truefalse", "prompt": "Der Firmenausweis dient als firmeninternes Zahlungsmittel.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Außerdem können Sie mit Ihrem Firmenausweis in der Kantine und am Getränkeautomaten bezahlen und das hauseigene Fitnessstudio benutzen.", "explain_ru": "«Richtig»: пропуск служит для оплаты внутри предприятия — в столовой и в автоматах с напитками, которые находятся на его территории. «Falsch» исключается той же фразой, где пропуск описан как внутреннее платёжное средство.", "explain": "«Richtig»: el carné sirve para pagar dentro de la empresa, en la cantina y en las máquinas expendedoras de bebidas, que forman parte del recinto. «Falsch» queda descartado por esa misma frase, que describe el carné como medio de pago interno.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Das persönliche Arbeitszeitkonto", "options": [{"key": "a", "text": "ist nur über die Personalabteilung einsehbar. / kann in der Personalabteilung eingesehen werden."}, {"key": "b", "text": "müssen die Mitarbeiter selbst anlegen."}, {"key": "c", "text": "wird täglich aktualisiert."}], "answer": "c", "confidence": "mittel", "quote": "Bitte halten Sie beim Betreten und Verlassen des Gebäudes Ihren Firmenausweis an die blau markierte Fläche und vergewissern Sie sich, dass die Zeit des Arbeitsbeginns und Arbeitsendes richtig erfasst wurde.", "explain_ru": "Остаётся только c, методом исключения. a) утверждает, что баланс виден только через отдел кадров, и текст прямо это опровергает: «Die Personalabteilung richtet Ihnen einen Zugang … ein. Damit können Sie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen.» Доступ оформляет сам отдел кадров, но смотрите вы его самостоятельно в интранете, а не в окошке. b) неверно, потому что часы записывает не работник: «Die Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden.» c) не встречается в тексте дословно — отсюда средняя уверенность, — но отметка прихода и ухода ежедневная, а баланс считается автоматически, так что после исключения a и b это разумное прочтение.", "explain": "La c es la única que queda en pie, por eliminación. a) dice que la cuenta solo se ve a través de la oficina de personal, y el texto lo contradice de forma directa: «Die Personalabteilung richtet Ihnen einen Zugang … ein. Damit können Sie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen.» Es la propia oficina de personal la que le habilita el acceso, pero usted lo consulta por su cuenta en la intranet, no en ventanilla. b) es falsa porque las horas no las apunta el trabajador: «Die Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden.» c) no aparece literalmente en el texto —de ahí la confianza media—, pero el fichaje de entrada y salida es diario y el saldo se calcula de forma automática, así que es la lectura razonable una vez descartadas a y b."}]}, {"id": "t2_a-p20a", "note_ru": "На с. 20 раздел «Arbeitszeit» встречается дважды: эта первая версия (Gleitzeitsystem, Kernarbeitszeit 9.00–15.30) и помеченная «Новый вариант» (→ t2_a-p20b) с другим текстом и новыми пунктами.", "label": "Text 1 – Variante 2", "page": 20, "note": "La p. 20 trae el apartado «Arbeitszeit» dos veces: esta primera versión (Gleitzeitsystem, Kernarbeitszeit 9.00–15.30) y la marcada «Новый вариант» (→ t2_a-p20b), con otro texto y nuevos ítems.", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nArbeitszeit\n\nIn unserem Unternehmen arbeiten wir nach dem Gleitzeitsystem. Die Kernarbeitszeit ist Montag bis Freitag zwischen 9.00 Uhr und 15.30 Uhr. In dieser Zeit müssen alle Mitarbeitenden anwesend sein. Jede Abwesenheit während dieser Zeit muss genehmigt sein.\n\nDie tägliche Rahmenarbeitszeit ist von 6.00 Uhr bis 19.30 Uhr. Bitte beachten Sie, dass innerhalb dieses Zeitrahmens maximal acht, in Ausnahmefällen zehn, Stunden täglich gearbeitet werden darf.\n\nAlle Mitarbeitenden müssen beim Betreten und Verlassen des Gebäudes mit der Zeiterfassungskarte am Lesegerät ein- und ausstechen. So wird die tägliche Arbeitszeit auf dem Zeitkonto festgehalten. Dieses kann jederzeit am Lesegerät eingesehen werden.\n\nBei entsprechendem Guthaben kann einmal pro Monat ein ganzer Arbeitstag (acht Stunden) als Gleitzeittag genommen werden. Zu berücksichtigen ist, dass ein Minuskontostand im Folgemonat auszugleichen ist. Zusätzlich können im Monat Dezember bis zu vier Arbeitstage als Gleitzeittage genommen werden, um sie zwischen Weihnachten und Neujahr zu nutzen, wenn das Arbeitszeitkonto ein ausreichendes Guthaben aufweist.", "items": [{"n": 6, "type": "truefalse", "prompt": "Bei Gleitzeit können Mitarbeitende täglich beliebig viele Stunden arbeiten.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Bitte beachten Sie, dass innerhalb dieses Zeitrahmens maximal acht, in Ausnahmefällen zehn, Stunden täglich gearbeitet werden darf.", "explain_ru": "«Falsch»: текст ограничивает рабочий день максимум восемью часами в день, десятью только в исключительных случаях, в рамках с 6.00 до 19.30. «Richtig» было бы несостоятельно, потому что ни одна фраза не позволяет работать «beliebig viele Stunden».", "explain": "«Falsch»: el texto limita la jornada a un máximo de ocho horas diarias, diez solo en casos excepcionales, dentro del marco horario de 6.00 a 19.30. «Richtig» sería insostenible porque ninguna frase permite trabajar «beliebig viele Stunden».", "verified": true}, {"n": 7, "type": "choice", "prompt": "Durch Gleitzeit ist es den Mitarbeitenden möglich,", "options": [{"key": "a", "text": "ein Stundenguthaben aufzubauen."}, {"key": "b", "text": "jeden Monat einige Tage freizunehmen."}, {"key": "c", "text": "täglich mehr als acht Stunden zu arbeiten."}], "answer": "a", "confidence": "hoch", "quote": "Bei entsprechendem Guthaben kann einmal pro Monat ein ganzer Arbeitstag (acht Stunden) als Gleitzeittag genommen werden.", "explain_ru": "Верно a: система гибкого графика позволяет накапливать часы на счёте («Bei entsprechendem Guthaben», «ein Minuskontostand im Folgemonat auszugleichen»), то есть формировать запас часов. b неверно, потому что при достаточном балансе берут целый день в месяц (а в декабре до четырёх), а не «einige Tage» каждый месяц; c неверно, потому что максимум — восемь часов в день, десять только в исключительных случаях.", "explain": "Correcto a: el sistema de horario flexible permite acumular horas en la cuenta («Bei entsprechendem Guthaben», «ein Minuskontostand im Folgemonat auszugleichen»), es decir, formar un saldo de horas. b es falso porque con saldo suficiente se toma un día completo al mes (y hasta cuatro en diciembre), no «einige Tage» todos los meses; c es falso porque el máximo es de ocho horas diarias, diez solo en casos excepcionales.", "verified": true}]}, {"id": "t2_a-p20b", "note_ru": "Fassung «Новый вариант» (с. 20): раздел «Arbeitszeit» полностью переписан (40-часовая рабочая неделя, Kernzeit с 10 до 15 Uhr, Gleitzeiten 8–10 и 15–17) с новыми пунктами 6 и 7. В оригинале заголовок «Willkommensmappe» не повторяется.", "label": "Text 1 – Variante 2 (Новый вариант)", "page": 20, "note": "Fassung «Новый вариант» (p. 20): el apartado «Arbeitszeit» aparece reescrito por completo (jornada semanal de 40 horas, Kernzeit de 10 a 15 Uhr, Gleitzeiten 8–10 y 15–17) con nuevos ítems 6 y 7. El original no repite el título «Willkommensmappe».", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Arbeitszeit\n\nDie wöchentliche Arbeitszeit beträgt 40 Stunden - bei einem Arbeitstag von acht Stunden, wobei die Pausen nicht mitgerechnet werden. Es gilt die Fünf-Tage-Woche. Betriebsbedingt ist es möglich, dass Sie bis zu zehn Stunden pro Tag arbeiten. Diese Mehrarbeit ist aber nur in Ausnahmefällen erlaubt und muss innerhalb von sechs Monaten durch entsprechend kürzerer Arbeitstage ausgeglichen werden.\n\nWir haben flexible Arbeitszeiten. Sie können selbst bestimmen, wann Sie morgens anfangen zu arbeiten und wann Sie aufhören. Zwischen 10 und 15 Uhr, in der sogenannten Kernzeit, müssen Sie jedoch anwesend sein. Gleitzeiten sind zwischen 8 und 10 Uhr und 15 und 17 Uhr. Innerhalb dieser Zeiten können Sie anfangen bzw. aufhören zu arbeiten. Aus betrieblichen Gründen kann der Arbeitgeber die Gleitzeit für eine gewisse Zeit aussetzen.\n\nUnser elektronisches Zeiterfassungssystem registriert täglich die Zahl der von Ihnen geleisteten Arbeitsstunden auf Ihrem persönlichen Arbeitszeitkonto. Haben Sie in einer Woche mehr als 40 Stunden gearbeitet, sollten Ihre Überstunden bereits vor Monatsende durch weniger Arbeit abgebaut werden. Wenn ein Abbau nicht möglich ist, wird mit der Geschäftsführung eine rasche Lösung besprochen.", "items": [{"n": 6, "type": "truefalse", "prompt": "Die Beschäftigten dürfen mit der Arbeit anfangen, wann sie wollen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "mittel", "quote": "Zwischen 10 und 15 Uhr, in der sogenannten Kernzeit, müssen Sie jedoch anwesend sein. Gleitzeiten sind zwischen 8 und 10 Uhr und 15 und 17 Uhr.", "explain_ru": "«Falsch»: хотя текст говорит, что вы сами определяете, когда начинать, он тут же добавляет ограничение — делать это можно только внутри интервалов гибкого графика (8–10 и 15–17), а с 10 до 15 часов нужно быть на месте; предприятие может даже приостановить Gleitzeit. Первая фраза раздела («Sie können selbst bestimmen, wann Sie morgens anfangen») вводит в заблуждение, поэтому уверенность средняя, но решает пункт именно явное ограничение.", "explain": "«Falsch»: aunque el texto dice que uno mismo determina cuándo empieza, añade inmediatamente la restricción de que solo puede hacerlo dentro de las franjas de horario flexible (8-10 y 15-17) y que entre las 10 y las 15 horas hay que estar presente; la empresa puede incluso suspender la Gleitzeit. La primera frase de la sección («Sie können selbst bestimmen, wann Sie morgens anfangen») induce a error y por eso la confianza es media, pero la restricción explícita decide el ítem.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Ergibt sich auf einem Arbeitszeitkonto ein Plus,", "options": [{"key": "a", "text": "kann der Betrieb den Acht-Stunden-Tag verlängern oder verkürzen."}, {"key": "b", "text": "ist schnellstmöglich ein Ausgleich zu finden."}, {"key": "c", "text": "kann der Betrieb die Gleitzeitregelungen ändern."}], "answer": "b", "confidence": "hoch", "quote": "Haben Sie in einer Woche mehr als 40 Stunden gearbeitet, sollten Ihre Überstunden bereits vor Monatsende durch weniger Arbeit abgebaut werden. Wenn ein Abbau nicht möglich ist, wird mit der Geschäftsführung eine rasche Lösung besprochen.", "explain_ru": "Верно b: если накапливается положительный баланс (больше 40 часов в неделю), сверхурочные нужно компенсировать меньшей работой до конца месяца, а если это невозможно — быстро искать решение с руководством. a неверно, потому что текст не позволяет удлинять или укорачивать восьмичасовой день в зависимости от баланса; c тоже неверно, потому что предприятие может временно приостановить Gleitzeit по производственным причинам, но это не следствие положительного баланса.", "explain": "Correcto b: si se acumula un saldo positivo (más de 40 horas semanales), hay que compensar las horas extras con menos trabajo antes de fin de mes y, si no es posible, buscar rápidamente una solución con la dirección. a es falso porque el texto no permite alargar ni acortar el día de ocho horas en función del saldo; c también es falso porque la empresa puede suspender temporalmente la Gleitzeit por motivos operativos, pero eso no es consecuencia de un saldo positivo.", "verified": true}]}, {"id": "t2_a-p21a", "label": "Text 1 – Variante 3", "page": 21, "note": "", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nUrlaub\n\nJedem Mitarbeiter und jeder Mitarbeiterin in unserem Unternehmen stehen je nach Betriebszugehörigkeit bis zu 26 Tage Urlaub zu. Der Urlaub sollte nach Möglichkeit innerhalb des laufenden Kalenderjahres genommen werden. In Ausnahmefällen kann diese Frist bis zum 31.3. des Folgejahres verlängert werden.\n\nGrundsätzlich besteht der volle Urlaubsanspruch erst nach Ablauf der sechsmonatigen Probezeit. Ein anteiliger Urlaub ist jedoch nach Rücksprache auch bereits während dieser Zeit möglich.\n\nUrlaubsanträge für das folgende Kalenderjahr sind spätestens bis zum 15.11. mittels des dafür vorgesehenen Formulars beim Abteilungsleiter bzw. seiner Vertretung einzureichen. Den Urlaubswünschen der einzelnen Mitarbeiter wird entsprochen, sofern diese mit den Betriebsabläufen vereinbar sind. Sollten sich die beantragten Urlaubszeiten einzelner Kollegen und Kolleginnen überschneiden, wird nach sozialen Aspekten entschieden.\n\nDer Abteilungsleiter prüft alle Urlaubsanträge unverzüglich. Sollten die Wünsche der Mitarbeiter unvereinbar sein, wird der Betriebsrat mit dem Ziel der Einigung hinzugezogen.", "items": [{"n": 6, "type": "truefalse", "prompt": "Im ersten halben Jahr nach Neueinstellung ist kein Urlaub möglich.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Ein anteiliger Urlaub ist jedoch nach Rücksprache auch bereits während dieser Zeit möglich.", "explain_ru": "«Falsch»: полное право на отпуск действительно возникает только после шести месяцев испытательного срока, но текст прямо допускает частичный отпуск уже в этот период по согласованию. Поэтому утверждение, что никакой отпуск невозможен, неверно.", "explain": "«Falsch»: es cierto que el derecho completo a vacaciones solo nace tras los seis meses de prueba, pero el texto permite expresamente vacaciones parciales ya durante ese periodo previa consulta. Por eso la afirmación de que no es posible ningún tipo de vacaciones es incorrecta.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Urlaubsanträge müssen", "options": [{"key": "a", "text": "durch den Betriebsrat genehmigt werden."}, {"key": "b", "text": "in jedem Fall bewilligt werden."}, {"key": "c", "text": "rechtzeitig im Vorjahr gestellt werden."}], "answer": "c", "confidence": "hoch", "quote": "Urlaubsanträge für das folgende Kalenderjahr sind spätestens bis zum 15.11. mittels des dafür vorgesehenen Formulars beim Abteilungsleiter bzw. seiner Vertretung einzureichen.", "explain_ru": "Верно c: заявки на следующий год нужно подавать не позднее 15.11., то есть заранее и ещё в текущем году. a неверно, потому что Betriebsrat вмешивается только если пожелания сотрудников несовместимы между собой; b неверно, потому что отпуск дают только при совместимости с процессами предприятия («sofern diese mit den Betriebsabläufen vereinbar sind»).", "explain": "Correcto c: las solicitudes para el año siguiente deben presentarse a más tardar el 15.11., es decir, con antelación y todavía en el año anterior. a es falso porque el Betriebsrat solo interviene si los deseos de los empleados son incompatibles entre sí; b es falso porque solo se conceden si son compatibles con los procesos de la empresa («sofern diese mit den Betriebsabläufen vereinbar sind»).", "verified": true}]}, {"id": "t2_a-p21b", "label": "Text 1 – Variante 4", "page": 21, "note": "", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nRegelungen am Arbeitsplatz\n\nEs ist wichtig, dass auf dem Betriebsgelände der AKO.KG alle Maßnahmen eingehalten werden, damit Sie sich selbst und andere nicht gefährden. Bei der Bedienung der Maschinen sind die jeweiligen Sicherheitsbestimmungen zu befolgen, angepasst an die neuen Richtlinien laut Arbeitsschutzgesetz vom Januar dieses Jahres. Die Sicherheitsbestimmungen finden Sie in der Anlage zu dieser Willkommensmappe und zusammengefasst auch auf Informationsblättern an den Maschinen.\n\nSollten Sie hierzu Fragen haben, setzen Sie sich bitte mit unserer Sicherheitsbeauftragten Frau Scholz, Zimmer 122, Durchwahl - 308, in Verbindung. Dies ist auch die Kontaktstelle für alle Störungen, Unfälle, Brand oder bei für Sie unklaren Situationen. In diesen Fällen kontaktieren Sie bitte auch immer den Empfang, Durchwahl -100.\n\nNach Verlassen der Werkstätten sind diese immer ordnungsgemäß abzuschließen, damit sich kein Unbefugter den Anlagen und Maschinen nähern kann. Der Arbeitsplatz muss sauber gehalten werden, damit umherliegender Unrat nicht zu einer Gefahrenquelle werden kann. Achten Sie dabei bitte auch auf die vorgeschriebene Trennung der Abfälle in die hierfür vorgesehenen Container im Hof.\n\nAuf dem gesamten Betriebsgelände ist Filmen und Fotografieren sowie der Konsum von Alkohol und Zigarettenkonsum nicht gestattet.", "items": [{"n": 6, "type": "truefalse", "prompt": "Die Regelungen am Arbeitsplatz wurden aktualisiert.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Bei der Bedienung der Maschinen sind die jeweiligen Sicherheitsbestimmungen zu befolgen, angepasst an die neuen Richtlinien laut Arbeitsschutzgesetz vom Januar dieses Jahres.", "explain_ru": "«Richtig»: в тексте сказано, что правила безопасности приведены в соответствие («angepasst») с новыми директивами закона об охране труда от января этого года, значит правила на рабочем месте обновлены. «Falsch» противоречило бы этому «neuen Richtlinien … vom Januar dieses Jahres».", "explain": "«Richtig»: el texto dice que las normas de seguridad se han adaptado («angepasst») a las nuevas directrices de la ley de seguridad laboral de enero de este año, luego las reglas del puesto de trabajo están actualizadas. «Falsch» chocaría con ese «neuen Richtlinien … vom Januar dieses Jahres».", "verified": true}, {"n": 7, "type": "choice", "prompt": "Auf dem Firmengelände", "options": [{"key": "a", "text": "darf kein Abfall entsorgt werden."}, {"key": "b", "text": "ist bei Gefahr Frau Scholz zu informieren."}, {"key": "c", "text": "ist es nicht erlaubt, Nahrungsmittel zu sich zu nehmen."}], "answer": "b", "confidence": "hoch", "quote": "Sollten Sie hierzu Fragen haben, setzen Sie sich bitte mit unserer Sicherheitsbeauftragten Frau Scholz, Zimmer 122, Durchwahl - 308, in Verbindung. Dies ist auch die Kontaktstelle für alle Störungen, Unfälle, Brand oder bei für Sie unklaren Situationen.", "explain_ru": "Верно b: госпожа Scholz — контактное лицо по неисправностям, несчастным случаям, пожарам и неясным ситуациям, то есть при опасности нужно сообщать ей (а также на ресепшен). a неверно, потому что текст не запрещает отходы, а требует сортировать их в контейнеры во дворе; c неверно, потому что запрещены только съёмка, фотографирование, алкоголь и табак, но не еда.", "explain": "Correcto b: la Sra. Scholz es el punto de contacto para averías, accidentes, incendios y situaciones poco claras, es decir, hay que avisarla en caso de peligro (y también a recepción). a es falso porque el texto no prohíbe los residuos, sino que obliga a separarlos en los contenedores del patio; c es falso porque solo se prohíben filmar, fotografiar, el alcohol y el tabaco, no comer.", "verified": true}]}, {"id": "t2_b-p22", "note_ru": "На с. 22 вариант 5 с тем же текстом «Betriebssport» приведён дважды: во втором списке (с номерами тестов 150321/150301) текст не повторяется, только пункты 6 и 7, причём варианты 7 переставлены, а опечатка «Schreibtischen» уже исправлена. Сохранена именно эта вторая версия вариантов (тогда правильный ответ «b», а не «c»).", "label": "Text 1 – Variante 5", "page": 22, "note": "La página 22 reproduce dos veces la variante 5 con el mismo texto «Betriebssport»: la segunda lista (con los números de test 150321/150301) no repite el texto, solo los ítems 6 y 7, con las opciones del 7 reordenadas y con la errata «Schreibtischen» ya corregida. Se conserva esa segunda versión de las opciones (la respuesta correcta es entonces «b», no «c»).", "kind": "text", "intro": "Lesen Sie den Text. Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nBetriebssport\n\nSportliche Aktivitäten werden bei uns großgeschrieben. So bieten wir unseren Mitarbeitern im Untergeschoss einen Fitnessraum mit Bodenmatten und mehreren Fitnessgeräten, wie z. B. zwei Indoor-Fahrradtrainern. Dieser ist für alle ganztägig frei und ohne Gebühr zugänglich und kann selbstverständlich auch in den Pausen genutzt werden.\n\nAußerdem nehmen wir als Unternehmen jedes Jahr am städtischen Firmenlauf teil. Es hat sich die Tradition entwickelt, dass sich die teilnehmenden Kolleginnen und Kollegen gemeinsam in einem wöchentlichen Lauftreff auf dieses Event vorbereiten. Dieser findet jeden Mittwoch um 17:30 Uhr statt.\n\nAbwechslungsreich gestaltete Arbeitsplätze in den Büros tragen zur Steigerung der Aktivität auch während der Arbeit bei und wirken den negativen Auswirkungen langen Sitzens entgegen. Alle Schreibtische sind höhenverstellbar, sodass Arbeiten auch im Stehen möglich ist.\n\nZusätzlich bieten wir das sogenannte „Deskbike“ an – eine Art Büro-Fahrrad, das sich einfach unter einen höhenverstellbaren Schreibtisch rollen lässt. Damit möchten wir Ihnen die Möglichkeit bieten, Ihre Gesundheit zu stärken. Nicht zuletzt macht Bewegung auch einfach Spaß.", "items": [{"n": 6, "type": "truefalse", "prompt": "Der Fitnessraum ist während der Arbeitszeit geöffnet.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Dieser ist für alle ganztägig frei und ohne Gebühr zugänglich und kann selbstverständlich auch in den Pausen genutzt werden.", "explain_ru": "В тексте сказано, что Fitnessraum доступен «ganztägig» (весь день) и что им можно пользоваться «auch in den Pausen», то есть и в рабочее время; значит утверждение верно. Нигде не сказано, что он закрыт в рабочие часы, поэтому «Falsch» не выдерживает критики.", "explain": "El texto dice que el Fitnessraum está disponible «ganztägig» (todo el día) y que puede usarse «auch in den Pausen», es decir, también durante el tiempo de trabajo; por tanto la afirmación es correcta. No hay ninguna indicación de que esté cerrado en horario laboral, así que «Falsch» no se sostiene.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Die Mitarbeiter", "options": [{"key": "a", "text": "haben teilweise spezielle Schreibtische in Stehhöhe."}, {"key": "b", "text": "können das hausinterne Fitnessstudio gratis nutzen."}, {"key": "c", "text": "erhalten einen Zuschuss für ein Deskbike."}], "answer": "b", "confidence": "hoch", "quote": "Dieser ist für alle ganztägig frei und ohne Gebühr zugänglich", "explain_ru": "Вариант b верен, потому что в тексте сказано: внутренний Fitnessraum «ist für alle ganztägig frei und ohne Gebühr zugänglich», то есть пользоваться им можно бесплатно. a неверно: это не особые столы для избранных, а «Alle Schreibtische sind höhenverstellbar». c тоже неверно: Deskbike предлагают («Zusätzlich bieten wir das sogenannte „Deskbike“ an»), но нигде не говорится о дотации на его покупку.", "explain": "La opción b es correcta porque el texto afirma que el Fitnessraum interno «ist für alle ganztägig frei und ohne Gebühr zugänglich», es decir, se puede usar gratis. La a es falsa: no son mesas especiales solo para algunos, sino que «Alle Schreibtische sind höhenverstellbar». La c también es falsa: el Deskbike se ofrece («Zusätzlich bieten wir das sogenannte „Deskbike“ an»), pero en ningún momento se menciona un Zuschuss (subvención) para comprarlo.", "verified": true}]}, {"id": "t2_b-p23", "note_ru": "Пункт 6 встречается дважды: первая формулировка (обязанность посещать несколько раз в год) и помеченная «Новый вариант» (запись в Personal). Это явно разные вопросы с противоположными ответами, поэтому сохранены оба как два пункта с n=6. Из пункта 7 сохранена только действующая версия с пометкой «Новый вариант от 21.12.24»: предыдущая версия ставит тот же вопрос (что показывают новым сотрудникам) с тем же правильным ответом (система безопасности), то есть это переформулировка, а не отдельный пункт. Оба пункта с n=6 показываются как 6a и 6b и оцениваются отдельно.", "label": "Text 1 – Variante 6", "page": 23, "note": "El ítem 6 aparece dos veces: la primera formulación (obligación de asistir varias veces al año) y la marcada «Новый вариант» (inscripción en Personal). Son preguntas claramente distintas y con respuesta opuesta, por eso se conservan las dos como dos ítems con n=6. Del ítem 7 solo se conserva la versión vigente marcada «Новый вариант от 21.12.24»: la versión anterior plantea la misma cuestión (qué se les presenta a los nuevos empleados) con la misma respuesta correcta (el sistema de seguridad), así que es una reformulación, no un ítem distinto. Los dos ítems con n=6 se muestran como 6a y 6b y se puntúan por separado.", "kind": "text", "intro": "Lesen Sie den Text. Entscheiden Sie bei den Aufgaben 6, ob die Aussagen richtig oder falsch sind, und wählen Sie bei Aufgabe 7 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nEinführungstag\n\nUnsere Personalreferentin führt mehrmals jährlich einen Einführungstag für unsere neuen Mitarbeiterinnen und Mitarbeiter durch, an dem diese mit unterschiedlichen Arbeitsbereichen sowie den rechtlichen und organisatorischen Prozessen vertraut gemacht werden. Wir möchten darauf hinweisen, dass die Teilnahme an einer solchen Informationsveranstaltung verpflichtend ist. Am Einführungstag besteht außerdem die Möglichkeit, Kolleginnen und Kollegen aus anderen Abteilungen kennenzulernen. Die Abteilungsleiter werden bei dieser Gelegenheit in kurzen Worten einen Einblick in den Tätigkeitsbereich ihrer Teams geben.\n\nDa unser Unternehmen in einem hochsensiblen Bereich arbeitet, haben wir für unser gesamtes Gebäude ein komplexes Sicherheitssystem. Auch dieses stellen wir Ihnen im Rahmen des Orientierungstages im Detail vor. Weitere Einzelheiten zu diesem Tag, wie den Treffpunkt und den Ablauf, finden Sie in dieser Mappe. Eine gesonderte Anmeldung ist nicht erforderlich.\n\nFür Rückfragen zum Einführungstag steht die Personalabteilung gerne zur Verfügung.", "items": [{"n": 6, "type": "truefalse", "prompt": "Neue Mitarbeiter sollten sich in der Personalabteilung zum Einführungstag anmelden.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Eine gesonderte Anmeldung ist nicht erforderlich.", "explain_ru": "Текст говорит это прямо: «Eine gesonderte Anmeldung ist nicht erforderlich», значит для Einführungstag записываться не нужно, и утверждение неверно. Единственное упоминание отдела кадров в связи с этим днём — «Für Rückfragen zum Einführungstag steht die Personalabteilung gerne zur Verfügung», то есть только для вопросов.", "explain": "El texto lo dice de forma explícita: «Eine gesonderte Anmeldung ist nicht erforderlich», así que no hay que inscribirse para el Einführungstag y la afirmación es falsa. La única mención a la Personalabteilung en relación con ese día es «Für Rückfragen zum Einführungstag steht die Personalabteilung gerne zur Verfügung», es decir, solo para consultas.", "verified": true}, {"n": 6, "type": "truefalse", "prompt": "Alle Mitarbeiter (Mitarbeitende) müssen ein paar Mal pro Jahr am Einführungstag (einer Informationsveranstaltung) teilnehmen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "mittel", "quote": "Wir möchten darauf hinweisen, dass die Teilnahme an einer solchen Informationsveranstaltung verpflichtend ist.", "explain_ru": "Утверждение соединяет две информации из текста: Einführungstag проводится «mehrmals jährlich», а участие обязательно («die Teilnahme … ist verpflichtend»), поэтому утверждение подходит и ответ «Richtig». Средняя уверенность: в тексте речь о «neuen Mitarbeiterinnen und Mitarbeiter», а в утверждении — «Alle Mitarbeiter», и «ein paar Mal pro Jahr» скорее описывает частоту мероприятия, чем повторяющуюся личную обязанность. «Falsch» было бы оправдано только при буквальном прочтении.", "explain": "El enunciado combina las dos informaciones del texto: el Einführungstag se celebra «mehrmals jährlich» y la asistencia es obligatoria («die Teilnahme … ist verpflichtend»), de modo que la afirmación encaja y la respuesta es «Richtig». Confianza media porque el texto habla de los «neuen Mitarbeiterinnen und Mitarbeiter» mientras el enunciado dice «Alle Mitarbeiter», y porque «ein paar Mal pro Jahr» describe más bien la frecuencia del evento que una obligación individual repetida. «Falsch» solo sería defendible forzando esa lectura literal.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Die neuen Mitarbeiter", "options": [{"key": "a", "text": "bekommen vom Abteilungsleiter eine Führung durch das Unternehmen."}, {"key": "b", "text": "können an einem Einführungstag im Betrieb teilnehmen."}, {"key": "c", "text": "werden mit den Funktionen des Sicherheitssystems vertraut gemacht."}], "answer": "c", "confidence": "hoch", "quote": "Auch dieses stellen wir Ihnen im Rahmen des Orientierungstages im Detail vor.", "explain_ru": "Верно c: в тексте сказано, что в день ориентации подробно представляют систему безопасности здания, то есть знакомят новых сотрудников с её работой. a не выдерживает: о руководителях отделов сказано лишь «werden … in kurzen Worten einen Einblick in den Tätigkeitsbereich ihrer Teams geben», а не что они проводят экскурсию по предприятию. b — ловушка: участие представлено как добровольное («können»), тогда как в тексте оно обязательно («die Teilnahme … ist verpflichtend»).", "explain": "La c es la correcta: el texto anuncia que el sistema de seguridad del edificio se presenta en detalle durante el día de orientación, lo que equivale a familiarizar a los nuevos empleados con su funcionamiento. La a no se sostiene: de los jefes de departamento solo se dice que «werden … in kurzen Worten einen Einblick in den Tätigkeitsbereich ihrer Teams geben», no que hagan una visita guiada por la empresa. La b es un distractor: presenta la asistencia como algo voluntario («können»), cuando el texto dice que es obligatoria («die Teilnahme … ist verpflichtend»).", "verified": true}]}, {"id": "t2_b-p24a", "label": "Text 1 – Variante 7", "page": 24, "note": "", "kind": "text", "intro": "Lesen Sie den Text. Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nEssen in der Kantine\n\nUnser Unternehmen arbeitet an sieben Tagen rund um die Uhr im Drei-Schicht-System. Deshalb steht auch unsere Kantine, die für die Mitarbeiterverpflegung sorgt, täglich 24 Stunden zur Verfügung. Um unnötige Wartezeiten in der Mittagszeit zu vermeiden, wurden in Abstimmung mit dem Betriebsrat aber folgende Essenszeiten für die einzelnen Abteilungen festgelegt: Während das Personal aus der Produktion und dem Lager in der ersten Gruppe von 12.00 bis 13.00 Uhr eine warme Mahlzeit zu sich nehmen kann, folgen die Mitarbeiterinnen und Mitarbeiter der Verwaltung in der zweiten Gruppe von 13.00 bis 14.00 Uhr.\n\nAußerdem können die Mitarbeitenden jederzeit frisch zubereitete Snacks oder kleine Mahlzeiten wie Suppen oder Nudelgerichte aus den in der Kantine aufgestellten Automaten entnehmen. Darüber hinaus befindet sich dort eine Mikrowelle, in der Sie mitgebrachte Speisen erwärmen können. Zusätzliche Automaten für kalte und warme Getränke befinden sich auf jeder Etage in unserem Firmengebäude.", "items": [{"n": 6, "type": "truefalse", "prompt": "Die Kantine ist immer geöffnet.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Deshalb steht auch unsere Kantine, die für die Mitarbeiterverpflegung sorgt, täglich 24 Stunden zur Verfügung.", "explain_ru": "В тексте сказано, что столовая доступна «täglich 24 Stunden», то есть круглосуточно каждый день, потому что предприятие работает «an sieben Tagen rund um die Uhr im Drei-Schicht-System». Поэтому утверждение верно, а «Falsch» было бы ошибкой.", "explain": "El texto dice que la cantina está a disposición «täglich 24 Stunden», es decir, las 24 horas de todos los días, porque la empresa trabaja «an sieben Tagen rund um die Uhr im Drei-Schicht-System». Por eso la afirmación es correcta y «Falsch» sería erróneo.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Die Mitarbeiterinnen und Mitarbeiter", "options": [{"key": "a", "text": "bekommen in der Kantine keine Getränke."}, {"key": "b", "text": "können nachts in der Kantine essen."}, {"key": "c", "text": "müssen mittags oft sehr lange anstehen."}], "answer": "b", "confidence": "hoch", "quote": "Außerdem können die Mitarbeitenden jederzeit frisch zubereitete Snacks oder kleine Mahlzeiten wie Suppen oder Nudelgerichte aus den in der Kantine aufgestellten Automaten entnehmen.", "explain_ru": "Верно b: столовая открыта 24 часа в сутки, и сотрудники могут «jederzeit» (в любой момент) взять снеки или небольшие блюда из автоматов, установленных в столовой, в том числе ночью. a неверно: в тексте упомянуты «Zusätzliche Automaten für kalte und warme Getränke» в здании, но нигде не сказано, что в столовой нет напитков. c неверно, потому что интервалы по группам ввели именно «Um unnötige Wartezeiten in der Mittagszeit zu vermeiden», то есть чтобы избежать долгого ожидания.", "explain": "La b es correcta: la cantina está abierta 24 horas al día y los empleados pueden coger «jederzeit» (en cualquier momento) snacks o platos pequeños de las máquinas instaladas en la cantina, también de noche. La a es falsa: el texto menciona «Zusätzliche Automaten für kalte und warme Getränke» en el edificio, de modo que en ningún momento se afirma que en la cantina no haya bebidas. La c es falsa porque las franjas por grupos se fijaron precisamente «Um unnötige Wartezeiten in der Mittagszeit zu vermeiden», es decir, para evitar esperas largas.", "verified": true}]}, {"id": "t2_b-p24b", "label": "Text 1 – Variante 8", "page": 24, "note": "", "kind": "text", "intro": "Lesen Sie den Text. Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nFirmenorganigramm\n\nFür Sie als neue Mitarbeiterin / neuer Mitarbeiter in unserem Traditionsunternehmen ist es wichtig zu wissen, wie das Unternehmen aufgebaut ist, d. h. welche Abteilungen es gibt, wer wofür verantwortlich ist und an wen Sie sich mit Ihren Fragen wenden können. Dafür wollen wir Ihnen im Folgenden Orientierung geben und hoffen, Ihnen den Einstieg in unser Unternehmen mit diesem Organigramm zu erleichtern.\n\nDas Dach unseres Unternehmens bildet die Geschäftsleitung. Hier laufen alle Fäden zusammen. Die nächste Ebene umfasst unsere Bereiche Produktion, Vertrieb und Personalwesen. In der Personalabteilung wenden Sie sich an Ihrem ersten Arbeitstag an Frau Müller. Von ihr erhalten Sie Ihren Mitarbeiterausweis, die für Sie notwendigen Schlüssel und die Arbeitskleidung. Für Urlaubsangelegenheiten steht Ihnen Herr Scholz zur Verfügung. Gehaltsfragen können Sie mit Herrn Kleinschmidt besprechen. Sollten Sie eine Dienstreise unternommen haben, rechnen Sie die entstandenen Kosten mit Herrn Friedrich ab.", "items": [{"n": 6, "type": "truefalse", "prompt": "Den neuen Mitarbeitenden wird die Organisationsstruktur des Unternehmens vorgestellt.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Für Sie als neue Mitarbeiterin / neuer Mitarbeiter in unserem Traditionsunternehmen ist es wichtig zu wissen, wie das Unternehmen aufgebaut ist, d. h. welche Abteilungen es gibt, wer wofür verantwortlich ist und an wen Sie sich mit Ihren Fragen wenden können.", "explain_ru": "Текст адресован именно новым сотрудникам и объясняет структуру предприятия (какие есть отделы, кто за что отвечает, к кому обращаться) как раз с помощью этой схемы («Dafür wollen wir Ihnen im Folgenden Orientierung geben»). Утверждение совпадает, значит «Richtig»; ничего в тексте ему не противоречит.", "explain": "El texto se dirige expresamente a los nuevos empleados y les explica la estructura de la empresa (qué departamentos hay, quién es responsable de qué, a quién dirigirse) precisamente mediante este organigrama («Dafür wollen wir Ihnen im Folgenden Orientierung geben»). La afirmación coincide, así que es «Richtig»; nada en el texto la contradice.", "verified": true}, {"n": 7, "type": "choice", "prompt": "In der Personalabteilung", "options": [{"key": "a", "text": "bekommen die Mitarbeitenden ihre Ausstattung."}, {"key": "b", "text": "bezahlt man die Arbeitskleidung."}, {"key": "c", "text": "bucht man Dienstreisen."}], "answer": "a", "confidence": "hoch", "quote": "Von ihr erhalten Sie Ihren Mitarbeiterausweis, die für Sie notwendigen Schlüssel und die Arbeitskleidung.", "explain_ru": "Верно a: в отделе кадров госпожа Müller выдаёт пропуск сотрудника, необходимые ключи и рабочую одежду, то есть оснащение («Ausstattung») работника. b неверно: рабочую одежду «erhalten» (получают), а не покупают, и ни о какой оплате не говорится. c тоже неверно: Dienstreisen упомянуты только для расчёта расходов с господином Friedrich («rechnen Sie die entstandenen Kosten mit Herrn Friedrich ab»), а не для бронирования.", "explain": "La a es correcta: en la Personalabteilung, la Sra. Müller entrega el carné de empleado, las llaves necesarias y la ropa de trabajo, es decir, el equipamiento («Ausstattung») del empleado. La b es falsa: la ropa de trabajo se «erhalten» (se recibe), no se paga, y no se menciona ningún pago. La c también es falsa: las Dienstreisen solo aparecen para liquidar los gastos con el Sr. Friedrich («rechnen Sie die entstandenen Kosten mit Herrn Friedrich ab»), no para reservarlas.", "verified": true}]}, {"id": "t2_c-p25a", "note_ru": "Тот же текст Willkommensmappe (Arbeitsunfälle); это старая версия пунктов 8 и 9, до 08.2024.", "label": "Text 2 – Variante 1 (alte Antwortversion bis 08.2024)", "page": 25, "note": "Mismo texto de la Willkommensmappe (Arbeitsunfälle); esta es la versión antigua de los ítems 8 y 9, anterior a 08.2024.", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nArbeitsunfälle\nArbeitsunfälle sind Unfälle, die Beschäftigte bei der Ausübung ihrer Arbeit oder einer Dienstreise erleiden. Es muss also ein ursächlicher Zusammenhang mit der beruflichen Tätigkeit bestehen. Nach einem Arbeitsunfall müssen Beschäftigte ihren Arbeitgeber umgehend über den Unfall in Kenntnis setzen und sich ggf. in Behandlung begeben. Außerdem ist, sobald es der Gesundheitszustand des Geschädigten zulässt, ein detaillierter Unfallbericht zu verfassen und der Personalabteilung vorzulegen.\n\nIm Falle einer Arbeitsunfähigkeit nach einem Arbeitsunfall erhalten Arbeitnehmende für sechs Wochen eine Lohnfortzahlung vom Arbeitgeber, danach übernimmt die Berufsgenossenschaft (BG), zahlt u. a. Verletztengeld in Höhe von 80 Prozent des Bruttogehalts und kommt ggf. auch für weitere Kosten auf.\n\nZu Arbeitsunfällen
