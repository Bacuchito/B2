page": 66, "source_variant": 1, "scenario": "Die Huber GmbH hat einen Vertrag über täglich 3 Stunden Büroreinigung (6:00 bis 9:00 Uhr). Herr Lassner beschwert sich, dass die Reinigungskräfte in den letzten zwei Wochen mehrfach vor 9:00 Uhr nicht mehr da waren. Er verlangt eine Anpassung der Rechnung.", "source_letter": "Sehr geehrte Frau Woller,\n\nleider muss ich mich heute mit einer Beschwerde an Sie wenden. Wir haben einen Vertrag mit Ihrer Firma für die Reinigung unserer Büroräume. In diesem Vertrag sind täglich 3 Stunden Arbeit bei uns festgelegt, und zwar von 6.00 Uhr bis 9.00 Uhr morgens.\n\nIn den letzten zwei Wochen war unsere Sekretärin einige Male bereits vor 9 Uhr im Büro, von Ihrem Putzdienst war aber niemand zu sehen. Wie kann das sein?\n\nWenn wir 3 Stunden bezahlen, erwarten wir auch, dass Ihr Personal drei Stunden bei uns arbeitet. Wenn Sie für die Reinigung unserer Räume weniger als die vereinbarte Zeit benötigen, sollten Sie uns darüber informieren, damit wir den Vertrag ändern.\n\nIch bitte um umgehende Stellungnahme und natürlich die Angleichung der Rechnung an die tatsächlich geleisteten Arbeitsstunden.\n\nMit freundlichen Grüßen\nTheo Lassner", "boss_instructions": "Hallo Friederike, ich verstehe den Ärger von Herrn Lassner. Bitte kläre mit unseren Leuten, was da los ist, und antworte Herrn Lassner. Sage ihm zu, dass so etwas nie wieder vorkommt, und gib ihm 20 % Rabatt auf die nächste Rechnung. Wir dürfen den Kunden keinesfalls verlieren! Gruß Heike", "prompt": "Sie sind Mitarbeiter(in) bei der Reinigungsfirma. Ihr(e) Vorgesetzte(r) hat Sie gebeten, dem Kunden zu antworten. Schreiben Sie eine E-Mail an Herrn Lassner. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Bezugnahme auf die Beschwerde und Dank für den Hinweis", "Förmliche Entschuldigung und Erklärung der Ursache des Problems", "Zusicherung, dass die vertragliche Arbeitszeit künftig strikt eingehalten wird", "Angebot eines 20 %-igen Rabatts auf die nächste Monatsrechnung als Wiedergutmachung"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p67", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 2: Lieferverzögerung Tischlampen", "topic": "Lieferverzögerung Büromöbel", "page": 67, "source_variant": 2, "scenario": "Frau Berger hat 25 Tischlampen für neu renovierte Büros bestellt. Die Lieferung wurde für diese Woche zugesagt, ist aber am Freitagnachmittag noch nicht eingetroffen. Am Montag soll der Betrieb starten. Wenn die Lampen bis Montagmittag nicht da sind, wird sie stornieren.", "source_letter": "Sehr geehrter Herr Richter,\n\nvergangene Woche habe ich bei Ihnen 25 Tischlampen Modell TS 13 150 07 für unsere neuen Büroräume bestellt. Mir wurde telefonisch zugesagt, dass die Lampen noch diese Woche geliefert werden, aber jetzt ist schon Freitagnachmittag und sie sind leider noch immer nicht eingetroffen.\n\nDas ist ärgerlich, da wir am Wochenende unsere Renovierungsarbeiten beenden und die Büros dann vollständig neu einrichten werden. Dazu würden natürlich auch die Lampen gehören, da wir am Montag unseren Bürobetrieb in funktionstüchtigen Räumen wieder aufnehmen wollen. Ich habe bereits mehrfach versucht, Sie telefonisch zu erreichen, und habe Nachrichten auf Ihrem Anrufbeantworter hinterlassen, aber ich wurde leider nicht zurückgerufen.\n\nWenn Ihre Lampen also bis Montagmittag, 13:00 Uhr, nicht bei uns eingetroffen sind, werde ich die Bestellung bei Ihnen stornieren. Ich bitte um eine schnelle Antwort!\n\nMit freundlichen Grüßen\nEvelyn Berger", "boss_instructions": "Bitte antworten Sie Frau Berger sofort. Entschuldigen Sie sich für die Verzögerung beim Zulieferer. Versichern Sie ihr, dass die Lampen per Expresskurier am Montagmorgen vor 10:00 Uhr eintreffen und wir die Expresskosten sowie einen Preisnachlass übernehmen.", "prompt": "Schreiben Sie eine E-Mail an Frau Berger. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Bezug auf die Bestellung und Entschuldigung für die Nicht-Erreichbarkeit", "Erklärung der Ursache des Lieferverzugs beim Hersteller", "Verbindliche Zusage der Expresslieferung am Montag vor 10:00 Uhr", "Angebot einer kostenlosen Montage und eines Preisnachlasses als Ausgleich"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p68", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 3: Lieferverzögerung Tischlampen – Fassung 2", "topic": "Lieferverzögerung Büromöbel", "page": 68, "source_variant": 2, "scenario": "Frau Lutz hat 15 Tischlampen (Modell TS 13 150 07) für ihre neuen Büroräume bestellt und bis Freitagnachmittag nicht erhalten. Sie hat eine Frist bis Montagmittag, 12:00 Uhr, gesetzt, droht mit Stornierung und hat bereits einen Ersatzlieferanten gefunden.", "source_letter": "Sehr geehrter Herr Phillips,\n\nvergangene Woche habe ich bei Ihnen 15 Tischlampen Modell TS 13 150 07 für unsere neuen Büroräume bestellt. Mir wurde telefonisch zugesagt, dass die Lampen noch diese Woche geliefert werden, aber jetzt ist schon Freitagnachmittag und sie sind leider noch immer nicht eingetroffen.\n\nDas ist sehr ärgerlich, da wir am Wochenende unsere Renovierungsarbeiten beenden und die Büros dann vollständig neu einrichten werden. Dazu würden natürlich auch die Lampen gehören, da wir am Montag unseren Bürobetrieb in funktionstüchtigen Räumen wieder aufnehmen wollen.\n\nIch habe bereits mehrfach versucht, Sie telefonisch zu erreichen, und habe Nachrichten auf Ihrem Anrufbeantworter hinterlassen, aber ich wurde leider nicht zurückgerufen. Inzwischen habe ich einen Lieferanten gefunden, der uns kurzfristig andere Tischlampen liefern könnte.\n\nWenn Ihre Lampen also bis Montagmittag, 12:00 Uhr, nicht bei uns eingetroffen sind, werde ich die Bestellung bei Ihnen stornieren. Ich bitte um eine schnelle Antwort!\n\nMit freundlichen Grüßen\nBetta Lutz", "boss_instructions": "Hallo, ich habe schon wieder eine Beschwerde einer Kundin vorliegen. Sie hat ihre bestellten Tischlampen nicht bekommen. Bitte antworten Sie Frau Lutz und erklären Sie ihr, warum wir im Moment Lieferschwierigkeiten haben. Versuchen Sie auch, sie davon zu überzeugen, noch bis nächste Woche zu warten und den Auftrag nicht zu stornieren. Bieten Sie ihr außerdem ein ähnliches Modell an, das wir auf Lager haben. Danke!", "prompt": "Schreiben Sie eine E-Mail an Frau Lutz. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Dank für die Nachricht und Verständnis für den Ärger über die Verzögerung", "Erklärung der aktuellen Lieferschwierigkeiten und Entschuldigung dafür", "Bitte, den Auftrag nicht zu stornieren und noch bis nächste Woche zu warten", "Angebot eines ähnlichen Lampenmodells, das sofort auf Lager ist"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p69", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 4: Website-Entwurf – Farben und vertauschte Namen", "topic": "Webdesign-Agentur und Korrekturwünsche", "page": 69, "source_variant": 3, "scenario": "Der Kunde Franz Stiller beanstandet den Entwurf für seine neue Firmenwebsite: Das Farbschema entspricht nicht der Absprache und auf der Seite mit den Ansprechpartnern sind Namen vertauscht. Intern sind die vertauschten Namen unser Fehler, weitere Korrekturen soll der Kunde aber bezahlen.", "source_letter": "Sehr geehrte Frau Spindler,\n\nvielen Dank für Ihren Entwurf für unsere neue Firmenwebsite. Ich habe ihn gemeinsam mit dem Team gesichtet und dabei ist uns aufgefallen, dass Ihre Agentur die Vorgaben an zwei Stellen leider nicht umgesetzt hat:\n\nZum einen hatten wir besprochen, dass das Farbschema grau orange sein sollte. Da statt Grau Blau gewählt wurde, glaube ich, dass es zu einem Missverständnis gekommen ist. Zum anderen sind auf der Seite mit den Ansprechpartnern die Namen einiger Mitarbeiter vertauscht worden. Im Anhang schicke ich Ihnen noch einmal eine Auflistung der Namen mit den dazugehörigen Bildern. Könnten Sie diese beiden Punkte bitte bis Anfang nächster Woche nachbessern? Eine kurze Rückmeldung wäre nett.\n\nMit freundlichen Grüßen\nFranz Stiller", "boss_instructions": "Hallo Frau Holsten, ich habe heute Mittag die untenstehende Mail bekommen. Die vertauschten Namen sind unser Fehler und die verbessern wir auch; bitte bestätigen Sie dem Kunden das. Aber mehr ist nun wirklich nicht drin: Das ist schon das fünfte Mal, dass er Korrekturwünsche hat, obwohl wir uns immer an die Vorgaben gehalten haben. So viele Korrekturen waren nicht vereinbart! Wenn wir das noch machen sollen, geht das nur gegen zusätzliche Bezahlung. Ich rechne mit 200 € extra. Bitte teilen Sie ihm dies mit und lassen Sie sich von ihm sein Okay geben.", "prompt": "Schreiben Sie eine E-Mail an Herrn Stiller. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Dank für die Rückmeldung und Zusage, die vertauschten Namen zu korrigieren", "Höfliche Klärung des Farbproblems: Wir haben uns an die vereinbarten Vorgaben gehalten", "Hinweis auf die fünfte Korrekturrunde und auf den bereits überschrittenen Leistungsumfang", "Nennung des zusätzlichen Honorars von 200 € und Bitte um das Okay des Kunden"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p70", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 5: Defekte Spülmaschine und Wasserschaden", "topic": "Gerätedefekt und Folgeschaden", "page": 70, "source_variant": 4, "scenario": "Herr Krüger kaufte eine Spülmaschine für die Teeküche. Beim ersten Spülgang lief Wasser aus und beschädigte das Parkett. In zwei Tagen findet ein wichtiges Meeting statt. Er verlangt sofortige Reparatur und Kostenübernahme für den Parkettaustausch.", "source_letter": "Sehr geehrte Frau Sturm,\n\nvor einer Woche haben wir bei Ihnen eine Spülmaschine für unsere Teeküche gekauft. Sie wurde sehr schnell geliefert und auch gleich eingebaut. Leider muss ich Ihnen heute aber mitteilen, dass sie bereits defekt ist. Beim Spülen ist Wasser ausgelaufen und nun ist unser Parkett beschädigt.\n\nIch bitte Sie, uns umgehend einen Techniker zu schicken, der das Gerät repariert. Wir brauchen die Spülmaschine spätestens übermorgen, da wir ein großes Meeting unserer Außendienstmitarbeiter haben und viele Personen bewirten müssen.\n\nAußerdem müssen wir einen Teil des Parketts austauschen. Die Kosten dafür werden wir Ihnen in Rechnung stellen.\n\nBitte schicken Sie mir so schnell wie möglich einen Terminvorschlag für die Reparatur und eine Bestätigung der Kostenübernahme. Vielen Dank!\n\nMit freundlichen Grüßen\nClaudio Krüger", "boss_instructions": "Hallo Frau Retterstein, organisieren Sie bitte sofort einen Techniker für Herrn Krüger. Entschuldigen Sie sich für die Unannehmlichkeiten und sagen Sie zu, dass wir die Reparatur und die Forderungen prüfen. Weisen Sie aber vorsorglich darauf hin, dass die Reparatur eventuell Ersatzteile erfordert. Danke!", "prompt": "Schreiben Sie eine E-Mail an Herrn Krüger. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Bezugnahme auf die E-Mail von Herrn Krüger und Bedauern über den Wasserschaden", "Förmliche Entschuldigung für die Unannehmlichkeiten mit dem Neugerät", "Terminvereinbarung für den Technikerbesuch am Folgetag zur Fehlerbehebung", "Zusage zur unbürokratischen Prüfung der Kostenübernahme für das Parkett"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p71", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 6: Probleme beim Firmenumzug", "topic": "Umzugsdienstleistung und Transportschäden", "page": 71, "source_variant": 5, "scenario": "Beim Büroumzug von Hanau nach Frankfurt kamen die Möbelpacker 30 Minuten zu spät und nur zu dritt statt zu viert. Die Möbel sind noch nicht fertig aufgebaut, Glasplatten sind zerbrochen und Schränke verkratzt. Herr Zaun fordert Nachbesserung am Mittwoch und Schadensersatz.", "source_letter": "Sehr geehrte Frau Börne,\n\nam Wochenende ist unser Büro mit Hilfe Ihres Unternehmens von Hanau nach Frankfurt umgezogen. Leider waren wir mit Ihrem Service überhaupt nicht zufrieden.\n\nIhre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert. Deshalb dauerte der ganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen: Es sind noch nicht alle Möbel aufgebaut, deshalb konnten wir noch nicht unsere Sachen einräumen.\n\nBitte schicken Sie uns deshalb am Mittwochmorgen noch zwei Personen, die den Möbelaufbau erledigen. Des Weiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt.\n\nMit freundlichen Grüßen\nThomas Zaun", "boss_instructions": "Hallo Frau Kühne, da ist wohl was schiefgegangen. Bitte schreiben Sie Herrn Zaun und erklären Sie die Fehler. Sagen Sie zu, dass am Mittwochmorgen pünktlich zwei Monteure kommen und alles fertig aufbauen. Natürlich übernehmen wir die Verantwortung für die Schäden. Die Firma hat das erste Mal bei uns gebucht!", "prompt": "Schreiben Sie eine E-Mail an Herrn Zaun. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Bezug auf den Umzug und aufrichtige Entschuldigung für die Verzögerung", "Erklärung der Ursachen (plötzlicher Personalausfall und Verkehrsbehinderung)", "Bestätigung des Termins am Mittwochmorgen mit zwei erfahrenen Monteuren", "Zusage der Schadensregulierung über die Betriebshaftpflichtversicherung"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p71b", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 7: Firmenumzug – Fassung 2 (Herr Lozano)", "topic": "Umzugsdienstleistung und Transportschäden", "page": 71, "source_variant": 5, "scenario": "Beim Büroumzug von Hanau nach Frankfurt kamen die Möbelpacker 30 Minuten zu spät und nur zu dritt statt zu viert. Die Möbel sind noch nicht fertig aufgebaut, Glasplatten sind zerbrochen und Schränke verkratzt. Herr Lozano fordert Nachbesserung am Mittwoch und Schadensersatz.", "source_letter": "Sehr geehrte Frau Prince,\n\nam Wochenende ist unser Büro mit Hilfe Ihres Unternehmens von Hanau nach Frankfurt umgezogen. Leider waren wir mit Ihrem Service überhaupt nicht zufrieden.\n\nIhre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert. Deshalb dauerte der ganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen: Es sind noch nicht alle Möbel aufgebaut, deshalb konnten wir noch nicht unsere Sachen einräumen.\n\nBitte schicken Sie uns deshalb am Mittwochmorgen noch zwei Personen, die den Möbelaufbau erledigen. Des Weiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt.\n\nMit freundlichen Grüßen\nMatteo Lozano", "boss_instructions": "Hallo Frau Kühne, da ist wohl was schiefgegangen. Bitte schreiben Sie Herrn Lozano und erklären Sie die Fehler. Sagen Sie zu, dass am Mittwochmorgen pünktlich zwei Monteure kommen und alles fertig aufbauen. Natürlich übernehmen wir die Verantwortung für die Schäden. Die Firma hat das erste Mal bei uns gebucht!", "prompt": "Schreiben Sie eine E-Mail an Herrn Lozano. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Bezug auf den Umzug und aufrichtige Entschuldigung für die Verzögerung", "Erklärung der Ursachen (plötzlicher Personalausfall und Verkehrsbehinderung)", "Bestätigung des Termins am Mittwochmorgen mit zwei erfahrenen Monteuren", "Zusage der Schadensregulierung über die Betriebshaftpflichtversicherung"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p72", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 8: Kopiergerät defekt und Streit über Rechnungen", "topic": "Bürogeräte und Kundendienst", "page": 72, "source_variant": 6, "scenario": "Herr Schmidt (Mova GmbH) beschwert sich über wiederholte Papierstaus an einem fast neuen Druckgerät. Trotz dreier Technikereinsätze trat wieder ein Fehler auf, wodurch eine Ausschreibung verpasst wurde. Er fordert ein Ersatzgerät und weigert sich, die Rechnungen der Techniker zu bezahlen.", "source_letter": "Sehr geehrte Frau Aichele,\n\nvorgestern wurde von einem Ihrer Mitarbeiter unser fast neues Druck- und Kopiergerät der Marke Lexios zum dritten Mal innerhalb von zwei Wochen geprüft, da bei diesem immer wieder Papierstaus aufgetreten sind. Gestern kam es schon wieder zu einer Fehlermeldung, was zur Folge hatte, dass wir Unterlagen nicht fristgerecht einreichen konnten. Aus diesem Grund haben wir eine für uns sehr wichtige Ausschreibung verpasst. Von einer Schadensersatzforderung sehen wir vorerst ab, wir fordern Sie aber auf, uns umgehend auf Ihre Kosten ein anderes Gerät zu liefern. Es handelt sich hier nämlich eindeutig um einen technischen Fehler, den wir nicht zu verantworten haben. Die Rechnungen für die drei vorangegangenen Technikereinsätze werden wir natürlich nicht bezahlen.\n\nIch erwarte Ihre umgehende Rückmeldung.\n\nMit freundlichen Grüßen\nBenno Schmidt", "boss_instructions": "Hallo, laut Techniker lag der Fehler erneut an falscher Bedienung. Antworte Herrn Schmidt bitte und weise ihn höflich darauf hin, dass die Verantwortung nicht bei uns liegt. Gerne kommt noch einmal ein Techniker kostenfrei zur Mitarbeitereinweisung vorbei. Die Kosten für die Geräteüberprüfungen bleiben aber bei Mova.", "prompt": "Schreiben Sie eine E-Mail an Herrn Schmidt. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Dank für die Rückmeldung und Bedauern über die verpasste Ausschreibung", "Höfliche Erläuterung des Technikerbefunds (Bedienerfehler / Papierspezifikation)", "Angebot einer kostenlosen Schulung der Mitarbeitenden vor Ort", "Stellungnahme und Begründung bezüglich der bestehenden Prüfungsrechnungen"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p73", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 9: Kopiergerät defekt – Fassung 2 (Cavone GmbH)", "topic": "Bürogeräte und Kundendienst", "page": 73, "source_variant": 6, "scenario": "Frau Zeller (Cavone GmbH) beschwert sich über wiederholte Fehlermeldungen am neuen ABC-Druck-, Kopier- und Faxgerät. Weil ein Fax mit wichtigen Unterlagen nicht fristgerecht rausging, ging ein wichtiger Deal verloren. Sie fordert ein Ersatzgerät auf unsere Kosten und will die Prüfungsrechnungen nicht bezahlen.", "source_letter": "Sehr geehrter Herr Brenner,\n\nvor drei Tagen hat einer Ihrer Mitarbeiter das neue ABC-Druck-, Kopier- und Faxgerät inspiziert. Dies war das zweite Mal innerhalb einer Woche, dass beim Versenden eines Faxes ein Fehlerzeichen auftrat.\n\nLeider kam gestern wieder eine Fehlermeldung, und wir sollten einige wichtige Unterlagen zum Treffen per Fax verschicken. Wir konnten diese jedoch nicht rechtzeitig versenden. Deshalb haben wir einen für uns sehr wichtigen Deal verloren. Wir sehen derzeit von Schadensersatzansprüchen ab, bitten Sie jedoch, uns umgehend und auf Ihre Kosten ein anderes Gerät zuzusenden.\n\nOffensichtlich handelt es sich hierbei um einen technischen Fehler, für den wir keine Verantwortung übernehmen.\n\nSelbstverständlich übernehmen wir auch keine Rechnungen für vorangegangene technische Arbeiten.\n\nIch hoffe, dass wir schnellstmöglich eine Antwort von Ihnen erhalten.\n\nMit freundlichen Grüßen\nVala Zeller", "boss_instructions": "Guten Morgen, vor einer Stunde erhielt ich diese E-Mail von der Cavone GmbH. Nach Angaben unseres Technikers lag der Fehler wiederum bei der Cavone GmbH. Bitte antworten Sie Frau Zeller und weisen Sie sie höflich darauf hin, dass es nicht in unserer Verantwortung liegt, das Problem zu lösen. Der Techniker kommt gerne wieder ins Unternehmen und führt die Mitarbeiter kostenlos durch den Prozess. Teilen Sie ihr außerdem mit, dass die Kosten für die Untersuchung des Geräts weiterhin ihr Unternehmen trägt.", "prompt": "Schreiben Sie eine E-Mail an Frau Zeller. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Dank für die Rückmeldung und Bedauern über den verlorenen Deal", "Höfliche Erläuterung des Technikerbefunds: Der Fehler lag nicht bei uns", "Angebot einer kostenlosen Einweisung der Mitarbeitenden durch unseren Techniker", "Klare Stellungnahme zu den Kosten der Geräteuntersuchung und zu den Rechnungen"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p74", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 10: Falsche Rechnung und fehlender Rabatt", "topic": "Rechnungsstellung und Konditionen", "page": 74, "source_variant": 7, "scenario": "Ein langjähriger Stammkunde stellt Unstimmigkeiten in der Rechnung fest: 200 statt 100 Pinsel berechnet, teurere rote statt grüner Farbe aufgeführt und der vereinbarte Stammkundenrabatt von 10 % fehlt.", "source_letter": "Sehr geehrte Frau Hoffner,\n\nwir haben Ihre Lieferung erhalten und sind mit allen Artikeln absolut zufrieden. Leider muss ich Sie darauf hinweisen, dass die Rechnung einige Unstimmigkeiten beinhaltet: Zunächst wurden statt 100 Stück Pinsel Größe M 200 Stück berechnet. Außerdem wurden 20 Töpfe roter Farbe berechnet. Wir hatten aber grüne Farbe bestellt und geliefert bekommen, die preislich niedriger liegt. Wir bitten Sie, dies zu korrigieren. Des Weiteren waren wir überrascht, dass unser üblicher Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Das ist wahrscheinlich ein Versehen.\n\nWir bitten um Berichtigung der Rechnung und erneute Zusendung.\n\nMit freundlichen Grüßen\nKarl Schmidt", "boss_instructions": "Hallo, Herr Schmidt ist ein wichtiger Stammkunde. Bitte entschuldige dich bei ihm. Der Fehler lag an der Umstellung unserer Buchhaltungssoftware. Schicke ihm sofort eine korrigierte Rechnung mit den 10 % Rabatt und lege als Entschuldigung einen Gutschein über 50 Euro bei.", "prompt": "Schreiben Sie eine E-Mail an Herrn Schmidt. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Dank für den freundlichen Hinweis und Bedauern über die Fehler in der Rechnung", "Erklärung der Ursache (technische Umstellung der Abrechnungssoftware)", "Zusicherung der sofortigen Rechnungskorrektur (100 Pinsel, grüne Farbe, 10 % Rabatt)", "Beigabe eines Einkaufsgutscheins als Zeichen der Wertschätzung für die Treue"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p75", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 11: Falsche Rechnung – Fassung 2 (Lacke und Farben)", "topic": "Rechnungsstellung und Konditionen", "page": 75, "source_variant": 7, "scenario": "Der langjährige Kunde Joachim Schmidt (Firma Lacke und Farben) beanstandet die Rechnung: 200 statt 100 Pinsel Größe S berechnet, 50 Töpfe roter statt grüner Farbe aufgeführt und der übliche Rabatt von 10 % fehlt.", "source_letter": "Sehr geehrte Frau Klein,\n\nwir haben Ihre Lieferung wie gewohnt zu unserer vollsten Zufriedenheit erhalten. Alle Artikel entsprechen absolut unseren Vorstellungen.\n\nLeider muss ich Sie darauf hinweisen, dass in der beigelegten Rechnung einige Unstimmigkeiten aufgetreten sind. Zunächst wurden statt der 100 Stück Pinsel Größe S 200 Stück berechnet. Außerdem wurden 50 Töpfe rote Farbe aufgeführt. Wir hatten aber grüne Farbe bestellt und geliefert bekommen, die preislich niedriger liegt. Wir bitten das zu korrigieren. Ferner waren wir verwundert, dass uns der übliche Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Dies ist wahrscheinlich ein Versehen.\n\nWir bitten um Berichtigung der Rechnung und erneute Zusendung.\n\nMit freundlichen Grüßen\nJoachim Schmidt", "boss_instructions": "Hallo, ich habe gestern die unten stehende Mail erhalten. Bitte kümmere dich darum und antworte dem Kunden höflich. Die Firma Lacke und Farben ist ein langjähriger, guter Kunde; wir können es uns nicht leisten, ihn zu verlieren. Du kannst ihm ruhig von unseren Computerproblemen berichten und wie wir sie gelöst haben. Selbstverständlich kriegt er den Rabatt wie immer.", "prompt": "Schreiben Sie eine E-Mail an Herrn Schmidt. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Dank für den sachlichen Hinweis und Bedauern über die Fehler in der Rechnung", "Erklärung der Ursache (Computerproblem bei der Rechnungsstellung) und der Lösung", "Zusage der korrigierten Rechnung (100 Pinsel Größe S, grüne Farbe)", "Bestätigung des gewohnten Rabatts von 10 % und Dank für die langjährige Treue"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p76", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 12: Mangelhafte Lieferung – beschädigte Hosen, fehlende T-Shirts", "topic": "Reklamation von Textilien und Nachlieferung", "page": 76, "source_variant": 8, "scenario": "Der Kunde Matthias Schramm beanstandet zwei Punkte: Die Verpackungen der Hosen (Größe M und L) wurden beim Transport beschädigt, sodass die Ware verschmutzt ist, und von 100 bezahlten T-Shirts mit Aufdruck wurde nur die Hälfte geliefert. Er fordert 60 % Preisnachlass und kostenlose Nachlieferung bis zum 10.05.", "source_letter": "Sehr geehrter Herr Mayer,\n\nleider müssen wir Ihnen mitteilen, dass Ihre Lieferung nicht zu unserer Zufriedenheit ausgefallen ist. Wir müssen zwei Punkte beanstanden. Erstens wurden die Verpackungen der Hosen (Größe M und L) beim Transport beschädigt, sodass der Inhalt verschmutzt ist. In diesem Zustand können wir die Waren auf keinen Fall in den regulären Verkauf geben, sondern sie nur mit einem Rabatt anbieten. Wir halten daher einen Preisnachlass von 60 % für angemessen. Des Weiteren teilen wir Ihnen mit, dass von den T-Shirts mit Aufdruck statt der bezahlten 100 Stück nur die Hälfte geliefert wurde. Wegen der beginnenden Sommersaison bitten wir um schnellstmögliche Nachlieferung der fehlenden Stückzahl auf Ihre Kosten spätestens bis zum 10.05. Wir hoffen, dass sich derartige Vorkommnisse in Zukunft vermeiden lassen, und bitten um prompte Erledigung.\n\nMit freundlichen Grüßen\nMatthias Schramm", "boss_instructions": "Hallo, mich erreichte die untenstehende E-Mail. Bitte kümmern Sie sich darum und antworten Sie dem Kunden höflich. Entschuldigen Sie sich für die verschmutzte Ware. Der geforderte Rabatt von 60 % ist unverschämt; bieten Sie ihm eine andere Lösung an. Die Nachlieferung der T-Shirts ist wegen unserer Mitarbeitersituation leider erst bis zum 12.05. möglich. Erklären Sie den Grund.", "prompt": "Schreiben Sie eine E-Mail an Herrn Schramm. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Entschuldigung für die beschädigte und verschmutzte Ware", "Ablehnung des geforderten Rabatts von 60 % und Angebot einer anderen Lösung", "Erklärung, warum die Nachlieferung der T-Shirts erst bis zum 12.05. möglich ist", "Höflicher Ausblick auf die weitere Zusammenarbeit und Bitte um Verständnis"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p77", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 13: Pflanzenlieferung – unpassende Auswahl für die Messe", "topic": "Pflanzendekoration für Veranstaltungen", "page": 77, "source_variant": 9, "scenario": "Frau Talheim beanstandet die Pflanzen- und Blumenauswahl für ihre Ausstellung zum Thema Nachhaltigkeit: importierte exotische Pflanzen im Eingangsbereich und Orchideen in den Sträußen für den Umweltpreis. Sie musste kurzfristig Ersatz bei einem Aussteller beschaffen und verlangt die Erstattung dieser Kosten.", "source_letter": "Sehr geehrter Herr Herrmann,\n\nleider müssen wir Ihnen mitteilen, dass Ihre Pflanzen- und Blumenauswahl für unsere letzte Veranstaltung gänzlich unpassend war. Wie Sie wissen, war das Thema unserer Ausstellung in der vergangenen Woche: „Nachhaltigkeit & Umweltverträglichkeit im Gartenbau – Lokal und Regional“. Und Sie haben im Eingangsbereich aus dem fernen Ausland importierte exotische Pflanzen platziert, was verständlicherweise zu Beschwerden von Seiten der Besucher geführt hat. Zudem wollten wir den diesjährigen Umweltpreis zusammen mit Blumensträußen vergeben. Diese waren aber mit Orchideen bestückt. Wie passt das zum Thema „regional“? In dieser Situation haben wir daher entschieden, kurzfristigen Ersatz für die Sträuße von einem Aussteller zu beschaffen. Wir bitten Sie, diese zusätzlichen Kosten zu ersetzen. Solche Vorkommnisse müssen in Zukunft unter allen Umständen vermieden werden. Wir erwarten Ihre Vorschläge und stehen für ein Gespräch jederzeit zur Verfügung.\n\nMit freundlichen Grüßen\nGabi Talheim", "boss_instructions": "Hallo, die folgende E-Mail ist gestern bei mir eingegangen. Was war denn da los? Bitte antworten Sie der Kundin höflich und machen Sie Vorschläge für unsere weitere Zusammenarbeit. Wir schätzen Frau Talheim als langjährige Kundin und möchten sie deshalb nicht verlieren. Teilen Sie ihr bitte auch mit, was wir ihr als Entschädigung für die entstandenen Unannehmlichkeiten anbieten.", "prompt": "Schreiben Sie eine E-Mail an Frau Talheim. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Entschuldigung für die unpassende Pflanzen- und Blumenauswahl", "Erklärung, wie es zu dem Fehler kam, und Zusage, dass er sich nicht wiederholt", "Zusage, die zusätzlichen Kosten für den kurzfristigen Ersatz zu übernehmen", "Konkretes Entschädigungsangebot und Vorschläge für die weitere Zusammenarbeit"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbei function t(key, vars = {}) {
  const dict = I18N[currentLang] || I18N.es;
  let str = dict[key] !== undefined ? dict[key] : (I18N.es[key] !== undefined ? I18N.es[key] : key);
  for (const [k, v] of Object.entries(vars)) {
    str = str.replace(new RegExp(`\\{${k}\\}`, "g"), v);
  }
  return str;
}

function formatConfidence(conf) {
  const c = String(conf || "mittel").toLowerCase();
  if (currentLang === "ru") {
    if (c === "hoch") return "высокая";
    if (c === "niedrig") return "низкая";
    return "средняя";
  } else {
    if (c === "hoch") return "alta";
    if (c === "niedrig") return "baja";
    return "media";
  }
}

/* ---------- rótulos que vienen del PDF ----------
   Los nombres de las variantes los escriben los extractores con andamiaje en
   español («Variante 1», «nueva versión 08.2024», «test 140321»). Ese andamiaje
   se traduce al vuelo; los nombres alemanes del examen (Beschwerde, Protokoll,
   temas entre paréntesis, números de test) se quedan intactos porque son el
   contenido que se estudia. */
const LABEL_RU = [
  [/\bnueva versión\b/gi, "новая версия"],
  [/\bnueva variante\b/gi, "новый вариант"],
  [/\bvariante\b/gi, "Вариант"],
  [/\btext\b/gi, "Текст"],
  [/\bversión\b/gi, "версия"],
  [/\btest\b/gi, "тест"]
];
function localizeLabel(label){
  let s = String(label == null ? "" : label);
  if (currentLang !== "ru") return s;
  for (const [re, rep] of LABEL_RU) {
    s = s.replace(re, (m) => (m[0] === m[0].toUpperCase() && m[0] !== m[0].toLowerCase())
      ? rep.charAt(0).toUpperCase() + rep.slice(1)
      : rep);
  }
  return s;
}

/* Los avisos del extractor («⚠ …») son comentario, no texto de examen: si hay
   versión rusa se usa esa; si no, se cae al español. */

  if (!v) return "";
  return (currentLang === "ru" && v.note_ru) ? v.note_ru : (v.note || "");
}

/* ---------- Sincronización en Tiempo Real (Firebase Firestore) ---------- */
let fbDb = null;
let fbSyncStatus = "local"; // "local" | "online" | "syncing"
let cloudSchreibenCache = {}; // taskId -> doc data
let cloudSyncTimeout = null;
let activeTaskUnsubscribe = null;
let currentListeningTaskId = null;

function getFirebaseConfig() {
  try {
    const raw = localStorage.getItem(LS_FIREBASE);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}

function getFirebaseConfigRaw() {
  try {
    return localStorage.getItem(LS_FIREBASE) || "";
  } catch(e){ return ""; }
}

function saveFirebaseConfig(cfg) {
  try {
    if (!cfg) {
      localStorage.removeItem(LS_FIREBASE);
    } else {
      localStorage.setItem(LS_FIREBASE, typeof cfg === "string" ? cfg : JSON.stringify(cfg, null, 2));
    }
    fbDb = null;
  } catch(e){}
}

/* La consola de Firebase ofrece un fragmento de JavaScript, no JSON: las claves
   van sin comillas y lleva "const firebaseConfig = ... ;" alrededor. Aceptamos
   las dos formas para que se pueda pegar tal cual lo que da Google. */
function parseFirebaseConfig(raw) {
  const txt = String(raw == null ? "" : raw).trim();
  if (!txt) return null;
  try { return JSON.parse(txt); } catch(e){}
  const desde = txt.indexOf("{", Math.max(0, txt.indexOf("firebaseConfig")));
  const hasta = txt.lastIndexOf("}");
  if (desde < 0 || hasta <= desde) throw new Error(t("cfgNotObject"));
  const cuerpo = txt.slice(desde, hasta + 1)
    .replace(/^\s*\/\/.*$/gm, "")                            // comentarios de línea
    .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')  // claves sin comillas
    .replace(/,(\s*[}\]])/g, "$1");                          // comas finales
  return JSON.parse(cuerpo);
}
window.parseFirebaseConfig = parseFirebaseConfig;

function initFirebase() {
  if (fbDb) return fbDb;
  if (typeof firebase === "undefined") return null;
  const cfg = getFirebaseConfig();
  if (!cfg || !cfg.apiKey || !cfg.projectId) return null;
  try {
    if (!firebase.apps || !firebase.apps.length) {
      firebase.initializeApp(cfg);
    }
    fbDb = firebase.firestore();
    fbSyncStatus = "online";
    updateCloudStatusUI();
    return fbDb;
  } catch(e) {
    console.warn("Firebase init error:", e);
    return null;
  }
}

function updateCloudStatusUI() {
  const el = document.getElementById("cloud-status-indicator");
  if (!el) return;
  if (fbSyncStatus === "online") {
    el.innerHTML = '<span class="cloud-dot online"></span> ' + t("cloudStatusOnline", {room: esc(currentRoomId)});
    el.title = "Firebase Firestore: Room " + currentRoomId;
  } else if (fbSyncStatus === "syncing") {
    el.innerHTML = '<span class="cloud-dot syncing"></span> ' + t("cloudStatusSyncing");
  } else if (fbSyncStatus === "error") {
    el.innerHTML = '<span class="cloud-dot error"></span> ' + t("cloudStatusError");
    el.title = "Firestore: " + currentRoomId + " · " + t("firebaseHelp");
  } else {
    el.innerHTML = '<span class="cloud-dot offline"></span> ' + t("cloudStatusLocal");
    el.title = t("cloudLocalTitle");
  }
}

function startListeningToTask(taskId, onPartnerUpdate) {
  if (activeTaskUnsubscribe) {
    activeTaskUnsubscribe();
    activeTaskUnsubscribe = null;
  }
  currentListeningTaskId = taskId;
  const db = initFirebase();
  if (!db) {
    fbSyncStatus = "local";
    updateCloudStatusUI();
    return;
  }
  try {
    fbSyncStatus = "online";
    updateCloudStatusUI();
    activeTaskUnsubscribe = db.collection("rooms").doc(currentRoomId)
      .collection("schreiben").doc(taskId)
      .onSnapshot((doc) => {
        if (doc && doc.exists) {
          const data = doc.data() || {};
          cloudSchreibenCache[taskId] = data;
          if (onPartnerUpdate && currentListeningTaskId === taskId) {
            onPartnerUpdate(data);
          }
        }
      }, (err) => {
        console.warn("Firestore snapshot error:", err);
      });
  } catch(e) {
    console.warn("Firestore listen error:", e);
  }
}

function pushSchreibenToFirestore(taskId, text, evalResult) {
  const db = initFirebase();
  if (!db) return;
  fbSyncStatus = "syncing";
  updateCloudStatusUI();
  const updateData = {};
  const now = Date.now();
  if (currentUser === "sergio") {
    if (text !== undefined) {
      updateData.sergio_text = text;
      updateData.sergio_words = countWords(text);
      updateData.sergio_updated_at = now;
    }
    if (evalResult !== undefined) {
      updateData.sergio_eval = evalResult;
      updateData.sergio_updated_at = now;
    }
  } else {
    if (text !== undefined) {
      updateData.diana_text = text;
      updateData.diana_words = countWords(text);
      updateData.diana_updated_at = now;
    }
    if (evalResult !== undefined) {
      updateData.diana_eval = evalResult;
      updateData.diana_updated_at = now;
    }
  }

  db.collection("rooms").doc(currentRoomId)
    .collection("schreiben").doc(taskId)
    .set(updateData, { merge: true })
    .then(() => {
      /* Solo cuenta como enviado si la nube lo aceptó. Es lo que después permite
         saber si el borrador local tiene algo sin enviar. */
      if (text !== undefined) { setPushed(taskId, text); saveState(); }
      fbSyncStatus = "online";
      updateCloudStatusUI();
    })
    .catch((err) => {
      console.warn("Firestore write error:", err);
      fbSyncStatus = "error";          // no mentir: el borrador sigue solo en local
      updateCloudStatusUI();
    });
}

function queueSchreibenSync(taskId, text) {
  if (cloudSyncTimeout) clearTimeout(cloudSyncTimeout);
  cloudSyncTimeout = setTimeout(() => {
    pushSchreibenToFirestore(taskId, text);
  }, 900);
}

/* ---------- Progreso de redacción: una clave por perfil ----------
   El mismo navegador puede estar en el perfil de Sergio o en el de Diana. Cada
   perfil necesita su borrador, su evaluación y sus Leitpunkte. Antes la clave era
   solo el id de la tarea, así que al cambiar de perfil el editor cargaba el texto
   del otro y podía publicarlo como suyo. Ahora la clave lleva el perfil delante:
   "sergio::schr-b-p66". */
function progKey(id){ return currentUser + "::" + id; }

/* Los progresos guardados antes de existir la clave con perfil traen la clave
   antigua (solo el id). Se convierten una sola vez, y se asignan al perfil que
   estaba abierto. Lo mismo con los ficheros de progreso exportados entonces. */
function migrarClavesDeProgreso(s, dueno){
  const destinatario = (dueno === "sergio" || dueno === "diana") ? dueno : currentUser;
  ["schreiben_drafts", "schreiben_evals", "schreiben_lps", "schreiben_pushed"].forEach((campo)=>{
    const mapa = s && s[campo];
    if(!mapa) return;
    Object.keys(mapa).forEach((k)=>{
      if(k.indexOf("::") !== -1) return;              // ya lleva perfil
      const nuevo = destinatario + "::" + k;
      if(!(nuevo in mapa)) mapa[nuevo] = mapa[k];
      delete mapa[k];
    });
  });
  return s;
}

function delDraft(id){ if(state.schreiben_drafts) delete state.schreiben_drafts[progKey(id)]; }
function getEval(id){ return (state.schreiben_evals && state.schreiben_evals[progKey(id)]) || null; }
function setEval(id, res){ if(!state.schreiben_evals) state.schreiben_evals = {}; state.schreiben_evals[progKey(id)] = res; }
function delEval(id){ if(state.schreiben_evals) delete state.schreiben_evals[progKey(id)]; }

  state.schreiben_lps[progKey(id)][idx] = valor;
}
/* Último texto que este navegador tiene por sincronizado con la nube: el que
   envió, o el que recibió de ella. Sin registro devuelve undefined; con la cadena
   vacía significa que aquí se borró a propósito. Sirve para saber si el borrador
   local tiene algo sin enviar. */
function getPushed(id){ return state.schreiben_pushed ? state.schreiben_pushed[progKey(id)] : undefined; }
function setPushed(id, txt){ if(!state.schreiben_pushed) state.schreiben_pushed = {}; state.schreiben_pushed[progKey(id)] = txt; }

function loadState(){
  try {
    const s = migrarClavesDeProgreso(JSON.parse(localStorage.getItem(LS)) || {});
    if (!s.answers) s.answers = {};
    if (!s.schreiben_drafts) s.schreiben_drafts = {};
    if (!s.schreiben_evals) s.schreiben_evals = {};
    if (!s.schreiben_lps) s.schreiben_lps = {};
    if (!s.schreiben_pushed) s.schreiben_pushed = {};
    return s;
  }
  catch(e){ return {answers:{}, schreiben_drafts:{}, schreiben_evals:{}, schreiben_lps:{}, schreiben_pushed:{}}; }
}
function saveState(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
let state = loadState();
window.quizState = state;

/* ---------- Copia de seguridad del progreso ----------
   El progreso vive en el localStorage de UN origen (navegador + dirección web),
   así que exportar/importar es la forma de llevarlo de file:// a GitHub Pages,
   a otro navegador o a otro dispositivo. No incluye claves. */
function exportProgress(){
  try {
    const payload = {
      app: "B2-Beruf-Quiz",
      formato: 1,
      exportado: new Date().toISOString(),
      usuario: currentUser,
      sala: currentRoomId,
      progreso: state
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "progreso-B2-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch(e){
    console.warn("No se pudo exportar el progreso:", e);
    return false;
  }
}

/* Sustituye el progreso actual por el del fichero y reengancha window.quizState
   (si no, el puntero global se queda apuntando al objeto viejo). */
function aplicarProgreso(prog, dueno){
  state = {
    answers: prog.answers || {},
    schreiben_drafts: prog.schreiben_drafts || {},
    schreiben_evals: prog.schreiben_evals || {},
    schreiben_lps: prog.schreiben_lps || {},
    schreiben_pushed: prog.schreiben_pushed || {}
  };
  /* Un fichero exportado antes de existir la clave con perfil trae la clave
     antigua. Se asigna al perfil que lo exportó (datos.usuario), no al que
     lo importa. */
  migrarClavesDeProgreso(state, dueno);
  window.quizState = state;
  saveState();
  render();
  return {
    respuestas: Object.keys(state.answers).length,
    borradores: Object.keys(state.schreiben_drafts).length
  };
}
window.exportProgress = exportProgress;
window.aplicarProgreso = aplicarProgreso;

/* ---------- Configuración de IA ---------- */
/* Último estado conocido de la configuración. Sirve para que la clave siga
   funcionando en esta sesión aunque el navegador no deje guardarla. */
let aiConfigCache = null;

function normalizarAIConfig(c){
  c = c || {};
  return {
    provider: c.provider || "gemini",
    geminiKey: c.geminiKey || "",
    geminiModel: c.geminiModel || "gemini-3.5-flash-lite",
    customEndpoint: c.customEndpoint || "https://api.deepseek.com",
    customKey: c.customKey || "",
    customModel: c.customModel || "deepseek-chat",
    ollamaEndpoint: c.ollamaEndpoint || "http://localhost:11434",
    ollamaModel: c.ollamaModel || "llama3.1"
  };
}

function getAIConfig(){
  if(aiConfigCache) return Object.assign({}, aiConfigCache);
  let crudo = {};
  try { crudo = JSON.parse(localStorage.getItem(LS_AI)) || {}; } catch(e){ crudo = {}; }
  aiConfigCache = normalizarAIConfig(crudo);
  return Object.assign({}, aiConfigCache);
}
function saveAIConfig(cfg){
  aiConfigCache = normalizarAIConfig(cfg);
  try { localStorage.setItem(LS_AI, JSON.stringify(aiConfigCache)); return true; }
  catch(e){ console.warn("No se pudo guardar la configuración de IA:", e); return false; }
}

/* ¿Puede este navegador guardar ajustes? Si no puede, hay que decirlo: antes el
   fallo se tragaba en silencio y la clave desaparecía sin explicación. */
function storageOk(){
  try {
    const sonda = "__b2_sonda__";
    localStorage.setItem(sonda, "1");
    const ok = localStorage.getItem(sonda) === "1";
    try { localStorage.removeItem(sonda); } catch(e){}
    return ok;
  } catch(e){ return false; }
}

/* Clave enmascarada para poder comprobar de un vistazo que sí se guardó. */
function maskKey(k){
  const s = String(k || "");
  if(!s) return "";
  return s.length <= 8 ? "•".repeat(s.length) : "•".repeat(6) + s.slice(-4);
}

/* Qué clave usa el proveedor elegido (Ollama va en local y no usa ninguna). */
function aiKeyOf(cfg){
  if(!cfg) return "";
  if(cfg.provider === "gemini") return cfg.geminiKey || "";
  if(cfg.provider === "openai_compatible") return cfg.customKey || "";
  return "";
}

/* Lee los campos del modal en un solo sitio: lo usan Guardar y Probar conexión,
   así que probar ya no puede dejar la clave sin guardar. */
function readAIConfigFromModal(){
  const val = (id, def) => {
    const el = document.getElementById(id);
    return (el && typeof el.value === "string" && el.value.trim()) ? el.value.trim() : (def || "");
  };
  return {
    provider: val("cfg-provider", "gemini"),
    geminiKey: val("cfg-gemini-key"),
    geminiModel: val("cfg-gemini-model", "gemini-3.5-flash-lite"),
    customEndpoint: val("cfg-custom-endpoint", "https://api.deepseek.com"),
    customKey: val("cfg-custom-key"),
    customModel: val("cfg-custom-model", "deepseek-chat"),
    ollamaEndpoint: val("cfg-ollama-endpoint", "http://localhost:11434"),
    ollamaModel: val("cfg-ollama-model", "llama3.1")
  };
}

/* Línea de estado del modal: proveedor activo, si hay clave y si el navegador
   deja guardarla. */
function aiStatusText(cfg){
  const clave = aiKeyOf(cfg);
  const partes = [
    t("aiActiveProvider", {provider: cfg.provider}),
    clave ? t("aiKeySaved", {mask: maskKey(clave)}) : t("aiKeyMissing"),
    storageOk() ? t("aiStorageOk") : t("aiStorageBlocked")
  ];
  const protocolo = (typeof location !== "undefined" && location.protocol) ? location.protocol : "";
  if(protocolo === "file:") partes.push(t("aiLocalFile"));
  return partes.join(" · ");
}

/* Un fallo de red no dice nada útil («Failed to fetch»): se traduce. */
function errorDeRed(e){
  const m = String((e && e.message) || e || "");
  if(/Failed to fetch|NetworkError|Load failed|Network request failed/i.test(m)) return t("errNetwork");
  return m;
}

/* ---------- índices ---------- */
const allVariants = [];
DATA.sections.forEach(sec=>{
  sec.variants.forEach(v=>{
    v._section = sec.id; v._sectionTitle = sec.title;
    if(!v.items) v.items = [];
    v.items.forEach((it,i)=>{ it._idx = i; });
    const byN = {};
    v.items.forEach(it => { byN[it.n] = (byN[it.n]||0) + 1; });
    const seenN = {};
    v.items.forEach(it => {
      if(byN[it.n] > 1){
        seenN[it.n] = (seenN[it.n]||0) + 1;
        it._label = it.n + String.fromCharCode(96 + seenN[it.n]);
      } else {
        it._label = String(it.n);
      }
    });
    allVariants.push(v);
  });
});

function ansKey(v, item){ return v.id + "#" + item._idx; }
function itemAnswerLetter(it){ return String(it.answer).toLowerCase(); }
function isDoubtful(it){ return String(it.confidence||"mittel").toLowerCase() !== "hoch"; }
function doubtfulCount(v){ return (v.items || []).filter(isDoubtful).length; }

let onlyDoubtful = false;

/* ---------- estadísticas ---------- */
function updateStats(){
  let total = 0, done = 0, ok = 0, doubt = 0;
  allVariants.forEach(v=>{
    (v.items || []).forEach(it=>{
      total++;
      if(isDoubtful(it)) doubt++;
      const a = state.answers[ansKey(v,it)];
      if(a !== undefined && a !== "__revealed__"){
        done++; if(a === itemAnswerLetter(it)) ok++;
      }
    });
  });
  const el = document.getElementById("stats");
  const fill = document.getElementById("progress-fill");
  if (fill) fill.style.width = (total ? Math.min(100, Math.round(done / total * 100)) : 0) + "%";
  if(!el) return;
  const pct = done ? " (" + Math.round(ok/done*100) + "%)" : "";
  const doubtSpan = doubt ? ' · <span class="em-warn">' + t("statDudosas", {doubt: doubt}) + "</span>" : "";
  el.innerHTML = t("statRespondidas", {done: done, total: total, ok: ok}) + pct + doubtSpan;
}

/* ---------- navegación ---------- */
let current = allVariants.length ? allVariants[0].id : null;

/* Grupo desplegado del menú. `undefined` = sin decidir todavía (se despliega el
   grupo donde estás); `null` = todos plegados, que es lo que deja el clic en la
   cabecera abierta. Son variables de sesión a propósito: al recargar, el menú
   vuelve a abrir solo el grupo activo, sin memoria que arrastre estados raros. */
let openSec;
let lastNavCurrent;

function renderNav(){
  const nav = document.getElementById("nav");
  if(!nav) return;
  nav.innerHTML = "";
  /* Saltar a otra entrada (clic, filtro de dudosas) reabre su grupo: el menú
     nunca esconde el ejercicio que estás viendo. */
  const aqui = allVariants.find(v => v.id === current);
  const secActual = aqui ? aqui._section : null;
  if(openSec === undefined || current !== lastNavCurrent){
    openSec = secActual; lastNavCurrent = current;
  }
  DATA.sections.forEach(sec=>{
    const abierto = openSec === sec.id;
    /* Con el filtro de dudosas puesto, el contador cuenta lo que de verdad
       se ve, no lo que el grupo guarda. */
    const visibles = sec.variants.filter(v => !(onlyDoubtful && doubtfulCount(v) === 0 && v.id !== current));

    const h = document.createElement("div");
    h.className = "sec" + (abierto ? " open" : "");

    const tog = document.createElement("div");
    tog.className = "sec-toggle";
    tog.tabIndex = 0;
    tog.title = t(abierto ? "secToggleCollapse" : "secToggleExpand", { title: localizeSection(sec.title) });
    const nom = document.createElement("span");
    nom.textContent = localizeSection(sec.title);
    const cnt = document.createElement("span");
    cnt.className = "sec-count";
    cnt.textContent = visibles.length;
    tog.appendChild(nom); tog.appendChild(cnt);
    /* setAttribute no existe en el DOM simulado de las pruebas; en el navegador
       sí, así que el rol y el estado plegado se anuncian sin romper nada. */
    if(tog.setAttribute){
      tog.setAttribute("role", "button");
      tog.setAttribute("aria-expanded", abierto ? "true" : "false");
    }
    const alternar = ()=>{ openSec = abierto ? null : sec.id; renderNav(); };
    tog.onclick = alternar;
    tog.onkeydown = e => {
      if(e.key === "Enter" || e.key === " " || e.key === "Spacebar"){ e.preventDefault(); alternar(); }
    };
    h.appendChild(tog);

    /* Reiniciar el bloque entero: borra solo las respuestas de esta sección, y
       solo aparece si hay algo que borrar. Las tareas de Schreiben se quedan
       fuera a propósito (tienen sus propios botones por tarea). */
    const objetivos = (sec.variants || []).filter(v => v.kind !== "schreiben");
    const pendientes = objetivos.reduce((acc, v) =>
      acc + (v.items || []).filter(it => state.answers[ansKey(v, it)] !== undefined).length, 0);
    if(abierto && pendientes > 0){
      const bResetSec = document.createElement("button");
      bResetSec.className = "sec-reset";
      bResetSec.textContent = t("btnResetSection");
      bResetSec.title = t("btnResetSectionTitle", { title: sec.title, n: pendientes });
      bResetSec.onclick = ()=>{
        if(!confirm(t("confirmResetSection", { title: sec.title, n: pendientes }))) return;
        objetivos.forEach(v => (v.items || []).forEach(it => { delete state.answers[ansKey(v, it)]; }));
        saveState(); render();
      };
      h.appendChild(bResetSec);
    }
    nav.appendChild(h);
    visibles.forEach(v=>{
      const nd = doubtfulCount(v);
      const b = document.createElement("button");
      const n = (v.items || []).length;
      const done = (v.items || []).filter(it => state.answers[ansKey(v,it)] !== undefined).length;
      const ok = (v.items || []).filter(it => state.answers[ansKey(v,it)] === itemAnswerLetter(it)).length;
      let pill = "";
      if(v.kind === "schreiben"){
        /* Se pasa por la vara para que la insignia del menú diga lo mismo que el panel. */
        const ev = getEval(v.id);
        const conVara = ev ? normalizeEvaluationResult(ev, null, (v.leitpunkte || []).length) : null;
        pill = conVara ? (conVara.verdict === "BESTANDEN" ? t("passedPill") : t("failedPill")) : (v.category === "beschwerde" ? t("pillEmail") : t("pillPost"));
      } else {
        pill = onlyDoubtful
          ? (nd === 1 ? t("doubtPillSingle") : t("doubtPillPlural", {count: nd}))
          : (done ? ok + "/" + n : (n === 1 ? t("itemCountSingle") : t("itemsCount", {count: n})));
      }
      b.innerHTML = esc(localizeLabel(v.label)) + '<span class="pill">' + esc(pill) + '</span>';
      b.className = (v.id === current ? "active " : "") + "sec-item";
      /* Los grupos plegados se ocultan, no se borran: el teclado y las pruebas
         siguen encontrando sus entradas. */
      b.hidden = !abierto;
      b.onclick = ()=>{ current = v.id; render(); window.scrollTo(0,0); };
      nav.appendChild(b);
    });
  });
}

/* ---------- temporizador de examen (45 min) ---------- */
let examTimer = null;
let examTimerSeconds = 45 * 60;
let examTimerRunning = false;

function formatTimer(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

/* ---------- render principal ---------- */
/* Una evaluación con datos raros (del LLM o de la pareja) no debe dejar la app
   a medias: si el render falla, se muestra un aviso en lugar de una pantalla rota. */
function render(){
  try {
    renderMain();
  } catch(e){
    console.warn("Error al renderizar:", e);
    const main = document.getElementById("main");
    if(main) main.innerHTML = '<div class="panel"><h3>' + t("renderErrorTitle") + '</h3>' +
      '<div>' + esc(e.message) + '</div><div class="sub">' + t("renderErrorHint") + '</div></div>';
  }
}

function renderMain(){
  renderNav();
  updateStats();
  const main = document.getElementById("main");
  if(!main) return;
  const v = allVariants.find(x=>x.id===current);
  if(!v){ main.className = ""; main.innerHTML = '<div class="empty">' + t("noData") + '</div>'; return; }
  main.innerHTML = "";
  /* Mesa de examen a dos columnas (CSS ≥1500px): solo si hay referencia que
     poner al lado —anuncios de zuordnung o texto de lectura—. Sin ella, una
     columna; la clase se quita siempre para no arrastrarla entre variantes. */
  main.className = (v.kind !== "schreiben" && (v.passage || (v.options && v.options.length)))
    ? "desk" : "";

  /* Encabezado */
  const h2 = document.createElement("h2");
  h2.textContent = v._sectionTitle + " · " + localizeLabel(v.label);
  main.appendChild(h2);
  const sub = document.createElement("div");
  sub.className = "sub";
  const numItems = (v.items || []).length;
  const itemsText = numItems === 1 ? t("itemCountSingle") : t("itemsCount", {count: numItems});
  sub.innerHTML = t("pagePdf", {page: v.page}) +
    (v.topic ? ' · <b>' + esc(v.topic) + '</b>' : '') +
    (v.kind === "schreiben" ? ' · <b>' + t("schreibenSubBadge") + '</b>' : ' · ' + itemsText);
  main.appendChild(sub);

  if(v.kind === "schreiben"){
    renderSchreiben(v, main);
    return;
  }

  /* Vista habitual para preguntas de Lesen / Hören */
  if(v.note){
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = "⚠ " + noteOf(v);
    main.appendChild(n);
  }
  if(v.intro){
    const p = document.createElement("div");
    p.className = "panel";
    p.innerHTML = '<h3>' + t("instructions") + '</h3><div class="intro-text">' + esc(v.intro) + '</div>';
    main.appendChild(p);
  }

  if(v.passage){
    main.appendChild(detailsPanel(t("readingText"), v.passage));
  }

  if(v.options && v.options.length){
    /* «Usada» = la ha asignado el usuario, no la clave. Derivarlo de la clave
       (itemAnswerLetter) convertía este panel en la solución: salían marcados
       con ✓ justo los 5 anuncios correctos antes de responder nada. */
    const used = new Set(
      v.items.map(i => state.answers[ansKey(v, i)])
             .filter(a => a !== undefined && a !== "__revealed__")
             .map(a => String(a).toLowerCase()));
    const d = document.createElement("details");
    d.className = "panel passage";
    d.open = true;
    const s = document.createElement("summary");
    const label = v.optionsLabel || (v._section === "lesen-t3" ? "Kommentare" : "Anzeigen");
    const ks = v.options.map(o=>String(o.key));
    s.textContent = t("optionsSummary", {
      label: label,
      range: ks[0] + "–" + ks[ks.length-1],
      total: v.options.length,
      used: used.size
    });
    d.appendChild(s);
    const body = document.createElement("div");
    v.options.forEach(o=>{
      const isUsed = used.has(String(o.key).toLowerCase());
      const div = document.createElement("div");
      div.className = "ad " + (isUsed ? "used" : "unused");
      div.innerHTML = '<span class="k">' + esc(o.key) + ')</span>' +
                      '<span class="t">' + esc(o.title||"") + '</span>' +
                      '<div class="body">' + esc(o.text||"") + '</div>';
      body.appendChild(div);
    });
    d.appendChild(body);
    main.appendChild(d);
  }

  const shown = onlyDoubtful ? v.items.filter(isDoubtful) : v.items;
  if(onlyDoubtful){
    const info = document.createElement("div");
    info.className = "note";
    info.textContent = shown.length
      ? t("reviewModeInfo", {shown: shown.length, total: v.items.length})
      : t("reviewModeNoDoubt");
    main.appendChild(info);
  }
  const sheet = document.createElement("section");
  sheet.className = "q-sheet";
  shown.forEach(it => sheet.appendChild(renderItem(v, it)));
  main.appendChild(sheet);

  const row = document.createElement("div");
  row.className = "row";
  const bAll = document.createElement("button");
  bAll.className = "btn ghost";
  bAll.textContent = t("btnShowAllAnswers");
  bAll.onclick = ()=>{
    v.items.forEach(it=>{ if(state.answers[ansKey(v,it)]===undefined)
      state.answers[ansKey(v,it)] = "__revealed__"; });
    saveState(); render();
  };
  const bClear = document.createElement("button");
  bClear.className = "btn ghost";
  bClear.textContent = t("btnClearVariantAnswers");
  bClear.onclick = ()=>{ v.items.forEach(it=> delete state.answers[ansKey(v,it)]);
    saveState(); render(); };
  row.appendChild(bAll); row.appendChild(bClear);
  main.appendChild(row);
}

/* ---------- Renderizador del módulo de Schreiben ---------- */
function countWords(str){
  const m = (str || "").trim().match(/[\p{L}\p{N}_\-]+/gu);
  return m ? m.length : 0;
}

function renderPartnerSchreibenView(container, v, data){
  if(!container) return;
  container.innerHTML = "";
  const partnerKey = currentUser === "sergio" ? "diana" : "sergio";
  const partnerName = currentUser === "sergio" ? "Diana" : "Sergio";
  const partnerGen = currentUser === "sergio" ? "Дианы" : "Серхио";
  const partnerText = data ? (data[partnerKey + "_text"] || "") : "";
  const partnerWords = data ? (data[partnerKey + "_words"] || countWords(partnerText)) : 0;
  const partnerUpdatedAt = data ? data[partnerKey + "_updated_at"] : null;
  /* La evaluación de la pareja se pasa por la misma vara: si se guardó con la
     escala vieja, aquí se ve con la nueva. */
  const partnerEvalGuardada = data ? data[partnerKey + "_eval"] : null;
  const partnerEval = partnerEvalGuardada ? normalizeEvaluationResult(partnerEvalGuardada, null, (v.leitpunkte || []).length) : null;

  const card = document.createElement("div");
  card.className = "partner-card";

  let timeStr = "";
  if(partnerUpdatedAt){
    const millis = (typeof partnerUpdatedAt === "object" && partnerUpdatedAt.toMillis) ? partnerUpdatedAt.toMillis() : Number(partnerUpdatedAt);
    if(!isNaN(millis) && millis > 0){
      const diffSec = Math.max(0, Math.round((Date.now() - millis) / 1000));
      if(diffSec < 60) timeStr = t("timeJustNow");
      else if(diffSec < 3600) timeStr = t("timeMinutesAgo", {m: Math.max(1, Math.floor(diffSec / 60))});
      else timeStr = t("timeHoursAgo", {h: Math.floor(diffSec / 3600)});
    }
  }

  const pHead = document.createElement("div");
  pHead.className = "partner-head";
  pHead.innerHTML =
    '<div class="partner-title">' +
      '<span>👤 ' + t("partnerWritingHeader", {partner: partnerName, partnerGen: partnerGen}) + '</span>' +
      (partnerWords > 0 ? '<span class="badge ' + (partnerWords >= 150 ? 'hoch' : 'mittel') + '">' + t("partnerWords", {words: partnerWords}) + '</span>' : '') +
    '</div>' +
    '<div class="partner-meta">' +
      (timeStr ? '<span>🕒 ' + t("partnerLastUpdate", {time: timeStr}) + '</span>' : '') +
    '</div>';
  card.appendChild(pHead);

  const pBody = document.createElement("div");
  if(!partnerText || !partnerText.trim()){
    pBody.className = "partner-body partner-empty";
    pBody.textContent = t("partnerNotStarted", {partner: partnerName});
  } else {
    pBody.className = "partner-body";
    pBody.textContent = partnerText;
  }
  card.appendChild(pBody);
  container.appendChild(card);

  if(partnerEval){
    const evalSec = document.createElement("div");
    evalSec.style.marginTop = "16px";

    const isPass = partnerEval.verdict === "BESTANDEN";
    const score = partnerEval.score_total != null ? partnerEval.score_total : "-";

    const evalBanner = document.createElement("div");
    evalBanner.className = "eval-banner " + (isPass ? "pass" : "fail");
    evalBanner.style.marginBottom = "8px";

    evalBanner.innerHTML =
      '<div>' + t("partnerEvalScore", {name: partnerName, score: esc(score), verdict: (isPass ? t("verdictPass") : t("verdictFail"))}) + '</div>' +
      '<button class="btn ghost sm" id="btn-toggle-partner-eval-' + v.id + '">' + t("btnViewPartnerEval", {partner: partnerName}) + '</button>';
    evalSec.appendChild(evalBanner);

    const detailedContainer = document.createElement("div");
    detailedContainer.id = "partner-detailed-eval-" + v.id;
    detailedContainer.style.display = "none";
    detailedContainer.appendChild(renderEvaluationResult(v, partnerEval));
    evalSec.appendChild(detailedContainer);

/* Trae tu lado desde la nube cuando este navegador no lo tiene, y refresca una
   copia local que se quedó vieja. Nunca pisa ediciones sin enviar.

   `enviado` es el último texto que este navegador tiene por sincronizado. Las
   reglas, en orden:
     1. Editor vacío y la nube con texto: se rellena, y queda anotado como
        sincronizado. Si aquí se borró a propósito (`enviado` es la cadena vacía),
        no se rellena: acabas de vaciarlo tú.
     2. Editor igual a la nube: ya coinciden, solo se anota. Es lo que deja
        protegidas las copias que llegaron antes de existir esta marca.
     3. Editor igual a lo último sincronizado y la nube distinta: manda la nube.
        Sin esto, una copia vieja se sube encima de una nueva al primer tecleo.
     4. Editor distinto de lo último sincronizado: hay ediciones sin enviar. No se
        toca nada. */
function hidratarMiLadoDesdeNube(v, datos, textarea, contenedor, badge){
  if(!datos) return;
  const textoNube = datos[currentUser + "_text"] || "";
  const local = getDraft(v.id);
  const enviado = getPushed(v.id);            // undefined = sin registro en este navegador

  const ponerEnEditor = (txt)=>{
    setDraft(v.id, txt);
    textarea.value = txt;
    updateWordBadge(badge, countWords(txt));
    saveState();
  };

  if(!local && !String(textarea.value || "").trim() && textoNube && enviado !== ""){
    ponerEnEditor(textoNube);
    setPushed(v.id, textoNube);
    saveState();
  } else if(local && textoNube && local === textoNube){
    if(local !== enviado){ setPushed(v.id, local); saveState(); }
  } else if(local && local === enviado && textoNube && textoNube !== local){
    ponerEnEditor(textoNube);
    setPushed(v.id, textoNube);               // ya no hay nada sin enviar
    saveState();
  }

  const evalNube = datos[currentUser + "_eval"];
  if(evalNube && !getEval(v.id)){
    setEval(v.id, evalNube);
    saveState();
    contenedor.appendChild(renderEvaluationResult(v, evalNube));
    renderNav();   // la insignia del menú (✓ Aprobado) también vuelve
  }
}
