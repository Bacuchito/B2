n positiven Trend. Für das nächste Quartal ist geplant, positive Kundenreaktionen im Internet hochzuladen. SF betont, dass gerade in diesem Bereich die Zukunft liegt und regelmäßige Neuerungen erwartet werden können. Deshalb wird sie in den kommenden Sitzungen regelmäßig neue Konzepte präsentieren.\n\nTOP 3 Berichte\nSZ berichtet darüber, dass die Mitarbeitenden in der Produktion seit dem Einbau der neuen Maschinen gehäuft über eine enorme Lärmbelastung klagen würden. Hier bestehe dringender Handlungsbedarf, da im anderen Fall eine Überprüfung durch die Behörden erfolgen konnte. PM wird mit der Herstellerfirma dieser Anlagen Kontakt aufnehmen, um dieses Problem zu klären. Bis zur Lösung sollten Gehörschützer benutzt werden.\n\nTOP 4 Erweiterte Überstundenregelung\nJS teilt einen Vorschlag der Geschäftsleitung hinsichtlich einer erweiterten Überstundenregelung mit. Aufgrund einer sich ständig ändernden Auftragslage kommt es vor, dass den Mitarbeitenden immer mehr Überstunden zugemutet werden. Die bisherige Regelung, dass bis zehn Stunden Mehrarbeit im Monat bezahlt werden, bleibt bestehen. Die Stunden darüber hinaus werden weiterhin als Freizeitausgleich gewährt. Neu kommt hinzu, dass ab dem kommenden Jahr für jeweils 100 geleistete Überstunden jährlich ein Urlaubstag zusätzlich gegeben wird. SZ wird diese Maßnahme in der nächsten Betriebsratssitzung zur Prüfung und Genehmigung vorlegen.\n\nTOP 5 Einführung Jobticket\nDa in der Vergangenheit die Situation auf unseren Firmenparkplätzen sehr angespannt war, nahm die Firma Kontakt zum örtlichen öffentlichen Personennahverkehr auf, um die Einführung von Jobtickets für die Mitarbeitenden möglich zu machen. Viele Mitarbeitende hatten zuvor diesen Wunsch geäußert. SZ teilt mit, dass die Verhandlungen kurz vor dem Abschluss stehen. Wer Interesse an diesem günstigen Ticket hat, sollte sich per Mail oder persönlich in der Personalabteilung dafür anmelden. Die Abteilungsleiter übernehmen es, Ihre Abteilungen zu informieren.\n\nTOP 6\nUnser Unternehmen und das Fitnesscenter fit und fun, das sich in der unmittelbaren Nähe unserer Firma befindet, haben gemeinsam ein Angebot für unsere Mitarbeiter erarbeitet. Wenn man seine Betriebszugehörigkeit nachweist, kann man einen Vertrag zu besonders günstigen Konditionen abschließen. SZ schlägt vor, man könnte dort zu einem späteren Zeitpunkt sogar ein Sportfest für die Abteilungen durchführen. Diesen Vorschlag begrüßt JS.", "items": [{"n": 14, "type": "choice", "prompt": "Die Besprechung", "options": [{"key": "a", "text": "beginnt zur festgelegten Uhrzeit."}, {"key": "b", "text": "soll auf den 25.06. verlegt werden."}, {"key": "c", "text": "wird durch Änderungen ergänzt."}], "answer": "a", "confidence": "hoch", "quote": "JS begrüßt die Abteilungsleitungen zur heutigen Sitzung, die daraufhin pünktlich eröffnet wird.", "explain": "Correcto a: la reunión da comienzo con puntualidad («pünktlich eröffnet wird»). b es falso porque el 25.06 es la fecha acordada para la próxima reunión; c es falso porque el orden del día se aprobó sin enmiendas ni modificaciones («ohne Ergänzungen und Änderungen»)."}, {"n": 15, "type": "choice", "prompt": "Die Umsatzsteigerung", "options": [{"key": "a", "text": "beträgt 350.000 Euro."}, {"key": "b", "text": "liegt bei 38 %."}, {"key": "c", "text": "wird sich fortsetzen."}], "answer": "c", "confidence": "hoch", "quote": "JS zeigt sich mit dieser ersten Entwicklung zufrieden und erwartet einen weiteren positiven Trend.", "explain": "Correcto c: la dirección manifiesta su satisfacción con el aumento inicial de ventas (+18 %) y anticipa que la tendencia al alza continuará («erwartet einen weiteren positiven Trend»). a es falso porque 350.000 € fue el presupuesto aprobado de marketing; b es falso porque el 38 % se refiere al aumento de atención/interés en redes sociales, no a la facturación."}, {"n": 16, "type": "choice", "prompt": "Die Überstundenregelung", "options": [{"key": "a", "text": "bleibt genauso bestehen."}, {"key": "b", "text": "erhält eine Ergänzung."}, {"key": "c", "text": "gilt ab 100 Überstunden."}], "answer": "b", "confidence": "hoch", "quote": "Neu kommt hinzu, dass ab dem kommenden Jahr für jeweils 100 geleistete Überstunden jährlich ein Urlaubstag zusätzlich gegeben wird.", "explain": "Correcto b: el régimen existente se mantiene en sus bases pero añade una cláusula nueva («Neu kommt hinzu... ein Urlaubstag zusätzlich»), recibiendo así un complemento. a es falso porque se amplía; c es falso porque la compensación de horas extras opera desde las primeras horas, no a partir de 100."}, {"n": 17, "type": "choice", "prompt": "Das Jobticket", "options": [{"key": "a", "text": "ist eine preislich unattraktive Variante."}, {"key": "b", "text": "können die Mitarbeiter beim ÖPNV kaufen."}, {"key": "c", "text": "soll den Arbeitsweg stressfreier machen."}], "answer": "c", "confidence": "hoch", "quote": "Da in der Vergangenheit die Situation auf unseren Firmenparkplätzen sehr angespannt war, nahm die Firma Kontakt zum örtlichen öffentlichen Personennahverkehr auf, um die Einführung von Jobtickets für die Mitarbeitenden möglich zu machen.", "explain": "Correcto c: la iniciativa surge para aliviar el colapso del aparcamiento de empresa y responder al deseo de los trabajadores, facilitando un desplazamiento más cómodo y sin estrés. a es falso porque se describe expresamente como «diesem günstigen Ticket»; b es falso porque la solicitud se tramita internamente en el departamento de personal de la empresa."}, {"n": 18, "type": "choice", "prompt": "Sportliche Aktivitäten", "options": [{"key": "a", "text": "finden in dem Unternehmen statt."}, {"key": "b", "text": "sollen in den Abteilungen stattfinden."}, {"key": "c", "text": "werden von der Firma gefördert."}], "answer": "c", "confidence": "hoch", "quote": "Wenn man seine Betriebszugehörigkeit nachweist, kann man einen Vertrag zu besonders günstigen Konditionen abschließen.", "explain": "Correcto c: la empresa promueve la práctica deportiva negociando con un gimnasio cercano tarifas ventajosas subvencionadas/descontadas para sus empleados («besonders günstige Konditionen»). a y b son falsos porque las actividades no se imparten dentro de las instalaciones ni en los departamentos de la compañía sino en un centro fitness externo."}]}, {"id": "t4_e-p63", "label": "Variante 9 (Protokoll 19.02.20XX, Ballhausen)", "topic": "Fertigungsanlage, Software-Update, Sommerfest", "page": 63, "note": "Acta de la reunión del 19.02.20XX en Ballhausen (pp. 63-64). En el original aparece anotada como «вариант № 9 (не с экзамена)».", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Protokoll 19. Februar 20XX, 10.00-11.45 Uhr\nKonferenzraum 7, Ort: Neuburger Allee 28, 87341 Ballhausen\nAnwesende: Maria Loppinet (ML, Geschäftsführung), Lukas Meier (LM, Leitung Einkauf), Magda Nauner (MN, Leitung Personal), Gert Schrader (GS, Leitung Produktion), Peter Schuldt (PS, Leitung Verkauf), Katja Stevens (KS, Leitung Qualitätskontrolle), Volha Schäfer (VS, Leitung Finanzen)\nGast: Wanda Lubic (WL, IT-Beauftragte)\nSitzungsleitung: Magda Nauner\nProtokollantin: Volha Schäfer\n\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Stand des Projekts „Fertigungsanlage“\n3. Berichte\n4. Neue Mitarbeiterinnen und Mitarbeiter\n5. Update der Software\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nMN begrüßt Frau Loppinet und alle Leiterinnen und Leiter zur heutigen Sitzung. Sie bittet um Genehmigung des Protokolls der letzten Sitzung. Nach Handzeichen wird das Protokoll der Sitzung vom 15.01. ohne weitere Änderungen und Ergänzungen genehmigt.\n\nTOP 2 Stand des Projekts „Fertigungsanlage“\nLM gibt einen Überblick zum Projekt „Fertigungsanlage“. Er berichtet über den Auftrag an eine Firma aus Italien, die bereits ähnliche Anlagen hergestellt und aufgebaut hat. Die italienische Firma kommt nächsten Monat, um sich vor Ort ein Bild von unseren Werkshallen II und IV zu machen, wo die Anlage stehen soll. Der genaue Termin steht noch nicht fest. Wenn Werkshalle II oder IV als geeignet erscheint, wird unmittelbar mit der Herstellung der Fertigungsanlage in Italien begonnen. Die Montage der Anlage ist dann einige Monate später. Wie geplant soll die neue Fertigungsanlage im folgenden Frühjahr betriebsbereit sein. Sollte keine der beiden Werkshallen für den Aufbau der Fertigungsanlage groß genug sein, müssten wir zuerst eine komplett neue Werkshalle auf dem südlichen Werksgelände errichten lassen. Dadurch könnte sich die Inbetriebnahme einer neuen Fertigungsanlage um mindestens 8 bis 9 Monate verschieben.\n\nTOP 3 Berichte\nGS berichtet über die ohne große Probleme laufende Produktion der Metallkästen und Metallgehäuse, die sehr nachgefragt sind. Bei noch größerer Nachfrage nach Metallgehäusen könnte jedoch die derzeitige Fertigungsanlage nicht ausreichen. GS freut sich daher über die Planung einer neuen Fertigungsanlage. PS legt neue Verkaufszahlen vor, die im letzten Quartal 20 Prozent über dem vergleichbaren Quartal des Vorjahrs liegen. Besonders die Metallgehäuse für den Hochbau zeigen sehr gute Verkaufszahlen. PS erwähnt hier einen großen Auftrag aus Kasachstan, der für das hohe Auftragsvolumen ausschlaggebend ist.\n\nTOP 4 Neue Mitarbeiterinnen und Mitarbeiter\nMN nennt die Namen von fünf neuen Mitarbeiterinnen und Mitarbeitern, drei Frauen und zwei Männern, die ab dem 1. des Monats im Betrieb in Vollzeit tätig sind.\n\nTOP 5 Update der Software\nWL spielt am kommenden Freitag ab 19 Uhr ein Software-Update auf unser Computersystem. Daher darf am Freitag ab 19 Uhr niemand am Computer arbeiten. Die leicht überarbeitete Software hat einige Neuerungen. Allen Mitarbeiterinnen und Mitarbeitern werden diese Neuerungen in einem halbtägigen Info-Workshop demonstriert. Es wird zeitversetzte Workshops geben. Die Termine dafür werden noch bekannt gegeben.\n\nTOP 6 Sonstiges\nML berichtet über den Stand der Planung eines Sommerfests, das etwas größer als in den vergangenen Jahren sein soll. Alle wichtigen Kunden und großen Lieferanten werden eingeladen. ML bittet alle Leiterinnen und Leiter, sich den 31. Juli freizuhalten. Der Ort steht auch schon fest. ML möchte ihn aber noch nicht nennen. Es soll eine Überraschung für alle sein, da der 31. Juli auch ihr 60. Geburtstag ist, den sie mit allen feiern möchte.", "items": [{"n": 14, "type": "choice", "prompt": "Das Protokoll", "options": [{"key": "a", "text": "der letzten Sitzung ist nach Überarbeitung genehmigt."}, {"key": "b", "text": "nennt die Teilnehmer der Januar-Sitzung."}, {"key": "c", "text": "wird heute von Frau Schäfer geschrieben."}], "answer": "c", "confidence": "hoch", "quote": "Protokollantin: Volha Schäfer", "explain": "Correcto c: el encabezado del documento indica expresamente que la redactora del acta actual es Volha Schäfer («Protokollantin: Volha Schäfer»). a es falso porque el acta de la sesión previa se aprobó sin enmiendas («ohne weitere Änderungen und Ergänzungen»); b es falso porque el acta lista los asistentes de la sesión presente de febrero, no los de enero."}, {"n": 15, "type": "choice", "prompt": "Die neue Fertigungsanlage", "options": [{"key": "a", "text": "kommt in die Werkshalle IV."}, {"key": "b", "text": "steht in einem Neubau."}, {"key": "c", "text": "wird in Italien gebaut."}], "answer": "c", "confidence": "hoch", "quote": "wird unmittelbar mit der Herstellung der Fertigungsanlage in Italien begonnen.", "explain": "Correcto c: la fabricación de la maquinaria se realiza en las instalaciones de la empresa adjudicataria en Italia («in Italien begonnen»). a es falso porque aún no se sabe si encajará en la nave II o en la IV; b es falso porque solo se construiría una nave nueva si las existentes resultaran insuficientes tras la inspección técnica."}, {"n": 16, "type": "choice", "prompt": "Metallkästen und Metallgehäuse", "options": [{"key": "a", "text": "lassen sich nur in Deutschland verkaufen."}, {"key": "b", "text": "sind eine Belastung für die Produktion."}, {"key": "c", "text": "zeigen steigende Verkaufszahlen."}], "answer": "c", "confidence": "hoch", "quote": "Besonders die Metallgehäuse für den Hochbau zeigen sehr gute Verkaufszahlen.", "explain": "Correcto c: las ventas trimestrales superaron en un 20 % las del año anterior y las carcasas metálicas registraron cifras excepcionales. a es falso porque destaca una gran venta internacional para Kazajistán; b es falso porque la producción discurre sin incidentes y con alta demanda."}, {"n": 17, "type": "choice", "prompt": "Das Update der Software", "options": [{"key": "a", "text": "erfordert ein neues Computersystem."}, {"key": "b", "text": "schließt einen eintägigen Workshop mit ein."}, {"key": "c", "text": "wird am Freitag installiert."}], "answer": "c", "confidence": "hoch", "quote": "WL spielt am kommenden Freitag ab 19 Uhr ein Software-Update auf unser Computersystem.", "explain": "Correcto c: la responsable de TI cargará la actualización el próximo viernes a partir de las 19:00 horas («am kommenden Freitag ab 19 Uhr ein Software-Update»). a es falso porque se actualiza el sistema existente; b es falso porque los talleres de formación para el personal son de media jornada («in einem halbtägigen Info-Workshop»), no de un día entero."}, {"n": 18, "type": "choice", "prompt": "Die Geschäftsführerin", "options": [{"key": "a", "text": "berichtet über Ort und Termin eines Sommerfests."}, {"key": "b", "text": "erwartet eine genaue Planung des Sommerfests."}, {"key": "c", "text": "möchte zum Sommerfest Kunden und Lieferanten einladen."}], "answer": "c", "confidence": "hoch", "quote": "Alle wichtigen Kunden und großen Lieferanten werden eingeladen.", "explain": "Correcto c: la directora general (Maria Loppinet) informa de que se cursará invitación a los clientes y proveedores más relevantes para la fiesta de verano. a es falso porque mantiene en secreto el lugar de celebración como sorpresa de su 60 cumpleaños; b no se ajusta a lo tratado en la reunión."}]}]}, {"id": "lesen-us", "title": "Lesen und Schreiben (Lesen)", "variants": [{"id": "ls_a-p66a", "label": "Beschwerde – Variante 1 (Putzdienst)", "page": 66, "topic": "Putzdienst / Reinigung", "note": "La p. 66 trae el ítem 20 dos veces: esta primera formulación y la marcada «Новый вариант от 21.12.24» (→ ls_a-p66b). En el PDF la opción a de este ítem aparece con dos formulaciones separadas por «/» («hält die Arbeitszeit ein. / hat flexible Einsatzzeiten.»); se reproduce la primera, que es justamente la que la nueva versión niega («hält die Arbeitszeit nicht ein»).", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrte Frau Woller,\n\nleider muss ich mich heute mit einer Beschwerde an Sie wenden. Wir haben einen Vertrag mit Ihrer Firma für die Reinigung unserer Büroräume. In diesem Vertrag sind täglich 3 Stunden Arbeit bei uns festgelegt, und zwar von 6.00 Uhr bis 9.00 Uhr morgens.\n\nIn den letzten zwei Wochen war unsere Sekretärin einige Male bereits vor 9 Uhr im Büro, von Ihrem Putzdienst war aber niemand zu sehen. Wie kann das sein?\n\nWenn wir 3 Stunden bezahlen, erwarten wir auch, dass Ihr Personal drei Stunden bei uns arbeitet. Wenn Sie für die Reinigung unserer Räume weniger als die vereinbarte Zeit benötigen, sollten Sie uns darüber informieren, damit wir den Vertrag ändern.\n\nIch bitte um umgehende Stellungnahme und natürlich die Angleichung der Rechnung an die tatsächlich geleisteten Arbeitsstunden.\n\nMit freundlichen Grüßen\nTheo Lassner", "items": [{"n": 19, "type": "choice", "prompt": "Herr Lassner", "options": [{"key": "a", "text": "möchte seine Rechnung nicht begleichen."}, {"key": "b", "text": "ist mit der Sauberkeit im Büro nicht zufrieden."}, {"key": "c", "text": "will nur die geleisteten Stunden bezahlen."}], "answer": "c", "confidence": "hoch", "quote": "Ich bitte um umgehende Stellungnahme und natürlich die Angleichung der Rechnung an die tatsächlich geleisteten Arbeitsstunden.", "explain": "Correcto c: Lassner no se niega a pagar, sino que pide que la factura se ajuste a las horas realmente trabajadas. a es falso porque no rechaza el pago, solo quiere que se corrija el importe; b también es falso porque su queja no es la calidad de la limpieza, sino que el personal no aparece en el horario acordado."}, {"n": 20, "type": "choice", "prompt": "Der Putzdienst", "options": [{"key": "a", "text": "hält die Arbeitszeit ein."}, {"key": "b", "text": "hat zu wenig Stunden gearbeitet."}, {"key": "c", "text": "möchte einen neuen Vertrag."}], "answer": "b", "confidence": "mittel", "quote": "In den letzten zwei Wochen war unsere Sekretärin einige Male bereits vor 9 Uhr im Büro, von Ihrem Putzdienst war aber niemand zu sehen.", "explain": "Correcto b: la carta da por hecho que el servicio de limpieza trabaja menos de las tres horas contratadas, pues no estaba antes de las 9 y el cliente exige «die Angleichung der Rechnung an die tatsächlich geleisteten Arbeitsstunden». a es falso porque precisamente se queja de que no respetan el horario acordado; c es falso porque quien quiere cambiar el contrato es el propio Lassner, no la empresa de limpieza. Confianza media porque la carta no cifra cuántas horas se trabajaron de menos: se deduce del conjunto de la queja."}]}, {"id": "ls_a-p66b", "label": "Beschwerde – Variante 1 (Putzdienst) – Новый вариант от 21.12.24", "page": 66, "topic": "Putzdienst / Reinigung", "note": "Fassung «Новый вариант от 21.12.24» del ítem 20 sobre la misma carta de la p. 66 (el PDF no repite el texto): solo cambia la opción a, que pasa a ser negativa y es ahora la clave. El ítem 19 se mantiene idéntico al de ls_a-p66a.", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrte Frau Woller,\n\nleider muss ich mich heute mit einer Beschwerde an Sie wenden. Wir haben einen Vertrag mit Ihrer Firma für die Reinigung unserer Büroräume. In diesem Vertrag sind täglich 3 Stunden Arbeit bei uns festgelegt, und zwar von 6.00 Uhr bis 9.00 Uhr morgens.\n\nIn den letzten zwei Wochen war unsere Sekretärin einige Male bereits vor 9 Uhr im Büro, von Ihrem Putzdienst war aber niemand zu sehen. Wie kann das sein?\n\nWenn wir 3 Stunden bezahlen, erwarten wir auch, dass Ihr Personal drei Stunden bei uns arbeitet. Wenn Sie für die Reinigung unserer Räume weniger als die vereinbarte Zeit benötigen, sollten Sie uns darüber informieren, damit wir den Vertrag ändern.\n\nIch bitte um umgehende Stellungnahme und natürlich die Angleichung der Rechnung an die tatsächlich geleisteten Arbeitsstunden.\n\nMit freundlichen Grüßen\nTheo Lassner", "items": [{"n": 19, "type": "choice", "prompt": "Herr Lassner", "options": [{"key": "a", "text": "möchte seine Rechnung nicht begleichen."}, {"key": "b", "text": "ist mit der Sauberkeit im Büro nicht zufrieden."}, {"key": "c", "text": "will nur die geleisteten Stunden bezahlen."}], "answer": "c", "confidence": "hoch", "quote": "Ich bitte um umgehende Stellungnahme und natürlich die Angleichung der Rechnung an die tatsächlich geleisteten Arbeitsstunden.", "explain": "Correcto c: pide que la factura se adapte a las horas efectivamente trabajadas, es decir, pagar solo lo realmente prestado. a es falso porque no se niega a pagar, solo quiere el ajuste; b es falso porque la carta no critica la calidad de la limpieza, sino el incumplimiento del horario."}, {"n": 20, "type": "choice", "prompt": "Der Putzdienst", "options": [{"key": "a", "text": "hält die Arbeitszeit nicht ein."}, {"key": "b", "text": "hat zu wenig Zeit."}, {"key": "c", "text": "möchte einen neuen Vertrag."}], "answer": "a", "confidence": "hoch", "quote": "In den letzten zwei Wochen war unsere Sekretärin einige Male bereits vor 9 Uhr im Büro, von Ihrem Putzdienst war aber niemand zu sehen.", "explain": "Correcto a: el contrato fija el trabajo de 6.00 a 9.00 horas y la carta afirma que en dos semanas varias veces no había nadie del servicio de limpieza antes de las 9, luego no cumple el horario pactado. b es falso porque el texto no habla de falta de tiempo del personal, sino de su ausencia en la franja acordada; c es falso porque el cambio de contrato lo plantea el cliente, no la empresa de limpieza."}]}, {"id": "ls_a-p67", "label": "Beschwerde – Variante 2 (Tischlampe)", "page": 67, "topic": "Tischlampe", "note": "Esta carta reaparece en la p. 68 como «Новая версия от 08.2024 и от 07.02.2025» con la clienta, el destinatario, la cantidad de lámparas y la hora límite cambiados, y con el ítem 19 reformulado (→ ls_a-p68).", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrter Herr Richter,\n\nvergangene Woche habe ich bei Ihnen 25 Tischlampen Modell TS 13 150 07 für unsere neuen Büroräume bestellt. Mir wurde telefonisch zugesagt, dass die Lampen noch diese Woche geliefert werden, aber jetzt ist schon Freitagnachmittag und sie sind leider noch immer nicht eingetroffen.\n\nDas ist ärgerlich, da wir am Wochenende unsere Renovierungsarbeiten beenden und die Büros dann vollständig neu einrichten werden. Dazu wurden natürlich auch die Lampen gehören, da wir am Montag unseren Bürobetrieb in funktionstüchtigen Räumen wieder aufnehmen wollen. Ich habe bereits mehrfach versucht, Sie telefonisch zu erreichen, und habe Nachrichten auf Ihrem Anrufbeantworter hinterlassen, aber ich wurde leider nicht zurückgerufen. Inzwischen habe ich einen Lieferanten gefunden, der uns kurzfristig andere Tischlampen liefern könnte.\n\nWenn Ihre Lampen also bis Montagmittag, 13:00 Uhr, nicht bei uns eingetroffen sind, werde ich die Bestellung bei Ihnen stornieren. Ich bitte um eine schnelle Antwort!\n\nMit freundlichen Grüßen\nEvelyn Berger", "items": [{"n": 19, "type": "choice", "prompt": "Frau Berger", "options": [{"key": "a", "text": "beschwert sich über die Qualität des Produktes."}, {"key": "b", "text": "hat eine fehlerhafte Lieferung erhalten."}, {"key": "c", "text": "wartet dringend auf die Lieferung."}], "answer": "c", "confidence": "hoch", "quote": "Mir wurde telefonisch zugesagt, dass die Lampen noch diese Woche geliefert werden, aber jetzt ist schon Freitagnachmittag und sie sind leider noch immer nicht eingetroffen.", "explain": "Correcto c: la clienta sigue esperando las lámparas, que no han llegado, y las necesita el lunes, por eso pide una respuesta rápida. a es falso porque no ha recibido el producto y no se pronuncia sobre su calidad; b también es falso porque no ha llegado ninguna entrega defectuosa: no ha llegado nada."}, {"n": 20, "type": "choice", "prompt": "Die Renovierungsarbeiten", "options": [{"key": "a", "text": "stehen kurz bevor."}, {"key": "b", "text": "verzögern sich."}, {"key": "c", "text": "sollen zeitnah abgeschlossen werden."}], "answer": "c", "confidence": "hoch", "quote": "Das ist ärgerlich, da wir am Wochenende unsere Renovierungsarbeiten beenden und die Büros dann vollständig neu einrichten werden.", "explain": "Correcto c: la carta anuncia que las obras se terminan ese mismo fin de semana, es decir, deben quedar concluidas en breve. a es falso porque las obras están ya en su fase final, no por empezar; b también es falso porque lo que se retrasa es la entrega de las lámparas, no las obras, que siguen su plan para el fin de semana."}]}, {"id": "ls_a-p68", "label": "Beschwerde – Variante 2 (Tischlampe) – Новая версия от 08.2024 и от 07.02.2025", "page": 68, "topic": "Tischlampe", "note": "Nueva versión de la carta de la p. 67 (el PDF la marca «Новая версия от 08.2024 и от 07.02.2025»): cambian la clienta (Berger → Lutz), el destinatario (Knut Richter → Elias Philips), la cantidad de lámparas (25 → 15) y la hora límite (13:00 → 12:00); el ítem 19 se reformula y cambia de clave, mientras que el ítem 20 es idéntico al de ls_a-p67. En el PDF la carta empieza directamente por el saludo, sin repetir el encabezado «Beschwerde».", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrter Herr Phillips,\n\nvergangene Woche habe ich bei Ihnen 15 Tischlampen Modell TS 13 150 07 für unsere neuen Büroräume bestellt. Mir wurde telefonisch zugesagt, dass die Lampen noch diese Woche geliefert werden, aber jetzt ist schon Freitagnachmittag und sie sind leider noch immer nicht eingetroffen.\n\nDas ist sehr ärgerlich, da wir am Wochenende unsere Renovierungsarbeiten beenden und die Büros dann vollständig neu einrichten werden. Dazu wurden natürlich auch die Lampen gehören, da wir am Montag unseren Bürobetrieb in funktionstüchtigen Räumen wieder aufnehmen wollen.\n\nIch habe bereits mehrfach versucht, Sie telefonisch zu erreichen, und habe Nachrichten auf Ihrem Anrufbeantworter hinterlassen, aber ich wurde leider nicht zurückgerufen. Inzwischen habe ich einen Lieferanten gefunden, der uns kurzfristig andere Tischlampen liefern könnte.\n\nWenn Ihre Lampen also bis Montagmittag, 12:00 Uhr, nicht bei uns eingetroffen sind, werde ich die Bestellung bei Ihnen stornieren. Ich bitte um eine schnelle Antwort!\n\nMit freundlichen Grüßen\nBetta Lutz", "items": [{"n": 19, "type": "choice", "prompt": "Frau Lutz", "options": [{"key": "a", "text": "erwartet eine umgehende Rückmeldung."}, {"key": "b", "text": "möchte ein anderes Lampenmodell."}, {"key": "c", "text": "storniert den Auftrag."}], "answer": "a", "confidence": "hoch", "quote": "Ich bitte um eine schnelle Antwort!", "explain": "Correcto a: la clienta cierra su carta pidiendo una respuesta rápida, es decir, espera una reacción inmediata de la empresa. b es falso porque ella no pide otro modelo: lo que dice es que ha encontrado a otro proveedor que podría servirle otras lámparas; c es falso porque la cancelación es solo un anuncio condicional, para el caso de que las lámparas no lleguen antes del lunes a mediodía."}, {"n": 20, "type": "choice", "prompt": "Die Renovierungsarbeiten", "options": [{"key": "a", "text": "stehen kurz bevor."}, {"key": "b", "text": "verzögern sich."}, {"key": "c", "text": "sollen zeitnah abgeschlossen werden."}], "answer": "c", "confidence": "hoch", "quote": "Das ist sehr ärgerlich, da wir am Wochenende unsere Renovierungsarbeiten beenden und die Büros dann vollständig neu einrichten werden.", "explain": "Correcto c: también en esta versión la carta afirma que las obras se acaban ese fin de semana, luego deben quedar terminadas en breve. a es falso porque las obras ya están en marcha y casi listas; b es falso porque lo que se retrasa es la entrega de las lámparas, no las obras, que mantienen su plan para el fin de semana."}]}, {"id": "ls_a-p69", "label": "Beschwerde – Variante 3 (Website)", "page": 69, "topic": "Website", "note": "El ítem 20 se refiere a lo que sostiene la agencia y solo puede justificarse con el correo interno de su responsable (Jutta Spindler → Frau Holsten), que NO se incluye en el pasaje, porque pertenece a la tarea de escritura (ítem 21), fuera de este bloque; de ahí la confianza media y que su cita proceda de la carta del cliente. En el PDF el esquema de color aparece con dos formulaciones alternativas entre paréntesis («grau orange (grün blau)» y «Grau Blau (Grün Grau)»), que se reproducen tal cual.", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrte Frau Spindler,\n\nvielen Dank für Ihren Entwurf für unsere neue Firmenwebsite. Ich habe ihn gemeinsam mit dem Team gesichtet und dabei ist uns aufgefallen, dass Ihre Agentur die Vorgaben an zwei Stellen leider nicht umgesetzt hat:\n\nZum einen hatten wir besprochen, dass das Farbschema grau orange (grün blau) sein sollte. Da statt Grau Blau (Grün Grau) gewählt wurde, glaube ich, dass es zu einem Missverständnis gekommen ist. Zum anderen sind auf der Seite mit den Ansprechpartnern die Namen einiger Mitarbeiter vertauscht worden. Im Anhang schicke ich Ihnen noch einmal eine Auflistung der Namen mit den dazugehörigen Bildern. Könnten Sie diese beide Punkte bitte bis Anfang nächster Woche nachbessern? Eine kurze Rückmeldung wäre nett.\n\nMit freundlichen Grüßen\nFranz Stiller", "items": [{"n": 19, "type": "choice", "prompt": "Herr Stiller", "options": [{"key": "a", "text": "ist mit dem Entwurf der Agentur nicht einverstanden."}, {"key": "b", "text": "möchte, dass Frau Spindler sich einen Entwurf ansieht."}, {"key": "c", "text": "möchte wissen, wer den Entwurf überarbeiten kann."}], "answer": "a", "confidence": "hoch", "quote": "Ich habe ihn gemeinsam mit dem Team gesichtet und dabei ist uns aufgefallen, dass Ihre Agentur die Vorgaben an zwei Stellen leider nicht umgesetzt hat", "explain": "Correcto a: Stiller ha revisado el borrador con su equipo y comprueba que la agencia no aplicó sus indicaciones en dos puntos (el color y los nombres), luego no está conforme con el resultado. b es falso porque no pide a Frau Spindler que mire un borrador, sino que corrija el suyo; c es falso porque no pregunta quién puede rehacerlo, sino que se lo pide directamente a la agencia."}, {"n": 20, "type": "choice", "prompt": "Die Agentur sagt, dass sie", "options": [{"key": "a", "text": "Änderungen nur gegen Aufpreis macht."}, {"key": "b", "text": "keine Fehler gemacht hat."}, {"key": "c", "text": "keine Vorgaben von Herrn Stiller hatte."}], "answer": "a", "confidence": "mittel", "quote": "Zum anderen sind auf der Seite mit den Ansprechpartnern die Namen einiger Mitarbeiter vertauscht worden.", "explain": "Correcto a por eliminación: el correo interno de la agencia, que no forma parte del texto de lectura, dice literalmente «Wenn wir das noch machen sollten, geht das nur gegen zusätzliche Bezahlung.». b es falso porque en ese mismo correo la agencia reconoce el error de los nombres («Die vertauschten Namen sind unser Fehler und die verbessern wir auch.»); c es falso porque la carta demuestra que sí había indicaciones —la agencia no las aplicó en dos puntos— y el correo insiste en que siempre se atuvieron a ellas («obwohl wir uns immer an die Vorgaben gehalten haben»). La cita es de la carta del cliente porque la justificación directa está en el correo interno, fuera del texto de lectura; de ahí la confianza media."}]}, {"id": "ls_b-p70", "label": "Beschwerde – Variante 4 (Spülmaschine)", "topic": "Spülmaschine", "page": 70, "note": "El bloque de la p. 70 incluye un correo interno previo (Dorothee Sturm encarga enviar un técnico y responder disculpándose): pertenece a la tarea de escritura (ítem 21) y se excluye del passage. Las preguntas 19 y 20 se resuelven íntegramente con la carta de reclamación de Claudio Krüger.", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrte Frau Sturm,\n\nvor einer Woche haben wir bei Ihnen eine Spülmaschine für unsere Teeküche gekauft. Sie wurde sehr schnell geliefert und auch gleich eingebaut. Leider muss ich Ihnen heute aber mitteilen, dass sie bereits defekt ist. Beim Spülen ist Wasser ausgelaufen und nun ist unser Parkett beschädigt.\n\nIch bitte Sie, uns umgehend einen Techniker zu schicken, der das Gerät repariert. Wir brauchen die Spülmaschine spätestens übermorgen, da wir ein großes Meeting unserer Außendienstmitarbeiter haben und viele Personen bewirten müssen.\n\nAußerdem müssen wir einen Teil des Parketts austauschen. Die Kosten dafür werden wir Ihnen in Rechnung stellen.\n\nBitte schicken Sie mir so schnell wie möglich einer Terminvorschlag für die Reparatur und eine Bestätigung der Kostenübernahme. Vielen Dank!\n\nMit freundlichen Grüßen\nClaudio Krüger", "items": [{"n": 19, "type": "choice", "prompt": "Der Kunde", "options": [{"key": "a", "text": "fordert eine neue Spülmaschine."}, {"key": "b", "text": "hat einen Wasserschaden in der Küche."}, {"key": "c", "text": "beschwert sich über die Reparaturarbeiten."}], "answer": "b", "confidence": "hoch", "quote": "Beim Spülen ist Wasser ausgelaufen und nun ist unser Parkett beschädigt.", "explain": "Correcto b: el lavavajillas derramó agua durante el lavado y dañó el parqué de la cocina («Beim Spülen ist Wasser ausgelaufen und nun ist unser Parkett beschädigt»), es decir, se produjo un daño por agua (Wasserschaden). a es falso porque no pide una máquina nueva sino la reparación de la existente («der das Gerät repariert»); c es falso porque aún no se han hecho reparaciones, la queja es por la avería de la máquina recién instalada."}, {"n": 20, "type": "choice", "prompt": "Die Firma Küchenbedarf soll", "options": [{"key": "a", "text": "die Reparatur der Spülmaschine in Rechnung stellen."}, {"key": "b", "text": "innerhalb von zwei Tagen die Spülmaschine reparieren."}, {"key": "c", "text": "das Parkett in der Teeküche umgehend ersetzen."}], "answer": "b", "confidence": "hoch", "quote": "Wir brauchen die Spülmaschine spätestens übermorgen, da wir ein großes Meeting unserer Außendienstmitarbeiter haben und viele Personen bewirten müssen.", "explain": "Correcto b: el cliente necesita el aparato reparado a más tardar pasado mañana («spätestens übermorgen»), es decir, en un plazo de dos días, para una reunión importante. a es falso porque no pide que le cobren la reparación, sino una garantía de reparación y asunción de costes; c es falso porque la sustitución del parqué la gestionan ellos mismos y le pasarán la factura a la empresa («müssen wir einen Teil des Parketts austauschen. Die Kosten dafür werden wir Ihnen in Rechnung stellen»)."}]}, {"id": "ls_b-p71a", "label": "Beschwerde – Variante 5 (Umzug – Fassung 1, Thomas Zaun)", "topic": "Umzug", "page": 71, "note": "La p. 71 presenta la reclamación de la mudanza de Hanau a Fráncfort con dos formulaciones de preguntas (Fassung 1: Thomas Zaun / Börne; Fassung 2: Matteo Lozano / Prince). El correo interno de Frieda Börne se omite por pertenecer a la tarea de redacción.", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrte Frau Börne,\n\nam Wochenende ist unser Büro mit Hilfe Ihres Unternehmens von Hanau nach Frankfurt umgezogen. Leider waren wir mit Ihrem Service überhaupt nicht zufrieden.\n\nIhre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert. Deshalb dauerte der ganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen: Es sind noch nicht alle Möbel aufgebaut, deshalb konnten wir noch nicht unsere Sachen einräumen.\n\nBitte schicken Sie uns deshalb am Mittwochmorgen noch zwei Personen, die den Möbelaufbau erledigen. Des Weiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt.\n\nMit freundlichen Grüßen\nThomas Zaun", "items": [{"n": 19, "type": "choice", "prompt": "Herr Zaun beschwert sich über", "options": [{"key": "a", "text": "die Mitarbeiter der Firma."}, {"key": "b", "text": "die Qualität von Produkten."}, {"key": "c", "text": "eine ausbleibende Lieferung."}], "answer": "a", "confidence": "hoch", "quote": "Ihre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert.", "explain": "Correcto a: se queja de la impuntualidad y la falta de personal del equipo de mudanza («Ihre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert») así como de los desperfectos que ocasionaron. b es falso porque no se trata de productos sino de un servicio de mudanza; c es falso porque no falta una entrega, la mudanza se realizó pero con retraso y daños."}, {"n": 20, "type": "choice", "prompt": "Herr Zaun", "options": [{"key": "a", "text": "ist nach Hanau gezogen."}, {"key": "b", "text": "musste seinen Umzug verschieben."}, {"key": "c", "text": "verlangt Schadensersatz."}], "answer": "c", "confidence": "hoch", "quote": "Des Weiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt.", "explain": "Correcto c: exige que la empresa asuma el coste de los cristales rotos y muebles rayados («dass Ihre Firma die Kosten dafür übernimmt»), lo que equivale a reclamar una indemnización por daños (Schadensersatz). a es falso porque se mudaron DE Hanau A Fráncfort («von Hanau nach Frankfurt umgezogen»), no hacia Hanau; b es falso porque la mudanza se llevó a cabo el fin de semana, no se aplazó."}]}, {"id": "ls_b-p71b", "label": "Beschwerde – Variante 5 (Umzug – Fassung 2, Matteo Lozano)", "topic": "Umzug", "page": 71, "note": "Segunda formulación de preguntas de la p. 71 («второй вариант вопросов»), con los nombres alternativos (Matteo Lozano, Sophia Prince) anotados en el original.", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrte Frau Prince,\n\nam Wochenende ist unser Büro mit Hilfe Ihres Unternehmens von Hanau nach Frankfurt umgezogen. Leider waren wir mit Ihrem Service überhaupt nicht zufrieden.\n\nIhre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert. Deshalb dauerte der ganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen: Es sind noch nicht alle Möbel aufgebaut, deshalb konnten wir noch nicht unsere Sachen einräumen.\n\nBitte schicken Sie uns deshalb am Mittwochmorgen noch zwei Personen, die den Möbelaufbau erledigen. Des Weiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt.\n\nMit freundlichen Grüßen\nMatteo Lozano", "items": [{"n": 19, "type": "choice", "prompt": "Beim Umzug", "options": [{"key": "a", "text": "haben vier Möbelpacker gearbeitet."}, {"key": "b", "text": "kam es zu Verzögerungen."}, {"key": "c", "text": "wurden nicht alle Möbel transportiert."}], "answer": "b", "confidence": "hoch", "quote": "Deshalb dauerte der ganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen:", "explain": "Correcto b: la mudanza sufrió demoras («dauerte der ganze Umzug natürlich länger als geplant») debido a que los operarios llegaron media hora tarde y eran tres en vez de cuatro. a es falso porque trabajaron tres mozos («nur zu dritt statt wie vereinbart zu viert»); c es falso porque los muebles se transportaron todos, lo que quedó pendiente fue el montaje («Es sind noch nicht alle Möbel aufgebaut»)."}, {"n": 20, "type": "choice", "prompt": "Herr Lozano", "options": [{"key": "a", "text": "musste seinen Umzug verschieben."}, {"key": "b", "text": "verlangt Schadensersatz."}, {"key": "c", "text": "ist nach Hanau gezogen."}], "answer": "b", "confidence": "hoch", "quote": "Des Weiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt.", "explain": "Correcto b: reclama que la empresa cubra los costes de los daños causados en cristales y armarios («Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt»), es decir, indemnización por daños. a es falso porque la mudanza se ejecutó durante el fin de semana; c es falso porque el traslado fue de Hanau a Fráncfort."}]}, {"id": "ls_b-p72a", "label": "Beschwerde – Variante 6 (Der Drucker – Fassung 1)", "topic": "Der Drucker", "page": 72, "note": "La p. 72 presenta la reclamación de Benno Schmidt sobre un copiador averiado con dos juegos de preguntas alternativos en el PDF. En el ítem 20 (Die Firma Copyprofi), la opción a («besteht auf der Bezahlung der Rechnungen») refleja la respuesta dada en el correo interno de Sibyl Aichele («Die Kosten für die Überprüfung des Geräts bleiben die Angelegenheit der Mova GmbH»); como dicho correo pertenece a la tarea de redacción y queda fuera del passage, la confianza se marca como «mittel».", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrte Frau Aichele,\n\nvorgestern wurde von einem Ihrer Mitarbeiter unser fast neues Druck- und Kopiergerät der Marke Lexios zum dritten Mal innerhalb von zwei Wochen geprüft, da bei diesem immer wieder Papierstaus aufgetreten sind. Gestern kam es schon wieder zu einer Fehlermeldung, was zur Folge hatte, dass wir Unterlagen nicht fristgerecht einreichen konnten. Aus diesem Grund haben wir eine für uns sehr wichtige Ausschreibung verpasst. Von einer Schadensersatzforderung sehen wir vorerst ab, wir fordern Sie aber auf, uns umgehend auf Ihre Kosten ein anderes Gerät zu liefern. Es handelt sich hier nämlich eindeutig um einen technischen Fehler, den wir nicht zu verantworten haben. Die Rechnungen für die drei vorangegangenen Technikereinsätze werden wir natürlich nicht bezahlen.\n\nIch erwarte Ihre umgehende Rückmeldung.\n\nMit freundlichen Grüßen\nBenno Schmidt", "items": [{"n": 19, "type": "choice", "prompt": "Das Gerät", "options": [{"key": "a", "text": "ist erst seit Kurzem im Einsatz."}, {"key": "b", "text": "muss noch mal überprüft werden."}, {"key": "c", "text": "wurde immer richtig bedient."}], "answer": "a", "confidence": "hoch", "quote": "vorgestern wurde von einem Ihrer Mitarbeiter unser fast neues Druck- und Kopiergerät der Marke Lexios zum dritten Mal innerhalb von zwei Wochen geprüft, da bei diesem immer wieder Papierstaus aufgetreten sind.", "explain": "Correcto a: el aparato es «fast neu» (casi nuevo) y ha sido revisado tres veces en dos semanas, lo que indica que lleva poco tiempo en funcionamiento en la oficina. b es falso porque el cliente no pide otra revisión sino la sustitución inmediata por otra máquina («ein anderes Gerät zu liefern»); c no es seguro porque el servicio técnico achaca los fallos al mal uso."}, {"n": 20, "type": "choice", "prompt": "Die Firma Copyprofi", "options": [{"key": "a", "text": "besteht auf der Bezahlung der Rechnungen."}, {"key": "b", "text": "repariert den Kopierer noch einmal kostenfrei."}, {"key": "c", "text": "tauscht das Gerät schnellstmöglich aus."}], "answer": "a", "confidence": "mittel", "quote": "Die Rechnungen für die drei vorangegangenen Technikereinsätze werden wir natürlich nicht bezahlen.", "explain": "Correcto a: el cliente rechaza pagar las tres facturas anteriores («werden wir natürlich nicht bezahlen») y la empresa Copyprofi insiste en que las abone (en el correo interno: «Die Kosten für die Überprüfung des Geräts bleiben die Angelegenheit der Mova GmbH»). Confianza media porque la confirmación explícita de la postura de la empresa está en la nota interna excluida del texto de lectura. b y c son falsos: la empresa no cambia el equipo ni ofrece repararlo gratis, solo una sesión formativa al personal."}]}, {"id": "ls_b-p72b", "label": "Beschwerde – Variante 6 (Der Drucker – Fassung 2)", "topic": "Der Drucker", "page": 72, "note": "Segunda formulación de preguntas de la p. 72 («второй вариант вопросов»): ítems centrados en el problema de atascos y la exigencia de sustitución del equipo.", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrte Frau Aichele,\n\nvorgestern wurde von einem Ihrer Mitarbeiter unser fast neues Druck- und Kopiergerät der Marke Lexios zum dritten Mal innerhalb von zwei Wochen geprüft, da bei diesem immer wieder Papierstaus aufgetreten sind. Gestern kam es schon wieder zu einer Fehlermeldung, was zur Folge hatte, dass wir Unterlagen nicht fristgerecht einreichen konnten. Aus diesem Grund haben wir eine für uns sehr wichtige Ausschreibung verpasst. Von einer Schadensersatzforderung sehen wir vorerst ab, wir fordern Sie aber auf, uns umgehend auf Ihre Kosten ein anderes Gerät zu liefern. Es handelt sich hier nämlich eindeutig um einen technischen Fehler, den wir nicht zu verantworten haben. Die Rechnungen für die drei vorangegangenen Technikereinsätze werden wir natürlich nicht bezahlen.\n\nIch erwarte Ihre umgehende Rückmeldung.\n\nMit freundlichen Grüßen\nBenno Schmidt", "items": [{"n": 19, "type": "choice", "prompt": "Beim Gerät", "options": [{"key": "a", "text": "handelt sich um ein älteres Modell."}, {"key": "b", "text": "kommt es häufig zu Papierstaus."}, {"key": "c", "text": "wurde es nur einmal überprüft."}], "answer": "b", "confidence": "hoch", "quote": "da bei diesem immer wieder Papierstaus aufgetreten sind.", "explain": "Correcto b: el cliente señala que la máquina sufre atascos de papel continuos («immer wieder Papierstaus aufgetreten sind»). a es falso porque es un aparato casi nuevo («fast neues … Gerät»), no un modelo antiguo; c es falso porque ya se inspeccionó tres veces en dos semanas («zum dritten Mal innerhalb von zwei Wochen geprüft»)."}, {"n": 20, "type": "choice", "prompt": "Herr Schmidt", "options": [{"key": "a", "text": "verlangt die Lieferung eines neuen Geräts."}, {"key": "b", "text": "möchte weitere Technikertermine vereinbaren."}, {"key": "c", "text": "akzeptiert die bisherigen Rechnungen."}], "answer": "a", "confidence": "hoch", "quote": "wir fordern Sie aber auf, uns umgehend auf Ihre Kosten ein anderes Gerät zu liefern.", "explain": "Correcto a: el cliente exige formalmente que le entreguen otro aparato de sustitución a cargo de la empresa proveedora («fordern Sie aber auf, uns umgehend auf Ihre Kosten ein anderes Gerät zu liefern»). b es falso porque rechaza más revisiones técnicas que no solucionan el fallo; c es falso porque se niega rotundamente a pagar las facturas de las intervenciones previas («werden wir natürlich nicht bezahlen»)."}]}, {"id": "ls_c-p74", "label": "Beschwerde – Variante 7 (Falsche Rechnung)", "topic": "Falsche Rechnung", "page": 74, "note": "El bloque de la p. 74 empieza con un correo interno (Anna Hoffner encarga la respuesta al cliente): ese correo pertenece a la tarea de escritura (ítem 21) y por eso NO forma parte del passage. La instrucción final del original «Nummer 21 Schreiben Sie eine E-Mail an den Kunden.» también pertenece a esa tarea de escritura y no se recoge en ningún enunciado.", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrte Frau Hoffner,\n\nwir haben Ihre Lieferung erhalten und sind mit allen Artikeln absolut zufrieden. Leider muss ich Sie darauf hinweisen, dass die Rechnung einige Unstimmigkeiten beinhaltet: Zunächst wurden statt 100 Stück Pinsel Größe M 200 Stück berechnet. Außerdem wurden 20 Töpfe roter Farbe berechnet. Wir hatten aber grüne Farbe bestellt und geliefert bekommen, die preislich niedriger liegt. Wir bitten Sie, dies zu korrigieren. Des Weiteren waren wir überrascht, dass unser üblicher Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Das ist wahrscheinlich ein Versehen.\n\nWir bitten um Berichtigung der Rechnung und erneute Zusendung.\n\nMit freundlichen Grüßen\nKarl Schmidt", "items": [{"n": 19, "type": "choice", "prompt": "Herr Schmidt", "options": [{"key": "a", "text": "hat falsche Waren vom Lieferanten erhalten."}, {"key": "b", "text": "meldet eine unvollständige Sendung."}, {"key": "c", "text": "weist auf falsche Posten in der Zahlungsaufforderung hin."}], "answer": "c", "confidence": "hoch", "quote": "Leider muss ich Sie darauf hinweisen, dass die Rechnung einige Unstimmigkeiten beinhaltet: Zunächst wurden statt 100 Stück Pinsel Größe M 200 Stück berechnet.", "explain": "Correcto c: la «Zahlungsaufforderung» es la Rechnung, y el cliente señala en ella partidas equivocadas (200 pinceles cobrados en lugar de 100; 20 botes de pintura roja facturados aunque se pidió y se recibió verde). a es falso porque la mercancía recibida sí es la correcta: «sind mit allen Artikeln absolut zufrieden» y la pintura verde se «bestellt und geliefert bekommen». b es falso porque no falta nada en el envío; lo incorrecto son los importes de la factura."}, {"n": 20, "type": "choice", "prompt": "Die Rechnung", "options": [{"key": "a", "text": "hat 100 Pinsel nicht aufgeführt."}, {"key": "b", "text": "ist ohne Preisnachlass ausgestellt worden."}, {"key": "c", "text": "wurde an einen falschen Adressaten geschickt."}], "answer": "b", "confidence": "hoch", "quote": "Des Weiteren waren wir überrascht, dass unser üblicher Rabatt von 10 % in dieser Rechnung nicht gewährt wurde.", "explain": "Correcto b: la factura se emitió sin el descuento habitual del 10 %, es decir, sin Preisnachlass. a es falso porque los pinceles sí aparecen, solo que con 200 unidades en vez de 100. c es falso porque no hay ningún destinatario equivocado: la carta va dirigida a Frau Hoffner y trata de su propio pedido."}]}, {"id": "ls_c-p75", "label": "Beschwerde – Die falsche Rechnung (Fassung 2, p. 75)", "topic": "Falsche Rechnung", "page": 75, "note": "Segunda versión del mismo caso de la p. 74, con nombres y cifras cambiados (Joachim Schmidt, Sonja, Firma «Lacke und Farben», Frau Klein, 50 Töpfe, Größe S): es una variante independiente, igual que sus ítems. La respuesta del ítem 20 (c: Computerprobleme) NO se puede deducir de la carta: los problemas informáticos solo se mencionan en el correo interno del jefe («Du kannst ihm ruhig von unseren Computerproblemen berichten»), que pertenece a la tarea de escritura y queda fuera del passage; por eso la confianza baja a «mittel». El ítem 19 sí se resuelve con la propia carta.", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrte Frau Klein,\n\nwir haben Ihre Lieferung wie gewohnt zu unserer vollsten Zufriedenheit erhalten. Alle Artikel entsprechen absolut unseren Vorstellungen.\n\nLeider muss ich Sie darauf hinweisen, dass in der beigelegten Rechnung einige Unstimmigkeiten aufgetreten sind. Zunächst wurden statt der 100 Stück Pinsel Größe S 200 Stück berechnet. Außerdem wurden 50 Töpfe rote Farbe aufgeführt. Wir hatten aber grüne Farbe bestellt und geliefert bekommen, die preislich niedriger liegt. Wir bitten das zu korrigieren. Ferner waren wir verwundert, dass uns der übliche Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Dies ist wahrscheinlich ein Versehen.\n\nWir bitten um Berichtigung der Rechnung und erneute Zusendung.\n\nMit freundlichen Grüßen\nJoachim Schmidt", "items": [{"n": 19, "type": "choice", "prompt": "Der Kunde Joachim Schmidt", "options": [{"key": "a", "text": "ist ein neuer Kunde."}, {"key": "b", "text": "ist mit der gelieferten Ware zufrieden."}, {"key": "c", "text": "braucht keine neue Rechnung."}], "answer": "b", "confidence": "hoch", "quote": "wir haben Ihre Lieferung wie gewohnt zu unserer vollsten Zufriedenheit erhalten. Alle Artikel entsprechen absolut unseren Vorstellungen.", "explain": "Correcto b: el cliente declara su plena satisfacción con el envío y que todos los artículos corresponden a lo esperado. a es falso: fórmulas como «wie gewohnt» o «der übliche Rabatt von 10 %» describen una relación comercial ya establecida (el correo interno del jefe lo confirma: «langjähriger, guter Kunde»), no un cliente nuevo. c es falso porque pide expresamente «Berichtigung der Rechnung und erneute Zusendung», es decir, una factura corregida."}, {"n": 20, "type": "choice", "prompt": "Die Malerbedarfsfirma", "options": [{"key": "a", "text": "gewährt Herrn Schmidt zum ersten Mal Rabatt."}, {"key": "b", "text": "gewährt immer bei Herrn Schmidt einen Rabatt in Höhe 5%."}, {"key": "c", "text": "hatte Computerprobleme, die zu Fehlern in der Rechnung führte."}], "answer": "c", "confidence": "mittel", "quote": "Ferner waren wir verwundert, dass uns der übliche Rabatt von 10 % in dieser Rechnung nicht gewährt wurde.", "explain": "La c es la única opción que queda en pie, pero con reservas: a y b se descartan con la propia carta —el descuento es el «übliche», luego no es la primera vez, y su importe es del 10 %, no del 5 %—, de modo que por eliminación solo puede ser c. El problema es que los «Computerprobleme» que provocaron los errores de la factura no aparecen en la carta del cliente, sino en el correo interno del jefe (fuera del passage); por eso la confianza es media y no alta."}]}, {"id": "ls_c-p76", "label": "Beschwerde – Variante 8 (Die mangelhafte Lieferung)", "topic": "Mangelhafte Lieferung", "page": 76, "note": "El correo interno del jefe (Siegfried Mayer, Teamleiter) encabeza el bloque: pertenece a la tarea de escritura y NO forma parte del passage. La instrucción final del original «Nummer 21 Schreiben Sie eine E-Mail an den Kunden.» también es de esa tarea. Los ítems 19 y 20 se resuelven íntegramente con la carta del cliente; la fecha de la posible Nachlieferung que da el jefe (12.05.) no es necesaria para responder.", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrter Herr Mayer,\n\nleider müssen wir Ihnen mitteilen, dass Ihre Lieferung nicht zu unserer Zufriedenheit ausgefallen ist. Wir müssen zwei Punkte beanstanden. Erstens wurden die Verpackungen der Hosen (Größe M und L) beim Transport beschädigt, sodass der Inhalt verschmutzt ist. In diesem Zustand können wir die Waren auf keinen Fall in den regulären Verkauf geben, sondern sie nur mit einem Rabatt anbieten. Wir halten daher einen Preisnachlass von 60% für angemessen. Des Weiteren teilen wir Ihnen mit, dass von den T-Shirts mit Aufdruck statt der bezahlten 100 Stück nur die Hälfte geliefert wurde. Wegen der beginnenden Sommersaison bitten wir um schnellstmögliche Nachlieferung der fehlenden Stückzahl auf Ihre Kosten spätestens bis zum 10.05. Wir hoffen, dass sich derartige Vorkommnisse in Zukunft vermeiden lassen, und bitten um prompte Erledigung.\n\nMit freundlichen Grüßen\nMatthias Schramm", "items": [{"n": 19, "type": "choice", "prompt": "Herr Schramm", "options": [{"key": "a", "text": "bemängelt Qualität und Menge der Lieferung."}, {"key": "b", "text": "fand die gesamte Lieferung beschädigt vor."}, {"key": "c", "text": "verlangt wegen der Lieferungsverzögerung einen Rabatt."}], "answer": "a", "confidence": "hoch", "quote": "Erstens wurden die Verpackungen der Hosen (Größe M und L) beim Transport beschädigt, sodass der Inhalt verschmutzt ist.", "explain": "Correcto a: critica la calidad (embalajes dañados en el transporte y contenido manchado) y también la cantidad, porque de las camisetas pagadas solo llegó la mitad («statt der bezahlten 100 Stück nur die Hälfte geliefert wurde»). b es falso porque no todo el envío llegó dañado, sino los embalajes de los pantalones. c es falso porque el 60 % de descuento se exige por la mercancía manchada, no por un retraso en la entrega (el retraso, en todo caso, afecta a la entrega pendiente de las camisetas)."}, {"n": 20, "type": "choice", "prompt": "Die Nachlieferung", "options": [{"key": "a", "text": "bezahlt der Kunde."}, {"key": "b", "text": "kommt im Sommer."}, {"key": "c", "text": "umfasst 50 T-Shirts."}], "answer": "c", "confidence": "hoch", "quote": "Des Weiteren teilen wir Ihnen mit, dass von den T-Shirts mit Aufdruck statt der bezahlten 100 Stück nur die Hälfte geliefert wurde.", "explain": "Correcto c: se pagaron 100 camisetas y solo llegó la mitad, de modo que el envío pendiente son 50 unidades. a es falso porque el cliente pide la reposición «auf Ihre Kosten», es decir, a cargo del proveedor. b es falso porque la reposición se reclama «spätestens bis zum 10.05.»; la «beginnende Sommersaison» es solo el motivo de la urgencia, no la fecha de entrega."}]}, {"id": "ls_c-p77", "label": "Beschwerde – Variante 9 (Pflanzenlieferung)", "topic": "Pflanzenlieferung", "page": 77, "note": "El correo interno del jefe (Michael Herrmann, Teamleiter) encabeza el bloque: pertenece a la tarea de escritura (la respuesta a la clienta) y NO forma parte del passage. Los ítems 19 y 20 se resuelven íntegramente con la carta de la clienta (Gabi Talheim).", "kind": "text", "intro": "Lesen Sie die Beschwerde und die Aufgaben 19 und 20. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Sehr geehrter Herr Herrmann,\n\nleider müssen wir Ihnen mitteilen, dass Ihre Pflanzen- und Blumenauswahl für unsere letzte Veranstaltung gänzlich unpassend war. Wie Sie wissen, war das Thema unserer Ausstellung in der vergangenen Woche: „Nachhaltigkeit & Umweltverträglichkeit im Gartenbau – Lokal und Regional“. Und Sie haben im Eingangsbereich aus dem fernen Ausland importierte exotische Pflanzen platziert, was verständlicherweise zu Beschwerden von Seiten der Besucher geführt hat. Zudem wollten wir den diesjährigen Umweltpreis zusammen mit Blumensträußen vergeben. Diese waren aber mit Orchideen bestückt. Wie passt das zum Thema „regional“? In dieser Situation haben wir daher entschieden, kurzfristigen Ersatz für die Sträuße von einem Aussteller zu beschaffen. Wir bitten Sie, diese zusätzlichen Kosten zu ersetzen. Solche Vorkommnisse müssen in Zukunft unter allen Umständen vermieden werden. Wir erwarten Ihre Vorschläge und stehen für ein Gespräch jederzeit zur Verfügung.\n\nMit freundlichen Grüßen\nGabi Talheim", "items": [{"n": 19, "type": "choice", "prompt": "Der Lieferant hat", "options": [{"key": "a", "text": "die Dekoration passend zum Thema ausgewählt."}, {"key": "b", "text": "die falsche Blumenauswahl getroffen."}, {"key": "c", "text": "Ersatzsträuße aus der Region bestellt."}], "answer": "b", "confidence": "hoch", "quote": "leider müssen wir Ihnen mitteilen, dass Ihre Pflanzen- und Blumenauswahl für unsere letzte Veranstaltung gänzlich unpassend war.", "explain": "Correcto b: la clienta califica la selección de plantas y flores de «gänzlich unpassend» para un certamen sobre sostenibilidad, producto local y regional, y lo concreta con plantas exóticas importadas y orquídeas en los ramos. a es falso porque la decoración no encajaba con el tema. c es falso porque quien consiguió los ramos de sustitución fue la propia clienta, y de un expositor («von einem Aussteller»), no el proveedor, y el texto no dice que fueran de la región."}, {"n": 20, "type": "choice", "prompt": "Der Veranstalter musste", "options": [{"key": "a", "text": "an einen Aussteller Blumen liefern."}, {"key": "b", "text": "auf die Beschwerden der Besucher reagieren."}, {"key": "c", "text": "den Umweltpreis ohne Blumen überreichen."}], "answer": "b", "confidence": "hoch", "quote": "Und Sie haben im Eingangsbereich aus dem fernen Ausland importierte exotische Pflanzen platziert, was verständlicherweise zu Beschwerden von Seiten der Besucher geführt hat.", "explain": "Correcto b: las plantas exóticas provocaron quejas de los visitantes y el organizador tuvo que reaccionar, procurándose a toda prisa ramos de sustitución («haben wir daher entschieden, kurzfristigen Ersatz für die Sträuße von einem Aussteller zu beschaffen»). a es falso porque los ramos se consiguieron de un expositor, no se le entregaron a uno. c es falso porque el premio medioambiental sí se entregó con ramos: precisamente por eso se buscó el recambio cuando los originales llevaban orquídeas."}]}]}, {"id": "schreiben-beschwerde", "title": "Schreiben: Beschwerde-E-Mail", "variants": [{"id": "schr-b-p66", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 1: Putzdienst und unvollständige Arbeitszeit", "topic": "Putzdienst / Büroreinigung", "page": 66, "scenario": "Die Huber GmbH hat einen Vertrag über täglich 3 Stunden Büroreinigung (6:00 bis 9:00 Uhr). Herr Lassner beschwert sich, dass die Reinigungskräfte in den letzten zwei Wochen mehrfach vor 9:00 Uhr nicht mehr da waren. Er verlangt eine Anpassung der Rechnung.", "source_letter": "Sehr geehrte Frau Woller,\n\nleider muss ich mich heute mit einer Beschwerde an Sie wenden. Wir haben einen Vertrag mit Ihrer Firma für die Reinigung unserer Büroräume. In diesem Vertrag sind täglich 3 Stunden Arbeit bei uns festgelegt, und zwar von 6.00 Uhr bis 9.00 Uhr morgens.\n\nIn den letzten zwei Wochen war unsere Sekretärin einige Male bereits vor 9 Uhr im Büro, von Ihrem Putzdienst war aber niemand zu sehen. Wie kann das sein?\n\nWenn wir 3 Stunden bezahlen, erwarten wir auch, dass Ihr Personal drei Stunden bei uns arbeitet. Wenn Sie für die Reinigung unserer Räume weniger als die vereinbarte Zeit benötigen, sollten Sie uns darüber informieren, damit wir den Vertrag ändern.\n\nIch bitte um umgehende Stellungnahme und natürlich die Angleichung der Rechnung an die tatsächlich geleisteten Arbeitsstunden.\n\nMit freundlichen Grüßen\nTheo Lassner", "boss_instructions": "Hallo Friederike, ich verstehe den Ärger von Herrn Lassner. Bitte kläre mit unseren Leuten, was da los ist, und antworte Herrn Lassner. Sage ihm zu, dass so etwas nie wieder vorkommt, und gib ihm 20 % Rabatt auf die nächste Rechnung. Wir dürfen den Kunden keinesfalls verlieren! Gruß Heike", "prompt": "Sie sind Mitarbeiter(in) bei der Reinigungsfirma. Ihr(e) Vorgesetzte(r) hat Sie gebeten, dem Kunden zu antworten. Schreiben Sie eine E-Mail an Herrn Lassner. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Bezugnahme auf die Beschwerde und Dank für den Hinweis", "Förmliche Entschuldigung und Erklärung der Ursache des Problems", "Zusicherung, dass die vertragliche Arbeitszeit künftig strikt eingehalten wird", "Angebot eines 20 %-igen Rabatts auf die nächste Monatsrechnung als Wiedergutmachung"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p67", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 2: Lieferverzögerung Tischlampen", "topic": "Lieferverzögerung Büromöbel", "page": 67, "scenario": "Frau Berger hat 25 Tischlampen für neu renovierte Büros bestellt. Die Lieferung wurde für diese Woche zugesagt, ist aber am Freitagnachmittag noch nicht eingetroffen. Am Montag soll der Betrieb starten. Wenn die Lampen bis Montagmittag nicht da sind, wird sie stornieren.", "source_letter": "Sehr geehrter Herr Richter,\n\nvergangene Woche habe ich bei Ihnen 25 Tischlampen Modell TS 13 150 07 für unsere neuen Büroräume bestellt. Mir wurde telefonisch zugesagt, dass die Lampen noch diese Woche geliefert werden, aber jetzt ist schon Freitagnachmittag und sie sind leider noch immer nicht eingetroffen.\n\nDas ist ärgerlich, da wir am Wochenende unsere Renovierungsarbeiten beenden und die Büros dann vollständig neu einrichten werden. Dazu würden natürlich auch die Lampen gehören, da wir am Montag unseren Bürobetrieb in funktionstüchtigen Räumen wieder aufnehmen wollen. Ich habe bereits mehrfach versucht, Sie telefonisch zu erreichen, und habe Nachrichten auf Ihrem Anrufbeantworter hinterlassen, aber ich wurde leider nicht zurückgerufen.\n\nWenn Ihre Lampen also bis Montagmittag, 13:00 Uhr, nicht bei uns eingetroffen sind, werde ich die Bestellung bei Ihnen stornieren. Ich bitte um eine schnelle Antwort!\n\nMit freundlichen Grüßen\nEvelyn Berger", "boss_instructions": "Bitte antworten Sie Frau Berger sofort. Entschuldigen Sie sich für die Verzögerung beim Zulieferer. Versichern Sie ihr, dass die Lampen per Expresskurier am Montagmorgen vor 10:00 Uhr eintreffen und wir die Expresskosten sowie einen Preisnachlass übernehmen.", "prompt": "Schreiben Sie eine E-Mail an Frau Berger. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Bezug auf die Bestellung und Entschuldigung für die Nicht-Erreichbarkeit", "Erklärung der Ursache des Lieferverzugs beim Hersteller", "Verbindliche Zusage der Expresslieferung am Montag vor 10:00 Uhr", "Angebot einer kostenlosen Montage und eines Preisnachlasses als Ausgleich"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p70", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 3: Defekte Spülmaschine und Wasserschaden", "topic": "Gerätedefekt und Folgeschaden", "page": 70, "scenario": "Herr Krüger kaufte eine Spülmaschine für die Teeküche. Beim ersten Spülgang lief Wasser aus und beschädigte das Parkett. In zwei Tagen findet ein wichtiges Meeting statt. Er verlangt sofortige Reparatur und Kostenübernahme für den Parkettaustausch.", "source_letter": "Sehr geehrte Frau Sturm,\n\nvor einer Woche haben wir bei Ihnen eine Spülmaschine für unsere Teeküche gekauft. Sie wurde sehr schnell geliefert und auch gleich eingebaut. Leider muss ich Ihnen heute aber mitteilen, dass sie bereits defekt ist. Beim Spülen ist Wasser ausgelaufen und nun ist unser Parkett beschädigt.\n\nIch bitte Sie, uns umgehend einen Techniker zu schicken, der das Gerät repariert. Wir brauchen die Spülmaschine spätestens übermorgen, da wir ein großes Meeting unserer Außendienstmitarbeiter haben und viele Personen bewirten müssen.\n\nAußerdem müssen wir einen Teil des Parketts austauschen. Die Kosten dafür werden wir Ihnen in Rechnung stellen.\n\nBitte schicken Sie mir so schnell wie möglich einen Terminvorschlag für die Reparatur und eine Bestätigung der Kostenübernahme. Vielen Dank!\n\nMit freundlichen Grüßen\nClaudio Krüger", "boss_instructions": "Hallo Frau Retterstein, organisieren Sie bitte sofort einen Techniker für Herrn Krüger. Entschuldigen Sie sich für die Unannehmlichkeiten und sagen Sie zu, dass wir die Reparatur und die Forderungen prüfen. Weisen Sie aber vorsorglich darauf hin, dass die Reparatur eventuell Ersatzteile erfordert. Danke!", "prompt": "Schreiben Sie eine E-Mail an Herrn Krüger. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Bezugnahme auf die E-Mail von Herrn Krüger und Bedauern über den Wasserschaden", "Förmliche Entschuldigung für die Unannehmlichkeiten mit dem Neugerät", "Terminvereinbarung für den Technikerbesuch am Folgetag zur Fehlerbehebung", "Zusage zur unbürokratischen Prüfung der Kostenübernahme für das Parkett"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p71", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 4: Probleme beim Firmenumzug", "topic": "Umzugsdienstleistung und Transportschäden", "page": 71, "scenario": "Beim Büroumzug von Hanau nach Frankfurt kamen die Möbelpacker 30 Minuten zu spät und nur zu dritt statt zu viert. Die Möbel sind noch nicht fertig aufgebaut, Glasplatten sind zerbrochen und Schränke verkratzt. Herr Zaun fordert Nachbesserung am Mittwoch und Schadensersatz.", "source_letter": "Sehr geehrte Frau Börne,\n\nam Wochenende ist unser Büro mit Hilfe Ihres Unternehmens von Hanau nach Frankfurt umgezogen. Leider waren wir mit Ihrem Service überhaupt nicht zufrieden.\n\nIhre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert. Deshalb dauerte der ganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen: Es sind noch nicht alle Möbel aufgebaut, deshalb konnten wir noch nicht unsere Sachen einräumen.\n\nBitte schicken Sie uns deshalb am Mittwochmorgen noch zwei Personen, die den Möbelaufbau erledigen. Des Weiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt.\n\nMit freundlichen Grüßen\nThomas Zaun", "boss_instructions": "Hallo Frau Kühne, da ist wohl was schiefgegangen. Bitte schreiben Sie Herrn Zaun und erklären Sie die Fehler. Sagen Sie zu, dass am Mittwochmorgen pünktlich zwei Monteure kommen und alles fertig aufbauen. Natürlich übernehmen wir die Verantwortung für die Schäden. Die Firma hat das erste Mal bei uns gebucht!", "prompt": "Schreiben Sie eine E-Mail an Herrn Zaun. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Bezug auf den Umzug und aufrichtige Entschuldigung für die Verzögerung", "Erklärung der Ursachen (plötzlicher Personalausfall und Verkehrsbehinderung)", "Bestätigung des Termins am Mittwochmorgen mit zwei erfahrenen Monteuren", "Zusage der Schadensregulierung über die Betriebshaftpflichtversicherung"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p72", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 5: Kopiergerät defekt und Streit über Rechnungen", "topic": "Bürogeräte und Kundendienst", "page": 72, "scenario": "Herr Schmidt (Mova GmbH) beschwert sich über wiederholte Papierstaus an einem fast neuen Druckgerät. Trotz dreier Technikereinsätze trat wieder ein Fehler auf, wodurch eine Ausschreibung verpasst wurde. Er fordert ein Ersatzgerät und weigert sich, die Rechnungen der Techniker zu bezahlen.", "source_letter": "Sehr geehrte Frau Aichele,\n\nvorgestern wurde von einem Ihrer Mitarbeiter unser fast neues Druck- und Kopiergerät der Marke Lexios zum dritten Mal innerhalb von zwei Wochen geprüft, da bei diesem immer wieder Papierstaus aufgetreten sind. Gestern kam es schon wieder zu einer Fehlermeldung, was zur Folge hatte, dass wir Unterlagen nicht fristgerecht einreichen konnten. Aus diesem Grund haben wir eine für uns sehr wichtige Ausschreibung verpasst. Von einer Schadensersatzforderung sehen wir vorerst ab, wir fordern Sie aber auf, uns umgehend auf Ihre Kosten ein anderes Gerät zu liefern. Es handelt sich hier nämlich eindeutig um einen technischen Fehler, den wir nicht zu verantworten haben. Die Rechnungen für die drei vorangegangenen Technikereinsätze werden wir natürlich nicht bezahlen.\n\nIch erwarte Ihre umgehende Rückmeldung.\n\nMit freundlichen Grüßen\nBenno Schmidt", "boss_instructions": "Hallo, laut Techniker lag der Fehler erneut an falscher Bedienung. Antworte Herrn Schmidt bitte und weise ihn höflich darauf hin, dass die Verantwortung nicht bei uns liegt. Gerne kommt noch einmal ein Techniker kostenfrei zur Mitarbeitereinweisung vorbei. Die Kosten für die Geräteüberprüfungen bleiben aber bei Mova.", "prompt": "Schreiben Sie eine E-Mail an Herrn Schmidt. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Dank für die Rückmeldung und Bedauern über die verpasste Ausschreibung", "Höfliche Erläuterung des Technikerbefunds (Bedienerfehler / Papierspezifikation)", "Angebot einer kostenlosen Schulung der Mitarbeitenden vor Ort", "Stellungnahme und Begründung bezüglich der bestehenden Prüfungsrechnungen"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}, {"id": "schr-b-p74", "category": "beschwerde", "kind": "schreiben", "label": "Beschwerde 6: Falsche Rechnung und fehlender Rabatt", "topic": "Rechnungsstellung und Konditionen", "page": 74, "scenario": "Ein langjähriger Stammkunde stellt Unstimmigkeiten in der Rechnung fest: 200 statt 100 Pinsel berechnet, teurere rote statt grüner Farbe aufgeführt und der vereinbarte Stammkundenrabatt von 10 % fehlt.", "source_letter": "Sehr geehrte Frau Hoffner,\n\nwir haben Ihre Lieferung erhalten und sind mit allen Artikeln absolut zufrieden. Leider muss ich Sie darauf hinweisen, dass die Rechnung einige Unstimmigkeiten beinhaltet: Zunächst wurden statt 100 Stück Pinsel Größe M 200 Stück berechnet. Außerdem wurden 20 Töpfe roter Farbe berechnet. Wir hatten aber grüne Farbe bestellt und geliefert bekommen, die preislich niedriger liegt. Wir bitten Sie, dies zu korrigieren. Des Weiteren waren wir überrascht, dass unser üblicher Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Das ist wahrscheinlich ein Versehen.\n\nWir bitten um Berichtigung der Rechnung und erneute Zusendung.\n\nMit freundlichen Grüßen\nKarl Schmidt", "boss_instructions": "Hallo, Herr Schmidt ist ein wichtiger Stammkunde. Bitte entschuldige dich bei ihm. Der Fehler lag an der Umstellung unserer Buchhaltungssoftware. Schicke ihm sofort eine korrigierte Rechnung mit den 10 % Rabatt und lege als Entschuldigung einen Gutschein über 50 Euro bei.", "prompt": "Schreiben Sie eine E-Mail an Herrn Schmidt. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Dank für den freundlichen Hinweis und Bedauern über die Fehler in der Rechnung", "Erklärung der Ursache (technische Umstellung der Abrechnungssoftware)", "Zusicherung der sofortigen Rechnungskorrektur (100 Pinsel, grüne Farbe, 10 % Rabatt)", "Beigabe eines Einkaufsgutscheins als Zeichen der Wertschätzung für die Treue"], "min_words": 150, "time_minutes": 45, "redemittel": ["Sehr geehrte(r) Frau/Herr [Name], / Sehr geehrte Damen und Herren,", "vielen Dank für Ihre E-Mail, in der Sie uns auf die Unstimmigkeiten bei ... hinweisen.", "Wir bedauern sehr, dass Sie mit unserem Service / unserer Lieferung nicht zufrieden waren.", "Bitte entschuldigen Sie die entstandenen Unannehmlichkeiten.", "Der Grund für dieses Problem war, dass...", "Nach Rücksprache mit unserer zuständigen Abteilung können wir Ihnen mitteilen, dass...", "Wir möchten Ihnen folgenden Lösungsvorschlag unterbreiten: ...", "Gern schicken wir Ihnen umgehend einen Techniker vorbei / liefern wir die Ware erneut.", "Als kleine Entschädigung und Wiedergutmachung bieten wir Ihnen einen Rabatt von ... % an.", "Selbstverständlich übernehmen wir die anfallenden Kosten.", "Wir versichern Ihnen, dass wir alles tun werden, damit sich ein solcher Vorfall nicht wiederholt.", "Wir hoffen auf Ihr Verständnis und freuen uns weiterhin auf eine gute Zusammenarbeit.", "Mit freundlichen Grüßen"]}]}, {"id": "schreiben-forum", "title": "Schreiben: Forumsbeitrag", "variants": [{"id": "schr-f-krankmeldung", "category": "forum", "kind": "schreiben", "label": "Forum 4: Ärztliche Krankmeldung ab Tag 1", "topic": "Krankmeldung und Fehlzeiten", "page": 98, "scenario": "Aufgrund hoher Fehlzeiten an Freitagen und Montagen plant das Management, dass alle Mitarbeiterinnen und Mitarbeiter im Krankheitsfall bereits ab dem ersten Tag ein ärztliches Attest (AU-Bescheinigung) vorlegen müssen.", "prompt": "Schreiben Sie einen Beitrag für das Diskussionsforum Ihrer Firma. Behandeln Sie dabei die folgenden vier Punkte:", "leitpunkte": ["Geben Sie Ihre Meinung zur Pflicht der Krankschreibung ab dem ersten Krankheitstag ab.", "Stellen Sie Vor- und Nachteile für die Firma, die Beschäftigten und Arztpraxen dar.", "Erzählen Sie von Regelungen an früheren Arbeitsplätzen oder in Ihrem Heimatland.", "Schlagen Sie Maßnahmen vor, um Vertrauen und Gesundheit am Arbeitsplatz zu fördern."], "min_words": 150, "time_minutes": 45, "redemittel": ["Ich möchte mich an der aktuellen Diskussion zum Thema «...» beteiligen.", "In unserem Unternehmen wird zurzeit viel über die Frage diskutiert, ob...", "Meiner Ansicht / Meinung nach ist diese Maßnahme ein wichtiger Schritt, weil...", "Einerseits bietet dieses Modell entscheidende Vorteile, wie zum Beispiel...", "Andererseits darf man jedoch nicht übersehen, dass damit auch Nachteile verbunden sind, etwa...", "Ein weiterer Aspekt, der bedacht werden sollte, ist...", "Aus meiner persönlichen Erfahrung kann ich berichten, dass...", "In meinem Heimatland ist es in vielen Betrieben üblich, dass...", "Um eine für alle Beteiligten faire Lösung zu finden, schlage ich vor, dass...", "Zusammenfassend lässt sich sagen, dass ein ausgewogener Kompromiss notwendig ist.", "Ich bin gespannt auf die Meinungen der ande
