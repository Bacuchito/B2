key": "b", "text": "wird um 30 Minuten verlängert."}, {"key": "c", "text": "wird um 30 Minuten verschoben."}], "answer": "a", "confidence": "hoch", "quote": "Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann.", "explain_ru": "Верно a: предложение MR — обеденный перерыв «von 30 Minuten», то есть продолжительностью 30 минут. b и c путают, что именно расширяют: расширяется временной интервал, в который можно сделать перерыв («ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr»), а не сам перерыв, который остаётся 30-минутным; и ничего не сдвигается на 30 минут.", "explain": "Correcto a: la propuesta de MR es una pausa de mediodía «von 30 Minuten», es decir, de 30 minutos de duración. b y c confunden lo que se amplía: lo que se amplía es la franja horaria en la que se puede hacer la pausa («ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr»), no la pausa misma, que sigue siendo de 30 minutos; y nada se pospone 30 minutos."}, {"n": 17, "type": "choice", "prompt": "Der Standort der neuen Fahrradständer", "options": [{"key": "a", "text": "wird an der Informationstafel bekanntgegeben."}, {"key": "b", "text": "wird dem Betriebsrat mitgeteilt."}, {"key": "c", "text": "wird zwischen Tor 2 und 3 geplant."}], "answer": "a", "confidence": "mittel", "quote": "MR formuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats aushängen.", "explain_ru": "Верно a: о месте сообщают объявлением, которое вывешивают на доске объявлений («am Schwarzen Brett … aushängen») — это и есть «Informationstafel» из варианта; кроме того, план расположения обновляют с новыми местами. Уверенность средняя, потому что в тексте сказано «Schwarzes Brett», а не буквально «Informationstafel». c неверно, хотя и повторяет правильные названия ворот: одну конструкцию ставят «neben Tor 2», другую «neben Tor 3» — у каждых ворот, а не между ними. b неверно, потому что объявление адресовано всему коллективу («intern kommunizieren», «an die Belegschaft») и вывешивается на доске совета трудового коллектива, а не направляется Betriebsrat.", "explain": "Correcto a: el emplazamiento se da a conocer mediante un comunicado que se publica en el tablón de anuncios («am Schwarzen Brett … aushängen»), que es la «Informationstafel» de la opción; además se retoca el plano de situación con las nuevas ubicaciones. La confianza es media porque el texto dice «Schwarzes Brett», no literalmente «Informationstafel». c es falso aunque repite los nombres correctos: las dos estructuras se instalan una «neben Tor 2» y la otra «neben Tor 3», junto a cada puerta y no entre ambas. b es falso porque el comunicado va dirigido a toda la plantilla («intern kommunizieren», «an die Belegschaft») y se cuelga en el tablón del comité de empresa, no es un aviso dirigido al Betriebsrat."}, {"n": 18, "type": "choice", "prompt": "Frau Schlosser", "options": [{"key": "a", "text": "macht Frau Schmidt ein Geschenk."}, {"key": "b", "text": "verlässt das Unternehmen."}, {"key": "c", "text": "wird von Frau Meier vertreten."}], "answer": "c", "confidence": "hoch", "quote": "Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt sein.", "explain_ru": "Верно c: пока Frau Schlosser находится в Mutterschutz, а затем в Elternzeit, контактным лицом становится Frau Meier «bis zu ihrer Rückkehr», то есть она её замещает. b неверно, потому что она не покидает предприятие: она уходит в Mutterschutz и Elternzeit, и её возвращение планируется. a неверно: подарками занимается Frau Meier («Frau Meier wird … sich auch um kleine Geschenke für Mutter und Kind … kümmern») и от имени коллег; Frau Schmidt упомянута лишь как хозяйка кабинета, в котором работает Frau Meier.", "explain": "Correcto c: mientras Frau Schlosser está de baja por maternidad y luego de permiso parental, Frau Meier pasa a ser la persona de contacto «bis zu ihrer Rückkehr», es decir, la sustituye. b es falso porque no abandona la empresa: se marcha al Mutterschutz y a la Elternzeit y se prevé su regreso. a es falso: quien se ocupa de los regalos es Frau Meier («Frau Meier wird … sich auch um kleine Geschenke für Mutter und Kind … kümmern»), y además en nombre de los colegas; Frau Schmidt solo aparece como la persona en cuyo despacho trabaja Frau Meier."}]}, {"id": "t4_b-p49", "note_ru": "Вторая версия того же протокола (с. 49-50, «Новая версия от 07.2024: пункт 3 новый и новые вопросы»): TOP 3 переписан (теперь MH присылает предложения по улучшению качества продукта, и вопрос откладывается), пункты 14-18 новые, варианты 16, 17 и 18 идут в другом порядке; ответы меняют букву по сравнению с t4_b-p47. Русская пометка в заголовке убрана. Протокол занимает с. 49-50, вопросы — в конце с. 50.", "label": "Variante 1 (Новая версия от 07.2024)", "page": 49, "note": "Segunda versión del mismo acta (pp. 49-50, «Новая версия от 07.2024: пункт 3 новый и новые вопросы»): el TOP 3 está reescrito (ahora MH envía propuestas para mejorar la calidad del producto y el punto se aplaza) y los ítems 14-18 son nuevos, con las opciones de 16, 17 y 18 en otro orden; las respuestas cambian de letra respecto a t4_b-p47. Se ha eliminado la anotación rusa de la cabecera. El acta ocupa las pp. 49-50 y las preguntas están al final de la p. 50.", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14-18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(neue Werbemaßnahmen, Frau Schlosser)\n\nProtokoll 14.02.20XX, 08:00-11:45 Uhr\nAbteilung 4, Besprechungszimmer 2\nTeilnehmende: Holger Marschke (HM, Teamleiter), Cornelia Markert (CM, Marketingabteilung), Susanne Willke (SW, Marketingabteilung), Monique Rüdiger (MR, Betriebsratsmitglied)\nEntschuldigt: Martin Hamann (MH, Qualitätssicherung)\nProtokollantin: Marianne Schiller (MS)\nSitzungsleitung: Andreas Mertens (AM)\n\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Neue Marketingmaßnahmen\n3. Qualitätsmanagement\n4. Anpassung der Pausenzeiten\n5. Standorte der neuen Fahrradständer\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nAM begrüßt alle Teilnehmenden und eröffnet die heutige Sitzung. Das Protokoll des letzten Meetings am 10.01.20XX wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt. Auf Antrag von MR, die wegen anderweitiger terminlicher Verpflichtungen nicht bis zum Ende am Meeting teilnehmen kann, wird die Reihenfolge der Tagesordnung geändert und die TOPs 4 und 5 werden am heutigen Vormittag vorgezogen.\n\nTOP 2 Neue Marketingmaßnahmen\nCM und SW berichten, dass traditionelle Marketingmaßnahmen wie z. B. Fernsehwerbung zu den Hauptsendezeiten zu teuer sind. Deshalb sollen soziale Medien wie Facebook, Instagram u. a. verstärkt genutzt werden. Weitere Möglichkeiten, Werbung zu machen, müssen von der Marketingabteilung noch erörtert werden. Es ist geplant, neue Wege zu gehen und zusätzlich zu den lokalen Geschäften einen Online-Shop zu starten. Für alle diese Maßnahmen steht insgesamt ein Budget von 150.000 € zur Verfügung. CM wird beauftragt, dafür eine spezialisierte Werbeagentur zu finden sowie einen Kostenvoranschlag der betreffenden Agentur einzuholen, SW soll Kontakte zu professionellen Fotografen und Textern herstellen und Angebote anfordern. Ergebnisse der beiden Recherchen werden bei der nächsten Besprechung am 10.03.20XX vorgestellt. Das weitere Vorgehen wird definiert, wenn alle nötigen Informationen vorliegen.\n\nTOP 3 Qualitätsmanagement\nMH hat vor der heutigen Sitzung allen Anwesenden erste Vorschläge zur Verbesserung der Produktqualität zugeschickt, die er mit seiner Arbeitsgruppe erstellt hat. Da MH heute wegen Krankheit nicht an dem Meeting teilnehmen kann, wird beschlossen, diesen Punkt bis zur nächsten Besprechung am 10.03.20XX zu vertagen. Damit verschiebt sich auch die Umsetzung der Maßnahmen zur Qualitätssicherung. MH hat aber zugesagt, bis Anfang März noch weitere Ideen erarbeiten und zu kommunizieren.\n\nTOP 4 Anpassung der Pausenzeiten\nAufgrund mehrfacher Anfragen von Seiten der Abteilungsleiter regt MR an, dass die Zeiten, in denen Pausen gemacht werden können, flexibler gestaltet werden. Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann. So können die betrieblichen Notwendigkeiten und Arbeitsabläufe verschiedener Abteilungen besser berücksichtigt werden. Dieser Vorschlag wird einstimmig angenommen, MR wird beauftragt, eine entsprechende Mitteilung an die Belegschaft über die Änderung der Pausenzeiten zu verfassen.\n\nTOP 5 Standorte der neuen Fahrradständer\nMR teilt mit, dass auf Wunsch der Belegschaft zwei weitere Fahrradständer auf dem Gelände aufgestellt werden. Dabei wurden zwei Standorte favorisiert und der erste Fahrradständer wird neben Tor 2, der zweite neben Tor 3 installiert. So steht den Mitarbeitenden nun an jedem Zugang zum Gelände eine Möglichkeit zur Verfügung, ihr Fahrrad abzustellen. Dementsprechend werden der Lageplan überarbeitet und die neuen Standorte der Fahrradständer eingezeichnet. MR formuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats aushängen.\n\nTOP 6 Sonstiges\nDie Assistentin der Geschäftsleitung, Frau Schlosser, verabschiedet sich in den Mutterschutz und die anschließende Elternzeit. Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt sein. Frau Meier wird eine Abschiedsfeier für den 16.03.20XX organisieren und sich auch um kleine Geschenke für Mutter und Kind im Namen der Kolleginnen und Kollegen kümmern.", "items": [{"n": 14, "type": "choice", "prompt": "Die neuen Werbemaßnahmen", "options": [{"key": "a", "text": "dürfen bis zu 150.000 Euro kosten."}, {"key": "b", "text": "sollen Online-Medien ausschließen."}, {"key": "c", "text": "werden bis zur nächsten Teamsitzung umgesetzt."}], "answer": "a", "confidence": "hoch", "quote": "Für alle diese Maßnahmen steht insgesamt ein Budget von 150.000 € zur Verfügung.", "explain_ru": "Верно a: бюджет на все меры составляет 150 000 €, значит они могут стоить до этой суммы. b неверно и противоречит протоколу: решено как раз активнее использовать соцсети, такие как Facebook и Instagram («Deshalb sollen soziale Medien … verstärkt genutzt werden»), и дополнительно открыть интернет-магазин. c неверно, потому что на собрании 10.03.20XX представят только результаты двух поисков, а порядок действий определят, когда будет вся информация: реализация на следующем собрании не планируется.", "explain": "Correcto a: el presupuesto disponible para todas las medidas es de 150.000 €, de modo que pueden costar hasta esa cantidad. b es falso y contradice el acta: lo que se decide es precisamente utilizar más los medios sociales como Facebook e Instagram («Deshalb sollen soziale Medien … verstärkt genutzt werden») y abrir además una tienda en línea. c es falso porque en la reunión del 10.03.20XX solo se presentarán los resultados de las dos búsquedas y el procedimiento se definirá cuando esté toda la información: la ejecución no está prevista para la próxima reunión."}, {"n": 15, "type": "choice", "prompt": "Herr Hamann", "options": [{"key": "a", "text": "hat erste Arbeitsergebnisse versendet."}, {"key": "b", "text": "realisiert bis März die Maßnahmen zur Qualitätssicherung."}, {"key": "c", "text": "stellt die Resultate seiner Arbeit vor."}], "answer": "a", "confidence": "hoch", "quote": "MH hat vor der heutigen Sitzung allen Anwesenden erste Vorschläge zur Verbesserung der Produktqualität zugeschickt, die er mit seiner Arbeitsgruppe erstellt hat.", "explain_ru": "Верно a: MH заранее разослал всем участникам первые результаты своей рабочей группы («erste Vorschläge … zugeschickt, die er mit seiner Arbeitsgruppe erstellt hat»). b неверно: внедрение мер по обеспечению качества откладывается, потому что вопрос отложен («Damit verschiebt sich auch die Umsetzung der Maßnahmen zur Qualitätssicherung»); на начало марта MH обещает только новые идеи. c неверно, потому что он не участвует в собрании из-за болезни («Da MH heute wegen Krankheit nicht an dem Meeting teilnehmen kann»).", "explain": "Correcto a: MH envió por adelantado a todos los asistentes los primeros resultados de su grupo de trabajo («erste Vorschläge … zugeschickt, die er mit seiner Arbeitsgruppe erstellt hat»). b es falso: la aplicación de las medidas de aseguramiento de la calidad se retrasa porque el punto se aplaza («Damit verschiebt sich auch die Umsetzung der Maßnahmen zur Qualitätssicherung»); lo único que MH promete para principios de marzo son nuevas ideas. c es falso porque no asiste a la reunión por enfermedad («Da MH heute wegen Krankheit nicht an dem Meeting teilnehmen kann»)."}, {"n": 16, "type": "choice", "prompt": "Die Mittagspause", "options": [{"key": "a", "text": "wird um 30 Minuten verlängert."}, {"key": "b", "text": "wird um 30 Minuten verschoben."}, {"key": "c", "text": "ist 30 Minuten lang."}], "answer": "c", "confidence": "hoch", "quote": "Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann.", "explain_ru": "Верно c: обеденный перерыв «von 30 Minuten», то есть длится 30 минут. a и b неверны по одной причине: расширяется не перерыв, а временной интервал для него («ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr»); его ни удлиняют, ни сдвигают на 30 минут.", "explain": "Correcto c: la pausa de mediodía es «von 30 Minuten», es decir, dura 30 minutos. a y b son falsas por el mismo motivo: lo que se amplía no es la pausa, sino la franja horaria para hacerla («ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr»); ni se alarga ni se desplaza 30 minutos."}, {"n": 17, "type": "choice", "prompt": "Der Standort der neuen Fahrradständer", "options": [{"key": "a", "text": "wird dem Betriebsrat mitgeteilt."}, {"key": "b", "text": "wird zwischen Tor 2 und 3 geplant."}, {"key": "c", "text": "wird an der Informationstafel bekanntgegeben."}], "answer": "c", "confidence": "mittel", "quote": "MR formuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats aushängen.", "explain_ru": "Верно c: о месте велопарковки сообщают объявлением, которое вывешивают на доске объявлений («am Schwarzen Brett … aushängen») — это и есть «Informationstafel» из варианта; план расположения тоже обновляют. Уверенность средняя, потому что в тексте буквально «Schwarzes Brett», а не «Informationstafel». b неверно, хотя ворота названы верно: одну ставят «neben Tor 2», другую «neben Tor 3» — у каждого входа, а не между воротами. a неверно, потому что объявление предназначено всему коллективу («intern kommunizieren») и публикуется только на доске совета трудового коллектива; это не уведомление для Betriebsrat.", "explain": "Correcto c: el emplazamiento de los aparcabicis se da a conocer con un comunicado que se cuelga en el tablón de anuncios («am Schwarzen Brett … aushängen»), equivalente a la «Informationstafel» de la opción; el plano de situación también se actualiza con las nuevas ubicaciones. La confianza es media porque el texto literal dice «Schwarzes Brett» y no «Informationstafel». b es falso pese a citar bien las puertas: se instala uno «neben Tor 2» y otro «neben Tor 3», junto a cada acceso, no entre las dos puertas. a es falso porque el comunicado es para toda la plantilla («intern kommunizieren») y solo se publica en el tablón del comité de empresa; no es un aviso que se le dé al Betriebsrat."}, {"n": 18, "type": "choice", "prompt": "Frau Schlosser", "options": [{"key": "a", "text": "verlässt das Unternehmen."}, {"key": "b", "text": "wird von Frau Meier vertreten."}, {"key": "c", "text": "macht Frau Schmidt ein Geschenk."}], "answer": "b", "confidence": "hoch", "quote": "Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt sein.", "explain_ru": "Верно b: Frau Meier будет контактным лицом «bis zu ihrer Rückkehr», значит она замещает Frau Schlosser на время её отсутствия. a неверно, потому что Frau Schlosser не уходит с предприятия: она уходит в Mutterschutz и Elternzeit, и её возвращение планируется. c неверно, потому что подарками занимается Frau Meier («Frau Meier wird … sich auch um kleine Geschenke für Mutter und Kind … kümmern») от имени коллег; Frau Schmidt упомянута лишь как хозяйка кабинета, в котором работает Frau Meier.", "explain": "Correcto b: Frau Meier será la persona de contacto «bis zu ihrer Rückkehr», luego sustituye a Frau Schlosser durante su ausencia. a es falso porque Frau Schlosser no deja la empresa: se va al Mutterschutz y a la Elternzeit y se cuenta con su vuelta. c es falso porque los regalos los gestiona Frau Meier («Frau Meier wird … sich auch um kleine Geschenke für Mutter und Kind … kümmern») en nombre de los colegas; Frau Schmidt solo aparece como la titular del despacho en el que trabaja Frau Meier."}]}, {"id": "t4_c-p51", "note_ru": "Протокол собрания от 19.11.20XX: текст занимает с. 51-52, вопросы 14-18 — в конце с. 52. В пункте 15 в оригинале ДВЕ разные редакции: первая («Einige Mitarbeiter machen Überstunden,») и помеченная «новый вариант вопроса» («Aufgrund des hohen Krankenstands»); они сохранены как два пункта с одинаковым n (показываются как 15a и 15b). На с. 52 пункты 17 («Die Firma») и 18 («Persönliche Gegenstände») набраны в две колонки, и OCR смешал их в одних строках («17. Die Firma 18. Persönliche Gegenstände», затем «a) besucht die Frühjahrsmesse regelmäßig. a) können nicht in der Küche bleiben.»); каждый пункт восстановлен со своими вариантами a/b/c.", "label": "Variante 3 (Protokoll 19.11.20XX)", "page": 51, "note": "Acta de la reunión del 19.11.20XX, cuyo texto ocupa las pp. 51-52 y cuyas preguntas 14-18 aparecen al final de la p. 52. El ítem 15 trae DOS redacciones distintas en el original: la primera («Einige Mitarbeiter machen Überstunden,») y la marcada «новый вариант вопроса» («Aufgrund des hohen Krankenstands»), que se han conservado como dos ítems con el mismo n (se mostrarán como 15a y 15b). En la p. 52 los ítems 17 («Die Firma») y 18 («Persönliche Gegenstände») vienen entrelazados a dos columnas y el OCR los mezcla en las mismas líneas («17. Die Firma 18. Persönliche Gegenstände» seguido de «a) besucht die Frühjahrsmesse regelmäßig. a) können nicht in der Küche bleiben.»); cada ítem se ha reconstruido con sus propias opciones a/b/c.", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(Personalthemen, Urlaubssperre)\nProtokoll 19.11.20XX, 08.00-11.45 Uhr\nZentrale, Raum 405\nSitzungsleitung: Lukas Wallner (LW)\nTeilnehmende: Jessica Müller (JM, Personalabteilung), Maximilian Berger (MB, Marketingabteilung), Rebecca Lehmann (RL, Öffentlichkeitsarbeit), Kurt Meichsner (KM, Verkauf)\nExtern: Ansgar Wolf (AW, Hausverwaltung)\nProtokollantin: Beate Richter (BR)\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Personal\n3. Kundenbindung, Rabattaktion\n4. Vorbereitungen der Messe\n5. Neujahrsfeier\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nLW begrüßt alle Teilnehmer und eröffnet die heutige Besprechung. Herr Dr. Baumann aus der Qualitätssicherung lässt sich entschuldigen, da er in dieser Woche auf einer Dienstreise ist. Das Protokoll des Meetings vom 14. November wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt.\nTOP 2 Personal\nDie Kundenbetreuung ist aktuell unterbesetzt, weil viele Kollegen krank sind. Auch in der Personalabteilung herrscht ein hoher Krankenstand. Krankmeldungen aus allen Abteilungen sollen deshalb vorübergehend direkt an JM gesendet werden.\nUrlaubsanträge können im Moment nur im Falle dringender persönlicher Angelegenheiten genehmigt werden. Aufgrund des hohen Krankenstands mussten einige Kollegen in den letzten Monaten besonders viele Überstunden machen, die möglichst bis zum Ende des Kalenderjahres abgebaut werden sollten. Sollte dies aufgrund des hohen Arbeitspensums nicht möglich sein, können die Überstunden auch in das nächste Jahr übertragen werden.\nHerr Wortmann aus dem Verkauf geht am 1. Februar des nächsten Jahres in den Ruhestand. Sein Nachfolger wird KM, den Herr Wortmann ab sofort einarbeitet. Im Rahmen der Neujahrsfeier wird unser langjähriger Mitarbeiter verabschiedet. Wir möchten ihm zum Abschied eine Freude machen. Ideen hierzu bitte an JM, die anschließend das Geld einsammeln und das Geschenk besorgen wird.\nZum 1. Dezember beginnen drei neue Mitarbeiter in der Produktion, da die Verkaufszahlen stark gestiegen sind.\nTOP 3 Kundenbindung, Rabattaktion\nKM hat erfahren, dass der Wettbewerber Lutz GmbH für das Frühjahr eine Rabattaktion plant. RL schlägt vor, ebenfalls eine Kampagne zur Kundenbindung zu entwickeln. KM hat hierfür bereits einen ersten Entwurf für ein Konzept ausgearbeitet und legt diesen vor. Er schlägt vor, das Konzept in einer kleineren Runde zu diskutieren. Wer Interesse hat, an diesem Brainstorming teilzunehmen, soll sich bis zum Ende der Woche bei KM melden.\nTOP 4 Vorbereitungen der Messe\nIm nächsten Jahr wird unsere Firma erstmals an der Frühjahrsmesse in Dresden teilnehmen, die vom 20.-24. April stattfindet. MB aus der Marketingabteilung berichtet, dass bereits der Standplatz gebucht und der Messebauer beauftragt ist. Interessierte können sich die Standgestaltung im Büro von MB ansehen. Auch die Broschüren zu unserem Messeauftritt sind bereits im Druck und können in der 2. KW an unsere Kunden verschickt werden. Abschließend bittet MB JM, externes Standpersonal und Hotelzimmer für die Mitarbeiter zu buchen, die auf die Messe gehen.\nTOP 5 Neujahrsfeier\nJM berichtet, dass am 7. Januar die Neujahrsfeier im Restaurant „Zum Schwan\" stattfindet. Die Einladungen und Menüvorschläge werden verschickt. Alle Mitarbeiter sollen bis zum 15. Dezember Bescheid sagen, mit wie vielen Personen sie teilnehmen und was sie essen möchten. Die Geschäftsführung hat auch eine kleine Überraschung für die Mitarbeiter an diesem Abend geplant.\nTOP 6 Sonstiges\nAW informiert über Renovierungsarbeiten im ersten Stock, die für die nächste Woche geplant sind. Die Firma Buntschuh wird die Wände in der Teeküche Montag und Dienstag nächster Woche streichen. Da die Küche dafür komplett ausgeräumt werden muss, werden die Mitarbeiter gebeten, bei dieser Gelegenheit persönliche Gegenstände wie zum Beispiel nicht firmeneigene Kaffeetassen, Brotdosen und Ähnliches bis Donnerstag an sich zu nehmen. Ansonsten werden diese durch AW entsorgt.", "items": [{"n": 14, "type": "choice", "prompt": "Bei der Sitzung wird", "options": [{"key": "a", "text": "das Protokoll der letzten Besprechung geändert."}, {"key": "b", "text": "die Tagesordnung genehmigt."}, {"key": "c", "text": "über Personalthemen gesprochen."}], "answer": "c", "confidence": "hoch", "quote": "Das Protokoll des Meetings vom 14. November wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt.", "explain_ru": "Верно c: пункт 2 повестки дня («TOP 2 Personal») целиком посвящён кадровым вопросам (больничные, отпуска, сверхурочные, выход на пенсию Herr Wortmann, новые сотрудники). a неверно, потому что протокол утверждают «ohne weitere Änderungen und Ergänzungen», то есть без изменений. b тоже неверно: утверждают протокол предыдущего собрания, а не повестку дня (её только перечисляют).", "explain": "Correcto c: el punto 2 del orden del día («TOP 2 Personal») se dedica íntegramente a asuntos de personal (bajas por enfermedad, vacaciones, horas extras, jubilación de Herr Wortmann, nuevas incorporaciones). a es falso porque el acta se aprueba «ohne weitere Änderungen und Ergänzungen», es decir, sin cambios. b también es falso: lo que se aprueba es el acta de la reunión anterior, no el orden del día (que solo se enumera)."}, {"n": 15, "type": "choice", "prompt": "Einige Mitarbeiter machen Überstunden,", "options": [{"key": "a", "text": "da andere Urlaub machen."}, {"key": "b", "text": "obwohl sie krank sind."}, {"key": "c", "text": "weil viele Kollegen krank sind."}], "answer": "c", "confidence": "hoch", "quote": "Aufgrund des hohen Krankenstands mussten einige Kollegen in den letzten Monaten besonders viele Überstunden machen", "explain_ru": "Верно c: текст прямо объясняет сверхурочные высоким уровнем больничных («Aufgrund des hohen Krankenstands mussten einige Kollegen … besonders viele Überstunden machen»), а до этого сказано, что многие коллеги болеют. a неверно: отпуска не причина, их как раз ограничивают («Urlaubsanträge können im Moment nur im Falle dringender persönlicher Angelegenheiten genehmigt werden»). b переворачивает смысл: сверхурочные делает не тот, кто на больничном, а остальные.", "explain": "Correcto c: el texto justifica expresamente las horas extras con el alto índice de bajas («Aufgrund des hohen Krankenstands mussten einige Kollegen … besonders viele Überstunden machen»), y antes ha explicado que muchos compañeros están enfermos. a es falso: las vacaciones no son la causa, sino que precisamente se restringen («Urlaubsanträge können im Moment nur im Falle dringender persönlicher Angelegenheiten genehmigt werden»). b invierte los términos: quien está de baja no hace horas extras, son los demás quienes las asumen."}, {"n": 15, "type": "choice", "prompt": "Aufgrund des hohen Krankenstands", "options": [{"key": "a", "text": "bleibt die Arbeit teilweise unerledigt."}, {"key": "b", "text": "müssen die Überstunden im kommenden Jahr abgebaut werden./ müssen die Überstunden ins kommende Jahr mitgenommen werden."}, {"key": "c", "text": "gibt es eine Urlaubssperre."}], "answer": "c", "confidence": "hoch", "quote": "Urlaubsanträge können im Moment nur im Falle dringender persönlicher Angelegenheiten genehmigt werden.", "explain_ru": "Вторая редакция пункта 15 («новый вариант вопроса»). Верно c: в протоколе сказано, что сейчас заявления на отпуск одобряют только при срочных личных обстоятельствах, что равнозначно запрету на отпуск; сам заголовок протокола объявляет это словом «Urlaubssperre». a — правдоподобное следствие («Die Kundenbetreuung ist aktuell unterbesetzt»), но в тексте нигде не сказано, что работа останется несделанной. b неверно: сверхурочные следует по возможности снять до конца года («möglichst bis zum Ende des Kalenderjahres abgebaut werden sollten»), и только если это невозможно, переносят на следующий год, а не наоборот.", "explain": "Segunda redacción del ítem 15 («новый вариант вопроса»). Correcto c: el acta dice que en ese momento las solicitudes de vacaciones solo se aprueban en caso de asuntos personales urgentes, lo que equivale a una congelación de vacaciones; el propio encabezado del acta lo anuncia con la palabra «Urlaubssperre». a es una consecuencia verosímil («Die Kundenbetreuung ist aktuell unterbesetzt»), pero el texto no afirma en ningún momento que el trabajo quede sin hacer. b es falso: las horas extras deben reducirse preferiblemente antes de fin de año («möglichst bis zum Ende des Kalenderjahres abgebaut werden sollten») y solo si no es posible se trasladan al año siguiente, no al revés."}, {"n": 16, "type": "choice", "prompt": "KM", "options": [{"key": "a", "text": "ist Wettbewerber der Firma."}, {"key": "b", "text": "möchte sein Konzept besprechen."}, {"key": "c", "text": "plant eine Rabattaktion im Frühling."}], "answer": "b", "confidence": "hoch", "quote": "KM hat hierfür bereits einen ersten Entwurf für ein Konzept ausgearbeitet und legt diesen vor. Er schlägt vor, das Konzept in einer kleineren Runde zu diskutieren.", "explain_ru": "Верно b: KM представляет свой черновик концепции и предлагает обсудить его в узком кругу («in einer kleineren Runde zu diskutieren»). a неверно: конкурент — внешняя фирма «Lutz GmbH», а KM — руководитель отдела продаж в самой компании. c неверно, потому что акцию со скидками к весне планирует конкурент, а не KM.", "explain": "Correcto b: KM presenta su borrador de concepto y propone discutirlo en un grupo reducido («in einer kleineren Runde zu diskutieren»). a es falso: el competidor es la empresa externa «Lutz GmbH», y KM es el jefe de Ventas de la propia firma. c es falso porque quien planea la acción de descuento para la primavera es el competidor, no KM."}, {"n": 17, "type": "choice", "prompt": "Die Firma", "options": [{"key": "a", "text": "besucht die Frühjahrsmesse regelmäßig."}, {"key": "b", "text": "braucht Hilfe bei der Standgestaltung."}, {"key": "c", "text": "lässt gerade Broschüren drucken."}], "answer": "c", "confidence": "hoch", "quote": "Auch die Broschüren zu unserem Messeauftritt sind bereits im Druck und können in der 2. KW an unsere Kunden verschickt werden.", "explain_ru": "Верно c: буклеты для выставки «sind bereits im Druck», то есть уже в печати. a неверно, потому что фирма участвует впервые («Im nächsten Jahr wird unsere Firma erstmals an der Frühjahrsmesse in Dresden teilnehmen»), значит это не привычное участие. b неверно: стенд уже забронирован и монтажник нанят («bereits der Standplatz gebucht und der Messebauer beauftragt ist»); предлагается только посмотреть дизайн стенда в офисе MB.", "explain": "Correcto c: los folletos para la feria «sind bereits im Druck», es decir, están en imprenta en este momento. a es falso porque la empresa participará por primera vez («Im nächsten Jahr wird unsere Firma erstmals an der Frühjahrsmesse in Dresden teilnehmen»), luego no es una cita habitual. b es falso: el stand ya está reservado y el montador contratado («bereits der Standplatz gebucht und der Messebauer beauftragt ist»); lo único que se ofrece es poder ver el diseño del stand en la oficina de MB."}, {"n": 18, "type": "choice", "prompt": "Persönliche Gegenstände", "options": [{"key": "a", "text": "können nicht in der Küche bleiben."}, {"key": "b", "text": "sollen am Donnerstag mitgenommen werden."}, {"key": "c", "text": "sollen weggeworfen werden."}], "answer": "b", "confidence": "mittel", "quote": "werden die Mitarbeiter gebeten, bei dieser Gelegenheit persönliche Gegenstände wie zum Beispiel nicht firmeneigene Kaffeetassen, Brotdosen und Ähnliches bis Donnerstag an sich zu nehmen. Ansonsten werden diese durch AW entsorgt.", "explain_ru": "Верно b: сотрудников просят забрать личные вещи «bis Donnerstag», то есть указан конкретный срок. c как общее правило неверно, потому что в тексте их выбрасывают только «ansonsten», то есть если никто их не заберёт. a — частично защитимое прочтение (кухню нужно полностью освободить для покраски), но такой запрет в протоколе не сформулирован: там устанавливают обязанность забрать вещи до четверга; отсюда средняя уверенность.", "explain": "Correcto b: se pide a los empleados que recojan sus objetos personales «bis Donnerstag», o sea, con ese plazo concreto. c es falso como norma general porque el texto solo prevé tirarlos «ansonsten», esto es, si nadie los retira. a es una lectura parcialmente defendible (la cocina debe vaciarse por completo para pintarla), pero el acta no formula esa prohibición: lo que hace es fijar la obligación de retirarlos antes del jueves; de ahí la confianza media."}]}, {"id": "t4_c-p53", "note_ru": "Протокол собрания от 15.04.2003: текст занимает с. 53-54, вопросы 14-18 — в конце с. 54, их не следует путать с вопросами предыдущего варианта (с. 52).", "label": "Variante 4 (Protokoll 15.04.2003)", "page": 53, "note": "Acta de la reunión del 15.04.2003: el texto ocupa las pp. 53-54 y las preguntas 14-18 están al final de la p. 54, de modo que no deben confundirse con las de la variante anterior (p. 52).", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(neue Werbestrategie, Jobticket)\nProtokoll 15.04.2003, 14:00-16:00 Uhr\nTagungsraum: 256, Ort: Geschwister-Scholl-Platz 12, 10738 Berlin\nAnwesende: Petra Kramer (PK, Geschäftsleitung), Yvonne Schmidt (YS, Assistenz der Geschäftsleitung), Thorsten Klein (TK, Leitung Einkauf), Sonja Kühl (SK, Leitung Finanzen), Jenny Mitschke (JM, Leitung Marketing), Ilkay Ergün (IE, Leitung Produktion), Johannes Schön (JS, Leitung Personal)\nGast: Jonas Braun (Deutsches Rotes Kreuz)\nSitzungsleitung: Johannes Schön\nProtokollantin: Yvonne Schmidt\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des Protokolls der letzten Sitzung\n2. Neue Werbemaßnahmen\n3. Beschwerden über schlecht geputzte Büros\n4. Fortbildung der Ersthelfer\n5. Einführung eines Jobtickets\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung des Protokolls der letzten Sitzung\nJS begrüßt alle Anwesenden und stellt den Gast Jonas Braun vom Deutschen Roten Kreuz vor. Weiterhin bittet er um die Genehmigung des Protokolls der letzten Sitzung. SK merkt an, dass das Datum des diesjährigen Sommerfests falsch im letzten Protokoll festgehalten wurde. Dieses findet am 19.07. statt. Die Änderung wird aufgenommen, ansonsten wird das Protokoll genehmigt.\nTOP 2 Neue Werbemaßnahmen\nJM berichtet, dass die Marketingabteilung eine neue Werbestrategie entwickelt hat, um die Verkaufszahlen wieder zu verbessern. SK hatte in der letzten Sitzung berichtet, dass sie seit Januar dieses Jahres stetig zurückgegangen sind.\nUm langfristige Lösungen zu finden, wurde eine Marktanalyse in Auftrag gegeben. Bevor die Ergebnisse vorliegen, sollen aber bereits erste Maßnahmen ergriffen werden. Ein IT-Mitarbeiter erarbeitet zurzeit ein Konzept, um die Homepage der Firma etwas moderner und benutzerfreundlicher zu gestalten. Außerdem sollte man unsere Homepage möglichst auf der ersten Seite in der Suchmaschine finden können. Diese Maßnahmen wären relativ schnell und kostengünstig umsetzbar.\nAuch die Präsenz in den sozialen Medien soll weiter ausgebaut werden, um die jüngere Zielgruppe noch besser zu erreichen. JM schlägt in diesem Zusammenhang vor, kurze, unterhaltsame Werbevideos zu drehen. Für deren Produktion wurde ein Filmteam angefragt, das auf dem Markt sehr erfolgreich, aber auch sehr teuer ist. PK beauftragt JM, bis zur nächsten Sitzung noch andere, günstigere Filmteams über Produktion zu prüfen.\nTOP 3 Beschwerden über schlecht geputzte Büros\nSeit der Zusammenarbeit mit der neuen Reinigungsfirma beschweren sich viele Kollegen aus verschiedenen Abteilungen darüber, dass die tägliche Reinigung der Büros unzureichend ausgeführt wird. Kritikpunkte sind schmutzige Tische, unregelmäßig geleerte Mülleimer und unordentlich gesaugte Fußböden. Dazu kommt, dass die Reinigungskräfte bei Eintreffen der Mitarbeiter gegen 9 Uhr noch anwesend sind, obwohl die Reinigungsarbeiten bis 8.30 Uhr abgeschlossen sein sollten. JS soll Kontakt zur Reinigungsfirma aufnehmen, um das Problem zu besprechen. Sollte es zu keiner Änderung kommen, wird der Vertrag fristlos gekündigt.\nTOP 4 Fortbildung der Ersthelfer\nUnsere Ersthelfer müssen regelmäßig Fortbildungen besuchen. Dafür konnten wir Jonas Braun vom Deutschen Roten Kreuz als Kursleiter gewinnen, der zusammen mit JS aus der Personalabteilung Samstag, den 10.06. als Termin festgelegt hat. Das Training dauert neun Stunden. Es wird bei uns im Haus stattfinden und als Arbeitszeit angerechnet. Die Teamleiter sollen möglichst bald klären, ob die bisherigen Ersthelfer diese Funktion weiter übernehmen möchten oder ob es neue Interessenten gibt. Jonas Braun weist allerdings darauf hin, dass die Teilnehmerzahl auf acht Personen beschränkt ist. Die interessierten Mitarbeiter müssen sich bis zum 15.05. in der Personalabteilung anmelden.\nTOP 5 Einführung eines Jobtickets\nPK teilt mit, dass aufgrund der schwierigen Parksituation mehr Mitarbeiter dazu animiert werden sollen, öffentliche Verkehrsmittel zu nutzen. Aus diesem Grund wird sich die Firma an den Fahrtkosten der Beschäftigten in Form von Jobtickets beteiligen. Das bedeutet, dass Mitarbeiter ab dem 01.07. zu ihrer Monatskarte einen Zuschuss von 50 Prozent, maximal aber 60 Euro erhalten.\nAntragsformulare sind bei JS erhältlich. Er steht auch für Fragen zur Verfügung.\nTOP 6 Sonstiges\nTK berichtet, dass sich die Lieferzeiten unseres Zulieferers wieder normalisiert haben. Die Ursache der Verzögerungen war ein Mitarbeiterstreik in der Partnerfirma in Litauen, der aber inzwischen beigelegt wurde.\nJS teilt mit, dass von den vier neu eingestellten Mitarbeitern einer die Probezeit nicht beendet hat und seit dem 01.04. nicht mehr in der Firma tätig ist.", "items": [{"n": 14, "type": "choice", "prompt": "Die neue Werbestrategie", "options": [{"key": "a", "text": "beinhaltet ein Video über die Produktionsabläufe."}, {"key": "b", "text": "ist wegen der schlechten Verkaufszahlen notwendig."}, {"key": "c", "text": "lässt sich sehr schnell und kostengünstig umsetzen."}], "answer": "b", "confidence": "hoch", "quote": "JM berichtet, dass die Marketingabteilung eine neue Werbestrategie entwickelt hat, um die Verkaufszahlen wieder zu verbessern. SK hatte in der letzten Sitzung berichtet, dass sie seit Januar dieses Jahres stetig zurückgegangen sind.", "explain_ru": "Верно b: рекламная стратегия появилась именно чтобы улучшить показатели продаж, которые с января постоянно падают («um die Verkaufszahlen wieder zu verbessern … stetig zurückgegangen»). a неверно: рекламные ролики короткие и занимательные и предназначены для соцсетей, чтобы привлечь молодую аудиторию, а не рассказывают о производственных процессах. c неверно из-за детали: «Diese Maßnahmen wären relativ schnell und kostengünstig umsetzbar» относится только к мерам для сайта; к тому же нанятая съёмочная команда «sehr teuer», и PK поручено искать более дешёвые варианты.", "explain": "Correcto b: la estrategia publicitaria nace precisamente para mejorar unas cifras de ventas que llevan cayendo desde enero («um die Verkaufszahlen wieder zu verbessern … stetig zurückgegangen»). a es falso: los vídeos publicitarios son breves y entretenidos y van destinados a las redes sociales para captar al público joven, no tratan de los procesos de producción. c es falso por un detalle de referencia: «Diese Maßnahmen wären relativ schnell und kostengünstig umsetzbar» se refiere solo a las medidas para la página web; además el equipo de filmación contratado es «sehr teuer» y PK encarga buscar alternativas más baratas."}, {"n": 15, "type": "choice", "prompt": "Die Reinigungsfirma", "options": [{"key": "a", "text": "hält sich nicht an die vereinbarten Putzzeiten."}, {"key": "b", "text": "putzt die Büros der Firma nicht regelmäßig."}, {"key": "c", "text": "wird den Vertrag demnächst kündigen."}], "answer": "a", "confidence": "hoch", "quote": "Dazu kommt, dass die Reinigungskräfte bei Eintreffen der Mitarbeiter gegen 9 Uhr noch anwesend sind, obwohl die Reinigungsarbeiten bis 8.30 Uhr abgeschlossen sein sollten.", "explain_ru": "Верно a: уборщики всё ещё в здании около 9 часов, хотя работы должны быть закончены к 8.30, то есть согласованный график не соблюдается. b неверно: уборка всё же делается ежедневно («die tägliche Reinigung der Büros»), просто её недостаточно; «unregelmäßig» в тексте относится только к мусорным вёдрам, которые не всегда опорожняют. c меняет роли: расторгнуть договор без предупреждения угрожает сама фирма («Sollte es zu keiner Änderung kommen, wird der Vertrag fristlos gekündigt»), а не клининговая компания.", "explain": "Correcto a: el personal de limpieza sigue en el edificio hacia las 9 h aunque los trabajos deben estar terminados a las 8.30 h, es decir, no respeta el horario acordado. b es falso: la limpieza sí se hace a diario («die tägliche Reinigung der Büros»), lo que ocurre es que es insuficiente; el «unregelmäßig» del texto se refiere solo a los cubos de basura que no siempre se vacían. c invierte los papeles: quien amenaza con rescindir el contrato sin preaviso es la propia empresa («Sollte es zu keiner Änderung kommen, wird der Vertrag fristlos gekündigt»), no la empresa de limpieza."}, {"n": 16, "type": "choice", "prompt": "Die Fortbildung für Ersthelfer", "options": [{"key": "a", "text": "ist nur mit begrenzter Teilnehmerzahl möglich."}, {"key": "b", "text": "müssen die Teilnehmer nur einmal absolvieren."}, {"key": "c", "text": "wird beim Deutschen Roten Kreuz veranstaltet."}], "answer": "a", "confidence": "hoch", "quote": "Jonas Braun weist allerdings darauf hin, dass die Teilnehmerzahl auf acht Personen beschränkt ist.", "explain_ru": "Верно a: число участников ограничено восемью человеками. b неверно: для первой помощи требуется регулярное повышение квалификации («Unsere Ersthelfer müssen regelmäßig Fortbildungen besuchen»), а не однократное. c неверно: Jonas Braun из DRK выступает как докладчик, но курс проходит на самом предприятии («Es wird bei uns im Haus stattfinden»).", "explain": "Correcto a: el número de participantes está limitado a ocho personas. b es falso: los primeros auxilios exigen formación continua («Unsere Ersthelfer müssen regelmäßig Fortbildungen besuchen»), no una sola vez. c es falso: Jonas Braun, del DRK, actúa como ponente, pero el curso se celebra en la propia empresa («Es wird bei uns im Haus stattfinden»)."}, {"n": 17, "type": "choice", "prompt": "Das Jobticket", "options": [{"key": "a", "text": "soll zu 60 Prozent finanziert werden."}, {"key": "b", "text": "kann in der Personalabteilung beantragt werden."}, {"key": "c", "text": "wird ab nächsten Monat eingeführt."}], "answer": "b", "confidence": "hoch", "quote": "Antragsformulare sind bei JS erhältlich. Er steht auch für Fragen zur Verfügung.", "explain_ru": "Верно b: бланки заявлений можно получить у JS, то есть у «Johannes Schön (JS, Leitung Personal)» — в отделе кадров. a путает цифры: дотация составляет 50 процентов, максимум 60 евро. c неверно: выплата действует «ab dem 01.07.», а протокол от 15.04.2003, значит это не следующий месяц.", "explain": "Correcto b: los formularios de solicitud se obtienen en JS, que es «Johannes Schön (JS, Leitung Personal)», es decir, en la dirección de Personal. a confunde las cifras: la subvención es del 50 por ciento con un máximo de 60 euros. c es falso: el abono entra en vigor «ab dem 01.07.», mientras que el acta es del 15.04.2003, de modo que no es el mes siguiente."}, {"n": 18, "type": "choice", "prompt": "Der Streik in Litauen", "options": [{"key": "a", "text": "dauert immer noch an."}, {"key": "b", "text": "fand landesweit statt."}, {"key": "c", "text": "führte zu Lieferproblemen."}], "answer": "c", "confidence": "hoch", "quote": "Die Ursache der Verzögerungen war ein Mitarbeiterstreik in der Partnerfirma in Litauen, der aber inzwischen beigelegt wurde.", "explain_ru": "Верно c: причиной задержек поставок была забастовка, и сейчас поставки уже нормализовались. a неверно, потому что забастовка «inzwischen beigelegt wurde», то есть уже урегулирована. b неверно: это была забастовка работников «in der Partnerfirma in Litauen», то есть на партнёрском предприятии, а не по всей стране.", "explain": "Correcto c: la huelga fue la causa de los retrasos en las entregas, que ahora ya se han normalizado. a es falso porque la huelga «inzwischen beigelegt wurde», ya se ha resuelto. b es falso: fue una huelga de trabajadores «in der Partnerfirma in Litauen», es decir, en la empresa asociada, no en todo el país."}]}, {"id": "t4_d-p55", "note_ru": "Протокол собрания от 05.02.20XX (с. 55-56): текст занимает с. 55 и начало с. 56, вопросы 14-18 — в конце с. 56. Их не следует путать с вопросами следующего варианта, которые находятся в конце с. 58. Пункт 15 опирается на TOP 5, который в протоколе был перенесён вперёд по просьбе KW.", "label": "Variante 5 (Protokoll 05.02.20XX)", "page": 55, "note": "Acta de la reunión del 05.02.20XX (pp. 55-56): el texto ocupa la p. 55 y el comienzo de la p. 56, y las preguntas 14-18 aparecen al final de la p. 56. No deben confundirse con las de la variante siguiente, cuyas preguntas están al final de la p. 58. El ítem 15 se apoya en el TOP 5, que en el acta se adelantó por petición de KW.", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(Frau Wagner, Kantine)\n\nProtokoll 05.02.20XX, 14.00 - 16.00 Uhr\nSitzungsraum: 239, Ort: Hauptstraße 23, 25421 Pinneberg\nAnwesende: Michael Müller (MM, Stellvertreter Geschäftsleitung), Katrin Wagner (KW, Leitung Personal), Henry Smith (HS, Leitung Produktion), Tomás Rodríguez (TR, Leitung Vertrieb), Manuela Hinz (MH, Leitung Qualitätsmanagement), Karl Lehmann (KL, Leitung Finanzen), Sabine Kurz (SK, Hausverwaltung)\nSitzungsleitung: Michael Müller\nProtokollantin: Katrin Wagner\n\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Probleme bei der Warenauslieferung\n3. Berichte\n4. Sanierung der Kantine\n5. Neue Krankmeldungsregelung\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nMM heißt alle Anwesenden zur heutigen Besprechung willkommen und bittet um die Genehmigung des Protokolls der letzten Sitzung. Per Handzeichen wird das Protokoll der Sitzung vom 08.01. ohne weitere Änderungen und Ergänzungen einstimmig genehmigt. Aufgrund terminlicher Verpflichtungen muss KW die Sitzung früher verlassen und bittet darum, TOP 5 der heutigen Tagesordnung vorzuziehen. Das wird einstimmig angenommen.\n\nTOP 2 Probleme bei der Warenauslieferung\nTR teilt mit, dass sich immer wieder Kunden über den Zustand unserer gelieferten Waren beschwert haben. Auf dem Transportweg kommt es wohl immer wieder zu Beschädigungen der Verpackungen, sodass die Ware teilweise gar nicht oder nur zu stark reduzierten Preisen an den Endkunden verkauft werden kann. Man habe mit der Spedition schon öfter über diese Problematik gesprochen. Diese sieht das Problem jedoch bei uns und ist der Ansicht, dass die Schäden durch minderwertiges Verpackungsmaterial entstehen und nicht durch den Transport. MH und HS haben das Verpackungsmaterial überprüft und weisen den Vorwurf vehement zurück. Nachdem das Problem bis heute nicht gelöst werden konnte, macht MH den Vorschlag, dass unsere Firma die Lieferungen in Zukunft selbst übernimmt. Dafür werden KL und TR zusammen ein Konzept zur Finanzierung erarbeiten. Dieses soll zur übernächsten Sitzung in zwei Monaten vorliegen.\n\nTOP 3 Berichte\nHS berichtet, dass durch die Einstellung von zehn Zeitarbeitskräften am Fließband 3 und 4 der personelle Engpass für den Moment behoben werden konnte, und dankt der Personalabteilung für die prompte und unbürokratische Lösung des Problems. Er regt an, um die Unterbesetzung in der Produktion dauerhaft zu lösen, einige Zeitarbeitskräfte fest anzustellen. Insbesondere Herr Ahmed Hassani und Frau Ina Zurek sind ihm durch ihre Zuverlässigkeit und schnelle Auffassungsgabe positiv aufgefallen.\n\nTOP 4 Sanierung der Kantine\nSK macht darauf aufmerksam, dass die Küche ab dem kommenden Montag saniert wird und die Kantine infolgedessen voraussichtlich sechs bis acht Wochen geschlossen sein wird. Alle Abteilungsleiter sollen ihre Teams daran erinnern, sich selbst Verpflegung mitzubringen oder alternativ das Bistro „Suppenkasper“ in der Sonnenstraße zu nutzen. Die Essensmarken der Firma gelten während der Kantinenschließung auch dort in der Mittagszeit von 12.00 bis 14.00 Uhr.\n\nTOP 5 Neue Krankmeldungsregelung (vorgezogener TOP)\nDie Geschäftsleitung hatte in der letzten Mitarbeiterversammlung angekündigt, dass die Mitarbeiter zukünftig schon ab dem ersten Krankheitstag einen Krankenschein vom Arzt benötigen. Die bisherige Regelung ab dem dritten Tag berichtet, dass diese Entscheidung in der Belegschaft für großen Unmut sorgt. Sie bittet alle Abteilungsleiter ein weiteres Mal, den Sinn dieser Maßnahme zu erläutern. In der nächsten Sitzung soll das Thema noch einmal behandelt werden. Man hofft auf eine breite Akzeptanz.\n\nTOP 6 Sonstiges\nMM teilt mit, dass ab dem kommenden Monat für die Autofahrer mehr Parkplätze zur Verfügung stehen. Diese entstehen neben dem Eingang C. Alle Mitarbeiterinnen und Mitarbeiter sollen in einer Rundmail darüber informiert werden und wer Interesse hat, kann in der Personalabteilung einen kostenlosen Stellplatz beantragen.", "items": [{"n": 14, "type": "choice", "prompt": "Frau Wagner", "options": [{"key": "a", "text": "bittet um Änderungen des Protokolls vom 08.01."}, {"key": "b", "text": "hat heute noch einen anderen wichtigen Termin."}, {"key": "c", "text": "schlägt einen zusätzlichen Tagesordnungspunkt vor."}], "answer": "b", "confidence": "hoch", "quote": "Aufgrund terminlicher Verpflichtungen muss KW die Sitzung früher verlassen und bittet darum, TOP 5 der heutigen Tagesordnung vorzuziehen.", "explain_ru": "Верно b: у KW (Katrin Wagner, Leitung Personal) другие обязательства по календарю («terminliche Verpflichtungen»), поэтому ей приходится уйти с собрания раньше, то есть сегодня у неё ещё есть важная встреча. a неверно: утверждение протокола просит MM, и протокол от 08.01. утверждают «ohne weitere Änderungen und Ergänzungen», то есть без изменений. c неверно: она предлагает не новый пункт, а перенести вперёд уже включённый в повестку TOP 5.", "explain": "Correcto b: KW (Katrin Wagner, Leitung Personal) tiene otros compromisos de agenda («terminliche Verpflichtungen») y por eso tiene que abandonar la reunión antes de tiempo, es decir, hoy todavía tiene otro compromiso importante. a es falso: quien pide la aprobación del acta es MM y el acta del 08.01. se aprueba «ohne weitere Änderungen und Ergänzungen», o sea, sin ningún cambio. c es falso: no propone un punto nuevo, sino adelantar uno que ya figura en el orden del día, el TOP 5."}, {"n": 15, "type": "choice", "prompt": "Die Geschäftsleitung möchte, dass", "options": [{"key": "a", "text": "das Thema Krankmeldung nicht mehr besprochen wird."}, {"key": "b", "text": "man bei Krankheit spätestens am dritten Tag zum Arzt geht."}, {"key": "c", "text": "sich Mitarbeiter bei Krankheit sofort krankschreiben lassen."}], "answer": "c", "confidence": "hoch", "quote": "Die Geschäftsleitung hatte in der letzten Mitarbeiterversammlung angekündigt, dass die Mitarbeiter zukünftig schon ab dem ersten Krankheitstag einen Krankenschein vom Arzt benötigen.", "explain_ru": "Верно c: руководство требует больничный лист уже с первого дня болезни, то есть работник должен оформить его сразу. b воспроизводит как раз прежнее правило, которое хотят заменить («Die bisherige Regelung ab dem dritten Tag»), и потому это ловушка: «spätestens am dritten Tag» — старая система, а не желаемая. a неверно, потому что вопрос не закрывают: «In der nächsten Sitzung soll das Thema noch einmal behandelt werden».", "explain": "Correcto c: la dirección exige el parte médico ya desde el primer día de enfermedad, es decir, que el empleado se haga dar la baja inmediatamente al enfermar. b reproduce justamente la norma anterior que se quiere sustituir («Die bisherige Regelung ab dem dritten Tag»), y por eso es un distractor: el «spätestens am dritten Tag» es el sistema viejo, no el deseado. a es falso porque el asunto no se archiva: «In der nächsten Sitzung soll das Thema noch einmal behandelt werden»."}, {"n": 16, "type": "choice", "prompt": "Karl Lehmann soll", "options": [{"key": "a", "text": "besseres Verpackungsmaterial einkaufen."}, {"key": "b", "text": "einen Finanzierungsplan erstellen."}, {"key": "c", "text": "Kontakt mit der Spedition aufnehmen."}], "answer": "b", "confidence": "hoch", "quote": "Dafür werden KL und TR zusammen ein Konzept zur Finanzierung erarbeiten. Dieses soll zur übernächsten Sitzung in zwei Monaten vorliegen.", "explain_ru": "Верно b: чтобы предприятие само взяло на себя доставку, KL (Karl Lehmann, Leitung Finanzen) и TR должны совместно разработать концепцию финансирования, со сроком («zur übernächsten Sitzung in zwei Monaten»). a неверно: упрёк в плохом качестве упаковочного материала высказывает транспортное агентство, а MH и HS «vehement» его отвергают; никому не поручают покупать новый материал. c неверно, потому что контакт с агентством уже есть: «Man habe mit der Spedition schon öfter über diese Problematik gesprochen».", "explain": "Correcto b: para que la empresa asuma ella misma las entregas, KL (Karl Lehmann, Leitung Finanzen) y TR deben elaborar conjuntamente un concepto de financiación, con plazo fijado («zur übernächsten Sitzung in zwei Monaten»). a es falso: la acusación de que el material de embalaje es de mala calidad la formula la agencia de transportes y MH y HS la rechazan «vehement»; nadie recibe el encargo de comprar material nuevo. c es falso porque el contacto con la agencia ya existe: «Man habe mit der Spedition schon öfter über diese Problematik gesprochen»."}, {"n": 17, "type": "choice", "prompt": "In der Produktionsabteilung", "options": [{"key": "a", "text": "gibt es derzeit genügend Mitarbeiter."}, {"key": "b", "text": "will man alle Zeitarbeiter fest anstellen."}, {"key": "c", "text": "wurden zwei neue Mitarbeiter fest eingestellt."}], "answer": "a", "confidence": "hoch", "quote": "durch die Einstellung von zehn Zeitarbeitskräften am Fließband 3 und 4 der personelle Engpass für den Moment behoben werden konnte", "explain_ru": "Верно a: привлечение десяти временных работников на конвейеры 3 и 4 решило нехватку персонала «für den Moment», значит сейчас людей достаточно. b ошибается в одном слове: в протоколе сказано «einige Zeitarbeitskräfte fest anzustellen» (некоторых), а не всех. c неверно: Herr Ahmed Hassani и Frau Ina Zurek лишь положительно себя проявили («sind ihm … positiv aufgefallen»); десять человек пришли как Zeitarbeitskräfte, и о постоянных договорах с ними не сказано.", "explain": "Correcto a: la contratación de diez trabajadores temporales en las cintas 3 y 4 ha resuelto la falta de personal «für den Moment», de modo que ahora mismo hay plantilla suficiente. b falla por una palabra clave: el acta dice «einige Zeitarbeitskräfte fest anzustellen» (algunos), no todos. c es falso: Herr Ahmed Hassani y Frau Ina Zurek solo han llamado la atención positivamente («sind ihm … positiv aufgefallen»); los diez incorporados lo fueron como Zeitarbeitskräfte y no consta ninguna contratación fija."}, {"n": 18, "type": "choice", "prompt": "In der Kantine", "options": [{"key": "a", "text": "bekommt man in den kommenden Wochen kein Essen."}, {"key": "b", "text": "kann man ab Montag von 12 bis 14 Uhr zu Mittag essen."}, {"key": "c", "text": "sollten die Essensmarken abgeschafft werden."}], "answer": "a", "confidence": "hoch", "quote": "dass die Küche ab dem kommenden Montag saniert wird und die Kantine infolgedessen voraussichtlich sechs bis acht Wochen geschlossen sein wird", "explain_ru": "Верно a: кухню ремонтируют со следующего понедельника, и поэтому столовая будет закрыта от шести до восьми недель; значит в эти недели в столовой не кормят. b переносит на столовую то, что относится к бистро: время с 12.00 до 14.00 и талоны касаются бистро «Suppenkasper» на Sonnenstraße на время закрытия, а не столовой, которая закрыта. c неверно: протокол не требует отменить талоны, а подтверждает, что они продолжают действовать в этом заведении («Die Essensmarken der Firma gelten während Kantinenschließung auch dort»).", "explain": "Correcto a: la cocina se reforma a partir del próximo lunes y, como consecuencia, la cantina permanecerá cerrada entre seis y ocho semanas; durante esas semanas, por tanto, en la cantina no se sirve comida. b traslada a la cantina lo que vale para el bistró: el horario de 12.00 a 14.00 y el uso de los vales se refieren al Bistro «Suppenkasper» de la Sonnenstraße durante el cierre, no a la cantina, que está cerrada. c es falso: el acta no pide suprimir los vales, sino que confirma que siguen valiendo en ese establecimiento («Die Essensmarken der Firma gelten während der Kantinenschließung auch dort»)."}]}, {"id": "t4_d-p57", "note_ru": "Протокол собрания от 27.08.20XX (с. 57-58): текст занимает с. 57 и начало с. 58, вопросы 14-18 — в конце с. 58. Примечание: пункт 14 допускает два верных прочтения (a и b), как объяснено в его поле explain. В оригинале вариант помечен как «тест №150321, 150301».", "label": "Variante 6 (Protokoll 27.08.20XX)", "page": 57, "note": "Acta de la reunión del 27.08.20XX (pp. 57-58): el texto ocupa la p. 57 y el comienzo de la p. 58, y las preguntas 14-18 aparecen al final de la p. 58. Aviso: el ítem 14 admite dos lecturas válidas (a y b), tal como se explica en su campo explain. El original etiqueta esta variante como «тест №150321, 150301».", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(Frau Bruhns, Betriebsausflug)\n\nProtokoll 27.08.20XX, 10.00 bis 11.30 Uhr\nKonferenzraum Rhein-Main, Am Wegesrand 12, 63345 Frankfurt\nAnwesende: Thomas Köhler (TK, Werkstatt), Brigitte Turner (BT, Personal), Gerd Schneider (GS, Buchhaltung), Hilde Bruhns (HB, Buchhaltung)\nEntschuldigt: Kari Muster (KM, Lager)\nSitzungsleitung: Gerd Schneider\nProtokollführung: Thomas Köhler\n\nTagesordnungspunkte:\n1. Begrüßung und Eröffnung der Sitzung\n2. Erste-Hilfe-Kurs\n3. Homeoffice\n4. Personelle Engpässe Buchhaltung\n5. Betriebsausflug\n6. Sonstiges\n\nTOP 1 Begrüßung und Eröffnung der Sitzung\nGS eröffnet die Sitzung, begrüßt alle Anwesenden und stellt den Kolleg*innen Hilde Bruhns vor, die seit dem 1. August in der Abteilung Buchhaltung für die Auszahlung der Gehälter etc. zuständig ist.\n\nTOP 2 Erste-Hilfe-Kurs\nTK berichtet, dass es vor Kurzem zu einem Unfall in der Werkstatt gekommen ist, bei dem ein Kollege am Arm verletzt wurde und stark geblutet hat. Obwohl regelmäßig Sicherheitsunterweisungen für die Mitarbeitenden im Lager und in der Werkstatt stattfinden, reagierte nur ein Kollege ruhig und besonnen und war in der Lage, den Verletzten zu versorgen und dann Hilfe zu holen. Die anderen wussten nicht, was sie tun sollten. Auch in der Marketingabteilung gab es eine Situation, in der einer Kollegin wohl wegen der Hitze schwindlig wurde und ein Krankenwagen gerufen werden musste, da niemand von den Mitarbeiter*innen helfen konnte.\nTK schlägt deshalb vor, einen Erste-Hilfe-Kurs im Unternehmen zu organisieren, an dem alle interessierten Angestellten teilnehmen können. TK hat bereits mit dem Roten Kreuz gesprochen. Es wäre möglich, dort kurzfristig einen solchen Kurs an zwei Freitagsterminen zu buchen.\n\nTOP 3 Homeoffice\nBT stellt dar, dass immer wieder Mitarbeiter*innen den Wunsch an sie herantragen, den einen oder anderen Tag in der Woche von zu Hause aus zu arbeiten, wenn sie Aufgaben zu erledigen haben, die eine Anwesenheit im Büro nicht unbedingt erforderlich machen.\nBT steht diesem Wunsch offen gegenüber. Durch diese Möglichkeit könnten die Mitarbeiter*innen die Zeit für den Arbeitsweg sparen und sich ihre Arbeitszeit flexibler einteilen. Das würde sicher erheblich zur Mitarbeiterzufriedenheit beitragen. Den Mitarbeiter*innen, die im Homeoffice arbeiten, müssten firmeneigene Laptop, Diensthandys zur Verfügung gestellt werden. Da aber bereits einige mobile Geräte im Unternehmen vorhanden sind, würde das keine signifikanten Mehrkosten bedeuten. Sollte sich das Arbeitsmodell „Homeoffice“ bewähren, könnte für die Kolleg*innen die regelmäßig von zu Hause aus arbeiten, ein VPN-Tunnel eingerichtet werden, durch den sie sicheren Zugang zu den Daten auf dem Firmenserver erhalten würden.\nBT bittet bis Mitte der nächsten Woche um Rückmeldungen, was die einzelnen Abteilungsleiter*innen davon halten, bevor sie den Vorschlag der Geschäftsführung vorlegt.\n\nTOP 4 Personelle Engpässe in der Buchhaltung\nGS teilt mit, dass die Buchhaltung zur Zeit trotz der Neueinstellung von Frau Bruhns personell unterbesetzt ist.\nDas Arbeitsaufkommen ist von den derzeit drei Mitarbeiter*innen in der Abteilung nicht mehr zu bewältigen. Im Moment ist auch noch eine Kollegin krank, sodass das verbleibende Kolleg*innen viele Überstunden machen müssen, um die Arbeit zu schaffen. Er plant, eine weitere Mitarbeiterin oder ein weiteren Mitarbeiter einzustellen.\n\nTOP 5 Betriebsausflug\nHB arbeitet im diesjährigen Team für die Organisation des Betriebsausflugs mit, um so gleich einige Kolleg*innen kennenzulernen. Sie berichtet, dass der Ausflug am 1. Oktober stattfindet. Alle Mitarbeiter*innen treffen sich morgens um 9.00 Uhr vor dem Haupteingang der Firma. Dort werden sie von einem Bus abgeholt und zum Kastell Saalburg gefahren.\nVom Parkplatz am Fuße der Burg aus ist eine kleine Wanderung geplant. Am Ziel wartet eine Überraschung. Für das leibliche Wohl ist gesorgt. Die Rückkehr zur Firma ist für 19.00 Uhr gleichen Tag vorgesehen.\n\nTOP 6 Sonstiges\nEntfällt. Keiner der Anwesenden hat noch Punkte zu besprechen.", "items": [{"n": 14, "type": "choice", "prompt": "Frau Bruhns", "options": [{"key": "a", "text": "arbeitet seit einigen Wochen in der Buchhaltung."}, {"key": "b", "text": "bezahlt die Gehälter der Mitarbeiter*innen."}, {"key": "c", "text": "nimmt bald ihre Tätigkeit auf."}], "answer": "a", "confidence": "niedrig", "quote": "GS eröffnet die Sitzung, begrüßt alle Anwesenden und stellt den Kolleg*innen Hilde Bruhns vor, die seit dem 1. August in der Abteilung Buchhaltung für die Auszahlung der Gehälter etc. zuständig ist.", "explain_ru": "Верно a, но с оговоркой: протокол от 27.08.20XX, а Frau Bruhns работает в бухгалтерии с 1 августа, то есть уже несколько недель; кроме того, TOP 4 подтверждает, что она уже приступила («trotz der Neueinstellung von Frau Bruhns»). c исключается, потому что она уже на месте и не «nimmt bald ihre Tätigkeit auf». Предупреждение о неоднозначности: b тоже буквально подтверждается той же фразой («für die Auszahlung der Gehälter etc. zuständig ist»), поэтому пункт допускает два ключа; выбран a как самый явный факт о её положении (она работает там с 1 августа), но если официальный ключ — b, он столь же защитим. Отсюда низкая уверенность.", "explain": "Correcto a, pero con reservas: el acta es del 27.08.20XX y Frau Bruhns trabaja en el departamento de contabilidad desde el 1 de agosto, es decir, desde hace unas semanas; además el TOP 4 confirma que su incorporación ya se ha producido («trotz der Neueinstellung von Frau Bruhns»). c queda descartado porque ya está en el puesto y no «nimmt bald ihre Tätigkeit auf». Advertencia de ambigüedad: b también está respaldada literalmente por la misma frase («für die Auszahlung der Gehälter etc. zuständig ist»), de modo que el ítem admite dos claves; se elige a porque es el dato más explícito sobre su situación (ya trabaja allí desde el 1 de agosto), pero si la clave oficial fuera b sería igualmente defendible. De ahí la confianza baja."}, {"n": 15, "type": "choice", "prompt": "Der Erste-Hilfe-Kurs", "options": [{"key": "a", "text": "findet jeden Freitag statt."}, {"key": "b", "text": "ist für alle Mitarbeiter*innen verpflichtet."}, {"key": "c", "text": "wird vom Roten Kreuz durchgeführt."}], "answer": "c", "confidence": "hoch", "quote": "TK hat bereits mit dem Roten Kreuz gesprochen. Es wäre möglich, dort kurzfristig einen solchen Kurs an zwei Freitagsterminen zu buchen.", "explain_ru": "Верно c: курс поручили бы Rotes Kreuz, с которым TK уже говорила и где его можно было бы забронировать в короткий срок. a искажает цифру: речь о двух датах, обе в пятницу («an zwei Freitagsterminen»), а не о каждой пятнице. b неверно, потому что курс добровольный и только для тех, кому интересно: «an dem alle interessierten Angestellten teilnehmen können».", "explain": "Correcto c: el curso se encargaría al Rotes Kreuz, con quien TK ya ha hablado y donde sería posible reservarlo a corto plazo. a distorsiona la cifra: se habla de dos fechas, las dos en viernes («an zwei Freitagsterminen»), no de todos los viernes. b es falso porque el curso es voluntario y solo para quien tenga interés: «an dem alle interessierten Angestellten teilnehmen können»."}, {"n": 16, "type": "choice", "prompt": "Homeoffice", "options": [{"key": "a", "text": "erfordert die Anschaffung neuer Arbeitsgeräte."}, {"key": "b", "text": "verringert die Arbeitszeit der Mitarbeitenden."}, {"key": "c", "text": "wird von vielen Mitarbeitenden gewünscht."}], "answer": "c", "confidence": "hoch", "quote": "BT stellt dar, dass immer wieder Mitarbeiter*innen den Wunsch an sie herantragen, den einen oder anderen Tag in der Woche von zu Hause aus zu arbeiten", "explain_ru": "Верно c: именно сами сотрудники снова и снова высказывают это пожелание BT («immer wieder … den Wunsch an sie herantragen»). a неверно: хотя работающим из дома нужно было бы предоставить ноутбуки и служебные телефоны, в протоколе подчёркнуто, что мобильные устройства на предприятии уже есть и потому «signifikante Mehrkosten» не возникнет, значит новую технику покупать не нужно. b неверно: удалённая работа экономит время на дорогу и позволяет гибче планировать день, но не сокращает рабочее время.", "explain": "Correcto c: son los propios empleados quienes una y otra vez le plantean ese deseo a BT («immer wieder … den Wunsch an sie herantragen»). a es falso: aunque habría que facilitar portátiles y móviles de empresa a quienes teletrabajen, el acta subraya que ya hay dispositivos móviles en la empresa y que por eso no habría «signifikante Mehrkosten», luego no hay que adquirir equipos nuevos. b es falso: el teletrabajo ahorra el tiempo de desplazamiento y permite organizar el horario con más flexibilidad, pero no reduce la jornada laboral."}, {"n": 17, "type": "choice", "prompt": "In der Abteilung Buchhaltung", "options": [{"key": "a", "text": "gibt es zu viele Beschäftigte."}, {"key": "b", "text": "sind viele Kolleg*innen erkrankt."}, {"key": "c", "text": "soll eine Stelle ausgeschrieben werden."}], "answer": "c", "confidence": "hoch", "quote": "Er plant, eine weitere Mitarbeiterin oder ein weiteren Mitarbeiter einzustellen.", "explain_ru": "Верно c: GS сообщает, что собирается взять ещё одного человека, то есть место будет создано или объявлено. a неверно: отдел «personell unterbesetzt», и работу «ist von den derzeit drei Mitarbeiter*innen in der Abteilung nicht mehr zu bewältigen», значит лишних сотрудников нет. b неверно: на больничном только одна коллега («Im Moment ist auch noch eine Kollegin krank»), а не многие.", "explain": "Correcto c: GS anuncia que piensa contratar a otra persona, es decir, que va a crearse o publicarse una plaza más. a es falso: el departamento está «personell unterbesetzt» y el trabajo «ist von den derzeit drei Mitarbeiter*innen in der Abteilung nicht mehr zu bewältigen», luego no sobran empleados. b es falso: solo hay una compañera de baja («Im Moment ist auch noch eine Kollegin krank»), no muchas."}, {"n": 18, "type": "choice", "prompt": "Der Betriebsausflug wird", "options": [{"key": "a", "text": "für den ganzen Tag geplant."}, {"key": "b", "text": "jedes Jahr von den gleichen Personen organisiert."}, {"key": "c", "text": "zum besseren Kennenlernen der Kolleg*innen genutzt."}], "answer": "a", "confidence": "mittel", "quote": "Die Rückkehr zur Firma ist für 19.00 Uhr gleichen Tag vorgesehen.", "explain_ru": "Верно a: рабочий день начинается в 9.00 у главного входа, а возвращение на предприятие запланировано на 19.00 того же дня, значит поездка занимает целый день. c — частично защитимое прочтение (отсюда средняя уверенность), но в тексте сказано лишь, что HB участвует в команде организаторов «um so gleich einige Kolleg*innen kennenzulernen», то есть это её личный мотив участвовать в организации, а не цель поездки для всех. b неверно: в протоколе речь о команде «diesjährigen» (этого года), что подразумевает смену состава, а не то, что организуют всегда одни и те же.", "explain": "Correcto a: la jornada empieza a las 9.00 h en la puerta principal y el regreso a la empresa está previsto para las 19.00 h del mismo día, de modo que el viaje ocupa el día entero. c es una lectura parcialmente defendible —de ahí la confianza media—, pero el texto solo dice que HB colabora en el equipo organizador «um so gleich einige Kolleg*innen kennenzulernen», esto es, ese es su motivo personal para participar en la organización, no la finalidad del viaje que se atribuye a todos. b es falso: el acta habla del equipo «diesjährigen» (de este año) para la organización, lo que implica que el equipo cambia, no que lo organicen siempre las mismas personas."}]}, {"id": "t4_e-p59", "note_ru": "Протокол собрания от 15.01.20XX в Erfurt (с. 59-60). В оригинале помечен как «тест №140321, 140301».", "label": "Variante 7 (Protokoll 15.01.20XX, Erfurt)", "topic": "Kosteneinsparungen, Lagebericht, Betriebsarzt", "page": 59, "note": "Acta de la reunión del 15.01.20XX en Erfurt (pp. 59-60). El original la etiqueta como «тест №140321, 140301».", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Protokoll 15.01.20XX, 10.00 bis 11.30 Uhr\nSitzungsraum 205, Ort: Hauptstraße 27, 99099 Erfurt\nAnwesende: Jakob Müller (JM, Geschäftsleitung), Friedrich Döring (FD, Vertrieb), Karl Altmann (KA, Buchhaltung und Finanzen), Peter Bischoff (PB, Produktion), Karsten Hinz (KH, Logistik), Jana Bartsch (JB, Personal), Beate Fritsch (BF, Marketing), Jonas Stoll (JS, IT-Abteilung).\nSitzungsleitung: Jakob Müller\nProtokollant: Jonas Stoll\n\nTagesordnungspunkte:\n1. Begrüßung und Tagesordnung\n2. Kosteneinsparungen\n3. Lagebericht Produktion\n4. Kündigung des Betriebsarztes\n5. Betriebliche Altersvorsorge\n6. Sonstiges\n\nTOP 1 Begrüßung und Tagesordnung\nJM heißt die Kolleg*innen zur heutigen Besprechung herzlich willkommen und bestätigt die Anwesenheit aller eingeladenen Teilnehmer*innen. Danach erkundigt JM sich, ob noch zusätzliche Themen protokollarisch aufgenommen werden sollen. Hierzu gibt es keine Kommentare und damit gilt die Tagesordnung als genehmigt.\n\nTOP 2 Kosteneinsparungen\nWie JM darstellt, hat sich der Markt im Vergleich zum Vorjahr stark verändert. In diesem Zusammenhang müssen deshalb Kostenstrukturen neu überdacht werden. Es wird vorgeschlagen, die administrativen Kosten zu senken, da es hier Einsparungspotential gibt. Im Vorfeld zu dieser Besprechung wurde JB bereits von der Geschäftsleitung beauftragt, eine exakte Kostenübersicht zu erstellen und Vorschläge zur Kostenreduzierung vorzulegen. JB legt dar, dass die in der Firmenzentrale eingehenden Anrufe auf ein externes Call-Center umgeleitet werden könnten. Verschiedene Kostenvoranschläge wurden hierfür auch schon eingeholt. Die Firma tele-info scheint unseren Ansprüchen am besten gerecht zu werden. Deshalb sollten Vertragsverhandlungen aufgenommen und zeitgleich Schulungspläne für die Call-Center-Mitarbeiter*innen ausgearbeitet werden, um ihnen die Organisationsstruktur des Unternehmens so schnell wie möglich näherzubringen, damit die Arbeit ohne Verzögerung aufgenommen werden kann. Durch die so gewonnene Zeitersparnis am Empfang können Mitarbeiter*innen von dort flexibler eingesetzt werden und zum Beispiel zusätzlich den für das Unternehmer wichtigen Konferenzbereich und die Gästebetreuung übernehmen. JM stimmt den Vorschlägen zu und bittet um Umsetzung der weiteren Schritte.\n\nTOP 3 Lagebericht Produktion\nPB merkt an, dass auch in seiner Abteilung eine Kostenreduzierung möglich wäre, indem unausgewogene Lagerungen von Material und Rohstoffen vermieden werden. Das Lagerungsmanagement ist optimierbar, d.h., dass sowohl zu hohe als auch niedrige Lagermengen vermieden werden müssen, da sie zu unnötigen Kosten führen. Im Fall von Überbeständen muss neue Lagerfläche geschaffen werden und im Fall von Unterbeständen kann es zu kurzfristigen Produktionsausfällen kommen. JM beauftragt PB, sich umgehend zusammen mit KH mit dieser Thematik auseinanderzusetzen und zur nächsten Sitzung konkrete Zahlen und Vorschläge vorzulegen.\n\nTOP 4 Kündigung des Betriebsarztes\nMit Bedauern teilt die Geschäftsleitung mit, dass unser Betriebsarzt die Firma zum Jahresende verlässt, da er eine eigene Praxis eröffnen will. Aus diesem Grund hat sich die Firma entschlossen, die Ersthelferausbildung zu forcieren, damit bei kleineren Verletzungen, die im Produktionsablauf immer wieder auftreten können, sofort eingegriffen werden kann. Ärztliche Unterstützung bekommen wir ab nächstem Jahr von der Allgemeinärztlichen Praxis Dr. Mertens. Die Kontaktdaten werden bekannt gegeben.\n\nTOP 5 Betriebliche Altersvorsorge\nSeit einem Jahr bietet die Firma den Mitarbeiter*innen an, in eine betriebliche Zusatzrente zu investieren. Bisher wird dieses Angebot aber nur von wenigen Kolleg*innen genutzt. Deshalb werden erneut alle Abteilungsleiter*innen darauf hingewiesen, in ihren Abteilungen über diese Möglichkeit der Altersvorsorge aufzuklären. Interessierte Mitarbeiter*innen können in der Personalabteilung genauere Informationen erhalten. Zusätzlich bietet die Versicherungsgesellschaft immer donnerstags eine gesonderte Sprechstunde an, zu der man sich aber anmelden muss.\n\nTOP 6 Sonstiges\nDie Mitarbeiter*innen werden gebeten, im Intranet abzustimmen, ob die Firma in diesem Jahr für alle Kolleg*innen entweder einen eintägigen Betriebsausflug oder ein Sommerfest organisieren soll. Für den Betriebsausflug könnten dann auch gleich Vorschläge unterbreitet werden. Die Abstimmung muss bis zum 31.03 erfolgen, damit für das Organisationskomitee noch ausreichend Zeit für die Planung bleibt.", "items": [{"n": 14, "type": "choice", "prompt": "Bei der Besprechung", "options": [{"key": "a", "text": "müssen weitere Themen besprochen werden."}, {"key": "b", "text": "sind alle Mitarbeiter*innen des Unternehmens anwesend."}, {"key": "c", "text": "wird die Tagesordnung angenommen."}], "answer": "c", "confidence": "hoch", "quote": "Hierzu gibt es keine Kommentare und damit gilt die Tagesordnung als genehmigt.", "explain_ru": "Верно c: после того как председательствующий спрашивает о дополнительных пунктах и замечаний не поступает, повестка дня утверждается («gilt die Tagesordnung als genehmigt»). a неверно, потому что дополнительных тем никто не предлагал; b неверно, потому что присутствуют только директора и руководители отделов, а не весь коллектив.", "explain": "Correcto c: tras preguntar el presidente de la sesión si hay puntos adicionales y no haber comentarios, el orden del día se aprueba («gilt die Tagesordnung als genehmigt»). a es falso porque nadie propuso temas adicionales; b es falso porque solo asisten los directores y jefes de departamento, no toda la plantilla."}, {"n": 15, "type": "choice", "prompt": "Um Kosten zu sparen,", "options": [{"key": "a", "text": "sollen einige Empfangsmitarbeiter*innen in ein Call-Center wechseln."}, {"key": "b", "text": "werden die Aufgaben der Mitarbeitenden am Empfang neu festgelegt."}, {"key": "c", "text": "wird der Empfang demnächst geschlossen."}], "answer": "b", "confidence": "hoch", "quote": "Durch die so gewonnene Zeitersparnis am Empfang können Mitarbeiter*innen von dort flexibler eingesetzt werden und zum Beispiel zusätzlich den für das Unternehmer wichtigen Konferenzbereich und die Gästebetreuung übernehmen.", "explain_ru": "Верно b: переводя входящие звонки во внешний колл-центр, сотрудники ресепшена получают новые задачи (встречи посетителей и переговорные). a и c неверны: сотрудников не переводят во внешний колл-центр и ресепшен не закрывают.", "explain": "Correcto b: al desviar las llamadas telefónicas entrantes a un centro de llamadas externo, el personal de recepción asume nuevas tareas (atención de visitas y salas de conferencias). a y c son falsos: el personal no se traslada al call center externo ni se cierra la recepción."}, {"n": 16, "type": "choice", "prompt": "Der Lagerbestand muss", "options": [{"key": "a", "text": "an die Produktion angepasst werden."}, {"key": "b", "text": "dauerhaft ausgebaut werden."}, {"key": "c", "text": "kurzfristig reduziert werden."}], "answer": "a", "confidence": "hoch", "quote": "dass sowohl zu hohe als auch niedrige Lagermengen vermieden werden müssen, da sie zu unnötigen Kosten führen.", "explain_ru": "Верно a: стремятся избежать и избытка запасов (расходы на площади), и их нехватки (остановки производства), то есть сбалансировать и подстроить склад под реальные потребности производства. b и c неверны, потому что речь не о резком сокращении и не о постоянном расширении, а об оптимизации.", "explain": "Correcto a: se busca evitar tanto el exceso de existencias (costes de espacio) como la escasez (parones de producción), es decir, equilibrar y ajustar el stock a las necesidades productivas reales. b y c son falsos porque no se pretende ni una reducción drástica ni una ampliación continuada, sino optimización."}, {"n": 17, "type": "choice", "prompt": "Der Betriebsarzt wird", "options": [{"key": "a", "text": "mit Dr. Mertens zusammenarbeiten."}, {"key": "b", "text": "zukünftig selbstständig arbeiten."}, {"key": "c", "text": "zum Jahresende entlassen."}], "answer": "b", "confidence": "hoch", "quote": "dass unser Betriebsarzt die Firma zum Jahresende verlässt, da er eine eigene Praxis eröffnen will.", "explain_ru": "Верно b: заводской врач уходит из компании по собственному желанию, чтобы открыть свою практику («da er eine eigene Praxis eröffnen will»), то есть работать самостоятельно. a неверно, потому что практика Dr. Mertens принимает медицинское обслуживание предприятия вместо него, а не в сотрудничестве; c неверно, потому что его не уволили, он уходит сам.", "explain": "Correcto b: el médico de empresa deja la compañía voluntariamente para abrir su propia consulta («da er eine eigene Praxis eröffnen will»), es decir, para ejercer de forma autónoma/independiente. a es falso porque la consulta del Dr. Mertens asume el servicio médico de la empresa en su sustitución, no en cooperación; c es falso porque no ha sido despedido sino que se marcha voluntariamente."}, {"n": 18, "type": "choice", "prompt": "Die betriebliche Altersvorsorge", "options": [{"key": "a", "text": "kann bei einem vereinbarten Termin besprochen werden."}, {"key": "b", "text": "nehmen viele Mitarbeiter*innen an."}, {"key": "c", "text": "wird neu in der Fima eingeführt."}], "answer": "a", "confidence": "hoch", "quote": "Zusätzlich bietet die Versicherungsgesellschaft immer donnerstags eine gesonderte Sprechstunde an, zu der man sich aber anmelden muss.", "explain_ru": "Верно a: страховая компания проводит консультации по четвергам, но по предварительной записи («zu der man sich aber anmelden muss»). b неверно, потому что в протоколе подчёркнуто: до сих пор этим воспользовались очень немногие («nur von wenigen Kolleg*innen genutzt»); c неверно, потому что программа предлагается уже год («Seit einem Jahr bietet die Firma...»).", "explain": "Correcto a: la aseguradora ofrece consultas los jueves requiriendo cita previa («zu der man sich aber anmelden muss»). b es falso porque el acta subraya que hasta ahora muy pocos empleados se han acogido («nur von wenigen Kolleg*innen genutzt»); c es falso porque el plan lleva ofertándose un año («Seit einem Jahr bietet die Firma...»)."}]}, {"id": "t4_e-p61", "note_ru": "Протокол собрания в Herbolzen (с. 61-62). В оригинале помечен как «тест №160201, 160221».", "label": "Variante 8 (Protokoll Herbolzen)", "topic": "Marketingmaßnahmen, Einführung Jobticket", "page": 61, "note": "Acta de la reunión en Herbolzen (pp. 61-62). El original la etiqueta como «тест №160201, 160221».", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Protokoll 25.06.20XX\nSitzungsraum: 112, Ort: Ludwigstr. 23, 79342 Herbolzen\nAnwesende: Jan Schneider (JS, Geschäftsleitung), Sabine Faust (SF, Leiterin Marketing), Paul Mayer (PM, Leiter Produktion), Tim Janzen (TJ, Leiter Vertrieb), Chiara Reich (CR, Leiterin IT), Simon Zitzmann (SZ, Leiter Personal), Mona Seil (MS, Leiterin Controlling)\nSitzungsleitung: Jan Schneider, Protokollant: Simon Zitzmann\n\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung der Tagesordnungspunkte\n2. Marketingmaßnahmen\n3. Berichte\n4. Erweiterte Überstundenregelung\n5. Einführung Jobticket\n6. Sonstiges\n\nTOP 1 Begrüßung un
