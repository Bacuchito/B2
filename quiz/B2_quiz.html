нькие дети. Alex (e) прямо отвечает, что суббота — рабочий день («Werktag») и работодатель может назначить работу в этот день независимо от семейных обязанностей.", "explain": "Soma pregunta si su empresa puede obligarla a acudir en sábado teniendo hijos pequeños. Alex (e) responde directamente que el sábado es día laborable («Werktag») y el empleador puede ordenar trabajar en él con independencia de las cargas familiares."}, {"n": 11, "type": "choice", "prompt": "Reinhold: Ich arbeite seit zwölf Jahren 20 Stunden die Woche und würde jetzt gerne, weil die Kinder aus dem Haus sind, meine Arbeitszeit aufstocken und wieder Vollzeit arbeiten. Habe ich ein Recht darauf ?", "answer": "d", "confidence": "hoch", "quote": "Soviel ich weiß, hast du also keinen Anspruch, in die Vollzeit zurückzukehren. Sprich doch einfach mal mit deinem Chef.", "explain_ru": "Reinhold двенадцать лет работает на полставки и спрашивает, есть ли у него законное право перейти на полную занятость. Ratna (d) разъясняет, что новое регулирование временной неполной занятости не действует задним числом для его давнего случая, поэтому такого автоматического права нет.", "explain": "Reinhold lleva doce años a media jornada y pregunta si tiene derecho legal a pasar a jornada completa. Ratna (d) le aclara que la nueva regulación de jornada reducida temporal no opera con carácter retroactivo para su caso antiguo, por lo que no existe ese derecho automático."}, {"n": 12, "type": "choice", "prompt": "Mandy: Seit zwei Jahren arbeite ich Vollzeit in einem Unternehmen und dieser Job macht mir auch viel Spaß. Aus familiären Gründen würde ich gerne eine dreijährige Auszeit nehmen. Ich überlege, ob ich mir das finanziell leisten kann.", "answer": "c", "confidence": "hoch", "quote": "Man muss sich das aber genau überlegen, da man nicht nur kurz- oder mittelfristig weniger verdient, sondern auch weniger Rentenansprüche hat.", "explain_ru": "Mandy оценивает трёхлетнюю паузу или сокращение работы по семейным причинам и сомневается в финансовых последствиях. Angela (c) объясняет право на сокращение рабочего времени, но предупреждает о влиянии на доход и особенно на будущую пенсию («weniger Rentenansprüche»).", "explain": "Mandy evalúa una pausa de tres años o reducción laboral por motivos familiares y duda del impacto económico. Angela (c) explica el derecho a reducir jornada pero advierte del impacto en los ingresos y especialmente en la reducción de las futuras pensiones de jubilación («weniger Rentenansprüche»)."}, {"n": 13, "type": "choice", "prompt": "Nici: Ich bekomme jetzt das zweite Kind und werde danach wahrscheinlich erst mal Teilzeit arbeiten. Jetzt habe ich ziemlich große Angst, dass ich in meiner Karriere den Anschluss verpasse. Soll ich vielleicht doch so schnell wie möglich wieder Vollzeit arbeiten?", "answer": "a", "confidence": "hoch", "quote": "In meinen Augen ist Familie das Wichtigste auf der Welt. Es ist doch auch ein Gewinn, wenn man mehr Zeit mit seinen Kindern verbringen kann und weniger gestresst ist. Ich würde mich auf jeden Fall für Teilzeit entscheiden.", "explain_ru": "Nici сомневается: выбрать неполную занятость после второго ребёнка или быстро вернуться к полной, боясь затормозить карьеру. Thilo (a) советует поставить на первое место семью и без колебаний выбрать Teilzeit («Ich würde mich auf jeden Fall für Teilzeit entscheiden»).", "explain": "Nici duda entre optar por la jornada reducida tras su segundo hijo o volver rápido a jornada completa por miedo a frenar su carrera. Thilo (a) le aconseja priorizar a la familia y decantarse sin dudar por el tiempo parcial («Ich würde mich auf jeden Fall für Teilzeit entscheiden»)."}]}, {"id": "t3_b-p37", "note_ru": "Форум о законных днях отпуска, внезапных сменах, отмене уже согласованного отпуска и работе в выходные во время практики.", "label": "Variante 4 (Urlaub und Dienstplan)", "page": 37, "note": "Foro sobre días de vacaciones legales, turnos de trabajo imprevistos, anulación de vacaciones concedidas y trabajo en fin de semana durante prácticas.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Cécile, vor 3 Stunden", "text": "Leider muss ich dich enttäuschen. Die Regelung ist gesetzeskonform. Das Minimum liegt sogar nur bei 20 Tagen. Sei froh, dass du mehr hast. Bei manchen Arbeitgebern erhöht sich der Urlaubsanspruch mit längerer Firmenzugehörigkeit.", "distractor": ""}, {"key": "b", "title": "Limit, vor 5 Stunden", "text": "Meines Wissens gibt es keine gesetzliche Regelung dafür, aber sprich doch einfach mal mit eurem Chef. Dem ist vielleicht gar nicht klar, dass du das nicht so toll findest, wenn du immer erst so kurz vorher weißt, an welchen Tagen du arbeiten musst und wann du frei hast.", "distractor": ""}, {"key": "c", "title": "Susanne, vor 3 Stunden", "text": "Urlaub muss immer rechtzeitig beantragt werden, aber der Arbeitgeber ist nicht unbedingt verpflichtet, ihn zu gewähren. Wann Urlaub genommen werden darf, entscheidet der Chef. Aufgrund dringender betrieblicher Gründe kann ein Urlaubsantrag auch abgelehnt werden.", "distractor": "Trata de la solicitud inicial de vacaciones y la posibilidad patronal de denegarla por motivos de servicio; no responde al caso de Hans, cuyas vacaciones ya estaban aprobadas formalmente."}, {"key": "d", "title": "Nico, vor 30 Minuten", "text": "Schau doch mal in deinen Arbeitsvertrag, da ist das sicher geregelt. Soviel ich weiß, gibt es keine gesetzlichen Einschränkungen für angestellte Arbeitnehmer. Allerdings darfst du keine sieben Tage am Stück arbeiten. Der Samstag gilt in Deutschland als normalen Wochentag.", "distractor": ""}, {"key": "e", "title": "Greta, vor 2 Stunden", "text": "Ich arbeite auch im Einzelhandel und bei uns ist es so geregelt, dass man einen festen Wochentag freibekommt, wenn man immer samstags arbeitet. Das kommt mir entgegen. So kann ich entspannt unter der Woche einkaufen oder ins Schwimmbad gehen.", "distractor": "Comenta su experiencia personal librando entre semana en el comercio, pero no responde a si es legal exigir turnos sin antelación o trabajar en sábado."}, {"key": "f", "title": "Michele, vor 6 Stunden", "text": "Das kann dein Chef nicht einfach so machen. Personelle Engpässe reichen für den Widerruf eines Urlaubsantrags nicht aus. Wenn du deinen Urlaub tatsächlich nicht antrittst, muss der Arbeitgeber alle Kosten tragen, die dir durch die Urlaubsverschiebung entstehen.", "distractor": ""}], "items": [{"n": 10, "type": "choice", "prompt": "Thia: Voll gemein, ich habe nur 25 Urlaubstage! Mein Freund hat hingegen 30 Tage im Jahr. Ich frage mich, ob mir nicht auch mehr Tage zustehen. Kennt sich von euch da jemand aus?", "answer": "a", "confidence": "hoch", "quote": "Leider muss ich dich enttäuschen. Die Regelung ist gesetzeskonform. Das Minimum liegt sogar nur bei 20 Tagen. Sei froh, dass du mehr hast.", "explain_ru": "Thia жалуется, что у неё всего 25 дней отпуска. Cécile (a) объясняет, что 25 дней полностью соответствуют закону: минимальный отпуск в Германии — 20 рабочих дней при пятидневной неделе.", "explain": "Thia se queja de tener solo 25 días de vacaciones. Cécile (a) le aclara que 25 días se ajusta plenamente a la ley, ya que el mínimo legal en Alemania es de 20 días laborables para jornadas de 5 días."}, {"n": 11, "type": "choice", "prompt": "Marilena: Ich arbeite im Einzelhandel und bei uns gilt jede Woche ein anderer Dienstplan. Wir bekommen den Plan immer erst am Ende der Vorwoche und deshalb können wir unsere Freizeit natürlich auch nicht richtig planen. Ist das erlaubt?", "answer": "b", "confidence": "hoch", "quote": "Meines Wissens gibt es keine gesetzliche Regelung dafür, aber sprich doch einfach mal mit eurem Chef. Dem ist vielleicht gar nicht klar, dass du das nicht so toll findest, wenn du immer erst so kurz vorher weißt, an welchen Tagen du arbeiten musst", "explain_ru": "Marilena получает график в конце предыдущей недели и не может планировать личную жизнь. Limit (b) говорит об отсутствии жёсткого регулирования и советует поговорить с начальником и сказать о проблеме с уведомлением за столь короткий срок.", "explain": "Marilena recibe el cuadrante horario a finales de la semana previa impidiéndole organizar su vida personal. Limit (b) le comenta la ausencia de una regulación rígida y le aconseja hablar con el jefe para comunicarle el problema de los avisos con tan poco margen."}, {"n": 12, "type": "choice", "prompt": "Hans: Ich habe nach der Genehmigung meines Urlaubs diesen gebucht und jetzt hat mein Chef gemerkt, dass ein anderer Kollege schon vorher zur selben Zeit Urlaub eingereicht hat. Jetzt will er mir meinen wieder streichen. Darf er das?", "answer": "f", "confidence": "hoch", "quote": "Das kann dein Chef nicht einfach so machen. Personelle Engpässe reichen für den Widerruf eines Urlaubsantrags nicht aus.", "explain_ru": "Hans уже согласовал и оплатил отпуск, а начальник собирается его отменить. Michele (f) подтверждает, что предприятие не может в одностороннем порядке отменить уже предоставленный отпуск из-за нехватки персонала и должно взять на себя возникшие расходы.", "explain": "Hans ya tenía sus vacaciones autorizadas y contratadas y el jefe pretende cancelárselas. Michele (f) le confirma que una empresa no puede anular unilateralmente unas vacaciones ya concedidas por falta de personal y que debería asumir los costes derivados."}, {"n": 13, "type": "choice", "prompt": "Lisa: Ich mache zurzeit ein Pflichtpraktikum in einem Unternehmen und arbeite von Montag bis Freitag acht Stunden täglich. Jetzt soll ich nächsten Samstag auch noch kommen. Bin ich dazu verpflichtet? Ich fühle mich ein bisschen ausgenutzt!", "answer": "d", "confidence": "hoch", "quote": "Allerdings darfst du keine sieben Tage am Stück arbeiten. Der Samstag gilt in Deutschland als normalen Wochentag.", "explain_ru": "Lisa проходит практику с понедельника по пятницу (8 часов в день), и ей назначают работу в субботу. Nico (d) объясняет, что суббота — обычный рабочий день («Werktag»), но напоминает о законном пределе: нельзя ставить семь дней подряд без отдыха.", "explain": "Lisa hace prácticas de lunes a viernes (8h/día) y le ordenan trabajar el sábado. Nico (d) explica que el sábado es día laborable ordinario («Werktag»), pero recuerda el límite legal de que no se pueden encadenar siete días consecutivos sin descanso."}]}, {"id": "t3_c-p38", "note_ru": "Примечание оригинала: комментарий b встречается на странице дважды — как «b) Thilo, vor 45 Minuten» и, с пометкой «Новый вариант», как «b) Mallory, vor 45 Minuten» (Zug / Deutsche Bahn, такси или ночь в отеле). Воспроизведена печатная версия b) Thilo. Ответ пункта 12 — b в ОБЕИХ версиях, поэтому примечание ключ не меняет. «Новая» версия с именем Mallory снова появляется на с. 39.", "label": "Lesen Teil 3 (вариант №5)", "page": 38, "note": "Aviso del original: el comentario b aparece dos veces en la página — como «b) Thilo, vor 45 Minuten» y, marcado como «Новый вариант», como «b) Mallory, vor 45 Minuten» (Zug / Deutsche Bahn, taxi o noche de hotel). Se reproduce la versión impresa b) Thilo. La respuesta del ítem 12 es b en LAS DOS versiones, por lo que el aviso no altera la clave. La versión «nueva» reaparece con el nombre Mallory en la p. 39.", "kind": "zuordnung", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Hans, vor 2 Stunden", "text": "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat. Aber nur, wenn das ohne zu großen Aufwand geht. Wenn ein Unternehmen in der Innenstadt ist, gibt es einfach nicht genug Platz für ihre Parkmöglichkeiten.", "distractor": ""}, {"key": "b", "title": "Thilo, vor 45 Minuten", "text": "Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen. Du kannst auf der Webseite der Deutschen Bahn nachlesen, unter welchen Umständen die Bahn deine Weiterfahrt bezahlt.", "distractor": ""}, {"key": "c", "title": "Johannes, vor 3 Stunden", "text": "Wenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden. Sachschäden sind dabei nicht inbegriffen. Du kannst aber grundsätzlich selbst entscheiden, welches Fahrzeug du für den Arbeitsweg benutzt.", "distractor": ""}, {"key": "d", "title": "Jacqueline, vor 30 Minuten", "text": "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts für deine Verspätung kannst.", "distractor": ""}, {"key": "e", "title": "Andreij, vor 4 Stunden", "text": "Natürlich hast du an deinem Arbeitsplatz Versicherungsschutz, aber dieser gilt nicht in allen Teilen des Gebäudes. Auf der Toilette bist du zum Beispiel nicht versichert. Warum das so ist, weiß ich aber auch nicht.", "distractor": "No encaja con ninguna de las cuatro consultas. Habla del seguro DENTRO del lugar de trabajo (la toaleta no está cubierta), no del seguro en el trayecto. Es el distractor temático de la consulta 10 (Mikke, «Bin ich denn jetzt versichert?»), que pregunta por el accidente de camino al trabajo; también puede confundir a quien busque cualquier mención a «Versicherung»."}, {"key": "f", "title": "Alex, vor 45 Minuten", "text": "Als Arbeitnehmer musst du dafür sorgen, zum Job zu kommen. Wenn das nicht geht, darfst du aber keine Abmahnung bekommen. Ob du ein Taxi nehmen musst, kommt darauf an, ob die Kosten dafür über deinem Arbeitslohn für einen Tag liegen. Wenn ja, sind diese Kosten für dich nicht zumutbar.", "distractor": "Distractor mixto: mezcla el apercibimiento (consulta 11, Ludmilla), el taxi (consulta 12, Peter) y el deber de llegar al trabajo (consulta 13, Ingo), pero no responde de forma específica a ninguno. Con la consulta 12 se confunde porque también habla de coger un taxi; con la 13, porque también trata de la obligación de acudir al puesto de trabajo. Ninguno de los cuatro casos es el suyo."}], "items": [{"n": 10, "type": "choice", "prompt": "Mikke: Heute hatte ich auf dem Weg zur Arbeit einen Unfall. Ich habe noch einen Umweg über die Kita gemacht, bin gestolpert und habe mir den Knöchel gebrochen. Bin ich denn jetzt versichert? Ich habe ja nicht den direkten Weg zur Arbeit genommen.", "answer": "c", "confidence": "mittel", "quote": "Wenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden.", "explain_ru": "Mikke спрашивает, действует ли страховка, если он получил травму по дороге на работу, сделав крюк. c — единственный комментарий, где речь о страховании от несчастных случаев («Unfallversicherung») именно «auf dem Weg zur Arbeit», и там добавлено, что человек свободно выбирает транспорт для этой дороги, то есть выбранный маршрут не отменяет покрытие. Средняя уверенность: в комментарии нет ни крюка, ни падения, а есть дорожная авария; e (страховка только внутри здания) — тематическая ловушка.", "explain": "Mikke pregunta si sigue cubierto por el seguro tras lesionarse de camino al trabajo haciendo un rodeo. c es el único comentario que trata el seguro de accidentes («Unfallversicherung») precisamente «auf dem Weg zur Arbeit» y añade que uno puede decidir libremente qué vehículo usa para el trayecto, es decir, que la ruta elegida no anula la cobertura. Confianza media porque el comentario no menciona el desvío ni una caída, sino un accidente de tráfico; e (seguro solo dentro del edificio) es la trampa temática."}, {"n": 11, "type": "choice", "prompt": "Ludmilla: Ich habe eine Abmahnung bekommen, weil ich regelmäßig zu spät zur Arbeit komme. Ich fahre immer rechtzeitig von zu Hause weg und finde dann bei der Firma keine Parkmöglichkeit. Muss der Arbeitgeber nicht eigentlich seinen Mitarbeitern einen Parkplatz stellen?", "answer": "a", "confidence": "hoch", "quote": "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat. Aber nur, wenn das ohne zu großen Aufwand geht.", "explain_ru": "Ludmilla получает предупреждение за опоздание, потому что не нашла парковку, и спрашивает, обязано ли предприятие её предоставить. a отвечает именно на это: обязанность работодателя заботиться о сотрудниках включает создание мест для их машин, но только если это не требует несоразмерных расходов. f тоже упоминает предупреждение, но отвечает про такси и обязанность прийти на работу, а не про парковку.", "explain": "Ludmilla recibe un apercibimiento por llegar tarde porque no encuentra aparcamiento y pregunta si la empresa debe facilitarlo. a responde exactamente a eso: el deber de cuidado del empresario incluye crear plazas para los vehículos de los empleados, aunque solo si no supone un gasto desproporcionado. f también menciona el apercibimiento, pero responde sobre el taxi y el deber de acudir al trabajo, no sobre el aparcamiento."}, {"n": 12, "type": "choice", "prompt": "Peter: Ich wollte heute Morgen mit der S-Bahn zur Arbeit fahren, aber diese ist wegen des Unwetters ausgefallen. So hatte ich keine Möglichkeit, ins Büro zu kommen, da ich kein Auto habe. Hätte ich ein Taxi nehmen müssen?", "answer": "b", "confidence": "hoch", "quote": "Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen.", "explain_ru": "Peter не смог поехать в офис, потому что из-за непогоды не ходила S-Bahn, и спрашивает, должен ли был взять такси. b как раз о случае, когда «Bahn» не может продолжать движение из-за шторма, и о праве пассажиров на талон на такси и возмещение стоимости поездки. f тоже говорит о такси, но как ловушка: смешивает предупреждение и общую обязанность являться на работу.", "explain": "Peter no pudo ir a la oficina porque la S-Bahn no circuló a causa del temporal y pregunta si debería haber tomado un taxi. b trata justamente el caso de la «Bahn» que no puede continuar por una tormenta y el derecho de los viajeros a un bono de taxi y al reembolso del trayecto. f también habla de tomar un taxi, pero lo hace como distractor: mezcla el apercibimiento y el deber general de acudir al trabajo."}, {"n": 13, "type": "choice", "prompt": "Ingo: Immer das Gleiche. Der Bus kommt zu spät, steht im Stau oder fällt aus. Jetzt habe ich Ärger mit meinem Chef, weil ich öfter mit Verspätung im Büro erscheine. Bin ich verpflichtet, immer einen früheren Bus zu nehmen, damit ich pünktlich bin?", "answer": "d", "confidence": "hoch", "quote": "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts für deine Verspätung kannst.", "explain_ru": "Ingo опаздывает из-за автобуса и спрашивает, обязан ли он сесть на более ранний. d отвечает прямо: каждый сам отвечает за то, чтобы прийти вовремя, и не может винить общественный транспорт, значит выбор автобуса — его дело. Упоминание автобуса и ответственности работника исключает остальные комментарии.", "explain": "Ingo llega tarde por culpa del autobús y pregunta si está obligado a coger uno anterior. d contesta de forma directa: cada uno es responsable de llegar puntual y no puede echar la culpa al transporte público, así que la elección del autobús es cosa suya. La mención del autobús y de la responsabilidad del trabajador excluye a los demás comentarios."}]}, {"id": "t3_c-p39", "note_ru": "Новая версия варианта с. 38: те же четыре случая и те же шесть комментариев, но с другими именами и в другом порядке. Из-за смены порядка постов меняются и ответы: 10 a / 11 b / 12 d / 13 c против 10 c / 11 a / 12 b / 13 d на с. 38. Комментарий b) Mallory повторяет текст «Новый вариант», анонсированный на с. 38.", "label": "Lesen Teil 3 (вариант №5) (новые имена и очередь)", "page": 39, "note": "Nueva versión de la variante de la p. 38: mismos cuatro casos y mismos seis comentarios, pero con otros nombres y en otro orden. Al cambiar el orden de los posteos, cambian también las respuestas: 10 a / 11 b / 12 d / 13 c, frente a 10 c / 11 a / 12 b / 13 d en la p. 38. El comentario b) Mallory retoma el texto del «Новый вариант» anunciado en la p. 38.", "kind": "zuordnung", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Enric, vor 2 Stunden", "text": "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat, aber nur, wenn das ohne zu großen Aufwand geht. Wenn ein Unternehmen in der Innenstadt ist, gibt es einfach nicht genug Platz für ihre Parkmöglichkeiten.", "distractor": ""}, {"key": "b", "title": "Mallory, vor 45 Minuten", "text": "Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen. Du kannst auf der Webseite der Deutschen Bahn nachlesen, unter welchen Umständen die Bahn deine Weiterfahrt bezahlt.", "distractor": ""}, {"key": "c", "title": "Mao, vor 3 Stunden", "text": "Wenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden. Sachschäden sind dabei nicht inbegriffen. Du kannst aber grundsätzlich selbst entscheiden, welches Fahrzeug du für den Arbeitsweg benutzt.", "distractor": ""}, {"key": "d", "title": "Nastasia, vor 30 Minuten", "text": "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts für deine Verspätung kannst.", "distractor": ""}, {"key": "e", "title": "Bartomeu, vor 4 Stunden", "text": "Natürlich hast du an deinem Arbeitsplatz Versicherungsschutz, aber dieser gilt nicht in allen Teilen des Gebäudes. Auf der Toilette bist du zum Beispiel nicht versichert. Warum das so ist, weiß ich aber auch nicht.", "distractor": "No encaja con ninguna de las cuatro consultas: trata del seguro dentro del edificio (la toaleta no está cubierta), no del seguro en el trayecto. Es el distractor temático de la consulta 13 (Karel, «Bin ich denn jetzt versichert?»), en la que se pregunta por un accidente de camino al trabajo."}, {"key": "f", "title": "Sterre, vor 45 Minuten", "text": "Als Arbeitnehmer musst du dafür sorgen, zum Job zu kommen. Wenn das nicht geht, darfst du aber keine Abmahnung bekommen. Ob du ein Taxi nehmen musst, kommt darauf an, ob die Kosten dafür über deinem Arbeitslohn für einen Tag liegen und diese Kosten für dich nicht zumutbar sind.", "distractor": "Distractor mixto: mezcla el apercibimiento (consulta 10, Natalie), el taxi (consulta 11, Batiste) y el deber de llegar al trabajo (consulta 12, Alfons), sin responder de forma específica a ninguno. Se confunde con la 11 por la mención del taxi y con la 10 por la «Abmahnung»."}], "items": [{"n": 10, "type": "choice", "prompt": "Natalie: Ich habe eine Abmahnung bekommen, weil ich regelmäßig zu spät zur Arbeit komme. Ich fahre immer rechtzeitig von zu Hause weg und finde dann bei der Firma keine Parkmöglichkeit. Muss der Arbeitgeber nicht eigentlich seinen Mitarbeitern einen Parkplatz stellen?", "answer": "a", "confidence": "hoch", "quote": "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat, aber nur, wenn das ohne zu großen Aufwand geht.", "explain_ru": "Natalie получает предупреждение за опоздание, потому что не нашла парковку, и спрашивает, обязано ли предприятие её предоставить. a отвечает именно на это: обязанность заботы включает создание мест для машин сотрудников, но только если это не требует несоразмерных расходов. f тоже упоминает «Abmahnung», но отвечает про такси, а не про парковку.", "explain": "Natalie recibe un apercibimiento por llegar tarde porque no encuentra aparcamiento y pregunta si la empresa debe facilitarlo. a responde exactamente a eso: el deber de cuidado incluye crear plazas para los vehículos de los empleados, aunque solo si no supone un gasto desproporcionado. f también menciona la «Abmahnung», pero responde sobre el taxi, no sobre el aparcamiento."}, {"n": 11, "type": "choice", "prompt": "Batiste: Ich wollte heute Morgen mit der S-Bahn zur Arbeit fahren, aber diese ist wegen des Unwetters ausgefallen. So hatte ich keine Möglichkeit, ins Büro zu kommen. Da ich kein Auto habe, hätte ich ein Taxi nehmen müssen?", "answer": "b", "confidence": "hoch", "quote": "Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen.", "explain_ru": "Batiste не смог поехать в офис, потому что из-за непогоды не ходила S-Bahn, и спрашивает, должен ли был взять такси. b как раз о случае, когда «Bahn» не может продолжать движение из-за шторма, и о праве на талон на такси и возмещение поездки. f (тоже о такси) — ловушка: смешивает предупреждение и общую обязанность являться на работу.", "explain": "Batiste no pudo ir a la oficina porque la S-Bahn no circuló por el temporal y pregunta si debería haber tomado un taxi. b trata justamente el caso de la «Bahn» que no puede continuar por una tormenta y el derecho a un bono de taxi y al reembolso del trayecto. f (también sobre el taxi) es el distractor: mezcla apercibimiento y deber general de acudir al trabajo."}, {"n": 12, "type": "choice", "prompt": "Alfons: Immer das Gleiche. Der Bus kommt zu spät, steht im Stau oder fällt aus. Jetzt habe ich Ärger mit meinem Chef, weil ich öfter mit Verspätung im Büro erscheine. Bin ich verpflichtet, immer einen früheren Bus zu nehmen, damit ich pünktlich bin?", "answer": "d", "confidence": "hoch", "quote": "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts für deine Verspätung kannst.", "explain_ru": "Alfons опаздывает из-за автобуса и спрашивает, обязан ли он сесть на более ранний. d отвечает прямо: сам работник отвечает за своевременный приход и не может винить общественный транспорт, поэтому выбор автобуса — его дело. Совпадает с ситуацией Alfons (автобус, пробка, опоздание).", "explain": "Alfons llega tarde por culpa del autobús y pregunta si está obligado a coger uno anterior. d contesta de forma directa: uno mismo es responsable de llegar puntual y no puede culpar al transporte público, de modo que la elección del autobús es asunto suyo. Coincide con la situación de Alfons (bus, atasco, retraso)."}, {"n": 13, "type": "choice", "prompt": "Karel: Heute hatte ich auf dem Weg zur Arbeit einen Unfall. Ich habe noch einen Umweg über die Kita gemacht, bin gestolpert und habe mir den Knöchel gebrochen. Bin ich denn jetzt versichert? Ich habe ja nicht den direkten Weg zur Arbeit genommen.", "answer": "c", "confidence": "mittel", "quote": "Wenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden.", "explain_ru": "Karel спрашивает, действует ли страховка, если он получил травму по дороге на работу, сделав крюк. c — единственный комментарий о страховании от несчастных случаев «auf dem Weg zur Arbeit», и там добавлено, что человек сам решает, каким транспортом ехать. Средняя уверенность: не упомянуты ни крюк, ни падение, а есть дорожная авария; e (страховка только внутри здания) — тематическая ловушка.", "explain": "Karel pregunta si sigue cubierto por el seguro tras lesionarse de camino al trabajo haciendo un rodeo. c es el único comentario que trata el seguro de accidentes «auf dem Weg zur Arbeit» y añade que uno decide libremente qué vehículo usa para el trayecto. Confianza media porque no menciona el desvío ni una caída, sino un accidente de tráfico; e (seguro solo dentro del edificio) es la trampa temática."}]}, {"id": "t3_d-p40", "note_ru": "Форум о времени на переодевание (Umkleidezeit), рабочих поездках на поезде и посещении добровольных курсов повышения квалификации.", "label": "Variante 6 (Arbeitszeit, Kleidung und Reise)", "page": 40, "note": "Foro sobre tiempo de cambio de vestimenta (Umkleidezeit), viajes de trabajo en tren y asistencia a cursos de formación voluntaria.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Andres, vor 8 Minuten", "text": "Wenn du in Sportkleidung in die Firma kommst und dich dort noch umziehst, ist das Privatsache. Du musst dafür sorgen, dass du pünktlich mit deiner Arbeit beginnen kannst. In diesem Fall ist die Umkleidezeit keine Arbeitszeit.", "distractor": ""}, {"key": "b", "title": "Paula, vor 3 Stunden", "text": "Der Weg zur Arbeit ist private Zeit. Du trägst die Verantwortung dafür, pünktlich vor Ort zu sein, egal wie weit dein Weg ist. Wenn du z.B. im Stau stehst oder die- S-Bahn streikt und du deshalb zu spät kommst, musst du die Zeit nacharbeiten.", "distractor": "Trata sobre atascos y retrasos en el trayecto de casa al trabajo (Wegezeit), pero no sobre si el tiempo de viaje a un cliente cuenta como horas extra ni sobre ropa de trabajo."}, {"key": "c", "title": "Raimund, vor 6 Stunden", "text": "Arbeitnehmer/innen haben in der Regel alle zwei Jahre Anspruch auf fünf Tage Bildungsurlaub. Die Gesetze sind aber nicht in jedem Bundesland gleich. So variiert zum Beispiel die Anzahl der Tage für Bildungsurlaub je nachdem, ob du Voll- oder Teilzeit tätig bist.", "distractor": "Explica la regulación del permiso de formación remunerado (Bildungsurlaub) por comunidades autónomas, pero Cristof acudió en fin de semana sin solicitarlo previamente."}, {"key": "d", "title": "Hubert, vor 38 Minuten", "text": "Ich finde das Tragen von Dienstkleidung absolut veraltet. Warum müssen alle im Unternehmen gleich gekleidet sein? Jeder Mensch hat doch seinen eigenen Stil, mit dem er sich wohlfühlt. Ich kann verstehen, dass du die Uniform nicht auch noch im Zug tragen möchtest.", "distractor": ""}, {"key": "e", "title": "Yvonne, vor 7 Stunden", "text": "Wenn du selbst entscheidest, eine Fortbildung zu besuchen, und das vorher nicht mit deinem Arbeitgeber absprichst, ist das reines Privatvergnügen. Schickt dein Chef dich allerdings seinerseits auf ein Seminar , handelt es sich um Arbeitszeit.", "distractor": ""}, {"key": "f", "title": "Winfried, vor 25 Minuten", "text": "Das ist ein schwieriges Thema. Wenn du während der Reise zum Beispiel deinen Termin vorbereitest oder mit dem Laptop ein Protokoll schreibst, ist das Arbeitszeit. Wenn du dich aber mit privaten Dingen wie einem Roman oder einem privaten Telefonat beschäftigst, gilt das als Freizeit.", "distractor": ""}], "items": [{"n": 10, "type": "choice", "prompt": "Claudia: Ich muss während der Arbeit eine Uniform tragen. Mir ist es unangenehm, die schon morgens in der Bahn anzuhaben, und ich möchte mich lieber im Hotel umziehen. Muss ich dafür früher kommen oder gilt die Umkleidezeit als Arbeitszeit?", "answer": "d", "confidence": "hoch", "quote": "Ich kann verstehen, dass du die Uniform nicht auch noch im Zug tragen möchtest.", "explain_ru": "Claudia обязана носить рабочую униформу, но ей неудобно надевать её в электричке («in der Bahn anzuhaben»), и она предпочитает переодеваться в отеле. Hubert (d) прямо отвечает на её ситуацию, понимая её нежелание появляться в униформе в общественном транспорте («dass du die Uniform nicht auch noch im Zug tragen möchtest»).", "explain": "Claudia debe llevar uniforme de trabajo pero le incomoda ponérselo en el tren («in der Bahn anzuhaben») y prefiere cambiarse en el hotel. Hubert (d) responde directamente a su situación empatizando con su rechazo a lucir el uniforme en el transporte público («dass du die Uniform nicht auch noch im Zug tragen möchtest»)."}, {"n": 11, "type": "choice", "prompt": "Maisel: Gestern war ich für einen Tag bei einem Kunden in Norddeutschland. Ich bin mit dem Zug gefahren und habe während der Fahrt gelesen. Insgesamt war ich elf Stunden unterwegs und habe Überstunden geltend gemacht. Die will mein Arbeitgeber nicht anerkennen.", "answer": "f", "confidence": "hoch", "quote": "Wenn du dich aber mit privaten Dingen wie einem Roman oder einem privaten Telefonat beschäftigst, gilt das als Freizeit.", "explain_ru": "Maisel ехал 11 часов на поезде к клиенту и всю дорогу читал для удовольствия, а теперь требует сверхурочные. Winfried (f) объясняет, что если во время поездки на поезде занимаешься личными делами (например, читаешь роман), это время считается свободным, а не рабочим.", "explain": "Maisel viajó 11 horas en tren a ver a un cliente y estuvo leyendo por placer durante el trayecto, reclamando horas extras. Winfried (f) explica que si durante el viaje en tren realizas actividades privadas (como leer una novela), ese tiempo computa como tiempo libre y no como jornada laboral."}, {"n": 12, "type": "choice", "prompt": "Cristof: Ich war am Wochenende auf einer Fortbildung, die für meine Arbeit relevant war. Ich wollte mir jetzt einen Urlaubstag gutschreiben lassen, aber meine Chefin sagt, das sei meine private Angelegenheit, da sie die Fortbildung nicht angeordnet hat. Stimmt das?", "answer": "e", "confidence": "hoch", "quote": "Wenn du selbst entscheidest, eine Fortbildung zu besuchen, und das vorher nicht mit deinem Arbeitgeber absprichst, ist das reines Privatvergnügen.", "explain_ru": "Cristof по собственной инициативе пошёл на обучение в выходные и хочет получить за это отгул. Yvonne (e) подтверждает позицию начальницы: курсы, о которых работник решает сам, без распоряжения и договорённости с предприятием, носят чисто частный характер.", "explain": "Cristof asistió por propia iniciativa en fin de semana a una formación y pretende compensarla con un día libre. Yvonne (e) confirma la postura de la jefa: los cursos decididos unilateralmente por el trabajador sin orden ni acuerdo previo con la empresa son de índole puramente privada."}, {"n": 13, "type": "choice", "prompt": "Samira: Ich fahre morgens mit dem Fahrrad in die Firma, bin immer pünktlich um 9.00 Uhr da und mache mich dann fertig. Ab sofort soll ich früher kommen und darf mich nicht mehr während der Arbeitszeit umziehen. Ist das korrekt?", "answer": "a", "confidence": "hoch", "quote": "In diesem Fall ist die Umkleidezeit keine Arbeitszeit.", "explain_ru": "Samira приезжает на велосипеде и переодевается после отметки в 9:00. Andres (a) разъясняет, что переодевание из спортивной одежды по личному выбору транспорта не считается рабочим временем («die Umkleidezeit keine Arbeitszeit»), поэтому приходить нужно уже переодетой до начала смены.", "explain": "Samira llega en bicicleta y se cambia tras fichar a las 9:00. Andres (a) aclara que cambiarse de ropa deportiva por elección personal de transporte no computa como tiempo de trabajo («die Umkleidezeit keine Arbeitszeit»), por lo que debe llegar cambiada antes del inicio de su turno."}]}, {"id": "t3_d-p41", "note_ru": "Форум о пенсионном возрасте (67 против 65 лет), понижающих коэффициентах при досрочном выходе на пенсию, пробелах из-за воспитания детей и корпоративных пенсионных планах.", "label": "Variante 7 (Rente und Altersvorsorge)", "page": 41, "note": "Foro sobre edad de jubilación (67 vs 65 años), coeficientes reductores por jubilación anticipada, lagunas por crianza de hijos y planes de pensiones de empresa.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Stefan, vor 4 Stunden", "text": "Kaum jemandem gelingt es, 45 Jahre durchgehend so ein hohes Gehalt zu verdienen, dass er später die Höchstrente bekommt Das liegt schon allein daran, dass man während der Ausbildung und in den ersten Berufsjahren weniger verdient.", "distractor": "Comenta la dificultad de alcanzar la pensión máxima por cotizaciones salariales en los primeros años laborales; no responde a dudas de jubilación anticipada ni previsión juvenil."}, {"key": "b", "title": "Jana, vor 34 Minuten", "text": "Auch Firmen helfen, für die Zukunft vorzusorgen, denn man kann gar nicht früh genug damit anfangen. Erkundige dich bei deinem Arbeitgeber, ob eine betriebliche Altersvorsorge angeboten wird. Wenn man dann später Rentner ist, bekommt man eine zusätzliche Rente.", "distractor": ""}, {"key": "c", "title": "Antje, vor 7 Stunden", "text": "Wenn man mindestens fünf Jahre versicherungspflichtig beschäftigt war, hat man Anspruch auf die gesetzliche Rente. Dabei spielt es keine Rolle, ob man Teilzeit oder Vollzeit gearbeitet hat. Es gibt aber noch Unterschiede zwischen Ost und West.", "distractor": ""}, {"key": "d", "title": "Jonas, vor 2 Stunden", "text": "Man hat das Recht, früher als mit 67 Jahren in Rente zu gehen, aber man muss Abschläge in Kauf nehmen. Im Moment sind das für jeden Monat, den man weniger arbeitet, 0,3 Prozent weniger. Man muss sich das genau ausrechnen, ob man sich das leisten kann.", "distractor": ""}, {"key": "e", "title": "Jörg, vor 5 Stunden", "text": "Für alle, die nach 1964 geboren sind, gilt dass sie bis 67 Jahre arbeiten müssen. Außer, wenn man mit 65 schon 45 Beitragsjahre nachweisen kann, also Jahre, in denen man in die Rentenversicherung eingezahlt hat.", "distractor": ""}, {"key": "f", "title": "Lia, vor 12 Stunden", "text": "Wenn man jung ist, sollte man sein Leben doch erst einmal genießen. Über Alter und Krankheit kann man sich immer noch Gedanken machen. Wer weiß, ob es später, wenn wir so weit sind, überhaupt noch eine Rente geben wird.", "distractor": "Recomienda no pensar en la pensión de joven y vivir el presente; es una postura vital sin carácter de asesoramiento concreto."}], "items": [{"n": 10, "type": "choice", "prompt": "Torsten: Wir hatten neulich im Büro eine Diskussion darüber, ab wann man in Rente gehen kann. Ich dachte immer, man muss bis 67 arbeiten. Aber meine Kollegin meinte, dass sie zwei Jahre früher in Rente gehen wird. Geht das überhaupt?", "answer": "e", "confidence": "hoch", "quote": "Für alle, die nach 1964 geboren sind, gilt dass sie bis 67 Jahre arbeiten müssen. Außer, wenn man mit 65 schon 45 Beitragsjahre nachweisen kann", "explain_ru": "Torsten спрашивает, можно ли выйти на пенсию на два года раньше обычного возраста 67 лет (в 65). Jörg (e) подтверждает законное исключение для тех, кто подтвердит 45 лет страхового стажа.", "explain": "Torsten pregunta si es posible jubilarse dos años antes de la edad ordinaria de 67 (a los 65). Jörg (e) confirma la excepción legal para quienes acrediten 45 años cotizados."}, {"n": 11, "type": "choice", "prompt": "Hella: Meine Rente wird ja nicht so berauschend sein, vor allem, weil ich wegen meiner zwei Kinder einige Jahre nicht oder nur Teilzeit gearbeitet habe. Es ist ja wohl schon so, dass ich dafür jetzt irgendwie bestraft werde, oder?", "answer": "c", "confidence": "hoch", "quote": "Dabei spielt es keine Rolle, ob man Teilzeit oder Vollzeit gearbeitet hat.", "explain_ru": "Hella боится, что её накажут за работу на полставки из-за ухода за детьми. Antje (c) разъясняет основные условия доступа к государственной пенсии и отмечает, что право возникает независимо от того, работал человек полную норму или частичную.", "explain": "Hella teme verse penalizada por haber trabajado a tiempo parcial por el cuidado de sus hijos. Antje (c) le aclara los requisitos básicos de acceso a la pensión pública y señala que el derecho existe independientemente de si se ha trabajado a jornada completa o parcial."}, {"n": 12, "type": "choice", "prompt": "Petra: Mein Mann geht in zwei Jahren in Rente. Ich müsste noch vier Jahre arbeiten. Wir haben uns überlegt, dass wir zusammen in Rente gehen und noch viele gemeinsame Jahre mit verschiedenen Aktivitäten erleben wollen. Welche Folgen hätte das?", "answer": "d", "confidence": "hoch", "quote": "Man hat das Recht, früher als mit 67 Jahren in Rente zu gehen, aber man muss Abschläge in Kauf nehmen. Im Moment sind das für jeden Monat, den man weniger arbeitet, 0,3 Prozent weniger.", "explain_ru": "Petra спрашивает, какие последствия будет иметь досрочный выход на пенсию на два года, чтобы уйти одновременно с мужем. Jonas (d) отвечает, подробно описывая денежные потери (Abschläge): снижение на 0,3 % за каждый месяц досрочного выхода.", "explain": "Petra pregunta qué consecuencias tendría adelantar su jubilación dos años para retirarse a la vez que su marido. Jonas (d) responde detallando las penalizaciones económicas (Abschläge): una reducción del 0,3 % por cada mes de adelanto."}, {"n": 13, "type": "choice", "prompt": "Leni: Ich bin ja noch jung und denke überhaupt noch nicht an die Rente. Aber es wird ja immer wieder gesagt, dass die normale Rente irgendwann nicht mehr ausreichen wird. Was kann ich denn jetzt schon für später tun?", "answer": "b", "confidence": "hoch", "quote": "Erkundige dich bei deinem Arbeitgeber, ob eine betriebliche Altersvorsorge angeboten wird. Wenn man dann später Rentner ist, bekommt man eine zusätzliche Rente.", "explain_ru": "Leni молода и хочет знать, что делать уже сейчас, чтобы дополнить будущую пенсию. Jana (b) советует интересоваться корпоративными пенсионными планами (betriebliche Altersvorsorge), чтобы получать дополнительные выплаты на пенсии.", "explain": "Leni es joven y quiere saber qué pasos dar ya para complementar su pensión futura. Jana (b) le aconseja interesarse por los planes de pensiones de empresa (betriebliche Altersvorsorge) para obtener ingresos adicionales al jubilarse."}]}, {"id": "t3_d-p42", "note_ru": "Форум о продолжительности родительского отпуска (Elternzeit: 14 месяцев Elterngeld против 3 лет отпуска), ночной работе беременных, отсрочке отпуска после обучения и совместимости с частичной занятостью.", "label": "Variante 8 (Elternzeit und Schwangerschaft)", "page": 42, "note": "Foro sobre duración del permiso parental (Elternzeit: 14 meses de Elterngeld vs 3 años de excedencia), trabajo nocturno en embarazadas, retraso del permiso tras la formación y compatibilidad con trabajo a tiempo parcial.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Mario, vor 10 Stunden", "text": "Warte erst einmal ab, wie sich alles mit dem Kind entwickelt. Ich würde die Zeit nach der Geburt nicht mit Arbeit verplanen. Es ist nämlich eine große Umstellung. Wenn du dann später „Langeweile“ haben solltest, kannst du immer noch überlegen, arbeiten zu gehen.", "distractor": "Aconseja no planificar trabajo de antemano tras el parto; no resuelve las dudas sobre límites legales de jornada ni compatibilidades."}, {"key": "b", "title": "Johann, vor 20 Minuten", "text": "Beides ist nicht ganz falsch - nach der Geburt des Kindes hat man bis zu drei Jahre Anspruch auf Freistellung von der Arbeit. 14 Monate erhält das Paar Elterngeld. Sowohl die bezahlte als auch die nicht bezahlte Zeit der Betreuung können die Eltern frei untereinander aufteilen.", "distractor": ""}, {"key": "c", "title": "Hanna, vor 30 Minuten", "text": "Elterngeld erhält man von der Elterngeldstelle. Die Höhe hängt davon ab, wie viel man vorher verdient hat. Vater und Mutter können die bezahlte Elternzeit von 14 Monaten untereinander aufteilen, wie es ihnen am besten passt. Allerdings ist die Frau die ersten acht Wochen im Mutterschutz.", "distractor": ""}, {"key": "d", "title": "Angela, vor 8 Stunden", "text": "Wenn du schon länger als sechs Monate bei einer Firma beschäftigt bist, kannst du beantragen, auch während der Elternzeit ein bisschen zu arbeiten. Du darfst dann allerdings nicht mehr als 30 Stunden pro Woche tätig sein. Der Betrieb kann den Antrag aber auch ablehnen.", "distractor": ""}, {"key": "e", "title": "Lars, vor 3 Stunden", "text": "Wenn eine Frau schwanger ist, kann sie, soweit es der Gesundheitszustand zulässt, bis sechs Wochen vor der Geburt arbeiten. Dann beginnt der Mutterschutz. Dieser gilt auch noch für acht Wochen nach der Geburt. Im Anschluss folgt die Elternzeit. Aber dafür gibt es wieder andere Regelungen.", "distractor": "Trata sobre los plazos del Mutterschutz antes y después del parto (6 y 8 semanas); es distractor de la consulta de Katrin sobre turnos de tarde."}, {"key": "f", "title": "Petra, vor 5 Stunden", "text": "Während der Schwangerschaft darf ein Arbeitgeber die Mitarbeiterin nicht nach 22 Uhr beschäftigen. Zwischen 20 und 22 Uhr kann man als Schwangere nur auf eigenen Wunsch arbeiten, der Arbeitgeber darf das nicht anordnen. Insgesamt darf eine Schwangere aber eine tägliche Arbeitszeit von 8,5 Stunden nicht überschreiten.", "distractor": ""}], "items": [{"n": 10, "type": "choice", "prompt": "Natalja: Wir werden Eltern und wollen beide die bezahlte Elternzeit nehmen. Eine Freundin meinte, dass wir insgesamt ein Jahr zu Hause bleiben können. Ein anderer Bekannter sagte, man könne sein Kind bis zu drei Jahre zu Hause betreuen. Was stimmt?", "answer": "b", "confidence": "hoch", "quote": "Beides ist nicht ganz falsch - nach der Geburt des Kindes hat man bis zu drei Jahre Anspruch auf Freistellung von der Arbeit. 14 Monate erhält das Paar Elterngeld.", "explain_ru": "Natalja сомневается между двумя услышанными версиями (1 год оплачиваемый или 3 года дома). Johann (b) прямо отвечает, что верны оба утверждения: есть право на отпуск по уходу (Freistellung) до трёх лет, но денежная выплата (Elterngeld) покрывает максимум 14 оплачиваемых месяцев.", "explain": "Natalja duda entre las dos versiones que ha escuchado (1 año pagado vs 3 años en casa). Johann (b) responde expresamente que ambas afirmaciones son ciertas: existe derecho a excedencia por cuidado (Freistellung) de hasta tres años, pero la prestación económica (Elterngeld) cubre un máximo de 14 meses remunerados."}, {"n": 11, "type": "choice", "prompt": "Katrin: Ich bin im vierten Monat schwanger. Mein Chef will, dass ich notfalls auch mal eine Spätschicht übernehme. Die geht bis 21:00 Uhr. Soviel ich weiß, ist das gar nicht erlaubt, oder? Außerdem bin ich abends immer sehr müde.", "answer": "f", "confidence": "hoch", "quote": "Zwischen 20 und 22 Uhr kann man als Schwangere nur auf eigenen Wunsch arbeiten, der Arbeitgeber darf das nicht anordnen.", "explain_ru": "Katrin беременна, и начальник хочет обязать её работать в вечерние смены до 21:00. Petra (f) разъясняет норму закона об охране материнства (Mutterschutzgesetz): между 20:00 и 22:00 работница может работать только добровольно и по собственной просьбе, а работодатель не вправе это навязывать.", "explain": "Katrin está embarazada y su jefe quiere obligarla a hacer turnos de tarde hasta las 21:00. Petra (f) aclara la normativa de protección de la maternidad (Mutterschutzgesetz): entre las 20:00 y las 22:00 la trabajadora solo puede laborar voluntariamente si ella lo solicita, pero el empresario no puede imponérselo."}, {"n": 12, "type": "choice", "prompt": "Giovanni: Wir sind Auszubildende und bekommen bald ein Kind. Erst nach der Ausbildung wollen wir in Elternzeit gehen. Bis dahin könnte die Oma auf unser Kind aufpassen. Unser Betrieb wäre einverstanden. Weiß jemand, ob man die Elternzeit später beginnen darf?", "answer": "c", "confidence": "mittel", "quote": "Vater und Mutter können die bezahlte Elternzeit von 14 Monaten untereinander aufteilen, wie es ihnen am besten passt.", "explain_ru": "Giovanni и его партнёрша — ученики и хотят отложить родительский отпуск до окончания обучения. Hanna (c) отмечает, что родители могут распределять периоды родительского отпуска как им удобнее. Средняя уверенность: ни один комментарий прямо не рассматривает отсрочку до экзамена по профессии.", "explain": "Giovanni y su pareja son aprendices y quieren diferir el permiso parental hasta completar la formación. Hanna (c) señala que los padres pueden distribuir los periodos de baja parental como mejor les convenga. Se califica con confianza media porque ningún comentario aborda expresamente la postergación hasta después del examen de formación profesional."}, {"n": 13, "type": "choice", "prompt": "Sandra: Nach der Geburt bekomme ich Elterngeld. Finanziell mache ich mir keine Sorgen. Aber ich will beruflich den Anschluss nicht verlieren. Nur mit dem Kind zu Hause zu bleiben, ist nicht mein Ding. Kann man Elterngeld bekommen und gleichzeitig arbeiten?", "answer": "d", "confidence": "hoch", "quote": "kannst du beantragen, auch während der Elternzeit ein bisschen zu arbeiten. Du darfst dann allerdings nicht mehr als 30 Stunden pro Woche tätig sein.", "explain_ru": "Sandra спрашивает, совместимо ли получение помощи на ребёнка с частичной работой, чтобы не терять профессиональный темп. Angela (d) подтверждает, что просить о работе во время родительского отпуска законно, с ограничением до 30 часов в неделю.", "explain": "Sandra pregunta si es compatible cobrar la ayuda parental y seguir trabajando parcialmente para no perder ritmo profesional. Angela (d) confirma que es legal solicitar trabajar durante el permiso parental con un tope de 30 horas semanales."}]}]}, {"id": "lesen-t4", "title": "Lesen Teil 4", "variants": [{"id": "t4_a-p43", "note_ru": "Протокол занимает с. 43-44: текст Protokoll начинается на с. 43 (до TOP 3) и продолжается на с. 44 (TOP 4-6), где находятся пункты 14-18 этого же протокола. На с. 45 — новая версия того же протокола (→ t4_a-p45) с переписанным TOP 1 и новым пунктом 14; пункты 15-18 в обеих версиях идентичны.", "label": "Variante 1", "page": 43, "note": "El acta ocupa las pp. 43-44: el texto del Protokoll empieza en la p. 43 (hasta el TOP 3) y continúa en la p. 44 (TOP 4-6), donde están los ítems 14-18 de esta misma acta. La p. 45 trae una nueva versión del mismo acta (→ t4_a-p45), con el TOP 1 reescrito y el ítem 14 nuevo; los ítems 15-18 son idénticos en ambas versiones.", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Protokoll 20.06.20XX, 10.00-12.00\nBesprechungsraum: 032,\nOrt: Konrad-Adenauer-Straße 43, 30159 Hannover\nTeilnehmende: Veronika Emmerich (VE, Stellvertreterin Geschäftsleitung), Marita Hinze (MH, Leitung Einkauf), Peter Renner (PR, Leitung Produktion), Thomas Hagen (TH, Leitung Finanzen), Sibylle Marquardt (SM, Leitung Personal), Christian Werner (CW, Leitung Vertrieb), Jessica Froh (JF, Leitung Marketing), Jutta Raulin (JR, Leitung Qualitätssicherung), Joachim Meyer (JM, Leitung IT)\nSitzungsleitung: Veronika Emmerich\nProtokollantin: Sibylle Marquardt\nNicht Anwesende: Martin Stahl (MS, Geschäftsleitung)\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung der Tagesordnungspunkte - VE\n2. Probleme mit einem Zulieferer - MH\n3. Zwischenstand Qualitätssicherung - JR\n4. Neue Überstundenregelung - VE\n5. Private Nutzung der Dienstwagen - SM\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung der Tagesordnungspunkte\nVE begrüßt alle Anwesenden, alle Abteilungsleiterinnen und -leiter zur heutigen Besprechung und bittet um die Genehmigung der Tagesordnungspunkte. Diese werden per Handzeichen einstimmig angenommen.\nAls nächster Besprechungstermin wird der 24.09.20XX nach der Urlaubszeit einstimmig festgelegt.\n\nTOP 2 Probleme mit einem Zulieferer\nMH berichtet, dass unser südamerikanischer Zulieferer Dos Caminos Exports Ltd. die Preise für seine Vorprodukte ohne weitere Absprache erhöht und uns in Rechnung gestellt hat. Auf Nachfrage wurde uns mitgeteilt, dass dies aufgrund stark gestiegener Transportkosten geschehen ist. Dies wird von uns nicht akzeptiert und wurde entsprechend an den Zulieferer kommuniziert. Nach intensivem Schriftwechsel kam es zu einer Einigung.\nWir behalten es uns vor, bis zum 31. des kommenden Monats einen für uns günstigeren Zulieferer zu finden. Hierfür zuständig sind MH und TH. Neue Lieferpartner könnten im asiatischen Raum gesucht werden. MH berichtet über gute Erfahrungen in dieser Region.\nZiel ist es, ohne weitere Ansprüche beiderseits von dem Vertrag des Zulieferers zurückzutreten. Gerichtliche Schritte werden dann nicht unternommen. Bis zum 20. des kommenden Monats ist darüber zu berichten.\n\nTOP 3 Zwischenstand Qualitätssicherung\nDie Abteilung Qualitätssicherung erarbeitete ein neues Konzept für Qualitätsprüfung in der Phase der Endproduktion. Das vor zwei Quartalen umgesetzte Konzept zeigt in der Qualitätsmessung bereits bei einer Abweichung von 30 Prozent eine Fehlermeldung. Dies führt seit drei Monaten zu einem messbaren Erfolg, berichtet JR. Die Zahl der Reklamationen ist signifikant zurückgegangen.\n\nTOP 4 Neue Überstundenregelung\nVE dankt allen Mitarbeitern für die mehrheitliche Bereitschaft, Überstunden zu leisten. Vor allem in Zeiten hoher Auftragseingänge lässt sich das leider nicht immer vermeiden.\nBisher konnten die Mitarbeitenden diese Überstunden als Freizeit ausgleichen oder sich auszahlen lassen. Aufgrund eines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bis zu 20 Überstunden pro Quartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen momentan nicht möglich ist. Bei sinkendem Auftragseingang kann man diese Maßnahme zu einem späteren Zeitpunkt wieder rückgängig machen. Diese Vorgehensweise ist mit Protokoll vom 15.06.20XX vom Betriebsrat genehmigt.\n\nTOP 5 Private Nutzung der Dienstwagen\nSM teilt mit, dass alle Mitarbeiter, die über einen Dienstwagen verfügen, diesen ab dem nächsten Monat nicht mehr nur für dienstliche, sondern auch für private Zwecke nutzen können. Es wird aber darauf hingewiesen, dass dann unbedingt ein Fahrtenbuch geführt werden muss, das die privat gefahrenen Kilometer angibt. Dieses ist monatlich in der Finanzabteilung einzureichen.\n\nTOP 6 Sonstiges\nTH präsentiert eine Idee seiner Mitarbeiterinnen und Mitarbeiter, sie möchten am Samstag in zwei Wochen einen geselligen Bowlingabend in der Anlage „Sport und Spaß“, Marienstraße 10-12 verbringen. Dazu laden sie alle interessierten Kolleginnen und Kollegen aus anderen Abteilungen ein. Die Personalabteilung wird diese Information ins Intranet stellen. Wer Interesse hat, soll sich dort bis Freitag nächster Woche anmelden.", "items": [{"n": 14, "type": "choice", "prompt": "Der Termin der nächsten Sitzung", "options": [{"key": "a", "text": "findet nach Abstimmung im Herbst statt."}, {"key": "b", "text": "muss verlegt werden."}, {"key": "c", "text": "wird noch bekannt gegeben."}], "answer": "a", "confidence": "hoch", "quote": "Als nächster Besprechungstermin wird der 24.09.20XX nach der Urlaubszeit einstimmig festgelegt.", "explain_ru": "Верно a: дату следующего собрания назначают голосованием (вопросы принимают «per Handzeichen einstimmig», и сам срок «legt … einstimmig fest») — 24.09.20XX, после периода отпусков, то есть осенью. b неверно, потому что дату не откладывают: её определяют здесь же. c неверно, потому что она не ждёт сообщения, а уже решена и занесена в протокол.", "explain": "Correcto a: la fecha de la próxima reunión se fija por votación (los asuntos se aprueban «per Handzeichen einstimmig», y el propio término se «legt … einstimmig fest») y se sitúa el 24.09.20XX, después del periodo de vacaciones, es decir, en otoño. b es falso porque la fecha no se aplaza: se acuerda aquí mismo. c es falso porque no queda pendiente de comunicarse, sino que ya está decidida y consta en el acta."}, {"n": 15, "type": "choice", "prompt": "Die Firma", "options": [{"key": "a", "text": "hat ohne Weiteres die Preiserhöhung des Zulieferers akzeptiert."}, {"key": "b", "text": "will sich an den höheren Transportkosten gern beteiligen."}, {"key": "c", "text": "wird einen neuen Vertragspartner suchen."}], "answer": "c", "confidence": "hoch", "quote": "Wir behalten es uns vor, bis zum 31. des kommenden Monats einen für uns günstigeren Zulieferer zu finden. Hierfür zuständig sind MH und TH. Neue Lieferpartner könnten im asiatischen Raum gesucht werden.", "explain_ru": "Верно c: предприятие оставляет за собой возможность найти более дешёвого поставщика до 31-го числа следующего месяца и рассматривает поиск новых партнёров по поставкам в Азии; кроме того, цель — расторгнуть договор с нынешним поставщиком («von dem Vertrag des Zulieferers zurückzutreten»). a неверно, текст говорит обратное: «Dies wird von uns nicht akzeptiert». b тоже неверно: удорожание вызвано транспортными расходами, но предприятие отклоняет повышение, а не предлагает его оплатить.", "explain": "Correcto c: la empresa se reserva la posibilidad de encontrar un proveedor más barato antes del día 31 del mes próximo, y se plantea buscar nuevos socios de suministro en Asia; además el objetivo es rescindir el contrato con el proveedor actual («von dem Vertrag des Zulieferers zurückzutreten»). a es falso, el texto lo dice al revés: «Dies wird von uns nicht akzeptiert». b también es falso: el encarecimiento se debe a los costes de transporte, pero la empresa rechaza la subida, no se ofrece a asumirla."}, {"n": 16, "type": "choice", "prompt": "Die Abteilung Qualitätssicherung", "options": [{"key": "a", "text": "berichtet von 30 Prozent fehlerhafter Produkte."}, {"key": "b", "text": "hat keine Qualitätsprobleme."}, {"key": "c", "text": "verzeichnet erste Erfolge."}], "answer": "c", "confidence": "hoch", "quote": "Dies führt seit drei Monaten zu einem messbaren Erfolg, berichtet JR. Die Zahl der Reklamationen ist signifikant zurückgegangen.", "explain_ru": "Верно c: новая концепция контроля качества уже три месяца даёт измеримый результат, и число рекламаций заметно снизилось. a — ловушка с цифрой: 30 % — это степень отклонения, при которой система выдаёт сообщение об ошибке («bei einer Abweichung von 30 Prozent eine Fehlermeldung»), а не доля брака. b неверно, потому что рекламации есть — именно их и стало меньше.", "explain": "Correcto c: el nuevo concepto de control de calidad arroja desde hace tres meses un éxito medible y las reclamaciones han disminuido de forma significativa. a es la trampa de la cifra: el 30 % es el grado de desviación a partir del cual el sistema lanza un aviso de error («bei einer Abweichung von 30 Prozent eine Fehlermeldung»), no el porcentaje de productos defectuosos. b es falso porque existen reclamaciones, que son precisamente las que han bajado."}, {"n": 17, "type": "choice", "prompt": "Die Mitarbeitenden", "options": [{"key": "a", "text": "haben mit dem Betriebsrat gesprochen."}, {"key": "b", "text": "können alle Überstunden als Freizeit nehmen."}, {"key": "c", "text": "müssen zurzeit Mehrarbeit leisten."}], "answer": "c", "confidence": "mittel", "quote": "Aufgrund eines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bis zu 20 Überstunden pro Quartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen momentan nicht möglich ist.", "explain_ru": "Верно c методом исключения: объём заказов сейчас неожиданно высокий, сверхурочные нельзя компенсировать отгулами, и в протоколе отмечена готовность большинства их брать, значит сейчас работают больше нормы (уверенность средняя, потому что в протоколе речь о «Bereitschaft» сотрудников и о том, что сверхурочных «lässt sich … nicht immer vermeiden», а не о прямой обязанности). a неверно: порядок утвердил Betriebsrat протоколом от 15.06.20XX, и никакого разговора сотрудников с ним не зафиксировано. b неверно: как раз эту возможность только что отменили; до 20 часов в квартал теперь только оплачиваются.", "explain": "Correcto c por eliminación: el volumen de pedidos es ahora inesperadamente alto, las horas extraordinarias no se pueden compensar con tiempo libre y se agradece la disposición mayoritaria a hacerlas, de modo que en este momento se trabaja de más (la confianza es media porque el acta habla de la «Bereitschaft» de los empleados y de que las horas extras «lässt sich … nicht immer vermeiden», más que de una obligación expresa). a es falso: quien aprobó el procedimiento fue el Betriebsrat, mediante acta del 15.06.20XX, y no consta ninguna conversación de los empleados con él. b es falso: precisamente se acaba de suprimir esa posibilidad; hasta 20 horas por trimestre solo se pagan."}, {"n": 18, "type": "choice", "prompt": "Das Fahrtenbuch", "options": [{"key": "a", "text": "dokumentiert alle gefahrenen Kilometer."}, {"key": "b", "text": "enthält nichtdienstliche Autofahrten."}, {"key": "c", "text": "wird von allen Mitarbeitern geführt."}], "answer": "b", "confidence": "mittel", "quote": "Es wird aber darauf hingewiesen, dass dann unbedingt ein Fahrtenbuch geführt werden muss, das die privat gefahrenen Kilometer angibt.", "explain_ru": "Верно b: протокол требует, чтобы в путевом журнале были указаны километры, пройденные в личных целях, то есть неслужебные поездки (машину теперь можно использовать «nicht mehr nur für dienstliche, sondern auch für private Zwecke»). a — путающий вариант: в тексте упомянуты только личные километры, а не «alle gefahrenen Kilometer»; настоящий Fahrtenbuch фиксирует всё, но в протоколе этого нет — отсюда средняя уверенность. c неверно, потому что журнал ведут только сотрудники со служебной машиной («alle Mitarbeiter, die über einen Dienstwagen verfügen»).", "explain": "Correcto b: el acta exige que el libro de ruta indique los kilómetros recorridos en uso privado, es decir, los desplazamientos no laborales (el coche pasa a poder usarse «nicht mehr nur für dienstliche, sondern auch für private Zwecke»). a es la opción que confunde: el texto solo menciona los kilómetros privados, no «alle gefahrenen Kilometer»; un Fahrtenbuch real recoge todo, pero el protocolo no lo dice, de ahí la confianza media. c es falso porque solo lo llevan los empleados que disponen de coche de empresa («alle Mitarbeiter, die über einen Dienstwagen verfügen»)."}]}, {"id": "t4_a-p45", "note_ru": "Новая версия протокола с. 43-44, помеченная в оригинале «Новый вариант от 08.2024» / «пункт 1 новый и новый вопрос»: TOP 1 переписан (дата следующего собрания назначается прямо во время заседания), пункт 14 новый, а пункты 15-18 повторяются дословно. Протокол снова занимает две страницы: TOP 1-3 на с. 45 и TOP 4-6 с пунктами 14-18 на с. 46. Вариант c пункта 14 («wurde während der Sitzung gesprochen») сохранён как есть, хотя в оригинале, вероятно, было «besprochen».", "label": "Variante 1 (Новый вариант от 08.2024)", "page": 45, "note": "Nueva versión del acta de las pp. 43-44, marcada en el original «Новый вариант от 08.2024» / «пункт 1 новый и новый вопрос»: el TOP 1 aparece reescrito (la fecha de la próxima reunión se fija expresamente durante la sesión) y el ítem 14 es nuevo, mientras que los ítems 15-18 se repiten literalmente. El acta vuelve a ocupar dos páginas: TOP 1-3 en la p. 45 y TOP 4-6 con los ítems 14-18 en la p. 46. Se ha conservado tal cual la opción c del ítem 14 («wurde während der Sitzung gesprochen»), aunque probablemente el original decía «besprochen».", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Protokoll 20.06.20XX, 10.00-12.00\nBesprechungsraum: 032,\nOrt: Konrad-Adenauer-Straße 43, 30159 Hannover\nTeilnehmende: Veronika Emmerich (VE, Stellvertreterin Geschäftsleitung), Marita Hinze (MH, Leitung Einkauf), Peter Renner (PR, Leitung Produktion), Thomas Hagen (TH, Leitung Finanzen), Sibylle Marquardt (SM, Leitung Personal), Christian Werner (CW, Leitung Vertrieb), Jessica Froh (JF, Leitung Marketing), Jutta Raulin (JR, Leitung Qualitätssicherung), Joachim Meyer (JM, Leitung IT)\nSitzungsleitung: Veronika Emmerich\nProtokollantin: Sibylle Marquardt\nNicht Anwesende: Martin Stahl (MS, Geschäftsleitung)\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung der Tagesordnungspunkte - VE\n2. Probleme mit einem Zulieferer - MH\n3. Zwischenstand Qualitätssicherung - JR\n4. Neue Überstundenregelung - VE\n5. Private Nutzung der Dienstwagen - SM\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung der Tagesordnungspunkte\nVE begrüßt alle Anwesenden, alle Abteilungsleiterinnen und -leiter zur heutigen Besprechung und bittet um die Genehmigung der Tagesordnungspunkte. Diese werden per Handzeichen einstimmig angenommen.\nDer nächste Besprechungstermin findet am 24.09.20XX statt; also nach der Urlaubszeit. Dies wird einstimmig beschlossen.\n\nTOP 2 Probleme mit einem Zulieferer\nMH berichtet, dass unser südamerikanischer Zulieferer Dos Caminos Exports Ltd. die Preise für seine Vorprodukte ohne weitere Absprache erhöht und uns in Rechnung gestellt hat. Auf Nachfrage wurde uns mitgeteilt, dass dies aufgrund stark gestiegener Transportkosten geschehen ist. Dies wird von uns nicht akzeptiert und wurde entsprechend an den Zulieferer kommuniziert. Nach intensivem Schriftwechsel kam es zu einer Einigung.\nWir behalten es uns vor, bis zum 31. des kommenden Monats einen für uns günstigeren Zulieferer zu finden. Hierfür zuständig sind MH und TH. Neue Lieferpartner könnten im asiatischen Raum gesucht werden. MH berichtet über gute Erfahrungen in dieser Region.\nZiel ist es, ohne weitere Ansprüche beiderseits von dem Vertrag des Zulieferers zurückzutreten. Gerichtliche Schritte werden dann nicht unternommen. Bis zum 20. des kommenden Monats ist darüber zu berichten.\n\nTOP 3 Zwischenstand Qualitätssicherung\nDie Abteilung Qualitätssicherung erarbeitete ein neues Konzept für Qualitätsprüfung in der Phase der Endproduktion. Das vor zwei Quartalen umgesetzte Konzept zeigt in der Qualitätsmessung bereits bei einer Abweichung von 30 Prozent eine Fehlermeldung. Dies führt seit drei Monaten zu einem messbaren Erfolg, berichtet JR. Die Zahl der Reklamationen ist signifikant zurückgegangen.\n\nTOP 4 Neue Überstundenregelung\nVE dankt allen Mitarbeitern für die mehrheitliche Bereitschaft, Überstunden zu leisten. Vor allem in Zeiten hoher Auftragseingänge lässt sich das leider nicht immer vermeiden.\nBisher konnten die Mitarbeitenden diese Überstunden als Freizeit ausgleichen oder sich auszahlen lassen. Aufgrund eines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bis zu 20 Überstunden pro Quartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen momentan nicht möglich ist. Bei sinkendem Auftragseingang kann man diese Maßnahme zu einem späteren Zeitpunkt wieder rückgängig machen. Diese Vorgehensweise ist mit Protokoll vom 15.06.20XX vom Betriebsrat genehmigt.\n\nTOP 5 Private Nutzung der Dienstwagen\nSM teilt mit, dass alle Mitarbeiter, die über einen Dienstwagen verfügen, diesen ab dem nächsten Monat nicht mehr nur für dienstliche, sondern auch für private Zwecke nutzen können. Es wird aber darauf hingewiesen, dass dann unbedingt ein Fahrtenbuch geführt werden muss, das die privat gefahrenen Kilometer angibt. Dieses ist monatlich in der Finanzabteilung einzureichen.\n\nTOP 6 Sonstiges\nTH präsen тому что результат измеряется как раз снижением рекламаций.", "explain": "Correcto c: desde hace tres meses el nuevo concepto de control de calidad produce un éxito medible y las reclamaciones han bajado de forma significativa. a confunde el dato: el 30 % es el umbral de desviación que provoca un aviso de error, no la cuota de productos defectuosos. b es falso, pues el éxito se mide justamente por el descenso de las reclamaciones."}, {"n": 17, "type": "choice", "prompt": "Die Mitarbeitenden", "options": [{"key": "a", "text": "haben mit dem Betriebsrat gesprochen."}, {"key": "b", "text": "können alle Überstunden als Freizeit nehmen."}, {"key": "c", "text": "müssen zurzeit Mehrarbeit leisten."}], "answer": "c", "confidence": "mittel", "quote": "Aufgrund eines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bis zu 20 Überstunden pro Quartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen momentan nicht möglich ist.", "explain_ru": "Верно c методом исключения: из-за большого объёма заказов сверхурочные уже нельзя компенсировать отгулами и оплачиваются только до 20 часов в квартал, значит сейчас работают больше нормы (средняя уверенность, потому что в протоколе подчёркнута «Bereitschaft» сотрудников, а не обязанность). a неверно: Betriebsrat утвердил порядок протоколом от 15.06.20XX, но нет данных, что сотрудники с ним говорили. b неверно: эту возможность только что приостановили.", "explain": "Correcto c por eliminación: debido al elevado volumen de pedidos, las horas extraordinarias ya no pueden compensarse con tiempo libre y solo se pagan hasta 20 por trimestre, de modo que actualmente se trabaja de más (confianza media, porque el acta subraya la «Bereitschaft» de los empleados más que una obligación). a es falso: el Betriebsrat aprobó el procedimiento con acta del 15.06.20XX, pero no consta que los empleados hablaran con él. b es falso: esa posibilidad acaba de quedar suspendida."}, {"n": 18, "type": "choice", "prompt": "Das Fahrtenbuch", "options": [{"key": "a", "text": "dokumentiert alle gefahrenen Kilometer."}, {"key": "b", "text": "enthält nichtdienstliche Autofahrten."}, {"key": "c", "text": "wird von allen Mitarbeitern geführt."}], "answer": "b", "confidence": "mittel", "quote": "Es wird aber darauf hingewiesen, dass dann unbedingt ein Fahrtenbuch geführt werden muss, das die privat gefahrenen Kilometer angibt.", "explain_ru": "Верно b: в путевом журнале нужно указывать километры, пройденные в личных целях, то есть неслужебные поездки, поскольку служебной машиной теперь можно пользоваться и в личных целях. a — ловушка: в протоколе упомянуты только личные километры, а не «alle gefahrenen Kilometer» (хотя на практике Fahrtenbuch фиксирует весь путь, в тексте этого нет). c неверно: журнал ведут только те, у кого есть служебная машина.", "explain": "Correcto b: el libro de ruta debe indicar los kilómetros hechos en uso privado, esto es, los desplazamientos no laborales, ya que el coche de empresa pasa a poder usarse también de forma privada. a es la trampa: el protocolo solo menciona los kilómetros privados, no «alle gefahrenen Kilometer» (aunque en la práctica un Fahrtenbuch recoja todo el recorrido, el texto no lo dice). c es falso: solo lo llevan quienes tienen coche de empresa."}]}, {"id": "t4_b-p47", "note_ru": "Первая версия Protokoll «neue Werbemaßnahmen, Frau Schlosser» (с. 47-48): протокол занимает две страницы, пять вопросов 14-18 — в конце с. 48. Это версия без пометки «Новая версия»; на с. 49 — вторая версия того же протокола с переписанным TOP 3 и новыми вопросами (→ t4_b-p49). Варианты пунктов 16, 17 и 18 здесь идут в другом порядке, чем во второй версии.", "label": "Variante 1", "page": 47, "note": "Primera versión del Protokoll «neue Werbemaßnahmen, Frau Schlosser» (pp. 47-48): el acta ocupa las dos páginas y las cinco preguntas 14-18 están al final de la p. 48. Es la versión sin la marca «Новая версия»; la p. 49 trae una segunda versión del mismo acta con el TOP 3 reescrito y preguntas nuevas (→ t4_b-p49). Las opciones de los ítems 16, 17 y 18 aparecen aquí en otro orden que en esa segunda versión.", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14-18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(neue Werbemaßnahmen, Frau Schlosser)\n\nProtokoll 14.02.20XX, 08:00-11:45 Uhr\nAbteilung 4, Besprechungszimmer 2\nTeilnehmende: Holger Marschke (HM, Teamleiter), Cornelia Markert (CM, Marketingabteilung), Susanne Willke (SW, Marketingabteilung), Monique Rüdiger (MR, Betriebsratsmitglied)\nEntschuldigt: Martin Hamann (MH, Qualitätssicherung)\nProtokollantin: Marianne Schiller (MS)\nSitzungsleitung: Andreas Mertens (AM)\n\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Neue Marketingmaßnahmen\n3. Qualitätsmanagement\n4. Anpassung der Pausenzeiten\n5. Standorte der neuen Fahrradständer\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nAM begrüßt alle Teilnehmenden und eröffnet die heutige Sitzung. Das Protokoll des letzten Meetings am 10.01.20XX wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt. Auf Antrag von MR, die wegen anderweitiger terminlicher Verpflichtungen nicht bis zum Ende am Meeting teilnehmen kann, wird die Reihenfolge der Tagesordnung geändert und die TOPs 4 und 5 werden am heutigen Vormittag vorgezogen.\n\nTOP 2 Neue Marketingmaßnahmen\nCM und SW berichten, dass traditionelle Marketingmaßnahmen wie z. B. Fernsehwerbung zu den Hauptsendezeiten zu teuer sind. Deshalb sollen soziale Medien wie Facebook, Instagram u. a. verstärkt genutzt werden. Weitere Möglichkeiten, Werbung zu machen, müssen von der Marketingabteilung noch erörtert werden. Es ist geplant, neue Wege zu gehen und zusätzlich zu den lokalen Geschäften einen Online-Shop zu starten. Für alle diese Maßnahmen steht insgesamt ein Budget von 150.000 € zur Verfügung. CM wird beauftragt, dafür eine spezialisierte Werbeagentur zu finden sowie einen Kostenvoranschlag der betreffenden Agentur einzuholen, SW soll Kontakte zu professionellen Fotografen und Textern herstellen und Angebote anfordern. Ergebnisse der beiden Recherchen werden bei der nächsten Besprechung am 10.03.20XX vorgestellt. Das weitere Vorgehen wird definiert, wenn alle nötigen Informationen vorliegen.\n\nTOP 3 Qualitätsmanagement\nZu den in der Besprechung vom 11.01.20XX vorgeschlagenen Maßnahmen hat MH im Vorfeld allen Sitzungsteilnehmenden erste Ergebnisse des Arbeitskreises „Optimierung innerer Kommunikationsstrukturen\" in Form eines Konzeptpapiers zukommen lassen. Da MH an der heutigen Sitzung aus gesundheitlichen Gründen nicht teilnehmen kann, ist gemeinsam beschlossen worden, die Diskussion zu diesem Punkt bis zur nächsten Besprechung am 10.03.20XX zu vertagen. Damit ist die Umsetzung der geplanten Veränderungen auf das nächste Quartal verschoben.\n\nTOP 4 Anpassung der Pausenzeiten\nAufgrund mehrfacher Anfragen von Seiten der Abteilungsleiter regt MR an, dass die Zeiten, in denen Pausen gemacht werden können, flexibler gestaltet werden. Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann. So können die betrieblichen Notwendigkeiten und Arbeitsabläufe verschiedener Abteilungen besser berücksichtigt werden. Dieser Vorschlag wird einstimmig angenommen, MR wird beauftragt, eine entsprechende Mitteilung an die Belegschaft über die Änderung der Pausenzeiten zu verfassen.\n\nTOP 5 Standorte der neuen Fahrradständer\nMR teilt mit, dass auf Wunsch der Belegschaft zwei weitere Fahrradständer auf dem Gelände aufgestellt werden. Dabei wurden zwei Standorte favorisiert und der erste Fahrradständer wird neben Tor 2, der zweite neben Tor 3 installiert. So steht den Mitarbeitenden nun an jedem Zugang zum Gelände eine Möglichkeit zur Verfügung, ihr Fahrrad abzustellen. Dementsprechend werden der Lageplan überarbeitet und die neuen Standorte der Fahrradständer eingezeichnet. MR formuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats aushängen.\n\nTOP 6 Sonstiges\nDie Assistentin der Geschäftsleitung, Frau Schlosser, verabschiedet sich in den Mutterschutz und die anschließende Elternzeit. Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt sein. Frau Meier wird eine Abschiedsfeier für den 16.03.20XX organisieren und sich auch um kleine Geschenke für Mutter und Kind im Namen der Kolleginnen und Kollegen kümmern.", "items": [{"n": 14, "type": "choice", "prompt": "Für neue Werbemaßnahmen", "options": [{"key": "a", "text": "werden kreative Mitarbeiter gesucht."}, {"key": "b", "text": "wird ein Gesamtbetrag von 150.000 € bereitgestellt."}, {"key": "c", "text": "wurden Kostenvoranschläge angefragt."}], "answer": "b", "confidence": "hoch", "quote": "Für alle diese Maßnahmen steht insgesamt ein Budget von 150.000 € zur Verfügung.", "explain_ru": "Верно b: протокол устанавливает для всех рекламных мер общий бюджет («insgesamt ein Budget») в 150 000 € — ровно столько и указано в варианте. a неверно, потому что собственных креативных сотрудников не ищут: CM поручают найти внешнее рекламное агентство, а SW — связаться с фотографами и текстовиками («professionellen Fotografen und Textern»), то есть с внешними подрядчиками, а не со штатными работниками. c неверно, потому что сметы ещё не запрошены: CM «wird beauftragt … einen Kostenvoranschlag … einzuholen» (поручение на будущее), а результаты обоих поисков представят на собрании 10.03.20XX.", "explain": "Correcto b: el acta fija para todas las medidas publicitarias un presupuesto total («insgesamt ein Budget») de 150.000 €, que es exactamente el importe de la opción. a es falso porque no se busca personal creativo propio: lo que se hace es encargar a CM que encuentre una agencia de publicidad externa y a SW que contacte con fotógrafos y redactores («professionellen Fotografen und Textern»), proveedores externos, no trabajadores de la plantilla. c es falso porque los presupuestos todavía no se han pedido: CM «wird beauftragt … einen Kostenvoranschlag … einzuholen» (encargo para el futuro) y los resultados de ambas búsquedas se presentarán en la reunión del 10.03.20XX."}, {"n": 15, "type": "choice", "prompt": "Herr Hamann", "options": [{"key": "a", "text": "hat bereits ein Konzept vorbereitet."}, {"key": "b", "text": "ist dienstlich verhindert."}, {"key": "c", "text": "stellt die Resultate seiner Arbeit vor."}], "answer": "a", "confidence": "hoch", "quote": "Zu den in der Besprechung vom 11.01.20XX vorgeschlagenen Maßnahmen hat MH im Vorfeld allen Sitzungsteilnehmenden erste Ergebnisse des Arbeitskreises „Optimierung innerer Kommunikationsstrukturen\" in Form eines Konzeptpapiers zukommen lassen.", "explain_ru": "Верно a: MH (Martin Hamann) уже подготовил документ с концепцией («in Form eines Konzeptpapiers») с первыми результатами своей рабочей группы и разослал его всем участникам до собрания, то есть концепция у него уже готова. b неверно по причине отсутствия: MH не может участвовать «aus gesundheitlichen Gründen» (по состоянию здоровья), а не по рабочим делам («dienstlich»). c неверно, потому что он как раз не может присутствовать, и вопрос отложен до собрания 10.03.20XX.", "explain": "Correcto a: MH (Martin Hamann) ya había elaborado un documento de concepto («in Form eines Konzeptpapiers») con los primeros resultados de su grupo de trabajo y lo envió a todos los participantes antes de la reunión, es decir, tiene un concepto ya preparado. b es falso por el motivo de la ausencia: MH no puede asistir «aus gesundheitlichen Gründen» (razones de salud), no por motivos de trabajo («dienstlich»). c es falso porque precisamente no puede asistir y el punto se aplaza a la reunión del 10.03.20XX."}, {"n": 16, "type": "choice", "prompt": "Die Mittagspause", "options": [{"key": "a", "text": "ist 30 Minuten lang."}, {"
