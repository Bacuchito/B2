sa porque quien actúa primero no es la BG sino el primer auxiliador («wird zunächst der Ersthelfer oder die Ersthelferin informiert») y, según la gravedad, se avisa a una ambulancia. La c también es falsa: la BG sigue pagando el salario solo «ab der siebten Woche der Arbeitsunfähigkeit», no de inmediato.", "verified": true}]}]}, {"id": "lesen-t3", "title": "Lesen Teil 3", "variants": [{"id": "t3_a-p32", "label": "Variante 1", "page": 32, "note": "", "kind": "zuordnung", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Günther, vor 9 Stunden", "text": "Das kann man pauschal gar nicht so sagen. Wie das in deinem Unternehmen geregelt ist, steht in deinem Arbeitsvertrag. Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung“ oder „Krankheit“.", "distractor": ""}, {"key": "b", "title": "Marion, vor 4 Stunden", "text": "Nein, vorher musst du erst mal eine Abmahnung bekommen. Wenn du dann allerdings noch mal fehlst, ohne Bescheid zu sagen, musst du mit der Kündigung rechnen. Such doch noch mal das Gespräch mit deinem Chef. Ihr findet bestimmt eine Lösung.", "distractor": ""}, {"key": "c", "title": "Karin, vor 45 Minuten", "text": "Du kannst nicht einfach kommen und gehen, wann du willst, auch wenn du die Absicht hattest, die versäumte Zeit nachzuholen. Die Arbeitszeiten sind ja vertraglich geregelt. Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig.", "distractor": ""}, {"key": "d", "title": "Elli, vor 3 Stunden", "text": "Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du brauchst natürlich ein ärztliches Attest. Das gilt allerdings nicht, wenn du dich um ein krankes Kind kümmern musst. In diesem Fall gelten die Urlaubstage als genommen.", "distractor": ""}, {"key": "e", "title": "Sabine, vor 40 Minuten", "text": "Diese Situation kennen doch alle Eltern. Wenn ich für meinen Sohn mal keine Betreuung finde, kann ich ihn auch ausnahmsweise mit ins Büro nehmen. Meine Chefin ist da zum Glück sehr verständnisvoll.", "distractor": "Solo cuenta cómo ella resuelve la falta de guardería (llevarse al hijo a la oficina); no responde a ninguna de las cuatro consultas. Es el distractor temático de la 10 (Gabi: el hijo enfermo durante las vacaciones) y de la 11 (Charlotte: el hijo enfermo y la amenaza de despido): ninguna de las dos pregunta si puede llevar al niño al trabajo, sino qué pasa con los días de vacaciones y con el despido."}, {"key": "f", "title": "Jorge, vor 2 Stunden", "text": "Also ich gehe immer gleich am ersten Krankheitstag zum Arzt. Sicher ist sicher. Außerdem kann es nicht schaden, wenn dich ein Doktor anschaut, wenn du dich nicht wohlfühlst. Gerade wenn du Kinder hast, ist es wichtig, dass du weißt, was dir fehlt. Du willst ja niemanden anstecken.", "distractor": "Aconseja por experiencia propia ir al médico el primer día de baja, pero no aclara la norma legal que se pregunta. Es el distractor temático de la 13 (Kamil: ¿certificado médico solo a partir del tercer día?) e, indirectamente, de la 12 (Lars, que se puso enfermo): la respuesta correcta es a) Günther, que remite al contrato de trabajo."}], "items": [{"n": 10, "type": "choice", "prompt": "Gabi: Ich hatte gerade Urlaub und gleich am ersten Urlaubstag wurde meine Kleine krank und ich musste sie vier Tage lang pflegen. Wenn ich im Urlaub krank werde, kann ich die Tage zurückbekommen. Aber wie ist das, wenn das Kind krank wird?", "answer": "d", "confidence": "hoch", "quote": "Das gilt allerdings nicht, wenn du dich um ein krankes Kind kümmern musst. In diesem Fall gelten die Urlaubstage als genommen.", "explain": "Gabi pregunta qué pasa con sus días de vacaciones cuando la que enferma es su hija, no ella. Elli (d) retoma literalmente su propio argumento («Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden») y responde con la excepción de la «krankes Kind»: si cuidas a un hijo enfermo, los días de vacaciones se consideran disfrutados. Sabine (e) también habla de hijos, pero de guardería, no de vacaciones."}, {"n": 11, "type": "choice", "prompt": "Charlotte: Ich konnte leider mal wieder nicht zur Arbeit gehen, weil mein Kind krank war. Als ich heute angerufen habe, hat mein Chef total überzogen reagiert und mir mit Kündigung gedroht, wenn ich mehr als einen Tag fehle. Das geht doch nicht, oder?", "answer": "b", "confidence": "hoch", "quote": "Nein, vorher musst du erst mal eine Abmahnung bekommen.", "explain": "Charlotte avisó de su ausencia («Als ich heute angerufen habe») y el jefe la amenaza con el despido: Marion (b) responde exactamente a eso con un «Nein» y con la regla de que antes hace falta una Abmahnung, y le aconseja hablar con el jefe. Karin (c) también menciona la Abmahnung, pero para el caso contrario (ausencia sin avisar), que es el de Lars."}, {"n": 12, "type": "choice", "prompt": "Lars: Ich bin letzten Montag mit furchtbaren Kopfschmerzen aufgewacht und konnte nicht aufstehen. Leider habe ich vergessen, meinen Arbeitgeber anzurufen, und bin im Bett geblieben. Jetzt will mein Chef mir kündigen, weil ich unentschuldigt gefehlt habe. Geht das so einfach?", "answer": "c", "confidence": "mittel", "quote": "Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig.", "explain": "Lars faltó sin excusa ni aviso, y Karin (c) es la única que responde a la pregunta «Geht das so einfach?» en sentido afirmativo: cuando el trabajador no respeta sus obligaciones, no hace falta una Abmahnung previa. Confianza media porque c se centra en el horario de trabajo y no dice literalmente «Kündigung möglich»; la asignación se confirma por eliminación (b encaja mejor con Charlotte, que sí avisó) y por la variante de la p. 34, donde este mismo posteo lleva la respuesta c."}, {"n": 13, "type": "choice", "prompt": "Kamil: Gestern war ich krank. Als ich heute wieder im Büro war, wollte mein Chef direkt die Krankschreibung haben. Ich war immer der Meinung, die braucht man erst nach drei Tagen?", "answer": "a", "confidence": "hoch", "quote": "Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung“ oder „Krankheit“.", "explain": "Kamil pregunta a partir de cuándo está obligado a entregar el certificado médico. Günther (a) responde justo a eso: no hay una regla general, depende del contrato de trabajo y suele estar en los apartados «Arbeitsverhinderung» o «Krankheit». Jorge (f) es el distractor: habla de ir al médico el primer día, pero no de la obligación de presentar el certificado."}]}, {"id": "t3_a-p33", "label": "Variante 1 (versión 08.2024)", "page": 33, "note": "Repite los cuatro posteos de la p. 32; solo cambia la formulación del comentario d (así lo indica el encabezado ruso: «новая формулировка ответа d»). Las respuestas no cambian.", "kind": "zuordnung", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Günther, vor 9 Stunden", "text": "Das kann man pauschal gar nicht so sagen. Wie das in deinem Unternehmen geregelt ist, steht in deinem Arbeitsvertrag. Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung“ oder „Krankheit“.", "distractor": ""}, {"key": "b", "title": "Marion, vor 4 Stunden", "text": "Nein, vorher musst du erst mal eine Abmahnung bekommen. Wenn du dann allerdings noch mal fehlst, ohne Bescheid zu sagen, musst du mit der Kündigung rechnen. Such doch noch mal das Gespräch mit deinem Chef. Ihr findet bestimmt eine Lösung.", "distractor": ""}, {"key": "c", "title": "Karin, vor 45 Minuten", "text": "Du kannst nicht einfach kommen und gehen, wann du willst, auch wenn du die Absicht hattest, die versäumte Zeit nachzuholen. Die Arbeitszeiten sind ja vertraglich geregelt. Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig.", "distractor": ""}, {"key": "d", "title": "Elli, vor 3 Stunden", "text": "Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du brauchst natürlich ab dem ersten Tag ein ärztliches Attest. Anders sieht es aus, wenn du einen Familienangehörigen betreust. Das ist dann nicht Sache deines Arbeitgebers.", "distractor": ""}, {"key": "e", "title": "Sabine, vor 40 Minuten", "text": "Diese Situation kennen doch alle Eltern. Wenn ich für meinen Sohn mal keine Betreuung finde, kann ich ihn auch ausnahmsweise mit ins Büro nehmen. Meine Chefin ist da zum Glück sehr verständnisvoll.", "distractor": "Solo cuenta cómo ella resuelve la falta de guardería (llevarse al hijo a la oficina); no responde a ninguna de las cuatro consultas. Es el distractor temático de la 10 (Gabi: el hijo enfermo durante las vacaciones) y de la 11 (Charlotte: el hijo enfermo y la amenaza de despido): ninguna de las dos pregunta por el cuidado del niño, sino por los días de vacaciones y por el despido."}, {"key": "f", "title": "Jorge, vor 2 Stunden", "text": "Also ich gehe immer gleich am ersten Krankheitstag zum Arzt. Sicher ist sicher. Außerdem kann es nicht schaden, wenn dich ein Doktor anschaut, wenn du dich nicht wohlfühlst. Gerade wenn du Kinder hast, ist es wichtig, dass du weißt, was dir fehlt. Du willst ja niemanden anstecken.", "distractor": "Aconseja por experiencia propia ir al médico el primer día de baja, pero no aclara la norma legal que se pregunta. Es el distractor temático de la 13 (Kamil: ¿certificado médico solo a partir del tercer día?) e, indirectamente, de la 12 (Lars, que se puso enfermo): la respuesta correcta es a) Günther, que remite al contrato de trabajo."}], "items": [{"n": 10, "type": "choice", "prompt": "Gabi: Ich hatte gerade Urlaub und gleich am ersten Urlaubstag wurde meine Kleine krank und ich musste sie vier Tage lang pflegen. Wenn ich im Urlaub krank werde, kann ich die Tage zurückbekommen. Aber wie ist das, wenn das Kind krank wird?", "answer": "d", "confidence": "mittel", "quote": "Anders sieht es aus, wenn du einen Familienangehörigen betreust. Das ist dann nicht Sache deines Arbeitgebers.", "explain": "Sigue siendo la única respuesta posible para Gabi: Elli (d) retoma su argumento («Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden») y marca la diferencia cuando se cuida a un familiar. Confianza media porque esta nueva formulación ya no dice expresamente que los días de vacaciones se den por disfrutados (en la versión de la p. 32 sí: «In diesem Fall gelten die Urlaubstage als genommen»)."}, {"n": 11, "type": "choice", "prompt": "Charlotte: Ich konnte leider mal wieder nicht zur Arbeit gehen, weil mein Kind krank war. Als ich heute angerufen habe, hat mein Chef total überzogen reagiert und mir mit Kündigung gedroht, wenn ich mehr als einen Tag fehle. Das geht doch nicht, oder?", "answer": "b", "confidence": "hoch", "quote": "Nein, vorher musst du erst mal eine Abmahnung bekommen.", "explain": "Charlotte avisó de su ausencia y el jefe la amenaza con el despido: Marion (b) responde con un «Nein» directo y con la regla de la Abmahnung previa. El comentario d de esta versión también menciona el «Attest», pero va dirigido a quien se toma vacaciones, no a este caso."}, {"n": 12, "type": "choice", "prompt": "Lars: Ich bin letzten Montag mit furchtbaren Kopfschmerzen aufgewacht und konnte nicht aufstehen. Leider habe ich vergessen, meinen Arbeitgeber anzurufen, und bin im Bett geblieben. Jetzt will mein Chef mir kündigen, weil ich unentschuldigt gefehlt habe. Geht das so einfach?", "answer": "c", "confidence": "mittel", "quote": "Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig.", "explain": "Lars faltó sin avisar y Karin (c) es la única que responde en sentido afirmativo a «Geht das so einfach?»: si el trabajador no cumple sus obligaciones, no hace falta una Abmahnung previa. Confianza media porque c habla del horario de trabajo y no formula literalmente la expulsión; se confirma por eliminación y por la variante de la p. 34 (mismo posteo con la respuesta c)."}, {"n": 13, "type": "choice", "prompt": "Kamil: Gestern war ich krank. Als ich heute wieder im Büro war, wollte mein Chef direkt die Krankschreibung haben. Ich war immer der Meinung, die braucht man erst nach drei Tagen?", "answer": "a", "confidence": "hoch", "quote": "Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung“ oder „Krankheit“.", "explain": "Günther (a) responde a la pregunta de Kamil sobre desde cuándo hace falta el certificado: no hay regla general, está en el contrato de trabajo. Ojo con el nuevo comentario d, que también habla de un «ärztliches Attest», pero referido al empleado de vacaciones que enferma, no a la obligación de presentar la Krankschreibung."}]}, {"id": "t3_a-p34", "label": "Variante 1 (versión 07.02.2025)", "page": 34, "note": "Mismos textos que la p. 32, pero con nombres nuevos y las cuatro tareas en otro orden (así lo indica el encabezado ruso: «новые имена и очередь»). Por eso las respuestas se desplazan: 10→b, 11→c, 12→a, 13→d.", "kind": "zuordnung", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Jose Cristobal, vor 9 Stunden", "text": "Das kann man pauschal gar nicht so sagen. Wie das in deinem Unternehmen geregelt ist, steht in deinem Arbeitsvertrag. Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung“ oder „Krankheit“.", "distractor": ""}, {"key": "b", "title": "Gracia Maria, vor 4 Stunden", "text": "Nein, vorher musst du erst mal eine Abmahnung bekommen. Wenn du dann allerdings noch mal fehlst, ohne Bescheid zu sagen, musst du mit der Kündigung rechnen. Such doch noch mal das Gespräch mit deinem Chef. Ihr findet bestimmt eine Lösung.", "distractor": ""}, {"key": "c", "title": "Lina, vor 45 Minuten", "text": "Du kannst nicht einfach kommen und gehen, wann du willst, auch wenn du die Absicht hattest, die versäumte Zeit nachzuholen. Die Arbeitszeiten sind ja vertraglich geregelt. Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig.", "distractor": ""}, {"key": "d", "title": "Lida, vor 3 Stunden", "text": "Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du brauchst natürlich ab dem ersten Tag ein ärztliches Attest. Anders sieht es aus, wenn du einen Familienangehörigen betreust. Das ist dann nicht Sache deines Arbeitgebers.", "distractor": ""}, {"key": "e", "title": "Antonia, vor 40 Minuten", "text": "Diese Situation kennen doch alle Eltern. Wenn ich für meinen Sohn mal keine Betreuung finde, kann ich ihn auch ausnahmsweise mit ins Büro nehmen. Meine Chefin ist da zum Glück sehr verständnisvoll.", "distractor": "Solo cuenta cómo ella resuelve la falta de guardería (llevarse al hijo a la oficina); no responde a ninguna de las cuatro consultas. Es el distractor temático de la 10 (Petra: el hijo enfermo y la amenaza de despido) y de la 13 (Ines Maria: el hijo enfermo durante las vacaciones): ninguna pregunta si puede llevar al niño al trabajo."}, {"key": "f", "title": "Jorge, vor 2 Stunden", "text": "Also ich gehe immer gleich am ersten Krankheitstag zum Arzt. Sicher ist sicher. Außerdem kann es nicht schaden, wenn dich ein Doktor anschaut, wenn du dich nicht wohlfühlst. Gerade wenn du Kinder hast, ist es wichtig, dass du weißt, was dir fehlt. Du willst ja niemanden anstecken.", "distractor": "Aconseja por experiencia propia ir al médico el primer día de baja, pero no aclara la norma legal. Es el distractor temático de la 12 (Leo: ¿certificado médico solo a partir del tercer día?) e, indirectamente, de la 11 (Giovanni, que se puso enfermo): la respuesta correcta es a) Jose Cristobal, que remite al contrato de trabajo."}], "items": [{"n": 10, "type": "choice", "prompt": "Petra: Ich konnte leider mal wieder nicht zur Arbeit gehen, weil mein Kind krank war. Als ich heute angerufen habe, hat mein Chef total überzogen reagiert und mir mit Kündigung gedroht, wenn ich mehr als einen Tag fehle. Das geht doch nicht, oder?", "answer": "b", "confidence": "hoch", "quote": "Nein, vorher musst du erst mal eine Abmahnung bekommen.", "explain": "Es el mismo caso que Charlotte en la p. 32, ahora en el número 10: la madre avisó de su ausencia y el jefe la amenaza con el despido. Gracia Maria (b) responde con el «Nein» y con la necesidad de una Abmahnung previa. El comentario c también habla de la Abmahnung, pero para quien falta sin dar señales (Giovanni, 11)."}, {"n": 11, "type": "choice", "prompt": "Giovanni: Ich bin letzten Montag mit furchtbaren Kopfschmerzen aufgewacht und konnte nicht aufstehen. Leider habe ich vergessen, meinen Arbeitgeber anzurufen, und bin im Bett geblieben. Jetzt will mein Chef mir kündigen, weil ich unentschuldigt gefehlt habe. Geht das so einfach?", "answer": "c", "confidence": "mittel", "quote": "Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig.", "explain": "Giovanni faltó sin excusa ni aviso y pregunta si el despido puede ser tan fácil. Lina (c) es la única que responde en sentido afirmativo: cuando el trabajador no respeta sus obligaciones, la Abmahnung previa no es necesaria. Confianza media porque c se centra en las obligaciones horarias y no nombra la «Kündigung»; la asignación queda fijada por eliminación (a→12, b→10, d→13)."}, {"n": 12, "type": "choice", "prompt": "Leo: Gestern war ich krank. Als ich heute wieder im Büro war, wollte mein Chef direkt die Krankschreibung haben. Ich war immer der Meinung, die braucht man erst nach drei Tagen?", "answer": "a", "confidence": "hoch", "quote": "Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung“ oder „Krankheit“.", "explain": "Leo pregunta desde cuándo está obligado a presentar el certificado. Jose Cristobal (a) contesta exactamente eso: no hay una regla general, depende del contrato de trabajo y suele estar regulado en «Arbeitsverhinderung» o «Krankheit». Jorge (f) es el distractor, porque solo cuenta su costumbre de ir al médico el primer día."}, {"n": 13, "type": "choice", "prompt": "Ines Maria: Ich hatte gerade Urlaub und gleich am ersten Urlaubstag wurde meine Kleine krank und ich musste sie vier Tage lang pflegen. Wenn ich im Urlaub krank werde, kann ich die Tage zurückbekommen. Aber wie ist das, wenn das Kind krank wird?", "answer": "d", "confidence": "mittel", "quote": "Anders sieht es aus, wenn du einen Familienangehörigen betreust. Das ist dann nicht Sache deines Arbeitgebers.", "explain": "Es el mismo caso que Gabi en la p. 32, ahora en el número 13. Lida (d) retoma su frase literal sobre el reembolso de los días de vacaciones y señala la excepción del familiar al que se cuida. Confianza media porque la formulación nueva ya no dice expresamente que esos días de vacaciones se consideren disfrutados (la versión de la p. 32 sí lo dice)."}]}, {"id": "t3_b-p35", "label": "Variante 2 (Ausbildung und Familie)", "page": 35, "note": "Foro sobre compatibilidad de formación profesional (Ausbildung), familia, embarazo y edad.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Susi, vor 1 Stunde", "text": "Solange du so nicht weniger arbeitest als im Vertrag vereinbart, müsstest du rechtlich auf der sicheren Seite sein. Wenn du es genau wissen willst, solltest du in diesem Fall einen Anwalt für Arbeitsrecht kontaktieren. Mit einer Rechtsschutzversicherung wird das auch nicht so teuer.", "distractor": ""}, {"key": "b", "title": "Julia, vor 1 Stunde", "text": "Rein rechtlich kannst du das nicht ohne Zustimmung deiner Eltern machen. Sie müssen die Kündigung sogar unterschreiben. An deiner Stelle würde ich mir das aber noch mal überlegen. Ich kann deinen Vater jedenfalls gut verstehen. Er macht sich halt Sorgen um deine Zukunft.", "distractor": ""}, {"key": "c", "title": "Jürgen, vor 2 Stunden", "text": "Hi, ich würde die Ausbildung auf keinen Fall abbrechen. Mit Berufen im Finanzbereich hast du gute Aussichten auf dem Arbeitsmarkt und verdienst später auch gutes Geld. Mach dir das nicht kaputt. Meine Tochter ist Steuerberaterin und sucht händeringend nach fähigen Mitarbeitern. Sie kann sich vor Aufträgen gar nicht retten.", "distractor": ""}, {"key": "d", "title": "Jochen, vor 5 Stunden", "text": "Also ich würde noch warten, bis dein Kind etwas größer ist, und mich jetzt noch nicht um einen Ausbildungsplatz bewerben. Wenn es etwas selbstständiger ist, wird vieles leichter. Eine Ausbildung kannst du auch in drei oder vier Jahren noch machen. Dein Kind braucht dich jetzt.", "distractor": "Aconseja posponer la solicitud de formación profesional hasta que el niño crezca, pero Jacqueline ya ha comenzado su Ausbildung y Hans-Peter ya tiene a su hijo criado."}, {"key": "e", "title": "Achim, vor 6 Stunden", "text": "Schutz von Leben und Gesundheit ist das oberste Gebot. Um dich und dein Kind zu schützen, darfst du während der Schwangerschaft keine körperlich anstrengenden Arbeiten verrichten und auch Tätigkeiten, bei denen du Lärm, Schmutz, Kälte usw. ausgesetzt bist, sind tabu.", "distractor": "Explica normas generales de protección de la salud durante el embarazo (Mutterschutz: prohibición de trabajo físico pesado o ruidoso), pero no responde a si interrumpir o no la formación."}, {"key": "f", "title": "Peter, vor 12 Stunden", "text": "Warum das denn? Es gibt doch heutzutage Möglichkeiten, das Kind unterzubringen, während man arbeitet. Können dich deine Eltern vielleicht unterstützen? Sprich mal mit deinem Chef! Wenn der sieht, dass dir die Ausbildung wichtig ist, wird sich eine Lösung finden. Aber versuch auf jeden Fall, die Ausbildung durchzuziehen.", "distractor": ""}], "items": [{"n": 10, "type": "choice", "prompt": "Inka: Ich bin Auszubildende in einem Büro und muss immer pünktlich Feierabend machen, weil ich meinen einjährigen Sohn von der Krippe abholen muss. Mein Chef sieht das gar nicht gern und droht mir jetzt sogar mit Kündigung. Was soll ich machen?", "answer": "a", "confidence": "hoch", "quote": "Solange du so nicht weniger arbeitest als im Vertrag vereinbart, müsstest du rechtlich auf der sicheren Seite sein. Wenn du es genau wissen willst, solltest du in diesem Fall einen Anwalt für Arbeitsrecht kontaktieren.", "explain": "Inka cumple con su jornada pero debe salir puntual para recoger a su hijo de la guardería y el jefe la amenaza con el despido. Susi (a) le aclara que mientras trabaje las horas contractuales está protegida legalmente y le recomienda consultar a un abogado laboralista."}, {"n": 11, "type": "choice", "prompt": "Jacqueline: Hallo Leute! Vor ein paar Monaten habe ich mit einer Ausbildung begonnen. Und jetzt bin ich schwanger... Was soll ich bloß machen? Es wird bestimmt schwierig, Kind und Arbeit zu vereinbaren. Soll ich die Ausbildung abbrechen?", "answer": "f", "confidence": "hoch", "quote": "Aber versuch auf jeden Fall, die Ausbildung durchzuziehen.", "explain": "Jacqueline se ha quedado embarazada al poco de iniciar la formación y duda si abandonarla («Soll ich die Ausbildung abbrechen?»). Peter (f) la anima vehementemente a no dejarla («durchzuziehen»), buscar guardería o apoyo familiar y hablar con el jefe para buscar una solución."}, {"n": 12, "type": "choice", "prompt": "Hans-Peter: Guten Abend, ich bin Ende 40 und mein Sohn ist inzwischen erwachsen. Jetzt möchte ich beruflich was ganz Neues machen und eine Ausbildung zum Steuerfachangestellten anfangen. Meint ihr, ich habe in meinem Alter noch Chancen, in diesem Beruf zu arbeiten?", "answer": "c", "confidence": "hoch", "quote": "Mit Berufen im Finanzbereich hast du gute Aussichten auf dem Arbeitsmarkt und verdienst später auch gutes Geld. Mach dir das nicht kaputt. Meine Tochter ist Steuerberaterin und sucht händeringend nach fähigen Mitarbeitern.", "explain": "Hans-Peter pregunta si a sus casi 50 años tiene posibilidades en el sector fiscal («Steuerfachangestellten»). Jürgen (c) confirma las excelentes perspectivas laborales en el ámbito financiero y cita a su hija asesora fiscal, que busca personal urgentemente."}, {"n": 13, "type": "choice", "prompt": "Max: Hallo, ich mache momentan eine Ausbildung zum Einzelhandelskaufmann. Ich habe noch ein Jahr bis zum Abschluss und habe wirklich keine Lust mehr. Mein Vater möchte, dass ich die Ausbildung fertig mache. Ich bin noch nicht 18. Kann ich trotzdem einfach kündigen?", "answer": "b", "confidence": "hoch", "quote": "Rein rechtlich kannst du das nicht ohne Zustimmung deiner Eltern machen. Sie müssen die Kündigung sogar unterschreiben.", "explain": "Max es menor de edad («Ich bin noch nicht 18») y pregunta si puede rescindir su contrato por su cuenta contra el deseo de su padre. Julia (b) le advierte de que legalmente los menores no pueden rescindir la formación sin el consentimiento y la firma de sus padres."}]}, {"id": "t3_b-p36", "label": "Variante 3 (Arbeitszeit und Familie)", "page": 36, "note": "Foro sobre trabajo en sábado, ampliación de jornada parcial a completa y excedencias.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Thilo, vor 45 Minuten", "text": "In meinen Augen ist Familie das Wichtigste auf der Welt. Es ist doch auch ein Gewinn, wenn man mehr Zeit mit seinen Kindern verbringen kann und weniger gestresst ist. Ich würde mich auf jeden Fall für Teilzeit entscheiden.", "distractor": ""}, {"key": "b", "title": "Henny, vor 1 Stunde", "text": "Also ich finde es nicht gut, wenn Geschäfte und Supermärkte an Samstagen so lange geöffnet sind. Ihr müsst doch bedenken, dass dort auch Menschen arbeiten müssen. Sie wollen doch ebenfalls Wochenende haben und zu ihren Familien. Ich bin ganz klar gegen längere Ladenöffnungszeiten.", "distractor": "Opina en contra de los horarios comerciales prolongados en sábado para los dependientes de tiendas; no responde a ninguna de las consultas individuales de oficina/jornada."}, {"key": "c", "title": "Angela, vor 6 Stunden", "text": "Jeder Arbeitnehmer hat einen Rechtsanspruch auf Teilzeitarbeit. Allerdings musst du länger als sechs Monate bei dem Unternehmen beschäftigt sein. Man muss sich das aber genau überlegen, da man nicht nur kurz- oder mittelfristig weniger verdient, sondern auch weniger Rentenansprüche hat. Schau doch mal im Internet, wie viel das ausmacht.", "distractor": ""}, {"key": "d", "title": "Ratna, vor 2 Stunden", "text": "Seit Kurzem haben Arbeitnehmer das Recht, eine befristete Zeit weniger zu arbeiten, aber das gilt bestimmt nicht rückwirkend. Soviel ich weiß, hast du also keinen Anspruch, in die Vollzeit zurückzukehren. Sprich doch einfach mal mit deinem Chef.", "distractor": ""}, {"key": "e", "title": "Alex, vor 30 Minuten", "text": "Der Samstag ist ein normaler Werktag und deshalb kann der Arbeitgeber anordnen, dass an diesem Tag auch gearbeitet wird. Dabei spielt es keine Rolle, ob du Kinder hast oder nicht. Oft ist es aber auch so, dass du dann an einem anderen Tag in der Woche frei bekommst.", "distractor": ""}, {"key": "f", "title": "Gerhard, vor 3 Stunden", "text": "Also ich würde mir das gut überlegen. Wenn du bisher gut über die Runden gekommen bist, könntest du dir doch etwas mehr Freizeit gönnen. Meines Erachtens geht es hier auch um mehr Lebensqualität. Das Leben ist zu kurz, um nur zu arbeiten.", "distractor": "Reflexión filosófica sobre valorar el tiempo libre y la calidad de vida, pero sin asesorar sobre consecuencias legales o financieras concretas."}], "items": [{"n": 10, "type": "choice", "prompt": "Soma: Meine Kinder sind unter der Woche ganztags in der Kita, damit ich Vollzeit arbeiten kann. Jetzt soll ich in den nächsten Wochen samstags ins Büro kommen. Ich habe aber niemanden, der da auf meine Kinder aufpassen kann. Kann der Arbeitgeber das verlangen?", "answer": "e", "confidence": "hoch", "quote": "Der Samstag ist ein normaler Werktag und deshalb kann der Arbeitgeber anordnen, dass an diesem Tag auch gearbeitet wird. Dabei spielt es keine Rolle, ob du Kinder hast oder nicht.", "explain": "Soma pregunta si su empresa puede obligarla a acudir en sábado teniendo hijos pequeños. Alex (e) responde directamente que el sábado es día laborable («Werktag») y el empleador puede ordenar trabajar en él con independencia de las cargas familiares."}, {"n": 11, "type": "choice", "prompt": "Reinhold: Ich arbeite seit zwölf Jahren 20 Stunden die Woche und würde jetzt gerne, weil die Kinder aus dem Haus sind, meine Arbeitszeit aufstocken und wieder Vollzeit arbeiten. Habe ich ein Recht darauf ?", "answer": "d", "confidence": "hoch", "quote": "Soviel ich weiß, hast du also keinen Anspruch, in die Vollzeit zurückzukehren. Sprich doch einfach mal mit deinem Chef.", "explain": "Reinhold lleva doce años a media jornada y pregunta si tiene derecho legal a pasar a jornada completa. Ratna (d) le aclara que la nueva regulación de jornada reducida temporal no opera con carácter retroactivo para su caso antiguo, por lo que no existe ese derecho automático."}, {"n": 12, "type": "choice", "prompt": "Mandy: Seit zwei Jahren arbeite ich Vollzeit in einem Unternehmen und dieser Job macht mir auch viel Spaß. Aus familiären Gründen würde ich gerne eine dreijährige Auszeit nehmen. Ich überlege, ob ich mir das finanziell leisten kann.", "answer": "c", "confidence": "hoch", "quote": "Man muss sich das aber genau überlegen, da man nicht nur kurz- oder mittelfristig weniger verdient, sondern auch weniger Rentenansprüche hat.", "explain": "Mandy evalúa una pausa de tres años o reducción laboral por motivos familiares y duda del impacto económico. Angela (c) explica el derecho a reducir jornada pero advierte del impacto en los ingresos y especialmente en la reducción de las futuras pensiones de jubilación («weniger Rentenansprüche»)."}, {"n": 13, "type": "choice", "prompt": "Nici: Ich bekomme jetzt das zweite Kind und werde danach wahrscheinlich erst mal Teilzeit arbeiten. Jetzt habe ich ziemlich große Angst, dass ich in meiner Karriere den Anschluss verpasse. Soll ich vielleicht doch so schnell wie möglich wieder Vollzeit arbeiten?", "answer": "a", "confidence": "hoch", "quote": "In meinen Augen ist Familie das Wichtigste auf der Welt. Es ist doch auch ein Gewinn, wenn man mehr Zeit mit seinen Kindern verbringen kann und weniger gestresst ist. Ich würde mich auf jeden Fall für Teilzeit entscheiden.", "explain": "Nici duda entre optar por la jornada reducida tras su segundo hijo o volver rápido a jornada completa por miedo a frenar su carrera. Thilo (a) le aconseja priorizar a la familia y decantarse sin dudar por el tiempo parcial («Ich würde mich auf jeden Fall für Teilzeit entscheiden»)."}]}, {"id": "t3_b-p37", "label": "Variante 4 (Urlaub und Dienstplan)", "page": 37, "note": "Foro sobre días de vacaciones legales, turnos de trabajo imprevistos, anulación de vacaciones concedidas y trabajo en fin de semana durante prácticas.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Cécile, vor 3 Stunden", "text": "Leider muss ich dich enttäuschen. Die Regelung ist gesetzeskonform. Das Minimum liegt sogar nur bei 20 Tagen. Sei froh, dass du mehr hast. Bei manchen Arbeitgebern erhöht sich der Urlaubsanspruch mit längerer Firmenzugehörigkeit.", "distractor": ""}, {"key": "b", "title": "Limit, vor 5 Stunden", "text": "Meines Wissens gibt es keine gesetzliche Regelung dafür, aber sprich doch einfach mal mit eurem Chef. Dem ist vielleicht gar nicht klar, dass du das nicht so toll findest, wenn du immer erst so kurz vorher weißt, an welchen Tagen du arbeiten musst und wann du frei hast.", "distractor": ""}, {"key": "c", "title": "Susanne, vor 3 Stunden", "text": "Urlaub muss immer rechtzeitig beantragt werden, aber der Arbeitgeber ist nicht unbedingt verpflichtet, ihn zu gewähren. Wann Urlaub genommen werden darf, entscheidet der Chef. Aufgrund dringender betrieblicher Gründe kann ein Urlaubsantrag auch abgelehnt werden.", "distractor": "Trata de la solicitud inicial de vacaciones y la posibilidad patronal de denegarla por motivos de servicio; no responde al caso de Hans, cuyas vacaciones ya estaban aprobadas formalmente."}, {"key": "d", "title": "Nico, vor 30 Minuten", "text": "Schau doch mal in deinen Arbeitsvertrag, da ist das sicher geregelt. Soviel ich weiß, gibt es keine gesetzlichen Einschränkungen für angestellte Arbeitnehmer. Allerdings darfst du keine sieben Tage am Stück arbeiten. Der Samstag gilt in Deutschland als normalen Wochentag.", "distractor": ""}, {"key": "e", "title": "Greta, vor 2 Stunden", "text": "Ich arbeite auch im Einzelhandel und bei uns ist es so geregelt, dass man einen festen Wochentag freibekommt, wenn man immer samstags arbeitet. Das kommt mir entgegen. So kann ich entspannt unter der Woche einkaufen oder ins Schwimmbad gehen.", "distractor": "Comenta su experiencia personal librando entre semana en el comercio, pero no responde a si es legal exigir turnos sin antelación o trabajar en sábado."}, {"key": "f", "title": "Michele, vor 6 Stunden", "text": "Das kann dein Chef nicht einfach so machen. Personelle Engpässe reichen für den Widerruf eines Urlaubsantrags nicht aus. Wenn du deinen Urlaub tatsächlich nicht antrittst, muss der Arbeitgeber alle Kosten tragen, die dir durch die Urlaubsverschiebung entstehen.", "distractor": ""}], "items": [{"n": 10, "type": "choice", "prompt": "Thia: Voll gemein, ich habe nur 25 Urlaubstage! Mein Freund hat hingegen 30 Tage im Jahr. Ich frage mich, ob mir nicht auch mehr Tage zustehen. Kennt sich von euch da jemand aus?", "answer": "a", "confidence": "hoch", "quote": "Leider muss ich dich enttäuschen. Die Regelung ist gesetzeskonform. Das Minimum liegt sogar nur bei 20 Tagen. Sei froh, dass du mehr hast.", "explain": "Thia se queja de tener solo 25 días de vacaciones. Cécile (a) le aclara que 25 días se ajusta plenamente a la ley, ya que el mínimo legal en Alemania es de 20 días laborables para jornadas de 5 días."}, {"n": 11, "type": "choice", "prompt": "Marilena: Ich arbeite im Einzelhandel und bei uns gilt jede Woche ein anderer Dienstplan. Wir bekommen den Plan immer erst am Ende der Vorwoche und deshalb können wir unsere Freizeit natürlich auch nicht richtig planen. Ist das erlaubt?", "answer": "b", "confidence": "hoch", "quote": "Meines Wissens gibt es keine gesetzliche Regelung dafür, aber sprich doch einfach mal mit eurem Chef. Dem ist vielleicht gar nicht klar, dass du das nicht so toll findest, wenn du immer erst so kurz vorher weißt, an welchen Tagen du arbeiten musst", "explain": "Marilena recibe el cuadrante horario a finales de la semana previa impidiéndole organizar su vida personal. Limit (b) le comenta la ausencia de una regulación rígida y le aconseja hablar con el jefe para comunicarle el problema de los avisos con tan poco margen."}, {"n": 12, "type": "choice", "prompt": "Hans: Ich habe nach der Genehmigung meines Urlaubs diesen gebucht und jetzt hat mein Chef gemerkt, dass ein anderer Kollege schon vorher zur selben Zeit Urlaub eingereicht hat. Jetzt will er mir meinen wieder streichen. Darf er das?", "answer": "f", "confidence": "hoch", "quote": "Das kann dein Chef nicht einfach so machen. Personelle Engpässe reichen für den Widerruf eines Urlaubsantrags nicht aus.", "explain": "Hans ya tenía sus vacaciones autorizadas y contratadas y el jefe pretende cancelárselas. Michele (f) le confirma que una empresa no puede anular unilateralmente unas vacaciones ya concedidas por falta de personal y que debería asumir los costes derivados."}, {"n": 13, "type": "choice", "prompt": "Lisa: Ich mache zurzeit ein Pflichtpraktikum in einem Unternehmen und arbeite von Montag bis Freitag acht Stunden täglich. Jetzt soll ich nächsten Samstag auch noch kommen. Bin ich dazu verpflichtet? Ich fühle mich ein bisschen ausgenutzt!", "answer": "d", "confidence": "hoch", "quote": "Allerdings darfst du keine sieben Tage am Stück arbeiten. Der Samstag gilt in Deutschland als normalen Wochentag.", "explain": "Lisa hace prácticas de lunes a viernes (8h/día) y le ordenan trabajar el sábado. Nico (d) explica que el sábado es día laborable ordinario («Werktag»), pero recuerda el límite legal de que no se pueden encadenar siete días consecutivos sin descanso."}]}, {"id": "t3_c-p38", "label": "Lesen Teil 3 (вариант №5)", "page": 38, "note": "Aviso del original: el comentario b aparece dos veces en la página — como «b) Thilo, vor 45 Minuten» y, marcado como «Новый вариант», como «b) Mallory, vor 45 Minuten» (Zug / Deutsche Bahn, taxi o noche de hotel). Se reproduce la versión impresa b) Thilo. La respuesta del ítem 12 es b en LAS DOS versiones, por lo que el aviso no altera la clave. La versión «nueva» reaparece con el nombre Mallory en la p. 39.", "kind": "zuordnung", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Hans, vor 2 Stunden", "text": "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat. Aber nur, wenn das ohne zu großen Aufwand geht. Wenn ein Unternehmen in der Innenstadt ist, gibt es einfach nicht genug Platz für ihre Parkmöglichkeiten.", "distractor": ""}, {"key": "b", "title": "Thilo, vor 45 Minuten", "text": "Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen. Du kannst auf der Webseite der Deutschen Bahn nachlesen, unter welchen Umständen die Bahn deine Weiterfahrt bezahlt.", "distractor": ""}, {"key": "c", "title": "Johannes, vor 3 Stunden", "text": "Wenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden. Sachschäden sind dabei nicht inbegriffen. Du kannst aber grundsätzlich selbst entscheiden, welches Fahrzeug du für den Arbeitsweg benutzt.", "distractor": ""}, {"key": "d", "title": "Jacqueline, vor 30 Minuten", "text": "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts für deine Verspätung kannst.", "distractor": ""}, {"key": "e", "title": "Andreij, vor 4 Stunden", "text": "Natürlich hast du an deinem Arbeitsplatz Versicherungsschutz, aber dieser gilt nicht in allen Teilen des Gebäudes. Auf der Toilette bist du zum Beispiel nicht versichert. Warum das so ist, weiß ich aber auch nicht.", "distractor": "No encaja con ninguna de las cuatro consultas. Habla del seguro DENTRO del lugar de trabajo (la toaleta no está cubierta), no del seguro en el trayecto. Es el distractor temático de la consulta 10 (Mikke, «Bin ich denn jetzt versichert?»), que pregunta por el accidente de camino al trabajo; también puede confundir a quien busque cualquier mención a «Versicherung»."}, {"key": "f", "title": "Alex, vor 45 Minuten", "text": "Als Arbeitnehmer musst du dafür sorgen, zum Job zu kommen. Wenn das nicht geht, darfst du aber keine Abmahnung bekommen. Ob du ein Taxi nehmen musst, kommt darauf an, ob die Kosten dafür über deinem Arbeitslohn für einen Tag liegen. Wenn ja, sind diese Kosten für dich nicht zumutbar.", "distractor": "Distractor mixto: mezcla el apercibimiento (consulta 11, Ludmilla), el taxi (consulta 12, Peter) y el deber de llegar al trabajo (consulta 13, Ingo), pero no responde de forma específica a ninguno. Con la consulta 12 se confunde porque también habla de coger un taxi; con la 13, porque también trata de la obligación de acudir al puesto de trabajo. Ninguno de los cuatro casos es el suyo."}], "items": [{"n": 10, "type": "choice", "prompt": "Mikke: Heute hatte ich auf dem Weg zur Arbeit einen Unfall. Ich habe noch einen Umweg über die Kita gemacht, bin gestolpert und habe mir den Knöchel gebrochen. Bin ich denn jetzt versichert? Ich habe ja nicht den direkten Weg zur Arbeit genommen.", "answer": "c", "confidence": "mittel", "quote": "Wenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden.", "explain": "Mikke pregunta si sigue cubierto por el seguro tras lesionarse de camino al trabajo haciendo un rodeo. c es el único comentario que trata el seguro de accidentes («Unfallversicherung») precisamente «auf dem Weg zur Arbeit» y añade que uno puede decidir libremente qué vehículo usa para el trayecto, es decir, que la ruta elegida no anula la cobertura. Confianza media porque el comentario no menciona el desvío ni una caída, sino un accidente de tráfico; e (seguro solo dentro del edificio) es la trampa temática."}, {"n": 11, "type": "choice", "prompt": "Ludmilla: Ich habe eine Abmahnung bekommen, weil ich regelmäßig zu spät zur Arbeit komme. Ich fahre immer rechtzeitig von zu Hause weg und finde dann bei der Firma keine Parkmöglichkeit. Muss der Arbeitgeber nicht eigentlich seinen Mitarbeitern einen Parkplatz stellen?", "answer": "a", "confidence": "hoch", "quote": "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat. Aber nur, wenn das ohne zu großen Aufwand geht.", "explain": "Ludmilla recibe un apercibimiento por llegar tarde porque no encuentra aparcamiento y pregunta si la empresa debe facilitarlo. a responde exactamente a eso: el deber de cuidado del empresario incluye crear plazas para los vehículos de los empleados, aunque solo si no supone un gasto desproporcionado. f también menciona el apercibimiento, pero responde sobre el taxi y el deber de acudir al trabajo, no sobre el aparcamiento."}, {"n": 12, "type": "choice", "prompt": "Peter: Ich wollte heute Morgen mit der S-Bahn zur Arbeit fahren, aber diese ist wegen des Unwetters ausgefallen. So hatte ich keine Möglichkeit, ins Büro zu kommen, da ich kein Auto habe. Hätte ich ein Taxi nehmen müssen?", "answer": "b", "confidence": "hoch", "quote": "Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen.", "explain": "Peter no pudo ir a la oficina porque la S-Bahn no circuló a causa del temporal y pregunta si debería haber tomado un taxi. b trata justamente el caso de la «Bahn» que no puede continuar por una tormenta y el derecho de los viajeros a un bono de taxi y al reembolso del trayecto. f también habla de tomar un taxi, pero lo hace como distractor: mezcla el apercibimiento y el deber general de acudir al trabajo."}, {"n": 13, "type": "choice", "prompt": "Ingo: Immer das Gleiche. Der Bus kommt zu spät, steht im Stau oder fällt aus. Jetzt habe ich Ärger mit meinem Chef, weil ich öfter mit Verspätung im Büro erscheine. Bin ich verpflichtet, immer einen früheren Bus zu nehmen, damit ich pünktlich bin?", "answer": "d", "confidence": "hoch", "quote": "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts für deine Verspätung kannst.", "explain": "Ingo llega tarde por culpa del autobús y pregunta si está obligado a coger uno anterior. d contesta de forma directa: cada uno es responsable de llegar puntual y no puede echar la culpa al transporte público, así que la elección del autobús es cosa suya. La mención del autobús y de la responsabilidad del trabajador excluye a los demás comentarios."}]}, {"id": "t3_c-p39", "label": "Lesen Teil 3 (вариант №5) (новые имена и очередь)", "page": 39, "note": "Nueva versión de la variante de la p. 38: mismos cuatro casos y mismos seis comentarios, pero con otros nombres y en otro orden. Al cambiar el orden de los posteos, cambian también las respuestas: 10 a / 11 b / 12 d / 13 c, frente a 10 c / 11 a / 12 b / 13 d en la p. 38. El comentario b) Mallory retoma el texto del «Новый вариант» anunciado en la p. 38.", "kind": "zuordnung", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Enric, vor 2 Stunden", "text": "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat, aber nur, wenn das ohne zu großen Aufwand geht. Wenn ein Unternehmen in der Innenstadt ist, gibt es einfach nicht genug Platz für ihre Parkmöglichkeiten.", "distractor": ""}, {"key": "b", "title": "Mallory, vor 45 Minuten", "text": "Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen. Du kannst auf der Webseite der Deutschen Bahn nachlesen, unter welchen Umständen die Bahn deine Weiterfahrt bezahlt.", "distractor": ""}, {"key": "c", "title": "Mao, vor 3 Stunden", "text": "Wenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden. Sachschäden sind dabei nicht inbegriffen. Du kannst aber grundsätzlich selbst entscheiden, welches Fahrzeug du für den Arbeitsweg benutzt.", "distractor": ""}, {"key": "d", "title": "Nastasia, vor 30 Minuten", "text": "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts für deine Verspätung kannst.", "distractor": ""}, {"key": "e", "title": "Bartomeu, vor 4 Stunden", "text": "Natürlich hast du an deinem Arbeitsplatz Versicherungsschutz, aber dieser gilt nicht in allen Teilen des Gebäudes. Auf der Toilette bist du zum Beispiel nicht versichert. Warum das so ist, weiß ich aber auch nicht.", "distractor": "No encaja con ninguna de las cuatro consultas: trata del seguro dentro del edificio (la toaleta no está cubierta), no del seguro en el trayecto. Es el distractor temático de la consulta 13 (Karel, «Bin ich denn jetzt versichert?»), en la que se pregunta por un accidente de camino al trabajo."}, {"key": "f", "title": "Sterre, vor 45 Minuten", "text": "Als Arbeitnehmer musst du dafür sorgen, zum Job zu kommen. Wenn das nicht geht, darfst du aber keine Abmahnung bekommen. Ob du ein Taxi nehmen musst, kommt darauf an, ob die Kosten dafür über deinem Arbeitslohn für einen Tag liegen und diese Kosten für dich nicht zumutbar sind.", "distractor": "Distractor mixto: mezcla el apercibimiento (consulta 10, Natalie), el taxi (consulta 11, Batiste) y el deber de llegar al trabajo (consulta 12, Alfons), sin responder de forma específica a ninguno. Se confunde con la 11 por la mención del taxi y con la 10 por la «Abmahnung»."}], "items": [{"n": 10, "type": "choice", "prompt": "Natalie: Ich habe eine Abmahnung bekommen, weil ich regelmäßig zu spät zur Arbeit komme. Ich fahre immer rechtzeitig von zu Hause weg und finde dann bei der Firma keine Parkmöglichkeit. Muss der Arbeitgeber nicht eigentlich seinen Mitarbeitern einen Parkplatz stellen?", "answer": "a", "confidence": "hoch", "quote": "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat, aber nur, wenn das ohne zu großen Aufwand geht.", "explain": "Natalie recibe un apercibimiento por llegar tarde porque no encuentra aparcamiento y pregunta si la empresa debe facilitarlo. a responde exactamente a eso: el deber de cuidado incluye crear plazas para los vehículos de los empleados, aunque solo si no supone un gasto desproporcionado. f también menciona la «Abmahnung», pero responde sobre el taxi, no sobre el aparcamiento."}, {"n": 11, "type": "choice", "prompt": "Batiste: Ich wollte heute Morgen mit der S-Bahn zur Arbeit fahren, aber diese ist wegen des Unwetters ausgefallen. So hatte ich keine Möglichkeit, ins Büro zu kommen. Da ich kein Auto habe, hätte ich ein Taxi nehmen müssen?", "answer": "b", "confidence": "hoch", "quote": "Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen.", "explain": "Batiste no pudo ir a la oficina porque la S-Bahn no circuló por el temporal y pregunta si debería haber tomado un taxi. b trata justamente el caso de la «Bahn» que no puede continuar por una tormenta y el derecho a un bono de taxi y al reembolso del trayecto. f (también sobre el taxi) es el distractor: mezcla apercibimiento y deber general de acudir al trabajo."}, {"n": 12, "type": "choice", "prompt": "Alfons: Immer das Gleiche. Der Bus kommt zu spät, steht im Stau oder fällt aus. Jetzt habe ich Ärger mit meinem Chef, weil ich öfter mit Verspätung im Büro erscheine. Bin ich verpflichtet, immer einen früheren Bus zu nehmen, damit ich pünktlich bin?", "answer": "d", "confidence": "hoch", "quote": "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts für deine Verspätung kannst.", "explain": "Alfons llega tarde por culpa del autobús y pregunta si está obligado a coger uno anterior. d contesta de forma directa: uno mismo es responsable de llegar puntual y no puede culpar al transporte público, de modo que la elección del autobús es asunto suyo. Coincide con la situación de Alfons (bus, atasco, retraso)."}, {"n": 13, "type": "choice", "prompt": "Karel: Heute hatte ich auf dem Weg zur Arbeit einen Unfall. Ich habe noch einen Umweg über die Kita gemacht, bin gestolpert und habe mir den Knöchel gebrochen. Bin ich denn jetzt versichert? Ich habe ja nicht den direkten Weg zur Arbeit genommen.", "answer": "c", "confidence": "mittel", "quote": "Wenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden.", "explain": "Karel pregunta si sigue cubierto por el seguro tras lesionarse de camino al trabajo haciendo un rodeo. c es el único comentario que trata el seguro de accidentes «auf dem Weg zur Arbeit» y añade que uno decide libremente qué vehículo usa para el trayecto. Confianza media porque no menciona el desvío ni una caída, sino un accidente de tráfico; e (seguro solo dentro del edificio) es la trampa temática."}]}, {"id": "t3_d-p40", "label": "Variante 6 (Arbeitszeit, Kleidung und Reise)", "page": 40, "note": "Foro sobre tiempo de cambio de vestimenta (Umkleidezeit), viajes de trabajo en tren y asistencia a cursos de formación voluntaria.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Andres, vor 8 Minuten", "text": "Wenn du in Sportkleidung in die Firma kommst und dich dort noch umziehst, ist das Privatsache. Du musst dafür sorgen, dass du pünktlich mit deiner Arbeit beginnen kannst. In diesem Fall ist die Umkleidezeit keine Arbeitszeit.", "distractor": ""}, {"key": "b", "title": "Paula, vor 3 Stunden", "text": "Der Weg zur Arbeit ist private Zeit. Du trägst die Verantwortung dafür, pünktlich vor Ort zu sein, egal wie weit dein Weg ist. Wenn du z.B. im Stau stehst oder die- S-Bahn streikt und du deshalb zu spät kommst, musst du die Zeit nacharbeiten.", "distractor": "Trata sobre atascos y retrasos en el trayecto de casa al trabajo (Wegezeit), pero no sobre si el tiempo de viaje a un cliente cuenta como horas extra ni sobre ropa de trabajo."}, {"key": "c", "title": "Raimund, vor 6 Stunden", "text": "Arbeitnehmer/innen haben in der Regel alle zwei Jahre Anspruch auf fünf Tage Bildungsurlaub. Die Gesetze sind aber nicht in jedem Bundesland gleich. So variiert zum Beispiel die Anzahl der Tage für Bildungsurlaub je nachdem, ob du Voll- oder Teilzeit tätig bist.", "distractor": "Explica la regulación del permiso de formación remunerado (Bildungsurlaub) por comunidades autónomas, pero Cristof acudió en fin de semana sin solicitarlo previamente."}, {"key": "d", "title": "Hubert, vor 38 Minuten", "text": "Ich finde das Tragen von Dienstkleidung absolut veraltet. Warum müssen alle im Unternehmen gleich gekleidet sein? Jeder Mensch hat doch seinen eigenen Stil, mit dem er sich wohlfühlt. Ich kann verstehen, dass du die Uniform nicht auch noch im Zug tragen möchtest.", "distractor": ""}, {"key": "e", "title": "Yvonne, vor 7 Stunden", "text": "Wenn du selbst entscheidest, eine Fortbildung zu besuchen, und das vorher nicht mit deinem Arbeitgeber absprichst, ist das reines Privatvergnügen. Schickt dein Chef dich allerdings seinerseits auf ein Seminar , handelt es sich um Arbeitszeit.", "distractor": ""}, {"key": "f", "title": "Winfried, vor 25 Minuten", "text": "Das ist ein schwieriges Thema. Wenn du während der Reise zum Beispiel deinen Termin vorbereitest oder mit dem Laptop ein Protokoll schreibst, ist das Arbeitszeit. Wenn du dich aber mit privaten Dingen wie einem Roman oder einem privaten Telefonat beschäftigst, gilt das als Freizeit.", "distractor": ""}], "items": [{"n": 10, "type": "choice", "prompt": "Claudia: Ich muss während der Arbeit eine Uniform tragen. Mir ist es unangenehm, die schon morgens in der Bahn anzuhaben, und ich möchte mich lieber im Hotel umziehen. Muss ich dafür früher kommen oder gilt die Umkleidezeit als Arbeitszeit?", "answer": "d", "confidence": "hoch", "quote": "Ich kann verstehen, dass du die Uniform nicht auch noch im Zug tragen möchtest.", "explain": "Claudia debe llevar uniforme de trabajo pero le incomoda ponérselo en el tren («in der Bahn anzuhaben») y prefiere cambiarse en el hotel. Hubert (d) responde directamente a su situación empatizando con su rechazo a lucir el uniforme en el transporte público («dass du die Uniform nicht auch noch im Zug tragen möchtest»)."}, {"n": 11, "type": "choice", "prompt": "Maisel: Gestern war ich für einen Tag bei einem Kunden in Norddeutschland. Ich bin mit dem Zug gefahren und habe während der Fahrt gelesen. Insgesamt war ich elf Stunden unterwegs und habe Überstunden geltend gemacht. Die will mein Arbeitgeber nicht anerkennen.", "answer": "f", "confidence": "hoch", "quote": "Wenn du dich aber mit privaten Dingen wie einem Roman oder einem privaten Telefonat beschäftigst, gilt das als Freizeit.", "explain": "Maisel viajó 11 horas en tren a ver a un cliente y estuvo leyendo por placer durante el trayecto, reclamando horas extras. Winfried (f) explica que si durante el viaje en tren realizas actividades privadas (como leer una novela), ese tiempo computa como tiempo libre y no como jornada laboral."}, {"n": 12, "type": "choice", "prompt": "Cristof: Ich war am Wochenende auf einer Fortbildung, die für meine Arbeit relevant war. Ich wollte mir jetzt einen Urlaubstag gutschreiben lassen, aber meine Chefin sagt, das sei meine private Angelegenheit, da sie die Fortbildung nicht angeordnet hat. Stimmt das?", "answer": "e", "confidence": "hoch", "quote": "Wenn du selbst entscheidest, eine Fortbildung zu besuchen, und das vorher nicht mit deinem Arbeitgeber absprichst, ist das reines Privatvergnügen.", "explain": "Cristof asistió por propia iniciativa en fin de semana a una formación y pretende compensarla con un día libre. Yvonne (e) confirma la postura de la jefa: los cursos decididos unilateralmente por el trabajador sin orden ni acuerdo previo con la empresa son de índole puramente privada."}, {"n": 13, "type": "choice", "prompt": "Samira: Ich fahre morgens mit dem Fahrrad in die Firma, bin immer pünktlich um 9.00 Uhr da und mache mich dann fertig. Ab sofort soll ich früher kommen und darf mich nicht mehr während der Arbeitszeit umziehen. Ist das korrekt?", "answer": "a", "confidence": "hoch", "quote": "In diesem Fall ist die Umkleidezeit keine Arbeitszeit.", "explain": "Samira llega en bicicleta y se cambia tras fichar a las 9:00. Andres (a) aclara que cambiarse de ropa deportiva por elección personal de transporte no computa como tiempo de trabajo («die Umkleidezeit keine Arbeitszeit»), por lo que debe llegar cambiada antes del inicio de su turno."}]}, {"id": "t3_d-p41", "label": "Variante 7 (Rente und Altersvorsorge)", "page": 41, "note": "Foro sobre edad de jubilación (67 vs 65 años), coeficientes reductores por jubilación anticipada, lagunas por crianza de hijos y planes de pensiones de empresa.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Stefan, vor 4 Stunden", "text": "Kaum jemandem gelingt es, 45 Jahre durchgehend so ein hohes Gehalt zu verdienen, dass er später die Höchstrente bekommt Das liegt schon allein daran, dass man während der Ausbildung und in den ersten Berufsjahren weniger verdient.", "distractor": "Comenta la dificultad de alcanzar la pensión máxima por cotizaciones salariales en los primeros años laborales; no responde a dudas de jubilación anticipada ni previsión juvenil."}, {"key": "b", "title": "Jana, vor 34 Minuten", "text": "Auch Firmen helfen, für die Zukunft vorzusorgen, denn man kann gar nicht früh genug damit anfangen. Erkundige dich bei deinem Arbeitgeber, ob eine betriebliche Altersvorsorge angeboten wird. Wenn man dann später Rentner ist, bekommt man eine zusätzliche Rente.", "distractor": ""}, {"key": "c", "title": "Antje, vor 7 Stunden", "text": "Wenn man mindestens fünf Jahre versicherungspflichtig beschäftigt war, hat man Anspruch auf die gesetzliche Rente. Dabei spielt es keine Rolle, ob man Teilzeit oder Vollzeit gearbeitet hat. Es gibt aber noch Unterschiede zwischen Ost und West.", "distractor": ""}, {"key": "d", "title": "Jonas, vor 2 Stunden", "text": "Man hat das Recht, früher als mit 67 Jahren in Rente zu gehen, aber man muss Abschläge in Kauf nehmen. Im Moment sind das für jeden Monat, den man weniger arbeitet, 0,3 Prozent weniger. Man muss sich das genau ausrechnen, ob man sich das leisten kann.", "distractor": ""}, {"key": "e", "title": "Jörg, vor 5 Stunden", "text": "Für alle, die nach 1964 geboren sind, gilt dass sie bis 67 Jahre arbeiten müssen. Außer, wenn man mit 65 schon 45 Beitragsjahre nachweisen kann, also Jahre, in denen man in die Rentenversicherung eingezahlt hat.", "distractor": ""}, {"key": "f", "title": "Lia, vor 12 Stunden", "text": "Wenn man jung ist, sollte man sein Leben doch erst einmal genießen. Über Alter und Krankheit kann man sich immer noch Gedanken machen. Wer weiß, ob es später, wenn wir so weit sind, überhaupt noch eine Rente geben wird.", "distractor": "Recomienda no pensar en la pensión de joven y vivir el presente; es una postura vital sin carácter de asesoramiento concreto."}], "items": [{"n": 10, "type": "choice", "prompt": "Torsten: Wir hatten neulich im Büro eine Diskussion darüber, ab wann man in Rente gehen kann. Ich dachte immer, man muss bis 67 arbeiten. Aber meine Kollegin meinte, dass sie zwei Jahre früher in Rente gehen wird. Geht das überhaupt?", "answer": "e", "confidence": "hoch", "quote": "Für alle, die nach 1964 geboren sind, gilt dass sie bis 67 Jahre arbeiten müssen. Außer, wenn man mit 65 schon 45 Beitragsjahre nachweisen kann", "explain": "Torsten pregunta si es posible jubilarse dos años antes de la edad ordinaria de 67 (a los 65). Jörg (e) confirma la excepción legal para quienes acrediten 45 años cotizados."}, {"n": 11, "type": "choice", "prompt": "Hella: Meine Rente wird ja nicht so berauschend sein, vor allem, weil ich wegen meiner zwei Kinder einige Jahre nicht oder nur Teilzeit gearbeitet habe. Es ist ja wohl schon so, dass ich dafür jetzt irgendwie bestraft werde, oder?", "answer": "c", "confidence": "hoch", "quote": "Dabei spielt es keine Rolle, ob man Teilzeit oder Vollzeit gearbeitet hat.", "explain": "Hella teme verse penalizada por haber trabajado a tiempo parcial por el cuidado de sus hijos. Antje (c) le aclara los requisitos básicos de acceso a la pensión pública y señala que el derecho existe independientemente de si se ha trabajado a jornada completa o parcial."}, {"n": 12, "type": "choice", "prompt": "Petra: Mein Mann geht in zwei Jahren in Rente. Ich müsste noch vier Jahre arbeiten. Wir haben uns überlegt, dass wir zusammen in Rente gehen und noch viele gemeinsame Jahre mit verschiedenen Aktivitäten erleben wollen. Welche Folgen hätte das?", "answer": "d", "confidence": "hoch", "quote": "Man hat das Recht, früher als mit 67 Jahren in Rente zu gehen, aber man muss Abschläge in Kauf nehmen. Im Moment sind das für jeden Monat, den man weniger arbeitet, 0,3 Prozent weniger.", "explain": "Petra pregunta qué consecuencias tendría adelantar su jubilación dos años para retirarse a la vez que su marido. Jonas (d) responde detallando las penalizaciones económicas (Abschläge): una reducción del 0,3 % por cada mes de adelanto."}, {"n": 13, "type": "choice", "prompt": "Leni: Ich bin ja noch jung und denke überhaupt noch nicht an die Rente. Aber es wird ja immer wieder gesagt, dass die normale Rente irgendwann nicht mehr ausreichen wird. Was kann ich denn jetzt schon für später tun?", "answer": "b", "confidence": "hoch", "quote": "Erkundige dich bei deinem Arbeitgeber, ob eine betriebliche Altersvorsorge angeboten wird. Wenn man dann später Rentner ist, bekommt man eine zusätzliche Rente.", "explain": "Leni es joven y quiere saber qué pasos dar ya para complementar su pensión futura. Jana (b) le aconseja interesarse por los planes de pensiones de empresa (betriebliche Altersvorsorge) para obtener ingresos adicionales al jubilarse."}]}, {"id": "t3_d-p42", "label": "Variante 8 (Elternzeit und Schwangerschaft)", "page": 42, "note": "Foro sobre duración del permiso parental (Elternzeit: 14 meses de Elterngeld vs 3 años de excedencia), trabajo nocturno en embarazadas, retraso del permiso tras la formación y compatibilidad con trabajo a tiempo parcial.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Mario, vor 10 Stunden", "text": "Warte erst einmal ab, wie sich alles mit dem Kind entwickelt. Ich würde die Zeit nach der Geburt nicht mit Arbeit verplanen. Es ist nämlich eine große Umstellung. Wenn du dann später „Langeweile“ haben solltest, kannst du immer noch überlegen, arbeiten zu gehen.", "distractor": "Aconseja no planificar trabajo de antemano tras el parto; no resuelve las dudas sobre límites legales de jornada ni compatibilidades."}, {"key": "b", "title": "Johann, vor 20 Minuten", "text": "Beides ist nicht ganz falsch - nach der Geburt des Kindes hat man bis zu drei Jahre Anspruch auf Freistellung von der Arbeit. 14 Monate erhält das Paar Elterngeld. Sowohl die bezahlte als auch die nicht bezahlte Zeit der Betreuung können die Eltern frei untereinander aufteilen.", "distractor": ""}, {"key": "c", "title": "Hanna, vor 30 Minuten", "text": "Elterngeld erhält man von der Elterngeldstelle. Die Höhe hängt davon ab, wie viel man vorher verdient hat. Vater und Mutter können die bezahlte Elternzeit von 14 Monaten untereinander aufteilen, wie es ihnen am besten passt. Allerdings ist die Frau die ersten acht Wochen im Mutterschutz.", "distractor": ""}, {"key": "d", "title": "Angela, vor 8 Stunden", "text": "Wenn du schon länger als sechs Monate bei einer Firma beschäftigt bist, kannst du beantragen, auch während der Elternzeit ein bisschen zu arbeiten. Du darfst dann allerdings nicht mehr als 30 Stunden pro Woche tätig sein. Der Betrieb kann den Antrag aber auch ablehnen.", "distractor": ""}, {"key": "e", "title": "Lars, vor 3 Stunden", "text": "Wenn eine Frau schwanger ist, kann sie, soweit es der Gesundheitszustand zulässt, bis sechs Wochen vor der Geburt arbeiten. Dann beginnt der Mutterschutz. Dieser gilt auch noch für acht Wochen nach der Geburt. Im Anschluss folgt die Elternzeit. Aber dafür gibt es wieder andere Regelungen.", "distractor": "Trata sobre los plazos del Mutterschutz antes y después del parto (6 y 8 semanas); es distractor de la consulta de Katrin sobre turnos de tarde."}, {"key": "f", "title": "Petra, vor 5 Stunden", "text": "Während der Schwangerschaft darf ein Arbeitgeber die Mitarbeiterin nicht nach 22 Uhr beschäftigen. Zwischen 20 und 22 Uhr kann man als Schwangere nur auf eigenen Wunsch arbeiten, der Arbeitgeber darf das nicht anordnen. Insgesamt darf eine Schwangere aber eine tägliche Arbeitszeit von 8,5 Stunden nicht überschreiten.", "distractor": ""}], "items": [{"n": 10, "type": "choice", "prompt": "Natalja: Wir werden Eltern und wollen beide die bezahlte Elternzeit nehmen. Eine Freundin meinte, dass wir insgesamt ein Jahr zu Hause bleiben können. Ein anderer Bekannter sagte, man könne sein Kind bis zu drei Jahre zu Hause betreuen. Was stimmt?", "answer": "b", "confidence": "hoch", "quote": "Beides ist nicht ganz falsch - nach der Geburt des Kindes hat man bis zu drei Jahre Anspruch auf Freistellung von der Arbeit. 14 Monate erhält das Paar Elterngeld.", "explain": "Natalja duda entre las dos versiones que ha escuchado (1 año pagado vs 3 años en casa). Johann (b) responde expresamente que ambas afirmaciones son ciertas: existe derecho a excedencia por cuidado (Freistellung) de hasta tres años, pero la prestación económica (Elterngeld) cubre un máximo de 14 meses remunerados."}, {"n": 11, "type": "choice", "prompt": "Katrin: Ich bin im vierten Monat schwanger. Mein Chef will, dass ich notfalls auch mal eine Spätschicht übernehme. Die geht bis 21:00 Uhr. Soviel ich weiß, ist das gar nicht erlaubt, oder? Außerdem bin ich abends immer sehr müde.", "answer": "f", "confidence": "hoch", "quote": "Zwischen 20 und 22 Uhr kann man als Schwangere nur auf eigenen Wunsch arbeiten, der Arbeitgeber darf das nicht anordnen.", "explain": "Katrin está embarazada y su jefe quiere obligarla a hacer turnos de tarde hasta las 21:00. Petra (f) aclara la normativa de protección de la maternidad (Mutterschutzgesetz): entre las 20:00 y las 22:00 la trabajadora solo puede laborar voluntariamente si ella lo solicita, pero el empresario no puede imponérselo."}, {"n": 12, "type": "choice", "prompt": "Giovanni: Wir sind Auszubildende und bekommen bald ein Kind. Erst nach der Ausbildung wollen wir in Elternzeit gehen. Bis dahin könnte die Oma auf unser Kind aufpassen. Unser Betrieb wäre einverstanden. Weiß jemand, ob man die Elternzeit später beginnen darf?", "answer": "c", "confidence": "mittel", "quote": "Vater und Mutter können die bezahlte Elternzeit von 14 Monaten untereinander aufteilen, wie es ihnen am besten passt.", "explain": "Giovanni y su pareja son aprendices y quieren diferir el permiso parental hasta completar la formación. Hanna (c) señala que los padres pueden distribuir los periodos de baja parental como mejor les convenga. Se califica con confianza media porque ningún comentario aborda expresamente la postergación hasta después del examen de formación profesional."}, {"n": 13, "type": "choice", "prompt": "Sandra: Nach der Geburt bekomme ich Elterngeld. Finanziell mache ich mir keine Sorgen. Aber ich will beruflich den Anschluss nicht verlieren. Nur mit dem Kind zu Hause zu bleiben, ist nicht mein Ding. Kann man Elterngeld bekommen und gleichzeitig arbeiten?", "answer": "d", "confidence": "hoch", "quote": "kannst du beantragen, auch während der Elternzeit ein bisschen zu arbeiten. Du darfst dann allerdings nicht mehr als 30 Stunden pro Woche tätig sein.", "explain": "Sandra pregunta si es compatible cobrar la ayuda parental y seguir trabajando parcialmente para no perder ritmo profesional. Angela (d) confirma que es legal solicitar trabajar durante el permiso parental con un tope de 30 horas semanales."}]}]}, {"id": "lesen-t4", "title": "Lesen Teil 4", "variants": [{"id": "t4_a-p43", "label": "Variante 1", "page": 43, "note": "El acta ocupa las pp. 43-44: el texto del Protokoll empieza en la p. 43 (hasta el TOP 3) y continúa en la p. 44 (TOP 4-6), donde están los ítems 14-18 de esta misma acta. La p. 45 trae una nueva versión del mismo acta (→ t4_a-p45), con el TOP 1 reescrito y el ítem 14 nuevo; los ítems 15-18 son idénticos en ambas versiones.", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Protokoll 20.06.20XX, 10.00-12.00\nBesprechungsraum: 032,\nOrt: Konrad-Adenauer-Straße 43, 30159 Hannover\nTeilnehmende: Veronika Emmerich (VE, Stellvertreterin Geschäftsleitung), Marita Hinze (MH, Leitung Einkauf), Peter Renner (PR, Leitung Produktion), Thomas Hagen (TH, Leitung Finanzen), Sibylle Marquardt (SM, Leitung Personal), Christian Werner (CW, Leitung Vertrieb), Jessica Froh (JF, Leitung Marketing), Jutta Raulin (JR, Leitung Qualitätssicherung), Joachim Meyer (JM, Leitung IT)\nSitzungsleitung: Veronika Emmerich\nProtokollantin: Sibylle Marquardt\nNicht Anwesende: Martin Stahl (MS, Geschäftsleitung)\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung der Tagesordnungspunkte - VE\n2. Probleme mit einem Zulieferer - MH\n3. Zwischenstand Qualitätssicherung - JR\n4. Neue Überstundenregelung - VE\n5. Private Nutzung der Dienstwagen - SM\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung der Tagesordnungspunkte\nVE begrüßt alle Anwesenden, alle Abteilungsleiterinnen und -leiter zur heutigen Besprechung und bittet um die Genehmigung der Tagesordnungspunkte. Diese werden per Handzeichen einstimmig angenommen.\nAls nächster Besprechungstermin wird der 24.09.20XX nach der Urlaubszeit einstimmig festgelegt.\n\nTOP 2 Probleme mit einem Zulieferer\nMH berichtet, dass unser südamerikanischer Zulieferer Dos Caminos Exports Ltd. die Preise für seine Vorprodukte ohne weitere Absprache erhöht und uns in Rechnung gestellt hat. Auf Nachfrage wurde uns mitgeteilt, dass dies aufgrund stark gestiegener Transportkosten geschehen ist. Dies wird von uns nicht akzeptiert und wurde entsprechend an den Zulieferer kommuniziert. Nach intensivem Schriftwechsel kam es zu einer Einigung.\nWir behalten es uns vor, bis zum 31. des kommenden Monats einen für uns günstigeren Zulieferer zu finden. Hierfür zuständig sind MH und TH. Neue Lieferpartner könnten im asiatischen Raum gesucht werden. MH berichtet über gute Erfahrungen in dieser Region.\nZiel ist es, ohne weitere Ansprüche beiderseits von dem Vertrag des Zulieferers zurückzutreten. Gerichtliche Schritte werden dann nicht unternommen. Bis zum 20. des kommenden Monats ist darüber zu berichten.\n\nTOP 3 Zwischenstand Qualitätssicherung\nDie Abteilung Qualitätssicherung erarbeitete ein neues Konzept für Qualitätsprüfung in der Phase der Endproduktion. Das vor zwei Quartalen umgesetzte Konzept zeigt in der Qualitätsmessung bereits bei einer Abweichung von 30 Prozent eine Fehlermeldung. Dies führt seit drei Monaten zu einem messbaren Erfolg, berichtet JR. Die Zahl der Reklamationen ist signifikant zurückgegangen.\n\nTOP 4 Neue Überstundenregelung\nVE dankt allen Mitarbeitern für die mehrheitliche Bereitschaft, Überstunden zu leisten. Vor allem in Zeiten hoher Auftragseingänge lässt sich das leider nicht immer vermeiden.\nBisher konnten die Mitarbeitenden diese Überstunden als Freizeit ausgleichen oder sich auszahlen lassen. Aufgrund eines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bis zu 20 Überstunden pro Quartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen momentan nicht möglich ist. Bei sinkendem Auftragseingang kann man diese Maßnahme zu einem späteren Zeitpunkt wieder rückgängig machen. Diese Vorgehensweise ist mit Protokoll vom 15.06.20XX vom Betriebsrat genehmigt.\n\nTOP 5 Private Nutzung der Dienstwagen\nSM teilt mit, dass alle Mitarbeiter, die über einen Dienstwagen verfügen, diesen ab dem nächsten Monat nicht mehr nur für dienstliche, sondern auch für private Zwecke nutzen können. Es wird aber darauf hingewiesen, dass dann unbedingt ein Fahrtenbuch geführt werden muss, das die privat gefahrenen Kilometer angibt. Dieses ist monatlich in der Finanzabteilung einzureichen.\n\nTOP 6 Sonstiges\nTH präsentiert eine Idee seiner Mitarbeiterinnen und Mitarbeiter, sie möchten am Samstag in zwei Wochen einen geselligen Bowlingabend in der Anlage „Sport und Spaß“, Marienstraße 10-12 verbringen. Dazu laden sie alle interessierten Kolleginnen und Kollegen aus anderen Abteilungen ein. Die Personalabteilung wird diese Information ins Intranet stellen. Wer Interesse hat, soll sich dort bis Freitag nächster Woche anmelden.", "items": [{"n": 14, "type": "choice", "prompt": "Der Termin der nächsten Sitzung", "options": [{"key": "a", "text": "findet nach Abstimmung im Herbst statt."}, {"key": "b", "text": "muss verlegt werden."}, {"key": "c", "text": "wird noch bekannt gegeben."}], "answer": "a", "confidence": "hoch", "quote": "Als nächster Besprechungstermin wird der 24.09.20XX nach der Urlaubszeit einstimmig festgelegt.", "explain": "Correcto a: la fecha de la próxima reunión se fija por votación (los asuntos se aprueban «per Handzeichen einstimmig», y el propio término se «legt … einstimmig fest») y se sitúa el 24.09.20XX, después del periodo de vacaciones, es decir, en otoño. b es falso porque la fecha no se aplaza: se acuerda aquí mismo. c es falso porque no queda pendiente de comunicarse, sino que ya está decidida y consta en el acta."}, {"n": 15, "type": "choice", "prompt": "Die Firma", "options": [{"key": "a", "text": "hat ohne Weiteres die Preiserhöhung des Zulieferers akzeptiert."}, {"key": "b", "text": "will sich an den höheren Transportkosten gern beteiligen."}, {"key": "c", "text": "wird einen neuen Vertragspartner suchen."}], "answer": "c", "confidence": "hoch", "quote": "Wir behalten es uns vor, bis zum 31. des kommenden Monats einen für uns günstigeren Zulieferer zu finden. Hierfür zuständig sind MH und TH. Neue Lieferpartner könnten im asiatischen Raum gesucht werden.", "explain": "Correcto c: la empresa se reserva la posibilidad de encontrar un proveedor más barato antes del día 31 del mes próximo, y se plantea buscar nuevos socios de suministro en Asia; además el objetivo es rescindir el contrato con el proveedor actual («von dem Vertrag des Zulieferers zurückzutreten»). a es falso, el texto lo dice al revés: «Dies wird von uns nicht akzeptiert». b también es falso: el encarecimiento se debe a los costes de transporte, pero la empresa rechaza la subida, no se ofrece a asumirla."}, {"n": 16, "type": "choice", "prompt": "Die Abteilung Qualitätssicherung", "options": [{"key": "a", "text": "berichtet von 30 Prozent fehlerhafter Produkte."}, {"key": "b", "text": "hat keine Qualitätsprobleme."}, {"key": "c", "text": "verzeichnet erste Erfolge."}], "answer": "c", "confidence": "hoch", "quote": "Dies führt seit drei Monaten zu einem messbaren Erfolg, berichtet JR. Die Zahl der Reklamationen ist signifikant zurückgegangen.", "explain": "Correcto c: el nuevo concepto de control de calidad arroja desde hace tres meses un éxito medible y las reclamaciones han disminuido de forma significativa. a es la trampa de la cifra: el 30 % es el grado de desviación a partir del cual el sistema lanza un aviso de error («bei einer Abweichung von 30 Prozent eine Fehlermeldung»), no el porcentaje de productos defectuosos. b es falso porque existen reclamaciones, que son precisamente las que han bajado."}, {"n": 17, "type": "choice", "prompt": "Die Mitarbeitenden", "options": [{"key": "a", "text": "haben mit dem Betriebsrat gesprochen."}, {"key": "b", "text": "können alle Überstunden als Freizeit nehmen."}, {"key": "c", "text": "müssen zurzeit Mehrarbeit leisten."}], "answer": "c", "confidence": "mittel", "quote": "Aufgrund eines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bis zu 20 Überstunden pro Quartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen momentan nicht möglich ist.", "explain": "Correcto c por eliminación: el volumen de pedidos es ahora inesperadamente alto, las horas extraordinarias no se pueden compensar con tiempo libre y se agradece la disposición mayoritaria a hacerlas, de modo que en este momento se trabaja de más (la confianza es media porque el acta habla de la «Bereitschaft» de los empleados y de que las horas extras «lässt sich … nicht immer vermeiden», más que de una obligación expresa). a es falso: quien aprobó el procedimiento fue el Betriebsrat, mediante acta del 15.06.20XX, y no consta ninguna conversación de los empleados con él. b es falso: precisamente se acaba de suprimir esa posibilidad; hasta 20 horas por trimestre solo se pagan."}, {"n": 18, "type": "choice", "prompt": "Das Fahrtenbuch", "options": [{"key": "a", "text": "dokumentiert alle gefahrenen Kilometer."}, {"key": "b", "text": "enthält nichtdienstliche Autofahrten."}, {"key": "c", "text": "wird von allen Mitarbeitern geführt."}], "answer": "b", "confidence": "mittel", "quote": "Es wird aber darauf hingewiesen, dass dann unbedingt ein Fahrtenbuch geführt werden muss, das die privat gefahrenen Kilometer angibt.", "explain": "Correcto b: el acta exige que el libro de ruta indique los kilómetros recorridos en uso privado, es decir, los desplazamientos no laborales (el coche pasa a poder usarse «nicht mehr nur für dienstliche, sondern auch für private Zwecke»). a es la opción que confunde: el texto solo menciona los kilómetros privados, no «alle gefahrenen Kilometer»; un Fahrtenbuch real recoge todo, pero el protocolo no lo dice, de ahí la confianza media. c es falso porque solo lo llevan los empleados que disponen de coche de empresa («alle Mitarbeiter, die über einen Dienstwagen verfügen»)."}]}, {"id": "t4_a-p45", "label": "Variante 1 (Новый вариант от 08.2024)", "page": 45, "note": "Nueva versión del acta de las pp. 43-44, marcada en el original «Новый вариант от 08.2024» / «пункт 1 новый и новый вопрос»: el TOP 1 aparece reescrito (la fecha de la próxima reunión se fija expresamente durante la sesión) y el ítem 14 es nuevo, mientras que los ítems 15-18 se repiten literalmente. El acta vuelve a ocupar dos páginas: TOP 1-3 en la p. 45 y TOP 4-6 con los ítems 14-18 en la p. 46. Se ha conservado tal cual la opción c del ítem 14 («wurde während der Sitzung gesprochen»), aunque probablemente el original decía «besprochen».", "kind": "text", "intro": "Lesen Sie das Protokoll und die Au
