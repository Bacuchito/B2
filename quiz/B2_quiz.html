fgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Protokoll 20.06.20XX, 10.00-12.00\nBesprechungsraum: 032,\nOrt: Konrad-Adenauer-Straße 43, 30159 Hannover\nTeilnehmende: Veronika Emmerich (VE, Stellvertreterin Geschäftsleitung), Marita Hinze (MH, Leitung Einkauf), Peter Renner (PR, Leitung Produktion), Thomas Hagen (TH, Leitung Finanzen), Sibylle Marquardt (SM, Leitung Personal), Christian Werner (CW, Leitung Vertrieb), Jessica Froh (JF, Leitung Marketing), Jutta Raulin (JR, Leitung Qualitätssicherung), Joachim Meyer (JM, Leitung IT)\nSitzungsleitung: Veronika Emmerich\nProtokollantin: Sibylle Marquardt\nNicht Anwesende: Martin Stahl (MS, Geschäftsleitung)\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung der Tagesordnungspunkte - VE\n2. Probleme mit einem Zulieferer - MH\n3. Zwischenstand Qualitätssicherung - JR\n4. Neue Überstundenregelung - VE\n5. Private Nutzung der Dienstwagen - SM\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung der Tagesordnungspunkte\nVE begrüßt alle Anwesenden, alle Abteilungsleiterinnen und -leiter zur heutigen Besprechung und bittet um die Genehmigung der Tagesordnungspunkte. Diese werden per Handzeichen einstimmig angenommen.\nDer nächste Besprechungstermin findet am 24.09.20XX statt; also nach der Urlaubszeit. Dies wird einstimmig beschlossen.\n\nTOP 2 Probleme mit einem Zulieferer\nMH berichtet, dass unser südamerikanischer Zulieferer Dos Caminos Exports Ltd. die Preise für seine Vorprodukte ohne weitere Absprache erhöht und uns in Rechnung gestellt hat. Auf Nachfrage wurde uns mitgeteilt, dass dies aufgrund stark gestiegener Transportkosten geschehen ist. Dies wird von uns nicht akzeptiert und wurde entsprechend an den Zulieferer kommuniziert. Nach intensivem Schriftwechsel kam es zu einer Einigung.\nWir behalten es uns vor, bis zum 31. des kommenden Monats einen für uns günstigeren Zulieferer zu finden. Hierfür zuständig sind MH und TH. Neue Lieferpartner könnten im asiatischen Raum gesucht werden. MH berichtet über gute Erfahrungen in dieser Region.\nZiel ist es, ohne weitere Ansprüche beiderseits von dem Vertrag des Zulieferers zurückzutreten. Gerichtliche Schritte werden dann nicht unternommen. Bis zum 20. des kommenden Monats ist darüber zu berichten.\n\nTOP 3 Zwischenstand Qualitätssicherung\nDie Abteilung Qualitätssicherung erarbeitete ein neues Konzept für Qualitätsprüfung in der Phase der Endproduktion. Das vor zwei Quartalen umgesetzte Konzept zeigt in der Qualitätsmessung bereits bei einer Abweichung von 30 Prozent eine Fehlermeldung. Dies führt seit drei Monaten zu einem messbaren Erfolg, berichtet JR. Die Zahl der Reklamationen ist signifikant zurückgegangen.\n\nTOP 4 Neue Überstundenregelung\nVE dankt allen Mitarbeitern für die mehrheitliche Bereitschaft, Überstunden zu leisten. Vor allem in Zeiten hoher Auftragseingänge lässt sich das leider nicht immer vermeiden.\nBisher konnten die Mitarbeitenden diese Überstunden als Freizeit ausgleichen oder sich auszahlen lassen. Aufgrund eines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bis zu 20 Überstunden pro Quartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen momentan nicht möglich ist. Bei sinkendem Auftragseingang kann man diese Maßnahme zu einem späteren Zeitpunkt wieder rückgängig machen. Diese Vorgehensweise ist mit Protokoll vom 15.06.20XX vom Betriebsrat genehmigt.\n\nTOP 5 Private Nutzung der Dienstwagen\nSM teilt mit, dass alle Mitarbeiter, die über einen Dienstwagen verfügen, diesen ab dem nächsten Monat nicht mehr nur für dienstliche, sondern auch für private Zwecke nutzen können. Es wird aber darauf hingewiesen, dass dann unbedingt ein Fahrtenbuch geführt werden muss, das die privat gefahrenen Kilometer angibt. Dieses ist monatlich in der Finanzabteilung einzureichen.\n\nTOP 6 Sonstiges\nTH präsentiert eine Idee seiner Mitarbeiterinnen und Mitarbeiter, sie möchten am Samstag in zwei Wochen einen geselligen Bowlingabend in der Anlage „Sport und Spaß“, Marienstraße 10-12 verbringen. Dazu laden sie alle interessierten Kolleginnen und Kollegen aus anderen Abteilungen ein. Die Personalabteilung wird diese Information ins Intranet stellen. Wer Interesse hat, soll sich dort bis Freitag nächster Woche anmelden.", "items": [{"n": 14, "type": "choice", "prompt": "Der Termin der nächsten Sitzung", "options": [{"key": "a", "text": "muss noch entschieden werden."}, {"key": "b", "text": "wird nach der Urlaubszeit abgestimmt."}, {"key": "c", "text": "wurde während der Sitzung gesprochen."}], "answer": "c", "confidence": "mittel", "quote": "Der nächste Besprechungstermin findet am 24.09.20XX statt; also nach der Urlaubszeit. Dies wird einstimmig beschlossen.", "explain": "Correcto c por eliminación: la fecha (24.09.20XX, después de las vacaciones) se decidió por unanimidad en esta misma sesión, es decir, fue un punto tratado durante la reunión; la opción está redactada de forma torpe (parece faltar «be-» en «gesprochen», por «besprochen»), y eso rebaja la confianza. a es falso: «Dies wird einstimmig beschlossen», ya no hay nada que decidir. b es el distractor de «nach der Urlaubszeit»: lo que cae después de las vacaciones es la reunión, no la votación, que tiene lugar ahora."}, {"n": 15, "type": "choice", "prompt": "Die Firma", "options": [{"key": "a", "text": "hat ohne Weiteres die Preiserhöhung des Zulieferers akzeptiert."}, {"key": "b", "text": "will sich an den höheren Transportkosten gern beteiligen."}, {"key": "c", "text": "wird einen neuen Vertragspartner suchen."}], "answer": "c", "confidence": "hoch", "quote": "Wir behalten es uns vor, bis zum 31. des kommenden Monats einen für uns günstigeren Zulieferer zu finden. Hierfür zuständig sind MH und TH. Neue Lieferpartner könnten im asiatischen Raum gesucht werden.", "explain": "Correcto c: el acta recoge la intención de buscar antes del día 31 del mes próximo un proveedor más favorable, y de explorar nuevos socios de suministro en Asia; además se pretende rescindir el contrato con el proveedor actual. a es falso porque la subida no se acepta («Dies wird von uns nicht akzeptiert»). b es falso: el aumento de costes de transporte es la explicación del proveedor, no una oferta de la empresa para repartirlos."}, {"n": 16, "type": "choice", "prompt": "Die Abteilung Qualitätssicherung", "options": [{"key": "a", "text": "berichtet von 30 Prozent fehlerhafter Produkte."}, {"key": "b", "text": "hat keine Qualitätsprobleme."}, {"key": "c", "text": "verzeichnet erste Erfolge."}], "answer": "c", "confidence": "hoch", "quote": "Dies führt seit drei Monaten zu einem messbaren Erfolg, berichtet JR. Die Zahl der Reklamationen ist signifikant zurückgegangen.", "explain": "Correcto c: desde hace tres meses el nuevo concepto de control de calidad produce un éxito medible y las reclamaciones han bajado de forma significativa. a confunde el dato: el 30 % es el umbral de desviación que provoca un aviso de error, no la cuota de productos defectuosos. b es falso, pues el éxito se mide justamente por el descenso de las reclamaciones."}, {"n": 17, "type": "choice", "prompt": "Die Mitarbeitenden", "options": [{"key": "a", "text": "haben mit dem Betriebsrat gesprochen."}, {"key": "b", "text": "können alle Überstunden als Freizeit nehmen."}, {"key": "c", "text": "müssen zurzeit Mehrarbeit leisten."}], "answer": "c", "confidence": "mittel", "quote": "Aufgrund eines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bis zu 20 Überstunden pro Quartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen momentan nicht möglich ist.", "explain": "Correcto c por eliminación: debido al elevado volumen de pedidos, las horas extraordinarias ya no pueden compensarse con tiempo libre y solo se pagan hasta 20 por trimestre, de modo que actualmente se trabaja de más (confianza media, porque el acta subraya la «Bereitschaft» de los empleados más que una obligación). a es falso: el Betriebsrat aprobó el procedimiento con acta del 15.06.20XX, pero no consta que los empleados hablaran con él. b es falso: esa posibilidad acaba de quedar suspendida."}, {"n": 18, "type": "choice", "prompt": "Das Fahrtenbuch", "options": [{"key": "a", "text": "dokumentiert alle gefahrenen Kilometer."}, {"key": "b", "text": "enthält nichtdienstliche Autofahrten."}, {"key": "c", "text": "wird von allen Mitarbeitern geführt."}], "answer": "b", "confidence": "mittel", "quote": "Es wird aber darauf hingewiesen, dass dann unbedingt ein Fahrtenbuch geführt werden muss, das die privat gefahrenen Kilometer angibt.", "explain": "Correcto b: el libro de ruta debe indicar los kilómetros hechos en uso privado, esto es, los desplazamientos no laborales, ya que el coche de empresa pasa a poder usarse también de forma privada. a es la trampa: el protocolo solo menciona los kilómetros privados, no «alle gefahrenen Kilometer» (aunque en la práctica un Fahrtenbuch recoja todo el recorrido, el texto no lo dice). c es falso: solo lo llevan quienes tienen coche de empresa."}]}, {"id": "t4_b-p47", "label": "Variante 1", "page": 47, "note": "Primera versión del Protokoll «neue Werbemaßnahmen, Frau Schlosser» (pp. 47-48): el acta ocupa las dos páginas y las cinco preguntas 14-18 están al final de la p. 48. Es la versión sin la marca «Новая версия»; la p. 49 trae una segunda versión del mismo acta con el TOP 3 reescrito y preguntas nuevas (→ t4_b-p49). Las opciones de los ítems 16, 17 y 18 aparecen aquí en otro orden que en esa segunda versión.", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14-18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(neue Werbemaßnahmen, Frau Schlosser)\n\nProtokoll 14.02.20XX, 08:00-11:45 Uhr\nAbteilung 4, Besprechungszimmer 2\nTeilnehmende: Holger Marschke (HM, Teamleiter), Cornelia Markert (CM, Marketingabteilung), Susanne Willke (SW, Marketingabteilung), Monique Rüdiger (MR, Betriebsratsmitglied)\nEntschuldigt: Martin Hamann (MH, Qualitätssicherung)\nProtokollantin: Marianne Schiller (MS)\nSitzungsleitung: Andreas Mertens (AM)\n\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Neue Marketingmaßnahmen\n3. Qualitätsmanagement\n4. Anpassung der Pausenzeiten\n5. Standorte der neuen Fahrradständer\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nAM begrüßt alle Teilnehmenden und eröffnet die heutige Sitzung. Das Protokoll des letzten Meetings am 10.01.20XX wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt. Auf Antrag von MR, die wegen anderweitiger terminlicher Verpflichtungen nicht bis zum Ende am Meeting teilnehmen kann, wird die Reihenfolge der Tagesordnung geändert und die TOPs 4 und 5 werden am heutigen Vormittag vorgezogen.\n\nTOP 2 Neue Marketingmaßnahmen\nCM und SW berichten, dass traditionelle Marketingmaßnahmen wie z. B. Fernsehwerbung zu den Hauptsendezeiten zu teuer sind. Deshalb sollen soziale Medien wie Facebook, Instagram u. a. verstärkt genutzt werden. Weitere Möglichkeiten, Werbung zu machen, müssen von der Marketingabteilung noch erörtert werden. Es ist geplant, neue Wege zu gehen und zusätzlich zu den lokalen Geschäften einen Online-Shop zu starten. Für alle diese Maßnahmen steht insgesamt ein Budget von 150.000 € zur Verfügung. CM wird beauftragt, dafür eine spezialisierte Werbeagentur zu finden sowie einen Kostenvoranschlag der betreffenden Agentur einzuholen, SW soll Kontakte zu professionellen Fotografen und Textern herstellen und Angebote anfordern. Ergebnisse der beiden Recherchen werden bei der nächsten Besprechung am 10.03.20XX vorgestellt. Das weitere Vorgehen wird definiert, wenn alle nötigen Informationen vorliegen.\n\nTOP 3 Qualitätsmanagement\nZu den in der Besprechung vom 11.01.20XX vorgeschlagenen Maßnahmen hat MH im Vorfeld allen Sitzungsteilnehmenden erste Ergebnisse des Arbeitskreises „Optimierung innerer Kommunikationsstrukturen\" in Form eines Konzeptpapiers zukommen lassen. Da MH an der heutigen Sitzung aus gesundheitlichen Gründen nicht teilnehmen kann, ist gemeinsam beschlossen worden, die Diskussion zu diesem Punkt bis zur nächsten Besprechung am 10.03.20XX zu vertagen. Damit ist die Umsetzung der geplanten Veränderungen auf das nächste Quartal verschoben.\n\nTOP 4 Anpassung der Pausenzeiten\nAufgrund mehrfacher Anfragen von Seiten der Abteilungsleiter regt MR an, dass die Zeiten, in denen Pausen gemacht werden können, flexibler gestaltet werden. Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann. So können die betrieblichen Notwendigkeiten und Arbeitsabläufe verschiedener Abteilungen besser berücksichtigt werden. Dieser Vorschlag wird einstimmig angenommen, MR wird beauftragt, eine entsprechende Mitteilung an die Belegschaft über die Änderung der Pausenzeiten zu verfassen.\n\nTOP 5 Standorte der neuen Fahrradständer\nMR teilt mit, dass auf Wunsch der Belegschaft zwei weitere Fahrradständer auf dem Gelände aufgestellt werden. Dabei wurden zwei Standorte favorisiert und der erste Fahrradständer wird neben Tor 2, der zweite neben Tor 3 installiert. So steht den Mitarbeitenden nun an jedem Zugang zum Gelände eine Möglichkeit zur Verfügung, ihr Fahrrad abzustellen. Dementsprechend werden der Lageplan überarbeitet und die neuen Standorte der Fahrradständer eingezeichnet. MR formuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats aushängen.\n\nTOP 6 Sonstiges\nDie Assistentin der Geschäftsleitung, Frau Schlosser, verabschiedet sich in den Mutterschutz und die anschließende Elternzeit. Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt sein. Frau Meier wird eine Abschiedsfeier für den 16.03.20XX organisieren und sich auch um kleine Geschenke für Mutter und Kind im Namen der Kolleginnen und Kollegen kümmern.", "items": [{"n": 14, "type": "choice", "prompt": "Für neue Werbemaßnahmen", "options": [{"key": "a", "text": "werden kreative Mitarbeiter gesucht."}, {"key": "b", "text": "wird ein Gesamtbetrag von 150.000 € bereitgestellt."}, {"key": "c", "text": "wurden Kostenvoranschläge angefragt."}], "answer": "b", "confidence": "hoch", "quote": "Für alle diese Maßnahmen steht insgesamt ein Budget von 150.000 € zur Verfügung.", "explain": "Correcto b: el acta fija para todas las medidas publicitarias un presupuesto total («insgesamt ein Budget») de 150.000 €, que es exactamente el importe de la opción. a es falso porque no se busca personal creativo propio: lo que se hace es encargar a CM que encuentre una agencia de publicidad externa y a SW que contacte con fotógrafos y redactores («professionellen Fotografen und Textern»), proveedores externos, no trabajadores de la plantilla. c es falso porque los presupuestos todavía no se han pedido: CM «wird beauftragt … einen Kostenvoranschlag … einzuholen» (encargo para el futuro) y los resultados de ambas búsquedas se presentarán en la reunión del 10.03.20XX."}, {"n": 15, "type": "choice", "prompt": "Herr Hamann", "options": [{"key": "a", "text": "hat bereits ein Konzept vorbereitet."}, {"key": "b", "text": "ist dienstlich verhindert."}, {"key": "c", "text": "stellt die Resultate seiner Arbeit vor."}], "answer": "a", "confidence": "hoch", "quote": "Zu den in der Besprechung vom 11.01.20XX vorgeschlagenen Maßnahmen hat MH im Vorfeld allen Sitzungsteilnehmenden erste Ergebnisse des Arbeitskreises „Optimierung innerer Kommunikationsstrukturen\" in Form eines Konzeptpapiers zukommen lassen.", "explain": "Correcto a: MH (Martin Hamann) ya había elaborado un documento de concepto («in Form eines Konzeptpapiers») con los primeros resultados de su grupo de trabajo y lo envió a todos los participantes antes de la reunión, es decir, tiene un concepto ya preparado. b es falso por el motivo de la ausencia: MH no puede asistir «aus gesundheitlichen Gründen» (razones de salud), no por motivos de trabajo («dienstlich»). c es falso porque precisamente no puede asistir y el punto se aplaza a la reunión del 10.03.20XX."}, {"n": 16, "type": "choice", "prompt": "Die Mittagspause", "options": [{"key": "a", "text": "ist 30 Minuten lang."}, {"key": "b", "text": "wird um 30 Minuten verlängert."}, {"key": "c", "text": "wird um 30 Minuten verschoben."}], "answer": "a", "confidence": "hoch", "quote": "Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann.", "explain": "Correcto a: la propuesta de MR es una pausa de mediodía «von 30 Minuten», es decir, de 30 minutos de duración. b y c confunden lo que se amplía: lo que se amplía es la franja horaria en la que se puede hacer la pausa («ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr»), no la pausa misma, que sigue siendo de 30 minutos; y nada se pospone 30 minutos."}, {"n": 17, "type": "choice", "prompt": "Der Standort der neuen Fahrradständer", "options": [{"key": "a", "text": "wird an der Informationstafel bekanntgegeben."}, {"key": "b", "text": "wird dem Betriebsrat mitgeteilt."}, {"key": "c", "text": "wird zwischen Tor 2 und 3 geplant."}], "answer": "a", "confidence": "mittel", "quote": "MR formuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats aushängen.", "explain": "Correcto a: el emplazamiento se da a conocer mediante un comunicado que se publica en el tablón de anuncios («am Schwarzen Brett … aushängen»), que es la «Informationstafel» de la opción; además se retoca el plano de situación con las nuevas ubicaciones. La confianza es media porque el texto dice «Schwarzes Brett», no literalmente «Informationstafel». c es falso aunque repite los nombres correctos: las dos estructuras se instalan una «neben Tor 2» y la otra «neben Tor 3», junto a cada puerta y no entre ambas. b es falso porque el comunicado va dirigido a toda la plantilla («intern kommunizieren», «an die Belegschaft») y se cuelga en el tablón del comité de empresa, no es un aviso dirigido al Betriebsrat."}, {"n": 18, "type": "choice", "prompt": "Frau Schlosser", "options": [{"key": "a", "text": "macht Frau Schmidt ein Geschenk."}, {"key": "b", "text": "verlässt das Unternehmen."}, {"key": "c", "text": "wird von Frau Meier vertreten."}], "answer": "c", "confidence": "hoch", "quote": "Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt sein.", "explain": "Correcto c: mientras Frau Schlosser está de baja por maternidad y luego de permiso parental, Frau Meier pasa a ser la persona de contacto «bis zu ihrer Rückkehr», es decir, la sustituye. b es falso porque no abandona la empresa: se marcha al Mutterschutz y a la Elternzeit y se prevé su regreso. a es falso: quien se ocupa de los regalos es Frau Meier («Frau Meier wird … sich auch um kleine Geschenke für Mutter und Kind … kümmern»), y además en nombre de los colegas; Frau Schmidt solo aparece como la persona en cuyo despacho trabaja Frau Meier."}]}, {"id": "t4_b-p49", "label": "Variante 1 (Новая версия от 07.2024)", "page": 49, "note": "Segunda versión del mismo acta (pp. 49-50, «Новая версия от 07.2024: пункт 3 новый и новые вопросы»): el TOP 3 está reescrito (ahora MH envía propuestas para mejorar la calidad del producto y el punto se aplaza) y los ítems 14-18 son nuevos, con las opciones de 16, 17 y 18 en otro orden; las respuestas cambian de letra respecto a t4_b-p47. Se ha eliminado la anotación rusa de la cabecera. El acta ocupa las pp. 49-50 y las preguntas están al final de la p. 50.", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14-18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(neue Werbemaßnahmen, Frau Schlosser)\n\nProtokoll 14.02.20XX, 08:00-11:45 Uhr\nAbteilung 4, Besprechungszimmer 2\nTeilnehmende: Holger Marschke (HM, Teamleiter), Cornelia Markert (CM, Marketingabteilung), Susanne Willke (SW, Marketingabteilung), Monique Rüdiger (MR, Betriebsratsmitglied)\nEntschuldigt: Martin Hamann (MH, Qualitätssicherung)\nProtokollantin: Marianne Schiller (MS)\nSitzungsleitung: Andreas Mertens (AM)\n\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Neue Marketingmaßnahmen\n3. Qualitätsmanagement\n4. Anpassung der Pausenzeiten\n5. Standorte der neuen Fahrradständer\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nAM begrüßt alle Teilnehmenden und eröffnet die heutige Sitzung. Das Protokoll des letzten Meetings am 10.01.20XX wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt. Auf Antrag von MR, die wegen anderweitiger terminlicher Verpflichtungen nicht bis zum Ende am Meeting teilnehmen kann, wird die Reihenfolge der Tagesordnung geändert und die TOPs 4 und 5 werden am heutigen Vormittag vorgezogen.\n\nTOP 2 Neue Marketingmaßnahmen\nCM und SW berichten, dass traditionelle Marketingmaßnahmen wie z. B. Fernsehwerbung zu den Hauptsendezeiten zu teuer sind. Deshalb sollen soziale Medien wie Facebook, Instagram u. a. verstärkt genutzt werden. Weitere Möglichkeiten, Werbung zu machen, müssen von der Marketingabteilung noch erörtert werden. Es ist geplant, neue Wege zu gehen und zusätzlich zu den lokalen Geschäften einen Online-Shop zu starten. Für alle diese Maßnahmen steht insgesamt ein Budget von 150.000 € zur Verfügung. CM wird beauftragt, dafür eine spezialisierte Werbeagentur zu finden sowie einen Kostenvoranschlag der betreffenden Agentur einzuholen, SW soll Kontakte zu professionellen Fotografen und Textern herstellen und Angebote anfordern. Ergebnisse der beiden Recherchen werden bei der nächsten Besprechung am 10.03.20XX vorgestellt. Das weitere Vorgehen wird definiert, wenn alle nötigen Informationen vorliegen.\n\nTOP 3 Qualitätsmanagement\nMH hat vor der heutigen Sitzung allen Anwesenden erste Vorschläge zur Verbesserung der Produktqualität zugeschickt, die er mit seiner Arbeitsgruppe erstellt hat. Da MH heute wegen Krankheit nicht an dem Meeting teilnehmen kann, wird beschlossen, diesen Punkt bis zur nächsten Besprechung am 10.03.20XX zu vertagen. Damit verschiebt sich auch die Umsetzung der Maßnahmen zur Qualitätssicherung. MH hat aber zugesagt, bis Anfang März noch weitere Ideen erarbeiten und zu kommunizieren.\n\nTOP 4 Anpassung der Pausenzeiten\nAufgrund mehrfacher Anfragen von Seiten der Abteilungsleiter regt MR an, dass die Zeiten, in denen Pausen gemacht werden können, flexibler gestaltet werden. Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann. So können die betrieblichen Notwendigkeiten und Arbeitsabläufe verschiedener Abteilungen besser berücksichtigt werden. Dieser Vorschlag wird einstimmig angenommen, MR wird beauftragt, eine entsprechende Mitteilung an die Belegschaft über die Änderung der Pausenzeiten zu verfassen.\n\nTOP 5 Standorte der neuen Fahrradständer\nMR teilt mit, dass auf Wunsch der Belegschaft zwei weitere Fahrradständer auf dem Gelände aufgestellt werden. Dabei wurden zwei Standorte favorisiert und der erste Fahrradständer wird neben Tor 2, der zweite neben Tor 3 installiert. So steht den Mitarbeitenden nun an jedem Zugang zum Gelände eine Möglichkeit zur Verfügung, ihr Fahrrad abzustellen. Dementsprechend werden der Lageplan überarbeitet und die neuen Standorte der Fahrradständer eingezeichnet. MR formuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats aushängen.\n\nTOP 6 Sonstiges\nDie Assistentin der Geschäftsleitung, Frau Schlosser, verabschiedet sich in den Mutterschutz und die anschließende Elternzeit. Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt sein. Frau Meier wird eine Abschiedsfeier für den 16.03.20XX organisieren und sich auch um kleine Geschenke für Mutter und Kind im Namen der Kolleginnen und Kollegen kümmern.", "items": [{"n": 14, "type": "choice", "prompt": "Die neuen Werbemaßnahmen", "options": [{"key": "a", "text": "dürfen bis zu 150.000 Euro kosten."}, {"key": "b", "text": "sollen Online-Medien ausschließen."}, {"key": "c", "text": "werden bis zur nächsten Teamsitzung umgesetzt."}], "answer": "a", "confidence": "hoch", "quote": "Für alle diese Maßnahmen steht insgesamt ein Budget von 150.000 € zur Verfügung.", "explain": "Correcto a: el presupuesto disponible para todas las medidas es de 150.000 €, de modo que pueden costar hasta esa cantidad. b es falso y contradice el acta: lo que se decide es precisamente utilizar más los medios sociales como Facebook e Instagram («Deshalb sollen soziale Medien … verstärkt genutzt werden») y abrir además una tienda en línea. c es falso porque en la reunión del 10.03.20XX solo se presentarán los resultados de las dos búsquedas y el procedimiento se definirá cuando esté toda la información: la ejecución no está prevista para la próxima reunión."}, {"n": 15, "type": "choice", "prompt": "Herr Hamann", "options": [{"key": "a", "text": "hat erste Arbeitsergebnisse versendet."}, {"key": "b", "text": "realisiert bis März die Maßnahmen zur Qualitätssicherung."}, {"key": "c", "text": "stellt die Resultate seiner Arbeit vor."}], "answer": "a", "confidence": "hoch", "quote": "MH hat vor der heutigen Sitzung allen Anwesenden erste Vorschläge zur Verbesserung der Produktqualität zugeschickt, die er mit seiner Arbeitsgruppe erstellt hat.", "explain": "Correcto a: MH envió por adelantado a todos los asistentes los primeros resultados de su grupo de trabajo («erste Vorschläge … zugeschickt, die er mit seiner Arbeitsgruppe erstellt hat»). b es falso: la aplicación de las medidas de aseguramiento de la calidad se retrasa porque el punto se aplaza («Damit verschiebt sich auch die Umsetzung der Maßnahmen zur Qualitätssicherung»); lo único que MH promete para principios de marzo son nuevas ideas. c es falso porque no asiste a la reunión por enfermedad («Da MH heute wegen Krankheit nicht an dem Meeting teilnehmen kann»)."}, {"n": 16, "type": "choice", "prompt": "Die Mittagspause", "options": [{"key": "a", "text": "wird um 30 Minuten verlängert."}, {"key": "b", "text": "wird um 30 Minuten verschoben."}, {"key": "c", "text": "ist 30 Minuten lang."}], "answer": "c", "confidence": "hoch", "quote": "Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann.", "explain": "Correcto c: la pausa de mediodía es «von 30 Minuten», es decir, dura 30 minutos. a y b son falsas por el mismo motivo: lo que se amplía no es la pausa, sino la franja horaria para hacerla («ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr»); ni se alarga ni se desplaza 30 minutos."}, {"n": 17, "type": "choice", "prompt": "Der Standort der neuen Fahrradständer", "options": [{"key": "a", "text": "wird dem Betriebsrat mitgeteilt."}, {"key": "b", "text": "wird zwischen Tor 2 und 3 geplant."}, {"key": "c", "text": "wird an der Informationstafel bekanntgegeben."}], "answer": "c", "confidence": "mittel", "quote": "MR formuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats aushängen.", "explain": "Correcto c: el emplazamiento de los aparcabicis se da a conocer con un comunicado que se cuelga en el tablón de anuncios («am Schwarzen Brett … aushängen»), equivalente a la «Informationstafel» de la opción; el plano de situación también se actualiza con las nuevas ubicaciones. La confianza es media porque el texto literal dice «Schwarzes Brett» y no «Informationstafel». b es falso pese a citar bien las puertas: se instala uno «neben Tor 2» y otro «neben Tor 3», junto a cada acceso, no entre las dos puertas. a es falso porque el comunicado es para toda la plantilla («intern kommunizieren») y solo se publica en el tablón del comité de empresa; no es un aviso que se le dé al Betriebsrat."}, {"n": 18, "type": "choice", "prompt": "Frau Schlosser", "options": [{"key": "a", "text": "verlässt das Unternehmen."}, {"key": "b", "text": "wird von Frau Meier vertreten."}, {"key": "c", "text": "macht Frau Schmidt ein Geschenk."}], "answer": "b", "confidence": "hoch", "quote": "Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt sein.", "explain": "Correcto b: Frau Meier será la persona de contacto «bis zu ihrer Rückkehr», luego sustituye a Frau Schlosser durante su ausencia. a es falso porque Frau Schlosser no deja la empresa: se va al Mutterschutz y a la Elternzeit y se cuenta con su vuelta. c es falso porque los regalos los gestiona Frau Meier («Frau Meier wird … sich auch um kleine Geschenke für Mutter und Kind … kümmern») en nombre de los colegas; Frau Schmidt solo aparece como la titular del despacho en el que trabaja Frau Meier."}]}, {"id": "t4_c-p51", "label": "Variante 3 (Protokoll 19.11.20XX)", "page": 51, "note": "Acta de la reunión del 19.11.20XX, cuyo texto ocupa las pp. 51-52 y cuyas preguntas 14-18 aparecen al final de la p. 52. El ítem 15 trae DOS redacciones distintas en el original: la primera («Einige Mitarbeiter machen Überstunden,») y la marcada «новый вариант вопроса» («Aufgrund des hohen Krankenstands»), que se han conservado como dos ítems con el mismo n (se mostrarán como 15a y 15b). En la p. 52 los ítems 17 («Die Firma») y 18 («Persönliche Gegenstände») vienen entrelazados a dos columnas y el OCR los mezcla en las mismas líneas («17. Die Firma 18. Persönliche Gegenstände» seguido de «a) besucht die Frühjahrsmesse regelmäßig. a) können nicht in der Küche bleiben.»); cada ítem se ha reconstruido con sus propias opciones a/b/c.", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(Personalthemen, Urlaubssperre)\nProtokoll 19.11.20XX, 08.00-11.45 Uhr\nZentrale, Raum 405\nSitzungsleitung: Lukas Wallner (LW)\nTeilnehmende: Jessica Müller (JM, Personalabteilung), Maximilian Berger (MB, Marketingabteilung), Rebecca Lehmann (RL, Öffentlichkeitsarbeit), Kurt Meichsner (KM, Verkauf)\nExtern: Ansgar Wolf (AW, Hausverwaltung)\nProtokollantin: Beate Richter (BR)\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Personal\n3. Kundenbindung, Rabattaktion\n4. Vorbereitungen der Messe\n5. Neujahrsfeier\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nLW begrüßt alle Teilnehmer und eröffnet die heutige Besprechung. Herr Dr. Baumann aus der Qualitätssicherung lässt sich entschuldigen, da er in dieser Woche auf einer Dienstreise ist. Das Protokoll des Meetings vom 14. November wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt.\nTOP 2 Personal\nDie Kundenbetreuung ist aktuell unterbesetzt, weil viele Kollegen krank sind. Auch in der Personalabteilung herrscht ein hoher Krankenstand. Krankmeldungen aus allen Abteilungen sollen deshalb vorübergehend direkt an JM gesendet werden.\nUrlaubsanträge können im Moment nur im Falle dringender persönlicher Angelegenheiten genehmigt werden. Aufgrund des hohen Krankenstands mussten einige Kollegen in den letzten Monaten besonders viele Überstunden machen, die möglichst bis zum Ende des Kalenderjahres abgebaut werden sollten. Sollte dies aufgrund des hohen Arbeitspensums nicht möglich sein, können die Überstunden auch in das nächste Jahr übertragen werden.\nHerr Wortmann aus dem Verkauf geht am 1. Februar des nächsten Jahres in den Ruhestand. Sein Nachfolger wird KM, den Herr Wortmann ab sofort einarbeitet. Im Rahmen der Neujahrsfeier wird unser langjähriger Mitarbeiter verabschiedet. Wir möchten ihm zum Abschied eine Freude machen. Ideen hierzu bitte an JM, die anschließend das Geld einsammeln und das Geschenk besorgen wird.\nZum 1. Dezember beginnen drei neue Mitarbeiter in der Produktion, da die Verkaufszahlen stark gestiegen sind.\nTOP 3 Kundenbindung, Rabattaktion\nKM hat erfahren, dass der Wettbewerber Lutz GmbH für das Frühjahr eine Rabattaktion plant. RL schlägt vor, ebenfalls eine Kampagne zur Kundenbindung zu entwickeln. KM hat hierfür bereits einen ersten Entwurf für ein Konzept ausgearbeitet und legt diesen vor. Er schlägt vor, das Konzept in einer kleineren Runde zu diskutieren. Wer Interesse hat, an diesem Brainstorming teilzunehmen, soll sich bis zum Ende der Woche bei KM melden.\nTOP 4 Vorbereitungen der Messe\nIm nächsten Jahr wird unsere Firma erstmals an der Frühjahrsmesse in Dresden teilnehmen, die vom 20.-24. April stattfindet. MB aus der Marketingabteilung berichtet, dass bereits der Standplatz gebucht und der Messebauer beauftragt ist. Interessierte können sich die Standgestaltung im Büro von MB ansehen. Auch die Broschüren zu unserem Messeauftritt sind bereits im Druck und können in der 2. KW an unsere Kunden verschickt werden. Abschließend bittet MB JM, externes Standpersonal und Hotelzimmer für die Mitarbeiter zu buchen, die auf die Messe gehen.\nTOP 5 Neujahrsfeier\nJM berichtet, dass am 7. Januar die Neujahrsfeier im Restaurant „Zum Schwan\" stattfindet. Die Einladungen und Menüvorschläge werden verschickt. Alle Mitarbeiter sollen bis zum 15. Dezember Bescheid sagen, mit wie vielen Personen sie teilnehmen und was sie essen möchten. Die Geschäftsführung hat auch eine kleine Überraschung für die Mitarbeiter an diesem Abend geplant.\nTOP 6 Sonstiges\nAW informiert über Renovierungsarbeiten im ersten Stock, die für die nächste Woche geplant sind. Die Firma Buntschuh wird die Wände in der Teeküche Montag und Dienstag nächster Woche streichen. Da die Küche dafür komplett ausgeräumt werden muss, werden die Mitarbeiter gebeten, bei dieser Gelegenheit persönliche Gegenstände wie zum Beispiel nicht firmeneigene Kaffeetassen, Brotdosen und Ähnliches bis Donnerstag an sich zu nehmen. Ansonsten werden diese durch AW entsorgt.", "items": [{"n": 14, "type": "choice", "prompt": "Bei der Sitzung wird", "options": [{"key": "a", "text": "das Protokoll der letzten Besprechung geändert."}, {"key": "b", "text": "die Tagesordnung genehmigt."}, {"key": "c", "text": "über Personalthemen gesprochen."}], "answer": "c", "confidence": "hoch", "quote": "Das Protokoll des Meetings vom 14. November wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt.", "explain": "Correcto c: el punto 2 del orden del día («TOP 2 Personal») se dedica íntegramente a asuntos de personal (bajas por enfermedad, vacaciones, horas extras, jubilación de Herr Wortmann, nuevas incorporaciones). a es falso porque el acta se aprueba «ohne weitere Änderungen und Ergänzungen», es decir, sin cambios. b también es falso: lo que se aprueba es el acta de la reunión anterior, no el orden del día (que solo se enumera)."}, {"n": 15, "type": "choice", "prompt": "Einige Mitarbeiter machen Überstunden,", "options": [{"key": "a", "text": "da andere Urlaub machen."}, {"key": "b", "text": "obwohl sie krank sind."}, {"key": "c", "text": "weil viele Kollegen krank sind."}], "answer": "c", "confidence": "hoch", "quote": "Aufgrund des hohen Krankenstands mussten einige Kollegen in den letzten Monaten besonders viele Überstunden machen", "explain": "Correcto c: el texto justifica expresamente las horas extras con el alto índice de bajas («Aufgrund des hohen Krankenstands mussten einige Kollegen … besonders viele Überstunden machen»), y antes ha explicado que muchos compañeros están enfermos. a es falso: las vacaciones no son la causa, sino que precisamente se restringen («Urlaubsanträge können im Moment nur im Falle dringender persönlicher Angelegenheiten genehmigt werden»). b invierte los términos: quien está de baja no hace horas extras, son los demás quienes las asumen."}, {"n": 15, "type": "choice", "prompt": "Aufgrund des hohen Krankenstands", "options": [{"key": "a", "text": "bleibt die Arbeit teilweise unerledigt."}, {"key": "b", "text": "müssen die Überstunden im kommenden Jahr abgebaut werden./ müssen die Überstunden ins kommende Jahr mitgenommen werden."}, {"key": "c", "text": "gibt es eine Urlaubssperre."}], "answer": "c", "confidence": "hoch", "quote": "Urlaubsanträge können im Moment nur im Falle dringender persönlicher Angelegenheiten genehmigt werden.", "explain": "Segunda redacción del ítem 15 («новый вариант вопроса»). Correcto c: el acta dice que en ese momento las solicitudes de vacaciones solo se aprueban en caso de asuntos personales urgentes, lo que equivale a una congelación de vacaciones; el propio encabezado del acta lo anuncia con la palabra «Urlaubssperre». a es una consecuencia verosímil («Die Kundenbetreuung ist aktuell unterbesetzt»), pero el texto no afirma en ningún momento que el trabajo quede sin hacer. b es falso: las horas extras deben reducirse preferiblemente antes de fin de año («möglichst bis zum Ende des Kalenderjahres abgebaut werden sollten») y solo si no es posible se trasladan al año siguiente, no al revés."}, {"n": 16, "type": "choice", "prompt": "KM", "options": [{"key": "a", "text": "ist Wettbewerber der Firma."}, {"key": "b", "text": "möchte sein Konzept besprechen."}, {"key": "c", "text": "plant eine Rabattaktion im Frühling."}], "answer": "b", "confidence": "hoch", "quote": "KM hat hierfür bereits einen ersten Entwurf für ein Konzept ausgearbeitet und legt diesen vor. Er schlägt vor, das Konzept in einer kleineren Runde zu diskutieren.", "explain": "Correcto b: KM presenta su borrador de concepto y propone discutirlo en un grupo reducido («in einer kleineren Runde zu diskutieren»). a es falso: el competidor es la empresa externa «Lutz GmbH», y KM es el jefe de Ventas de la propia firma. c es falso porque quien planea la acción de descuento para la primavera es el competidor, no KM."}, {"n": 17, "type": "choice", "prompt": "Die Firma", "options": [{"key": "a", "text": "besucht die Frühjahrsmesse regelmäßig."}, {"key": "b", "text": "braucht Hilfe bei der Standgestaltung."}, {"key": "c", "text": "lässt gerade Broschüren drucken."}], "answer": "c", "confidence": "hoch", "quote": "Auch die Broschüren zu unserem Messeauftritt sind bereits im Druck und können in der 2. KW an unsere Kunden verschickt werden.", "explain": "Correcto c: los folletos para la feria «sind bereits im Druck», es decir, están en imprenta en este momento. a es falso porque la empresa participará por primera vez («Im nächsten Jahr wird unsere Firma erstmals an der Frühjahrsmesse in Dresden teilnehmen»), luego no es una cita habitual. b es falso: el stand ya está reservado y el montador contratado («bereits der Standplatz gebucht und der Messebauer beauftragt ist»); lo único que se ofrece es poder ver el diseño del stand en la oficina de MB."}, {"n": 18, "type": "choice", "prompt": "Persönliche Gegenstände", "options": [{"key": "a", "text": "können nicht in der Küche bleiben."}, {"key": "b", "text": "sollen am Donnerstag mitgenommen werden."}, {"key": "c", "text": "sollen weggeworfen werden."}], "answer": "b", "confidence": "mittel", "quote": "werden die Mitarbeiter gebeten, bei dieser Gelegenheit persönliche Gegenstände wie zum Beispiel nicht firmeneigene Kaffeetassen, Brotdosen und Ähnliches bis Donnerstag an sich zu nehmen. Ansonsten werden diese durch AW entsorgt.", "explain": "Correcto b: se pide a los empleados que recojan sus objetos personales «bis Donnerstag», o sea, con ese plazo concreto. c es falso como norma general porque el texto solo prevé tirarlos «ansonsten», esto es, si nadie los retira. a es una lectura parcialmente defendible (la cocina debe vaciarse por completo para pintarla), pero el acta no formula esa prohibición: lo que hace es fijar la obligación de retirarlos antes del jueves; de ahí la confianza media."}]}, {"id": "t4_c-p53", "label": "Variante 4 (Protokoll 15.04.2003)", "page": 53, "note": "Acta de la reunión del 15.04.2003: el texto ocupa las pp. 53-54 y las preguntas 14-18 están al final de la p. 54, de modo que no deben confundirse con las de la variante anterior (p. 52).", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(neue Werbestrategie, Jobticket)\nProtokoll 15.04.2003, 14:00-16:00 Uhr\nTagungsraum: 256, Ort: Geschwister-Scholl-Platz 12, 10738 Berlin\nAnwesende: Petra Kramer (PK, Geschäftsleitung), Yvonne Schmidt (YS, Assistenz der Geschäftsleitung), Thorsten Klein (TK, Leitung Einkauf), Sonja Kühl (SK, Leitung Finanzen), Jenny Mitschke (JM, Leitung Marketing), Ilkay Ergün (IE, Leitung Produktion), Johannes Schön (JS, Leitung Personal)\nGast: Jonas Braun (Deutsches Rotes Kreuz)\nSitzungsleitung: Johannes Schön\nProtokollantin: Yvonne Schmidt\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des Protokolls der letzten Sitzung\n2. Neue Werbemaßnahmen\n3. Beschwerden über schlecht geputzte Büros\n4. Fortbildung der Ersthelfer\n5. Einführung eines Jobtickets\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung des Protokolls der letzten Sitzung\nJS begrüßt alle Anwesenden und stellt den Gast Jonas Braun vom Deutschen Roten Kreuz vor. Weiterhin bittet er um die Genehmigung des Protokolls der letzten Sitzung. SK merkt an, dass das Datum des diesjährigen Sommerfests falsch im letzten Protokoll festgehalten wurde. Dieses findet am 19.07. statt. Die Änderung wird aufgenommen, ansonsten wird das Protokoll genehmigt.\nTOP 2 Neue Werbemaßnahmen\nJM berichtet, dass die Marketingabteilung eine neue Werbestrategie entwickelt hat, um die Verkaufszahlen wieder zu verbessern. SK hatte in der letzten Sitzung berichtet, dass sie seit Januar dieses Jahres stetig zurückgegangen sind.\nUm langfristige Lösungen zu finden, wurde eine Marktanalyse in Auftrag gegeben. Bevor die Ergebnisse vorliegen, sollen aber bereits erste Maßnahmen ergriffen werden. Ein IT-Mitarbeiter erarbeitet zurzeit ein Konzept, um die Homepage der Firma etwas moderner und benutzerfreundlicher zu gestalten. Außerdem sollte man unsere Homepage möglichst auf der ersten Seite in der Suchmaschine finden können. Diese Maßnahmen wären relativ schnell und kostengünstig umsetzbar.\nAuch die Präsenz in den sozialen Medien soll weiter ausgebaut werden, um die jüngere Zielgruppe noch besser zu erreichen. JM schlägt in diesem Zusammenhang vor, kurze, unterhaltsame Werbevideos zu drehen. Für deren Produktion wurde ein Filmteam angefragt, das auf dem Markt sehr erfolgreich, aber auch sehr teuer ist. PK beauftragt JM, bis zur nächsten Sitzung noch andere, günstigere Filmteams über Produktion zu prüfen.\nTOP 3 Beschwerden über schlecht geputzte Büros\nSeit der Zusammenarbeit mit der neuen Reinigungsfirma beschweren sich viele Kollegen aus verschiedenen Abteilungen darüber, dass die tägliche Reinigung der Büros unzureichend ausgeführt wird. Kritikpunkte sind schmutzige Tische, unregelmäßig geleerte Mülleimer und unordentlich gesaugte Fußböden. Dazu kommt, dass die Reinigungskräfte bei Eintreffen der Mitarbeiter gegen 9 Uhr noch anwesend sind, obwohl die Reinigungsarbeiten bis 8.30 Uhr abgeschlossen sein sollten. JS soll Kontakt zur Reinigungsfirma aufnehmen, um das Problem zu besprechen. Sollte es zu keiner Änderung kommen, wird der Vertrag fristlos gekündigt.\nTOP 4 Fortbildung der Ersthelfer\nUnsere Ersthelfer müssen regelmäßig Fortbildungen besuchen. Dafür konnten wir Jonas Braun vom Deutschen Roten Kreuz als Kursleiter gewinnen, der zusammen mit JS aus der Personalabteilung Samstag, den 10.06. als Termin festgelegt hat. Das Training dauert neun Stunden. Es wird bei uns im Haus stattfinden und als Arbeitszeit angerechnet. Die Teamleiter sollen möglichst bald klären, ob die bisherigen Ersthelfer diese Funktion weiter übernehmen möchten oder ob es neue Interessenten gibt. Jonas Braun weist allerdings darauf hin, dass die Teilnehmerzahl auf acht Personen beschränkt ist. Die interessierten Mitarbeiter müssen sich bis zum 15.05. in der Personalabteilung anmelden.\nTOP 5 Einführung eines Jobtickets\nPK teilt mit, dass aufgrund der schwierigen Parksituation mehr Mitarbeiter dazu animiert werden sollen, öffentliche Verkehrsmittel zu nutzen. Aus diesem Grund wird sich die Firma an den Fahrtkosten der Beschäftigten in Form von Jobtickets beteiligen. Das bedeutet, dass Mitarbeiter ab dem 01.07. zu ihrer Monatskarte einen Zuschuss von 50 Prozent, maximal aber 60 Euro erhalten.\nAntragsformulare sind bei JS erhältlich. Er steht auch für Fragen zur Verfügung.\nTOP 6 Sonstiges\nTK berichtet, dass sich die Lieferzeiten unseres Zulieferers wieder normalisiert haben. Die Ursache der Verzögerungen war ein Mitarbeiterstreik in der Partnerfirma in Litauen, der aber inzwischen beigelegt wurde.\nJS teilt mit, dass von den vier neu eingestellten Mitarbeitern einer die Probezeit nicht beendet hat und seit dem 01.04. nicht mehr in der Firma tätig ist.", "items": [{"n": 14, "type": "choice", "prompt": "Die neue Werbestrategie", "options": [{"key": "a", "text": "beinhaltet ein Video über die Produktionsabläufe."}, {"key": "b", "text": "ist wegen der schlechten Verkaufszahlen notwendig."}, {"key": "c", "text": "lässt sich sehr schnell und kostengünstig umsetzen."}], "answer": "b", "confidence": "hoch", "quote": "JM berichtet, dass die Marketingabteilung eine neue Werbestrategie entwickelt hat, um die Verkaufszahlen wieder zu verbessern. SK hatte in der letzten Sitzung berichtet, dass sie seit Januar dieses Jahres stetig zurückgegangen sind.", "explain": "Correcto b: la estrategia publicitaria nace precisamente para mejorar unas cifras de ventas que llevan cayendo desde enero («um die Verkaufszahlen wieder zu verbessern … stetig zurückgegangen»). a es falso: los vídeos publicitarios son breves y entretenidos y van destinados a las redes sociales para captar al público joven, no tratan de los procesos de producción. c es falso por un detalle de referencia: «Diese Maßnahmen wären relativ schnell und kostengünstig umsetzbar» se refiere solo a las medidas para la página web; además el equipo de filmación contratado es «sehr teuer» y PK encarga buscar alternativas más baratas."}, {"n": 15, "type": "choice", "prompt": "Die Reinigungsfirma", "options": [{"key": "a", "text": "hält sich nicht an die vereinbarten Putzzeiten."}, {"key": "b", "text": "putzt die Büros der Firma nicht regelmäßig."}, {"key": "c", "text": "wird den Vertrag demnächst kündigen."}], "answer": "a", "confidence": "hoch", "quote": "Dazu kommt, dass die Reinigungskräfte bei Eintreffen der Mitarbeiter gegen 9 Uhr noch anwesend sind, obwohl die Reinigungsarbeiten bis 8.30 Uhr abgeschlossen sein sollten.", "explain": "Correcto a: el personal de limpieza sigue en el edificio hacia las 9 h aunque los trabajos deben estar terminados a las 8.30 h, es decir, no respeta el horario acordado. b es falso: la limpieza sí se hace a diario («die tägliche Reinigung der Büros»), lo que ocurre es que es insuficiente; el «unregelmäßig» del texto se refiere solo a los cubos de basura que no siempre se vacían. c invierte los papeles: quien amenaza con rescindir el contrato sin preaviso es la propia empresa («Sollte es zu keiner Änderung kommen, wird der Vertrag fristlos gekündigt»), no la empresa de limpieza."}, {"n": 16, "type": "choice", "prompt": "Die Fortbildung für Ersthelfer", "options": [{"key": "a", "text": "ist nur mit begrenzter Teilnehmerzahl möglich."}, {"key": "b", "text": "müssen die Teilnehmer nur einmal absolvieren."}, {"key": "c", "text": "wird beim Deutschen Roten Kreuz veranstaltet."}], "answer": "a", "confidence": "hoch", "quote": "Jonas Braun weist allerdings darauf hin, dass die Teilnehmerzahl auf acht Personen beschränkt ist.", "explain": "Correcto a: el número de participantes está limitado a ocho personas. b es falso: los primeros auxilios exigen formación continua («Unsere Ersthelfer müssen regelmäßig Fortbildungen besuchen»), no una sola vez. c es falso: Jonas Braun, del DRK, actúa como ponente, pero el curso se celebra en la propia empresa («Es wird bei uns im Haus stattfinden»)."}, {"n": 17, "type": "choice", "prompt": "Das Jobticket", "options": [{"key": "a", "text": "soll zu 60 Prozent finanziert werden."}, {"key": "b", "text": "kann in der Personalabteilung beantragt werden."}, {"key": "c", "text": "wird ab nächsten Monat eingeführt."}], "answer": "b", "confidence": "hoch", "quote": "Antragsformulare sind bei JS erhältlich. Er steht auch für Fragen zur Verfügung.", "explain": "Correcto b: los formularios de solicitud se obtienen en JS, que es «Johannes Schön (JS, Leitung Personal)», es decir, en la dirección de Personal. a confunde las cifras: la subvención es del 50 por ciento con un máximo de 60 euros. c es falso: el abono entra en vigor «ab dem 01.07.», mientras que el acta es del 15.04.2003, de modo que no es el mes siguiente."}, {"n": 18, "type": "choice", "prompt": "Der Streik in Litauen", "options": [{"key": "a", "text": "dauert immer noch an."}, {"key": "b", "text": "fand landesweit statt."}, {"key": "c", "text": "führte zu Lieferproblemen."}], "answer": "c", "confidence": "hoch", "quote": "Die Ursache der Verzögerungen war ein Mitarbeiterstreik in der Partnerfirma in Litauen, der aber inzwischen beigelegt wurde.", "explain": "Correcto c: la huelga fue la causa de los retrasos en las entregas, que ahora ya se han normalizado. a es falso porque la huelga «inzwischen beigelegt wurde», ya se ha resuelto. b es falso: fue una huelga de trabajadores «in der Partnerfirma in Litauen», es decir, en la empresa asociada, no en todo el país."}]}, {"id": "t4_d-p55", "label": "Variante 5 (Protokoll 05.02.20XX)", "page": 55, "note": "Acta de la reunión del 05.02.20XX (pp. 55-56): el texto ocupa la p. 55 y el comienzo de la p. 56, y las preguntas 14-18 aparecen al final de la p. 56. No deben confundirse con las de la variante siguiente, cuyas preguntas están al final de la p. 58. El ítem 15 se apoya en el TOP 5, que en el acta se adelantó por petición de KW.", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(Frau Wagner, Kantine)\n\nProtokoll 05.02.20XX, 14.00 - 16.00 Uhr\nSitzungsraum: 239, Ort: Hauptstraße 23, 25421 Pinneberg\nAnwesende: Michael Müller (MM, Stellvertreter Geschäftsleitung), Katrin Wagner (KW, Leitung Personal), Henry Smith (HS, Leitung Produktion), Tomás Rodríguez (TR, Leitung Vertrieb), Manuela Hinz (MH, Leitung Qualitätsmanagement), Karl Lehmann (KL, Leitung Finanzen), Sabine Kurz (SK, Hausverwaltung)\nSitzungsleitung: Michael Müller\nProtokollantin: Katrin Wagner\n\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Probleme bei der Warenauslieferung\n3. Berichte\n4. Sanierung der Kantine\n5. Neue Krankmeldungsregelung\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nMM heißt alle Anwesenden zur heutigen Besprechung willkommen und bittet um die Genehmigung des Protokolls der letzten Sitzung. Per Handzeichen wird das Protokoll der Sitzung vom 08.01. ohne weitere Änderungen und Ergänzungen einstimmig genehmigt. Aufgrund terminlicher Verpflichtungen muss KW die Sitzung früher verlassen und bittet darum, TOP 5 der heutigen Tagesordnung vorzuziehen. Das wird einstimmig angenommen.\n\nTOP 2 Probleme bei der Warenauslieferung\nTR teilt mit, dass sich immer wieder Kunden über den Zustand unserer gelieferten Waren beschwert haben. Auf dem Transportweg kommt es wohl immer wieder zu Beschädigungen der Verpackungen, sodass die Ware teilweise gar nicht oder nur zu stark reduzierten Preisen an den Endkunden verkauft werden kann. Man habe mit der Spedition schon öfter über diese Problematik gesprochen. Diese sieht das Problem jedoch bei uns und ist der Ansicht, dass die Schäden durch minderwertiges Verpackungsmaterial entstehen und nicht durch den Transport. MH und HS haben das Verpackungsmaterial überprüft und weisen den Vorwurf vehement zurück. Nachdem das Problem bis heute nicht gelöst werden konnte, macht MH den Vorschlag, dass unsere Firma die Lieferungen in Zukunft selbst übernimmt. Dafür werden KL und TR zusammen ein Konzept zur Finanzierung erarbeiten. Dieses soll zur übernächsten Sitzung in zwei Monaten vorliegen.\n\nTOP 3 Berichte\nHS berichtet, dass durch die Einstellung von zehn Zeitarbeitskräften am Fließband 3 und 4 der personelle Engpass für den Moment behoben werden konnte, und dankt der Personalabteilung für die prompte und unbürokratische Lösung des Problems. Er regt an, um die Unterbesetzung in der Produktion dauerhaft zu lösen, einige Zeitarbeitskräfte fest anzustellen. Insbesondere Herr Ahmed Hassani und Frau Ina Zurek sind ihm durch ihre Zuverlässigkeit und schnelle Auffassungsgabe positiv aufgefallen.\n\nTOP 4 Sanierung der Kantine\nSK macht darauf aufmerksam, dass die Küche ab dem kommenden Montag saniert wird und die Kantine infolgedessen voraussichtlich sechs bis acht Wochen geschlossen sein wird. Alle Abteilungsleiter sollen ihre Teams daran erinnern, sich selbst Verpflegung mitzubringen oder alternativ das Bistro „Suppenkasper“ in der Sonnenstraße zu nutzen. Die Essensmarken der Firma gelten während der Kantinenschließung auch dort in der Mittagszeit von 12.00 bis 14.00 Uhr.\n\nTOP 5 Neue Krankmeldungsregelung (vorgezogener TOP)\nDie Geschäftsleitung hatte in der letzten Mitarbeiterversammlung angekündigt, dass die Mitarbeiter zukünftig schon ab dem ersten Krankheitstag einen Krankenschein vom Arzt benötigen. Die bisherige Regelung ab dem dritten Tag berichtet, dass diese Entscheidung in der Belegschaft für großen Unmut sorgt. Sie bittet alle Abteilungsleiter ein weiteres Mal, den Sinn dieser Maßnahme zu erläutern. In der nächsten Sitzung soll das Thema noch einmal behandelt werden. Man hofft auf eine breite Akzeptanz.\n\nTOP 6 Sonstiges\nMM teilt mit, dass ab dem kommenden Monat für die Autofahrer mehr Parkplätze zur Verfügung stehen. Diese entstehen neben dem Eingang C. Alle Mitarbeiterinnen und Mitarbeiter sollen in einer Rundmail darüber informiert werden und wer Interesse hat, kann in der Personalabteilung einen kostenlosen Stellplatz beantragen.", "items": [{"n": 14, "type": "choice", "prompt": "Frau Wagner", "options": [{"key": "a", "text": "bittet um Änderungen des Protokolls vom 08.01."}, {"key": "b", "text": "hat heute noch einen anderen wichtigen Termin."}, {"key": "c", "text": "schlägt einen zusätzlichen Tagesordnungspunkt vor."}], "answer": "b", "confidence": "hoch", "quote": "Aufgrund terminlicher Verpflichtungen muss KW die Sitzung früher verlassen und bittet darum, TOP 5 der heutigen Tagesordnung vorzuziehen.", "explain": "Correcto b: KW (Katrin Wagner, Leitung Personal) tiene otros compromisos de agenda («terminliche Verpflichtungen») y por eso tiene que abandonar la reunión antes de tiempo, es decir, hoy todavía tiene otro compromiso importante. a es falso: quien pide la aprobación del acta es MM y el acta del 08.01. se aprueba «ohne weitere Änderungen und Ergänzungen», o sea, sin ningún cambio. c es falso: no propone un punto nuevo, sino adelantar uno que ya figura en el orden del día, el TOP 5."}, {"n": 15, "type": "choice", "prompt": "Die Geschäftsleitung möchte, dass", "options": [{"key": "a", "text": "das Thema Krankmeldung nicht mehr besprochen wird."}, {"key": "b", "text": "man bei Krankheit spätestens am dritten Tag zum Arzt geht."}, {"key": "c", "text": "sich Mitarbeiter bei Krankheit sofort krankschreiben lassen."}], "answer": "c", "confidence": "hoch", "quote": "Die Geschäftsleitung hatte in der letzten Mitarbeiterversammlung angekündigt, dass die Mitarbeiter zukünftig schon ab dem ersten Krankheitstag einen Krankenschein vom Arzt benötigen.", "explain": "Correcto c: la dirección exige el parte médico ya desde el primer día de enfermedad, es decir, que el empleado se haga dar la baja inmediatamente al enfermar. b reproduce justamente la norma anterior que se quiere sustituir («Die bisherige Regelung ab dem dritten Tag»), y por eso es un distractor: el «spätestens am dritten Tag» es el sistema viejo, no el deseado. a es falso porque el asunto no se archiva: «In der nächsten Sitzung soll das Thema noch einmal behandelt werden»."}, {"n": 16, "type": "choice", "prompt": "Karl Lehmann soll", "options": [{"key": "a", "text": "besseres Verpackungsmaterial einkaufen."}, {"key": "b", "text": "einen Finanzierungsplan erstellen."}, {"key": "c", "text": "Kontakt mit der Spedition aufnehmen."}], "answer": "b", "confidence": "hoch", "quote": "Dafür werden KL und TR zusammen ein Konzept zur Finanzierung erarbeiten. Dieses soll zur übernächsten Sitzung in zwei Monaten vorliegen.", "explain": "Correcto b: para que la empresa asuma ella misma las entregas, KL (Karl Lehmann, Leitung Finanzen) y TR deben elaborar conjuntamente un concepto de financiación, con plazo fijado («zur übernächsten Sitzung in zwei Monaten»). a es falso: la acusación de que el material de embalaje es de mala calidad la formula la agencia de transportes y MH y HS la rechazan «vehement»; nadie recibe el encargo de comprar material nuevo. c es falso porque el contacto con la agencia ya existe: «Man habe mit der Spedition schon öfter über diese Problematik gesprochen»."}, {"n": 17, "type": "choice", "prompt": "In der Produktionsabteilung", "options": [{"key": "a", "text": "gibt es derzeit genügend Mitarbeiter."}, {"key": "b", "text": "will man alle Zeitarbeiter fest anstellen."}, {"key": "c", "text": "wurden zwei neue Mitarbeiter fest eingestellt."}], "answer": "a", "confidence": "hoch", "quote": "durch die Einstellung von zehn Zeitarbeitskräften am Fließband 3 und 4 der personelle Engpass für den Moment behoben werden konnte", "explain": "Correcto a: la contratación de diez trabajadores temporales en las cintas 3 y 4 ha resuelto la falta de personal «für den Moment», de modo que ahora mismo hay plantilla suficiente. b falla por una palabra clave: el acta dice «einige Zeitarbeitskräfte fest anzustellen» (algunos), no todos. c es falso: Herr Ahmed Hassani y Frau Ina Zurek solo han llamado la atención positivamente («sind ihm … positiv aufgefallen»); los diez incorporados lo fueron como Zeitarbeitskräfte y no consta ninguna contratación fija."}, {"n": 18, "type": "choice", "prompt": "In der Kantine", "options": [{"key": "a", "text": "bekommt man in den kommenden Wochen kein Essen."}, {"key": "b", "text": "kann man ab Montag von 12 bis 14 Uhr zu Mittag essen."}, {"key": "c", "text": "sollten die Essensmarken abgeschafft werden."}], "answer": "a", "confidence": "hoch", "quote": "dass die Küche ab dem kommenden Montag saniert wird und die Kantine infolgedessen voraussichtlich sechs bis acht Wochen geschlossen sein wird", "explain": "Correcto a: la cocina se reforma a partir del próximo lunes y, como consecuencia, la cantina permanecerá cerrada entre seis y ocho semanas; durante esas semanas, por tanto, en la cantina no se sirve comida. b traslada a la cantina lo que vale para el bistró: el horario de 12.00 a 14.00 y el uso de los vales se refieren al Bistro «Suppenkasper» de la Sonnenstraße durante el cierre, no a la cantina, que está cerrada. c es falso: el acta no pide suprimir los vales, sino que confirma que siguen valiendo en ese establecimiento («Die Essensmarken der Firma gelten während der Kantinenschließung auch dort»)."}]}, {"id": "t4_d-p57", "label": "Variante 6 (Protokoll 27.08.20XX)", "page": 57, "note": "Acta de la reunión del 27.08.20XX (pp. 57-58): el texto ocupa la p. 57 y el comienzo de la p. 58, y las preguntas 14-18 aparecen al final de la p. 58. Aviso: el ítem 14 admite dos lecturas válidas (a y b), tal como se explica en su campo explain. El original etiqueta esta variante como «тест №150321, 150301».", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "(Frau Bruhns, Betriebsausflug)\n\nProtokoll 27.08.20XX, 10.00 bis 11.30 Uhr\nKonferenzraum Rhein-Main, Am Wegesrand 12, 63345 Frankfurt\nAnwesende: Thomas Köhler (TK, Werkstatt), Brigitte Turner (BT, Personal), Gerd Schneider (GS, Buchhaltung), Hilde Bruhns (HB, Buchhaltung)\nEntschuldigt: Kari Muster (KM, Lager)\nSitzungsleitung: Gerd Schneider\nProtokollführung: Thomas Köhler\n\nTagesordnungspunkte:\n1. Begrüßung und Eröffnung der Sitzung\n2. Erste-Hilfe-Kurs\n3. Homeoffice\n4. Personelle Engpässe Buchhaltung\n5. Betriebsausflug\n6. Sonstiges\n\nTOP 1 Begrüßung und Eröffnung der Sitzung\nGS eröffnet die Sitzung, begrüßt alle Anwesenden und stellt den Kolleg*innen Hilde Bruhns vor, die seit dem 1. August in der Abteilung Buchhaltung für die Auszahlung der Gehälter etc. zuständig ist.\n\nTOP 2 Erste-Hilfe-Kurs\nTK berichtet, dass es vor Kurzem zu einem Unfall in der Werkstatt gekommen ist, bei dem ein Kollege am Arm verletzt wurde und stark geblutet hat. Obwohl regelmäßig Sicherheitsunterweisungen für die Mitarbeitenden im Lager und in der Werkstatt stattfinden, reagierte nur ein Kollege ruhig und besonnen und war in der Lage, den Verletzten zu versorgen und dann Hilfe zu holen. Die anderen wussten nicht, was sie tun sollten. Auch in der Marketingabteilung gab es eine Situation, in der einer Kollegin wohl wegen der Hitze schwindlig wurde und ein Krankenwagen gerufen werden musste, da niemand von den Mitarbeiter*innen helfen konnte.\nTK schlägt deshalb vor, einen Erste-Hilfe-Kurs im Unternehmen zu organisieren, an dem alle interessierten Angestellten teilnehmen können. TK hat bereits mit dem Roten Kreuz gesprochen. Es wäre möglich, dort kurzfristig einen solchen Kurs an zwei Freitagsterminen zu buchen.\n\nTOP 3 Homeoffice\nBT stellt dar, dass immer wieder Mitarbeiter*innen den Wunsch an sie herantragen, den einen oder anderen Tag in der Woche von zu Hause aus zu arbeiten, wenn sie Aufgaben zu erledigen haben, die eine Anwesenheit im Büro nicht unbedingt erforderlich machen.\nBT steht diesem Wunsch offen gegenüber. Durch diese Möglichkeit könnten die Mitarbeiter*innen die Zeit für den Arbeitsweg sparen und sich ihre Arbeitszeit flexibler einteilen. Das würde sicher erheblich zur Mitarbeiterzufriedenheit beitragen. Den Mitarbeiter*innen, die im Homeoffice arbeiten, müssten firmeneigene Laptop, Diensthandys zur Verfügung gestellt werden. Da aber bereits einige mobile Geräte im Unternehmen vorhanden sind, würde das keine signifikanten Mehrkosten bedeuten. Sollte sich das Arbeitsmodell „Homeoffice“ bewähren, könnte für die Kolleg*innen die regelmäßig von zu Hause aus arbeiten, ein VPN-Tunnel eingerichtet werden, durch den sie sicheren Zugang zu den Daten auf dem Firmenserver erhalten würden.\nBT bittet bis Mitte der nächsten Woche um Rückmeldungen, was die einzelnen Abteilungsleiter*innen davon halten, bevor sie den Vorschlag der Geschäftsführung vorlegt.\n\nTOP 4 Personelle Engpässe in der Buchhaltung\nGS teilt mit, dass die Buchhaltung zur Zeit trotz der Neueinstellung von Frau Bruhns personell unterbesetzt ist.\nDas Arbeitsaufkommen ist von den derzeit drei Mitarbeiter*innen in der Abteilung nicht mehr zu bewältigen. Im Moment ist auch noch eine Kollegin krank, sodass das verbleibende Kolleg*innen viele Überstunden machen müssen, um die Arbeit zu schaffen. Er plant, eine weitere Mitarbeiterin oder ein weiteren Mitarbeiter einzustellen.\n\nTOP 5 Betriebsausflug\nHB arbeitet im diesjährigen Team für die Organisation des Betriebsausflugs mit, um so gleich einige Kolleg*innen kennenzulernen. Sie berichtet, dass der Ausflug am 1. Oktober stattfindet. Alle Mitarbeiter*innen treffen sich morgens um 9.00 Uhr vor dem Haupteingang der Firma. Dort werden sie von einem Bus abgeholt und zum Kastell Saalburg gefahren.\nVom Parkplatz am Fuße der Burg aus ist eine kleine Wanderung geplant. Am Ziel wartet eine Überraschung. Für das leibliche Wohl ist gesorgt. Die Rückkehr zur Firma ist für 19.00 Uhr gleichen Tag vorgesehen.\n\nTOP 6 Sonstiges\nEntfällt. Keiner der Anwesenden hat noch Punkte zu besprechen.", "items": [{"n": 14, "type": "choice", "prompt": "Frau Bruhns", "options": [{"key": "a", "text": "arbeitet seit einigen Wochen in der Buchhaltung."}, {"key": "b", "text": "bezahlt die Gehälter der Mitarbeiter*innen."}, {"key": "c", "text": "nimmt bald ihre Tätigkeit auf."}], "answer": "a", "confidence": "niedrig", "quote": "GS eröffnet die Sitzung, begrüßt alle Anwesenden und stellt den Kolleg*innen Hilde Bruhns vor, die seit dem 1. August in der Abteilung Buchhaltung für die Auszahlung der Gehälter etc. zuständig ist.", "explain": "Correcto a, pero con reservas: el acta es del 27.08.20XX y Frau Bruhns trabaja en el departamento de contabilidad desde el 1 de agosto, es decir, desde hace unas semanas; además el TOP 4 confirma que su incorporación ya se ha producido («trotz der Neueinstellung von Frau Bruhns»). c queda descartado porque ya está en el puesto y no «nimmt bald ihre Tätigkeit auf». Advertencia de ambigüedad: b también está respaldada literalmente por la misma frase («für die Auszahlung der Gehälter etc. zuständig ist»), de modo que el ítem admite dos claves; se elige a porque es el dato más explícito sobre su situación (ya trabaja allí desde el 1 de agosto), pero si la clave oficial fuera b sería igualmente defendible. De ahí la confianza baja."}, {"n": 15, "type": "choice", "prompt": "Der Erste-Hilfe-Kurs", "options": [{"key": "a", "text": "findet jeden Freitag statt."}, {"key": "b", "text": "ist für alle Mitarbeiter*innen verpflichtet."}, {"key": "c", "text": "wird vom Roten Kreuz durchgeführt."}], "answer": "c", "confidence": "hoch", "quote": "TK hat bereits mit dem Roten Kreuz gesprochen. Es wäre möglich, dort kurzfristig einen solchen Kurs an zwei Freitagsterminen zu buchen.", "explain": "Correcto c: el curso se encargaría al Rotes Kreuz, con quien TK ya ha hablado y donde sería posible reservarlo a corto plazo. a distorsiona la cifra: se habla de dos fechas, las dos en viernes («an zwei Freitagsterminen»), no de todos los viernes. b es falso porque el curso es voluntario y solo para quien tenga interés: «an dem alle interessierten Angestellten teilnehmen können»."}, {"n": 16, "type": "choice", "prompt": "Homeoffice", "options": [{"key": "a", "text": "erfordert die Anschaffung neuer Arbeitsgeräte."}, {"key": "b", "text": "verringert die Arbeitszeit der Mitarbeitenden."}, {"key": "c", "text": "wird von vielen Mitarbeitenden gewünscht."}], "answer": "c", "confidence": "hoch", "quote": "BT stellt dar, dass immer wieder Mitarbeiter*innen den Wunsch an sie herantragen, den einen oder anderen Tag in der Woche von zu Hause aus zu arbeiten", "explain": "Correcto c: son los propios empleados quienes una y otra vez le plantean ese deseo a BT («immer wieder … den Wunsch an sie herantragen»). a es falso: aunque habría que facilitar portátiles y móviles de empresa a quienes teletrabajen, el acta subraya que ya hay dispositivos móviles en la empresa y que por eso no habría «signifikante Mehrkosten», luego no hay que adquirir equipos nuevos. b es falso: el teletrabajo ahorra el tiempo de desplazamiento y permite organizar el horario con más flexibilidad, pero no reduce la jornada laboral."}, {"n": 17, "type": "choice", "prompt": "In der Abteilung Buchhaltung", "options": [{"key": "a", "text": "gibt es zu viele Beschäftigte."}, {"key": "b", "text": "sind viele Kolleg*innen erkrankt."}, {"key": "c", "text": "soll eine Stelle ausgeschrieben werden."}], "answer": "c", "confidence": "hoch", "quote": "Er plant, eine weitere Mitarbeiterin oder ein weiteren Mitarbeiter einzustellen.", "explain": "Correcto c: GS anuncia que piensa contratar a otra persona, es decir, que va a crearse o publicarse una plaza más. a es falso: el departamento está «personell unterbesetzt» y el trabajo «ist von den derzeit drei Mitarbeiter*innen in der Abteilung nicht mehr zu bewältigen», luego no sobran empleados. b es falso: solo hay una compañera de baja («Im Moment ist auch noch eine Kollegin krank»), no muchas."}, {"n": 18, "type": "choice", "prompt": "Der Betriebsausflug wird", "options": [{"key": "a", "text": "für den ganzen Tag geplant."}, {"key": "b", "text": "jedes Jahr von den gleichen Personen organisiert."}, {"key": "c", "text": "zum besseren Kennenlernen der Kolleg*innen genutzt."}], "answer": "a", "confidence": "mittel", "quote": "Die Rückkehr zur Firma ist für 19.00 Uhr gleichen Tag vorgesehen.", "explain": "Correcto a: la jornada empieza a las 9.00 h en la puerta principal y el regreso a la empresa está previsto para las 19.00 h del mismo día, de modo que el viaje ocupa el día entero. c es una lectura parcialmente defendible —de ahí la confianza media—, pero el texto solo dice que HB colabora en el equipo organizador «um so gleich einige Kolleg*innen kennenzulernen», esto es, ese es su motivo personal para participar en la organización, no la finalidad del viaje que se atribuye a todos. b es falso: el acta habla del equipo «diesjährigen» (de este año) para la organización, lo que implica que el equipo cambia, no que lo organicen siempre las mismas personas."}]}, {"id": "t4_e-p59", "label": "Variante 7 (Protokoll 15.01.20XX, Erfurt)", "topic": "Kosteneinsparungen, Lagebericht, Betriebsarzt", "page": 59, "note": "Acta de la reunión del 15.01.20XX en Erfurt (pp. 59-60). El original la etiqueta como «тест №140321, 140301».", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Protokoll 15.01.20XX, 10.00 bis 11.30 Uhr\nSitzungsraum 205, Ort: Hauptstraße 27, 99099 Erfurt\nAnwesende: Jakob Müller (JM, Geschäftsleitung), Friedrich Döring (FD, Vertrieb), Karl Altmann (KA, Buchhaltung und Finanzen), Peter Bischoff (PB, Produktion), Karsten Hinz (KH, Logistik), Jana Bartsch (JB, Personal), Beate Fritsch (BF, Marketing), Jonas Stoll (JS, IT-Abteilung).\nSitzungsleitung: Jakob Müller\nProtokollant: Jonas Stoll\n\nTagesordnungspunkte:\n1. Begrüßung und Tagesordnung\n2. Kosteneinsparungen\n3. Lagebericht Produktion\n4. Kündigung des Betriebsarztes\n5. Betriebliche Altersvorsorge\n6. Sonstiges\n\nTOP 1 Begrüßung und Tagesordnung\nJM heißt die Kolleg*innen zur heutigen Besprechung herzlich willkommen und bestätigt die Anwesenheit aller eingeladenen Teilnehmer*innen. Danach erkundigt JM sich, ob noch zusätzliche Themen protokollarisch aufgenommen werden sollen. Hierzu gibt es keine Kommentare und damit gilt die Tagesordnung als genehmigt.\n\nTOP 2 Kosteneinsparungen\nWie JM darstellt, hat sich der Markt im Vergleich zum Vorjahr stark verändert. In diesem Zusammenhang müssen deshalb Kostenstrukturen neu überdacht werden. Es wird vorgeschlagen, die administrativen Kosten zu senken, da es hier Einsparungspotential gibt. Im Vorfeld zu dieser Besprechung wurde JB bereits von der Geschäftsleitung beauftragt, eine exakte Kostenübersicht zu erstellen und Vorschläge zur Kostenreduzierung vorzulegen. JB legt dar, dass die in der Firmenzentrale eingehenden Anrufe auf ein externes Call-Center umgeleitet werden könnten. Verschiedene Kostenvoranschläge wurden hierfür auch schon eingeholt. Die Firma tele-info scheint unseren Ansprüchen am besten gerecht zu werden. Deshalb sollten Vertragsverhandlungen aufgenommen und zeitgleich Schulungspläne für die Call-Center-Mitarbeiter*innen ausgearbeitet werden, um ihnen die Organisationsstruktur des Unternehmens so schnell wie möglich näherzubringen, damit die Arbeit ohne Verzögerung aufgenommen werden kann. Durch die so gewonnene Zeitersparnis am Empfang können Mitarbeiter*innen von dort flexibler eingesetzt werden und zum Beispiel zusätzlich den für das Unternehmer wichtigen Konferenzbereich und die Gästebetreuung übernehmen. JM stimmt den Vorschlägen zu und bittet um Umsetzung der weiteren Schritte.\n\nTOP 3 Lagebericht Produktion\nPB merkt an, dass auch in seiner Abteilung eine Kostenreduzierung möglich wäre, indem unausgewogene Lagerungen von Material und Rohstoffen vermieden werden. Das Lagerungsmanagement ist optimierbar, d.h., dass sowohl zu hohe als auch niedrige Lagermengen vermieden werden müssen, da sie zu unnötigen Kosten führen. Im Fall von Überbeständen muss neue Lagerfläche geschaffen werden und im Fall von Unterbeständen kann es zu kurzfristigen Produktionsausfällen kommen. JM beauftragt PB, sich umgehend zusammen mit KH mit dieser Thematik auseinanderzusetzen und zur nächsten Sitzung konkrete Zahlen und Vorschläge vorzulegen.\n\nTOP 4 Kündigung des Betriebsarztes\nMit Bedauern teilt die Geschäftsleitung mit, dass unser Betriebsarzt die Firma zum Jahresende verlässt, da er eine eigene Praxis eröffnen will. Aus diesem Grund hat sich die Firma entschlossen, die Ersthelferausbildung zu forcieren, damit bei kleineren Verletzungen, die im Produktionsablauf immer wieder auftreten können, sofort eingegriffen werden kann. Ärztliche Unterstützung bekommen wir ab nächstem Jahr von der Allgemeinärztlichen Praxis Dr. Mertens. Die Kontaktdaten werden bekannt gegeben.\n\nTOP 5 Betriebliche Altersvorsorge\nSeit einem Jahr bietet die Firma den Mitarbeiter*innen an, in eine betriebliche Zusatzrente zu investieren. Bisher wird dieses Angebot aber nur von wenigen Kolleg*innen genutzt. Deshalb werden erneut alle Abteilungsleiter*innen darauf hingewiesen, in ihren Abteilungen über diese Möglichkeit der Altersvorsorge aufzuklären. Interessierte Mitarbeiter*innen können in der Personalabteilung genauere Informationen erhalten. Zusätzlich bietet die Versicherungsgesellschaft immer donnerstags eine gesonderte Sprechstunde an, zu der man sich aber anmelden muss.\n\nTOP 6 Sonstiges\nDie Mitarbeiter*innen werden gebeten, im Intranet abzustimmen, ob die Firma in diesem Jahr für alle Kolleg*innen entweder einen eintägigen Betriebsausflug oder ein Sommerfest organisieren soll. Für den Betriebsausflug könnten dann auch gleich Vorschläge unterbreitet werden. Die Abstimmung muss bis zum 31.03 erfolgen, damit für das Organisationskomitee noch ausreichend Zeit für die Planung bleibt.", "items": [{"n": 14, "type": "choice", "prompt": "Bei der Besprechung", "options": [{"key": "a", "text": "müssen weitere Themen besprochen werden."}, {"key": "b", "text": "sind alle Mitarbeiter*innen des Unternehmens anwesend."}, {"key": "c", "text": "wird die Tagesordnung angenommen."}], "answer": "c", "confidence": "hoch", "quote": "Hierzu gibt es keine Kommentare und damit gilt die Tagesordnung als genehmigt.", "explain": "Correcto c: tras preguntar el presidente de la sesión si hay puntos adicionales y no haber comentarios, el orden del día se aprueba («gilt die Tagesordnung als genehmigt»). a es falso porque nadie propuso temas adicionales; b es falso porque solo asisten los directores y jefes de departamento, no toda la plantilla."}, {"n": 15, "type": "choice", "prompt": "Um Kosten zu sparen,", "options": [{"key": "a", "text": "sollen einige Empfangsmitarbeiter*innen in ein Call-Center wechseln."}, {"key": "b", "text": "werden die Aufgaben der Mitarbeitenden am Empfang neu festgelegt."}, {"key": "c", "text": "wird der Empfang demnächst geschlossen."}], "answer": "b", "confidence": "hoch", "quote": "Durch die so gewonnene Zeitersparnis am Empfang können Mitarbeiter*innen von dort flexibler eingesetzt werden und zum Beispiel zusätzlich den für das Unternehmer wichtigen Konferenzbereich und die Gästebetreuung übernehmen.", "explain": "Correcto b: al desviar las llamadas telefónicas entrantes a un centro de llamadas externo, el personal de recepción asume nuevas tareas (atención de visitas y salas de conferencias). a y c son falsos: el personal no se traslada al call center externo ni se cierra la recepción."}, {"n": 16, "type": "choice", "prompt": "Der Lagerbestand muss", "options": [{"key": "a", "text": "an die Produktion angepasst werden."}, {"key": "b", "text": "dauerhaft ausgebaut werden."}, {"key": "c", "text": "kurzfristig reduziert werden."}], "answer": "a", "confidence": "hoch", "quote": "dass sowohl zu hohe als auch niedrige Lagermengen vermieden werden müssen, da sie zu unnötigen Kosten führen.", "explain": "Correcto a: se busca evitar tanto el exceso de existencias (costes de espacio) como la escasez (parones de producción), es decir, equilibrar y ajustar el stock a las necesidades productivas reales. b y c son falsos porque no se pretende ni una reducción drástica ni una ampliación continuada, sino optimización."}, {"n": 17, "type": "choice", "prompt": "Der Betriebsarzt wird", "options": [{"key": "a", "text": "mit Dr. Mertens zusammenarbeiten."}, {"key": "b", "text": "zukünftig selbstständig arbeiten."}, {"key": "c", "text": "zum Jahresende entlassen."}], "answer": "b", "confidence": "hoch", "quote": "dass unser Betriebsarzt die Firma zum Jahresende verlässt, da er eine eigene Praxis eröffnen will.", "explain": "Correcto b: el médico de empresa deja la compañía voluntariamente para abrir su propia consulta («da er eine eigene Praxis eröffnen will»), es decir, para ejercer de forma autónoma/independiente. a es falso porque la consulta del Dr. Mertens asume el servicio médico de la empresa en su sustitución, no en cooperación; c es falso porque no ha sido despedido sino que se marcha voluntariamente."}, {"n": 18, "type": "choice", "prompt": "Die betriebliche Altersvorsorge", "options": [{"key": "a", "text": "kann bei einem vereinbarten Termin besprochen werden."}, {"key": "b", "text": "nehmen viele Mitarbeiter*innen an."}, {"key": "c", "text": "wird neu in der Fima eingeführt."}], "answer": "a", "confidence": "hoch", "quote": "Zusätzlich bietet die Versicherungsgesellschaft immer donnerstags eine gesonderte Sprechstunde an, zu der man sich aber anmelden muss.", "explain": "Correcto a: la aseguradora ofrece consultas los jueves requiriendo cita previa («zu der man sich aber anmelden muss»). b es falso porque el acta subraya que hasta ahora muy pocos empleados se han acogido («nur von wenigen Kolleg*innen genutzt»); c es falso porque el plan lleva ofertándose un año («Seit einem Jahr bietet die Firma...»)."}]}, {"id": "t4_e-p61", "label": "Variante 8 (Protokoll Herbolzen)", "topic": "Marketingmaßnahmen, Einführung Jobticket", "page": 61, "note": "Acta de la reunión en Herbolzen (pp. 61-62). El original la etiqueta como «тест №160201, 160221».", "kind": "text", "intro": "Lesen Sie das Protokoll und die Aufgaben 14–18. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.", "passage": "Protokoll 25.06.20XX\nSitzungsraum: 112, Ort: Ludwigstr. 23, 79342 Herbolzen\nAnwesende: Jan Schneider (JS, Geschäftsleitung), Sabine Faust (SF, Leiterin Marketing), Paul Mayer (PM, Leiter Produktion), Tim Janzen (TJ, Leiter Vertrieb), Chiara Reich (CR, Leiterin IT), Simon Zitzmann (SZ, Leiter Personal), Mona Seil (MS, Leiterin Controlling)\nSitzungsleitung: Jan Schneider, Protokollant: Simon Zitzmann\n\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung der Tagesordnungspunkte\n2. Marketingmaßnahmen\n3. Berichte\n4. Erweiterte Überstundenregelung\n5. Einführung Jobticket\n6. Sonstiges\n\nTOP 1 Begrüßung und Genehmigung der Tagesordnungspunkte\nJS begrüßt die Abteilungsleitungen zur heutigen Sitzung, die daraufhin pünktlich eröffnet wird. Anschließend bittet er um die Genehmigung der Tagesordnungspunkte. Nach Handzeichen wird die Tagesordnung ohne Ergänzungen und Änderungen einstimmig genehmigt. Als nächster Besprechungstermin wird der 25.06. vor der großen Sommerpause einstimmig festgelegt.\n\nTOP 2 Marketingmaßnahmen\nNach dem im letzten Quartal von MS und TJ festgestellten Absatzrückgang wurden bereits auf der letzten Sitzung neue Verkaufsstrategien beschlossen. Hierzu wurde von der Geschäftsleitung ein Budget von 350.000 Euro freigegeben. SF berichtet, dass schon im Vorfeld neue Zielgruppen beleuchtet wurden, insbesondere die Gruppe der Berufseinsteiger und Hochschulabsolventen, also die Altersgruppe 17 bis 25 Jahre. Im Vergleich dazu lag der Fokus bisher auf Verbraucher im Alter von 30 bis 50 Jahren.\nZunächst wurde eine Social-Media-Agentur beauftragt, um gezielt neue Endverbraucher anzusprechen. Hierzu liegen auch schon erste Ergebnisse vor, die zeigen, dass das Interesse die Aufmerksamkeit um 38% gestiegen sind. Infolgedessen stieg der Umsatz um 18 % im Vergleich zum Vorjahr. JS zeigt sich mit dieser ersten Entwicklung zufrieden und erwartet einen weitere
