zählen auch Wegeunfälle, also Unfälle, die sich auf dem direkten Weg zwischen dem Wohngebäude und der Arbeitsstätte ereignen. Dieser Weg beginnt vor der eigenen Haustür und endet, sobald die Arbeitnehmenden das Unternehmen erreicht haben. Dabei sind bestimmte notwendige Umwege mitversichert, wie etwa der Weg zur Kita, Umleitungen oder im Falle von Fahrgemeinschaften, unabhängig davon, mit welchen Verkehrsmitteln man sich fortbewegt.\n\nDer Versicherungsschutz umfasst ausschließlich Personenschäden; Sachschäden, wie z. B. Schäden am Fahrzeug, sind hierbei nicht mitversichert. Die BG übernimmt in diesem Fall z. B. die Behandlungskosten sowie ggf. Krankenpflege oder medizinische Rehabilitation.", "items": [{"n": 8, "type": "truefalse", "prompt": "Ein Fahrradunfall auf dem Weg zur Arbeit zählt nicht als Arbeitsunfall.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Zu Arbeitsunfällen zählen auch Wegeunfälle, also Unfälle, die sich auf dem direkten Weg zwischen dem Wohngebäude und der Arbeitsstätte ereignen.", "explain_ru": "В тексте прямо включены «Wegeunfälle» (несчастные случаи по дороге) на прямом пути между домом и работой, и даже покрываются необходимые отклонения, например дорога в детский сад. Транспорт не имеет значения («unabhängig davon, mit welchen Verkehrsmitteln man sich fortbewegt»), поэтому падение с велосипеда по дороге на работу считается несчастным случаем на производстве, и утверждение неверно.", "explain": "El texto incluye expresamente los «Wegeunfälle» (accidentes in itinere) en el trayecto directo entre la vivienda y el lugar de trabajo, e incluso cubre desvíos necesarios como el camino a la guardería. El medio de transporte es irrelevante («unabhängig davon, mit welchen Verkehrsmitteln man sich fortbewegt»), así que un accidente de bicicleta de camino al trabajo sí cuenta como accidente laboral y la afirmación es falsa.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Nach einem Arbeitsunfall", "options": [{"key": "a", "text": "bezahlt die Berufsgenossenschaft sofort Verletztengeld."}, {"key": "b", "text": "erhalten Arbeitnehmer sechs Wochen volles Gehalt."}, {"key": "c", "text": "muss ein Bericht vom Arzt beim Arbeitgeber abgegeben werden."}], "answer": "b", "confidence": "hoch", "quote": "Im Falle einer Arbeitsunfähigkeit nach einem Arbeitsunfall erhalten Arbeitnehmende für sechs Wochen eine Lohnfortzahlung vom Arbeitgeber, danach übernimmt die Berufsgenossenschaft (BG), zahlt u. a. Verletztengeld in Höhe von 80 Prozent des Bruttogehalts", "explain_ru": "Верно b: в течение шести недель работодатель продолжает платить полную зарплату («Lohnfortzahlung»), и только «danach» подключается Berufsgenossenschaft. a неверно, потому что Verletztengeld платят не «sofort», а после этих шести недель (и это 80 % брутто, а не полная зарплата). c неверно, потому что отчёт о несчастном случае составляет сам пострадавший работник («ist ein detaillierter Unfallbericht zu verfassen») и сдаёт его в отдел кадров, а не выдаёт врач.", "explain": "b es correcta: durante seis semanas el empresario sigue pagando el salario íntegro («Lohnfortzahlung»), y solo «danach» entra la Berufsgenossenschaft. a es falsa porque el Verletztengeld no se paga «sofort», sino tras esas seis semanas (y además es el 80 % del bruto, no el salario completo). c es falsa porque el informe de accidente lo redacta el propio trabajador accidentado («ist ein detaillierter Unfallbericht zu verfassen») y se entrega a Recursos Humanos, no lo emite el médico.", "verified": true}]}, {"id": "t2_c-p25b", "note_ru": "Тот же текст, что в предыдущем варианте; пункты новые (№160201, 160221). Формулировка пункта 8 меняется полностью (теперь речь о сообщении о несчастном случае).", "label": "Text 2 – Variante 1 (neue Antwortversion №160201, 160221)", "page": 25, "note": "Mismo texto que la variante anterior; ítems nuevos (№160201, 160221). El enunciado del ítem 8 cambia por completo (ahora se refiere al informe del accidente).", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nArbeitsunfälle\nArbeitsunfälle sind Unfälle, die Beschäftigte bei der Ausübung ihrer Arbeit oder einer Dienstreise erleiden. Es muss also ein ursächlicher Zusammenhang mit der beruflichen Tätigkeit bestehen. Nach einem Arbeitsunfall müssen Beschäftigte ihren Arbeitgeber umgehend über den Unfall in Kenntnis setzen und sich ggf. in Behandlung begeben. Außerdem ist, sobald es der Gesundheitszustand des Geschädigten zulässt, ein detaillierter Unfallbericht zu verfassen und der Personalabteilung vorzulegen.\n\nIm Falle einer Arbeitsunfähigkeit nach einem Arbeitsunfall erhalten Arbeitnehmende für sechs Wochen eine Lohnfortzahlung vom Arbeitgeber, danach übernimmt die Berufsgenossenschaft (BG), zahlt u. a. Verletztengeld in Höhe von 80 Prozent des Bruttogehalts und kommt ggf. auch für weitere Kosten auf.\n\nZu Arbeitsunfällen zählen auch Wegeunfälle, also Unfälle, die sich auf dem direkten Weg zwischen dem Wohngebäude und der Arbeitsstätte ereignen. Dieser Weg beginnt vor der eigenen Haustür und endet, sobald die Arbeitnehmenden das Unternehmen erreicht haben. Dabei sind bestimmte notwendige Umwege mitversichert, wie etwa der Weg zur Kita, Umleitungen oder im Falle von Fahrgemeinschaften, unabhängig davon, mit welchen Verkehrsmitteln man sich fortbewegt.\n\nDer Versicherungsschutz umfasst ausschließlich Personenschäden; Sachschäden, wie z. B. Schäden am Fahrzeug, sind hierbei nicht mitversichert. Die BG übernimmt in diesem Fall z. B. die Behandlungskosten sowie ggf. Krankenpflege oder medizinische Rehabilitation.", "items": [{"n": 8, "type": "truefalse", "prompt": "Im Falle eines Arbeitsunfalls muss man sofort einen Bericht beim Arbeitgeber einreichen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Außerdem ist, sobald es der Gesundheitszustand des Geschädigten zulässt, ein detaillierter Unfallbericht zu verfassen und der Personalabteilung vorzulegen.", "explain_ru": "Сразу («umgehend») нужно сообщить о несчастном случае работодателю, а не подавать отчёт; подробный отчёт составляют только тогда, когда это позволяет состояние здоровья пострадавшего («sobald es der Gesundheitszustand des Geschädigten zulässt»). Поэтому утверждение «sofort» неверно. Кроме того, отчёт идёт в отдел кадров, а не просто «подаётся» работодателю.", "explain": "Lo inmediato («umgehend») es informar al empresario del accidente, no presentar un informe; el informe detallado solo hay que redactarlo cuando el estado de salud del accidentado lo permita («sobald es der Gesundheitszustand des Geschädigten zulässt»). Por eso la afirmación «sofort» es falsa. Además el informe va a la Personalabteilung, no se «presenta» sin más al empresario.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Nach einem Arbeitsunfall", "options": [{"key": "a", "text": "bezahlt die Berufsgenossenschaft sofort Verletztengeld."}, {"key": "b", "text": "erhalten Arbeitnehmer sechs Wochen volles Gehalt."}, {"key": "c", "text": "trägt der Arbeitgeber die Kosten für die medizinische Versorgung."}], "answer": "b", "confidence": "hoch", "quote": "Im Falle einer Arbeitsunfähigkeit nach einem Arbeitsunfall erhalten Arbeitnehmende für sechs Wochen eine Lohnfortzahlung vom Arbeitgeber, danach übernimmt die Berufsgenossenschaft (BG), zahlt u. a. Verletztengeld in Höhe von 80 Prozent des Bruttogehalts", "explain_ru": "Верно b: работодатель сохраняет зарплату в течение шести недель («Lohnfortzahlung»). a неверно: Berufsgenossenschaft действует только «danach», то есть после этих шести недель. c неверно, потому что расходы на лечение берёт на себя не работодатель, а BG («Die BG übernimmt in diesem Fall z. B. die Behandlungskosten sowie ggf. Krankenpflege oder medizinische Rehabilitation»).", "explain": "b es correcta: el empresario mantiene el salario durante seis semanas («Lohnfortzahlung»). a es falsa: la Berufsgenossenschaft actúa solo «danach», es decir, después de las seis semanas. c es falsa porque los costes médicos no los asume el empresario, sino la BG («Die BG übernimmt in diesem Fall z. B. die Behandlungskosten sowie ggf. Krankenpflege oder medizinische Rehabilitation»).", "verified": true}]}, {"id": "t2_c-p26a", "note_ru": "Первая Fassung текста Datenschutz: обязательное обучение повторяется «spätestens alle drei Jahre».", "label": "Text 2 – Variante 2 (alte Fassung)", "page": 26, "note": "Primera fassung del texto de Datenschutz: la formación obligatoria debe repetirse «spätestens alle drei Jahre».", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nWichtige Hinweise zum Datenschutz\nUnser Unternehmen ist dem Datenschutz gemäß der EU-Datenschutz-Grundverordnung (DSGVO) verpflichtet. Grundsätzlich dürfen die Daten unserer Mitarbeiterinnen und Mitarbeiter nur dann erhoben werden, wenn diese vorher ausdrücklich zugestimmt haben. Mit Ihrem Arbeitsvertrag haben Sie bereits ein Formular erhalten, mit dessen Unterschrift Sie bestätigt haben, dass Sie mit der Speicherung Ihrer personenbezogenen Daten einverstanden sind. Sollten Sie zukünftig Fragen zum Datenschutz haben, können Sie sich an unseren internen Datenschutzbeauftragten Herrn Koljak (Durchwahl-814) oder seine Stellvertreterin Frau Dombrovski (Durchwahl -485) wenden. Wir erwarten von unseren Mitarbeiterinnen und Mitarbeitern, sich beim Thema Datenschutzverordnung immer auf dem neuesten Stand zu halten und bieten daher jedes Jahr Schulungen zu diesem Zweck an. Diese werden von unserem externen Schulungspartner WissMax durchgeführt und finden zu unterschiedlichen Terminen, jeweils am Wochenende, bei uns im Haus statt. Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei. Eine Teilnahme an einem solchen Training muss spätestens alle drei Jahre erfolgen und durch ein Zertifikat nachgewiesen werden. Reichen Sie dieses bitte unaufgefordert bei der Personalabteilung ein. Alternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen. In diesem Fall bitten wir Sie jedoch, eine solche Teilnahme im Vorfeld mit unserer Personalabteilung abzusprechen, sodass Ihnen das Seminar genehmigt und eine Kostenübernahme garantiert werden kann.", "items": [{"n": 8, "type": "truefalse", "prompt": "Die Mitarbeiter müssen einmal pro Jahr ein Seminar zum Datenschutz belegen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Eine Teilnahme an einem solchen Training muss spätestens alle drei Jahre erfolgen und durch ein Zertifikat nachgewiesen werden.", "explain_ru": "В этой Fassung текста обучение обязательно не реже чем раз в три года («spätestens alle drei Jahre»). То, что предприятие «предлагает» курсы каждый год («bieten daher jedes Jahr Schulungen … an»), не значит, что сотрудник обязан проходить их ежегодно: обязанность — раз в три года, поэтому утверждение неверно.", "explain": "En esta fassung del texto la formación es obligatoria como muy tarde cada tres años («spätestens alle drei Jahre»). Que la empresa «ofrezca» cursos cada año («bieten daher jedes Jahr Schulungen … an») no significa que el empleado deba hacer uno anual: la obligación es trienal, así que la afirmación es falsa.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Die Teilnahme am Seminar", "options": [{"key": "a", "text": "gilt als Arbeitszeit."}, {"key": "b", "text": "ist kostenpflichtig."}, {"key": "c", "text": "muss bei WissMax erfolgen."}], "answer": "a", "confidence": "hoch", "quote": "Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei.", "explain_ru": "Верно a: участие засчитывается как рабочее время. b неверно, потому что семинар для сотрудников «kostenfrei». c неверно, потому что текст допускает другой путь: «Alternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen» — с предварительного согласия отдела кадров.", "explain": "a es correcta: la asistencia se computa como tiempo de trabajo. b es falsa porque el seminario es «kostenfrei» para los empleados. c es falsa porque el texto permite otra vía: «Alternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen», previa autorización de Recursos Humanos.", "verified": true}]}, {"id": "t2_c-p26b", "note_ru": "Вторая Fassung того же текста Datenschutz: меняется одна деталь — обучение становится «jedes Jahr». Пункты 8 и 9 остаются дословно, но ответ пункта 8 меняется на противоположный.", "label": "Text 2 – Variante 2 (neue Fassung)", "page": 26, "note": "Segunda fassung del mismo texto de Datenschutz: cambia un solo dato, la formación pasa a ser «jedes Jahr». Los ítems 8 y 9 se mantienen literalmente, pero la respuesta del ítem 8 se invierte.", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nWichtige Hinweise zum Datenschutz\nUnser Unternehmen ist dem Datenschutz gemäß der EU-Datenschutz-Grundverordnung (DSGVO) verpflichtet. Grundsätzlich dürfen die Daten unserer Mitarbeiterinnen und Mitarbeiter nur dann erhoben werden, wenn diese vorher ausdrücklich zugestimmt haben.\nMit Ihrem Arbeitsvertrag haben Sie bereits ein Formular erhalten, mit dessen Unterschrift Sie bestätigt haben, dass Sie mit der Speicherung Ihrer personenbezogenen Daten einverstanden sind. Sollten Sie zukünftig Fragen zum Datenschutz haben, können Sie sich an unseren internen Datenschutzbeauftragten Herrn Koljak (Durchwahl-814) oder seine Stellvertreterin Frau Dombrovski (Durchwahl -485) wenden.\nWir erwarten von unseren Mitarbeiterinnen und Mitarbeitern, sich beim Thema Datenschutzverordnung immer auf dem neuesten Stand zu halten und bieten daher jedes Jahr Schulungen zu diesem Zweck an. Diese werden von unserem externen Schulungspartner WissMax durchgeführt und finden zu unterschiedlichen Terminen, jeweils am Wochenende, bei uns im Haus statt. Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei.\nEine Teilnahme an einem solchen Training muss jedes Jahr erfolgen und durch ein Zertifikat nachgewiesen werden. Reichen Sie dieses bitte unaufgefordert bei der Personalabteilung ein.\nAlternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen. In diesem Fall bitten wir Sie jedoch, eine solche Teilnahme im Vorfeld mit unserer Personalabteilung abzusprechen, sodass Ihnen das Seminar genehmigt und eine Kostenübernahme garantiert werden kann.", "items": [{"n": 8, "type": "truefalse", "prompt": "Die Mitarbeiter müssen einmal pro Jahr ein Seminar zum Datenschutz belegen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Eine Teilnahme an einem solchen Training muss jedes Jahr erfolgen und durch ein Zertifikat nachgewiesen werden.", "explain_ru": "В этой новой версии текста ключевая фраза меняется: участие в обучении «muss jedes Jahr erfolgen» (раньше: «spätestens alle drei Jahre»). Поскольку утверждение говорит именно это — раз в год, — оно верно. Это типичный случай инверсии ответа между версиями одного текста.", "explain": "En esta versión nueva del texto la frase clave cambia: la participación en la formación «muss jedes Jahr erfolgen» (antes: «spätestens alle drei Jahre»). Como el enunciado dice exactamente eso —una vez al año—, es correcto. Es el caso típico de la inversión de la respuesta entre versiones del mismo texto.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Die Teilnahme am Seminar", "options": [{"key": "a", "text": "gilt als Arbeitszeit."}, {"key": "b", "text": "ist kostenpflichtig."}, {"key": "c", "text": "muss bei WissMax erfolgen."}], "answer": "a", "confidence": "hoch", "quote": "Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei.", "explain_ru": "Верно a: участие засчитывается как рабочее время, как и в предыдущей версии (этот пункт между версиями не меняется). b неверно, потому что обучение бесплатное («kostenfrei»). c неверно, потому что допускается равноценное обучение у другого провайдера по согласованию с отделом кадров.", "explain": "a es correcta: la asistencia cuenta como tiempo de trabajo, igual que en la versión anterior (este ítem no cambia entre versiones). b es falsa porque es gratuita («kostenfrei»). c es falsa porque se admite una formación equivalente en otro proveedor previa consulta con Recursos Humanos.", "verified": true}]}, {"id": "t2_c-p27a", "note_ru": "Первая из трёх версий текста о табаке. В пункте 8 сказано «schließt E-Zigaretten aus».", "label": "Text 2 – Variante 3 (alte Fassung bis 07.2024)", "page": 27, "note": "Primera de las tres versiones del texto sobre el tabaco. El ítem 8 dice «schließt E-Zigaretten aus».", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nRauchen\nIm gesamten Betrieb gilt striktes Rauchverbot. Auf dem Betriebsgelände befinden sich vier durch Hinweisschilder gekennzeichnete Raucherzonen. Bitte benutzen Sie für Ihre Zigarettenreste die Standaschenbecher. Allerdings ist im Umkreis von mindestens 50 Metern rund um die Produktionshallen das Rauchen auch im Freien untersagt. Eine Missachtung dieser Regel zieht eine Abmahnung nach sich. Im Wiederholungsfall droht eine fristlose Kündigung. Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein. Bei Veranstaltungen ist das Rauchen auch auf der Dachterrasse des Gebäudes A zulässig. Beschäftigte, die dort rauchen, sind dazu angehalten, die Terrassentür geschlossen zu halten. Zigarettenpausen während der Arbeitszeit sind grundsätzlich zulässig, dabei sind folgende Regelungen zu beachten. Raucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.\n\nDa die Raucherpause nicht zur Arbeitszeit gehört, greift währenddessen nach dem Arbeitsrecht die Unfallversicherung nicht.\nDaher ist ein Arbeitsunfall während der Raucherpausen, z. B. ein Treppensturz, nicht über die Unfallversicherung abgedeckt.\n\nDie Gesundheit unserer MitarbeiterInnen liegt uns am Herzen. Aus diesem Grund übernehmen wir in Kooperation mit unserer betrieblichen Krankenkasse die Kosten für einen Raucherentwöhnungskurs.\nFür weitere Informationen wenden Sie sich bitte vertrauensvoll an unsere Personalabteilung.", "items": [{"n": 8, "type": "truefalse", "prompt": "Das Rauchverbot auf dem Firmengelände schließt E-Zigaretten aus.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein.", "explain_ru": "«mit einschließen» означает «включать»: запрет прямо распространяется и на использование электронных сигарет. Утверждение говорит обратное («ausschließen» = исключать), значит оно неверно. Внимание: в версии 07.2024 тот же пункт сформулирован с «einschließen», и там ответ Richtig.", "explain": "«mit einschließen» significa incluir: la prohibición abarca expresamente también el uso de cigarrillos electrónicos. El enunciado dice lo contrario («ausschließen» = excluir), de modo que es falso. Ojo: en la versión 07.2024 el mismo ítem se formula con «einschließen» y entonces sí es Richtig.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Raucher", "options": [{"key": "a", "text": "müssen ihre Pausenzeiten nicht dokumentieren."}, {"key": "b", "text": "sind auch in der Raucherpause bei Unfällen versichert."}, {"key": "c", "text": "sollen die Terrassentür beim Rauchen schließen."}], "answer": "c", "confidence": "hoch", "quote": "Beschäftigte, die dort rauchen, sind dazu angehalten, die Terrassentür geschlossen zu halten.", "explain_ru": "Верно c: тот, кто курит на террасе здания A во время мероприятий, должен держать дверь террасы закрытой. a неверно, потому что перерывы на курение не являются рабочим временем и их нужно отмечать в системе учёта («müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden»). b неверно, потому что во время перерыва страхование от несчастных случаев не действует и падение на лестнице не покрывается («greift währenddessen nach dem Arbeitsrecht die Unfallversicherung nicht»).", "explain": "c es correcta: quien fuma en la terraza del edificio A durante eventos debe mantener la puerta de la terraza cerrada. a es falsa porque las pausas de tabaco no son tiempo de trabajo y hay que registrarlas en el sistema de control horario («müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden»). b es falsa porque durante la pausa no rige el seguro de accidentes y una caída por las escaleras no está cubierta («greift währenddessen nach dem Arbeitsrecht die Unfallversicherung nicht»).", "verified": true}]}, {"id": "t2_c-p27b", "note_ru": "Версия 07.2024: формулировка пункта 8 меняется на противоположную («schließt E-Zigaretten ein»), а в пункте 9 появляются новые варианты a) и b).", "label": "Text 2 – Variante 3 (neue Fassung 07.2024)", "page": 27, "note": "Versión 07.2024: el enunciado del ítem 8 se invierte («schließt E-Zigaretten ein») y el ítem 9 estrena las opciones a) y b) nuevas.", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nRauchen\nIm gesamten Betrieb gilt striktes Rauchverbot. Auf dem Betriebsgelände befinden sich vier durch Hinweisschilder gekennzeichnete Raucherzonen. Bitte benutzen Sie für Ihre Zigarettenreste die Standaschenbecher. Allerdings ist im Umkreis von mindestens 50 Metern rund um die Produktionshallen das Rauchen auch im Freien untersagt. Eine Missachtung dieser Regel zieht eine Abmahnung nach sich. Im Wiederholungsfall droht eine fristlose Kündigung. Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein. Bei Veranstaltungen ist das Rauchen auch auf der Dachterrasse des Gebäudes A zulässig. Beschäftigte, die dort rauchen, sind dazu angehalten, die Terrassentür geschlossen zu halten. Zigarettenpausen während der Arbeitszeit sind grundsätzlich zulässig, dabei sind folgende Regelungen zu beachten. Raucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.\n\nDa die Raucherpause nicht zur Arbeitszeit gehört, greift währenddessen nach dem Arbeitsrecht die Unfallversicherung nicht.\nDaher ist ein Arbeitsunfall während der Raucherpausen, z. B. ein Treppensturz, nicht über die Unfallversicherung abgedeckt.\n\nDie Gesundheit unserer MitarbeiterInnen liegt uns am Herzen. Aus diesem Grund übernehmen wir in Kooperation mit unserer betrieblichen Krankenkasse die Kosten für einen Raucherentwöhnungskurs.\nFür weitere Informationen wenden Sie sich bitte vertrauensvoll an unsere Personalabteilung.", "items": [{"n": 8, "type": "truefalse", "prompt": "Das Rauchverbot auf dem Firmengelände schließt E-Zigaretten ein.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein.", "explain_ru": "Здесь в утверждении стоит «einschließen» (включать) — именно то, что сказано в тексте: запрет включает «jeglichen Gebrauch von E-Zigaretten». Значит верно. Сравните со старой версией и версией 05.2025: там тот же пункт говорит «ausschließen», и ответ Falsch — это перевёрнутое утверждение.", "explain": "Aquí el enunciado usa «einschließen» (incluir), que es justo lo que dice el texto: la prohibición incluye «jeglichen Gebrauch von E-Zigaretten». Por tanto es correcto. Compárese con la versión antigua y la de 05.2025, donde el mismo ítem dice «ausschließen» y la respuesta es Falsch: es el enunciado invertido.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Raucher", "options": [{"key": "a", "text": "erhalten weitere Informationen zu den Raucherbestimmungen in der Personalabteilung."}, {"key": "b", "text": "müssen ihre Pausenzeiten dokumentieren."}, {"key": "c", "text": "sind auch in der Raucherpause bei Unfällen versichert."}], "answer": "b", "confidence": "niedrig", "quote": "Raucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.", "explain_ru": "b имеет самую явную опору в тексте: раз перерыв не рабочее время, нужно отмечать уход и возвращение в системе учёта, то есть документировать перерыв; кроме того, это утвердительная формулировка прежнего неверного варианта a), что согласуется с переработкой пункта. c явно неверно (во время перерыва страхования от несчастных случаев нет). Низкая уверенность, потому что a) тоже защитимо: текст заканчивается словами «Für weitere Informationen wenden Sie sich bitte vertrauensvoll an unsere Personalabteilung», то есть есть два состоятельных варианта, и только конструкция пункта склоняет к b).", "explain": "b tiene el apoyo literal más claro: al no ser tiempo de trabajo, hay que fichar la salida y la vuelta en el sistema de registro horario, es decir, documentar la pausa; además es la formulación afirmativa de la antigua opción falsa a), lo que encaja con el rediseño del ítem. c es claramente falsa (durante la pausa no hay seguro de accidentes). Confianza baja porque a) también es defendible: el texto termina con «Für weitere Informationen wenden Sie sich bitte vertrauensvoll an unsere Personalabteilung», así que hay dos opciones sostenibles y solo el diseño del ítem inclina la balanza hacia b).", "verified": true}]}, {"id": "t2_c-p27c", "note_ru": "Версия 05.2025: новые варианты пункта 9 сохраняются, но формулировка пункта 8 снова меняется на противоположную («schließt E-Zigaretten aus»).", "label": "Text 2 – Variante 3 (neue Fassung 05.2025)", "page": 27, "note": "Versión 05.2025: mantiene las opciones nuevas del ítem 9, pero vuelve a invertir el enunciado del ítem 8 («schließt E-Zigaretten aus»).", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nRauchen\nIm gesamten Betrieb gilt striktes Rauchverbot. Auf dem Betriebsgelände befinden sich vier durch Hinweisschilder gekennzeichnete Raucherzonen. Bitte benutzen Sie für Ihre Zigarettenreste die Standaschenbecher. Allerdings ist im Umkreis von mindestens 50 Metern rund um die Produktionshallen das Rauchen auch im Freien untersagt. Eine Missachtung dieser Regel zieht eine Abmahnung nach sich. Im Wiederholungsfall droht eine fristlose Kündigung. Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein. Bei Veranstaltungen ist das Rauchen auch auf der Dachterrasse des Gebäudes A zulässig. Beschäftigte, die dort rauchen, sind dazu angehalten, die Terrassentür geschlossen zu halten. Zigarettenpausen während der Arbeitszeit sind grundsätzlich zulässig, dabei sind folgende Regelungen zu beachten. Raucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.\n\nDa die Raucherpause nicht zur Arbeitszeit gehört, greift währenddessen nach dem Arbeitsrecht die Unfallversicherung nicht.\nDaher ist ein Arbeitsunfall während der Raucherpausen, z. B. ein Treppensturz, nicht über die Unfallversicherung abgedeckt.\n\nDie Gesundheit unserer MitarbeiterInnen liegt uns am Herzen. Aus diesem Grund übernehmen wir in Kooperation mit unserer betrieblichen Krankenkasse die Kosten für einen Raucherentwöhnungskurs.\nFür weitere Informationen wenden Sie sich bitte vertrauensvoll an unsere Personalabteilung.", "items": [{"n": 8, "type": "truefalse", "prompt": "Das Rauchverbot auf dem Firmengelände schließt E-Zigaretten aus.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein.", "explain_ru": "В тексте сказано, что запрет включает электронные сигареты («mit ein»), поэтому утверждать, что он их исключает («ausschließen»), неверно. Это та же формулировка, что в версии до 07.2024; только в версии 07.2024 стоит «ein», и там ответ Richtig.", "explain": "El texto dice que la prohibición incluye los cigarrillos electrónicos («mit ein»), así que afirmar que los excluye («ausschließen») es falso. Es la misma formulación que la versión anterior a 07.2024; solo la versión 07.2024 usa «ein» y por eso allí la respuesta es Richtig.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Raucher", "options": [{"key": "a", "text": "erhalten weitere Informationen zu den Raucherbestimmungen in der Personalabteilung."}, {"key": "b", "text": "müssen ihre Pausenzeiten dokumentieren."}, {"key": "c", "text": "sind auch in der Raucherpause bei Unfällen versichert."}], "answer": "b", "confidence": "niedrig", "quote": "Raucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.", "explain_ru": "Пункт идентичен версии 07.2024: b опирается на обязанность отмечать перерыв в системе учёта рабочего времени (уход и возвращение). c неверно, потому что перерыв не покрывается страхованием от несчастных случаев. Низкая уверенность, потому что a) тоже находит опору в последней фразе текста о том, что можно обратиться в отдел кадров; при двух защитимых вариантах b) воспроизводит конкретное правило для курящих.", "explain": "Ítem idéntico al de la versión 07.2024: b se apoya en la obligación de registrar la pausa en el sistema de control horario (entrada y salida). c es falsa porque la pausa no está cubierta por el seguro de accidentes. Confianza baja porque a) también encuentra apoyo en la frase final del texto sobre informarse en la Personalabteilung; con dos opciones defendibles, la opción b) es la que reproduce una regla concreta para los fumadores.", "verified": true}]}, {"id": "t2_c-p28", "label": "Text 2 – Variante 4", "page": 28, "note": "", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nLebensarbeitszeitkonto\nIn unserem Unternehmen wird die Möglichkeit angeboten, ein Lebensarbeitszeitkonto zu führen. Als Arbeitnehmer können Sie Arbeitszeit, zum Beispiel geleistete Überstunden, als Guthaben auf diesem Konto stehen lassen. Ähnlich wie bei einem Bankkonto, mit dem Unterschied, dass auch die Währung 'Zeit' akzeptiert wird.\n\nBei Bedarf können Sie Ihre angesparten Stunden wieder einlösen. Das Lebensarbeitszeitkonto bietet die Chance, adäquat auf verschiedene Bedürfnisse zu verschiedenen Zeiten im Laufe des Arbeitslebens einzugehen. Beispielsweise könnte die angesparte Zeit etwa für die Betreuung von pflegebedürftigen Angehörigen genutzt werden.\n\nAußerdem bietet unser Teilzeitangebot „Classic Vario“ eine Kombination von Teil- und Vollzeit bei flexibler Einteilung der Arbeitszeit. Nach rechtzeitiger Rücksprache mit dem Arbeitgeber (mindestens drei Monate vorher) kann die zu leistende Arbeitszeit auch zwischen Teil- und Vollzeit angepasst werden.\n\nWenn Sie eine gewisse zeitliche Flexibilität brauchen, können Sie auch kurzfristig nach Absprache im Homeoffice arbeiten. Für die Arbeit von zu Hause stehen den Mitarbeitern und Mitarbeiterinnen ein firmeneigener Laptop und ein Diensthandy zur Verfügung.\n\nSollten Sie eine komplette Auszeit nehmen wollen, können Sie das für einen Zeitraum von bis zu maximal zwölf Monaten vorübergehend tun. Wir sichern Ihnen einen gleichwertigen Arbeitsplatz nach Ihrer Rückkehr zu.\n\nAls familienfreundliche Firma bieten wir neben den oben beschriebenen flexiblen Arbeitszeitmodellen Betreuungsmöglichkeiten während der Schulferien für die Kinder unserer Mitarbeiter und Mitarbeiterinnen.", "items": [{"n": 8, "type": "truefalse", "prompt": "Das Unternehmen unterstützt die Mitarbeiter finanziell bei privaten Problemen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "mittel", "quote": "Ähnlich wie bei einem Bankkonto, mit dem Unterschied, dass auch die Währung 'Zeit' akzeptiert wird.", "explain_ru": "В тексте не упоминается никакая денежная помощь при личных проблемах: поддержка выражается во времени и услугах (счёт рабочего времени, Teilzeit «Classic Vario», home office с ноутбуком и служебным телефоном, отпуск до двенадцати месяцев, места в детском саду на время каникул). Единственный «счёт» — это часы, и его «валюта» — время, а не деньги. Средняя уверенность: ответ выводится из отсутствия любых финансовых данных, а не из фразы, которая прямо это отрицает.", "explain": "El texto no menciona ninguna ayuda económica para problemas privados: el apoyo es en tiempo y en servicios (cuenta de tiempo de trabajo, Teilzeit «Classic Vario», home office con portátil y móvil de empresa, excedencia de hasta doce meses, plazas de cuidado infantil en vacaciones). La única «cuenta» es de horas y su «moneda» es el tiempo, no el dinero. Confianza media porque la respuesta se deduce por ausencia de cualquier dato económico, no de una frase que lo niegue expresamente.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Die Mitarbeiter können", "options": [{"key": "a", "text": "bei Bedarf von zu Hause aus arbeiten."}, {"key": "b", "text": "sich maximal ein halbes Jahr beurlauben lassen."}, {"key": "c", "text": "Geldleistungen für die Pflege von Angehörigen erhalten."}], "answer": "a", "confidence": "hoch", "quote": "Wenn Sie eine gewisse zeitliche Flexibilität brauchen, können Sie auch kurzfristig nach Absprache im Homeoffice arbeiten.", "explain_ru": "Верно a: работать из дома можно и на короткий срок по договорённости с предприятием — именно это и просит утверждение («bei Bedarf»). b неверно, потому что длительный отпуск может длиться «bis zu maximal zwölf Monaten», то есть до года, а не полгода. c неверно, потому что накопленные часы можно использовать для ухода за зависимыми родственниками, но речь идёт о времени, а не о денежных выплатах («könnte die angesparte Zeit etwa für die Betreuung von pflegebedürftigen Angehörigen genutzt werden»).", "explain": "a es correcta: se puede trabajar desde casa a corto plazo tras acordarlo con la empresa, justo lo que pide el enunciado («bei Bedarf»). b es falsa porque la excedencia puede durar «bis zu maximal zwölf Monaten», es decir, hasta un año, no medio. c es falsa porque las horas acumuladas pueden destinarse al cuidado de familiares dependientes, pero se trata de tiempo y no de prestaciones económicas («könnte die angesparte Zeit etwa für die Betreuung von pflegebedürftigen Angehörigen genutzt werden»).", "verified": true}]}, {"id": "t2_d-p29", "label": "Text 2 – Variante 5", "page": 29, "note": "", "kind": "text", "intro": "Lesen Sie den Text und wählen Sie bei jeder Aufgabe die richtige Lösung (Richtig/Falsch bzw. a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nBerichtsheft\nDas Berichtsheft ist der Nachweis, dass die Ausbildung ordnungsgemäß verläuft. In diesem wird alles dokumentiert, was man während der Ausbildung macht und lernt. Sie sollten nicht nur Ihre Tätigkeiten im Betrieb beschreiben, sondern auch alle Einweisungen, Schulungen und den innerbetrieblichen Unterricht vermerken. Wie Sie sehen, ist das Führen der Ausbildungsnachweise ein wichtiger Inhalt Ihrer Ausbildung, bei dem Sie lernen, Ihre Tätigkeiten zeitlich und inhaltlich zu dokumentieren. Darüber hinaus bietet es Ihnen die Möglichkeit, den Zeitaufwand für bestimmte Tätigkeiten präziser einzuschätzen und Ihre Aufgaben zu reflektieren.\n\nWeiterhin wird Ihr Tätigkeitsbereich für Beteiligte im Unternehmen und für die Stellen, die für die Berufsausbildung zuständig sind, nachvollziehbar dargestellt. Es ist Pflicht, das Berichtsheft jeweils vor der Zwischen- und der Abschlussprüfung vorzulegen. Nur wenn es vollständig ist, wird der Prüfungsausschuss Sie zu den Prüfungen zulassen. Wenn Sie zwischen zwei Noten stehen, können Ihre Berichte sogar Ihre Endnote beeinflussen.\n\nNeben den Wochenberichten, die Sie jeden Freitag an Ihren Teamleiter schicken, müssen Sie nach dem Durchlaufen einer Abteilung einen zusätzlichen Bericht verfassen. Dieser ergänzt den Wochenbericht und verschafft Ihnen einen genaueren Überblick über die Aufgaben in der jeweiligen Abteilung. Sie dürfen Ihre Berichte während der Arbeitszeit schreiben und können sie sowohl in klassischer Heftform als auch in digitaler Form auf unserer firmeninternen Plattform führen und einreichen. In festen Abständen haben Sie das Heft Ihrem Ausbildungsleiter zur Kenntnisnahme vorzulegen. In Ihrem eigenen Interesse empfehlen wir Ihnen, es immer zeitnah zu vervollständigen.", "items": [{"n": 8, "type": "truefalse", "prompt": "Auszubildende ohne ordentlich geführtes Berichtsheft dürfen nicht an der Abschlussprüfung teilnehmen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Nur wenn es vollständig ist, wird der Prüfungsausschuss Sie zu den Prüfungen zulassen.", "explain_ru": "В тексте прямо сказано, что только при полном Berichtsheft экзаменационная комиссия («Prüfungsausschuss») допустит ученика к экзаменам, и что его обязательно предъявлять перед промежуточным и итоговым экзаменом. Значит, тот, кто не ведёт его как следует, не может явиться на Abschlussprüfung: утверждение верно.", "explain": "El texto dice literalmente que solo si el Berichtsheft está completo el tribunal de examen («Prüfungsausschuss») admitirá al aprendiz a los exámenes, y que es obligatorio presentarlo antes del examen intermedio y del final. Por tanto, quien no lo lleve correctamente no puede presentarse a la Abschlussprüfung: la afirmación es correcta.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Das Berichtsheft muss", "options": [{"key": "a", "text": "in der Freizeit geführt werden."}, {"key": "b", "text": "dem Ausbildungsleiter regelmäßig gezeigt werden."}, {"key": "c", "text": "jeden Tag ausgefüllt werden."}], "answer": "b", "confidence": "hoch", "quote": "In festen Abständen haben Sie das Heft Ihrem Ausbildungsleiter zur Kenntnisnahme vorzulegen.", "explain_ru": "Верно b: текст требует предъявлять журнал Ausbildungsleiter «in festen Abständen», то есть регулярно. a неверно: «Sie dürfen Ihre Berichte während der Arbeitszeit schreiben», значит делать это в свободное время не нужно. c тоже неверно: отчёты недельные («die Sie jeden Freitag an Ihren Teamleiter schicken»), плюс есть дополнительный отчёт по отделу, а не ежедневный.", "explain": "La opción b es correcta porque el texto exige presentar el cuaderno al Ausbildungsleiter «in festen Abständen», es decir, con regularidad. La a es falsa: «Sie dürfen Ihre Berichte während der Arbeitszeit schreiben», luego no hay que hacerlo en el tiempo libre. La c también es falsa: los informes son semanales («die Sie jeden Freitag an Ihren Teamleiter schicken») y además hay un informe adicional por departamento, no uno diario.", "verified": true}]}, {"id": "t2_d-p30", "label": "Text 2 – Variante 6 (Test №150321, 150301)", "page": 30, "note": "", "kind": "text", "intro": "Lesen Sie den Text und wählen Sie bei jeder Aufgabe die richtige Lösung (Richtig/Falsch bzw. a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nDatenschutz\nIhre im Unternehmen verwendeten Passwörter dürfen unter keinen Umständen weitergegeben und müssen regelmäßig alle sechs Monate geändert werden. Bitte verwenden Sie keine Passwörter, die Sie auch für private Konten nutzen, und generieren Sie sichere Passwörter mit einem Passwortgenerator. USB-Sticks und Ihnen unbekannte Geräte sind vor Inbetriebnahme in isolierter Umgebung zu prüfen. Es darf keine Software aus dem Internet heruntergeladen oder selbstständig auf dem Arbeitslaptop oder dem PC installiert werden. Außerdem ist es untersagt, Daten lokal abzuspeichern.\n\nBitte achten Sie bei Dienstreisen darauf, Ihren Laptop vor Fremden zu sichern! Bedenken Sie bitte auch, dass bei der Arbeit möglicherweise vertrauliche Informationen auf Ihrem Bildschirm zu sehen sind. Schützen Sie diese vor fremden Blicken.\n\nVertrauliche Telefonate dürfen nicht in der Öffentlichkeit geführt werden. Die private Nutzung von Diensthandys oder Laptops ist untersagt.\n\nVertrauliche und personenbezogene Daten müssen nach Dienstschluss verschlossen werden. Sie dürfen zudem nicht länger als unbedingt erforderlich aufgehoben oder gespeichert werden. Über interne Information Unternehmensangelegenheiten oder Dienstgeheimnisse ist Verschwiegenheit zu wahren. Unterlagen, Datenträg Abschriften oder Kopien dürfen nicht weitergegeben werden oder versehentlich in die Hände unbefugter Person gelangen. Vertrauliche Daten in Papierform sind in dafür bereitgestellten Schreddern zu vernichten.\n\nBitte melden Sie ungewöhnliche Vorkommnisse oder Feststellungen umgehend der Geschäftsführung oder unsere Datenschutzbeauftragten, Herrn Dr. Sevici. Er ist unter der Durchwahl -33 zu erreichen und steht Ihnen auch bei Fragen bezüglich des Datenschutzes in unserem Unternehmen zur Verfügung.", "items": [{"n": 8, "type": "truefalse", "prompt": "Die Mitarbeitenden dürfen ihre Passwörter frühestens alle sechs Monate ändern.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "mittel", "quote": "müssen regelmäßig alle sechs Monate geändert werden", "explain_ru": "В тексте установлена обязанность: пароли «müssen regelmäßig alle sechs Monate geändert werden», то есть не реже чем раз в полгода (максимальный интервал). Утверждение переворачивает это словом «frühestens» (не раньше чем раз в полгода), что означало бы запрет менять их чаще; этого в тексте нет, и это противоречит смыслу регулярной обязанности. Средняя уверенность: текст задаёт максимальный срок, но прямо не упоминает возможность сменить пароль раньше.", "explain": "El texto establece una obligación: las contraseñas «müssen regelmäßig alle sechs Monate geändert werden», es decir, como máximo cada seis meses (intervalo máximo). El enunciado lo invierte con «frühestens» (como muy pronto cada seis meses = no antes), lo que significaría que está prohibido cambiarlas más a menudo; eso no se dice en el texto y contradice el sentido de obligación periódica. Confianza media porque el texto fija el plazo máximo, pero no menciona explícitamente la posibilidad de cambiarlas antes.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Vertrauliche Daten", "options": [{"key": "a", "text": "dürfen nicht auf dem PC gespeichert werden."}, {"key": "b", "text": "müssen nach einer bestimmten Zeit gelöscht werden."}, {"key": "c", "text": "sollen ausgedruckt und abgeheftet werden."}], "answer": "b", "confidence": "mittel", "quote": "Vertrauliche und personenbezogene Daten müssen nach Dienstschluss verschlossen werden. Sie dürfen zudem nicht länger als unbedingt erforderlich aufgehoben oder gespeichert werden.", "explain_ru": "b воспроизводит фразу именно о конфиденциальных данных: их нельзя хранить «länger als unbedingt erforderlich», то есть после истечения необходимого срока их нужно удалить. c явно неверно: конфиденциальные данные на бумаге «sind in dafür bereitgestellten Schreddern zu vernichten», а не подшивать в архив. a — ловушка: она опирается на «Außerdem ist es untersagt, Daten lokal abzuspeichern», но это общее правило по ИТ связано с запретом устанавливать программы и не относится специально к конфиденциальным данным; более того, текст допускает их хранение («verschlossen», «nicht länger als … gespeichert»), значит регулируется срок, а не абсолютный запрет. Средняя уверенность из-за этой близости a и b.", "explain": "La b reproduce la frase que habla exactamente de los datos confidenciales: no pueden conservarse ni almacenarse «länger als unbedingt erforderlich», es decir, hay que borrarlos una vez transcurrido el plazo necesario. La c es claramente falsa: los datos confidenciales en papel «sind in dafür bereitgestellten Schreddern zu vernichten», no archivarse. La a es la trampa: se apoya en «Außerdem ist es untersagt, Daten lokal abzuspeichern», pero esa norma general de TI va unida a la prohibición de instalar software y no se refiere específicamente a los datos confidenciales; de hecho el texto sí admite conservarlos («verschlossen», «nicht länger als … gespeichert»), por lo que lo regulado es el plazo y no una prohibición absoluta. Confianza media por esa cercanía entre a y b.", "verified": true}]}, {"id": "t2_d-p31", "label": "Text 2 – Variante 7 (Test №140321, 140301)", "page": 31, "note": "", "kind": "text", "intro": "Lesen Sie den Text und wählen Sie bei jeder Aufgabe die richtige Lösung (Richtig/Falsch bzw. a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nArbeitsunfall und Berufsgenossenschaft (BG)\nMit dem Arbeitsantritt in unserem Unternehmen sind Sie als Arbeitnehmer*in automatisch gesetzlich unfallversichert.\n\nDer Träger dieser Unfallversicherung ist die Berufsgenossenschaft, deren Aufgaben in erster Linie darin bestehen, Arbeits- und Wegeunfälle, Berufskrankheiten sowie arbeitsbedingte Gesundheitsgefahren zu vermeiden. Das wird gewährleistet, indem regelmäßig Kontrollen der Arbeitssicherheit durch die Berufsgenossenschaft stattfinden. Bei diesen Kontrollen sind unsere Mitarbeiter*innen des Qualitätsmanagements mit vor Ort.\n\nSollte dennoch ein Unglücksfall eintreten, übernimmt die Berufsgenossenschaft sämtliche Kosten für Heilbehandlungen und Schadensersatzzahlungen. Dafür muss von Ihnen folgendes Prozedere eingehalten werden: Nach einem Arbeitsunfall wird zunächst der Ersthelfer oder die Ersthelferin informiert. Je nach Schwere des Unfalls wird ein Rettungswagen dazu gerufen. Ob mit oder ohne Krankenhausaufenthalt, müssen Sie aber in jedem Fall von einem Durchgangsarzt untersucht werden. Gleichzeitig sind wir als Arbeitgeber verpflichtet, den Unfall der Berufsgenossenschaft zu melden. Damit setzt der Prozess ein, dass die Berufsgenossenschaft Ihre Behandlung und deren Kosten übernimmt. Damit für Sie als Arbeitnehmer*in keine finanziellen Probleme entstehen, zahlt die Berufsgenossenschaft Ihnen den Lohn ab der siebten Woche der Arbeitsunfähigkeit weiter.\n\nDamit es aber gar nicht erst so weit kommt, führen wir regelmäßig Schulungen zur Arbeitssicherheit durch. Diese beinhalten auf der einen Seite Einweisungen zum korrekten Tragen der Schutzkleidung und auf der anderen Seite konkrete Anweisungen zur richtigen Bedienung der Maschinen.", "items": [{"n": 8, "type": "truefalse", "prompt": "Alle Mitarbeitenden müssen für eine Arbeitsunfallversicherung sorgen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Mit dem Arbeitsantritt in unserem Unternehmen sind Sie als Arbeitnehmer*in automatisch gesetzlich unfallversichert.", "explain_ru": "В тексте сказано, что страхование от несчастных случаев действует автоматически с началом работы и что эту защиту берёт на себя страховая организация (Berufsgenossenschaft). Значит, сотрудникам не нужно самим заключать или оформлять какую-либо Arbeitsunfallversicherung: утверждение неверно.", "explain": "El texto dice que el seguro de accidentes es automático al empezar a trabajar y que la aseguradora (la Berufsgenossenschaft) es la que asume esa cobertura. Por tanto, los empleados no tienen que contratar ni procurarse ninguna Arbeitsunfallversicherung por su cuenta: la afirmación es falsa.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Nach einem Arbeitsunfall", "options": [{"key": "a", "text": "muss man sich einem Durchgangsarzt vorstellen."}, {"key": "b", "text": "schickt die BG einen Arzt oder Rettungswagen."}, {"key": "c", "text": "übernimmt die BG sofort die Gehaltsfortzahlungen."}], "answer": "a", "confidence": "hoch", "quote": "müssen Sie aber in jedem Fall von einem Durchgangsarzt untersucht werden", "explain_ru": "Верно a: текст требует во всех случаях («in jedem Fall») осмотра у Durchgangsarzt, с госпитализацией или без неё. b неверно, потому что первым действует не BG, а первый помощник («wird zunächst der Ersthelfer oder die Ersthelferin informiert») и, в зависимости от тяжести, вызывают скорую. c тоже неверно: BG продолжает платить зарплату только «ab der siebten Woche der Arbeitsunfähigkeit», а не сразу.", "explain": "La a es correcta: el texto impone en todos los casos («in jedem Fall») el reconocimiento por un Durchgangsarzt, con o sin hospitalización. La b es falsa porque quien actúa primero no es la BG sino el primer auxiliador («wird zunächst der Ersthelfer oder die Ersthelferin informiert») y, según la gravedad, se avisa a una ambulancia. La c también es falsa: la BG sigue pagando el salario solo «ab der siebten Woche der Arbeitsunfähigkeit», no de inmediato.", "verified": true}]}]}, {"id": "lesen-t3", "title": "Lesen Teil 3", "variants": [{"id": "t3_a-p32", "label": "Variante 1", "page": 32, "note": "", "kind": "zuordnung", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Günther, vor 9 Stunden", "text": "Das kann man pauschal gar nicht so sagen. Wie das in deinem Unternehmen geregelt ist, steht in deinem Arbeitsvertrag. Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung“ oder „Krankheit“.", "distractor": ""}, {"key": "b", "title": "Marion, vor 4 Stunden", "text": "Nein, vorher musst du erst mal eine Abmahnung bekommen. Wenn du dann allerdings noch mal fehlst, ohne Bescheid zu sagen, musst du mit der Kündigung rechnen. Such doch noch mal das Gespräch mit deinem Chef. Ihr findet bestimmt eine Lösung.", "distractor": ""}, {"key": "c", "title": "Karin, vor 45 Minuten", "text": "Du kannst nicht einfach kommen und gehen, wann du willst, auch wenn du die Absicht hattest, die versäumte Zeit nachzuholen. Die Arbeitszeiten sind ja vertraglich geregelt. Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig.", "distractor": ""}, {"key": "d", "title": "Elli, vor 3 Stunden", "text": "Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du brauchst natürlich ein ärztliches Attest. Das gilt allerdings nicht, wenn du dich um ein krankes Kind kümmern musst. In diesem Fall gelten die Urlaubstage als genommen.", "distractor": ""}, {"key": "e", "title": "Sabine, vor 40 Minuten", "text": "Diese Situation kennen doch alle Eltern. Wenn ich für meinen Sohn mal keine Betreuung finde, kann ich ihn auch ausnahmsweise mit ins Büro nehmen. Meine Chefin ist da zum Glück sehr verständnisvoll.", "distractor": "Solo cuenta cómo ella resuelve la falta de guardería (llevarse al hijo a la oficina); no responde a ninguna de las cuatro consultas. Es el distractor temático de la 10 (Gabi: el hijo enfermo durante las vacaciones) y de la 11 (Charlotte: el hijo enfermo y la amenaza de despido): ninguna de las dos pregunta si puede llevar al niño al trabajo, sino qué pasa con los días de vacaciones y con el despido."}, {"key": "f", "title": "Jorge, vor 2 Stunden", "text": "Also ich gehe immer gleich am ersten Krankheitstag zum Arzt. Sicher ist sicher. Außerdem kann es nicht schaden, wenn dich ein Doktor anschaut, wenn du dich nicht wohlfühlst. Gerade wenn du Kinder hast, ist es wichtig, dass du weißt, was dir fehlt. Du willst ja niemanden anstecken.", "distractor": "Aconseja por experiencia propia ir al médico el primer día de baja, pero no aclara la norma legal que se pregunta. Es el distractor temático de la 13 (Kamil: ¿certificado médico solo a partir del tercer día?) e, indirectamente, de la 12 (Lars, que se puso enfermo): la respuesta correcta es a) Günther, que remite al contrato de trabajo."}], "items": [{"n": 10, "type": "choice", "prompt": "Gabi: Ich hatte gerade Urlaub und gleich am ersten Urlaubstag wurde meine Kleine krank und ich musste sie vier Tage lang pflegen. Wenn ich im Urlaub krank werde, kann ich die Tage zurückbekommen. Aber wie ist das, wenn das Kind krank wird?", "answer": "d", "confidence": "hoch", "quote": "Das gilt allerdings nicht, wenn du dich um ein krankes Kind kümmern musst. In diesem Fall gelten die Urlaubstage als genommen.", "explain_ru": "Gabi спрашивает, что будет с её днями отпуска, если заболеет не она, а дочь. Elli (d) дословно повторяет её собственный аргумент («Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden») и отвечает исключением «krankes Kind»: если ухаживаешь за больным ребёнком, дни отпуска считаются использованными. Sabine (e) тоже говорит о детях, но о детском саде, а не об отпуске.", "explain": "Gabi pregunta qué pasa con sus días de vacaciones cuando la que enferma es su hija, no ella. Elli (d) retoma literalmente su propio argumento («Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden») y responde con la excepción de la «krankes Kind»: si cuidas a un hijo enfermo, los días de vacaciones se consideran disfrutados. Sabine (e) también habla de hijos, pero de guardería, no de vacaciones."}, {"n": 11, "type": "choice", "prompt": "Charlotte: Ich konnte leider mal wieder nicht zur Arbeit gehen, weil mein Kind krank war. Als ich heute angerufen habe, hat mein Chef total überzogen reagiert und mir mit Kündigung gedroht, wenn ich mehr als einen Tag fehle. Das geht doch nicht, oder?", "answer": "b", "confidence": "hoch", "quote": "Nein, vorher musst du erst mal eine Abmahnung bekommen.", "explain_ru": "Charlotte сообщила о своём отсутствии («Als ich heute angerufen habe»), и начальник угрожает ей увольнением: Marion (b) отвечает именно на это «Nein» и правилом, что сначала нужна Abmahnung, и советует поговорить с начальником. Karin (c) тоже упоминает Abmahnung, но для противоположного случая (отсутствие без предупреждения) — это случай Lars.", "explain": "Charlotte avisó de su ausencia («Als ich heute angerufen habe») y el jefe la amenaza con el despido: Marion (b) responde exactamente a eso con un «Nein» y con la regla de que antes hace falta una Abmahnung, y le aconseja hablar con el jefe. Karin (c) también menciona la Abmahnung, pero para el caso contrario (ausencia sin avisar), que es el de Lars."}, {"n": 12, "type": "choice", "prompt": "Lars: Ich bin letzten Montag mit furchtbaren Kopfschmerzen aufgewacht und konnte nicht aufstehen. Leider habe ich vergessen, meinen Arbeitgeber anzurufen, und bin im Bett geblieben. Jetzt will mein Chef mir kündigen, weil ich unentschuldigt gefehlt habe. Geht das so einfach?", "answer": "c", "confidence": "mittel", "quote": "Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig.", "explain_ru": "Lars отсутствовал без оправдания и предупреждения, и Karin (c) — единственная, кто отвечает на вопрос «Geht das so einfach?» утвердительно: когда работник не соблюдает свои обязанности, предварительная Abmahnung не нужна. Средняя уверенность: c говорит о рабочем времени и не пишет дословно «Kündigung möglich»; отнесение подтверждается методом исключения (b лучше подходит Charlotte, которая предупредила) и вариантом с. 34, где тот же пост идёт с ответом c.", "explain": "Lars faltó sin excusa ni aviso, y Karin (c) es la única que responde a la pregunta «Geht das so einfach?» en sentido afirmativo: cuando el trabajador no respeta sus obligaciones, no hace falta una Abmahnung previa. Confianza media porque c se centra en el horario de trabajo y no dice literalmente «Kündigung möglich»; la asignación se confirma por eliminación (b encaja mejor con Charlotte, que sí avisó) y por la variante de la p. 34, donde este mismo posteo lleva la respuesta c."}, {"n": 13, "type": "choice", "prompt": "Kamil: Gestern war ich krank. Als ich heute wieder im Büro war, wollte mein Chef direkt die Krankschreibung haben. Ich war immer der Meinung, die braucht man erst nach drei Tagen?", "answer": "a", "confidence": "hoch", "quote": "Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung“ oder „Krankheit“.", "explain_ru": "Kamil спрашивает, с какого момента он обязан предъявить медицинскую справку. Günther (a) отвечает именно на это: общего правила нет, всё зависит от трудового договора и обычно написано в разделах «Arbeitsverhinderung» или «Krankheit». Jorge (f) — ловушка: он говорит о походе к врачу в первый день, но не об обязанности предъявить справку.", "explain": "Kamil pregunta a partir de cuándo está obligado a entregar el certificado médico. Günther (a) responde justo a eso: no hay una regla general, depende del contrato de trabajo y suele estar en los apartados «Arbeitsverhinderung» o «Krankheit». Jorge (f) es el distractor: habla de ir al médico el primer día, pero no de la obligación de presentar el certificado."}]}, {"id": "t3_a-p33", "note_ru": "Повторяет четыре поста с. 32; меняется только формулировка комментария d (об этом говорит русский заголовок: «новая формулировка ответа d»). Ответы не меняются.", "label": "Variante 1 (versión 08.2024)", "page": 33, "note": "Repite los cuatro posteos de la p. 32; solo cambia la formulación del comentario d (así lo indica el encabezado ruso: «новая формулировка ответа d»). Las respuestas no cambian.", "kind": "zuordnung", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Günther, vor 9 Stunden", "text": "Das kann man pauschal gar nicht so sagen. Wie das in deinem U  horario de trabajo y no formula literalmente la expulsión; se confirma por eliminación y por la variante de la p. 34 (mismo posteo con la respuesta c)."}, {"n": 13, "type": "choice", "prompt": "Kamil: Gestern war ich krank. Als ich heute wieder im Büro war, wollte mein Chef direkt die Krankschreibung haben. Ich war immer der Meinung, die braucht man erst nach drei Tagen?", "answer": "a", "confidence": "hoch", "quote": "Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung“ oder „Krankheit“.", "explain_ru": "Günther (a) отвечает на вопрос Kamil о том, с какого момента нужна справка: общего правила нет, всё в трудовом договоре. Осторожно с новым комментарием d: он тоже говорит об «ärztliches Attest», но о работнике в отпуске, который заболел, а не об обязанности предъявить Krankschreibung.", "explain": "Günther (a) responde a la pregunta de Kamil sobre desde cuándo hace falta el certificado: no hay regla general, está en el contrato de trabajo. Ojo con el nuevo comentario d, que también habla de un «ärztliches Attest», pero referido al empleado de vacaciones que enferma, no a la obligación de presentar la Krankschreibung."}]}, {"id": "t3_a-p34", "note_ru": "Те же тексты, что на с. 32, но с новыми именами и четырьмя заданиями в другом порядке (об этом говорит русский заголовок: «новые имена и очередь»). Поэтому ответы смещаются: 10→b, 11→c, 12→a, 13→d.", "label": "Variante 1 (versión 07.02.2025)", "page": 34, "note": "Mismos textos que la p. 32, pero con nombres nuevos y las cuatro tareas en otro orden (así lo indica el encabezado ruso: «новые имена и очередь»). Por eso las respuestas se desplazan: 10→b, 11→c, 12→a, 13→d.", "kind": "zuordnung", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Jose Cristobal, vor 9 Stunden", "text": "Das kann man pauschal gar nicht so sagen. Wie das in deinem Unternehmen geregelt ist, steht in deinem Arbeitsvertrag. Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung“ oder „Krankheit“.", "distractor": ""}, {"key": "b", "title": "Gracia Maria, vor 4 Stunden", "text": "Nein, vorher musst du erst mal eine Abmahnung bekommen. Wenn du dann allerdings noch mal fehlst, ohne Bescheid zu sagen, musst du mit der Kündigung rechnen. Such doch noch mal das Gespräch mit deinem Chef. Ihr findet bestimmt eine Lösung.", "distractor": ""}, {"key": "c", "title": "Lina, vor 45 Minuten", "text": "Du kannst nicht einfach kommen und gehen, wann du willst, auch wenn du die Absicht hattest, die versäumte Zeit nachzuholen. Die Arbeitszeiten sind ja vertraglich geregelt. Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig.", "distractor": ""}, {"key": "d", "title": "Lida, vor 3 Stunden", "text": "Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du brauchst natürlich ab dem ersten Tag ein ärztliches Attest. Anders sieht es aus, wenn du einen Familienangehörigen betreust. Das ist dann nicht Sache deines Arbeitgebers.", "distractor": ""}, {"key": "e", "title": "Antonia, vor 40 Minuten", "text": "Diese Situation kennen doch alle Eltern. Wenn ich für meinen Sohn mal keine Betreuung finde, kann ich ihn auch ausnahmsweise mit ins Büro nehmen. Meine Chefin ist da zum Glück sehr verständnisvoll.", "distractor": "Solo cuenta cómo ella resuelve la falta de guardería (llevarse al hijo a la oficina); no responde a ninguna de las cuatro consultas. Es el distractor temático de la 10 (Petra: el hijo enfermo y la amenaza de despido) y de la 13 (Ines Maria: el hijo enfermo durante las vacaciones): ninguna pregunta si puede llevar al niño al trabajo."}, {"key": "f", "title": "Jorge, vor 2 Stunden", "text": "Also ich gehe immer gleich am ersten Krankheitstag zum Arzt. Sicher ist sicher. Außerdem kann es nicht schaden, wenn dich ein Doktor anschaut, wenn du dich nicht wohlfühlst. Gerade wenn du Kinder hast, ist es wichtig, dass du weißt, was dir fehlt. Du willst ja niemanden anstecken.", "distractor": "Aconseja por experiencia propia ir al médico el primer día de baja, pero no aclara la norma legal. Es el distractor temático de la 12 (Leo: ¿certificado médico solo a partir del tercer día?) e, indirectamente, de la 11 (Giovanni, que se puso enfermo): la respuesta correcta es a) Jose Cristobal, que remite al contrato de trabajo."}], "items": [{"n": 10, "type": "choice", "prompt": "Petra: Ich konnte leider mal wieder nicht zur Arbeit gehen, weil mein Kind krank war. Als ich heute angerufen habe, hat mein Chef total überzogen reagiert und mir mit Kündigung gedroht, wenn ich mehr als einen Tag fehle. Das geht doch nicht, oder?", "answer": "b", "confidence": "hoch", "quote": "Nein, vorher musst du erst mal eine Abmahnung bekommen.", "explain_ru": "Тот же случай, что Charlotte на с. 32, теперь под номером 10: мать сообщила об отсутствии, и начальник угрожает увольнением. Gracia Maria (b) отвечает «Nein» и напоминает о необходимости предварительной Abmahnung. Комментарий c тоже об Abmahnung, но для того, кто отсутствует без предупреждения (Giovanni, 11).", "explain": "Es el mismo caso que Charlotte en la p. 32, ahora en el número 10: la madre avisó de su ausencia y el jefe la amenaza con el despido. Gracia Maria (b) responde con el «Nein» y con la necesidad de una Abmahnung previa. El comentario c también habla de la Abmahnung, pero para quien falta sin dar señales (Giovanni, 11)."}, {"n": 11, "type": "choice", "prompt": "Giovanni: Ich bin letzten Montag mit furchtbaren Kopfschmerzen aufgewacht und konnte nicht aufstehen. Leider habe ich vergessen, meinen Arbeitgeber anzurufen, und bin im Bett geblieben. Jetzt will mein Chef mir kündigen, weil ich unentschuldigt gefehlt habe. Geht das so einfach?", "answer": "c", "confidence": "mittel", "quote": "Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig.", "explain_ru": "Giovanni отсутствовал без оправдания и предупреждения и спрашивает, так ли просто уволить. Lina (c) — единственная, кто отвечает утвердительно: когда работник не соблюдает обязанности, предварительная Abmahnung не нужна. Средняя уверенность: c говорит о трудовых обязанностях и не называет «Kündigung»; отнесение определяется методом исключения (a→12, b→10, d→13).", "explain": "Giovanni faltó sin excusa ni aviso y pregunta si el despido puede ser tan fácil. Lina (c) es la única que responde en sentido afirmativo: cuando el trabajador no respeta sus obligaciones, la Abmahnung previa no es necesaria. Confianza media porque c se centra en las obligaciones horarias y no nombra la «Kündigung»; la asignación queda fijada por eliminación (a→12, b→10, d→13)."}, {"n": 12, "type": "choice", "prompt": "Leo: Gestern war ich krank. Als ich heute wieder im Büro war, wollte mein Chef direkt die Krankschreibung haben. Ich war immer der Meinung, die braucht man erst nach drei Tagen?", "answer": "a", "confidence": "hoch", "quote": "Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung“ oder „Krankheit“.", "explain_ru": "Leo спрашивает, с какого момента он обязан предъявить справку. Jose Cristobal (a) отвечает именно на это: общего правила нет, всё зависит от трудового договора и обычно регулируется в «Arbeitsverhinderung» или «Krankheit». Jorge (f) — ловушка, он лишь рассказывает о своей привычке идти к врачу в первый день.", "explain": "Leo pregunta desde cuándo está obligado a presentar el certificado. Jose Cristobal (a) contesta exactamente eso: no hay una regla general, depende del contrato de trabajo y suele estar regulado en «Arbeitsverhinderung» o «Krankheit». Jorge (f) es el distractor, porque solo cuenta su costumbre de ir al médico el primer día."}, {"n": 13, "type": "choice", "prompt": "Ines Maria: Ich hatte gerade Urlaub und gleich am ersten Urlaubstag wurde meine Kleine krank und ich musste sie vier Tage lang pflegen. Wenn ich im Urlaub krank werde, kann ich die Tage zurückbekommen. Aber wie ist das, wenn das Kind krank wird?", "answer": "d", "confidence": "mittel", "quote": "Anders sieht es aus, wenn du einen Familienangehörigen betreust. Das ist dann nicht Sache deines Arbeitgebers.", "explain_ru": "Тот же случай, что Gabi на с. 32, теперь под номером 13. Lida (d) дословно повторяет её фразу о возврате дней отпуска и указывает исключение для члена семьи, за которым ухаживают. Средняя уверенность: в новой формулировке уже не сказано прямо, что эти дни отпуска считаются использованными (в версии с. 32 это сказано).", "explain": "Es el mismo caso que Gabi en la p. 32, ahora en el número 13. Lida (d) retoma su frase literal sobre el reembolso de los días de vacaciones y señala la excepción del familiar al que se cuida. Confianza media porque la formulación nueva ya no dice expresamente que esos días de vacaciones se consideren disfrutados (la versión de la p. 32 sí lo dice)."}]}, {"id": "t3_b-p35", "note_ru": "Форум о совместимости профессионального обучения (Ausbildung), семьи, беременности и возраста.", "label": "Variante 2 (Ausbildung und Familie)", "page": 35, "note": "Foro sobre compatibilidad de formación profesional (Ausbildung), familia, embarazo y edad.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Susi, vor 1 Stunde", "text": "Solange du so nicht weniger arbeitest als im Vertrag vereinbart, müsstest du rechtlich auf der sicheren Seite sein. Wenn du es genau wissen willst, solltest du in diesem Fall einen Anwalt für Arbeitsrecht kontaktieren. Mit einer Rechtsschutzversicherung wird das auch nicht so teuer.", "distractor": ""}, {"key": "b", "title": "Julia, vor 1 Stunde", "text": "Rein rechtlich kannst du das nicht ohne Zustimmung deiner Eltern machen. Sie müssen die Kündigung sogar unterschreiben. An deiner Stelle würde ich mir das aber noch mal überlegen. Ich kann deinen Vater jedenfalls gut verstehen. Er macht sich halt Sorgen um deine Zukunft.", "distractor": ""}, {"key": "c", "title": "Jürgen, vor 2 Stunden", "text": "Hi, ich würde die Ausbildung auf keinen Fall abbrechen. Mit Berufen im Finanzbereich hast du gute Aussichten auf dem Arbeitsmarkt und verdienst später auch gutes Geld. Mach dir das nicht kaputt. Meine Tochter ist Steuerberaterin und sucht händeringend nach fähigen Mitarbeitern. Sie kann sich vor Aufträgen gar nicht retten.", "distractor": ""}, {"key": "d", "title": "Jochen, vor 5 Stunden", "text": "Also ich würde noch warten, bis dein Kind etwas größer ist, und mich jetzt noch nicht um einen Ausbildungsplatz bewerben. Wenn es etwas selbstständiger ist, wird vieles leichter. Eine Ausbildung kannst du auch in drei oder vier Jahren noch machen. Dein Kind braucht dich jetzt.", "distractor": "Aconseja posponer la solicitud de formación profesional hasta que el niño crezca, pero Jacqueline ya ha comenzado su Ausbildung y Hans-Peter ya tiene a su hijo criado."}, {"key": "e", "title": "Achim, vor 6 Stunden", "text": "Schutz von Leben und Gesundheit ist das oberste Gebot. Um dich und dein Kind zu schützen, darfst du während der Schwangerschaft keine körperlich anstrengenden Arbeiten verrichten und auch Tätigkeiten, bei denen du Lärm, Schmutz, Kälte usw. ausgesetzt bist, sind tabu.", "distractor": "Explica normas generales de protección de la salud durante el embarazo (Mutterschutz: prohibición de trabajo físico pesado o ruidoso), pero no responde a si interrumpir o no la formación."}, {"key": "f", "title": "Peter, vor 12 Stunden", "text": "Warum das denn? Es gibt doch heutzutage Möglichkeiten, das Kind unterzubringen, während man arbeitet. Können dich deine Eltern vielleicht unterstützen? Sprich mal mit deinem Chef! Wenn der sieht, dass dir die Ausbildung wichtig ist, wird sich eine Lösung finden. Aber versuch auf jeden Fall, die Ausbildung durchzuziehen.", "distractor": ""}], "items": [{"n": 10, "type": "choice", "prompt": "Inka: Ich bin Auszubildende in einem Büro und muss immer pünktlich Feierabend machen, weil ich meinen einjährigen Sohn von der Krippe abholen muss. Mein Chef sieht das gar nicht gern und droht mir jetzt sogar mit Kündigung. Was soll ich machen?", "answer": "a", "confidence": "hoch", "quote": "Solange du so nicht weniger arbeitest als im Vertrag vereinbart, müsstest du rechtlich auf der sicheren Seite sein. Wenn du es genau wissen willst, solltest du in diesem Fall einen Anwalt für Arbeitsrecht kontaktieren.", "explain_ru": "Inka отрабатывает свою норму, но должна уходить вовремя, чтобы забрать сына из детского сада, и начальник угрожает ей увольнением. Susi (a) объясняет, что пока она работает положенные по договору часы, закон её защищает, и советует обратиться к юристу по трудовому праву.", "explain": "Inka cumple con su jornada pero debe salir puntual para recoger a su hijo de la guardería y el jefe la amenaza con el despido. Susi (a) le aclara que mientras trabaje las horas contractuales está protegida legalmente y le recomienda consultar a un abogado laboralista."}, {"n": 11, "type": "choice", "prompt": "Jacqueline: Hallo Leute! Vor ein paar Monaten habe ich mit einer Ausbildung begonnen. Und jetzt bin ich schwanger... Was soll ich bloß machen? Es wird bestimmt schwierig, Kind und Arbeit zu vereinbaren. Soll ich die Ausbildung abbrechen?", "answer": "f", "confidence": "hoch", "quote": "Aber versuch auf jeden Fall, die Ausbildung durchzuziehen.", "explain_ru": "Jacqueline забеременела вскоре после начала обучения и сомневается, не бросить ли его («Soll ich die Ausbildung abbrechen?»). Peter (f) горячо уговаривает её не бросать («durchzuziehen»), найти детский сад или поддержку семьи и поговорить с начальником, чтобы найти решение.", "explain": "Jacqueline se ha quedado embarazada al poco de iniciar la formación y duda si abandonarla («Soll ich die Ausbildung abbrechen?»). Peter (f) la anima vehementemente a no dejarla («durchzuziehen»), buscar guardería o apoyo familiar y hablar con el jefe para buscar una solución."}, {"n": 12, "type": "choice", "prompt": "Hans-Peter: Guten Abend, ich bin Ende 40 und mein Sohn ist inzwischen erwachsen. Jetzt möchte ich beruflich was ganz Neues machen und eine Ausbildung zum Steuerfachangestellten anfangen. Meint ihr, ich habe in meinem Alter noch Chancen, in diesem Beruf zu arbeiten?", "answer": "c", "confidence": "hoch", "quote": "Mit Berufen im Finanzbereich hast du gute Aussichten auf dem Arbeitsmarkt und verdienst später auch gutes Geld. Mach dir das nicht kaputt. Meine Tochter ist Steuerberaterin und sucht händeringend nach fähigen Mitarbeitern.", "explain_ru": "Hans-Peter спрашивает, есть ли у него шансы в налоговой сфере («Steuerfachangestellten») почти в 50 лет. Jürgen (c) подтверждает отличные перспективы на рынке труда в финансовой сфере и приводит в пример свою дочь — налогового консультанта, которая срочно ищет сотрудников.", "explain": "Hans-Peter pregunta si a sus casi 50 años tiene posibilidades en el sector fiscal («Steuerfachangestellten»). Jürgen (c) confirma las excelentes perspectivas laborales en el ámbito financiero y cita a su hija asesora fiscal, que busca personal urgentemente."}, {"n": 13, "type": "choice", "prompt": "Max: Hallo, ich mache momentan eine Ausbildung zum Einzelhandelskaufmann. Ich habe noch ein Jahr bis zum Abschluss und habe wirklich keine Lust mehr. Mein Vater möchte, dass ich die Ausbildung fertig mache. Ich bin noch nicht 18. Kann ich trotzdem einfach kündigen?", "answer": "b", "confidence": "hoch", "quote": "Rein rechtlich kannst du das nicht ohne Zustimmung deiner Eltern machen. Sie müssen die Kündigung sogar unterschreiben.", "explain_ru": "Max несовершеннолетний («Ich bin noch nicht 18») и спрашивает, может ли он расторгнуть договор сам, против воли отца. Julia (b) предупреждает, что по закону несовершеннолетние не могут расторгнуть обучение без согласия и подписи родителей.", "explain": "Max es menor de edad («Ich bin noch nicht 18») y pregunta si puede rescindir su contrato por su cuenta contra el deseo de su padre. Julia (b) le advierte de que legalmente los menores no pueden rescindir la formación sin el consentimiento y la firma de sus padres."}]}, {"id": "t3_b-p36", "note_ru": "Форум о работе по субботам, переходе с частичной занятости на полную и отпуске по уходу.", "label": "Variante 3 (Arbeitszeit und Familie)", "page": 36, "note": "Foro sobre trabajo en sábado, ampliación de jornada parcial a completa y excedencias.", "kind": "zuordnung", "optionsLabel": "Kommentare", "intro": "Lesen Sie die vier Aufgaben (10–13) und die sechs Kommentare (a–f). Welcher Kommentar passt zu welcher Aufgabe? Zwei Kommentare bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Thilo, vor 45 Minuten", "text": "In meinen Augen ist Familie das Wichtigste auf der Welt. Es ist doch auch ein Gewinn, wenn man mehr Zeit mit seinen Kindern verbringen kann und weniger gestresst ist. Ich würde mich auf jeden Fall für Teilzeit entscheiden.", "distractor": ""}, {"key": "b", "title": "Henny, vor 1 Stunde", "text": "Also ich finde es nicht gut, wenn Geschäfte und Supermärkte an Samstagen so lange geöffnet sind. Ihr müsst doch bedenken, dass dort auch Menschen arbeiten müssen. Sie wollen doch ebenfalls Wochenende haben und zu ihren Familien. Ich bin ganz klar gegen längere Ladenöffnungszeiten.", "distractor": "Opina en contra de los horarios comerciales prolongados en sábado para los dependientes de tiendas; no responde a ninguna de las consultas individuales de oficina/jornada."}, {"key": "c", "title": "Angela, vor 6 Stunden", "text": "Jeder Arbeitnehmer hat einen Rechtsanspruch auf Teilzeitarbeit. Allerdings musst du länger als sechs Monate bei dem Unternehmen beschäftigt sein. Man muss sich das aber genau überlegen, da man nicht nur kurz- oder mittelfristig weniger verdient, sondern auch weniger Rentenansprüche hat. Schau doch mal im Internet, wie viel das ausmacht.", "distractor": ""}, {"key": "d", "title": "Ratna, vor 2 Stunden", "text": "Seit Kurzem haben Arbeitnehmer das Recht, eine befristete Zeit weniger zu arbeiten, aber das gilt bestimmt nicht rückwirkend. Soviel ich weiß, hast du also keinen Anspruch, in die Vollzeit zurückzukehren. Sprich doch einfach mal mit deinem Chef.", "distractor": ""}, {"key": "e", "title": "Alex, vor 30 Minuten", "text": "Der Samstag ist ein normaler Werktag und deshalb kann der Arbeitgeber anordnen, dass an diesem Tag auch gearbeitet wird. Dabei spielt es keine Rolle, ob du Kinder hast oder nicht. Oft ist es aber auch so, dass du dann an einem anderen Tag in der Woche frei bekommst.", "distractor": ""}, {"key": "f", "title": "Gerhard, vor 3 Stunden", "text": "Also ich würde mir das gut überlegen. Wenn du bisher gut über die Runden gekommen bist, könntest du dir doch etwas mehr Freizeit gönnen. Meines Erachtens geht es hier auch um mehr Lebensqualität. Das Leben ist zu kurz, um nur zu arbeiten.", "distractor": "Reflexión filosófica sobre valorar el tiempo libre y la calidad de vida, pero sin asesorar sobre consecuencias legales o financieras concretas."}], "items": [{"n": 10, "type": "choice", "prompt": "Soma: Meine Kinder sind unter der Woche ganztags in der Kita, damit ich Vollzeit arbeiten kann. Jetzt soll ich in den nächsten Wochen samstags ins Büro kommen. Ich habe aber niemanden, der da auf meine Kinder aufpassen kann. Kann der Arbeitgeber das verlangen?", "answer": "e", "confidence": "hoch", "quote": "Der Samstag ist ein normaler Werktag und deshalb kann der Arbeitgeber anordnen, dass an diesem Tag auch gearbeitet wird. Dabei spielt es keine Rolle, ob du Kinder hast oder nicht.", "explain_ru": "Soma спрашивает, может ли предприятие обязать её выйти в субботу, если у неё мале
