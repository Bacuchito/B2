, "title": "Lassen Sie sich von Kolleg*innen den Arbeitsalltag nicht schwermachen", "text": "Sie erfahren von der Sitzung zuletzt? In der Kantine sitzen Sie allein? Es passiert immer häufiger in deutschen Unternehmen, dass manche Kollegen anderen das Leben aus unklaren Gründen schwermachen. Lesen Sie in diesem Ratgeber, wo Sie Hilfe bekommen können.", "distractor": ""}, {"key": "h", "title": "Den Horizont erweitern", "text": "Manche zieht die Liebe in ein anderes Land. Andere sehen dort interessantere berufliche Möglichkeiten. Manchmal ist das die reine Abenteuerlust. Auslandsaufenthalte können", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Barbara braucht beruflich Grundkenntnisse in Spanisch.", "answer": "f", "confidence": "hoch", "quote": "sondern auch die sprachlichen Kompetenzen werden immer wichtiger. Hier findet jeder den richtigen Kurs für sich, von Englisch über Japanisch bis Suaheli.", "explain": "Barbara necesita conocimientos básicos de español por motivos laborales. El anuncio f es el único que ofrece cursos de idiomas para el ámbito profesional y remite a un curso adecuado para cada persona. El anuncio c también menciona cursos de idiomas, pero los financian las empresas para su plantilla.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Frank denkt, dass sein Gehalt nicht branchenüblich ist.", "answer": "d", "confidence": "mittel", "quote": "Wie viel sollte man in seinem Beruf verdienen? Wie viele Stunden arbeitet man üblicherweise? Bekommt man einen Zuschuss für Sprachkurse? Mit vielen gesetzlichen Dingen muss man sich auskennen, wenn man im Arbeitsleben steht. Die wichtigsten Informationen finden Sie hier zusammengefasst.", "explain": "Frank cree que su sueldo no es el habitual del sector. El anuncio d es una recopilación de información para empleados que responde, entre otras, a la pregunta «Wie viel sollte man in seinem Beruf verdienen?», lo que permite comparar con lo habitual. Confianza media porque el anuncio no dice «branchenüblich» ni da cifras: es una guía general. El anuncio e («Zahlen Sie faire Gehälter!») trata el sueldo desde la perspectiva del jefe y no sirve a Frank.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Petra fühlt sich am Arbeitsplatz gemobbt.", "answer": "g", "confidence": "hoch", "quote": "Es passiert immer häufiger in deutschen Unternehmen, dass manche Kollegen anderen das Leben aus unklaren Gründen schwermachen. Lesen Sie in diesem Ratgeber, wo Sie Hilfe bekommen können.", "explain": "Petra se siente acosada por sus colegas. El anuncio g describe exactamente a compañeros que hacen la vida difícil a otros y ofrece un manual con lugares donde encontrar ayuda. El anuncio e menciona «Mobbing», pero se dirige a los jefes, no a la persona afectada.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Sandra möchte im Ausland berufliche Erfahrungen sammeln.", "answer": "h", "confidence": "mittel", "quote": "Andere sehen dort interessantere berufliche Möglichkeiten. Manchmal ist das die reine Abenteuerlust. Auslandsaufenthalte können", "explain": "Sandra quiere acumular experiencia profesional en el extranjero. El anuncio h es el único escrito para quien se plantea una estancia en el extranjero con motivos profesionales («interessantere berufliche Möglichkeiten», «Auslandsaufenthalte»). Confianza media porque el texto está cortado al final de la página y falta el cierre que daría el sentido completo; también hay que descartar el anuncio a, que habla del extranjero pero desde el punto de vista del empleador.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Felix möchte sich beruflich verändern.", "answer": "b", "confidence": "hoch", "quote": "Im Job ist es nie zu spät, mit etwas Neuem zu beginnen, um sich weiterzuentwickeln.", "explain": "Felix quiere cambiar profesionalmente. El anuncio b es el único que anima a empezar algo nuevo en el trabajo para desarrollarse y que remite a un asesoramiento sobre las posibilidades existentes. Los demás anuncios presuponen que la persona se queda en su puesto.", "verified": true}]}]}, {"id": "lesen-t2", "title": "Lesen Teil 2", "variants": [{"id": "t2_a-p19a", "label": "Text 1 – Variante 1", "page": 19, "note": "La p. 19 trae dos versiones de los ítems 6 y 7 sobre el mismo texto de la Willkommensmappe (Zugangskontrolle): esta primera y la marcada «Новый вариант» (→ t2_a-p19b). Se han separado en dos variantes para que cada ítem conserve su propia clave de respuesta («id#n»).", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nZugangskontrolle und Zeiterfassung\n\nAls Mitarbeiterinnen und Mitarbeiter erhalten Sie zu Beginn Ihres Arbeitsverhältnisses einen Firmenausweis mit Chip-Karte. Dieser berechtigt zum Zugang in das Unternehmensgebäude und dient gleichzeitig zur Erfassung der Arbeitszeit. Außerdem können Sie mit Ihrem Firmenausweis in der Kantine und am Getränkeautomaten bezahlen und das hauseigene Fitnessstudio benutzen. Neben den Aufzügen im Erdgeschoss finden Sie ein digitales Zeiterfassungsgerät. Bitte halten Sie beim Betreten und Verlassen des Gebäudes Ihren Firmenausweis an die blau markierte Fläche und vergewissern Sie sich, dass die Zeit des Arbeitsbeginns und Arbeitsendes richtig erfasst wurde. Dies erkennen Sie anhand der Anzeige des Geräts, die Ihnen Ihre monatliche Arbeitszeit anzeigt.\n\nDie Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden. Die Personalabteilung richtet Ihnen einen Zugang zu unserem Arbeitskonten-System PersoTime ein. Damit können Sie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen.", "items": [{"n": 6, "type": "truefalse", "prompt": "Der Firmenausweis hat neben der Arbeitszeiterfassung auch andere Funktionen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Außerdem können Sie mit Ihrem Firmenausweis in der Kantine und am Getränkeautomaten bezahlen und das hauseigene Fitnessstudio benutzen.", "explain": "«Richtig»: el texto atribuye al carné, además de registrar la jornada, otras funciones (pagar en la cantina y en las máquinas expendedoras y usar el gimnasio de la empresa). «Falsch» no se sostiene, porque esas funciones se enumeran expresamente en el pasaje citado.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Überstunden", "options": [{"key": "a", "text": "können online eingesehen werden."}, {"key": "b", "text": "sind in der Firma grundsätzlich nicht erlaubt."}, {"key": "c", "text": "werden von der Zeiterfassung nicht registriert."}], "answer": "a", "confidence": "hoch", "quote": "Die Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden. Die Personalabteilung richtet Ihnen einen Zugang zu unserem Arbeitskonten-System PersoTime ein. Damit können Sie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen.", "explain": "Correcto a: la Zeiterfassung calcula automáticamente las horas extraordinarias y la cuenta horaria que las recoge se puede consultar en cualquier momento en la intranet, es decir, en línea. b es falso porque el texto da por hechas las horas extraordinarias (las calcula y prevé su compensación), no las prohíbe; c es falso porque son precisamente la Zeiterfassung y el sistema PersoTime quienes las registran.", "verified": true}]}, {"id": "t2_a-p19b", "label": "Text 1 – Variante 1 (Новый вариант)", "page": 19, "note": "Fassung «Новый вариант» de los ítems 6 y 7 sobre el mismo texto de la p. 19 (el original no repite el texto): el ítem 6 es una reformulación del anterior y el 7 plantea ahora la cuenta horaria personal en lugar de las horas extraordinarias. Donde el enunciado o una opción aparecían con dos formulaciones separadas por «/», se ha conservado la última.", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nZugangskontrolle und Zeiterfassung\n\nAls Mitarbeiterinnen und Mitarbeiter erhalten Sie zu Beginn Ihres Arbeitsverhältnisses einen Firmenausweis mit Chip-Karte. Dieser berechtigt zum Zugang in das Unternehmensgebäude und dient gleichzeitig zur Erfassung der Arbeitszeit. Außerdem können Sie mit Ihrem Firmenausweis in der Kantine und am Getränkeautomaten bezahlen und das hauseigene Fitnessstudio benutzen. Neben den Aufzügen im Erdgeschoss finden Sie ein digitales Zeiterfassungsgerät. Bitte halten Sie beim Betreten und Verlassen des Gebäudes Ihren Firmenausweis an die blau markierte Fläche und vergewissern Sie sich, dass die Zeit des Arbeitsbeginns und Arbeitsendes richtig erfasst wurde. Dies erkennen Sie anhand der Anzeige des Geräts, die Ihnen Ihre monatliche Arbeitszeit anzeigt.\n\nDie Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden. Die Personalabteilung richtet Ihnen einen Zugang zu unserem Arbeitskonten-System PersoTime ein. Damit können Sie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen.", "items": [{"n": 6, "type": "truefalse", "prompt": "Der Firmenausweis dient als firmeninternes Zahlungsmittel.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Außerdem können Sie mit Ihrem Firmenausweis in der Kantine und am Getränkeautomaten bezahlen und das hauseigene Fitnessstudio benutzen.", "explain": "«Richtig»: el carné sirve para pagar dentro de la empresa, en la cantina y en las máquinas expendedoras de bebidas, que forman parte del recinto. «Falsch» queda descartado por esa misma frase, que describe el carné como medio de pago interno.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Das persönliche Arbeitszeitkonto", "options": [{"key": "a", "text": "ist nur über die Personalabteilung einsehbar. / kann in der Personalabteilung eingesehen werden."}, {"key": "b", "text": "müssen die Mitarbeiter selbst anlegen."}, {"key": "c", "text": "wird täglich aktualisiert."}], "answer": "c", "confidence": "mittel", "quote": "Bitte halten Sie beim Betreten und Verlassen des Gebäudes Ihren Firmenausweis an die blau markierte Fläche und vergewissern Sie sich, dass die Zeit des Arbeitsbeginns und Arbeitsendes richtig erfasst wurde.", "explain": "La c es la única que queda en pie, por eliminación. a) dice que la cuenta solo se ve a través de la oficina de personal, y el texto lo contradice de forma directa: «Die Personalabteilung richtet Ihnen einen Zugang … ein. Damit können Sie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen.» Es la propia oficina de personal la que le habilita el acceso, pero usted lo consulta por su cuenta en la intranet, no en ventanilla. b) es falsa porque las horas no las apunta el trabajador: «Die Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden.» c) no aparece literalmente en el texto —de ahí la confianza media—, pero el fichaje de entrada y salida es diario y el saldo se calcula de forma automática, así que es la lectura razonable una vez descartadas a y b."}]}, {"id": "t2_a-p20a", "label": "Text 1 – Variante 2", "page": 20, "note": "La p. 20 trae el apartado «Arbeitszeit» dos veces: esta primera versión (Gleitzeitsystem, Kernarbeitszeit 9.00–15.30) y la marcada «Новый вариант» (→ t2_a-p20b), con otro texto y nuevos ítems.", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nArbeitszeit\n\nIn unserem Unternehmen arbeiten wir nach dem Gleitzeitsystem. Die Kernarbeitszeit ist Montag bis Freitag zwischen 9.00 Uhr und 15.30 Uhr. In dieser Zeit müssen alle Mitarbeitenden anwesend sein. Jede Abwesenheit während dieser Zeit muss genehmigt sein.\n\nDie tägliche Rahmenarbeitszeit ist von 6.00 Uhr bis 19.30 Uhr. Bitte beachten Sie, dass innerhalb dieses Zeitrahmens maximal acht, in Ausnahmefällen zehn, Stunden täglich gearbeitet werden darf.\n\nAlle Mitarbeitenden müssen beim Betreten und Verlassen des Gebäudes mit der Zeiterfassungskarte am Lesegerät ein- und ausstechen. So wird die tägliche Arbeitszeit auf dem Zeitkonto festgehalten. Dieses kann jederzeit am Lesegerät eingesehen werden.\n\nBei entsprechendem Guthaben kann einmal pro Monat ein ganzer Arbeitstag (acht Stunden) als Gleitzeittag genommen werden. Zu berücksichtigen ist, dass ein Minuskontostand im Folgemonat auszugleichen ist. Zusätzlich können im Monat Dezember bis zu vier Arbeitstage als Gleitzeittage genommen werden, um sie zwischen Weihnachten und Neujahr zu nutzen, wenn das Arbeitszeitkonto ein ausreichendes Guthaben aufweist.", "items": [{"n": 6, "type": "truefalse", "prompt": "Bei Gleitzeit können Mitarbeitende täglich beliebig viele Stunden arbeiten.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Bitte beachten Sie, dass innerhalb dieses Zeitrahmens maximal acht, in Ausnahmefällen zehn, Stunden täglich gearbeitet werden darf.", "explain": "«Falsch»: el texto limita la jornada a un máximo de ocho horas diarias, diez solo en casos excepcionales, dentro del marco horario de 6.00 a 19.30. «Richtig» sería insostenible porque ninguna frase permite trabajar «beliebig viele Stunden».", "verified": true}, {"n": 7, "type": "choice", "prompt": "Durch Gleitzeit ist es den Mitarbeitenden möglich,", "options": [{"key": "a", "text": "ein Stundenguthaben aufzubauen."}, {"key": "b", "text": "jeden Monat einige Tage freizunehmen."}, {"key": "c", "text": "täglich mehr als acht Stunden zu arbeiten."}], "answer": "a", "confidence": "hoch", "quote": "Bei entsprechendem Guthaben kann einmal pro Monat ein ganzer Arbeitstag (acht Stunden) als Gleitzeittag genommen werden.", "explain": "Correcto a: el sistema de horario flexible permite acumular horas en la cuenta («Bei entsprechendem Guthaben», «ein Minuskontostand im Folgemonat auszugleichen»), es decir, formar un saldo de horas. b es falso porque con saldo suficiente se toma un día completo al mes (y hasta cuatro en diciembre), no «einige Tage» todos los meses; c es falso porque el máximo es de ocho horas diarias, diez solo en casos excepcionales.", "verified": true}]}, {"id": "t2_a-p20b", "label": "Text 1 – Variante 2 (Новый вариант)", "page": 20, "note": "Fassung «Новый вариант» (p. 20): el apartado «Arbeitszeit» aparece reescrito por completo (jornada semanal de 40 horas, Kernzeit de 10 a 15 Uhr, Gleitzeiten 8–10 y 15–17) con nuevos ítems 6 y 7. El original no repite el título «Willkommensmappe».", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Arbeitszeit\n\nDie wöchentliche Arbeitszeit beträgt 40 Stunden - bei einem Arbeitstag von acht Stunden, wobei die Pausen nicht mitgerechnet werden. Es gilt die Fünf-Tage-Woche. Betriebsbedingt ist es möglich, dass Sie bis zu zehn Stunden pro Tag arbeiten. Diese Mehrarbeit ist aber nur in Ausnahmefällen erlaubt und muss innerhalb von sechs Monaten durch entsprechend kürzerer Arbeitstage ausgeglichen werden.\n\nWir haben flexible Arbeitszeiten. Sie können selbst bestimmen, wann Sie morgens anfangen zu arbeiten und wann Sie aufhören. Zwischen 10 und 15 Uhr, in der sogenannten Kernzeit, müssen Sie jedoch anwesend sein. Gleitzeiten sind zwischen 8 und 10 Uhr und 15 und 17 Uhr. Innerhalb dieser Zeiten können Sie anfangen bzw. aufhören zu arbeiten. Aus betrieblichen Gründen kann der Arbeitgeber die Gleitzeit für eine gewisse Zeit aussetzen.\n\nUnser elektronisches Zeiterfassungssystem registriert täglich die Zahl der von Ihnen geleisteten Arbeitsstunden auf Ihrem persönlichen Arbeitszeitkonto. Haben Sie in einer Woche mehr als 40 Stunden gearbeitet, sollten Ihre Überstunden bereits vor Monatsende durch weniger Arbeit abgebaut werden. Wenn ein Abbau nicht möglich ist, wird mit der Geschäftsführung eine rasche Lösung besprochen.", "items": [{"n": 6, "type": "truefalse", "prompt": "Die Beschäftigten dürfen mit der Arbeit anfangen, wann sie wollen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "mittel", "quote": "Zwischen 10 und 15 Uhr, in der sogenannten Kernzeit, müssen Sie jedoch anwesend sein. Gleitzeiten sind zwischen 8 und 10 Uhr und 15 und 17 Uhr.", "explain": "«Falsch»: aunque el texto dice que uno mismo determina cuándo empieza, añade inmediatamente la restricción de que solo puede hacerlo dentro de las franjas de horario flexible (8-10 y 15-17) y que entre las 10 y las 15 horas hay que estar presente; la empresa puede incluso suspender la Gleitzeit. La primera frase de la sección («Sie können selbst bestimmen, wann Sie morgens anfangen») induce a error y por eso la confianza es media, pero la restricción explícita decide el ítem.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Ergibt sich auf einem Arbeitszeitkonto ein Plus,", "options": [{"key": "a", "text": "kann der Betrieb den Acht-Stunden-Tag verlängern oder verkürzen."}, {"key": "b", "text": "ist schnellstmöglich ein Ausgleich zu finden."}, {"key": "c", "text": "kann der Betrieb die Gleitzeitregelungen ändern."}], "answer": "b", "confidence": "hoch", "quote": "Haben Sie in einer Woche mehr als 40 Stunden gearbeitet, sollten Ihre Überstunden bereits vor Monatsende durch weniger Arbeit abgebaut werden. Wenn ein Abbau nicht möglich ist, wird mit der Geschäftsführung eine rasche Lösung besprochen.", "explain": "Correcto b: si se acumula un saldo positivo (más de 40 horas semanales), hay que compensar las horas extras con menos trabajo antes de fin de mes y, si no es posible, buscar rápidamente una solución con la dirección. a es falso porque el texto no permite alargar ni acortar el día de ocho horas en función del saldo; c también es falso porque la empresa puede suspender temporalmente la Gleitzeit por motivos operativos, pero eso no es consecuencia de un saldo positivo.", "verified": true}]}, {"id": "t2_a-p21a", "label": "Text 1 – Variante 3", "page": 21, "note": "", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nUrlaub\n\nJedem Mitarbeiter und jeder Mitarbeiterin in unserem Unternehmen stehen je nach Betriebszugehörigkeit bis zu 26 Tage Urlaub zu. Der Urlaub sollte nach Möglichkeit innerhalb des laufenden Kalenderjahres genommen werden. In Ausnahmefällen kann diese Frist bis zum 31.3. des Folgejahres verlängert werden.\n\nGrundsätzlich besteht der volle Urlaubsanspruch erst nach Ablauf der sechsmonatigen Probezeit. Ein anteiliger Urlaub ist jedoch nach Rücksprache auch bereits während dieser Zeit möglich.\n\nUrlaubsanträge für das folgende Kalenderjahr sind spätestens bis zum 15.11. mittels des dafür vorgesehenen Formulars beim Abteilungsleiter bzw. seiner Vertretung einzureichen. Den Urlaubswünschen der einzelnen Mitarbeiter wird entsprochen, sofern diese mit den Betriebsabläufen vereinbar sind. Sollten sich die beantragten Urlaubszeiten einzelner Kollegen und Kolleginnen überschneiden, wird nach sozialen Aspekten entschieden.\n\nDer Abteilungsleiter prüft alle Urlaubsanträge unverzüglich. Sollten die Wünsche der Mitarbeiter unvereinbar sein, wird der Betriebsrat mit dem Ziel der Einigung hinzugezogen.", "items": [{"n": 6, "type": "truefalse", "prompt": "Im ersten halben Jahr nach Neueinstellung ist kein Urlaub möglich.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Ein anteiliger Urlaub ist jedoch nach Rücksprache auch bereits während dieser Zeit möglich.", "explain": "«Falsch»: es cierto que el derecho completo a vacaciones solo nace tras los seis meses de prueba, pero el texto permite expresamente vacaciones parciales ya durante ese periodo previa consulta. Por eso la afirmación de que no es posible ningún tipo de vacaciones es incorrecta.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Urlaubsanträge müssen", "options": [{"key": "a", "text": "durch den Betriebsrat genehmigt werden."}, {"key": "b", "text": "in jedem Fall bewilligt werden."}, {"key": "c", "text": "rechtzeitig im Vorjahr gestellt werden."}], "answer": "c", "confidence": "hoch", "quote": "Urlaubsanträge für das folgende Kalenderjahr sind spätestens bis zum 15.11. mittels des dafür vorgesehenen Formulars beim Abteilungsleiter bzw. seiner Vertretung einzureichen.", "explain": "Correcto c: las solicitudes para el año siguiente deben presentarse a más tardar el 15.11., es decir, con antelación y todavía en el año anterior. a es falso porque el Betriebsrat solo interviene si los deseos de los empleados son incompatibles entre sí; b es falso porque solo se conceden si son compatibles con los procesos de la empresa («sofern diese mit den Betriebsabläufen vereinbar sind»).", "verified": true}]}, {"id": "t2_a-p21b", "label": "Text 1 – Variante 4", "page": 21, "note": "", "kind": "text", "intro": "Lesen Sie den Text und lösen Sie die Aufgaben 6 und 7: Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung (a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nRegelungen am Arbeitsplatz\n\nEs ist wichtig, dass auf dem Betriebsgelände der AKO.KG alle Maßnahmen eingehalten werden, damit Sie sich selbst und andere nicht gefährden. Bei der Bedienung der Maschinen sind die jeweiligen Sicherheitsbestimmungen zu befolgen, angepasst an die neuen Richtlinien laut Arbeitsschutzgesetz vom Januar dieses Jahres. Die Sicherheitsbestimmungen finden Sie in der Anlage zu dieser Willkommensmappe und zusammengefasst auch auf Informationsblättern an den Maschinen.\n\nSollten Sie hierzu Fragen haben, setzen Sie sich bitte mit unserer Sicherheitsbeauftragten Frau Scholz, Zimmer 122, Durchwahl - 308, in Verbindung. Dies ist auch die Kontaktstelle für alle Störungen, Unfälle, Brand oder bei für Sie unklaren Situationen. In diesen Fällen kontaktieren Sie bitte auch immer den Empfang, Durchwahl -100.\n\nNach Verlassen der Werkstätten sind diese immer ordnungsgemäß abzuschließen, damit sich kein Unbefugter den Anlagen und Maschinen nähern kann. Der Arbeitsplatz muss sauber gehalten werden, damit umherliegender Unrat nicht zu einer Gefahrenquelle werden kann. Achten Sie dabei bitte auch auf die vorgeschriebene Trennung der Abfälle in die hierfür vorgesehenen Container im Hof.\n\nAuf dem gesamten Betriebsgelände ist Filmen und Fotografieren sowie der Konsum von Alkohol und Zigarettenkonsum nicht gestattet.", "items": [{"n": 6, "type": "truefalse", "prompt": "Die Regelungen am Arbeitsplatz wurden aktualisiert.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Bei der Bedienung der Maschinen sind die jeweiligen Sicherheitsbestimmungen zu befolgen, angepasst an die neuen Richtlinien laut Arbeitsschutzgesetz vom Januar dieses Jahres.", "explain": "«Richtig»: el texto dice que las normas de seguridad se han adaptado («angepasst») a las nuevas directrices de la ley de seguridad laboral de enero de este año, luego las reglas del puesto de trabajo están actualizadas. «Falsch» chocaría con ese «neuen Richtlinien … vom Januar dieses Jahres».", "verified": true}, {"n": 7, "type": "choice", "prompt": "Auf dem Firmengelände", "options": [{"key": "a", "text": "darf kein Abfall entsorgt werden."}, {"key": "b", "text": "ist bei Gefahr Frau Scholz zu informieren."}, {"key": "c", "text": "ist es nicht erlaubt, Nahrungsmittel zu sich zu nehmen."}], "answer": "b", "confidence": "hoch", "quote": "Sollten Sie hierzu Fragen haben, setzen Sie sich bitte mit unserer Sicherheitsbeauftragten Frau Scholz, Zimmer 122, Durchwahl - 308, in Verbindung. Dies ist auch die Kontaktstelle für alle Störungen, Unfälle, Brand oder bei für Sie unklaren Situationen.", "explain": "Correcto b: la Sra. Scholz es el punto de contacto para averías, accidentes, incendios y situaciones poco claras, es decir, hay que avisarla en caso de peligro (y también a recepción). a es falso porque el texto no prohíbe los residuos, sino que obliga a separarlos en los contenedores del patio; c es falso porque solo se prohíben filmar, fotografiar, el alcohol y el tabaco, no comer.", "verified": true}]}, {"id": "t2_b-p22", "label": "Text 1 – Variante 5", "page": 22, "note": "La página 22 reproduce dos veces la variante 5 con el mismo texto «Betriebssport»: la segunda lista (con los números de test 150321/150301) no repite el texto, solo los ítems 6 y 7, con las opciones del 7 reordenadas y con la errata «Schreibtischen» ya corregida. Se conserva esa segunda versión de las opciones (la respuesta correcta es entonces «b», no «c»).", "kind": "text", "intro": "Lesen Sie den Text. Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nBetriebssport\n\nSportliche Aktivitäten werden bei uns großgeschrieben. So bieten wir unseren Mitarbeitern im Untergeschoss einen Fitnessraum mit Bodenmatten und mehreren Fitnessgeräten, wie z. B. zwei Indoor-Fahrradtrainern. Dieser ist für alle ganztägig frei und ohne Gebühr zugänglich und kann selbstverständlich auch in den Pausen genutzt werden.\n\nAußerdem nehmen wir als Unternehmen jedes Jahr am städtischen Firmenlauf teil. Es hat sich die Tradition entwickelt, dass sich die teilnehmenden Kolleginnen und Kollegen gemeinsam in einem wöchentlichen Lauftreff auf dieses Event vorbereiten. Dieser findet jeden Mittwoch um 17:30 Uhr statt.\n\nAbwechslungsreich gestaltete Arbeitsplätze in den Büros tragen zur Steigerung der Aktivität auch während der Arbeit bei und wirken den negativen Auswirkungen langen Sitzens entgegen. Alle Schreibtische sind höhenverstellbar, sodass Arbeiten auch im Stehen möglich ist.\n\nZusätzlich bieten wir das sogenannte „Deskbike“ an – eine Art Büro-Fahrrad, das sich einfach unter einen höhenverstellbaren Schreibtisch rollen lässt. Damit möchten wir Ihnen die Möglichkeit bieten, Ihre Gesundheit zu stärken. Nicht zuletzt macht Bewegung auch einfach Spaß.", "items": [{"n": 6, "type": "truefalse", "prompt": "Der Fitnessraum ist während der Arbeitszeit geöffnet.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Dieser ist für alle ganztägig frei und ohne Gebühr zugänglich und kann selbstverständlich auch in den Pausen genutzt werden.", "explain": "El texto dice que el Fitnessraum está disponible «ganztägig» (todo el día) y que puede usarse «auch in den Pausen», es decir, también durante el tiempo de trabajo; por tanto la afirmación es correcta. No hay ninguna indicación de que esté cerrado en horario laboral, así que «Falsch» no se sostiene.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Die Mitarbeiter", "options": [{"key": "a", "text": "haben teilweise spezielle Schreibtische in Stehhöhe."}, {"key": "b", "text": "können das hausinterne Fitnessstudio gratis nutzen."}, {"key": "c", "text": "erhalten einen Zuschuss für ein Deskbike."}], "answer": "b", "confidence": "hoch", "quote": "Dieser ist für alle ganztägig frei und ohne Gebühr zugänglich", "explain": "La opción b es correcta porque el texto afirma que el Fitnessraum interno «ist für alle ganztägig frei und ohne Gebühr zugänglich», es decir, se puede usar gratis. La a es falsa: no son mesas especiales solo para algunos, sino que «Alle Schreibtische sind höhenverstellbar». La c también es falsa: el Deskbike se ofrece («Zusätzlich bieten wir das sogenannte „Deskbike“ an»), pero en ningún momento se menciona un Zuschuss (subvención) para comprarlo.", "verified": true}]}, {"id": "t2_b-p23", "label": "Text 1 – Variante 6", "page": 23, "note": "El ítem 6 aparece dos veces: la primera formulación (obligación de asistir varias veces al año) y la marcada «Новый вариант» (inscripción en Personal). Son preguntas claramente distintas y con respuesta opuesta, por eso se conservan las dos como dos ítems con n=6. Del ítem 7 solo se conserva la versión vigente marcada «Новый вариант от 21.12.24»: la versión anterior plantea la misma cuestión (qué se les presenta a los nuevos empleados) con la misma respuesta correcta (el sistema de seguridad), así que es una reformulación, no un ítem distinto. Los dos ítems con n=6 se muestran como 6a y 6b y se puntúan por separado.", "kind": "text", "intro": "Lesen Sie den Text. Entscheiden Sie bei den Aufgaben 6, ob die Aussagen richtig oder falsch sind, und wählen Sie bei Aufgabe 7 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nEinführungstag\n\nUnsere Personalreferentin führt mehrmals jährlich einen Einführungstag für unsere neuen Mitarbeiterinnen und Mitarbeiter durch, an dem diese mit unterschiedlichen Arbeitsbereichen sowie den rechtlichen und organisatorischen Prozessen vertraut gemacht werden. Wir möchten darauf hinweisen, dass die Teilnahme an einer solchen Informationsveranstaltung verpflichtend ist. Am Einführungstag besteht außerdem die Möglichkeit, Kolleginnen und Kollegen aus anderen Abteilungen kennenzulernen. Die Abteilungsleiter werden bei dieser Gelegenheit in kurzen Worten einen Einblick in den Tätigkeitsbereich ihrer Teams geben.\n\nDa unser Unternehmen in einem hochsensiblen Bereich arbeitet, haben wir für unser gesamtes Gebäude ein komplexes Sicherheitssystem. Auch dieses stellen wir Ihnen im Rahmen des Orientierungstages im Detail vor. Weitere Einzelheiten zu diesem Tag, wie den Treffpunkt und den Ablauf, finden Sie in dieser Mappe. Eine gesonderte Anmeldung ist nicht erforderlich.\n\nFür Rückfragen zum Einführungstag steht die Personalabteilung gerne zur Verfügung.", "items": [{"n": 6, "type": "truefalse", "prompt": "Neue Mitarbeiter sollten sich in der Personalabteilung zum Einführungstag anmelden.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Eine gesonderte Anmeldung ist nicht erforderlich.", "explain": "El texto lo dice de forma explícita: «Eine gesonderte Anmeldung ist nicht erforderlich», así que no hay que inscribirse para el Einführungstag y la afirmación es falsa. La única mención a la Personalabteilung en relación con ese día es «Für Rückfragen zum Einführungstag steht die Personalabteilung gerne zur Verfügung», es decir, solo para consultas.", "verified": true}, {"n": 6, "type": "truefalse", "prompt": "Alle Mitarbeiter (Mitarbeitende) müssen ein paar Mal pro Jahr am Einführungstag (einer Informationsveranstaltung) teilnehmen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "mittel", "quote": "Wir möchten darauf hinweisen, dass die Teilnahme an einer solchen Informationsveranstaltung verpflichtend ist.", "explain": "El enunciado combina las dos informaciones del texto: el Einführungstag se celebra «mehrmals jährlich» y la asistencia es obligatoria («die Teilnahme … ist verpflichtend»), de modo que la afirmación encaja y la respuesta es «Richtig». Confianza media porque el texto habla de los «neuen Mitarbeiterinnen und Mitarbeiter» mientras el enunciado dice «Alle Mitarbeiter», y porque «ein paar Mal pro Jahr» describe más bien la frecuencia del evento que una obligación individual repetida. «Falsch» solo sería defendible forzando esa lectura literal.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Die neuen Mitarbeiter", "options": [{"key": "a", "text": "bekommen vom Abteilungsleiter eine Führung durch das Unternehmen."}, {"key": "b", "text": "können an einem Einführungstag im Betrieb teilnehmen."}, {"key": "c", "text": "werden mit den Funktionen des Sicherheitssystems vertraut gemacht."}], "answer": "c", "confidence": "hoch", "quote": "Auch dieses stellen wir Ihnen im Rahmen des Orientierungstages im Detail vor.", "explain": "La c es la correcta: el texto anuncia que el sistema de seguridad del edificio se presenta en detalle durante el día de orientación, lo que equivale a familiarizar a los nuevos empleados con su funcionamiento. La a no se sostiene: de los jefes de departamento solo se dice que «werden … in kurzen Worten einen Einblick in den Tätigkeitsbereich ihrer Teams geben», no que hagan una visita guiada por la empresa. La b es un distractor: presenta la asistencia como algo voluntario («können»), cuando el texto dice que es obligatoria («die Teilnahme … ist verpflichtend»).", "verified": true}]}, {"id": "t2_b-p24a", "label": "Text 1 – Variante 7", "page": 24, "note": "", "kind": "text", "intro": "Lesen Sie den Text. Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nEssen in der Kantine\n\nUnser Unternehmen arbeitet an sieben Tagen rund um die Uhr im Drei-Schicht-System. Deshalb steht auch unsere Kantine, die für die Mitarbeiterverpflegung sorgt, täglich 24 Stunden zur Verfügung. Um unnötige Wartezeiten in der Mittagszeit zu vermeiden, wurden in Abstimmung mit dem Betriebsrat aber folgende Essenszeiten für die einzelnen Abteilungen festgelegt: Während das Personal aus der Produktion und dem Lager in der ersten Gruppe von 12.00 bis 13.00 Uhr eine warme Mahlzeit zu sich nehmen kann, folgen die Mitarbeiterinnen und Mitarbeiter der Verwaltung in der zweiten Gruppe von 13.00 bis 14.00 Uhr.\n\nAußerdem können die Mitarbeitenden jederzeit frisch zubereitete Snacks oder kleine Mahlzeiten wie Suppen oder Nudelgerichte aus den in der Kantine aufgestellten Automaten entnehmen. Darüber hinaus befindet sich dort eine Mikrowelle, in der Sie mitgebrachte Speisen erwärmen können. Zusätzliche Automaten für kalte und warme Getränke befinden sich auf jeder Etage in unserem Firmengebäude.", "items": [{"n": 6, "type": "truefalse", "prompt": "Die Kantine ist immer geöffnet.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Deshalb steht auch unsere Kantine, die für die Mitarbeiterverpflegung sorgt, täglich 24 Stunden zur Verfügung.", "explain": "El texto dice que la cantina está a disposición «täglich 24 Stunden», es decir, las 24 horas de todos los días, porque la empresa trabaja «an sieben Tagen rund um die Uhr im Drei-Schicht-System». Por eso la afirmación es correcta y «Falsch» sería erróneo.", "verified": true}, {"n": 7, "type": "choice", "prompt": "Die Mitarbeiterinnen und Mitarbeiter", "options": [{"key": "a", "text": "bekommen in der Kantine keine Getränke."}, {"key": "b", "text": "können nachts in der Kantine essen."}, {"key": "c", "text": "müssen mittags oft sehr lange anstehen."}], "answer": "b", "confidence": "hoch", "quote": "Außerdem können die Mitarbeitenden jederzeit frisch zubereitete Snacks oder kleine Mahlzeiten wie Suppen oder Nudelgerichte aus den in der Kantine aufgestellten Automaten entnehmen.", "explain": "La b es correcta: la cantina está abierta 24 horas al día y los empleados pueden coger «jederzeit» (en cualquier momento) snacks o platos pequeños de las máquinas instaladas en la cantina, también de noche. La a es falsa: el texto menciona «Zusätzliche Automaten für kalte und warme Getränke» en el edificio, de modo que en ningún momento se afirma que en la cantina no haya bebidas. La c es falsa porque las franjas por grupos se fijaron precisamente «Um unnötige Wartezeiten in der Mittagszeit zu vermeiden», es decir, para evitar esperas largas.", "verified": true}]}, {"id": "t2_b-p24b", "label": "Text 1 – Variante 8", "page": 24, "note": "", "kind": "text", "intro": "Lesen Sie den Text. Entscheiden Sie bei Aufgabe 6, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 7 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nFirmenorganigramm\n\nFür Sie als neue Mitarbeiterin / neuer Mitarbeiter in unserem Traditionsunternehmen ist es wichtig zu wissen, wie das Unternehmen aufgebaut ist, d. h. welche Abteilungen es gibt, wer wofür verantwortlich ist und an wen Sie sich mit Ihren Fragen wenden können. Dafür wollen wir Ihnen im Folgenden Orientierung geben und hoffen, Ihnen den Einstieg in unser Unternehmen mit diesem Organigramm zu erleichtern.\n\nDas Dach unseres Unternehmens bildet die Geschäftsleitung. Hier laufen alle Fäden zusammen. Die nächste Ebene umfasst unsere Bereiche Produktion, Vertrieb und Personalwesen. In der Personalabteilung wenden Sie sich an Ihrem ersten Arbeitstag an Frau Müller. Von ihr erhalten Sie Ihren Mitarbeiterausweis, die für Sie notwendigen Schlüssel und die Arbeitskleidung. Für Urlaubsangelegenheiten steht Ihnen Herr Scholz zur Verfügung. Gehaltsfragen können Sie mit Herrn Kleinschmidt besprechen. Sollten Sie eine Dienstreise unternommen haben, rechnen Sie die entstandenen Kosten mit Herrn Friedrich ab.", "items": [{"n": 6, "type": "truefalse", "prompt": "Den neuen Mitarbeitenden wird die Organisationsstruktur des Unternehmens vorgestellt.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Für Sie als neue Mitarbeiterin / neuer Mitarbeiter in unserem Traditionsunternehmen ist es wichtig zu wissen, wie das Unternehmen aufgebaut ist, d. h. welche Abteilungen es gibt, wer wofür verantwortlich ist und an wen Sie sich mit Ihren Fragen wenden können.", "explain": "El texto se dirige expresamente a los nuevos empleados y les explica la estructura de la empresa (qué departamentos hay, quién es responsable de qué, a quién dirigirse) precisamente mediante este organigrama («Dafür wollen wir Ihnen im Folgenden Orientierung geben»). La afirmación coincide, así que es «Richtig»; nada en el texto la contradice.", "verified": true}, {"n": 7, "type": "choice", "prompt": "In der Personalabteilung", "options": [{"key": "a", "text": "bekommen die Mitarbeitenden ihre Ausstattung."}, {"key": "b", "text": "bezahlt man die Arbeitskleidung."}, {"key": "c", "text": "bucht man Dienstreisen."}], "answer": "a", "confidence": "hoch", "quote": "Von ihr erhalten Sie Ihren Mitarbeiterausweis, die für Sie notwendigen Schlüssel und die Arbeitskleidung.", "explain": "La a es correcta: en la Personalabteilung, la Sra. Müller entrega el carné de empleado, las llaves necesarias y la ropa de trabajo, es decir, el equipamiento («Ausstattung») del empleado. La b es falsa: la ropa de trabajo se «erhalten» (se recibe), no se paga, y no se menciona ningún pago. La c también es falsa: las Dienstreisen solo aparecen para liquidar los gastos con el Sr. Friedrich («rechnen Sie die entstandenen Kosten mit Herrn Friedrich ab»), no para reservarlas.", "verified": true}]}, {"id": "t2_c-p25a", "label": "Text 2 – Variante 1 (alte Antwortversion bis 08.2024)", "page": 25, "note": "Mismo texto de la Willkommensmappe (Arbeitsunfälle); esta es la versión antigua de los ítems 8 y 9, anterior a 08.2024.", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nArbeitsunfälle\nArbeitsunfälle sind Unfälle, die Beschäftigte bei der Ausübung ihrer Arbeit oder einer Dienstreise erleiden. Es muss also ein ursächlicher Zusammenhang mit der beruflichen Tätigkeit bestehen. Nach einem Arbeitsunfall müssen Beschäftigte ihren Arbeitgeber umgehend über den Unfall in Kenntnis setzen und sich ggf. in Behandlung begeben. Außerdem ist, sobald es der Gesundheitszustand des Geschädigten zulässt, ein detaillierter Unfallbericht zu verfassen und der Personalabteilung vorzulegen.\n\nIm Falle einer Arbeitsunfähigkeit nach einem Arbeitsunfall erhalten Arbeitnehmende für sechs Wochen eine Lohnfortzahlung vom Arbeitgeber, danach übernimmt die Berufsgenossenschaft (BG), zahlt u. a. Verletztengeld in Höhe von 80 Prozent des Bruttogehalts und kommt ggf. auch für weitere Kosten auf.\n\nZu Arbeitsunfällen zählen auch Wegeunfälle, also Unfälle, die sich auf dem direkten Weg zwischen dem Wohngebäude und der Arbeitsstätte ereignen. Dieser Weg beginnt vor der eigenen Haustür und endet, sobald die Arbeitnehmenden das Unternehmen erreicht haben. Dabei sind bestimmte notwendige Umwege mitversichert, wie etwa der Weg zur Kita, Umleitungen oder im Falle von Fahrgemeinschaften, unabhängig davon, mit welchen Verkehrsmitteln man sich fortbewegt.\n\nDer Versicherungsschutz umfasst ausschließlich Personenschäden; Sachschäden, wie z. B. Schäden am Fahrzeug, sind hierbei nicht mitversichert. Die BG übernimmt in diesem Fall z. B. die Behandlungskosten sowie ggf. Krankenpflege oder medizinische Rehabilitation.", "items": [{"n": 8, "type": "truefalse", "prompt": "Ein Fahrradunfall auf dem Weg zur Arbeit zählt nicht als Arbeitsunfall.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Zu Arbeitsunfällen zählen auch Wegeunfälle, also Unfälle, die sich auf dem direkten Weg zwischen dem Wohngebäude und der Arbeitsstätte ereignen.", "explain": "El texto incluye expresamente los «Wegeunfälle» (accidentes in itinere) en el trayecto directo entre la vivienda y el lugar de trabajo, e incluso cubre desvíos necesarios como el camino a la guardería. El medio de transporte es irrelevante («unabhängig davon, mit welchen Verkehrsmitteln man sich fortbewegt»), así que un accidente de bicicleta de camino al trabajo sí cuenta como accidente laboral y la afirmación es falsa.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Nach einem Arbeitsunfall", "options": [{"key": "a", "text": "bezahlt die Berufsgenossenschaft sofort Verletztengeld."}, {"key": "b", "text": "erhalten Arbeitnehmer sechs Wochen volles Gehalt."}, {"key": "c", "text": "muss ein Bericht vom Arzt beim Arbeitgeber abgegeben werden."}], "answer": "b", "confidence": "hoch", "quote": "Im Falle einer Arbeitsunfähigkeit nach einem Arbeitsunfall erhalten Arbeitnehmende für sechs Wochen eine Lohnfortzahlung vom Arbeitgeber, danach übernimmt die Berufsgenossenschaft (BG), zahlt u. a. Verletztengeld in Höhe von 80 Prozent des Bruttogehalts", "explain": "b es correcta: durante seis semanas el empresario sigue pagando el salario íntegro («Lohnfortzahlung»), y solo «danach» entra la Berufsgenossenschaft. a es falsa porque el Verletztengeld no se paga «sofort», sino tras esas seis semanas (y además es el 80 % del bruto, no el salario completo). c es falsa porque el informe de accidente lo redacta el propio trabajador accidentado («ist ein detaillierter Unfallbericht zu verfassen») y se entrega a Recursos Humanos, no lo emite el médico.", "verified": true}]}, {"id": "t2_c-p25b", "label": "Text 2 – Variante 1 (neue Antwortversion №160201, 160221)", "page": 25, "note": "Mismo texto que la variante anterior; ítems nuevos (№160201, 160221). El enunciado del ítem 8 cambia por completo (ahora se refiere al informe del accidente).", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nArbeitsunfälle\nArbeitsunfälle sind Unfälle, die Beschäftigte bei der Ausübung ihrer Arbeit oder einer Dienstreise erleiden. Es muss also ein ursächlicher Zusammenhang mit der beruflichen Tätigkeit bestehen. Nach einem Arbeitsunfall müssen Beschäftigte ihren Arbeitgeber umgehend über den Unfall in Kenntnis setzen und sich ggf. in Behandlung begeben. Außerdem ist, sobald es der Gesundheitszustand des Geschädigten zulässt, ein detaillierter Unfallbericht zu verfassen und der Personalabteilung vorzulegen.\n\nIm Falle einer Arbeitsunfähigkeit nach einem Arbeitsunfall erhalten Arbeitnehmende für sechs Wochen eine Lohnfortzahlung vom Arbeitgeber, danach übernimmt die Berufsgenossenschaft (BG), zahlt u. a. Verletztengeld in Höhe von 80 Prozent des Bruttogehalts und kommt ggf. auch für weitere Kosten auf.\n\nZu Arbeitsunfällen zählen auch Wegeunfälle, also Unfälle, die sich auf dem direkten Weg zwischen dem Wohngebäude und der Arbeitsstätte ereignen. Dieser Weg beginnt vor der eigenen Haustür und endet, sobald die Arbeitnehmenden das Unternehmen erreicht haben. Dabei sind bestimmte notwendige Umwege mitversichert, wie etwa der Weg zur Kita, Umleitungen oder im Falle von Fahrgemeinschaften, unabhängig davon, mit welchen Verkehrsmitteln man sich fortbewegt.\n\nDer Versicherungsschutz umfasst ausschließlich Personenschäden; Sachschäden, wie z. B. Schäden am Fahrzeug, sind hierbei nicht mitversichert. Die BG übernimmt in diesem Fall z. B. die Behandlungskosten sowie ggf. Krankenpflege oder medizinische Rehabilitation.", "items": [{"n": 8, "type": "truefalse", "prompt": "Im Falle eines Arbeitsunfalls muss man sofort einen Bericht beim Arbeitgeber einreichen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Außerdem ist, sobald es der Gesundheitszustand des Geschädigten zulässt, ein detaillierter Unfallbericht zu verfassen und der Personalabteilung vorzulegen.", "explain": "Lo inmediato («umgehend») es informar al empresario del accidente, no presentar un informe; el informe detallado solo hay que redactarlo cuando el estado de salud del accidentado lo permita («sobald es der Gesundheitszustand des Geschädigten zulässt»). Por eso la afirmación «sofort» es falsa. Además el informe va a la Personalabteilung, no se «presenta» sin más al empresario.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Nach einem Arbeitsunfall", "options": [{"key": "a", "text": "bezahlt die Berufsgenossenschaft sofort Verletztengeld."}, {"key": "b", "text": "erhalten Arbeitnehmer sechs Wochen volles Gehalt."}, {"key": "c", "text": "trägt der Arbeitgeber die Kosten für die medizinische Versorgung."}], "answer": "b", "confidence": "hoch", "quote": "Im Falle einer Arbeitsunfähigkeit nach einem Arbeitsunfall erhalten Arbeitnehmende für sechs Wochen eine Lohnfortzahlung vom Arbeitgeber, danach übernimmt die Berufsgenossenschaft (BG), zahlt u. a. Verletztengeld in Höhe von 80 Prozent des Bruttogehalts", "explain": "b es correcta: el empresario mantiene el salario durante seis semanas («Lohnfortzahlung»). a es falsa: la Berufsgenossenschaft actúa solo «danach», es decir, después de las seis semanas. c es falsa porque los costes médicos no los asume el empresario, sino la BG («Die BG übernimmt in diesem Fall z. B. die Behandlungskosten sowie ggf. Krankenpflege oder medizinische Rehabilitation»).", "verified": true}]}, {"id": "t2_c-p26a", "label": "Text 2 – Variante 2 (alte Fassung)", "page": 26, "note": "Primera fassung del texto de Datenschutz: la formación obligatoria debe repetirse «spätestens alle drei Jahre».", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nWichtige Hinweise zum Datenschutz\nUnser Unternehmen ist dem Datenschutz gemäß der EU-Datenschutz-Grundverordnung (DSGVO) verpflichtet. Grundsätzlich dürfen die Daten unserer Mitarbeiterinnen und Mitarbeiter nur dann erhoben werden, wenn diese vorher ausdrücklich zugestimmt haben. Mit Ihrem Arbeitsvertrag haben Sie bereits ein Formular erhalten, mit dessen Unterschrift Sie bestätigt haben, dass Sie mit der Speicherung Ihrer personenbezogenen Daten einverstanden sind. Sollten Sie zukünftig Fragen zum Datenschutz haben, können Sie sich an unseren internen Datenschutzbeauftragten Herrn Koljak (Durchwahl-814) oder seine Stellvertreterin Frau Dombrovski (Durchwahl -485) wenden. Wir erwarten von unseren Mitarbeiterinnen und Mitarbeitern, sich beim Thema Datenschutzverordnung immer auf dem neuesten Stand zu halten und bieten daher jedes Jahr Schulungen zu diesem Zweck an. Diese werden von unserem externen Schulungspartner WissMax durchgeführt und finden zu unterschiedlichen Terminen, jeweils am Wochenende, bei uns im Haus statt. Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei. Eine Teilnahme an einem solchen Training muss spätestens alle drei Jahre erfolgen und durch ein Zertifikat nachgewiesen werden. Reichen Sie dieses bitte unaufgefordert bei der Personalabteilung ein. Alternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen. In diesem Fall bitten wir Sie jedoch, eine solche Teilnahme im Vorfeld mit unserer Personalabteilung abzusprechen, sodass Ihnen das Seminar genehmigt und eine Kostenübernahme garantiert werden kann.", "items": [{"n": 8, "type": "truefalse", "prompt": "Die Mitarbeiter müssen einmal pro Jahr ein Seminar zum Datenschutz belegen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Eine Teilnahme an einem solchen Training muss spätestens alle drei Jahre erfolgen und durch ein Zertifikat nachgewiesen werden.", "explain": "En esta fassung del texto la formación es obligatoria como muy tarde cada tres años («spätestens alle drei Jahre»). Que la empresa «ofrezca» cursos cada año («bieten daher jedes Jahr Schulungen … an») no significa que el empleado deba hacer uno anual: la obligación es trienal, así que la afirmación es falsa.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Die Teilnahme am Seminar", "options": [{"key": "a", "text": "gilt als Arbeitszeit."}, {"key": "b", "text": "ist kostenpflichtig."}, {"key": "c", "text": "muss bei WissMax erfolgen."}], "answer": "a", "confidence": "hoch", "quote": "Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei.", "explain": "a es correcta: la asistencia se computa como tiempo de trabajo. b es falsa porque el seminario es «kostenfrei» para los empleados. c es falsa porque el texto permite otra vía: «Alternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen», previa autorización de Recursos Humanos.", "verified": true}]}, {"id": "t2_c-p26b", "label": "Text 2 – Variante 2 (neue Fassung)", "page": 26, "note": "Segunda fassung del mismo texto de Datenschutz: cambia un solo dato, la formación pasa a ser «jedes Jahr». Los ítems 8 y 9 se mantienen literalmente, pero la respuesta del ítem 8 se invierte.", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nWichtige Hinweise zum Datenschutz\nUnser Unternehmen ist dem Datenschutz gemäß der EU-Datenschutz-Grundverordnung (DSGVO) verpflichtet. Grundsätzlich dürfen die Daten unserer Mitarbeiterinnen und Mitarbeiter nur dann erhoben werden, wenn diese vorher ausdrücklich zugestimmt haben.\nMit Ihrem Arbeitsvertrag haben Sie bereits ein Formular erhalten, mit dessen Unterschrift Sie bestätigt haben, dass Sie mit der Speicherung Ihrer personenbezogenen Daten einverstanden sind. Sollten Sie zukünftig Fragen zum Datenschutz haben, können Sie sich an unseren internen Datenschutzbeauftragten Herrn Koljak (Durchwahl-814) oder seine Stellvertreterin Frau Dombrovski (Durchwahl -485) wenden.\nWir erwarten von unseren Mitarbeiterinnen und Mitarbeitern, sich beim Thema Datenschutzverordnung immer auf dem neuesten Stand zu halten und bieten daher jedes Jahr Schulungen zu diesem Zweck an. Diese werden von unserem externen Schulungspartner WissMax durchgeführt und finden zu unterschiedlichen Terminen, jeweils am Wochenende, bei uns im Haus statt. Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei.\nEine Teilnahme an einem solchen Training muss jedes Jahr erfolgen und durch ein Zertifikat nachgewiesen werden. Reichen Sie dieses bitte unaufgefordert bei der Personalabteilung ein.\nAlternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen. In diesem Fall bitten wir Sie jedoch, eine solche Teilnahme im Vorfeld mit unserer Personalabteilung abzusprechen, sodass Ihnen das Seminar genehmigt und eine Kostenübernahme garantiert werden kann.", "items": [{"n": 8, "type": "truefalse", "prompt": "Die Mitarbeiter müssen einmal pro Jahr ein Seminar zum Datenschutz belegen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Eine Teilnahme an einem solchen Training muss jedes Jahr erfolgen und durch ein Zertifikat nachgewiesen werden.", "explain": "En esta versión nueva del texto la frase clave cambia: la participación en la formación «muss jedes Jahr erfolgen» (antes: «spätestens alle drei Jahre»). Como el enunciado dice exactamente eso —una vez al año—, es correcto. Es el caso típico de la inversión de la respuesta entre versiones del mismo texto.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Die Teilnahme am Seminar", "options": [{"key": "a", "text": "gilt als Arbeitszeit."}, {"key": "b", "text": "ist kostenpflichtig."}, {"key": "c", "text": "muss bei WissMax erfolgen."}], "answer": "a", "confidence": "hoch", "quote": "Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei.", "explain": "a es correcta: la asistencia cuenta como tiempo de trabajo, igual que en la versión anterior (este ítem no cambia entre versiones). b es falsa porque es gratuita («kostenfrei»). c es falsa porque se admite una formación equivalente en otro proveedor previa consulta con Recursos Humanos.", "verified": true}]}, {"id": "t2_c-p27a", "label": "Text 2 – Variante 3 (alte Fassung bis 07.2024)", "page": 27, "note": "Primera de las tres versiones del texto sobre el tabaco. El ítem 8 dice «schließt E-Zigaretten aus».", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nRauchen\nIm gesamten Betrieb gilt striktes Rauchverbot. Auf dem Betriebsgelände befinden sich vier durch Hinweisschilder gekennzeichnete Raucherzonen. Bitte benutzen Sie für Ihre Zigarettenreste die Standaschenbecher. Allerdings ist im Umkreis von mindestens 50 Metern rund um die Produktionshallen das Rauchen auch im Freien untersagt. Eine Missachtung dieser Regel zieht eine Abmahnung nach sich. Im Wiederholungsfall droht eine fristlose Kündigung. Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein. Bei Veranstaltungen ist das Rauchen auch auf der Dachterrasse des Gebäudes A zulässig. Beschäftigte, die dort rauchen, sind dazu angehalten, die Terrassentür geschlossen zu halten. Zigarettenpausen während der Arbeitszeit sind grundsätzlich zulässig, dabei sind folgende Regelungen zu beachten. Raucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.\n\nDa die Raucherpause nicht zur Arbeitszeit gehört, greift währenddessen nach dem Arbeitsrecht die Unfallversicherung nicht.\nDaher ist ein Arbeitsunfall während der Raucherpausen, z. B. ein Treppensturz, nicht über die Unfallversicherung abgedeckt.\n\nDie Gesundheit unserer MitarbeiterInnen liegt uns am Herzen. Aus diesem Grund übernehmen wir in Kooperation mit unserer betrieblichen Krankenkasse die Kosten für einen Raucherentwöhnungskurs.\nFür weitere Informationen wenden Sie sich bitte vertrauensvoll an unsere Personalabteilung.", "items": [{"n": 8, "type": "truefalse", "prompt": "Das Rauchverbot auf dem Firmengelände schließt E-Zigaretten aus.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein.", "explain": "«mit einschließen» significa incluir: la prohibición abarca expresamente también el uso de cigarrillos electrónicos. El enunciado dice lo contrario («ausschließen» = excluir), de modo que es falso. Ojo: en la versión 07.2024 el mismo ítem se formula con «einschließen» y entonces sí es Richtig.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Raucher", "options": [{"key": "a", "text": "müssen ihre Pausenzeiten nicht dokumentieren."}, {"key": "b", "text": "sind auch in der Raucherpause bei Unfällen versichert."}, {"key": "c", "text": "sollen die Terrassentür beim Rauchen schließen."}], "answer": "c", "confidence": "hoch", "quote": "Beschäftigte, die dort rauchen, sind dazu angehalten, die Terrassentür geschlossen zu halten.", "explain": "c es correcta: quien fuma en la terraza del edificio A durante eventos debe mantener la puerta de la terraza cerrada. a es falsa porque las pausas de tabaco no son tiempo de trabajo y hay que registrarlas en el sistema de control horario («müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden»). b es falsa porque durante la pausa no rige el seguro de accidentes y una caída por las escaleras no está cubierta («greift währenddessen nach dem Arbeitsrecht die Unfallversicherung nicht»).", "verified": true}]}, {"id": "t2_c-p27b", "label": "Text 2 – Variante 3 (neue Fassung 07.2024)", "page": 27, "note": "Versión 07.2024: el enunciado del ítem 8 se invierte («schließt E-Zigaretten ein») y el ítem 9 estrena las opciones a) y b) nuevas.", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nRauchen\nIm gesamten Betrieb gilt striktes Rauchverbot. Auf dem Betriebsgelände befinden sich vier durch Hinweisschilder gekennzeichnete Raucherzonen. Bitte benutzen Sie für Ihre Zigarettenreste die Standaschenbecher. Allerdings ist im Umkreis von mindestens 50 Metern rund um die Produktionshallen das Rauchen auch im Freien untersagt. Eine Missachtung dieser Regel zieht eine Abmahnung nach sich. Im Wiederholungsfall droht eine fristlose Kündigung. Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein. Bei Veranstaltunge  "text": "sind auch in der Raucherpause bei Unfällen versichert."}], "answer": "b", "confidence": "niedrig", "quote": "Raucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.", "explain": "b tiene el apoyo literal más claro: al no ser tiempo de trabajo, hay que fichar la salida y la vuelta en el sistema de registro horario, es decir, documentar la pausa; además es la formulación afirmativa de la antigua opción falsa a), lo que encaja con el rediseño del ítem. c es claramente falsa (durante la pausa no hay seguro de accidentes). Confianza baja porque a) también es defendible: el texto termina con «Für weitere Informationen wenden Sie sich bitte vertrauensvoll an unsere Personalabteilung», así que hay dos opciones sostenibles y solo el diseño del ítem inclina la balanza hacia b).", "verified": true}]}, {"id": "t2_c-p27c", "label": "Text 2 – Variante 3 (neue Fassung 05.2025)", "page": 27, "note": "Versión 05.2025: mantiene las opciones nuevas del ítem 9, pero vuelve a invertir el enunciado del ítem 8 («schließt E-Zigaretten aus»).", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nRauchen\nIm gesamten Betrieb gilt striktes Rauchverbot. Auf dem Betriebsgelände befinden sich vier durch Hinweisschilder gekennzeichnete Raucherzonen. Bitte benutzen Sie für Ihre Zigarettenreste die Standaschenbecher. Allerdings ist im Umkreis von mindestens 50 Metern rund um die Produktionshallen das Rauchen auch im Freien untersagt. Eine Missachtung dieser Regel zieht eine Abmahnung nach sich. Im Wiederholungsfall droht eine fristlose Kündigung. Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein. Bei Veranstaltungen ist das Rauchen auch auf der Dachterrasse des Gebäudes A zulässig. Beschäftigte, die dort rauchen, sind dazu angehalten, die Terrassentür geschlossen zu halten. Zigarettenpausen während der Arbeitszeit sind grundsätzlich zulässig, dabei sind folgende Regelungen zu beachten. Raucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.\n\nDa die Raucherpause nicht zur Arbeitszeit gehört, greift währenddessen nach dem Arbeitsrecht die Unfallversicherung nicht.\nDaher ist ein Arbeitsunfall während der Raucherpausen, z. B. ein Treppensturz, nicht über die Unfallversicherung abgedeckt.\n\nDie Gesundheit unserer MitarbeiterInnen liegt uns am Herzen. Aus diesem Grund übernehmen wir in Kooperation mit unserer betrieblichen Krankenkasse die Kosten für einen Raucherentwöhnungskurs.\nFür weitere Informationen wenden Sie sich bitte vertrauensvoll an unsere Personalabteilung.", "items": [{"n": 8, "type": "truefalse", "prompt": "Das Rauchverbot auf dem Firmengelände schließt E-Zigaretten aus.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein.", "explain": "El texto dice que la prohibición incluye los cigarrillos electrónicos («mit ein»), así que afirmar que los excluye («ausschließen») es falso. Es la misma formulación que la versión anterior a 07.2024; solo la versión 07.2024 usa «ein» y por eso allí la respuesta es Richtig.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Raucher", "options": [{"key": "a", "text": "erhalten weitere Informationen zu den Raucherbestimmungen in der Personalabteilung."}, {"key": "b", "text": "müssen ihre Pausenzeiten dokumentieren."}, {"key": "c", "text": "sind auch in der Raucherpause bei Unfällen versichert."}], "answer": "b", "confidence": "niedrig", "quote": "Raucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.", "explain": "Ítem idéntico al de la versión 07.2024: b se apoya en la obligación de registrar la pausa en el sistema de control horario (entrada y salida). c es falsa porque la pausa no está cubierta por el seguro de accidentes. Confianza baja porque a) también encuentra apoyo en la frase final del texto sobre informarse en la Personalabteilung; con dos opciones defendibles, la opción b) es la que reproduce una regla concreta para los fumadores.", "verified": true}]}, {"id": "t2_c-p28", "label": "Text 2 – Variante 4", "page": 28, "note": "", "kind": "text", "intro": "Lesen Sie den Text und die Aufgaben 8 und 9. Entscheiden Sie bei Aufgabe 8, ob die Aussage richtig oder falsch ist, und wählen Sie bei Aufgabe 9 die richtige Lösung a, b oder c.", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nLebensarbeitszeitkonto\nIn unserem Unternehmen wird die Möglichkeit angeboten, ein Lebensarbeitszeitkonto zu führen. Als Arbeitnehmer können Sie Arbeitszeit, zum Beispiel geleistete Überstunden, als Guthaben auf diesem Konto stehen lassen. Ähnlich wie bei einem Bankkonto, mit dem Unterschied, dass auch die Währung 'Zeit' akzeptiert wird.\n\nBei Bedarf können Sie Ihre angesparten Stunden wieder einlösen. Das Lebensarbeitszeitkonto bietet die Chance, adäquat auf verschiedene Bedürfnisse zu verschiedenen Zeiten im Laufe des Arbeitslebens einzugehen. Beispielsweise könnte die angesparte Zeit etwa für die Betreuung von pflegebedürftigen Angehörigen genutzt werden.\n\nAußerdem bietet unser Teilzeitangebot „Classic Vario“ eine Kombination von Teil- und Vollzeit bei flexibler Einteilung der Arbeitszeit. Nach rechtzeitiger Rücksprache mit dem Arbeitgeber (mindestens drei Monate vorher) kann die zu leistende Arbeitszeit auch zwischen Teil- und Vollzeit angepasst werden.\n\nWenn Sie eine gewisse zeitliche Flexibilität brauchen, können Sie auch kurzfristig nach Absprache im Homeoffice arbeiten. Für die Arbeit von zu Hause stehen den Mitarbeitern und Mitarbeiterinnen ein firmeneigener Laptop und ein Diensthandy zur Verfügung.\n\nSollten Sie eine komplette Auszeit nehmen wollen, können Sie das für einen Zeitraum von bis zu maximal zwölf Monaten vorübergehend tun. Wir sichern Ihnen einen gleichwertigen Arbeitsplatz nach Ihrer Rückkehr zu.\n\nAls familienfreundliche Firma bieten wir neben den oben beschriebenen flexiblen Arbeitszeitmodellen Betreuungsmöglichkeiten während der Schulferien für die Kinder unserer Mitarbeiter und Mitarbeiterinnen.", "items": [{"n": 8, "type": "truefalse", "prompt": "Das Unternehmen unterstützt die Mitarbeiter finanziell bei privaten Problemen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "mittel", "quote": "Ähnlich wie bei einem Bankkonto, mit dem Unterschied, dass auch die Währung 'Zeit' akzeptiert wird.", "explain": "El texto no menciona ninguna ayuda económica para problemas privados: el apoyo es en tiempo y en servicios (cuenta de tiempo de trabajo, Teilzeit «Classic Vario», home office con portátil y móvil de empresa, excedencia de hasta doce meses, plazas de cuidado infantil en vacaciones). La única «cuenta» es de horas y su «moneda» es el tiempo, no el dinero. Confianza media porque la respuesta se deduce por ausencia de cualquier dato económico, no de una frase que lo niegue expresamente.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Die Mitarbeiter können", "options": [{"key": "a", "text": "bei Bedarf von zu Hause aus arbeiten."}, {"key": "b", "text": "sich maximal ein halbes Jahr beurlauben lassen."}, {"key": "c", "text": "Geldleistungen für die Pflege von Angehörigen erhalten."}], "answer": "a", "confidence": "hoch", "quote": "Wenn Sie eine gewisse zeitliche Flexibilität brauchen, können Sie auch kurzfristig nach Absprache im Homeoffice arbeiten.", "explain": "a es correcta: se puede trabajar desde casa a corto plazo tras acordarlo con la empresa, justo lo que pide el enunciado («bei Bedarf»). b es falsa porque la excedencia puede durar «bis zu maximal zwölf Monaten», es decir, hasta un año, no medio. c es falsa porque las horas acumuladas pueden destinarse al cuidado de familiares dependientes, pero se trata de tiempo y no de prestaciones económicas («könnte die angesparte Zeit etwa für die Betreuung von pflegebedürftigen Angehörigen genutzt werden»).", "verified": true}]}, {"id": "t2_d-p29", "label": "Text 2 – Variante 5", "page": 29, "note": "", "kind": "text", "intro": "Lesen Sie den Text und wählen Sie bei jeder Aufgabe die richtige Lösung (Richtig/Falsch bzw. a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nBerichtsheft\nDas Berichtsheft ist der Nachweis, dass die Ausbildung ordnungsgemäß verläuft. In diesem wird alles dokumentiert, was man während der Ausbildung macht und lernt. Sie sollten nicht nur Ihre Tätigkeiten im Betrieb beschreiben, sondern auch alle Einweisungen, Schulungen und den innerbetrieblichen Unterricht vermerken. Wie Sie sehen, ist das Führen der Ausbildungsnachweise ein wichtiger Inhalt Ihrer Ausbildung, bei dem Sie lernen, Ihre Tätigkeiten zeitlich und inhaltlich zu dokumentieren. Darüber hinaus bietet es Ihnen die Möglichkeit, den Zeitaufwand für bestimmte Tätigkeiten präziser einzuschätzen und Ihre Aufgaben zu reflektieren.\n\nWeiterhin wird Ihr Tätigkeitsbereich für Beteiligte im Unternehmen und für die Stellen, die für die Berufsausbildung zuständig sind, nachvollziehbar dargestellt. Es ist Pflicht, das Berichtsheft jeweils vor der Zwischen- und der Abschlussprüfung vorzulegen. Nur wenn es vollständig ist, wird der Prüfungsausschuss Sie zu den Prüfungen zulassen. Wenn Sie zwischen zwei Noten stehen, können Ihre Berichte sogar Ihre Endnote beeinflussen.\n\nNeben den Wochenberichten, die Sie jeden Freitag an Ihren Teamleiter schicken, müssen Sie nach dem Durchlaufen einer Abteilung einen zusätzlichen Bericht verfassen. Dieser ergänzt den Wochenbericht und verschafft Ihnen einen genaueren Überblick über die Aufgaben in der jeweiligen Abteilung. Sie dürfen Ihre Berichte während der Arbeitszeit schreiben und können sie sowohl in klassischer Heftform als auch in digitaler Form auf unserer firmeninternen Plattform führen und einreichen. In festen Abständen haben Sie das Heft Ihrem Ausbildungsleiter zur Kenntnisnahme vorzulegen. In Ihrem eigenen Interesse empfehlen wir Ihnen, es immer zeitnah zu vervollständigen.", "items": [{"n": 8, "type": "truefalse", "prompt": "Auszubildende ohne ordentlich geführtes Berichtsheft dürfen nicht an der Abschlussprüfung teilnehmen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Richtig", "confidence": "hoch", "quote": "Nur wenn es vollständig ist, wird der Prüfungsausschuss Sie zu den Prüfungen zulassen.", "explain": "El texto dice literalmente que solo si el Berichtsheft está completo el tribunal de examen («Prüfungsausschuss») admitirá al aprendiz a los exámenes, y que es obligatorio presentarlo antes del examen intermedio y del final. Por tanto, quien no lo lleve correctamente no puede presentarse a la Abschlussprüfung: la afirmación es correcta.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Das Berichtsheft muss", "options": [{"key": "a", "text": "in der Freizeit geführt werden."}, {"key": "b", "text": "dem Ausbildungsleiter regelmäßig gezeigt werden."}, {"key": "c", "text": "jeden Tag ausgefüllt werden."}], "answer": "b", "confidence": "hoch", "quote": "In festen Abständen haben Sie das Heft Ihrem Ausbildungsleiter zur Kenntnisnahme vorzulegen.", "explain": "La opción b es correcta porque el texto exige presentar el cuaderno al Ausbildungsleiter «in festen Abständen», es decir, con regularidad. La a es falsa: «Sie dürfen Ihre Berichte während der Arbeitszeit schreiben», luego no hay que hacerlo en el tiempo libre. La c también es falsa: los informes son semanales («die Sie jeden Freitag an Ihren Teamleiter schicken») y además hay un informe adicional por departamento, no uno diario.", "verified": true}]}, {"id": "t2_d-p30", "label": "Text 2 – Variante 6 (Test №150321, 150301)", "page": 30, "note": "", "kind": "text", "intro": "Lesen Sie den Text und wählen Sie bei jeder Aufgabe die richtige Lösung (Richtig/Falsch bzw. a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nDatenschutz\nIhre im Unternehmen verwendeten Passwörter dürfen unter keinen Umständen weitergegeben und müssen regelmäßig alle sechs Monate geändert werden. Bitte verwenden Sie keine Passwörter, die Sie auch für private Konten nutzen, und generieren Sie sichere Passwörter mit einem Passwortgenerator. USB-Sticks und Ihnen unbekannte Geräte sind vor Inbetriebnahme in isolierter Umgebung zu prüfen. Es darf keine Software aus dem Internet heruntergeladen oder selbstständig auf dem Arbeitslaptop oder dem PC installiert werden. Außerdem ist es untersagt, Daten lokal abzuspeichern.\n\nBitte achten Sie bei Dienstreisen darauf, Ihren Laptop vor Fremden zu sichern! Bedenken Sie bitte auch, dass bei der Arbeit möglicherweise vertrauliche Informationen auf Ihrem Bildschirm zu sehen sind. Schützen Sie diese vor fremden Blicken.\n\nVertrauliche Telefonate dürfen nicht in der Öffentlichkeit geführt werden. Die private Nutzung von Diensthandys oder Laptops ist untersagt.\n\nVertrauliche und personenbezogene Daten müssen nach Dienstschluss verschlossen werden. Sie dürfen zudem nicht länger als unbedingt erforderlich aufgehoben oder gespeichert werden. Über interne Information Unternehmensangelegenheiten oder Dienstgeheimnisse ist Verschwiegenheit zu wahren. Unterlagen, Datenträg Abschriften oder Kopien dürfen nicht weitergegeben werden oder versehentlich in die Hände unbefugter Person gelangen. Vertrauliche Daten in Papierform sind in dafür bereitgestellten Schreddern zu vernichten.\n\nBitte melden Sie ungewöhnliche Vorkommnisse oder Feststellungen umgehend der Geschäftsführung oder unsere Datenschutzbeauftragten, Herrn Dr. Sevici. Er ist unter der Durchwahl -33 zu erreichen und steht Ihnen auch bei Fragen bezüglich des Datenschutzes in unserem Unternehmen zur Verfügung.", "items": [{"n": 8, "type": "truefalse", "prompt": "Die Mitarbeitenden dürfen ihre Passwörter frühestens alle sechs Monate ändern.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "mittel", "quote": "müssen regelmäßig alle sechs Monate geändert werden", "explain": "El texto establece una obligación: las contraseñas «müssen regelmäßig alle sechs Monate geändert werden», es decir, como máximo cada seis meses (intervalo máximo). El enunciado lo invierte con «frühestens» (como muy pronto cada seis meses = no antes), lo que significaría que está prohibido cambiarlas más a menudo; eso no se dice en el texto y contradice el sentido de obligación periódica. Confianza media porque el texto fija el plazo máximo, pero no menciona explícitamente la posibilidad de cambiarlas antes.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Vertrauliche Daten", "options": [{"key": "a", "text": "dürfen nicht auf dem PC gespeichert werden."}, {"key": "b", "text": "müssen nach einer bestimmten Zeit gelöscht werden."}, {"key": "c", "text": "sollen ausgedruckt und abgeheftet werden."}], "answer": "b", "confidence": "mittel", "quote": "Vertrauliche und personenbezogene Daten müssen nach Dienstschluss verschlossen werden. Sie dürfen zudem nicht länger als unbedingt erforderlich aufgehoben oder gespeichert werden.", "explain": "La b reproduce la frase que habla exactamente de los datos confidenciales: no pueden conservarse ni almacenarse «länger als unbedingt erforderlich», es decir, hay que borrarlos una vez transcurrido el plazo necesario. La c es claramente falsa: los datos confidenciales en papel «sind in dafür bereitgestellten Schreddern zu vernichten», no archivarse. La a es la trampa: se apoya en «Außerdem ist es untersagt, Daten lokal abzuspeichern», pero esa norma general de TI va unida a la prohibición de instalar software y no se refiere específicamente a los datos confidenciales; de hecho el texto sí admite conservarlos («verschlossen», «nicht länger als … gespeichert»), por lo que lo regulado es el plazo y no una prohibición absoluta. Confianza media por esa cercanía entre a y b.", "verified": true}]}, {"id": "t2_d-p31", "label": "Text 2 – Variante 7 (Test №140321, 140301)", "page": 31, "note": "", "kind": "text", "intro": "Lesen Sie den Text und wählen Sie bei jeder Aufgabe die richtige Lösung (Richtig/Falsch bzw. a, b oder c).", "passage": "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\n\nArbeitsunfall und Berufsgenossenschaft (BG)\nMit dem Arbeitsantritt in unserem Unternehmen sind Sie als Arbeitnehmer*in automatisch gesetzlich unfallversichert.\n\nDer Träger dieser Unfallversicherung ist die Berufsgenossenschaft, deren Aufgaben in erster Linie darin bestehen, Arbeits- und Wegeunfälle, Berufskrankheiten sowie arbeitsbedingte Gesundheitsgefahren zu vermeiden. Das wird gewährleistet, indem regelmäßig Kontrollen der Arbeitssicherheit durch die Berufsgenossenschaft stattfinden. Bei diesen Kontrollen sind unsere Mitarbeiter*innen des Qualitätsmanagements mit vor Ort.\n\nSollte dennoch ein Unglücksfall eintreten, übernimmt die Berufsgenossenschaft sämtliche Kosten für Heilbehandlungen und Schadensersatzzahlungen. Dafür muss von Ihnen folgendes Prozedere eingehalten werden: Nach einem Arbeitsunfall wird zunächst der Ersthelfer oder die Ersthelferin informiert. Je nach Schwere des Unfalls wird ein Rettungswagen dazu gerufen. Ob mit oder ohne Krankenhausaufenthalt, müssen Sie aber in jedem Fall von einem Durchgangsarzt untersucht werden. Gleichzeitig sind wir als Arbeitgeber verpflichtet, den Unfall der Berufsgenossenschaft zu melden. Damit setzt der Prozess ein, dass die Berufsgenossenschaft Ihre Behandlung und deren Kosten übernimmt. Damit für Sie als Arbeitnehmer*in keine finanziellen Probleme entstehen, zahlt die Berufsgenossenschaft Ihnen den Lohn ab der siebten Woche der Arbeitsunfähigkeit weiter.\n\nDamit es aber gar nicht erst so weit kommt, führen wir regelmäßig Schulungen zur Arbeitssicherheit durch. Diese beinhalten auf der einen Seite Einweisungen zum korrekten Tragen der Schutzkleidung und auf der anderen Seite konkrete Anweisungen zur richtigen Bedienung der Maschinen.", "items": [{"n": 8, "type": "truefalse", "prompt": "Alle Mitarbeitenden müssen für eine Arbeitsunfallversicherung sorgen.", "options": [{"key": "Richtig", "text": "Richtig"}, {"key": "Falsch", "text": "Falsch"}], "answer": "Falsch", "confidence": "hoch", "quote": "Mit dem Arbeitsantritt in unserem Unternehmen sind Sie als Arbeitnehmer*in automatisch gesetzlich unfallversichert.", "explain": "El texto dice que el seguro de accidentes es automático al empezar a trabajar y que la aseguradora (la Berufsgenossenschaft) es la que asume esa cobertura. Por tanto, los empleados no tienen que contratar ni procurarse ninguna Arbeitsunfallversicherung por su cuenta: la afirmación es falsa.", "verified": true}, {"n": 9, "type": "choice", "prompt": "Nach einem Arbeitsunfall", "options": [{"key": "a", "text": "muss man sich einem Durchgangsarzt vorstellen."}, {"key": "b", "text": "schickt die BG einen Arzt oder Rettungswagen."}, {"key": "c", "text": "übernimmt die BG sofort die Gehaltsfortzahlungen."}], "answer": "a", "confidence": "hoch", "quote": "müssen Sie aber in jedem Fall von einem Durchgangsarzt untersucht werden", "explain": "La a es correcta: el texto impone en todos los casos («in jedem Fall») el reconocimiento por un Durchgangsarzt, con o sin hospitalización. La b es fal
