<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2 Beruf — Test de Lesen, Hören y Schreiben</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaf0; --dim:#9aa3b2; --acc:#4f8cff; --ok:#2fb37a; --bad:#e05561;
    --warn:#e0a33a; --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--txt);}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
         padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .spacer{flex:1}
  .stat{font-size:13px;color:var(--dim)}
  .stat b{color:var(--txt)}
  .layout{display:flex;align-items:flex-start;gap:0;min-height:calc(100vh - 49px)}
  nav{width:290px;flex:0 0 290px;border-right:1px solid var(--line);background:var(--panel);
      height:calc(100vh - 49px);overflow-y:auto;position:sticky;top:49px;padding:10px}
  nav .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
           margin:14px 6px 6px;font-weight:700}
  nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--txt);
             padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.3}
  nav button:hover{background:var(--panel2)}
  nav button.active{background:var(--acc);color:#fff;font-weight:600}
  nav button .pill{float:right;font-size:11px;color:var(--dim);font-weight:400}
  nav button.active .pill{color:#dce7ff}
  main{flex:1;padding:22px 26px 80px;max-width:920px}
  h2{font-size:20px;margin:0 0 4px}
  h2 + .sub{color:var(--dim);font-size:13.5px;margin-bottom:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
         padding:14px 16px;margin-bottom:16px}
  .panel h3{margin:0 0 8px;font-size:14px;letter-spacing:.02em}
  details.passage summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--acc);
                          user-select:none;outline:none}
  details.passage[open] summary{margin-bottom:10px}
  .passage-body{white-space:pre-wrap;font-size:14.5px;line-height:1.65;color:#d7dbe4;
                max-height:60vh;overflow-y:auto;padding-right:6px}
  .ad{border-left:3px solid var(--line);padding:6px 0 6px 12px;margin:10px 0}
  .ad .k{font-weight:700;color:var(--acc);margin-right:6px}
  .ad .t{font-weight:600}
  .ad .body{color:#cfd4de;font-size:14px;margin-top:2px}
  .ad.used{border-left-color:var(--ok)}
  .ad.unused{border-left-color:var(--warn)}
  .q{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
     padding:14px 16px;margin-bottom:14px}
  .q .num{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;
          background:var(--panel2);border-radius:6px;font-size:12.5px;font-weight:700;margin-right:8px}
  .q .prompt{font-size:15px;margin-bottom:12px;display:inline}
  .opts{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;
       padding:9px 11px;cursor:pointer;background:var(--panel2);transition:.12s}
  .opt:hover{border-color:var(--acc)}
  .opt .key{font-weight:700;min-width:18px;color:var(--acc)}
  .opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .opt.correct{border-color:var(--ok);background:#152a22}
  .opt.wrong{border-color:var(--bad);background:#2a1719}
  .opt.correct .key{color:var(--ok)}
  .opt.wrong .key{color:var(--bad)}
  .letters{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .letters button{width:38px;height:36px;border-radius:8px;border:1px solid var(--line);
                  background:var(--panel2);color:var(--txt);font-weight:700;cursor:pointer;font-size:14px}
  .letters button:hover{border-color:var(--acc)}
  .letters button.sel{background:var(--acc);border-color:var(--acc);color:#fff}
  .letters button.correct{background:var(--ok);border-color:var(--ok);color:#fff}
  .letters button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
  .fb{margin-top:12px;border-radius:8px;padding:11px 13px;font-size:14px;display:none}
  .fb.show{display:block}
  .fb.good{background:#14261f;border:1px solid #1f5c45}
  .fb.bad{background:#261618;border:1px solid #6b2b31}
  .fb .verdict{font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fb .quote{font-style:italic;color:#cfd4de;border-left:3px solid var(--acc);
             padding:5px 0 5px 10px;margin:8px 0}
  .badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.02em}
  .badge.hoch{background:#123a2a;color:#5fd6a3;border:1px solid #1f5c45}
  .badge.mittel{background:#3a3112;color:#e8c46a;border:1px solid #6b5a1f}
  .badge.niedrig{background:#3a1416;color:#f08a92;border:1px solid #6b2b31}
  .badge.ok{background:#12263a;color:#7fb6ff;border:1px solid #1f4a6b}
  .badge.tag{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 15px;
       cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn.danger{background:#3a1416;border:1px solid #6b2b31;color:#f08a92}
  .btn.success{background:#123a2a;border:1px solid #1f5c45;color:#5fd6a3}
  .note{background:#2a2312;border:1px solid #6b5a1f;color:#e8c46a;padding:9px 12px;
        border-radius:8px;font-size:13.5px;margin-bottom:14px}
  .empty{color:var(--dim);padding:40px 0;text-align:center}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:13px}

  /* Schreiben UI & Editor */
  .schreiben-layout{display:flex;flex-direction:column;gap:16px}
  .memo-card{background:#2a2412;border-left:4px solid var(--warn);padding:12px 14px;border-radius:6px;margin:12px 0;font-size:14px;line-height:1.55}
  .memo-card b{color:var(--warn)}
  .letter-card{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--acc);padding:14px 16px;border-radius:6px;margin:12px 0;white-space:pre-wrap;font-size:14px;line-height:1.6;color:#d7dbe4}
  .lp-list{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:8px}
  .lp-item{display:flex;align-items:flex-start;gap:10px;background:var(--panel2);padding:10px 12px;border-radius:8px;font-size:14px;border:1px solid var(--line)}
  .lp-item input[type="checkbox"]{margin-top:3px;cursor:pointer;accent-color:var(--acc)}
  .lp-item .lp-num{min-width:22px;height:22px;background:var(--acc);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
  
  .editor-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .editor-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px}
  .editor-textarea{width:100%;min-height:280px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:var(--txt);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;resize:vertical;outline:none;box-sizing:border-box}
  .editor-textarea:focus{border-color:var(--acc)}
  .timer-box{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
  .timer-display{font-size:15px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
  .timer-display.warn{color:var(--bad)}

  /* Evaluación de Schreiben */
  .eval-banner{padding:14px 18px;border-radius:8px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:space-between;margin:16px 0;flex-wrap:wrap;gap:10px}
  .eval-banner.pass{background:#14261f;border:1px solid #1f5c45;color:#5fd6a3}
  .eval-banner.fail{background:#261618;border:1px solid #6b2b31;color:#f08a92}
  .crit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:16px 0}
  .crit-box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
  .crit-box .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:13.5px}
  .crit-box .c-body{font-size:13px;color:#cfd4de;line-height:1.5}
  .err-card{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:6px;padding:10px 14px;margin-bottom:10px}
  .err-card .orig{color:#f08a92;text-decoration:line-through;margin-bottom:4px;font-size:13.5px}
  .err-card .corr{color:#5fd6a3;font-weight:600;margin-bottom:4px;font-size:14px}
  .err-card .rule{font-size:13px;color:#cfd4de;line-height:1.45}
  .model-text{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;color:#e8eaf0}
  .copy-btn{font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--txt)}
  .copy-btn:hover{background:var(--panel2)}

  /* Modal de Configuración de IA */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:540px;box-shadow:0 12px 36px rgba(0,0,0,0.6);overflow:hidden;animation:pop .15s ease-out}
  @keyframes pop{from{transform:scale(0.96);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{margin:0;font-size:16px;font-weight:600}
  .modal-close{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
  .modal-close:hover{color:var(--txt)}
  .modal-body{padding:18px;max-height:75vh;overflow-y:auto}
  .modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--panel2)}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--txt)}
  .form-group small{display:block;font-size:12px;color:var(--dim);margin-top:4px;line-height:1.4}
  .input, .select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--txt);font-size:13.5px;outline:none;box-sizing:border-box}
  .input:focus, .select:focus{border-color:var(--acc)}

  @media(max-width:860px){nav{position:static;height:auto;width:100%;flex:1 1 auto}
    .layout{flex-direction:column}main{padding:16px}}
</style>
</head>

wer": "g", "confidence": "hoch", "quote": "Du träumst von einem Job im Ausland, dann knüpfe erste Kontakte durch ein Praktikum.", "explain": "Yassin quiere sus primeras experiencias profesionales en el extranjero. El anuncio g propone exactamente eso: un «Auslandspraktikum» como primera toma de contacto. El anuncio a es un viaje de idiomas, sin componente laboral.", "verified": true}]}, {"id": "t1_a2-p9", "label": "Variante 1 (nueva versión 08.2024)", "page": 9, "note": "Misma tarea que t1-v1 (p. 8); el anuncio b aparece reformulado como «Innovativer Klimaschutz».", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Auf ins Abenteuer!", "text": "Du hast Lust auf Sonne, Strand und eine fremde Sprache? Eine Sprachreise ermöglicht es dir nicht nur Land und Leute kennenzulernen, sondern auch deine frisch erworbenen Fähigkeiten direkt anzuwenden. Wo kannst du welche Sprachen lernen?", "distractor": "Habla de un viaje de idiomas (Sprachreise), no de formación profesional ni de trabajo en el extranjero. Se confunde con la persona 3 (idiomas) y con la 5 (extranjero), pero no ofrece ni una formación reglada ni un empleo."}, {"key": "b", "title": "Innovativer Klimaschutz.", "text": "Deutschland hat in der Forschung auf der ganzen Welt ein hohes Ansehen. Das Land arbeitet in den Bereichen Umweltschutz und Meeresbiologie eng mit anderen Ländern zusammen. So fördert die Bundesrepublik Deutschland Austauschprogramme zwischen internationalen Forschern.", "distractor": ""}, {"key": "c", "title": "Job mit guten Zukunftsaussichten.", "text": "Wer verschiedene Sprachen fließend beherrscht und zwischen ihnen ohne Mühe hin- und herwechseln kann, ist der geborene Fremdsprachenkorrespondent. Es gibt unterschiedliche Möglichkeiten und Wege, diesen Beruf zu erlernen und damit die eigene Leidenschaft für Sprachen auszuleben.", "distractor": ""}, {"key": "d", "title": "Nutzen Sie das Recht für sich!", "text": "Baumert & Partner helfen Ihnen, Ihr Recht durchzusetzen. Im Interview geben die Experten für Familienrecht Tipps zu folgenden Fragen: Wie gehen Sie aus einer Scheidung als Sieger hervor? Wie können Sie sich im Sorgerechtsstreit behaupten? Und welcher Anteil des Gehalts Ihres Expartners steht Ihnen zu?", "distractor": "Es derecho de FAMILIA (divorcio, custodia, pensión), no derecho laboral. Es la trampa jurídica para la persona 2, que necesita un experto en derecho laboral."}, {"key": "e", "title": "Umgangsformen im Berufsalltag.", "text": "Gewisse Verhaltensweisen, die im privaten Kontext völlig in Ordnung sind, können auf der Arbeit zu unangenehmen Stolpersteinen werden. Wie kleide ich mich richtig im Büro? Duzen oder siezen? Welche Themen sollten Sie im Smalltalk vermeiden?", "distractor": ""}, {"key": "f", "title": "Souverän am Telefon.", "text": "Die Begrüßung am Telefon dauert in der Regel nur zwei bis drei Sekunden, ist aber für den ersten Eindruck entscheidend. Die richtige Formulierung hängt davon ab, ob es sich um ein eingehendes Telefonat oder einen aktiven Anruf handelt. Worauf sollen Sie achten?", "distractor": "Trata de técnica telefónica (saludo y formulación en llamadas), no de cómo tratar a colegas nuevos. Es el distractor temático de la persona 1."}, {"key": "g", "title": "Warum nicht mal ganz weit weg?", "text": "Du träumst von einem Job im Ausland, dann knüpfe erste Kontakte durch ein Praktikum. Ohne großen Aufwand kannst du so auch deine Sprachkenntnisse perfektionieren. Aber es gibt noch mehr überzeugende Gründe für ein Auslandspraktikum.", "distractor": ""}, {"key": "h", "title": "Zahl der Klagen rückläufig.", "text": "Seit einigen Jahren geht die Zahl der Kündigungsschutzklagen kontinuierlich zurück, das bestätigt der Deutsche Anwaltsverein. Warum nur jeder Fünfte nach einer Kündigung Klage bei Gericht einreicht, warum es sich trotzdem für Sie lohnen kann und wie Sie dabei vorgehen müssen, erklärt der Arbeitsrechtsexperte Lars Hansson.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Moutasem fragt sich, wie er neue Kollegen korrekt ansprechen sollte.", "answer": "e", "confidence": "hoch", "quote": "Wie kleide ich mich richtig im Büro? Duzen oder siezen? Welche Themen sollten Sie im Smalltalk vermeiden?", "explain": "Moutasem duda de cómo dirigirse correctamente a colegas nuevos; el anuncio e trata justamente las formas de trato en el día a día laboral y plantea de forma literal «Duzen oder siezen?». El anuncio f (técnica telefónica) es el distractor temático.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Selma wurde entlassen und will sich dagegen wehren.", "answer": "h", "confidence": "hoch", "quote": "Seit einigen Jahren geht die Zahl der Kündigungsschutzklagen kontinuierlich zurück, das bestätigt der Deutsche Anwaltsverein.", "explain": "Selma ha sido despedida y quiere defenderse: eso es exactamente una «Kündigungsschutzklage». h es el único anuncio que habla de demandas por despido y presenta a un experto en derecho laboral; d también es jurídico, pero de familia.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Anka überlegt, eine Ausbildung im Fremdsprachenbereich zu machen.", "answer": "c", "confidence": "hoch", "quote": "Es gibt unterschiedliche Möglichkeiten und Wege, diesen Beruf zu erlernen und damit die eigene Leidenschaft für Sprachen auszuleben.", "explain": "Anka quiere formarse en el ámbito de los idiomas y c menciona de forma explícita «diesen Beruf zu erlernen» refiriéndose al Fremdsprachenkorrespondent, una profesión del sector. El anuncio a (viaje de idiomas) no es una formación profesional.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Sean ist Professor für Biologie und sucht einen Job im internationalen Umfeld.", "answer": "b", "confidence": "hoch", "quote": "Das Land arbeitet in den Bereichen Umweltschutz und Meeresbiologie eng mit anderen Ländern zusammen. So fördert die Bundesrepublik Deutschland Austauschprogramme zwischen internationalen Forschern.", "explain": "Sean es profesor de biología y busca un entorno internacional; b es el único anuncio científico e internacional y su campo (Meeresbiologie, biología marina) coincide literalmente con el suyo. El resto de anuncios se descartan por eliminación (derecho, teléfono, prácticas, viaje de idiomas).", "verified": true}, {"n": 5, "type": "choice", "prompt": "Yassin möchte erste Berufserfahrungen im Ausland sammeln.", "answer": "g", "confidence": "hoch", "quote": "Du träumst von einem Job im Ausland, dann knüpfe erste Kontakte durch ein Praktikum.", "explain": "Yassin quiere sus primeras experiencias profesionales en el extranjero y g propone precisamente eso: un Auslandspraktikum como primera toma de contacto. El anuncio a es un viaje de idiomas, sin componente laboral.", "verified": true}]}, {"id": "t1_a2-p10", "label": "Variante 1 (nueva versión 07.02.2025)", "page": 10, "note": "El encabezado dice «вариант №1»: es la misma tarea que la variante de la p. 9, pero con los nombres y el orden de las personas cambiados, por lo que cambian las respuestas de cada número.", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Auf ins Abenteuer!", "text": "Du hast Lust auf Sonne, Strand und eine fremde Sprache? Eine Sprachreise ermöglicht es dir, nicht nur Land und Leute kennenzulernen, sondern auch deine frisch erworbenen Fähigkeiten direkt anzuwenden. Wo kannst du welche Sprachen lernen?", "distractor": "Habla de un viaje de idiomas (Sprachreise), no de formación profesional ni de trabajo en el extranjero. Se confunde con la persona 2 (idiomas) y con la 4 (extranjero), pero no ofrece ni una formación reglada ni un empleo."}, {"key": "b", "title": "Innovativer Klimaschutz.", "text": "Deutschland hat in der Forschung auf der ganzen Welt ein hohes Ansehen. Das Land arbeitet in den Bereichen Umweltschutz und Meeresbiologie eng mit anderen Ländern zusammen. So fördert die Bundesrepublik Deutschland Austauschprogramme zwischen internationalen Forschern.", "distractor": ""}, {"key": "c", "title": "Job mit guten Zukunftsaussichten.", "text": "Wer verschiedene Sprachen fließend beherrscht und zwischen ihnen ohne Mühe hin- und herwechseln kann, ist der geborene Fremdsprachenkorrespondent. Es gibt unterschiedliche Möglichkeiten und Wege, diesen Beruf zu erlernen und damit die eigene Leidenschaft für Sprachen auszuleben.", "distractor": ""}, {"key": "d", "title": "Nutzen Sie das Recht für sich!", "text": "Baumert & Partner helfen Ihnen, Ihr Recht durchzusetzen. Im Interview geben die Experten für Familienrecht Tipps zu folgenden Fragen: Wie gehen Sie aus einer Scheidung als Sieger hervor? Wie können Sie sich im Sorgerechtsstreit behaupten? Und welcher Anteil des Gehalts Ihres Expartners steht Ihnen zu?", "distractor": "Es derecho de FAMILIA (divorcio, custodia, pensión), no derecho laboral. Es la trampa jurídica para la persona 1, que necesita un experto en derecho laboral."}, {"key": "e", "title": "Umgangsformen im Berufsalltag.", "text": "Gewisse Verhaltensweisen, die im privaten Kontext völlig in Ordnung sind, können auf der Arbeit zu unangenehmen Stolpersteinen werden. Wie kleide ich mich richtig im Büro? Duzen oder siezen? Welche Themen sollten Sie im Smalltalk vermeiden?", "distractor": ""}, {"key": "f", "title": "Souverän am Telefon.", "text": "Die Begrüßung am Telefon dauert in der Regel nur zwei bis drei Sekunden, ist aber für den ersten Eindruck entscheidend. Die richtige Formulierung hängt davon ab, ob es sich um ein eingehendes Telefonat oder einen aktiven Anruf handelt. Worauf sollen Sie achten?", "distractor": "Trata de técnica telefónica (saludo y formulación en llamadas), no de cómo tratar a colegas nuevos. Es el distractor temático de la persona 5."}, {"key": "g", "title": "Warum nicht mal ganz weit weg?", "text": "Du träumst von einem Job im Ausland? Dann knüpfe erste Kontakte durch ein Praktikum. Ohne großen Aufwand kannst du so auch deine Sprachkenntnisse perfektionieren. Aber es gibt noch mehr überzeugende Gründe für ein Auslandspraktikum.", "distractor": ""}, {"key": "h", "title": "Zahl der Klagen rückläufig.", "text": "Seit einigen Jahren geht die Zahl der Kündigungsschutzklagen kontinuierlich zurück, das bestätigt der Deutsche Anwaltsverein. Warum nur jeder Fünfte nach einer Kündigung Klage bei Gericht einreicht, warum es sich trotzdem für Sie lohnen kann und wie Sie dabei vorgehen müssen, erklärt der Arbeitsrechtsexperte Lars Hansson.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Mariarita wurde entlassen und will sich dagegen wehren.", "answer": "h", "confidence": "hoch", "quote": "Seit einigen Jahren geht die Zahl der Kündigungsschutzklagen kontinuierlich zurück, das bestätigt der Deutsche Anwaltsverein.", "explain": "Mariarita ha sido despedida y quiere defenderse: eso es una «Kündigungsschutzklage». h es el único anuncio sobre demandas por despido con un experto en derecho laboral; d también es jurídico, pero de familia.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Ettorina überlegt, eine Ausbildung im Fremdsprachenbereich zu machen.", "answer": "c", "confidence": "hoch", "quote": "Es gibt unterschiedliche Möglichkeiten und Wege, diesen Beruf zu erlernen und damit die eigene Leidenschaft für Sprachen auszuleben.", "explain": "Ettorina quiere formarse en el ámbito de los idiomas y c habla explícitamente de «diesen Beruf zu erlernen», referido al Fremdsprachenkorrespondent. El anuncio a (viaje de idiomas) no es una formación profesional.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Thom ist Wissenschaftler und sucht einen Job im internationalen Umfeld.", "answer": "b", "confidence": "mittel", "quote": "So fördert die Bundesrepublik Deutschland Austauschprogramme zwischen internationalen Forschern.", "explain": "Thom es científico y busca un entorno internacional; b es el único anuncio científico e internacional (intercambio entre investigadores) y se impone por eliminación. Confianza media porque el enunciado no precisa la especialidad y b describe un programa de intercambio, no una oferta de empleo.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Baldassarre möchte erste Berufserfahrungen in verschiedenen Ländern sammeln.", "answer": "g", "confidence": "hoch", "quote": "Du träumst von einem Job im Ausland? Dann knüpfe erste Kontakte durch ein Praktikum.", "explain": "Baldassarre quiere sus primeras experiencias profesionales en el extranjero y g ofrece exactamente eso: un Auslandspraktikum como primera toma de contacto. El plural «in verschiedenen Ländern» es algo más amplio que «im Ausland», pero a (viaje de idiomas) no aporta experiencia laboral.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Levi fragt sich, wie er neue Kollegen korrekt ansprechen sollte.", "answer": "e", "confidence": "hoch", "quote": "Wie kleide ich mich richtig im Büro? Duzen oder siezen? Welche Themen sollten Sie im Smalltalk vermeiden?", "explain": "Levi duda de cómo dirigirse a colegas nuevos; e trata las formas de trato en la oficina y pregunta literalmente «Duzen oder siezen?». El anuncio f (teléfono) es el distractor temático.", "verified": true}]}, {"id": "t1_b-p11", "label": "Variante 2 (test 140321, 140301)", "page": 11, "note": "El original indica en una segunda línea «(тоже №140321, 140301)»: esos números de test corresponden a esta misma variante.", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Achtung Kündigung.", "text": "Das Arbeitsrecht unterscheidet zwischen personenbedingter, betriebsbedingter und verhaltensbedingter Beendigung des Arbeitsverhältnisses. Lesen Sie hier alle Informationen darüber, aus welchen Gründen der Arbeitgeber berechtigt ist zu kündigen.", "distractor": ""}, {"key": "b", "title": "Automobilbranche boomt nach wie vor.", "text": "Vor allem im Südwesten Deutschlands können sich die Menschen weiterhin auf sichere und gut bezahlte Anstellungen in der Automobilindustrie verlassen. Warum lohnt es sich, bei einem Autobauer oder Zulieferer zu arbeiten? Welche Berufe sind am meisten gefragt?", "distractor": "Ofrece empleo seguro en la industria del automóvil, pero como asalariado de un fabricante o proveedor. Junis, mecánico de automoción, no busca un puesto fijo sino montar su propio taller. Es el distractor temático de la persona 1."}, {"key": "c", "title": "Firmen setzen auf flexible Arbeitsbedingungen.", "text": "In vielen Branchen sind Fachkräfte gefragt wie nie zuvor. Dabei haben immer mehr Firmen Schwierigkeiten, ihre Angestellten langfristig zu halten. Wer kann, wechselt schnell zu einem Arbeitgeber mit besseren Bedingungen. Viele große Unternehmen setzen nun verstärkt auf Flexibilität und familienfreundliche Leistungen wie Firmen-Kita oder Homeoffice.", "distractor": ""}, {"key": "d", "title": "Förderung von Selbstständigen.", "text": "In den letzten Jahren ist die Zahl der Selbstständigen stetig gestiegen. Das liegt unter anderem auch an neuen staatlichen Förderungsmöglichkeiten für Jungunternehmer, die ihren eigenen Betrieb aufmachen möchten.", "distractor": ""}, {"key": "e", "title": "Sein eigener Chef sein!", "text": "Du willst keine starren Arbeitszeiten, weiten Anfahrtswege und keinen nervigen Umgang mit Kollegen und Chefs? Dann ist der Weg in die Existenzgründung eine echte Alternative. Ob als Übersetzer, Programmierer oder Steuerberater - Theo Geertz berät dich, wie du dein Fachwissen nutzen kannst, um zu Hause und auf eigene Rechnung zu arbeiten.", "distractor": ""}, {"key": "f", "title": "Ungelernte Arbeitskräfte weiterhin benachteiligt.", "text": "Je höher die Qualifikation, desto besser die Chancen auf dem Arbeitsmarkt. Wer keine Berufsausbildung hat, läuft Gefahr, in die Langzeitarbeitslosigkeit abzustürzen. Wer Arbeit hat, muss als Ungelernter mit geringerem Gehalt und schlechteren Aufstiegschancen rechnen.", "distractor": "Describe exactamente la situación de Maria (Hilfsarbeiterin sin formación), pero solo diagnostica el problema: no ofrece ninguna vía para conseguir la Berufsausbildung. Distractor de la persona 2, cuya respuesta es el anuncio h (portal de cualificación para Ungelernte)."}, {"key": "g", "title": "Möglichkeiten, mit einer Kündigung umzugehen.", "text": "Du fühlst dich nach einer Kündigung gedemütigt und alleine gelassen und weißt nicht, wie es weitergehen soll? Das kann auch eine Chance sein, sich neu zu orientieren und vielleicht sogar die eigene Berufung zu finden.", "distractor": "Habla de la Kündigung, pero desde el punto de vista emocional y de la reorientación profesional («sich neu orientieren»), no jurídico: no sirve para «dagegen vorgehen». Distractor de la persona 5, que confunde con el anuncio a (derecho laboral)."}, {"key": "h", "title": "Wege und Chancen.", "text": "Das Bundesministerium für Bildung und Forschung unterstützt bei der beruflichen Qualifizierung. Es hat ein Portal eingerichtet, um vor allem Ungelernte und Geringqualifizierte sowie Arbeitnehmer in Elternzeit über passende Aus- und Weiterbildungsmöglichkeiten zu informieren.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Junis ist gelernter Kfz-Mechatroniker und möchte eine eigene Werkstatt gründen.", "answer": "d", "confidence": "mittel", "quote": "Das liegt unter anderem auch an neuen staatlichen Förderungsmöglichkeiten für Jungunternehmer, die ihren eigenen Betrieb aufmachen möchten.", "explain": "Junis quiere abrir su propio taller: el anuncio d es el único que ofrece apoyo estatal a quienes ponen en marcha su propio negocio («ihren eigenen Betrieb aufmachen»). Confianza media porque e también trata de la Existenzgründung, pero e se dirige a trabajo intelectual en casa (traductor, programador, asesor fiscal) y encaja mejor con la persona 4; d, en cambio, no describe perfiles de oficina y menciona expresamente la ayuda económica para montar el negocio propio.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Maria arbeitet als Hilfsarbeiterin und möchte nun eine Berufsausbildung machen.", "answer": "h", "confidence": "hoch", "quote": "Es hat ein Portal eingerichtet, um vor allem Ungelernte und Geringqualifizierte sowie Arbeitnehmer in Elternzeit über passende Aus- und Weiterbildungsmöglichkeiten zu informieren.", "explain": "Maria trabaja sin cualificación y quiere hacer una formación profesional. El anuncio h es un portal público dirigido justamente a «Ungelernte und Geringqualifizierte» que informa sobre vías de cualificación. El anuncio f solo describe las desventajas de no tener formación, sin ofrecer salida alguna.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Nikolett möchte sich nicht zwischen Familie und Arbeit entscheiden müssen.", "answer": "c", "confidence": "hoch", "quote": "Viele große Unternehmen setzen nun verstärkt auf Flexibilität und familienfreundliche Leistungen wie Firmen-Kita oder Homeoffice.", "explain": "Nikolett no quiere verse obligada a elegir entre familia y trabajo. El anuncio c es el único que presenta medidas «familienfreundlich» (guardería de empresa, teletrabajo), es decir, compatibilidad de familia y empleo.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Amin studiert Fremdsprachen und möchte nach seinem Abschluss freiberuflich arbeiten.", "answer": "e", "confidence": "hoch", "quote": "Ob als Übersetzer, Programmierer oder Steuerberater - Theo Geertz berät dich, wie du dein Fachwissen nutzen kannst, um zu Hause und auf eigene Rechnung zu arbeiten.", "explain": "Amin estudia idiomas y quiere trabajar por cuenta propia. El anuncio e ofrece asesoramiento para ejercer como «Übersetzer» (traductor, la salida directa de sus estudios) y «auf eigene Rechnung» (por cuenta propia). El anuncio d también es sobre autoempleo, pero como vía de financiación de un negocio, no como ejercicio liberal.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Samita soll aus betriebsbedingten Gründen gekündigt werden und sie möchte dagegen vorgehen.", "answer": "a", "confidence": "hoch", "quote": "Das Arbeitsrecht unterscheidet zwischen personenbedingter, betriebsbedingter und verhaltensbedingter Beendigung des Arbeitsverhältnisses. Lesen Sie hier alle Informationen darüber, aus welchen Gründen der Arbeitgeber berechtigt ist zu kündigen.", "explain": "Samita va a ser despedida «aus betriebsbedingten Gründen». El anuncio a reproduce literalmente esa expresión y explica cuándo está justificado el despido, que es justo lo que hay que comprobar para defenderse. El anuncio g también menciona la Kündigung, pero solo como punto de partida emocional para reorientarse.", "verified": true}]}, {"id": "t1_b-p12", "label": "Variante 3", "page": 12, "note": "", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Pflegefreistellung für Mütter und Väter.", "text": "Arbeitnehmerinnen und Arbeitnehmer haben das Recht auf Freistellung am Arbeitsplatz, wenn ein im Haushalt lebendes Kind erkrankt und keine Betreuungsmöglichkeit vorhanden ist. Die Freistellung ist pro Arbeitsjahr begrenzt. In der Probezeit sollte man damit vorsichtig sein, da hier andere Kündigungsfristen gelten.", "distractor": "Resuelve el caso del hijo enfermo con días de permiso para cuidarlo en casa («Freistellung»), no con la posibilidad de llevarlo a la oficina. Distractor de la persona 4, cuya respuesta es el anuncio f (Rechte berufstätiger Eltern / Kinder am Arbeitsplatz)."}, {"key": "b", "title": "Tipps für Frauen im Beruf.", "text": "Frauen verkaufen sich oft unter Wert. Es ist besonders wichtig, dass Sie ausreichend über Ihre Rechte im Berufsleben informiert sind. Unsere Expertin für Arbeitsrecht gibt Tipps für Gehaltsverhandlungen und ein selbstbewusstes Auftreten. Außerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen.", "distractor": ""}, {"key": "c", "title": "Damit sich der Aufwand lohnt.", "text": "Stellenangebote online zu schalten, kann für Unternehmen schnell sehr kostspielig werden. Nicht nur die Bekanntheit der Webseite ist dafür entscheidend, sondern auch die regionale Reichweite und der Grad der Spezialisierung.", "distractor": "Se dirige a empresas que quieren publicar ofertas de empleo en Internet (costes, alcance, especialización), no a quien busca trabajo en la red. Distractor de la persona 2."}, {"key": "d", "title": "Der Bundesverband der Tourismusbranche informiert.", "text": "Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig. Auch auf dem Ausbildungsmarkt fehlt es an jungen Menschen, die sich für dieses Arbeitsfeld interessieren. Offene Stellen werden demzufolge zügig besetzt.", "distractor": ""}, {"key": "e", "title": "Informationen rund um den Mutterschutz.", "text": "Frauen dürfen nach dem Mutterschutzgesetz während einer Schwangerschaft und bis zu vier Monate nach der Geburt nicht gekündigt werden. Voraussetzung hierfür ist jedoch, dass der Arbeitgeber zum Zeitpunkt der Kündigung von der Schwangerschaft wusste.", "distractor": "Trata del embarazo, pero desde la protección contra el despido (Mutterschutzgesetz), no de qué hay que contar o no en una entrevista. Es el distractor temático de la persona 1."}, {"key": "f", "title": "Rechte berufstätiger Eltern.", "text": "Eltern haben keinen Rechtsanspruch darauf, ihre Kinder am Arbeitsplatz zu betreuen. Die Entscheidung unterliegt der Zustimmung des Arbeitgebers und viele sind damit einverstanden, wenn sich so vermeiden lässt, dass sich die Eltern krankschreiben lassen. Arbeitsplätze, bei denen die Sicherheit des Kindes gefährdet ist, sind von dieser Regelung ausgeschlossen.", "distractor": ""}, {"key": "g", "title": "Vom Traum zur Realität.", "text": "Als angehender Gründer brauchen Sie nicht nur Branchenkenntnisse, sondern auch Wissen über betriebswirtschaftliche Vorgänge. Vom Businessplan und der richtigen Finanzierung über vernünftige Personalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu.", "distractor": ""}, {"key": "h", "title": "Die richtige Wahl spart Zeit und Frust.", "text": "Die Suche nach einer neuen Stelle ist extrem zeitaufwendig. Im Internet erscheint das Angebot an offenen Stellen riesig, dennoch bleibt der Erfolg oft aus. Eine der wichtigsten Voraussetzungen ist es also, Jobangebote richtig zu filtern, um ohne großen Zeitaufwand die richtige Anzeige zu finden.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Lamia überlegt, ob sie im Vorstellungsgespräch ihre Schwangerschaft erwähnen muss.", "answer": "b", "confidence": "hoch", "quote": "Außerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen.", "explain": "Lamia se pregunta si debe mencionar su embarazo en la entrevista. El anuncio b anuncia expresamente información sobre lo que no hay que contar en una entrevista de trabajo, que es justo su duda. El anuncio e también habla del embarazo, pero solo de la protección frente al despido, no de la entrevista.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Raymond möchte im Internet einen Job finden.", "answer": "h", "confidence": "hoch", "quote": "Eine der wichtigsten Voraussetzungen ist es also, Jobangebote richtig zu filtern, um ohne großen Zeitaufwand die richtige Anzeige zu finden.", "explain": "Raymond busca empleo por Internet. El anuncio h explica cómo filtrar correctamente las ofertas en la red para no perder tiempo. El anuncio c también trata de ofertas de empleo online, pero está pensado para empresas que las publican.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Karl will sich in der Gastronomie selbstständig machen.", "answer": "g", "confidence": "hoch", "quote": "Vom Businessplan und der richtigen Finanzierung über vernünftige Personalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu.", "explain": "Karl quiere establecerse por su cuenta en la hostelería. El anuncio g se dirige al «angehender Gründer» y enumera plan de negocio, financiación y sobre todo la obtención de las licencias necesarias, trámite típico de un local de restauración.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Sean ist unsicher, ob er seinen kranken Sohn mit ins Büro nehmen darf.", "answer": "f", "confidence": "hoch", "quote": "Eltern haben keinen Rechtsanspruch darauf, ihre Kinder am Arbeitsplatz zu betreuen. Die Entscheidung unterliegt der Zustimmung des Arbeitgebers", "explain": "Sean duda si puede llevar a su hijo enfermo a la oficina. El anuncio f responde exactamente a eso: no existe derecho a que los hijos estén en el puesto de trabajo, decide el empleador. El anuncio a también parte de un hijo enfermo, pero ofrece quedarse en casa, no llevarlo consigo.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Ramona interessiert sich für Jobchancen als Reiseverkehrskauffrau.", "answer": "d", "confidence": "hoch", "quote": "Der Bundesverband der Tourismusbranche informiert. Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig.", "explain": "Ramona se interesa por las salidas profesionales de «Reiseverkehrskauffrau», un perfil del sector turístico. El anuncio d es el del Bundesverband der Tourismusbranche y describe la situación del mercado laboral y de formación en esa rama, con alta demanda de trabajadores.", "verified": true}]}, {"id": "t1_b-p13", "label": "Variante 3 (nueva versión 07.2024)", "page": 13, "note": "Nueva versión (07.2024) de la variante de la p.12: cambian los nombres y el orden de las personas y se han reescrito los anuncios a), c), d) y f). Por eso las respuestas cambian de número, aunque el conjunto de anuncios utilizados es el mismo {b, d, f, g, h}.", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Familienmitglieder betreuen.", "text": "Eltern haben einen Rechtsanspruch darauf, ihre kranken Kinder zu pflegen. Dafür haben sie eine bestimmte Anzahl an Tagen zur Verfügung, an denen sie freinehmen können. Aber generell gilt: kranke Personen müssen zu Hause bleiben.", "distractor": "Da días libres para cuidar en casa a los hijos enfermos y añade que «kranke Personen müssen zu Hause bleiben»: justo lo contrario de llevarlos al puesto de trabajo. Distractor de la persona 3."}, {"key": "b", "title": "Tipps für Frauen im Beruf.", "text": "Frauen verkaufen sich oft unter Wert. Es ist besonders wichtig, dass Sie ausreichend über Ihre Rechte im Berufsleben informiert sind. Unsere Expertin für Arbeitsrecht gibt Tipps für Gehaltsverhandlungen und ein selbstbewusstes Auftreten. Außerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen.", "distractor": ""}, {"key": "c", "title": "Damit sich der Aufwand lohnt.", "text": "Stellenangebote online zu schalten, kann für Unternehmen schnell sehr kostspielig werden. Für den Erfolg muss unbedingt das richtige Stelleportal gewählt werden. Das gilt insbesondere für neu gegründete Unternehmen, die sich mehrfache Anzeigen finanziell nicht leisten können.", "distractor": "Se dirige a empresas que publican ofertas en Internet y, en esta versión, menciona expresamente a las «neu gegründete Unternehmen». Es distractor de la persona 1 (quien busca empleo, no quien lo publica) y, por la mención a las empresas de nueva creación, también se confunde con la persona 2, que quiere fundar un negocio."}, {"key": "d", "title": "Der Bundesverband der Tourismusbranche informiert.", "text": "Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig. Auch auf dem Ausbildungsmarkt fehlt es an jungen Menschen, die sich für dieses Arbeitsfeld interessieren. Demzufolge gibt es aktuell eine Reihe offener Stellen.", "distractor": ""}, {"key": "e", "title": "Informationen rund um den Mutterschutz.", "text": "Frauen dürfen nach dem Mutterschutzgesetz während einer Schwangerschaft und bis zu vier Monate nach der Geburt nicht gekündigt werden. Voraussetzung hierfür ist jedoch, dass der Arbeitgeber zum Zeitpunkt der Kündigung von der Schwangerschaft wusste.", "distractor": "Vuelve a tratar el embarazo desde la prohibición de despido (Mutterschutzgesetz), no desde la entrevista de trabajo. Distractor temático de la persona 5."}, {"key": "f", "title": "Kinder am Arbeitsplatz.", "text": "Häufig stimmen Arbeitgeber der Bitte von Eltern zu, ihre Kinder mit zur Arbeit zu bringen, wenn deren Betreuung kurzfristig ausfällt. Damit können Fehlzeiten vermieden werden. Diese Möglichkeit besteht nicht, wenn die Sicherheit des Kindes am Arbeitsplatz gefährdet ist.", "distractor": ""}, {"key": "g", "title": "Vom Traum zur Realität.", "text": "Als angehender Gründer brauchen Sie nicht nur Branchenkenntnisse, sondern auch Wissen über betriebswirtschaftliche Vorgänge. Vom Businessplan und der richtigen Finanzierung über vernünftige Personalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu.", "distractor": ""}, {"key": "h", "title": "Die richtige Wahl spart Zeit und Frust.", "text": "Der Stellemarkt spielt sich heutzutage fast ausschließlich online ab. Im Internet erscheint das Angebot an offenen Stellen riesig, dennoch bleibt der Erfolg oft aus. Eine der wichtigsten Voraussetzungen ist es also, Jobangebote richtig zu filtern, um ohne großen Zeitaufwand die richtige Anzeige zu finden.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Yuan Javier möchte im Internet einen Job finden", "answer": "h", "confidence": "hoch", "quote": "Der Stellemarkt spielt sich heutzutage fast ausschließlich online ab. Im Internet erscheint das Angebot an offenen Stellen riesig", "explain": "Yuan Javier busca trabajo por Internet. El anuncio h (reescrito en esta versión para empezar con «Der Stellemarkt spielt sich … online ab») trata precisamente de la búsqueda de empleo en la red y de filtrar bien las ofertas. El anuncio c es para empresas que publican las ofertas.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Paul will sich in der Gastronomie selbstständig machen.", "answer": "g", "confidence": "hoch", "quote": "Als angehender Gründer brauchen Sie nicht nur Branchenkenntnisse, sondern auch Wissen über betriebswirtschaftliche Vorgänge. Vom Businessplan und der richtigen Finanzierung über vernünftige Personalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu.", "explain": "Paul quiere establecerse en la hostelería. El anuncio g es el que asesora al «angehender Gründer» (plan de negocio, financiación, licencias), trámites propios de abrir un local. El anuncio c menciona empresas de nueva creación, pero solo en relación con anuncios de empleo.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Avio ist unsicher, ob er seinen kranken Sohn mit ins Büro nehmen darf.", "answer": "f", "confidence": "hoch", "quote": "Häufig stimmen Arbeitgeber der Bitte von Eltern zu, ihre Kinder mit zur Arbeit zu bringen, wenn deren Betreuung kurzfristig ausfällt. Damit können Fehlzeiten vermieden werden.", "explain": "Avio duda si puede llevar a su hijo enfermo a la oficina. El anuncio f se titula ahora «Kinder am Arbeitsplatz» y confirma que el empleador suele aceptarlo cuando el cuidado falla de forma imprevista. El anuncio a también parte de hijos enfermos, pero resuelve el caso con días de permiso en casa.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Nora interessiert sich für Jobchancen als Reiseverkehrskauffrau.", "answer": "d", "confidence": "hoch", "quote": "Der Bundesverband der Tourismusbranche informiert. Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig. Auch auf dem Ausbildungsmarkt fehlt es an jungen Menschen, die sich für dieses Arbeitsfeld interessieren. Demzufolge gibt es aktuell eine Reihe offener Stellen.", "explain": "Nora busca oportunidades como «Reiseverkehrskauffrau», profesión del sector turístico. El anuncio d, del Bundesverband der Tourismusbranche, informa de ese mercado; en esta versión la última frase se ha reformulado para destacar que hay bastantes vacantes («eine Reihe offener Stellen»).", "verified": true}, {"n": 5, "type": "choice", "prompt": "Anna Maria überlegt, ob sie im Vorstellungsgespräch ihre Schwangerschaft erwähnen muss.", "answer": "b", "confidence": "hoch", "quote": "Außerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen.", "explain": "Anna Maria se pregunta si debe mencionar su embarazo en la entrevista. El anuncio b ofrece exactamente esa información: qué no hace falta contar en una entrevista. El anuncio e vuelve a ser el distractor, porque solo trata del Mutterschutz y del despido.", "verified": true}]}, {"id": "t1_c-p14", "label": "Variante 4", "page": 14, "note": "", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Erfolgreich neue Wege gehen.", "text": "Das Buch „Mit Erfolg durchstarten\" von Dr. Vera Baumgart richtet sich vor allem an Akademikerinnen, die erfolgreich ein eigenes Unternehmen aufbauen wollen. Egal ob Sie sich in der Immobilienbranche, im Bauwesen oder im Gesundheitsbereich selbstständig machen, die Autorin hat Antworten auf alle wichtigen Fragen.", "distractor": ""}, {"key": "b", "title": "Ein grüner Arbeitsplatz.", "text": "Die Firma Heller aus Rostock will mit gutem Beispiel vorangehen und behauptet: „Klimafreundliche Energie und Müllvermeidung werden bei uns ganz großgeschrieben\". Aber geht das bei einer Transport- und Logistikfirma überhaupt? Die Antwort ist ein klares „Ja\". Alle Details heute um 19:30 Uhr bei Neo TV.", "distractor": ""}, {"key": "c", "title": "Verändertes Kaufverhalten.", "text": "Neuesten Statistiken zufolge greifen Verbraucher in vielen Ländern der Europäischen Union immer mehr zu regionalen und ökologisch angebauten Lebensmitteln. Auch in deutschen Haushalten wird viel Wert auf gesunde Ernährung gelegt. Die Nachfrage nach Bioprodukten ist in den letzten Jahren stetig angestiegen.", "distractor": "Es ecológico, pero habla del consumo de alimentos (Bioprodukte), no del medio ambiente dentro de una empresa ni de un puesto de trabajo. Es el distractor temático de la persona 3 (Jens, Umweltschutz in Unternehmen)."}, {"key": "d", "title": "Jetzt im Buchhandel.", "text": "In seinem neuen Bestseller beschreibt Georg Könitz auf eindrucksvolle Weise, wie er von seinem ständig schlecht gelaunten Chef und zwei Mitarbeitern in seinem Team schikaniert, ausgegrenzt und lächerlich gemacht wurde - und wie es ihm schließlich gelang, diesen Teufelskreis zu durchbrechen. Von seinen Erfahrungen können alle, die Ähnliches erleben, profitieren.", "distractor": ""}, {"key": "e", "title": "Der richtige Praktikumsplatz.", "text": "Ein Praktikum bietet tolle Möglichkeiten, den Berufsalltag kennenzulernen. Viele Praktikanten sind aber enttäuscht, dass sie nur Hilfsarbeiten verrichten dürfen und dafür schlecht oder gar nicht bezahlt werden. Auf dem Portal dein-praktikum.de findest du jetzt aktuelle Infos und interessante Praktikumsstellen in ganz Deutschland.", "distractor": ""}, {"key": "f", "title": "Eine Erfolgsgeschichte.", "text": "Die Bilanz von Rita Jäger (34): Zwei abgebrochene Lehren und zahllose Hilfsjobs. Dann kam Tochter Samantha und Rita musste Verantwortung übernehmen. Im Interview erzählt sie, wie sie in einem Friseursalon die Chance bekam, ein Praktikum und anschließend eine Ausbildung zu machen. Nun hat sie ihren eigenen Salon eröffnet.", "distractor": "Menciona un «Praktikum» y también un negocio propio (su propio salón), pero es la biografía ya cerrada de Rita Jäger, no una oferta de prácticas ni un libro para montar una empresa. Se confunde con la persona 1 (Laura, prácticas) y con la 5 (Somayeh, negocio propio)."}, {"key": "g", "title": "Immobilienunternehmen expandiert.", "text": "Die Frankfurter Immobilienfirma ImmoInvest expandiert nach Süd- und Osteuropa. In den letzten Jahren hat das Unternehmen hohe Gewinne erwirtschaftet und plant nun, außerhalb Deutschlands mehrere Niederlassungen zu gründen. Über die Erfolgsgeschichte des Unternehmens berichtet der Geschäftsführer Herbert Grünberg in unserem Interview.", "distractor": "Habla de una empresa inmobiliaria (trampa temática para la 5, Somayeh, arquitecta) que se expande por Europa (trampa para la 2, Igor), pero no ofrece nada a ninguna persona: describe la estrategia de la propia empresa."}, {"key": "h", "title": "Neue Broschüre.", "text": "Sie überlegen, Ihren Lebensmittelpunkt in ein anderes Land zu verlegen? Ein Neuanfang ist eine große Chance, aber immer auch eine Herausforderung – besonders für den Partner oder die Partnerin und die Kinder. Unsere neue Broschüre bietet ausführliche Informationen und Hilfestellungen zum Leben und Arbeiten in der EU.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Laura möchte während des Studiums Berufserfahrung sammeln.", "answer": "e", "confidence": "hoch", "quote": "Ein Praktikum bietet tolle Möglichkeiten, den Berufsalltag kennenzulernen.", "explain": "Laura busca experiencia profesional durante sus estudios. El anuncio e ofrece justamente eso: un portal con «Praktikumsstellen» actuales en toda Alemania. El anuncio f también menciona un «Praktikum», pero es una historia personal ya concluida, no una oferta.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Igor hat Familie und möchte im europäischen Ausland arbeiten.", "answer": "h", "confidence": "hoch", "quote": "Sie überlegen, Ihren Lebensmittelpunkt in ein anderes Land zu verlegen? Ein Neuanfang ist eine große Chance, aber immer auch eine Herausforderung – besonders für den Partner oder die Partnerin und die Kinder.", "explain": "Igor tiene familia y quiere trabajar en el extranjero europeo. El anuncio h se dirige a quien traslada su centro de vida a otro país, menciona expresamente a la pareja y a los hijos y ofrece información sobre «Leben und Arbeiten in der EU». El anuncio g también nombra Europa, pero es la expansión de una empresa, no el traslado de una persona.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Jens interessiert sich für das Thema Umweltschutz in Unternehmen.", "answer": "b", "confidence": "hoch", "quote": "Die Firma Heller aus Rostock will mit gutem Beispiel vorangehen und behauptet: „Klimafreundliche Energie und Müllvermeidung werden bei uns ganz großgeschrieben\".", "explain": "Jens se interesa por el medio ambiente dentro de las empresas. El anuncio b presenta una empresa concreta (Heller, transporte y logística) que aplica energía respetuosa con el clima y evitación de residuos. El anuncio c también es ecológico, pero trata del consumo de alimentos, no de las empresas.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Jasmin hat Probleme mit ihren Kollegen und braucht Hilfe.", "answer": "d", "confidence": "hoch", "quote": "wie er von seinem ständig schlecht gelaunten Chef und zwei Mitarbeitern in seinem Team schikaniert, ausgegrenzt und lächerlich gemacht wurde - und wie es ihm schließlich gelang, diesen Teufelskreis zu durchbrechen.", "explain": "Jasmin tiene problemas con sus colegas y busca ayuda. El anuncio d narra exactamente un caso de acoso y exclusión por parte del jefe y de dos compañeros de equipo y ofrece la experiencia de quien logró romper ese círculo. El anuncio f también es una historia personal, pero no trata de conflictos con colegas.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Somayeh ist Architektin und möchte ihr eigenes Architekturbüro eröffnen.", "answer": "a", "confidence": "hoch", "quote": "richtet sich vor allem an Akademikerinnen, die erfolgreich ein eigenes Unternehmen aufbauen wollen. Egal ob Sie sich in der Immobilienbranche, im Bauwesen oder im Gesundheitsbereich selbstständig machen, die Autorin hat Antworten auf alle wichtigen Fragen.", "explain": "Somayeh es arquitecta y quiere abrir su propio despacho. El anuncio a se dirige a académicas que quieren crear su propia empresa y nombra expresamente el sector inmobiliario y el «Bauwesen» (construcción). El anuncio g es inmobiliario, pero describe la expansión de una empresa ajena, no cómo fundar la propia.", "verified": true}]}, {"id": "t1_c-p15", "label": "Variante 5", "page": 15, "note": "", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Hilfe für Betroffene.", "text": "Beleidigungen, Ausgrenzung, versteckte Drohungen - am Arbeitsplatz ist Mobbing leider weit verbreitet. Für viele Angestellte ist der Arbeitsalltag oft mit Angst verbunden. Das führt schnell zu gesundheitlichen und psychischen Problemen. Inzwischen gibt es zahlreiche Coaching-Programme für Mitarbeiter, die Strategien aufzeigen, wie man mit solchen Situationen besser umgehen kann.", "distractor": ""}, {"key": "b", "title": "Ein starkes Team.", "text": "Pünktlich zum Start der Weltmeisterschaft präsentiert der Handballbund seine neue Vertragspartnerin, die deutsche Handwerkskammer. Wie passt das zusammen? „Ganz einfach\", so der Sprecher des Handballbundes. „Was für den Handballer die Weltmeisterschaft ist, ist für den Handwerker die Meisterprüfung.\"", "distractor": "Menciona la «Meisterprüfung», pero solo como metáfora publicitaria en un patrocinio deportivo: no da ninguna información sobre ella. Es el distractor de la persona 5 (Assem)."}, {"key": "c", "title": "Deutsche sind risikoscheu.", "text": "In Deutschland ist die Zahl der Unternehmensgründungen stark rückläufig, obwohl insbesondere viele jüngere Menschen angeben, dass sie sich gerne selbständig machen würden. Warum der Sprung in die Selbstständigkeit oft doch nicht klappt, hat vielerlei Gründe. Während Frauen häufig das finanzielle Risiko scheuen, fürchten Männer den Karriereknick.", "distractor": "Trata de fundar una empresa propia (el riesgo de emprender), no de trabajar como empleado en una empresa joven. Es el distractor de la persona 2 (Jason, der bei einem neu gegründeten Unternehmen arbeiten will)."}, {"key": "d", "title": "Handwerk und Karriere - passt das?", "text": "Fleischer, Klempner, Tischler - laut der Bundesagentur für Arbeit werden bei uns ca. 150.000 Handwerker gesucht. Doch viele Stellen bleiben unbesetzt. Dabei bieten Handwerksberufe gerade jungen Leuten die allerbesten Chancen für eine erfolgreiche Karriere. Fachkräfte brauchen sich um ihre Zukunft nicht zu sorgen.", "distractor": ""}, {"key": "e", "title": "Stressfrei zum Ziel.", "text": "Auch Fortbildungen können für eine Meisterprüfung im Handwerk anerkannt werden. Wenn Sie z. B. als Kfz-Servicetechniker einen Kurs in Elektronik erfolgreich absolviert haben, wird dieser Teil nicht noch einmal gesondert geprüft. Die Interessengemeinschaft „Das Handwerk\" hat die wichtigsten Zulassungsvoraussetzungen zur Meisterprüfung zusammengefasst.", "distractor": ""}, {"key": "f", "title": "Nie wieder Opfer.", "text": "Sie wurde in ihrer Firma gemobbt und konnte es ihrem Chef nicht nachweisen. Aber die Atmosphäre verschlechterte sich zusehends. Die Arbeit wurde jeden Tag mehr zur Qual. Die Autorin Stephanie Hauser verarbeitet in ihrem Roman „Nie wieder Opfer\" auf eindrucksvolle Weise ihre eigenen Erfahrungen zum Thema „Mobbing\".", "distractor": "También trata el mobbing, pero es una novela en la que la autora elabora sus propias experiencias: narra un caso, no ofrece ayuda ni asesoramiento. Es el distractor de la persona 3 (Hannah, sucht Hilfe)."}, {"key": "g", "title": "Verpflichtend oder freiwillig.", "text": "Die Anforderungen der Berufswelt ändern sich rasant und somit entsteht auch die Notwendigkeit für die Belegschaft, sich kontinuierlich weiterzubilden. Prinzipiell gilt, dass Mitarbeiter zur Teilnahme an Seminaren verpflichtet sind, wenn diese zur Ausübung ihrer Tätigkeit notwendig sind und in der normalen Arbeitszeit stattfinden.", "distractor": ""}, {"key": "h", "title": "Karriereplan für eine vielversprechende Laufbahn.", "text": "Vor allem in Großstädten bieten immer mehr junge Unternehmen interessante Jobmöglichkeiten. Dennoch setzen die meisten Uniabsolventen nach wie vor auf große Konzerne, von denen sie sich eher Sicherheit und vielversprechende Karrierechancen erhoffen. Doch das können sie auch bei jungen Start-up-Unternehmen finden.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Yasmina sucht nach dem Realschulabschluss einen Beruf mit guten Perspektiven.", "answer": "d", "confidence": "hoch", "quote": "Dabei bieten Handwerksberufe gerade jungen Leuten die allerbesten Chancen für eine erfolgreiche Karriere. Fachkräfte brauchen sich um ihre Zukunft nicht zu sorgen.", "explain": "Yasmina busca, tras el Realschulabschluss, una profesión con buenas perspectivas, es decir, un acceso al mundo laboral sin estudios universitarios. El anuncio d presenta las profesiones artesanas como la mejor oportunidad para los jóvenes y señala 150.000 puestos sin cubrir. El anuncio h también habla de carrera, pero se dirige a «Uniabsolventen».", "verified": true}, {"n": 2, "type": "choice", "prompt": "Jason überlegt, ob er bei einem neu gegründeten Unternehmen arbeiten soll.", "answer": "h", "confidence": "hoch", "quote": "Vor allem in Großstädten bieten immer mehr junge Unternehmen interessante Jobmöglichkeiten.", "explain": "Jason se plantea trabajar como empleado en una empresa de nueva creación. El anuncio h dice que cada vez más empresas jóvenes ofrecen puestos interesantes y que también en los start-ups se encuentran seguridad y perspectivas. El anuncio c menciona igualmente empresas nuevas, pero se refiere a fundarlas uno mismo (Selbstständigkeit), no a trabajar en ellas.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Hannah wird von ihren Kollegen schlecht behandelt und sucht Hilfe.", "answer": "a", "confidence": "hoch", "quote": "Inzwischen gibt es zahlreiche Coaching-Programme für Mitarbeiter, die Strategien aufzeigen, wie man mit solchen Situationen besser umgehen kann.", "explain": "Hannah sufre malos tratos de sus colegas y busca ayuda. El anuncio a describe el mobbing («Beleidigungen, Ausgrenzung, versteckte Drohungen») y remite a programas de coaching con estrategias para afrontarlo. El anuncio f también trata el mobbing, pero es una novela, sin oferta de ayuda.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Gacer fragt sich, ob sie Fortbildungen besuchen muss.", "answer": "g", "confidence": "hoch", "quote": "Prinzipiell gilt, dass Mitarbeiter zur Teilnahme an Seminaren verpflichtet sind, wenn diese zur Ausübung ihrer Tätigkeit notwendig sind und in der normalen Arbeitszeit stattfinden.", "explain": "Gacer se pregunta si está obligada a hacer cursos de formación continua. El anuncio g («Verpflichtend oder freiwillig») responde que los empleados están obligados a participar en seminarios cuando son necesarios para su actividad y se celebran dentro del horario laboral. El anuncio e menciona también «Fortbildungen», pero solo como parte reconocible del examen de maestría.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Assem braucht Informationen zur Meisterprüfung.", "answer": "e", "confidence": "hoch", "quote": "Die Interessengemeinschaft „Das Handwerk\" hat die wichtigsten Zulassungsvoraussetzungen zur Meisterprüfung zusammengefasst.", "explain": "Assem necesita información sobre el examen de maestría. El anuncio e es el único que la ofrece: reúne los requisitos de admisión («Zulassungsvoraussetzungen») y explica qué cursos de formación se reconocen. El anuncio b nombra la Meisterprüfung, pero solo como eslogan publicitario, sin información útil.", "verified": true}]}, {"id": "t1_d-p16", "label": "Variante 6", "page": 16, "note": "", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Die Lebensmittelbranche boomt.", "text": "Der Einzelhandel ist einer der größten und umsatzstärksten Wirtschaftszweige national und international. Es werden dort ständig qualifizierte Mitarbeiter gesucht. Allein in Hessen werden jährlich 160.000 junge Menschen ausgebildet. Der Einzelhandel ist außerdem krisenfest, denn gegessen wird immer.", "distractor": ""}, {"key": "b", "title": "Aus Fehlern anderer lernen.", "text": "Viele Unternehmer machen zu Beginn ihrer Selbstständigkeit ähnliche Fehler. Heute weiß man, dass ein durchdachter Businessplan und eine genaue Konkurrenzanalyse unverzichtbar sind. Worauf es noch ankommt, erfährst du in den Tipps des Erfolgscoachs Gregor Daub.", "distractor": ""}, {"key": "c", "title": "Chancen im Einzelhandel.", "text": "Die FOOD Unternehmensgruppe betreibt Supermärkte in zehn Ländern Europas. Der Branchenriese möchte weiter expandieren und hat gerade die Filialen der Jennings GmbH übernommen. Erfahrene Mitarbeiter finden dort interessante Möglichkeiten zur beruflichen Weiterentwicklung.", "distractor": ""}, {"key": "d", "title": "Gute Nachrichten für gekündigte Mitarbeiter.", "text": "Die Tankstellenkette Fairtank hat Bankrott angekündigt und schließt zum 31. März ihre 25 Filialen in Brandenburg. Rund 100 Mitarbeiter sind betroffen und suchen nun einen neuen Job. Für einige von ihnen gibt es eine Lösung: Tankstellen in der Umgebung haben ihre Unterstützung zugesagt und versprochen, Mitarbeiter von Fairtank zu übernehmen.", "distractor": "Es una noticia sobre un caso concreto (la quiebra de Fairtank y sus 25 filiales en Brandeburgo), no un consejo para quien se queda sin empleo. Se confunde con la persona 4 (Mira), pero solo informa de que otra empresa recoge a esos empleados; no dice qué debe hacer uno en general para encontrar trabajo rápido."}, {"key": "e", "title": "Was nun?", "text": "Egal, ob die ganze Firma pleitegeht, eine Abteilung dichtmacht oder nur der eigene Job weg ist, eine Entlassung ist immer ein Schock. Arbeitsmarktexpertin Caroline Cuyper erklärt, was man als Angestellter tun muss, um möglichst schnell eine neue Stelle zu bekommen.", "distractor": ""}, {"key": "f", "title": "Neue Kursreihe bei Arcadio.", "text": "Ab sofort bietet das Institut Arcadio neben seinen Computerkursen für Senioren auch Weiterbildungen für Teilnehmer mit geringen Deutschkenntnissen an. Das Besondere daran: Die Dozenten verwenden eine einfache Sprache. Was hinter diesem innovativen Konzept steht, erzählt der Institutsgründer Benjamin von Adler im Interview.", "distractor": "Sí ofrece cursos de informática, pero presenciales y dirigidos a seniors y a personas con pocos conocimientos de alemán; no son cursos para hacer desde casa. Es el distractor temático de la persona 2 (Brian)."}, {"key": "g", "title": "Wenn die Mitarbeiter kündigen.", "text": "Immer mehr Mitarbeiter kündigen und verlassen ihre Firma. Und zwar selbst dann, wenn sie mehr Gehalt bekommen als bei der Konkurrenz. Die Unternehmensberatung Schindler hat die häufigsten Gründe analysiert, warum sich Angestellte entscheiden, ihren Job zu wechseln.", "distractor": "Trata de quienes se marchan por voluntad propia y de los motivos de esa decisión, no de quien pierde el empleo ni de cómo encontrar uno nuevo. Distractor vecino de la persona 4 (Mira) y, por el tema «wechseln», también de la 1."}, {"key": "h", "title": "Bildung im neuen Zeitalter.", "text": "Schneller technologischer Fortschritt, Globalisierung und Veränderungen auf dem Arbeitsmarkt haben dazu geführt, dass Fortbildungen im Beruf eine immer wichtigere Rolle spielen. Zunehmend werden Online-Kurse und Webinare am Computer angeboten, die den Teilnehmern maximale Flexibilität versprechen. Wo findet man passende Fortbildungen?", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Silvie ist gelernte Verkäuferin und möchte in ihrem Job aufsteigen.", "answer": "c", "confidence": "hoch", "quote": "Erfahrene Mitarbeiter finden dort interessante Möglichkeiten zur beruflichen Weiterentwicklung.", "explain": "Silvie es vendedora titulada y quiere ascender. El anuncio c es el único que ofrece expresamente «berufliche Weiterentwicklung» a empleados con experiencia en el comercio. El anuncio a también es del sector alimentario, pero habla de buscar personal y de plazas de formación, no de promoción interna.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Brian sucht Computerkurse, die er von zu Hause aus machen kann.", "answer": "h", "confidence": "hoch", "quote": "Zunehmend werden Online-Kurse und Webinare am Computer angeboten, die den Teilnehmern maximale Flexibilität versprechen.", "explain": "Brian quiere cursos de informática que pueda hacer desde casa. El anuncio h describe exactamente cursos en línea y webinarios frente al ordenador con máxima flexibilidad. El anuncio f también ofrece «Computerkurse», pero presenciales y para seniors, de modo que no encaja con la flexibilidad que busca Brian.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Carl ist Umwelttechniker und möchte seine eigene Beratungsagentur gründen.", "answer": "b", "confidence": "hoch", "quote": "Viele Unternehmer machen zu Beginn ihrer Selbstständigkeit ähnliche Fehler.", "explain": "Carl quiere montar su propia agencia de asesoría, es decir, pasar a la actividad por cuenta propia. El anuncio b es el único que trata del comienzo del «Selbstständigkeit» (plan de negocio, análisis de la competencia) y ofrece los consejos de un coach.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Mira ist unsicher, wie es nach ihrem Arbeitsplatzverlust weitergehen soll.", "answer": "e", "confidence": "hoch", "quote": "Arbeitsmarktexpertin Caroline Cuyper erklärt, was man als Angestellter tun muss, um möglichst schnell eine neue Stelle zu bekommen.", "explain": "Mira ha perdido el empleo y no sabe cómo seguir. El anuncio e parte justamente de esa situación («eine Entlassung ist immer ein Schock») y da consejos para encontrar pronto un nuevo puesto. El anuncio d también habla de despedidos, pero solo de un caso concreto y sin consejos útiles.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Karim sucht einen Ausbildungsplatz in einer sicheren Branche.", "answer": "a", "confidence": "hoch", "quote": "Allein in Hessen werden jährlich 160.000 junge Menschen ausgebildet. Der Einzelhandel ist außerdem krisenfest, denn gegessen wird immer.", "explain": "Karim busca una plaza de formación en un sector seguro. El anuncio a menciona las 160.000 plazas de formación anuales y califica el comercio minorista de «krisenfest» (a prueba de crisis). El anuncio c también es del sector, pero se dirige a personal ya experiente que busca promoción.", "verified": true}]}, {"id": "t1_d-p17", "label": "Variante 7 (test 150321, 150301)", "page": 17, "note": "", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Den Arbeitsplatz produktiv gestalten.", "text": "Die richtige Atmosphäre am Arbeitsplatz ist für die effektive Erledigung der Aufgaben unerlässlich. Gerlinde Strauß beschreibt, wie man mit den richtigen Möbeln, Dekoartikeln, Licht, Ordnung am Arbeitsplatz und vielem mehr die eigene Umgebung so gestaltet, dass man die Zeit am Arbeitsplatz gerne und erfolgreich verbringt.", "distractor": "Va de decorar y organizar el puesto de trabajo (muebles, luz, orden) para rendir mejor, no del cansancio ni del estrés. Distractor temático de la persona 2 (Juliette), que se siente agotada, y también de la 5 (Carlos), aunque no menciona el teletrabajo."}, {"key": "b", "title": "Ohne Selbstdisziplin geht es nicht.", "text": "Die Arbeit von zu Hause aus erfordert ein hohes Maß an Selbstdisziplin und die Fähigkeit des Selbstmanagements. Privates und Arbeit sollten strikt getrennt werden. Doch wie funktioniert das am besten? Helga Brinkmann hat einen Ratgeber für Arbeitskräfte herausgegeben, deren Unternehmen diese Form der Arbeit anbieten.", "distractor": ""}, {"key": "c", "title": "Hobbys im Lebenslauf richtig einsetzen.", "text": "Ausbildung und Qualifikation sind in erster Linie wichtig, wenn man den Lebenslauf eines Bewerbers liest. Doch auch, welche Hobbys eine Person hat, kann Auskunft darüber geben, ob sie zum Unternehmen passt oder nicht. Lesen Sie hier wichtige Tipps und Tricks für eine überzeugende Bewerbung.", "distractor": ""}, {"key": "d", "title": "Was unsere Körpersprache über uns verrät.", "text": "Ob beim Vorstellungsgespräch, bei wichtigen Verhandlungen mit Kunden oder am ersten Arbeitstag – unsere Körpersprache gibt immer Auskunft darüber, wie wir uns gerade fühlen, z. B. angespannt oder selbstsicher. Lernen Sie in unserem Seminar, wie Sie Körpersprache wirksam einsetzen und wie Sie Ihr Gegenüber einschätzen können.", "distractor": "Trata de la comunicación no verbal y menciona el «ersten Arbeitstag» y el estar «angespannt», lo que lo acerca a la persona 3 (Peter), pero Peter no busca un seminario sobre lenguaje corporal: busca orientación práctica para su primer día. Distractor temático de la 3."}, {"key": "e", "title": "Der erste Arbeitstag in der neuen Firma.", "text": "So klappt es mit den Kolleginnen. Anspannung ist ganz normal: Beim Start im neuen Job ist es wichtig, gut vorbereitet zu sein. Im folgenden Artikel von Irene Miller finden Sie eine Checkliste mit den wichtigsten Punkten, die Sie beachten sollten, damit der Einstieg gelingt.", "distractor": ""}, {"key": "f", "title": "Angemessene Bezahlung?", "text": "Jeder möchte für seine Leistung fair bezahlt werden. Doch in vielen Berufsfeldern haben die Arbeitnehmer das Gefühl, unterbezahlt zu sein. Die Folge davon sind Motivationsverlust und Zweifel daran, ob man wirklich den richtigen Beruf gewählt hat. Lesen Sie hier, wie Sie erfolgreich Gehaltsverhandlungen führen.", "distractor": ""}, {"key": "g", "title": "Körperliche Folgen von Stress.", "text": "Nicht jeder Stress macht krank. Es gibt auch positiven Stress, der die Leistungsfähigkeit eines Menschen erhöht. Wer aber unter Daueranspannung steht und körperliche Symptome wie Bluthochdruck, Magenbeschwerden oder eine anhaltende innere Anspannung spürt, muss etwas ändern. Wie, das erfahren Sie im neusten Buch von Harald Erhard.", "distractor": ""}, {"key": "h", "title": "Frauen verdienen immer noch zu wenig.", "text": "Europaweit ist das Ziel der Gleichstellung noch längst nicht erreicht. Man denke hier nur an die nach wie vor ungleiche Bezahlung von Männern und Frauen und an die Besetzung von Stellen in der Führungsetage. Deutschland liegt bei diesem Vergleich noch immer auf einem der letzten Plätze.", "distractor": "Es un artículo de estadística y política sobre la brecha salarial de género y la igualdad, sin ningún consejo práctico. Se confunde con la persona 4 (Katharina) por el tema del sueldo, pero no la ayuda a negociar ni a cambiar su situación: es el distractor trampa de la 4."}], "items": [{"n": 1, "type": "choice", "prompt": "Kurt sucht einen Job und braucht Anregungen für seine Unterlagen.", "answer": "c", "confidence": "hoch", "quote": "Lesen Sie hier wichtige Tipps und Tricks für eine überzeugende Bewerbung.", "explain": "Kurt busca empleo y necesita ideas para sus documentos. El anuncio c ofrece consejos para un currículum y una candidatura convincentes («Lebenslauf», «Bewerbung»), que es exactamente lo que necesita para sus «Unterlagen».", "verified": true}, {"n": 2, "type": "choice", "prompt": "Juliette arbeitet gerne, fühlt sich aber oft erschöpft.", "answer": "g", "confidence": "mittel", "quote": "Wer aber unter Daueranspannung steht und körperliche Symptome wie Bluthochdruck, Magenbeschwerden oder eine anhaltende innere Anspannung spürt, muss etwas ändern.", "explain": "Juliette trabaja a gusto pero se siente a menudo agotada. El anuncio g es el único que trata las consecuencias físicas del estrés y la tensión permanente, que es la causa más plausible de ese agotamiento. Confianza media porque el anuncio no usa la palabra «erschöpft» y la relación se establece por el sentido global; también podría pensarse en el anuncio a, que sin embargo solo habla de decoración y orden del puesto.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Peter ist vor seinem Start im neuen Unternehmen nervös.", "answer": "e", "confidence": "hoch", "quote": "Anspannung ist ganz normal: Beim Start im neuen Job ist es wichtig, gut vorbereitet zu sein.", "explain": "Peter está nervioso antes de empezar en la nueva empresa. El anuncio e trata exactamente el primer día en la nueva empresa y normaliza los nervios («Anspannung ist ganz normal») ofreciendo una lista de comprobación. El anuncio d también emplea «am ersten Arbeitstag» y «angespannt», pero es un seminario de lenguaje corporal.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Katharina ist wegen des niedrigen Verdienstes in ihrer Branche frustriert.", "answer": "f", "confidence": "hoch", "quote": "Doch in vielen Berufsfeldern haben die Arbeitnehmer das Gefühl, unterbezahlt zu sein. Die Folge davon sind Motivationsverlust und Zweifel daran, ob man wirklich den richtigen Beruf gewählt hat.", "explain": "Katharina está frustrada por el bajo sueldo de su sector. El anuncio f recoge justamente el sentirse mal pagado en muchos ámbitos profesionales y ofrece ayuda para negociar el salario. El anuncio h también habla de sueldos, pero como análisis general de la desigualdad entre hombres y mujeres, sin utilidad práctica para ella.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Carlos braucht Tipps für seine Tätigkeit im Homeoffice.", "answer": "b", "confidence": "hoch", "quote": "Die Arbeit von zu Hause aus erfordert ein hohes Maß an Selbstdisziplin und die Fähigkeit des Selbstmanagements.", "explain": "Carlos necesita consejos para su trabajo desde casa. El anuncio b es el único que habla del «Arbeit von zu Hause aus», de la autodisciplina y de separar vida privada y trabajo, y remite a una guía práctica.", "verified": true}]}, {"id": "t1_d-p18", "label": "Variante 8 (test 160201, 160221)", "page": 18, "note": "Der Anzeigentext h) («Den Horizont erweitern») ist im Original am Seitenende abgeschnitten: Er endet mit «Auslandsaufenthalte können». Der Schluss der Anzeige fehlt im PDF.", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Internationale Fachkräfte gesucht", "text": "Im Ausland zu arbeiten, kann eine hervorragende Chance für Menschen in aller Welt sein. Erfahren Sie als Arbeitgeber, mit welchen Strategien Sie dringend benötigte Arbeitskräfte aus dem Ausland für sich gewinnen, um Ihr Unternehmen wettbewerbsfähiger zu machen.", "distractor": "Se dirige expresamente al «Arbeitgeber»: son estrategias para que las empresas capten personal extranjero, no una oferta para quien quiere irse al extranjero. Distractor trampa de la persona 4 (Sandra), porque empieza hablando de trabajar en el extranjero, pero desde el lado de la empresa."}, {"key": "b", "title": "Auf zu neuen Ufern!", "text": "Im Job ist es nie zu spät, mit etwas Neuem zu beginnen, um sich weiterzuentwickeln. Manchmal fehlen nur ein bisschen Mut und Unterstützung. Oder man weiß erst gar nicht, welche Möglichkeiten es gibt. Eine gute Beratung ist darum wichtig. Wo Sie die bekommen, erfahren Sie hier.", "distractor": ""}, {"key": "c", "title": "Zufriedene Mitarbeiter", "text": "Viele Firmen überlegen, wie sie ihren Angestellten das Arbeitsleben abwechslungsreicher gestalten können. Manche schicken ihre Mitarbeitenden auf Dienstreisen ins Ausland, andere finanzieren ihnen Sprachkurse oder verteilen großzügig Prämien. Was noch möglich ist und wie sich das steuerlich auswirkt, erklärt der Steuerberater Michael Hahne.", "distractor": "Está escrito para las empresas (cómo hacer más variada la vida laboral de la plantilla; incluso lo explica un asesor fiscal). Menciona «Sprachkurse» y «Dienstreisen ins Ausland», de modo que es el distractor temático de la persona 1 (Barbara, idiomas) y de la 4 (Sandra, extranjero), pero no ofrece nada al empleado."}, {"key": "d", "title": "Dschungel in der Arbeitswelt", "text": "Wie viel Urlaub steht einem zu? Wie viel sollte man in seinem Beruf verdienen? Wie viele Stunden arbeitet man üblicherweise? Bekommt man einen Zuschuss für Sprachkurse? Mit vielen gesetzlichen Dingen muss man sich auskennen, wenn man im Arbeitsleben steht. Die wichtigsten Informationen finden Sie hier zusammengefasst.", "distractor": ""}, {"key": "e", "title": "Chefsache", "text": "Ein erfolgreiches Unternehmen gibt es nur mit einem motivierten Team. Aber wie motiviert man seine Mitarbeiter? Hören Sie ihnen aufmerksam zu! Kontrollieren Sie nicht jeden Arbeitsschritt, sondern delegieren Sie! Nehmen Sie Mobbing ernst! Zahlen Sie faire Gehälter! Diese und noch viele andere Ratschläge lesen Sie hier.", "distractor": "Son recomendaciones para jefes (imperativos dirigidos a quien manda en la empresa). Menciona «Mobbing» y «faire Gehälter», así que es el distractor trampa de la persona 3 (Petra) y de la 2 (Frank), pero no ayuda a quien sufre el problema."}, {"key": "f", "title": "Vielseitig qualifiziert!", "text": "Von Arbeitnehmer*innen wird immer mehr verlangt. Nicht nur die aktuellen fachlichen Kenntnisse und die souveräne Arbeit mit dem PC sind eine Selbstverständlichkeit, sondern auch die sprachlichen Kompetenzen werden immer wichtiger. Hier findet jeder den richtigen Kurs für sich, von Englisch über Japanisch bis Suaheli.", "distractor": ""}, {"key": "g"
