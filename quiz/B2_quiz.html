<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Aplica el tema guardado antes del primer pintado (sin parpadeo). -->
<script>try{var s=localStorage.getItem("b2quiz_theme");if(s==="dark"||s==="paper")document.documentElement.setAttribute("data-theme",s);}catch(e){}</script>
<title>B2 Beruf — Test de Lesen, Hören y Schreiben</title>
<!-- Firebase SDKs compat con tolerancia offline -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  /* ==========================================================================
     B2 Beruf — mundo «Prüfungsbogen» (hoja de examen impresa).
     Por defecto: papel hueso con tinta cálida; [data-theme="dark"]: modo noche
     refinado (carbón cálido, sin glass). Todo el color sale de tokens: cambiar
     la paleta o el tema es tocar el bloque de tokens, no los componentes.
     Reglas de elevación: hojas = sombra cálida; controles = hairline.
     ========================================================================== */
  :root{
    /* --- Papel: capas de superficie --- */
    --bg:#e9e2d1;                 /* escritorio (papel más tostado) */
    --panel:#fbf8f1;              /* hoja elevada (tarjetas, cabecera) */
    --panel2:#f3eee2;             /* hoja secundaria (pies, burbujas) */
    --panel3:#efe9db;             /* superficie hundida (chips, inputs) */
    --sheet:#fffdf6;              /* hoja en blanco (escritura) */
    --line:rgba(58,46,26,.15);    /* hairline cálido */
    --line-2:rgba(58,46,26,.30);

    /* --- Tinta: texto (contrastes medidos en design_audit.js) --- */
    --txt:#241f16;
    --dim:#5c5546;
    --dim-2:#67604e;

    /* --- Acentos: tinta azul (navegación) y tintas de corrección --- */
    --acc:#2c4d8f;
    --acc-fill-1:#2c4d8f;         /* relleno con texto claro: 7.9:1 */
    --acc-fill-2:#233e75;         /* sombra/hover del relleno */
    --acc-2:#3f63ad;
    --acc-ink:#2c4d8f;
    --on-acc:#fdfbf6;
    --ok:#2e6e49; --ok-ink:#1f5c3b;
    --bad:#b0362a; --bad-ink:#9c2f24;
    --warn:#8a6414; --warn-ink:#6e5110;
    --violet-ink:#6b4a9e;
    --ring:rgba(44,77,143,.55);

    /* --- Tintas de fondo (estados) --- */
    --tint-ok:rgba(46,110,73,.10);
    --tint-bad:rgba(176,54,42,.09);
    --tint-warn:rgba(138,100,20,.08);
    --tint-acc:rgba(44,77,143,.09);
    --tint-violet:rgba(107,74,158,.10);
    --tint-neutral:rgba(58,46,26,.05);
    --chip:#efe9db;
    --chip-hover:#e7e0cf;
    --scrim:rgba(24,19,10,.52);
    --selection:rgba(44,77,143,.22);
    --scroll:rgba(58,46,26,.28);

    /* --- Espaciado: grid de 8pt (4px solo para ajustes finos) --- */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

    /* --- Radios --- */
    --radius:12px;
    --r-1:6px; --r-2:10px; --r-3:12px; --r-4:16px; --r-pill:999px;

    /* --- Tipografía --- */
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-read:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --font-mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
    --fs-micro:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:15px; --fs-lead:17px;
    --fs-h3:20px; --fs-h2:32px; --fs-h1:19px;

    /* --- Elevación: sombra amplia (atmósfera) + sombra corta (plano) --- */
    --sh-1:0 1px 2px rgba(60,48,26,.10),0 3px 10px -4px rgba(60,48,26,.16);
    --sh-2:0 2px 6px rgba(60,48,26,.10),0 12px 28px -12px rgba(60,48,26,.20);
    --sh-3:0 4px 12px rgba(60,48,26,.12),0 28px 64px -20px rgba(60,48,26,.28);

    /* --- Movimiento: físicas elásticas --- */
    --dur-1:120ms; --dur-2:180ms; --dur-3:280ms;
    --ease:cubic-bezier(.2,.7,.3,1);
    --spring:cubic-bezier(.16,1,.3,1);

    /* --- Medidas de estructura --- */
    --header-h:57px; --nav-w:288px; --read-w:68ch;
    /* Mesa de examen (pantallas ≥1500px): ancho de la columna de referencia
       —anuncios o texto— y tope al que se estira la hoja de preguntas. */
    --desk-ref:600px; --desk-work:860px;
  }

  /* --- Modo noche: mismo mundo, tinta clara sobre carbón cálido --- */
  [data-theme="dark"]{
    --bg:#16130e;
    --panel:#211c15;
    --panel2:#26211a;
    --panel3:#1b1711;
    --sheet:#1e1a13;
    --line:rgba(240,230,210,.13);
    --line-2:rgba(240,230,210,.26);

    --txt:#ece5d6;
    --dim:#b0a793;
    --dim-2:#8d8471;

    --acc:#93b0e8;
    --acc-fill-1:#3a5a96;
    --acc-fill-2:#2c487c;
    --acc-2:#5f80bd;
    --acc-ink:#a3bdea;
    --on-acc:#f7f4ec;
    --ok:#4fae7d; --ok-ink:#8edbb2;
    --bad:#d76a5c; --bad-ink:#f0a79c;
    --warn:#c99a3f; --warn-ink:#e0b86a;
    --violet-ink:#bda1ea;
    --ring:rgba(147,176,232,.55);

    --tint-ok:rgba(79,174,125,.13);
    --tint-bad:rgba(215,106,92,.13);
    --tint-warn:rgba(201,154,63,.11);
    --tint-acc:rgba(147,176,232,.12);
    --tint-violet:rgba(189,161,234,.13);
    --tint-neutral:rgba(240,230,210,.06);
    --chip:#1b1711;
    --chip-hover:#241f17;
    --scrim:rgba(6,5,3,.62);
    --selection:rgba(147,176,232,.30);
    --scroll:rgba(240,230,210,.28);

    --sh-1:0 1px 2px rgba(0,0,0,.40),0 3px 10px -4px rgba(0,0,0,.55);
    --sh-2:0 2px 6px rgba(0,0,0,.42),0 12px 28px -12px rgba(0,0,0,.62);
    --sh-3:0 4px 12px rgba(0,0,0,.45),0 28px 64px -20px rgba(0,0,0,.72);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;font-size:var(--fs-base);line-height:1.6;font-family:var(--font-ui);
       background:var(--bg);
       color:var(--txt);
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
       transition:background var(--dur-3) var(--ease),color var(--dur-3) var(--ease)}
  ::selection{background:var(--selection);color:var(--txt)}

  /* Foco visible en TODO lo interactivo. */
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r-1)}

  /* Barra de desplazamiento con la tinta del papel. */
  *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:var(--r-pill);
                            border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--line-2);background-clip:content-box}

  /* Cabecera: hoja de examen — opaca, con filete doble inferior. */
  header{position:sticky;top:0;z-index:20;
         min-height:var(--header-h);
         background:var(--panel);
         border-bottom:3px double var(--line-2);
         padding:var(--sp-3) var(--sp-5);
         display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
         transition:background var(--dur-3) var(--ease)}
  header h1{font-family:var(--font-read);font-size:var(--fs-h1);margin:0;
            font-weight:700;letter-spacing:-.01em;white-space:nowrap;
            display:flex;align-items:center;gap:var(--sp-2)}
  /* Monograma «B2» como casilla de formulario de examen */
  .monogram{display:inline-flex;align-items:center;justify-content:center;
            background:var(--txt);color:var(--panel);font-family:var(--font-ui);
            font-weight:800;font-size:var(--fs-sm);letter-spacing:.04em;
            padding:0 var(--sp-2);height:24px;border-radius:var(--r-1);flex:0 0 auto}
  /* Filete de progreso: la tinta que rellena el filete doble de la cabecera */
  .progress-rule{position:absolute;left:0;right:0;bottom:-3px;height:3px;
                 overflow:hidden;pointer-events:none}
  .progress-rule span{display:block;height:100%;width:0;background:var(--acc);
                 transition:width var(--dur-3) var(--spring)}
  header .spacer{flex:1}
  .stat{font-size:var(--fs-sm);color:var(--dim);font-variant-numeric:tabular-nums}
  .stat b{color:var(--txt);font-weight:640}

  .layout{display:flex;align-items:flex-start;gap:0}
  nav{width:var(--nav-w);flex:0 0 var(--nav-w);
      border-right:1px solid var(--line);
      background:var(--bg);
      height:calc(100vh - var(--header-h));
      overflow-y:auto;position:sticky;top:var(--header-h);
      padding:var(--sp-3) var(--sp-3) var(--sp-5)}
  nav .sec{font-size:var(--fs-micro);letter-spacing:.10em;text-transform:uppercase;
           color:var(--dim-2);margin:var(--sp-5) var(--sp-2) var(--sp-2);
           padding-bottom:var(--sp-2);border-bottom:1px solid var(--line);
           font-weight:700;display:flex;align-items:center;
           justify-content:space-between;gap:var(--sp-2)}
  /* Cabecera plegable: al menú le sobraban 140 entradas. Un clic abre el grupo
     y cierra el anterior; el contador dice cuántas entradas esconde. */
  nav .sec-toggle{display:flex;align-items:center;gap:var(--sp-2);flex:1 1 auto;
           min-width:0;min-height:32px;cursor:pointer;user-select:none;
           border-radius:var(--r-1);
           transition:color var(--dur-1) var(--ease),transform var(--dur-1) var(--spring)}
  nav .sec-toggle::before{content:"";width:7px;height:7px;flex:0 0 7px;
           border-right:2px solid currentColor;border-bottom:2px solid currentColor;
           transform:rotate(-45deg);transition:transform var(--dur-2) var(--spring)}
  nav .sec.open .sec-toggle::before{transform:rotate(45deg)}
  nav .sec-toggle:hover{color:var(--txt)}
  nav .sec-toggle:active{transform:scale(.985)}
  nav .sec-toggle:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  nav .sec-count{font-variant-numeric:tabular-nums;color:var(--dim-2);font-weight:700;
           margin-left:auto}
  nav .sec.open .sec-count{color:var(--dim)}
  /* El display:flex de los botones gana al [hidden] del navegador: se apaga a mano. */
  nav button[hidden]{display:none}
  nav button.sec-reset{display:inline-flex;align-items:center;width:auto;min-height:28px;
           padding:var(--sp-1) var(--sp-2);border:1px solid var(--line);
           border-radius:var(--r-1);font-size:var(--fs-micro);font-weight:700;letter-spacing:.02em;
           color:var(--dim);text-transform:none;line-height:1.4;background:var(--panel3);
           transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease),
                      border-color var(--dur-1) var(--ease)}
  nav button.sec-reset:hover{background:var(--chip-hover);color:var(--txt);border-color:var(--line-2)}
  nav button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:var(--sp-2);
             text-align:left;background:none;border:1px solid transparent;color:var(--dim);
             min-height:40px;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-2);cursor:pointer;
             font-size:var(--fs-sm);line-height:1.35;font-family:inherit;position:relative;
             transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                        transform var(--dur-1) var(--spring),box-shadow var(--dur-2) var(--ease)}
  nav button:hover{background:var(--tint-neutral);color:var(--txt)}
  nav button:active{transform:scale(.985)}
  nav button.active{background:var(--panel);color:var(--txt);font-weight:640;
             border-color:var(--line);box-shadow:var(--sh-1);
             padding-left:calc(var(--sp-3) + 16px)}
  nav button.active::before{content:"";position:absolute;left:var(--sp-3);top:50%;
             transform:translateY(-50%);
             width:6px;height:6px;background:var(--acc);border-radius:1px}
  nav button .pill{font-size:var(--fs-micro);color:var(--dim-2);font-weight:400;
             font-variant-numeric:tabular-nums;white-space:nowrap}
  nav button.active .pill{color:var(--dim)}

  main{flex:1;min-width:0;padding:var(--sp-6) var(--sp-6) var(--sp-8);max-width:960px}
  /* Masthead editorial: título display + filete + línea de datos en versalitas */
  h2{font-family:var(--font-read);font-size:var(--fs-h2);line-height:1.16;margin:0;
     font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  h2 + .sub{color:var(--dim-2);font-size:var(--fs-xs);font-weight:640;
     margin:var(--sp-4) 0 var(--sp-5);padding-top:var(--sp-3);
     border-top:1px solid var(--line);
     letter-spacing:.09em;text-transform:uppercase;
     font-variant-numeric:tabular-nums}
  h2 + .sub b{color:var(--txt);font-weight:700}

  /* Superficie hoja: sombra cálida, sin borde (elevación declarada una vez). */
  .panel{background:var(--panel);border-radius:var(--r-3);
         padding:var(--sp-4) var(--sp-5);margin-bottom:var(--sp-4);
         box-shadow:var(--sh-1)}
  /* Etiqueta de panel: casilla de formulario, no eyebrow decorativo */
  .panel h3{display:inline-block;margin:0 0 var(--sp-4);font-size:10px;letter-spacing:.12em;
            text-transform:uppercase;color:var(--dim-2);font-weight:700;
            border:1px solid var(--line-2);border-radius:var(--r-1);padding:4px var(--sp-2)}
  .intro-text{font-family:var(--font-read);font-size:var(--fs-lead);line-height:1.7;
              color:var(--txt);max-width:var(--read-w)}

  details.passage summary{cursor:pointer;font-weight:640;font-size:var(--fs-base);color:var(--acc-ink);
                          user-select:none;list-style:none;display:flex;align-items:center;
                          gap:var(--sp-2);min-height:32px;
                          transition:color var(--dur-1) var(--ease)}
  details.passage summary::-webkit-details-marker{display:none}
  details.passage summary::before{content:"";width:7px;height:7px;flex:0 0 7px;
                          border-right:2px solid currentColor;border-bottom:2px solid currentColor;
                          transform:rotate(-45deg);transition:transform var(--dur-2) var(--spring)}
  details.passage[open] summary::before{transform:rotate(45deg)}
  details.passage summary:hover{color:var(--acc)}
  details.passage[open] summary{margin-bottom:var(--sp-3);padding-bottom:var(--sp-2);
                                 border-bottom:1px solid var(--line)}
  .passage-body{white-space:pre-wrap;font-family:var(--font-read);font-size:var(--fs-base);line-height:1.75;
                color:var(--txt);max-width:var(--read-w);max-height:62vh;overflow-y:auto;
                padding-right:var(--sp-2)}

  /* Anuncios: recuadro de papel, sin barras de color de 3px. */
  /* Anuncios como columna de clasificados: filas con filete, no cajas en cajas.
     El estado se lee en la letra: azul = ya asignada por ti, ámbar = libre.
     Nunca marca lo que la clave da por correcto: eso sería enseñar la solución.
     El ✓ repite el estado sin depender del color. */
  .ad{border:0;border-top:1px solid var(--line);padding:var(--sp-3) var(--sp-2);margin:0;
      border-radius:0;background:transparent;font-family:var(--font-read);
      transition:background var(--dur-2) var(--ease)}
  .ad:first-child{border-top:0}
  .ad:hover{background:var(--tint-neutral)}
  .ad .k{font-weight:700;margin-right:var(--sp-2);font-variant-numeric:tabular-nums;
         font-family:var(--font-read);font-size:var(--fs-lead)}
  .ad .t{font-weight:640}
  .ad .body{color:var(--dim);font-size:var(--fs-base);margin-top:var(--sp-1);line-height:1.6;
            max-width:var(--read-w)}
  .ad.used .k{color:var(--acc-ink)}
  .ad.unused .k{color:var(--warn-ink)}
  .ad.used .t::after{content:" ✓";color:var(--ok-ink);font-weight:700}

  /* Hoja de examen continua: las preguntas NO son tarjetas apiladas, son filas
     de una sola hoja, con filete de margen rojo como en el papel del examen. */
  .q-sheet{position:relative;background:var(--panel);border-radius:var(--r-3);
           box-shadow:var(--sh-1);padding:var(--sp-2) var(--sp-5) var(--sp-3) 56px;
           margin-bottom:var(--sp-4)}
  .q-sheet::before{content:"";position:absolute;top:var(--sp-4);bottom:var(--sp-4);left:36px;
           width:1px;background:var(--bad);opacity:.45}
  .q{border-radius:0;background:transparent;
     padding:var(--sp-5) 0;margin:0;box-shadow:none;
     border-top:1px solid var(--line)}
  .q:first-child{border-top:0}
  .q .num{display:inline-flex;align-items:center;justify-content:center;
          min-width:28px;height:28px;background:var(--sheet);border:1px solid var(--line-2);
          border-radius:50%;font-size:var(--fs-xs);font-weight:700;margin-right:var(--sp-3);
          color:var(--txt);font-variant-numeric:tabular-nums;vertical-align:middle;
          font-family:var(--font-read)}
  .q .prompt{font-size:var(--fs-lead);line-height:1.55;font-weight:640;margin-bottom:var(--sp-3);display:inline}
  .opts{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-3)}
  .opt{display:flex;gap:var(--sp-3);align-items:flex-start;min-height:44px;border:1px solid var(--line);
       border-radius:var(--r-2);padding:var(--sp-3) var(--sp-4);cursor:pointer;
       background:var(--chip);position:relative;
       transition:background var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease),
                  transform var(--dur-1) var(--spring),box-shadow var(--dur-2) var(--ease)}
  .opt:hover{border-color:var(--line-2);background:var(--chip-hover);
             transform:translateY(-1px);box-shadow:var(--sh-1)}
  .opt:active{transform:scale(.995)}
  .opt .key{font-weight:700;min-width:20px;color:var(--acc-ink);font-variant-numeric:tabular-nums}
  .opt.sel{border-color:var(--acc);background:var(--sheet);
           box-shadow:0 0 0 3px var(--tint-acc)}
  .opt.correct{border-color:rgba(46,110,73,.55);background:var(--tint-ok)}
  .opt.wrong{border-color:rgba(176,54,42,.55);background:var(--tint-bad)}
  .opt.correct .key{color:var(--ok-ink)}
  .opt.wrong .key{color:var(--bad-ink)}
  /* El estado no depende solo del color: marca textual a la derecha. */
  .opt.correct::after,.opt.wrong::after{position:absolute;right:var(--sp-4);top:50%;
       transform:translateY(-50%);font-weight:700;font-size:var(--fs-base)}
  .opt.correct::after{content:"✓";color:var(--ok-ink)}
  .opt.wrong::after{content:"✗";color:var(--bad-ink)}

  .letters{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-3)}
  .letters button{width:44px;height:44px;border-radius:var(--r-2);border:1px solid var(--line);
                  background:var(--sheet);color:var(--txt);font-weight:700;cursor:pointer;
                  font-size:var(--fs-base);font-family:var(--font-read);
                  transition:background var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease),
                             transform var(--dur-1) var(--spring),box-shadow var(--dur-2) var(--ease)}
  .letters button:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh-1)}
  .letters button:active{transform:scale(.96)}
  .letters button.sel{background:var(--acc-fill-1);border-color:var(--acc-fill-2);
                      color:var(--on-acc);box-shadow:var(--sh-1)}
  .letters button.correct{background:#dcecdf;border-color:rgba(46,110,73,.5);color:#1c5638}
  .letters button.wrong{background:#f4dcd7;border-color:rgba(176,54,42,.5);color:#8f2a20}
  [data-theme="dark"] .letters button.correct{background:#24402f;border-color:rgba(79,174,125,.5);color:#a5dfbe}
  [data-theme="dark"] .letters button.wrong{background:#46261f;border-color:rgba(215,106,92,.5);color:#f2aea3}

  .fb{margin-top:var(--sp-4);border-radius:var(--r-2);padding:var(--sp-3) var(--sp-4);
      font-size:var(--fs-base);display:none;border:1px solid transparent}
  .fb.show{display:block;animation:pop var(--dur-2) var(--spring)}
  .fb.good{background:var(--tint-ok);border-color:rgba(46,110,73,.34)}
  .fb.bad{background:var(--tint-bad);border-color:rgba(176,54,42,.34)}
  .fb .verdict{font-weight:650;margin-bottom:var(--sp-2);display:flex;align-items:center;
               gap:var(--sp-2);flex-wrap:wrap}
  .fb .quote{font-family:var(--font-read);font-style:italic;color:var(--dim);font-size:var(--fs-base);
             border-left:1px solid var(--acc);padding:var(--sp-1) 0 var(--sp-1) var(--sp-3);
             margin:var(--sp-2) 0;max-width:var(--read-w)}

  .badge{font-size:var(--fs-micro);font-weight:700;padding:4px var(--sp-2);border-radius:var(--r-pill);
         letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
  .badge.hoch{background:var(--tint-ok);color:var(--ok-ink);border-color:rgba(46,110,73,.38)}
  .badge.mittel{background:var(--tint-warn);color:var(--warn-ink);border-color:rgba(138,100,20,.38)}
  .badge.niedrig{background:var(--tint-bad);color:var(--bad-ink);border-color:rgba(176,54,42,.38)}
  .badge.ok{background:var(--tint-acc);color:var(--acc-ink);border-color:rgba(44,77,143,.38)}
  .badge.tag{background:var(--tint-neutral);color:var(--dim);border-color:var(--line)}

  .row{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center}
  .btn{background:var(--acc-fill-1);color:var(--on-acc);
       border:1px solid var(--acc-fill-2);border-radius:var(--r-2);
       padding:0 var(--sp-4);min-height:40px;cursor:pointer;font-size:var(--fs-base);font-weight:600;
       font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
       box-shadow:var(--sh-1);
       transition:filter var(--dur-1) var(--ease),transform var(--dur-1) var(--spring),
                  background var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease),
                  color var(--dur-2) var(--ease)}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
  .btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--dim);
             box-shadow:none;text-transform:uppercase;letter-spacing:.07em;
             font-size:var(--fs-micro);font-weight:700}
  .btn.ghost:hover{background:var(--sheet);color:var(--txt);border-color:var(--line-2);
                   filter:none;box-shadow:var(--sh-1)}
  .btn.danger{background:var(--tint-bad);border:1px solid rgba(176,54,42,.42);color:var(--bad-ink);
              box-shadow:none}
  .btn.danger:hover{background:rgba(176,54,42,.16);filter:none}
  .btn.success{background:var(--tint-ok);border:1px solid rgba(46,110,73,.42);color:var(--ok-ink);
               box-shadow:none}
  .btn.success:hover{background:rgba(46,110,73,.16);filter:none}
  .btn.sm{min-height:28px;padding:0 var(--sp-3);font-size:var(--fs-xs);border-radius:var(--r-1)}

  .note{background:var(--tint-warn);border:1px solid rgba(138,100,20,.34);
        color:var(--warn-ink);padding:var(--sp-3) var(--sp-4);
        border-radius:var(--r-2);font-size:var(--fs-sm);margin-bottom:var(--sp-4)}
  .empty{color:var(--dim-2);padding:var(--sp-8) 0;text-align:center;font-size:var(--fs-base)}
  code{background:var(--panel3);padding:4px var(--sp-1);border-radius:var(--r-1);
       font-family:var(--font-mono);font-size:var(--fs-xs);border:1px solid var(--line)}

  /* --- Etiquetas y avisos reutilizables (sustituyen estilos en línea del JS) --- */
  .card-label{font-weight:640;font-size:var(--fs-sm);color:var(--acc-ink);margin-bottom:var(--sp-1)}
  .lp-head{font-weight:700;font-size:var(--fs-base);margin-bottom:var(--sp-2)}
  .micro{font-size:var(--fs-micro);color:var(--dim)}
  .notice-ok{color:var(--ok-ink);margin-bottom:var(--sp-2)}
  .notice-dim{color:var(--dim-2);font-style:italic}
  .status-error{color:var(--bad-ink)}
  .list-tight{margin:var(--sp-2) 0;padding-left:var(--sp-5);line-height:1.6}
  .sec-title{margin:0 0 var(--sp-3);font-size:var(--fs-base);color:var(--bad-ink)}
  .em-ok{color:var(--ok-ink)}
  .em-warn{color:var(--warn-ink)}
  .em-acc{color:var(--acc-ink)}
  .hr-soft{border-top:1px solid var(--line);margin-top:var(--sp-4);padding-top:var(--sp-4)}
  .mono{font-family:var(--font-mono);font-size:var(--fs-xs)}
  .micro-block{display:block;color:var(--dim);line-height:1.45}
  .small{font-size:var(--fs-sm)}
  .mt-2{margin-top:var(--sp-2)}
  .mt-3{margin-top:var(--sp-3)}
  .crit-title{margin:0 0 var(--sp-2);font-size:var(--fs-base);color:var(--txt)}
  .cv-title{margin:0;font-size:var(--fs-base);color:var(--acc-ink)}
  .cv-title.em-ok{color:var(--ok-ink)}
  .sec-head{display:flex;justify-content:space-between;align-items:center;
            margin-bottom:var(--sp-3);flex-wrap:wrap;gap:var(--sp-2)}
  .err-card-head{display:flex;justify-content:space-between;align-items:center;
                 margin-bottom:var(--sp-2);gap:var(--sp-2)}
  .err-card-head-l{display:flex;align-items:center;gap:var(--sp-2)}
  .err-idx{font-weight:700;font-size:var(--fs-sm)}
  .list-tight.sm{font-size:var(--fs-sm);line-height:1.55;padding-left:var(--sp-5);margin:var(--sp-2) 0}
  .list-tight.xs{padding-left:var(--sp-4);margin:var(--sp-1) 0}
  .model-text.ok-edge{background:var(--tint-ok);border-color:rgba(46,110,73,.45)}
  .em-bad{color:var(--bad-ink)}
  .lp-label{flex:1;cursor:pointer;display:flex;align-items:center;gap:var(--sp-2)}
  .row-inline{display:flex;gap:var(--sp-3);align-items:center;margin-top:var(--sp-2);flex-wrap:wrap}
  .annotated-title{margin:0;font-size:var(--fs-base)}
  .translation{margin-bottom:var(--sp-2)}

  /* Schreiben UI & Editor */
  .schreiben-layout{display:flex;flex-direction:column;gap:var(--sp-5)}
  .memo-card{background:var(--tint-warn);border:1px solid rgba(138,100,20,.34);
             padding:var(--sp-3) var(--sp-4);
             border-radius:var(--r-2);margin:var(--sp-3) 0;font-size:var(--fs-base);line-height:1.6}
  .memo-card b{color:var(--warn-ink)}
  .letter-card{background:var(--panel2);border:1px solid var(--line);
               padding:var(--sp-4) var(--sp-5);
               border-radius:var(--r-2);margin:var(--sp-3) 0;white-space:pre-wrap;
               font-family:var(--font-read);font-size:var(--fs-base);line-height:1.7;color:var(--txt);
               max-width:var(--read-w)}
  .lp-list{list-style:none;padding:0;margin:var(--sp-3) 0;display:flex;flex-direction:column;gap:var(--sp-2)}
  .lp-item{display:flex;align-items:flex-start;gap:var(--sp-3);min-height:44px;background:var(--chip);
           padding:var(--sp-3) var(--sp-4);border-radius:var(--r-2);font-size:var(--fs-base);
           border:1px solid var(--line);transition:border-color var(--dur-2) var(--ease),
           background var(--dur-2) var(--ease)}
  .lp-item:hover{border-color:var(--line-2);background:var(--chip-hover)}
  .lp-item input[type="checkbox"]{margin-top:4px;cursor:pointer;accent-color:var(--acc);
           width:16px;height:16px;flex:0 0 16px}
  .lp-item .lp-num{min-width:24px;height:24px;flex:0 0 24px;background:var(--acc-fill-1);
           color:var(--on-acc);border-radius:50%;display:flex;align-items:center;justify-content:center;
           font-size:var(--fs-micro);font-weight:700}

  .editor-card{background:var(--panel);border-radius:var(--r-3);
               padding:var(--sp-5);box-shadow:var(--sh-1)}
  .editor-toolbar{display:flex;align-items:center;justify-content:space-between;
                  margin-bottom:var(--sp-4);flex-wrap:wrap;gap:var(--sp-3)}
  .editor-textarea{width:100%;min-height:300px;background:var(--sheet);border:1px solid var(--line);
           border-radius:var(--r-2);padding:var(--sp-4) var(--sp-5);color:var(--txt);
           font-size:var(--fs-base);line-height:1.7;font-family:var(--font-ui);resize:vertical;
           caret-color:var(--acc);outline:none;box-sizing:border-box;
           transition:border-color var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
  .editor-textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--tint-acc)}
  .timer-box{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--dim)}
  .timer-display{font-size:var(--fs-base);font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
  .timer-display.warn{color:var(--bad-ink)}

  /* Evaluación de Schreiben */
  /* Evaluación: sello de examen — marco doble, versalitas, prensado elástico */
  .eval-banner{padding:var(--sp-3) var(--sp-5);border-radius:var(--r-2);font-weight:700;
               font-size:var(--fs-base);letter-spacing:.05em;text-transform:uppercase;
               display:flex;align-items:center;justify-content:space-between;margin:var(--sp-4) 0;
               flex-wrap:wrap;gap:var(--sp-3);
               border:2px solid currentColor;box-shadow:inset 0 0 0 1px currentColor;
               transform:rotate(-.5deg);
               animation:stamp var(--dur-3) var(--spring)}
  @keyframes stamp{from{transform:rotate(-.5deg) scale(1.12);opacity:0}
                   to{transform:rotate(-.5deg) scale(1);opacity:1}}
  .eval-banner.pass{background:var(--tint-ok);border-color:rgba(46,110,73,.55);color:var(--ok-ink)}
  .eval-banner.fail{background:var(--tint-bad);border-color:rgba(176,54,42,.55);color:var(--bad-ink)}
  .crit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
             gap:var(--sp-3);margin:var(--sp-4) 0}
  .crit-box{background:var(--chip);border:1px solid var(--line);border-radius:var(--r-2);
            padding:var(--sp-3) var(--sp-4)}
  .crit-box .ch{display:flex;justify-content:space-between;align-items:center;
                margin-bottom:var(--sp-2);font-weight:600;font-size:var(--fs-sm)}
  .crit-box .c-body{font-size:var(--fs-sm);color:var(--dim);line-height:1.55}
  .annotated-card{background:var(--panel);border-radius:var(--r-3);
            padding:var(--sp-5);margin:var(--sp-4) 0;box-shadow:var(--sh-1)}
  .annotated-head{display:flex;justify-content:space-between;align-items:center;
            margin-bottom:var(--sp-3);flex-wrap:wrap;gap:var(--sp-3)}
  .annotated-text-box{background:var(--sheet);border:1px solid var(--line);
            border-radius:var(--r-2);padding:var(--sp-5);
            font-family:var(--font-read);font-size:var(--fs-base);line-height:1.95;white-space:pre-wrap;
            color:var(--txt);word-break:break-word}

  .err-highlight{position:relative;border-radius:var(--r-1);padding:4px var(--sp-1);margin:0;
                 cursor:pointer;display:inline;font-weight:500;
                 transition:background var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
  .err-highlight.err-grammatik{background:var(--tint-bad);border-bottom:2px solid var(--bad-ink);color:var(--bad-ink)}
  .err-highlight.err-grammatik:hover,.err-highlight.err-grammatik.active{background:rgba(176,54,42,.24);box-shadow:0 0 0 2px var(--tint-bad)}
  .err-highlight.err-wortschatz{background:var(--tint-warn);border-bottom:2px solid var(--warn-ink);color:var(--warn-ink)}
  .err-highlight.err-wortschatz:hover,.err-highlight.err-wortschatz.active{background:rgba(138,100,20,.22);box-shadow:0 0 0 2px var(--tint-warn)}
  .err-highlight.err-zeichensetzung{background:var(--tint-acc);border-bottom:2px solid var(--acc-ink);color:var(--acc-ink)}
  .err-highlight.err-zeichensetzung:hover,.err-highlight.err-zeichensetzung.active{background:rgba(44,77,143,.20);box-shadow:0 0 0 2px var(--tint-acc)}
  .err-highlight.err-stil{background:var(--tint-violet);border-bottom:2px solid var(--violet-ink);color:var(--violet-ink)}
  .err-highlight.err-stil:hover,.err-highlight.err-stil.active{background:rgba(107,74,158,.22);box-shadow:0 0 0 2px var(--tint-violet)}

  .err-badge-num{font-size:var(--fs-micro);font-weight:700;vertical-align:super;padding:0 var(--sp-1);
                 border-radius:var(--r-pill);margin-left:var(--sp-1);background:var(--panel);
                 border:1px solid currentColor;opacity:.95}

  .err-popover{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
               background:var(--panel2);border:1px solid var(--line-2);box-shadow:var(--sh-3);
               border-radius:var(--r-2);
               padding:var(--sp-3) var(--sp-4);min-width:250px;max-width:340px;z-index:40;display:none;
               font-size:var(--fs-sm);line-height:1.5;pointer-events:auto;text-align:left;
               animation:pop var(--dur-2) var(--spring)}
  .err-popover::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
               border-width:6px;border-style:solid;
               border-color:var(--panel2) transparent transparent transparent}
  .err-highlight:hover .err-popover,.err-highlight.active .err-popover{display:block}
  .err-popover-head{display:flex;justify-content:space-between;align-items:center;
               margin-bottom:var(--sp-2);padding-bottom:var(--sp-1);border-bottom:1px solid var(--line)}
  .err-popover-orig{color:var(--bad-ink);font-size:var(--fs-xs);margin-bottom:var(--sp-1);display:block}
  .err-popover-corr{color:var(--ok-ink);font-weight:640;font-size:var(--fs-sm);margin-bottom:var(--sp-2);display:block}
  .err-popover-rule{color:var(--dim);font-size:var(--fs-xs);display:block;line-height:1.5}

  .err-legend{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;font-size:var(--fs-xs)}
  .legend-chip{display:inline-flex;align-items:center;gap:var(--sp-1);padding:var(--sp-1) var(--sp-2);
               border-radius:var(--r-pill);background:var(--chip);border:1px solid var(--line);
               color:var(--dim)}
  .legend-chip .dot{width:8px;height:8px;border-radius:50%}
  .legend-chip.gram .dot{background:var(--bad-ink)}
  .legend-chip.wort .dot{background:var(--warn-ink)}
  .legend-chip.zeichen .dot{background:var(--acc-ink)}
  .legend-chip.stil .dot{background:var(--violet-ink)}

  .tab-pills{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin:var(--sp-3) 0}
  .tab-pills.flush{margin:0}
  .tab-pill{background:var(--chip);border:1px solid var(--line);color:var(--dim);
            padding:0 var(--sp-4);min-height:36px;display:inline-flex;align-items:center;
            border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:600;cursor:pointer;
            font-family:inherit;
            transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                       border-color var(--dur-2) var(--ease),transform var(--dur-1) var(--spring)}
  .tab-pill:hover{color:var(--txt);background:var(--chip-hover);transform:translateY(-1px)}
  .tab-pill:active{transform:scale(.97)}
  .tab-pill.active{background:var(--acc-fill-1);color:var(--on-acc);
            border-color:var(--acc-fill-2);box-shadow:var(--sh-1)}

  .err-card{background:var(--chip);border:1px solid var(--line);
            border-radius:var(--r-2);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-3);
            cursor:pointer;
            transition:box-shadow var(--dur-2) var(--ease),transform var(--dur-2) var(--spring),
                       border-color var(--dur-2) var(--ease),background var(--dur-2) var(--ease)}
  .err-card:hover{transform:translateY(-1px);border-color:var(--acc);box-shadow:var(--sh-1)}
  .err-card.pulse{box-shadow:0 0 0 3px var(--ring);border-color:var(--acc)}
  .err-card .orig{color:var(--bad-ink);text-decoration:line-through;margin-bottom:var(--sp-1);font-size:var(--fs-sm)}
  .err-card .corr{color:var(--ok-ink);font-weight:640;margin-bottom:var(--sp-1);font-size:var(--fs-base)}
  .err-card .rule{font-size:var(--fs-sm);color:var(--dim);line-height:1.5}
  .model-text{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-2);
              padding:var(--sp-4) var(--sp-5);font-family:var(--font-read);font-size:var(--fs-base);
              line-height:1.7;white-space:pre-wrap;color:var(--txt);max-width:var(--read-w)}
  .copy-btn{font-size:var(--fs-xs);padding:0 var(--sp-3);min-height:32px;border-radius:var(--r-1);
            cursor:pointer;background:transparent;border:1px solid var(--line-2);
            color:var(--dim);font-family:inherit;
            transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                       transform var(--dur-1) var(--spring)}
  .copy-btn:hover{background:var(--sheet);color:var(--txt)}
  .copy-btn:active{transform:scale(.97)}

  /* Modal de Configuración: hoja sobre velo cálido (sin cristal). */
  .modal-backdrop{position:fixed;inset:0;background:var(--scrim);
                  z-index:100;display:flex;align-items:center;justify-content:center;padding:var(--sp-4)}
  .modal{background:var(--panel);
         border:1px solid var(--line);border-radius:var(--r-4);width:100%;max-width:560px;
         box-shadow:var(--sh-3);overflow:hidden;animation:pop var(--dur-3) var(--spring)}
  @keyframes pop{from{transform:scale(.965);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--line);
              display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
  .modal-head h3{margin:0;font-size:var(--fs-lead);font-weight:650}
  .modal-close{background:none;border:1px solid transparent;color:var(--dim-2);font-size:var(--fs-lead);
               cursor:pointer;width:32px;height:32px;border-radius:var(--r-1);
               display:inline-flex;align-items:center;justify-content:center;
               transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                          transform var(--dur-1) var(--spring)}
  .modal-close:hover{color:var(--txt);background:var(--tint-neutral)}
  .modal-close:active{transform:scale(.94)}
  .modal-body{padding:var(--sp-5);max-height:75vh;overflow-y:auto}
  .modal-foot{padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--line);
              display:flex;justify-content:flex-end;gap:var(--sp-3);background:var(--panel2)}
  .ai-status{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
             flex-wrap:wrap;background:var(--chip);border:1px solid var(--line);
             border-radius:var(--r-2);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-4);
             font-size:var(--fs-xs);color:var(--dim)}
  .form-group{margin-bottom:var(--sp-4)}
  .form-group label{display:block;font-size:var(--fs-sm);font-weight:640;margin-bottom:var(--sp-2);color:var(--txt)}
  .form-group small{display:block;font-size:var(--fs-xs);color:var(--dim);margin-top:var(--sp-1);line-height:1.45}
  .input,.select{width:100%;background:var(--sheet);border:1px solid var(--line);
                 border-radius:var(--r-2);padding:0 var(--sp-3);min-height:42px;color:var(--txt);
                 font-size:var(--fs-sm);font-family:inherit;outline:none;box-sizing:border-box;
                 caret-color:var(--acc);
                 transition:border-color var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
  .input::placeholder{color:var(--dim-2)}
  .input:focus,.select:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--tint-acc)}

  /* Selector bilingüe ES / RU: control segmentado, hoja seleccionada (sin píldora azul). */
  .lang-switch{display:inline-flex;align-items:center;background:var(--panel3);
               border:1px solid var(--line);border-radius:var(--r-pill);padding:4px;gap:var(--sp-1)}
  .lang-btn{background:transparent;border:0;color:var(--dim);font-size:var(--fs-xs);font-weight:640;
            padding:0 var(--sp-3);min-height:32px;border-radius:var(--r-pill);cursor:pointer;
            font-family:inherit;
            transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                       transform var(--dur-1) var(--spring),box-shadow var(--dur-2) var(--ease);
            display:inline-flex;align-items:center;gap:var(--sp-1);line-height:1}
  .lang-btn:hover{color:var(--txt)}
  .lang-btn:active{transform:scale(.96)}
  .lang-btn.active{background:var(--sheet);color:var(--txt);font-weight:700;
            box-shadow:var(--sh-1)}

  /* Selector de usuario Sergio / Diana */
  .user-switch{display:inline-flex;align-items:center;background:var(--panel3);
               border:1px solid var(--line);border-radius:var(--r-pill);padding:4px;gap:var(--sp-1)}
  .user-btn{background:transparent;border:0;color:var(--dim);font-size:var(--fs-xs);font-weight:640;
            padding:0 var(--sp-3);min-height:32px;border-radius:var(--r-pill);cursor:pointer;
            font-family:inherit;
            transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
                       transform var(--dur-1) var(--spring),box-shadow var(--dur-2) var(--ease);
            display:inline-flex;align-items:center;gap:var(--sp-1);line-height:1}
  .user-btn:hover{color:var(--txt)}
  .user-btn:active{transform:scale(.96)}
  .user-btn.active{background:var(--sheet);color:var(--txt);font-weight:700;
            box-shadow:var(--sh-1)}

  /* Indicador de sincronización en la nube */
  .cloud-badge{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-micro);color:var(--dim);
               padding:var(--sp-1) var(--sp-2);border-radius:var(--r-pill);

  /* --- Escritorio ancho (≥1500px): la mesa de examen, en dos columnas ---
     A 1920px una columna de 960px dejaba media pantalla vacía a la derecha. Aquí

     la izquierda, fija y con su propio scroll, y la hoja de preguntas ocupa la
     derecha: se responde sin subir y bajar a consultar el anuncio.
     Solo se activa si la variante tiene referencia; por eso la clase la pone el
     render (main.desk), no un :has() ni un ancho fijo. */
  @media(min-width:1500px){

h", "quote": "Das Land arbeitet in den Bereichen Umweltschutz und Meeresbiologie eng mit anderen Ländern zusammen. So fördert die Bundesrepublik Deutschland Austauschprogramme zwischen internationalen Forschern.", "explain_ru": "Sean — преподаватель биологии и ищет международную среду; b — единственное научное и международное объявление, и его область (Meeresbiologie, морская биология) дословно совпадает с его специальностью. Остальные объявления исключаются методом отбора (право, телефон, практика, языковая поездка).", "explain": "Sean es profesor de biología y busca un entorno internacional; b es el único anuncio científico e internacional y su campo (Meeresbiologie, biología marina) coincide literalmente con el suyo. El resto de anuncios se descartan por eliminación (derecho, teléfono, prácticas, viaje de idiomas).", "verified": true}, {"n": 5, "type": "choice", "prompt": "Yassin möchte erste Berufserfahrungen im Ausland sammeln.", "answer": "g", "confidence": "hoch", "quote": "Du träumst von einem Job im Ausland, dann knüpfe erste Kontakte durch ein Praktikum.", "explain_ru": "Yassin хочет получить первый профессиональный опыт за границей, и g предлагает именно это: Auslandspraktikum как первый шаг. Объявление a — языковая поездка без рабочей составляющей.", "explain": "Yassin quiere sus primeras experiencias profesionales en el extranjero y g propone precisamente eso: un Auslandspraktikum como primera toma de contacto. El anuncio a es un viaje de idiomas, sin componente laboral.", "verified": true}]}, {"id": "t1_a2-p10", "note_ru": "В заголовке указано «вариант №1»: это то же задание, что и вариант с. 9, но с изменёнными именами и порядком людей, поэтому ответы каждого номера меняются.", "label": "Variante 1 (nueva versión 07.02.2025)", "page": 10, "note": "El encabezado dice «вариант №1»: es la misma tarea que la variante de la p. 9, pero con los nombres y el orden de las personas cambiados, por lo que cambian las respuestas de cada número.", "kind": "zuordnun alifikation, desto besser die Chancen auf dem Arbeitsmarkt. Wer keine Berufsausbildung hat, läuft Gefahr, in die Langzeitarbeitslosigkeit abzustürzen. Wer Arbeit hat, muss als Ungelernter mit geringerem Gehalt und schlechteren Aufstiegschancen rechnen.", "distractor": "Describe exactamente la situación de Maria (Hilfsarbeiterin sin formación), pero solo diagnostica el problema: no ofrece ninguna vía para conseguir la Berufsausbildung. Distractor de la persona 2, cuya respuesta es el anuncio h (portal de cualificación para Ungelernte)."}, {"key": "g", "title": "Möglichkeiten, mit einer Kündigung umzugehen.", "text": "Du fühlst dich nach einer Kündigung gedemütigt und alleine gelassen und weißt nicht, wie es weitergehen soll? Das kann auch eine Chance sein, sich neu zu orientieren und vielleicht sogar die eigene Berufung zu finden.", "distractor": "Habla de la Kündigung, pero desde el punto de vista emocional y de la reorientación profesional («sich neu orientieren»), no jurídico: no sirve para «dagegen vorgehen». Distractor de la persona 5, que confunde con el anuncio a (derecho laboral)."}, {"key": "h", "title": "Wege und Chancen.", "text": "Das Bundesministerium für Bildung und Forschung unterstützt bei der beruflichen Qualifizierung. Es hat ein Portal eingerichtet, um vor allem Ungelernte und Geringqualifizierte sowie Arbeitnehmer in Elternzeit über passende Aus- und Weiterbildungsmöglichkeiten zu informieren.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Junis ist gelernter Kfz-Mechatroniker und möchte eine eigene Werkstatt gründen.", "answer": "d", "confidence": "mittel", "quote": "Das liegt unter anderem auch an neuen staatlichen Förderungsmöglichkeiten für Jungunternehmer, die ihren eigenen Betrieb aufmachen möchten.", "explain_ru": "Junis хочет открыть свою мастерскую: объявление d — единственное, где предлагают государственную поддержку тем, кто открывает собственное дело («ihren eigenen Betrieb aufmachen»). Средняя уверенность: e тоже о Existenzgründung, но e ориентировано на интеллектуальную работу на дому (переводчик, программист, налоговый консультант) и лучше подходит человеку 4; d же не описывает офисные профили и прямо упоминает финансовую помощь для открытия своего дела.", "explain": "Junis quiere abrir su propio taller: el anuncio d es el único que ofrece apoyo estatal a quienes ponen en marcha su propio negocio («ihren eigenen Betrieb aufmachen»). Confianza media porque e también trata de la Existenzgründung, pero e se dirige a trabajo intelectual en casa (traductor, programador, asesor fiscal) y encaja mejor con la persona 4; d, en cambio, no describe perfiles de oficina y menciona expresamente la ayuda económica para montar el negocio propio.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Maria arbeitet als Hilfsarbeiterin und möchte nun eine Berufsausbildung machen.", "answer": "h", "confidence": "hoch", "quote": "Es hat ein Portal eingerichtet, um vor allem Ungelernte und Geringqualifizierte sowie Arbeitnehmer in Elternzeit über passende Aus- und Weiterbildungsmöglichkeiten zu informieren.", "explain_ru": "Maria работает без квалификации и хочет пройти профессиональное обучение. Объявление h — публичный портал, адресованный именно «Ungelernte und Geringqualifizierte», где рассказывают о путях получения квалификации. Объявление f лишь описывает минусы отсутствия образования, не предлагая выхода.", "explain": "Maria trabaja sin cualificación y quiere hacer una formación profesional. El anuncio h es un portal público dirigido justamente a «Ungelernte und Geringqualifizierte» que informa sobre vías de cualificación. El anuncio f solo describe las desventajas de no tener formación, sin ofrecer salida alguna.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Nikolett möchte sich nicht zwischen Familie und Arbeit entscheiden müssen.", "answer": "c", "confidence": "hoch", "quote": "Viele große Unternehmen setzen nun verstärkt auf Flexibilität und familienfreundliche Leistungen wie Firmen-Kita oder Homeoffice.", "explain_ru": "Nikolett не хочет выбирать между семьёй и работой. Объявление c — единственное, где представлены меры «familienfreundlich» (корпоративный детский сад, удалённая работа), то есть совмещение семьи и работы.", "explain": "Nikolett no quiere verse obligada a elegir entre familia y trabajo. El anuncio c es el único que presenta medidas «familienfreundlich» (guardería de empresa, teletrabajo), es decir, compatibilidad de familia y empleo.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Amin studiert Fremdsprachen und möchte nach seinem Abschluss freiberuflich arbeiten.", "answer": "e", "confidence": "hoch", "quote": "Ob als Übersetzer, Programmierer oder Steuerberater - Theo Geertz berät dich, wie du dein Fachwissen nutzen kannst, um zu Hause und auf eigene Rechnung zu arbeiten.", "explain_ru": "Amin изучает языки и хочет работать на себя. Объявление e предлагает консультацию, как работать «Übersetzer» (переводчик — прямое продолжение его учёбы) и «auf eigene Rechnung» (на свой счёт). Объявление d тоже о самозанятости, но как о способе финансирования бизнеса, а не о свободной профессии.", "explain": "Amin estudia idiomas y quiere trabajar por cuenta propia. El anuncio e ofrece asesoramiento para ejercer como «Übersetzer» (traductor, la salida directa de sus estudios) y «auf eigene Rechnung» (por cuenta propia). El anuncio d también es sobre autoempleo, pero como vía de financiación de un negocio, no como ejercicio liberal.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Samita soll aus betriebsbedingten Gründen gekündigt werden und sie möchte dagegen vorgehen.", "answer": "a", "confidence": "hoch", "quote": "Das Arbeitsrecht unterscheidet zwischen personenbedingter, betriebsbedingter und verhaltensbedingter Beendigung des Arbeitsverhältnisses. Lesen Sie hier alle Informationen darüber, aus welchen Gründen der Arbeitgeber berechtigt ist zu kündigen.", "explain_ru": "Samita будет уволена «aus betriebsbedingten Gründen». Объявление a дословно повторяет это выражение и объясняет, когда увольнение оправдано, — именно это и нужно проверить, чтобы защититься. Объявление g тоже упоминает Kündigung, но лишь как эмоциональную отправную точку для переориентации.", "explain": "Samita va a ser despedida «aus betriebsbedingten Gründen». El anuncio a reproduce literalmente esa expresión y explica cuándo está justificado el despido, que es justo lo que hay que comprobar para defenderse. El anuncio g también menciona la Kündigung, pero solo como punto de partida emocional para reorientarse.", "verified": true}]}, {"id": "t1_b-p12", "label": "Variante 3", "page": 12, "note": "", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Pflegefreistellung für Mütter und Väter.", "text": "Arbeitnehmerinnen und Arbeitnehmer haben das Recht auf Freistellung am Arbeitsplatz, wenn ein im Haushalt lebendes Kind erkrankt und keine Betreuungsmöglichkeit vorhanden ist. Die Freistellung ist pro Arbeitsjahr begrenzt. In der Probezeit sollte man damit vorsichtig sein, da hier andere Kündigungsfristen gelten.", "distractor": "Resuelve el caso del hijo enfermo con días de permiso para cuidarlo en casa («Freistellung»), no con la posibilidad de llevarlo a la oficina. Distractor de la persona 4, cuya respuesta es el anuncio f (Rechte berufstätiger Eltern / Kinder am Arbeitsplatz)."}, {"key": "b", "title": "Tipps für Frauen im Beruf.", "text": "Frauen verkaufen sich oft unter Wert. Es ist besonders wichtig, dass Sie ausreichend über Ihre Rechte im Berufsleben informiert sind. Unsere Expertin für Arbeitsrecht gibt Tipps für Gehaltsverhandlungen und ein selbstbewusstes Auftreten. Außerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen.", "distractor": ""}, {"key": "c", "title": "Damit sich der Aufwand lohnt.", "text": "Stellenangebote online zu schalten, kann für Unternehmen schnell sehr kostspielig werden. Nicht nur die Bekanntheit der Webseite ist dafür entscheidend, sondern auch die regionale Reichweite und der Grad der Spezialisierung.", "distractor": "Se dirige a empresas que quieren publicar ofertas de empleo en Internet (costes, alcance, especialización), no a quien busca trabajo en la red. Distractor de la persona 2."}, {"key": "d", "title": "Der Bundesverband der Tourismusbranche informiert.", "text": "Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig. Auch auf dem Ausbildungsmarkt fehlt es an jungen Menschen, die sich für dieses Arbeitsfeld interessieren. Offene Stellen werden demzufolge zügig besetzt.", "distractor": ""}, {"key": "e", "title": "Informationen rund um den Mutterschutz.", "text": "Frauen dürfen nach dem Mutterschutzgesetz während einer Schwangerschaft und bis zu vier Monate nach der Geburt nicht gekündigt werden. Voraussetzung hierfür ist jedoch, dass der Arbeitgeber zum Zeitpunkt der Kündigung von der Schwangerschaft wusste.", "distractor": "Trata del embarazo, pero desde la protección contra el despido (Mutterschutzgesetz), no de qué hay que contar o no en una entrevista. Es el distractor temático de la persona 1."}, {"key": "f", "title": "Rechte berufstätiger Eltern.", "text": "Eltern haben keinen Rechtsanspruch darauf, ihre Kinder am Arbeitsplatz zu betreuen. Die Entscheidung unterliegt der Zustimmung des Arbeitgebers und viele sind damit einverstanden, wenn sich so vermeiden lässt, dass sich die Eltern krankschreiben lassen. Arbeitsplätze, bei denen die Sicherheit des Kindes gefährdet ist, sind von dieser Regelung ausgeschlossen.", "distractor": ""}, {"key": "g", "title": "Vom Traum zur Realität.", "text": "Als angehender Gründer brauchen Sie nicht nur Branchenkenntnisse, sondern auch Wissen über betriebswirtschaftliche Vorgänge. Vom Businessplan und der richtigen Finanzierung über vernünftige Personalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu.", "distractor": ""}, {"key": "h", "title": "Die richtige Wahl spart Zeit und Frust.", "text": "Die Suche nach einer neuen Stelle ist extrem zeitaufwendig. Im Internet erscheint das Angebot an offenen Stellen riesig, dennoch bleibt der Erfolg oft aus. Eine der wichtigsten Voraussetzungen ist es also, Jobangebote richtig zu filtern, um ohne großen Zeitaufwand die richtige Anzeige zu finden.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Lamia überlegt, ob sie im Vorstellungsgespräch ihre Schwangerschaft erwähnen muss.", "answer": "b", "confidence": "hoch", "quote": "Außerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen.", "explain_ru": "Lamia спрашивает себя, нужно ли упоминать беременность на собеседовании. Объявление b прямо обещает информацию о том, о чём не нужно рассказывать на собеседовании, — как раз её вопрос. Объявление e тоже говорит о беременности, но только о защите от увольнения, а не о собеседовании.", "explain": "Lamia se pregunta si debe mencionar su embarazo en la entrevista. El anuncio b anuncia expresamente información sobre lo que no hay que contar en una entrevista de trabajo, que es justo su duda. El anuncio e también habla del embarazo, pero solo de la protección frente al despido, no de la entrevista.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Raymond möchte im Internet einen Job finden.", "answer": "h", "confidence": "hoch", "quote": "Eine der wichtigsten Voraussetzungen ist es also, Jobangebote richtig zu filtern, um ohne großen Zeitaufwand die richtige Anzeige zu finden.", "explain_ru": "Raymond ищет работу через интернет. Объявление h объясняет, как правильно фильтровать предложения в сети, чтобы не терять время. Объявление c тоже о вакансиях онлайн, но оно предназначено для компаний, которые их публикуют.", "explain": "Raymond busca empleo por Internet. El anuncio h explica cómo filtrar correctamente las ofertas en la red para no perder tiempo. El anuncio c también trata de ofertas de empleo online, pero está pensado para empresas que las publican.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Karl will sich in der Gastronomie selbstständig machen.", "answer": "g", "confidence": "hoch", "quote": "Vom Businessplan und der richtigen Finanzierung über vernünftige Personalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu.", "explain_ru": "Karl хочет открыть своё дело в гостинично-ресторанной сфере. Объявление g адресовано «angehender Gründer» и перечисляет бизнес-план, финансирование и прежде всего получение необходимых разрешений — типичная процедура для заведения общепита.", "explain": "Karl quiere establecerse por su cuenta en la hostelería. El anuncio g se dirige al «angehender Gründer» y enumera plan de negocio, financiación y sobre todo la obtención de las licencias necesarias, trámite típico de un local de restauración.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Sean ist unsicher, ob er seinen kranken Sohn mit ins Büro nehmen darf.", "answer": "f", "confidence": "hoch", "quote": "Eltern haben keinen Rechtsanspruch darauf, ihre Kinder am Arbeitsplatz zu betreuen. Die Entscheidung unterliegt der Zustimmung des Arbeitgebers", "explain_ru": "Sean сомневается, можно ли привести больного ребёнка в офис. Объявление f отвечает именно на это: права приводить детей на рабочее место нет, решает работодатель. Объявление a тоже исходит из больного ребёнка, но предлагает остаться дома, а не брать его с собой.", "explain": "Sean duda si puede llevar a su hijo enfermo a la oficina. El anuncio f responde exactamente a eso: no existe derecho a que los hijos estén en el puesto de trabajo, decide el empleador. El anuncio a también parte de un hijo enfermo, pero ofrece quedarse en casa, no llevarlo consigo.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Ramona interessiert sich für Jobchancen als Reiseverkehrskauffrau.", "answer": "d", "confidence": "hoch", "quote": "Der Bundesverband der Tourismusbranche informiert. Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig.", "explain_ru": "Ramona интересуется профессиональными перспективами «Reiseverkehrskauffrau» — профиля из туристической отрасли. Объявление d — от Bundesverband der Tourismusbranche, и в нём описана ситуация на рынке труда и обучения в этой отрасли с высоким спросом на работников.", "explain": "Ramona se interesa por las salidas profesionales de «Reiseverkehrskauffrau», un perfil del sector turístico. El anuncio d es el del Bundesverband der Tourismusbranche y describe la situación del mercado laboral y de formación en esa rama, con alta demanda de trabajadores.", "verified": true}]}, {"id": "t1_b-p13", "note_ru": "Новая версия (07.2024) варианта с. 12: изменены имена и порядок людей, переписаны объявления a), c), d) и f). Поэтому ответы меняют номер, хотя набор использованных объявлений тот же {b, d, f, g, h}.", "label": "Variante 3 (nueva versión 07.2024)", "page": 13, "note": "Nueva versión (07.2024) de la variante de la p.12: cambian los nombres y el orden de las personas y se han reescrito los anuncios a), c), d) y f). Por eso las respuestas cambian de número, aunque el conjunto de anuncios utilizados es el mismo {b, d, f, g, h}.", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Familienmitglieder betreuen.", "text": "Eltern haben einen Rechtsanspruch darauf, ihre kranken Kinder zu pflegen. Dafür haben sie eine bestimmte Anzahl an Tagen zur Verfügung, an denen sie freinehmen können. Aber generell gilt: kranke Personen müssen zu Hause bleiben.", "distractor": "Da días libres para cuidar en casa a los hijos enfermos y añade que «kranke Personen müssen zu Hause bleiben»: justo lo contrario de llevarlos al puesto de trabajo. Distractor de la persona 3."}, {"key": "b", "title": "Tipps für Frauen im Beruf.", "text": "Frauen verkaufen sich oft unter Wert. Es ist besonders wichtig, dass Sie ausreichend über Ihre Rechte im Berufsleben informiert sind. Unsere Expertin für Arbeitsrecht gibt Tipps für Gehaltsverhandlungen und ein selbstbewusstes Auftreten. Außerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen.", "distractor": ""}, {"key": "c", "title": "Damit sich der Aufwand lohnt.", "text": "Stellenangebote online zu schalten, kann für Unternehmen schnell sehr kostspielig werden. Für den Erfolg muss unbedingt das richtige Stelleportal gewählt werden. Das gilt insbesondere für neu gegründete Unternehmen, die sich mehrfache Anzeigen finanziell nicht leisten können.", "distractor": "Se dirige a empresas que publican ofertas en Internet y, en esta versión, menciona expresamente a las «neu gegründete Unternehmen». Es distractor de la persona 1 (quien busca empleo, no quien lo publica) y, por la mención a las empresas de nueva creación, también se confunde con la persona 2, que quiere fundar un negocio."}, {"key": "d", "title": "Der Bundesverband der Tourismusbranche informiert.", "text": "Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig. Auch auf dem Ausbildungsmarkt fehlt es an jungen Menschen, die sich für dieses Arbeitsfeld interessieren. Demzufolge gibt es aktuell eine Reihe offener Stellen.", "distractor": ""}, {"key": "e", "title": "Informationen rund um den Mutterschutz.", "text": "Frauen dürfen nach dem Mutterschutzgesetz während einer Schwangerschaft und bis zu vier Monate nach der Geburt nicht gekündigt werden. Voraussetzung hierfür ist jedoch, dass der Arbeitgeber zum Zeitpunkt der Kündigung von der Schwangerschaft wusste.", "distractor": "Vuelve a tratar el embarazo desde la prohibición de despido (Mutterschutzgesetz), no desde la entrevista de trabajo. Distractor temático de la persona 5."}, {"key": "f", "title": "Kinder am Arbeitsplatz.", "text": "Häufig stimmen Arbeitgeber der Bitte von Eltern zu, ihre Kinder mit zur Arbeit zu bringen, wenn deren Betreuung kurzfristig ausfällt. Damit können Fehlzeiten vermieden werden. Diese Möglichkeit besteht nicht, wenn die Sicherheit des Kindes am Arbeitsplatz gefährdet ist.", "distractor": ""}, {"key": "g", "title": "Vom Traum zur Realität.", "text": "Als angehender Gründer brauchen Sie nicht nur Branchenkenntnisse, sondern auch Wissen über betriebswirtschaftliche Vorgänge. Vom Businessplan und der richtigen Finanzierung über vernünftige Personalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu.", "distractor": ""}, {"key": "h", "title": "Die richtige Wahl spart Zeit und Frust.", "text": "Der Stellemarkt spielt sich heutzutage fast ausschließlich online ab. Im Internet erscheint das Angebot an offenen Stellen riesig, dennoch bleibt der Erfolg oft aus. Eine der wichtigsten Voraussetzungen ist es also, Jobangebote richtig zu filtern, um ohne großen Zeitaufwand die richtige Anzeige zu finden.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Yuan Javier möchte im Internet einen Job finden", "answer": "h", "confidence": "hoch", "quote": "Der Stellemarkt spielt sich heutzutage fast ausschließlich online ab. Im Internet erscheint das Angebot an offenen Stellen riesig", "explain_ru": "Yuan Javier ищет работу через интернет. Объявление h (в этой версии переписано так, что начинается с «Der Stellemarkt spielt sich … online ab») посвящено как раз поиску работы в сети и правильной фильтрации предложений. Объявление c — для компаний, которые публикуют вакансии.", "explain": "Yuan Javier busca trabajo por Internet. El anuncio h (reescrito en esta versión para empezar con «Der Stellemarkt spielt sich … online ab») trata precisamente de la búsqueda de empleo en la red y de filtrar bien las ofertas. El anuncio c es para empresas que publican las ofertas.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Paul will sich in der Gastronomie selbstständig machen.", "answer": "g", "confidence": "hoch", "quote": "Als angehender Gründer brauchen Sie nicht nur Branchenkenntnisse, sondern auch Wissen über betriebswirtschaftliche Vorgänge. Vom Businessplan und der richtigen Finanzierung über vernünftige Personalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu.", "explain_ru": "Paul хочет открыть своё дело в гостинично-ресторанной сфере. Объявление g консультирует «angehender Gründer» (бизнес-план, финансирование, разрешения) — это процедуры для открытия заведения. Объявление c упоминает новые компании, но только в связи с публикацией вакансий.", "explain": "Paul quiere establecerse en la hostelería. El anuncio g es el que asesora al «angehender Gründer» (plan de negocio, financiación, licencias), trámites propios de abrir un local. El anuncio c menciona empresas de nueva creación, pero solo en relación con anuncios de empleo.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Avio ist unsicher, ob er seinen kranken Sohn mit ins Büro nehmen darf.", "answer": "f", "confidence": "hoch", "quote": "Häufig stimmen Arbeitgeber der Bitte von Eltern zu, ihre Kinder mit zur Arbeit zu bringen, wenn deren Betreuung kurzfristig ausfällt. Damit können Fehlzeiten vermieden werden.", "explain_ru": "Avio сомневается, можно ли привести больного ребёнка в офис. Объявление f теперь называется «Kinder am Arbeitsplatz» и подтверждает, что работодатель обычно соглашается, когда присмотр неожиданно срывается. Объявление a тоже исходит из больных детей, но решает вопрос днями отпуска дома.", "explain": "Avio duda si puede llevar a su hijo enfermo a la oficina. El anuncio f se titula ahora «Kinder am Arbeitsplatz» y confirma que el empleador suele aceptarlo cuando el cuidado falla de forma imprevista. El anuncio a también parte de hijos enfermos, pero resuelve el caso con días de permiso en casa.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Nora interessiert sich für Jobchancen als Reiseverkehrskauffrau.", "answer": "d", "confidence": "hoch", "quote": "Der Bundesverband der Tourismusbranche informiert. Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig. Auch auf dem Ausbildungsmarkt fehlt es an jungen Menschen, die sich für dieses Arbeitsfeld interessieren. Demzufolge gibt es aktuell eine Reihe offener Stellen.", "explain_ru": "Nora ищет возможности как «Reiseverkehrskauffrau» — профессия туристической отрасли. Объявление d от Bundesverband der Tourismusbranche рассказывает об этом рынке; в этой версии последняя фраза переформулирована, чтобы подчеркнуть, что вакансий довольно много («eine Reihe offener Stellen»).", "explain": "Nora busca oportunidades como «Reiseverkehrskauffrau», profesión del sector turístico. El anuncio d, del Bundesverband der Tourismusbranche, informa de ese mercado; en esta versión la última frase se ha reformulado para destacar que hay bastantes vacantes («eine Reihe offener Stellen»).", "verified": true}, {"n": 5, "type": "choice", "prompt": "Anna Maria überlegt, ob sie im Vorstellungsgespräch ihre Schwangerschaft erwähnen muss.", "answer": "b", "confidence": "hoch", "quote": "Außerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen.", "explain_ru": "Anna Maria спрашивает себя, нужно ли упоминать беременность на собеседовании. Объявление b даёт именно эту информацию: о чём не обязательно рассказывать на собеседовании. Объявление e снова оказывается ловушкой, потому что говорит только о Mutterschutz и увольнении.", "explain": "Anna Maria se pregunta si debe mencionar su embarazo en la entrevista. El anuncio b ofrece exactamente esa información: qué no hace falta contar en una entrevista. El anuncio e vuelve a ser el distractor, porque solo trata del Mutterschutz y del despido.", "verified": true}]}, {"id": "t1_c-p14", "label": "Variante 4", "page": 14, "note": "", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Erfolgreich neue Wege gehen.", "text": "Das Buch „Mit Erfolg durchstarten\" von Dr. Vera Baumgart richtet sich vor allem an Akademikerinnen, die erfolgreich ein eigenes Unternehmen aufbauen wollen. Egal ob Sie sich in der Immobilienbranche, im Bauwesen oder im Gesundheitsbereich selbstständig machen, die Autorin hat Antworten auf alle wichtigen Fragen.", "distractor": ""}, {"key": "b", "title": "Ein grüner Arbeitsplatz.", "text": "Die Firma Heller aus Rostock will mit gutem Beispiel vorangehen und behauptet: „Klimafreundliche Energie und Müllvermeidung werden bei uns ganz großgeschrieben\". Aber geht das bei einer Transport- und Logistikfirma überhaupt? Die Antwort ist ein klares „Ja\". Alle Details heute um 19:30 Uhr bei Neo TV.", "distractor": ""}, {"key": "c", "title": "Verändertes Kaufverhalten.", "text": "Neuesten Statistiken zufolge greifen Verbraucher in vielen Ländern der Europäischen Union immer mehr zu regionalen und ökologisch angebauten Lebensmitteln. Auch in deutschen Haushalten wird viel Wert auf gesunde Ernährung gelegt. Die Nachfrage nach Bioprodukten ist in den letzten Jahren stetig angestiegen.", "distractor": "Es ecológico, pero habla del consumo de alimentos (Bioprodukte), no del medio ambiente dentro de una empresa ni de un puesto de trabajo. Es el distractor temático de la persona 3 (Jens, Umweltschutz in Unternehmen)."}, {"key": "d", "title": "Jetzt im Buchhandel.", "text": "In seinem neuen Bestseller beschreibt Georg Könitz auf eindrucksvolle Weise, wie er von seinem ständig schlecht gelaunten Chef und zwei Mitarbeitern in seinem Team schikaniert, ausgegrenzt und lächerlich gemacht wurde - und wie es ihm schließlich gelang, diesen Teufelskreis zu durchbrechen. Von seinen Erfahrungen können alle, die Ähnliches erleben, profitieren.", "distractor": ""}, {"key": "e", "title": "Der richtige Praktikumsplatz.", "text": "Ein Praktikum bietet tolle Möglichkeiten, den Berufsalltag kennenzulernen. Viele Praktikanten sind aber enttäuscht, dass sie nur Hilfsarbeiten verrichten dürfen und dafür schlecht oder gar nicht bezahlt werden. Auf dem Portal dein-praktikum.de findest du jetzt aktuelle Infos und interessante Praktikumsstellen in ganz Deutschland.", "distractor": ""}, {"key": "f", "title": "Eine Erfolgsgeschichte.", "text": "Die Bilanz von Rita Jäger (34): Zwei abgebrochene Lehren und zahllose Hilfsjobs. Dann kam Tochter Samantha und Rita musste Verantwortung übernehmen. Im Interview erzählt sie, wie sie in einem Friseursalon die Chance bekam, ein Praktikum und anschließend eine Ausbildung zu machen. Nun hat sie ihren eigenen Salon eröffnet.", "distractor": "Menciona un «Praktikum» y también un negocio propio (su propio salón), pero es la biografía ya cerrada de Rita Jäger, no una oferta de prácticas ni un libro para montar una empresa. Se confunde con la persona 1 (Laura, prácticas) y con la 5 (Somayeh, negocio propio)."}, {"key": "g", "title": "Immobilienunternehmen expandiert.", "text": "Die Frankfurter Immobilienfirma ImmoInvest expandiert nach Süd- und Osteuropa. In den letzten Jahren hat das Unternehmen hohe Gewinne erwirtschaftet und plant nun, außerhalb Deutschlands mehrere Niederlassungen zu gründen. Über die Erfolgsgeschichte des Unternehmens berichtet der Geschäftsführer Herbert Grünberg in unserem Interview.", "distractor": "Habla de una empresa inmobiliaria (trampa temática para la 5, Somayeh, arquitecta) que se expande por Europa (trampa para la 2, Igor), pero no ofrece nada a ninguna persona: describe la estrategia de la propia empresa."}, {"key": "h", "title": "Neue Broschüre.", "text": "Sie überlegen, Ihren Lebensmittelpunkt in ein anderes Land zu verlegen? Ein Neuanfang ist eine große Chance, aber immer auch eine Herausforderung – besonders für den Partner oder die Partnerin und die Kinder. Unsere neue Broschüre bietet ausführliche Informationen und Hilfestellungen zum Leben und Arbeiten in der EU.", "distractor": ""}], "items": [{"n": 1, "type": "choice", "prompt": "Laura möchte während des Studiums Berufserfahrung sammeln.", "answer": "e", "confidence": "hoch", "quote": "Ein Praktikum bietet tolle Möglichkeiten, den Berufsalltag kennenzulernen.", "explain_ru": "Laura ищет профессиональный опыт во время учёбы. Объявление e предлагает именно это: портал с актуальными «Praktikumsstellen» по всей Германии. Объявление f тоже упоминает «Praktikum», но это уже завершённая личная история, а не предложение.", "explain": "Laura busca experiencia profesional durante sus estudios. El anuncio e ofrece justamente eso: un portal con «Praktikumsstellen» actuales en toda Alemania. El anuncio f también menciona un «Praktikum», pero es una historia personal ya concluida, no una oferta.", "verified": true}, {"n": 2, "type": "choice", "prompt": "Igor hat Familie und möchte im europäischen Ausland arbeiten.", "answer": "h", "confidence": "hoch", "quote": "Sie überlegen, Ihren Lebensmittelpunkt in ein anderes Land zu verlegen? Ein Neuanfang ist eine große Chance, aber immer auch eine Herausforderung – besonders für den Partner oder die Partnerin und die Kinder.", "explain_ru": "У Igor есть семья, и он хочет работать в другой стране Европы. Объявление h адресовано тем, кто переносит центр своей жизни в другую страну, прямо упоминает партнёра и детей и предлагает информацию о «Leben und Arbeiten in der EU». Объявление g тоже называет Европу, но это расширение компании, а не переезд человека.", "explain": "Igor tiene familia y quiere trabajar en el extranjero europeo. El anuncio h se dirige a quien traslada su centro de vida a otro país, menciona expresamente a la pareja y a los hijos y ofrece información sobre «Leben und Arbeiten in der EU». El anuncio g también nombra Europa, pero es la expansión de una empresa, no el traslado de una persona.", "verified": true}, {"n": 3, "type": "choice", "prompt": "Jens interessiert sich für das Thema Umweltschutz in Unternehmen.", "answer": "b", "confidence": "hoch", "quote": "Die Firma Heller aus Rostock will mit gutem Beispiel vorangehen und behauptet: „Klimafreundliche Energie und Müllvermeidung werden bei uns ganz großgeschrieben\".", "explain_ru": "Jens интересуется экологией внутри предприятий. Объявление b представляет конкретную компанию (Heller, транспорт и логистика), которая использует климатически дружелюбную энергию и избегает отходов. Объявление c тоже экологическое, но речь о потреблении продуктов, а не о предприятиях.", "explain": "Jens se interesa por el medio ambiente dentro de las empresas. El anuncio b presenta una empresa concreta (Heller, transporte y logística) que aplica energía respetuosa con el clima y evitación de residuos. El anuncio c también es ecológico, pero trata del consumo de alimentos, no de las empresas.", "verified": true}, {"n": 4, "type": "choice", "prompt": "Jasmin hat Probleme mit ihren Kollegen und braucht Hilfe.", "answer": "d", "confidence": "hoch", "quote": "wie er von seinem ständig schlecht gelaunten Chef und zwei Mitarbeitern in seinem Team schikaniert, ausgegrenzt und lächerlich gemacht wurde - und wie es ihm schließlich gelang, diesen Teufelskreis zu durchbrechen.", "explain_ru": "У Jasmin проблемы с коллегами, и она ищет помощь. Объявление d рассказывает именно о случае травли и исключения со стороны начальника и двух товарищей по команде и предлагает опыт того, кто смог разорвать этот круг. Объявление f тоже личная история, но не о конфликтах с коллегами.", "explain": "Jasmin tiene problemas con sus colegas y busca ayuda. El anuncio d narra exactamente un caso de acoso y exclusión por parte del jefe y de dos compañeros de equipo y ofrece la experiencia de quien logró romper ese círculo. El anuncio f también es una historia personal, pero no trata de conflictos con colegas.", "verified": true}, {"n": 5, "type": "choice", "prompt": "Somayeh ist Architektin und möchte ihr eigenes Architekturbüro eröffnen.", "answer": "a", "confidence": "hoch", "quote": "richtet sich vor allem an Akademikerinnen, die erfolgreich ein eigenes Unternehmen aufbauen wollen. Egal ob Sie sich in der Immobilienbranche, im Bauwesen oder im Gesundheitsbereich selbstständig machen, die Autorin hat Antworten auf alle wichtigen Fragen.", "explain_ru": "Somayeh — архитектор и хочет открыть своё бюро. Объявление a адресовано женщинам с высшим образованием, которые хотят создать своё дело, и прямо называет сферу недвижимости и «Bauwesen» (строительство). Объявление g тоже о недвижимости, но описывает расширение чужой компании, а не открытие своего дела.", "explain": "Somayeh es arquitecta y quiere abrir su propio despacho. El anuncio a se dirige a académicas que quieren crear su propia empresa y nombra expresamente el sector inmobiliario y el «Bauwesen» (construcción). El anuncio g es inmobiliario, pero describe la expansión de una empresa ajena, no cómo fundar la propia.", "verified": true}]}, {"id": "t1_c-p15", "label": "Variante 5", "page": 15, "note": "", "kind": "zuordnung", "intro": "Sie suchen für fünf Personen (1–5) die passende Anzeige (a–h). Drei Anzeigen bleiben übrig.", "passage": "", "options": [{"key": "a", "title": "Hilfe für Betroffene.", "text": "Beleidigungen, Ausgrenzung, versteckte Drohungen - am Arbeitsplatz ist Mobbing leider weit verbreitet. Für viele Angestellte ist der Arbeitsalltag oft mit Angst verbunden. Das führt schnell zu gesundheitlichen und psychischen Problemen. Inzwischen gibt es zahlreiche Coaching-Programme für Mitarbeiter, die Strategien aufzeigen, wie man mit solchen Situationen besser umgehen kann.", "distractor": ""}, {"key": "b", "title": "Ein starkes Team.", "text": "Pünktlich zum Start der Weltmeisterschaft präsentiert der Handballbund seine neue Vertragspartnerin, die deutsche Handwerkskammer. Wie passt das zusammen? „Ganz einfach\", so der Sprecher des Handballbundes. „Was für den Handballer die Weltmeisterschaft ist, ist für den Handwerker die Meisterprüfung.\"", "distractor": "Menciona la «Meisterprüfung», pero solo como metáfora publicitaria en un patrocinio deportivo: no da ninguna información sobre ella. Es el distractor de la persona 5 (Assem)."}, {"key": "c", "title": "Deutsche sind risikoscheu.", "text": "In Deutschland ist die Zahl der Unternehmensgründungen stark rückläufig, obwohl insbesondere viele jüngere Menschen angeben, dass sie sich gerne selbständig machen würden. Warum der Sprung in die Selbstständigkeit oft doch nicht klappt, hat vielerlei Gründe. Während Frauen häufig das finanzielle Risiko scheuen, fürchten Männer den Karriereknick.", "distractor": "Trata de fundar una empresa propia (el riesgo de emprender), no de trabajar como empleado en una empresa joven. Es el distractor de la persona 2 (Jason, der bei einem neu gegründeten Unternehmen arbeiten will)."}, {"key": "d", "title": "Handwerk und Karriere - passt das?", "text": "Fleischer, Klempner, Tischler - laut der Bundesagentur für Arbeit werden bei uns ca. 150.000 Handwerker gesucht. Doch viele Stellen bleiben unbesetzt. Dabei bieten Handwerksberufe gerade jungen Leuten die allerbesten Chancen für eine erfolgreiche Karriere. Fachkräfte brauchen sich um ihre Zukunft nicht zu sorgen.", "distractor": ""}, {"key": "e", "title": "Stressfrei zum Ziel.", "text": "Auch Fortbildungen können für eine Meisterprüfung im Handwerk anerkannt werden. Wenn Sie z. B. als Kfz-Servicetechniker einen Kurs in Elektronik erfolgreich absolviert haben, wird dieser Teil nicht noch einmal gesondert geprüft. Die Interessengemeinschaft „Das Handwerk\" hat die wichtigsten Zulassungsvoraussetzungen zur Meisterprüfung zusammengefasst.", "distractor": ""}, {"key": "f", "title": "Nie wieder Opfer.", "text": "Sie wurde in ihrer Firma gemobbt und konnte es ihrem Chef nicht nachweisen. Aber die Atmosphäre verschlechterte sich zusehends. Die Arbeit wurde jeden Tag mehr zur Qual. Die Autorin Stephanie Hauser verarbeitet in ihrem Roman „Nie wi
